<style>

[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui,"Nunito Sans",system-ui,sans-serif);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}

.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#ffffff1c;color:inherit;border:1px solid #ffffff40;border-radius:9px;padding:7px 12px;font-size:14px;font-weight:700}
.btn:hover{background:#ffffff2e}.btn:disabled{opacity:.4;cursor:default}

#modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:12px}
#modal[hidden]{display:none}
.mbox{background:#fbf6ea;color:#2a2418;border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}

.mbox p,.mbox li{line-height:1.5}
.mbox .btn{background:#ece3cf;color:#2a2418;border-color:#c9b98f}
.mbox .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.mbox .btn.on{background:#2a2418;color:#fff}
.seg{display:inline-flex;border:1px solid #c9b98f;border-radius:9px;overflow:hidden;flex-wrap:wrap}

.prow{display:flex;gap:8px;align-items:center;margin:7px 0;flex-wrap:wrap}
.prow .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);border:2px solid #0004}
.prow input[type=text]{font-family:inherit;font-weight:700;font-size:16px;padding:6px 9px;border-radius:8px;border:1px solid #c9b98f;background:#fff;color:#2a2418;-webkit-text-fill-color:#2a2418;caret-color:var(--accent);width:150px;color-scheme:light}
.prow input[type=text]::placeholder{color:#a3926e;-webkit-text-fill-color:#a3926e;font-weight:600}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:1px solid #c9b98f;background:#f6efdc;border-radius:20px;padding:5px 12px;font-weight:800;color:#2a2418}
.tabs button.on{background:#2a2418;color:#fff}
.toast{position:fixed;left:50%;top:100px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #000a;z-index:70;font-weight:700;animation:toast 2.6s forwards;pointer-events:none;max-width:90vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.bannerx{position:fixed;inset:0;display:grid;place-items:center;z-index:65;pointer-events:none}

.bannerx small{display:block;font-family:var(--ui);font-size:.34em;font-weight:700}
@keyframes ban{0%{transform:scale(2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.92)}}
#cover{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);text-align:center;padding:20px}
#cover[hidden]{display:none}
#cover h2{font-family:var(--title,Georgia,serif);font-size:36px;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
body{background:radial-gradient(ellipse at 50% 0%,#24406e,#0b1426 75%) fixed,#0b1426}
html,body{overscroll-behavior:none}
body{overflow-x:hidden}

.opts h4{margin:12px 0 5px}

.bigchoice button.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}

.top h1 small{display:inline}
@media (max-width:520px){.top h1 small{display:none}.top{padding:8px 10px;gap:8px}.top .btn{padding:6px 9px;font-size:13px}}

.cvwrap{position:relative;line-height:0}
.pad{position:absolute;bottom:10px;width:min(56vw,230px);height:min(56vw,230px);touch-action:none;-webkit-user-select:none;user-select:none;z-index:4}
.pad[hidden]{display:none}
.pad[data-pos="centre"]{left:50%;transform:translateX(-50%)}.pad[data-pos="gauche"]{left:10px}.pad[data-pos="droite"]{right:10px}
.pad svg{width:100%;height:100%;display:block;opacity:.62}
.pad .pbg{fill:#0006;stroke:#fff6;stroke-width:2}
.pad .pw path{fill:#ffffff22;stroke:#ffffff55;stroke-width:1.5}.pad .pw .pa{fill:#fffd;stroke:none}
.pad .pw.on path{fill:#ffffff88}.pad .pw.on .pa{fill:#fff}
.pad .pc{fill:#0005;stroke:#fff5}
.step{display:inline-flex;align-items:center;gap:0;border:1px solid #c9b98f;border-radius:9px;overflow:hidden}
.step button{border:0;background:#f6efdc;color:#2a2418;font-weight:900;font-size:18px;width:40px;height:36px;font-family:inherit;cursor:pointer}
.step b{min-width:46px;text-align:center;font-size:17px;color:#2a2418}

/* plein écran immersif et paysage */
#fsExit{display:none}
body.immersive .top,body.immersive .status{display:none}
body.immersive #fsExit{display:grid;place-items:center;position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:60;width:38px;height:38px;border-radius:50%;border:1px solid #fff6;background:#0008;color:#fff;font-size:18px}
body.immersive .stage{padding-top:max(6px,env(safe-area-inset-top))}
@media (orientation:landscape) and (max-height:540px){
 .top{padding:4px 10px}.top h1{font-size:20px}.status{padding:4px 12px;font-size:14px}
 .stage{flex-direction:row;align-items:flex-start;justify-content:center;gap:10px;padding:6px}
 .board{flex-direction:column;flex-wrap:nowrap;max-width:190px;justify-content:flex-start}
 .pad{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));width:min(48vh,180px);height:min(48vh,180px);transform:none!important}
 .pad[data-pos="centre"],.pad[data-pos="gauche"]{left:max(10px,env(safe-area-inset-left));right:auto}
 .pad[data-pos="droite"]{right:max(10px,env(safe-area-inset-right));left:auto}
 .stage:has(.pad:not([hidden]):not([data-pos="droite"])){padding-left:calc(min(48vh,180px) + 20px)}
 .stage:has(.pad[data-pos="droite"]:not([hidden])){padding-right:calc(min(48vh,180px) + 20px)}
}
.tuto{text-align:center}.tuto-ic{font-size:56px;line-height:1.1;margin:4px 0 6px}.tuto h2{margin:0 0 6px}.tuto p{margin:0 auto;max-width:34ch;line-height:1.45}
.tuto-dots{display:flex;gap:6px;justify-content:center;margin:12px 0 2px}.tuto-dots i{width:8px;height:8px;border-radius:50%;background:#c9b98f}.tuto-dots i.on{background:var(--accent)}
.optrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0}.optrow input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}

.hbody p,.hbody li{line-height:1.5}.hbody ul,.hbody ol{padding-left:22px;margin:6px 0}.hbody li{margin:4px 0}.hbody .ex{background:#efe6d0;border-left:4px solid #c9b98f;border-radius:8px;padding:8px 12px;margin:10px 0}
#cv{background:#fff}
.dbelow{width:min(96vw,820px);display:flex;flex-direction:column;gap:6px}
.dtools{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;background:#ffffff14;border-radius:12px;padding:6px}
.dtools[hidden]{display:none}
.dtools button{border:2px solid #ffffff40;border-radius:9px;background:#ffffff20;color:#fff;height:34px;min-width:34px;font-size:17px;display:grid;place-items:center;padding:0;cursor:pointer}
.dtools .dc{background:var(--c);width:30px;min-width:30px;height:30px;border-radius:50%}
.dtools .on{outline:3px solid #ffe066;outline-offset:1px}
.dtools .dw i{display:block;border-radius:50%;background:#fff}
.dtools .dsep{width:8px}
.dchat{display:flex;flex-direction:column;gap:6px}
.dlog{background:#0006;border-radius:12px;padding:6px 10px;height:120px;overflow-y:auto;font-size:14px;line-height:1.35}
.dlog p{margin:2px 0;word-break:break-word}
.dlog .sys{color:#aac;font-style:italic}.dlog .ok{color:#7be07b;font-weight:800}.dlog .close{color:#ffd166;font-weight:800}.dlog .f{opacity:.75}
#dform{display:flex;gap:6px}#dform[hidden]{display:none}
#din{flex:1;min-width:0;border-radius:10px;border:1px solid #ffffff40;background:#fff;color:#111;font:700 16px var(--ui);padding:10px 12px}
.ddw{display:flex;flex-direction:column;gap:8px;margin-top:10px}.ddw .btn{font-size:20px;padding:12px}
@media (orientation:landscape) and (max-height:540px){.dbelow{width:260px}.dlog{height:150px}}

/* ===== Dessine et devine : l'un dessine, les autres devinent ===== */
(function(){
const VW=800, VH=600, PAL=['#1d1d22','#ffffff','#e8433a','#ff9a3c','#ffd23f','#3fb85a','#3a7bd5','#9b59b6','#8a5a2e','#ff7ac8','#9aa0a6'], WID=[5,12,26];
const OPT=Object.assign({bots:3,level:'normal',rounds:2,time:80},load('dessine-opt')||{});
let G=null, L=null; const snap=ARC.snap();
const cv=ARC.canvas($('#cv'),VW,VH,()=>$('#board').offsetHeight+$('#dbelow').offsetHeight+16);
const host=()=>!ARC.guest();
const emit=e=>ARC.emit(G,e);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[^a-z0-9]+/g,' ').trim();
const hide=w=>btoa(unescape(encodeURIComponent(w))).split('').reverse().join(''), show=h=>{ try{ return decodeURIComponent(escape(atob(String(h||'').split('').reverse().join('')))); }catch(e){ return ''; } };
function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
/* ---------- partie (hôte) ---------- */
function newGame(list){ const o=Object.assign({},OPT);
  G={gid:Math.random().toString(36).slice(2,8),players:ARC.recolor(list.map((x,i)=>({name:x.name,cid:x.cid||null,ai:!!x.ai,level:x.level||o.level}))),sc:list.map(()=>0),
    rounds:o.rounds,time:o.time,turn:-1,round:1,dr:0,phase:'choose',ch:[],w:'',mask:'',left:0,found:[],gain:list.map(()=>0),chat:[],cn:0,sk:[],skv:0,last:null,ev:[],evn:0};
  L={used:new Set(),dl:0,hints:0,bot:null,botG:{},dirty:true}; if(window.PROF) PROF.played('dessine',ARC.net()); nextTurn(); snap.reset(G); }
function say(m){ const S=G; S.cn++; S.chat.push(Object.assign({i:S.cn},m)); if(S.chat.length>40) S.chat.splice(0,S.chat.length-40); L.dirty=true; }
function pick3(onlySketch){ const pool=(onlySketch?Object.keys(DD_SK):DD_LISTE).filter(w=>!L.used.has(w)); const src=pool.length>=3?pool:(onlySketch?Object.keys(DD_SK):DD_LISTE); const o=[];
  while(o.length<3){ const w=src[Math.floor(Math.random()*src.length)]; if(!o.includes(w)) o.push(w); } return o; }
function nextTurn(){ const S=G, n=S.players.length; S.turn++; S.round=Math.floor(S.turn/n)+1;
  if(S.round>S.rounds){ S.phase='over'; emit({t:'over'}); L.dirty=true; return; }
  S.dr=S.turn%n; const bot=ARC.bot(S.players[S.dr]); S.ch=pick3(bot).map(hide); S.phase='choose'; S.w=''; S.mask=''; S.found=[]; S.gain=S.players.map(()=>0); S.sk=[]; S.skv++;
  L.dl=performance.now()+15000; L.bot=null; L.botG={}; L.hints=0; say({k:'sys',m:`${S.players[S.dr].name} va dessiner.`}); emit({t:'turn',s:S.dr}); L.dirty=true; }
function choose(k){ const S=G; if(S.phase!=='choose') return; const w=show(S.ch[k]||S.ch[0]); L.used.add(w); S.w=hide(w); S.ch=[]; S.mask=w.replace(/[a-zœæàâäéèêëîïôöùûüç]/gi,'_'); S.phase='draw'; L.dl=performance.now()+S.time*1000; L.t0=performance.now(); L.hints=0; emit({t:'draw',s:S.dr}); L.dirty=true;
  if(ARC.bot(S.players[S.dr])) startBotDraw(w); }
function reveal(){ const S=G; const w=show(S.w); const lt=w.split('').map((c,i)=>S.mask[i]==='_'?i:-1).filter(i=>i>=0); if(lt.length<=1) return; const i=lt[Math.floor(Math.random()*lt.length)]; S.mask=S.mask.slice(0,i)+w[i]+S.mask.slice(i+1); L.dirty=true; }
function guess(s,txt){ const S=G; txt=String(txt||'').slice(0,40).trim(); if(!txt) return; const P=S.players[s]; if(!P) return;
  if(S.phase!=='draw'||s===S.dr||S.found.includes(s)){ say({s,m:txt,k:'g',v:S.phase==='draw'&&(s===S.dr||S.found.includes(s))?'f':''}); return; }
  const w=norm(show(S.w)), g=norm(txt);
  if(g===w){ const rem=Math.max(0,(L.dl-performance.now())/(S.time*1000)); const pts=Math.round(100+220*rem)+(S.found.length===0?50:0); S.found.push(s); S.sc[s]+=pts; S.gain[s]=pts;
    const dp=Math.max(15,Math.round(pts*.35)); S.sc[S.dr]+=dp; S.gain[S.dr]+=dp; say({k:'ok',s,m:`${P.name} a trouvé ! (+${pts})`}); emit({t:'found',s});
    const others=S.players.map((_,i)=>i).filter(i=>i!==S.dr&&!(ARC.net()&&S.players[i].cid&&!ARC.bot(S.players[i])&&!NET.peers[S.players[i].cid]&&S.players[i].cid!==NET.cid));
    if(others.every(i=>S.found.includes(i))) endTurn(); return; }
  if(w.length>=4&&lev(g,w)===1){ say({s,m:txt,k:'g'}); say({k:'close',to:s,m:`« ${txt} » : tu chauffes !`}); return; }
  say({s,m:txt,k:'g'}); }
function endTurn(){ const S=G; if(S.phase!=='draw'&&S.phase!=='choose') return; const w=S.w?show(S.w):'';
  S.last={w,dr:S.dr,gain:S.gain.slice(),found:S.found.slice()}; S.phase='reveal'; L.dl=performance.now()+5000; L.bot=null; say({k:'sys',m:w?`Le mot était « ${w} ».`:'Tour passé.'}); emit({t:'reveal'}); L.dirty=true; }
function hostStep(now){ const S=G; if(S.phase==='over') return; S.left=Math.max(0,Math.round(L.dl-now));
  if(S.phase==='choose'){ if(ARC.bot(S.players[S.dr])&&now>L.dl-13500) choose(Math.floor(Math.random()*3)); else if(now>=L.dl) choose(Math.floor(Math.random()*3)); return; }
  if(S.phase==='reveal'){ if(now>=L.dl) nextTurn(); return; }
  if(S.phase==='draw'){ const el=(now-L.t0)/(S.time*1000); const w=show(S.w); const want=w.length>=8?(el>.75?3:el>.5?2:el>.33?1:0):(el>.75?2:el>.5?1:0);
    while(L.hints<want){ L.hints++; reveal(); }
    botDrawStep(now); botGuess(now,el); if(now>=L.dl) endTurn(); } }
/* ---------- l'ordinateur dessine ---------- */
function startBotDraw(w){ const sk=DD_SK[w]; if(!sk){ L.bot=null; return; } L.bot={strokes:sk.map(([c,wd,p])=>({c,w:Math.min(2,Math.round(wd/7)),p})),k:0,j:0,next:performance.now()+1500,sid:'b'+Math.random().toString(36).slice(2,6)}; }
function botDrawStep(now){ const B=L.bot; if(!B||now<B.next) return; const st=B.strokes[B.k]; if(!st){ L.bot=null; return; }
  const n=st.p.length/2; const take=Math.min(n-B.j,7); const from=Math.max(0,B.j-1); const pts=st.p.slice(from*2,(B.j+take)*2);
  addChunk(B.sid+B.k,st.c,st.w,pts,0); B.j+=take; if(B.j>=n){ B.k++; B.j=0; B.next=now+450+Math.random()*350; } else B.next=now+110; }
/* ---------- l'ordinateur devine ---------- */
function botGuess(now,el){ const S=G; S.players.forEach((P,i)=>{ if(!ARC.bot(P)||i===S.dr||S.found.includes(i)) return; const B=L.botG[i]||(L.botG[i]={next:now+3000+Math.random()*4000,miss:Math.random()<{facile:.35,normal:.18,difficile:.06}[P.level||'normal']});
    if(now<B.next) return; B.next=now+3500+Math.random()*6000;
    const drawn=Math.min(1,S.sk.length/24); const p=B.miss?0:({facile:.07,normal:.13,difficile:.22}[P.level||'normal'])*(.4+drawn+el*1.2);
    if(Math.random()<p){ guess(i,show(S.w)); return; }
    if(Math.random()<.55){ const w=DD_LISTE[Math.floor(Math.random()*DD_LISTE.length)]; if(norm(w)!==norm(show(S.w))) guess(i,w); } }); }
/* ---------- traits ---------- */
function addChunk(sid,c,w,pts,q){ const S=G; if(S.phase!=='draw'||pts.length<2) return; S.sk.push({i:S.sk.length,s:sid,q,c:Math.max(0,Math.min(PAL.length-1,c|0)),w:Math.max(0,Math.min(2,w|0)),p:pts.slice(0,90).map(v=>Math.max(-20,Math.min(820,v|0)))}); if(S.sk.length>2500) S.sk.shift(); L.dirty=true; }
function undo(){ const S=G; if(!S.sk.length) return; const sid=S.sk[S.sk.length-1].s; S.sk=S.sk.filter(c=>c.s!==sid).map((c,i)=>Object.assign(c,{i})); S.skv++; L.dirty=true; }
function clearAll(){ const S=G; S.sk=[]; S.skv++; L.dirty=true; }
/* ---------- mon dessin ---------- */
const ME={c:0,w:1,draw:null,sid:null,q:0,pend:[],last:0};
const isDrawer=()=>{ const S=host()?G:snap.cur; return !!(S&&S.phase==='draw'&&ARC.seat()===S.dr); };
const pos=e=>{ const r=$('#cv').getBoundingClientRect(); return [Math.round((e.clientX-r.left)/r.width*VW),Math.round((e.clientY-r.top)/r.height*VH)]; };
$('#cv').addEventListener('pointerdown',e=>{ if(!isDrawer()||ARC.blocked()) return; e.preventDefault(); try{ $('#cv').setPointerCapture(e.pointerId); }catch(x){} ME.sid=Math.random().toString(36).slice(2,7); ME.draw={pts:pos(e),pid:e.pointerId}; ME.draw.pts.push(...ME.draw.pts); flushMine(true); });
$('#cv').addEventListener('pointermove',e=>{ if(!ME.draw||e.pointerId!==ME.draw.pid) return; const [x,y]=pos(e); const p=ME.draw.pts; const lx=p[p.length-2], ly=p[p.length-1]; if(Math.hypot(x-lx,y-ly)<3) return; p.push(x,y); if(p.length>=40) flushMine(); });
const upP=()=>{ if(!ME.draw) return; flushMine(true); ME.draw=null; }; $('#cv').addEventListener('pointerup',upP); $('#cv').addEventListener('pointercancel',upP);
$('#cv').addEventListener('touchmove',e=>{ if(isDrawer()) e.preventDefault(); },{passive:false});
function flushMine(force){ const D=ME.draw; if(!D||D.pts.length<4) return; const now=performance.now(); if(!force&&now-ME.last<70) return; ME.last=now; const pts=D.pts.slice(); D.pts=pts.slice(-2);
  ME.q++; if(host()) addChunk(ME.sid,ME.c,ME.w,pts,ME.q); else { ME.pend.push({s:ME.sid,q:ME.q,c:ME.c,w:ME.w,p:pts}); ARC.send('k',[ME.sid,ME.q,ME.c,ME.w].concat(pts),0); } }
setInterval(()=>{ if(ME.draw) flushMine(); },80);
/* outils */
function tools(){ const t=$('#dtools'); t.innerHTML=PAL.map((c,i)=>`<button class="dc${i===ME.c?' on':''}" data-c="${i}" style="--c:${c}" aria-label="Couleur ${i+1}"></button>`).join('')+'<span class="dsep"></span>'+WID.map((w,i)=>`<button class="dw${i===ME.w?' on':''}" data-w="${i}" aria-label="Épaisseur ${i+1}"><i style="width:${6+i*6}px;height:${6+i*6}px"></i></button>`).join('')+
  `<button class="dt${ME.c===1?' on':''}" data-t="gomme" title="Gomme">🧽</button><button class="dt" data-t="undo" title="Annuler">↶</button><button class="dt" data-t="clear" title="Tout effacer">🗑️</button>`; }
$('#dtools').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.c!=null) ME.c=+b.dataset.c; else if(b.dataset.w!=null) ME.w=+b.dataset.w;
  else if(b.dataset.t==='gomme'){ ME.c=1; ME.w=2; } else if(b.dataset.t==='undo'){ if(host()) undo(); else ARC.send('u',[],0); } else if(b.dataset.t==='clear'){ if(host()) clearAll(); else ARC.send('x',[],0); } tools(); });

  if(host()) guess(me,v); else ARC.send('g',[v.slice(0,40)],0); });

const off=document.createElement('canvas'); off.width=VW; off.height=VH; const octx=off.getContext('2d');
let RN={gid:null,v:-1,n:0}, SK=[];
function line(ctx,c){ const p=c.p; ctx.strokeStyle=PAL[c.c]; ctx.lineWidth=WID[c.w]; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(p[0],p[1]); for(let k=2;k<p.length;k+=2) ctx.lineTo(p[k],p[k+1]); if(p.length===2||(p.length===4&&p[0]===p[2]&&p[1]===p[3])) ctx.lineTo(p[0]+.1,p[1]); ctx.stroke(); }
function render(S){ const v=`${S.gid}:${S.turn}:${S.skv}`; if(RN.v!==v||SK.length<RN.n){ octx.fillStyle='#fff'; octx.fillRect(0,0,VW,VH); RN={v,n:0}; }
  while(RN.n<SK.length&&SK[RN.n]){ line(octx,SK[RN.n]); RN.n++; } }
function draw(now){ const ctx=cv.begin(), S=host()?G:snap.cur;
  if(host()&&G) SK=G.sk;
  if(!S){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,VW,VH); ARC.text(ctx,'Dessine et devine',VW/2,230,58,'#3a7bd5','#fff'); ARC.text(ctx,'Choisis un mode de jeu',VW/2,300,26,'#555'); const sk=DD_SK['soleil']; sk.forEach(([c,w,p])=>line(ctx,{c,w:Math.min(2,Math.round(w/7)),p:p.map((v,k)=>k%2?v*.4+340:v*.4+240)})); return; }
  render(S); ctx.drawImage(off,0,0,VW,VH);
  if(isDrawer()){ ME.pend=ME.pend.filter(c=>!SK.some(k=>k&&k.s===c.s&&k.q===c.q)); ME.pend.forEach(c=>line(ctx,c)); if(ME.draw&&ME.draw.pts.length>=4) line(ctx,{c:ME.c,w:ME.w,p:ME.draw.pts}); } else ME.pend=[];
  const me=ARC.seat(), w=S.w?show(S.w):''; const left=host()?S.left:Math.max(0,S.left-(now-snap.t));
  /* bandeau du haut : mot (ou indice) et temps */
  ctx.fillStyle='#000a'; ctx.fillRect(0,0,VW,64);
  if(S.phase==='draw'){ const txt=me===S.dr||S.found.includes(me)?w:S.mask.split('').join(' '); ARC.text(ctx,txt,VW/2,33,me===S.dr?40:38,me===S.dr||S.found.includes(me)?'#ffe066':'#fff'); ARC.text(ctx,`⏱ ${Math.ceil(left/1000)}`,VW-16,33,32,left<10000?'#ff7a6a':'#fff',null,'right');
    if(me!==S.dr) ARC.text(ctx,`${w.replace(/[^a-zA-ZÀ-ÿœæ]/g,'').length} lettres`,16,33,24,'#ccc',null,'left'); }
  else if(S.phase==='choose') ARC.text(ctx,me===S.dr?'Choisis ton mot…':`${S.players[S.dr].name} choisit un mot…`,VW/2,33,32,'#fff');
  else if(S.phase==='reveal'&&S.last) ARC.text(ctx,`C’était : ${S.last.w}`,VW/2,33,34,'#ffe066');
  
  if(S.phase==='reveal'&&S.last){ ctx.fillStyle='#000c'; ARC.rrect(ctx,VW/2-230,170,460,280,20); ctx.fill(); ARC.text(ctx,S.last.w,VW/2,215,40,'#ffe066');
    const rows=S.players.map((p,i)=>[p.name,S.last.gain[i],i===S.last.dr]).sort((a,b)=>b[1]-a[1]).slice(0,6); rows.forEach(([n,g,d],k)=>ARC.text(ctx,`${n}${d?' ✏️':''}  +${g}`,VW/2,268+k*30,21,g?'#9be59b':'#ccc')); }
  if(S.phase==='draw'&&me===S.dr&&!SK.length&&!ME.pend.length&&!ME.draw) ARC.text(ctx,'À toi de dessiner !',VW/2,VH/2,34,'#bbb'); }
let chatSeen=-1;
function hud(){ const S=host()?G:snap.cur; window.ARC_PLAYING=!!(S&&S.phase==='draw'); const me=ARC.seat();
  const drawer=isDrawer(); $('#dtools').hidden=!drawer; $('#dform').hidden=!S||drawer||S.phase==='over'; document.body.classList.toggle('dd-drawer',drawer);
  if(!S){ ARC.status('Dessine et devine','Choisis un mode : en ligne ou avec l’ordinateur.','#3a7bd5'); $('#board').innerHTML=''; $('#dlog').innerHTML=''; return; }
  const P=me!=null?S.players[me]:null;
  ARC.status(P?esc(P.name):'Spectateur',S.phase==='over'?'Partie terminée':S.phase==='choose'?(me===S.dr?'choisis un mot':'attends le mot'):S.phase==='reveal'?'fin du tour':drawer?'dessine le mot !':S.found.includes(me)?'trouvé ! les autres cherchent encore':'devine le mot !',P?P.col:'#3a7bd5',`Tour ${Math.min(S.round,S.rounds)}/${S.rounds}`);
  ARC.board($('#board'),S.players.map((p,i)=>({name:p.name,col:p.col,me:i===me,score:S.sc[i],tag:i===S.dr&&S.phase!=='over'?'✏️':S.found.includes(i)?'✅':''})));
  const last=S.chat.length?S.chat[S.chat.length-1].i:0; if(last!==chatSeen){ chatSeen=last; const canSee=m=>m.to==null||m.to===me; const priv=m=>m.v==='f'&&!(me===S.dr||S.found.includes(me));
    $('#dlog').innerHTML=S.chat.filter(m=>canSee(m)&&!priv(m)).slice(-30).map(m=>m.k==='sys'?`<p class="sys">${esc(m.m)}</p>`:m.k==='ok'?`<p class="ok">${esc(m.m)}</p>`:m.k==='close'?`<p class="close">${esc(m.m)}</p>`:`<p${m.v==='f'?' class="f"':''}><b style="color:${S.players[m.s]?S.players[m.s].col:'#888'}">${esc(S.players[m.s]?S.players[m.s].name:'?')}</b> ${esc(m.m)}</p>`).join('');
    $('#dlog').scrollTop=1e6; }
  if(S.phase==='choose'&&me===S.dr&&S.ch.length&&!document.querySelector('#mbox .ddch')&&$('#modal').hidden){ openModal(`<div class="ddch"><h2>À toi de dessiner !</h2><p>Choisis le mot que tu vas faire deviner :</p><div class="ddw">${S.ch.map((h,k)=>`<button class="btn pri" data-k="${k}">${esc(show(h))}</button>`).join('')}</div></div>`,e=>{ const b=e.target.closest('[data-k]'); if(!b) return; closeModal(); if(host()) choose(+b.dataset.k); else ARC.send('c',[+b.dataset.k],0); }); window.MODAL_CLOSABLE=false; }
  if(S.phase!=='choose'&&document.querySelector('#mbox .ddch')){ window.MODAL_CLOSABLE=true; closeModal(); } }
function onEvent(e){ const me=ARC.seat(), S=host()?G:snap.cur; if(!S) return;
  if(e.t==='turn'){ if(e.s===me) sfx('ding'); } else if(e.t==='draw') sfx('go'); else if(e.t==='found'){ sfx(e.s===me?'win':'point'); if(e.s===me) banner('Trouvé !',null,'#3fb85a'); }
  else if(e.t==='reveal') sfx('pop'); else if(e.t==='over') setTimeout(showEnd,400); }
function showEnd(){ const S=host()?G:snap.cur; if(!S||S.phase!=='over') return; const me=ARC.seat(); window.MODAL_CLOSABLE=true;
  const r=S.players.map((p,i)=>({name:p.name,col:p.col,me:i===me,sc:S.sc[i]})).sort((a,b)=>b.sc-a.sc); const won=r[0].me;
  if(won){ sfx('win'); confetti([r[0].col,'#fff','#ffe066']); } if(me!=null&&window.PROF) PROF.result('dessine',{win:won,score:S.sc[me]});
  ARC.endBox(`${r[0].name} gagne !`,r.map(x=>Object.assign(x,{score:`${x.sc} pts`})),()=>startLocal(),null); }
/* ---------- boucle ---------- */
ARC.loop((dt,now)=>{ const S=host()?G:snap.cur; ARC.idle=!S||S.phase==='over';
  if(G&&host()){ hostStep(now); if(ARC.net()){ if(G.phase==='over'){ if(draw.over!==G.gid){ draw.over=G.gid; ARC.push(G,0,true); } } else if(L.dirty){ if(ARC.push(G,90)) L.dirty=false; } else ARC.push(G,1000); } }
  if(S) ARC.events(S,onEvent); draw(now); hud(); });
/* ---------- menu, options ---------- */
const BOTS=['Ada','Hal','Pixel','Nova','Atlas'];
function startLocal(){ const me=(typeof HALL!=='undefined'&&HALL.pseudo)||'Toi'; const list=[{name:me}]; for(let i=0;i<Math.max(1,OPT.bots);i++) list.push({ai:true,name:BOTS[i],level:OPT.level}); newGame(list); }
function optsHTML(local){ const sg=(k,vals)=>`<div class="seg">${vals.map(([v,l])=>`<button class="${String(OPT[k])===String(v)?'on':''}" data-o="${k}:${v}">${l}</button>`).join('')}</div>`;
  return `<h4>Tours</h4>${sg('rounds',[[1,'1'],[2,'2'],[3,'3']])}<p class="optnote">À chaque tour, chacun dessine une fois.</p><h4>Temps pour dessiner</h4>${sg('time',[[60,'60 s'],[80,'80 s'],[100,'100 s']])}
   ${local?`<h4>Joueurs de l’ordinateur</h4>${sg('bots',[[1,'1'],[2,'2'],[3,'3'],[4,'4']])}${sg('level',[['facile','facile'],['normal','normal'],['difficile','difficile']])}`:''}`; }
function setOpt(b){ const [k,v]=b.dataset.o.split(':'); OPT[k]=/^\d+$/.test(v)?+v:v; store('dessine-opt',OPT); }
function menu(){ const draw=()=>{ openModal(`<h2>Dessine et devine</h2><p>Chacun son tour, un joueur dessine un mot secret et les autres le devinent en tapant leurs propositions. Plus tu trouves vite, plus tu marques.</p>
   <div class="bigchoice"><button class="pri" data-m="online"><b>Jouer en ligne</b><small>Avec tes amis connectés, chacun sur son écran (2 à 8).</small></button><button data-m="solo"><b>Avec l’ordinateur</b><small>Il dessine et devine avec toi, pour s’entraîner.</small></button></div>
   <div class="opts">${optsHTML(true)}<h4>Réglages</h4>${window.PROF?PROF.optsHTML():''}</div><div class="acts">${G?'<button class="btn" data-c="close">Fermer</button>':''}</div>`,e=>{ const o=e.target.closest('[data-o]'); if(o){ setOpt(o); draw(); return; }
   const m=e.target.closest('[data-m]'); if(!m) return; closeModal(); if(m.dataset.m==='online') NET.startUI(); else startLocal(); }); if(window.PROF) PROF.bindOpts($('#mbox')); };
  ARC.tuto('dessine',[['✏️','Dessine','Quand c’est ton tour, choisis un mot parmi trois et dessine-le avec ton doigt ou la souris. Pas de lettres ni de chiffres !'],['💬','Devine','Quand un autre dessine, tape tes propositions en bas. « Tu chauffes » veut dire qu’il manque une lettre.'],['🏆','Points','Plus tu trouves vite, plus tu gagnes de points. Celui qui dessine marque aussi quand on trouve son mot.']],draw); }
function help(){ helpTabs('Dessine et devine',[['Règles','<ul><li>À chaque tour, chaque joueur dessine une fois. Le dessinateur choisit un mot parmi trois.</li><li>Les autres tapent leurs propositions. Le premier à trouver gagne un bonus.</li><li>Points : de 100 à 320 selon le temps restant (+50 pour le premier). Le dessinateur gagne une part des points de chaque joueur qui trouve.</li><li>Des lettres du mot apparaissent au fil du temps pour aider.</li><li>Le tour s’arrête quand tout le monde a trouvé ou que le temps est écoulé.</li></ul><p class="ex">Interdit d’écrire le mot ou des lettres sur le dessin !</p>'],
  ['Outils','<ul><li>Couleurs, trois épaisseurs de trait et une gomme.</li><li>↶ annule le dernier trait, 🗑️ efface tout.</li></ul>'],
  ['Contre l’ordinateur','<p>L’ordinateur dessine une trentaine de mots simples et propose des réponses quand tu dessines. Pour une vraie partie, joue en ligne avec tes amis.</p>']]); }
window.GAME={help,menu,state:()=>G};
document.addEventListener('sdj-opts',e=>{ if(e.detail.k==='cb'&&G) ARC.recolor(G.players); });
const base=ARC.wirer({stat:['players'],skip:['sk']}); let wv=null, wn=0;
window.NETGAME={id:'dessine',title:'Dessine et devine',min:2,max:8,
  rules:()=>`<div class="opts">${optsHTML(false)}</div>`, rulesClick(e){ const b=e.target.closest('[data-o]'); if(!b) return false; setOpt(b); return true; },
  start(list){ closeModal(); newGame(list); NET.push(null,'new'); }, state:()=>G, busy:()=>false, resume(){},
  /* les traits partent par petits morceaux, et en entier de temps en temps pour rattraper un message perdu */
  wire(S){ if(!S) return S; const o=base(S); const v=`${S.gid}:${S.turn}:${S.skv}`; wn++; const full=v!==wv||wn%10===0; wv=v; o.skf=full?1:0; o.sk=full?S.sk:S.sk.slice(-12); return o; },
  adopt(){ if(!G) return; const now=performance.now(); L={used:new Set(),dl:now+(G.left||8000),t0:now-(G.time*1000-(G.left||0)),hints:9,bot:null,botG:{},dirty:true}; G.sk=SK.slice(); },
  demoted(){ snap.reset(G); },
  act(seat,fn,args){ if(!G||!L) return false; const S=G;
    if(fn==='g'){ guess(seat,args[0]); return true; }
    if(fn==='c'){ if(S.phase==='choose'&&seat===S.dr) choose(+args[0]||0); return true; }
    if(seat!==S.dr) return true;
    if(fn==='k'){ const [sid,q,c,w,...pts]=args; addChunk(String(sid),+c,+w,pts.map(Number),+q); return true; }
    if(fn==='u'){ undo(); return true; } if(fn==='x'){ clearAll(); return true; } return false; },
  async receive(m){ if(m.kind==='lobby'){ G=null; snap.reset(null); SK=[]; return; } const S=m.G; if(!S||!ARC.fill(S,['players'])) return; ARC.recolor(S.players);
    const v=`${S.gid}:${S.turn}:${S.skv}`;
    if(S.skf){ SK=S.sk.slice(); SK.v=v; } else if(SK.v===v){ for(const c of S.sk) SK[c.i]=c; } S.sk=SK;
    if(!snap.cur||snap.cur.gid!==S.gid||m.kind==='new'){ closeModal(); snap.reset(S); } else snap.push(S); G=S; },
  leave(){ G=null; L=null; snap.reset(null); SK=[]; window.MODAL_CLOSABLE=true; menu(); } };
const skip=/[?&](salle|creer)=/.test(location.search)||(()=>{ const s=load('net-sess'); return s&&s.game==='dessine'&&!s.host; })(); setTimeout(()=>{ if(!G&&!NET.on&&!skip) menu(); },60);
})();
