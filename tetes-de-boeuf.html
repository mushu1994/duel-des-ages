<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Têtes de Bœuf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Têtes de Bœuf : pose tes cartes dans les rangées sans ramasser la sixième. 2 à 10 joueurs, contre l'IA ou entre amis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Karla:wght@400;500;700;800&display=swap">
<style>
/* Grange : bois sombre, paille et rouge grange ; 4 rangées au centre, main du joueur en bas */
:root{
  --barn:#24120c; --barn2:#331a11; --panel:#3b2016; --panel2:#4a2a1c; --line:#6a3c28;
  --ink:#fbf1e1; --mute:#d2b79c; --straw:#f1c75b; --straw-d:#b48a26; --red:#c8402e;
  --card:#fbf3e2; --card-ink:#2b1a10;
  --h1:#cfc6ef; --h2:#9fd3f0; --h3:#f6b04e; --h5:#ef5c47; --h7:#8a3fb0;
  --display:'Alfa Slab One',Georgia,serif;
  --body:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--barn);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 120px),linear-gradient(180deg,#2c160e,#1c0e09);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#1c0e09}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,[data-a]:focus-visible{outline:2px solid var(--straw);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(28,14,9,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.home{font-size:13px;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.home:hover{color:var(--ink);border-color:var(--straw)}
.logo{font-family:var(--display);font-size:22px;color:var(--straw);letter-spacing:.01em}
.spacer{flex:1}
.hbtn{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:14px}
.hbtn:hover{border-color:var(--straw)}
.short{display:none}@media (max-width:560px){.long{display:none}.short{display:inline}}
.turnbar{background:var(--straw);color:#2b1a10}
.turnbar .wrap{display:flex;align-items:center;gap:10px;padding-block:7px;flex-wrap:wrap;font-weight:800}
.turnbar .who{font-family:var(--display);font-size:19px;font-weight:400}
.turnbar .hint{font-weight:600;opacity:.85}
.game{display:flex;flex-direction:column;gap:14px;padding-block:14px 40px}
.players{display:flex;flex-wrap:wrap;gap:8px}
.pchip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.pchip b{font-weight:800}
.pchip .hd{display:inline-flex;align-items:center;gap:3px;font-weight:800;color:var(--straw)}
.pchip .hd svg{width:16px;height:16px}
.pchip.me{border-color:var(--straw)}
.pchip.ready{box-shadow:0 0 0 2px var(--straw) inset}
.pchip small{color:var(--mute);font-size:12px}
.pchip .played{--cw:30px}
.rows{background:radial-gradient(ellipse at 50% 30%,rgba(241,199,91,.08),transparent 70%),var(--barn2);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:6px;--cw:clamp(42px,10.5vw,70px)}
.row .rlab{width:46px;flex:none;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mute);font-weight:700;gap:1px}
.row .rlab b{font-family:var(--display);font-weight:400;color:var(--straw);font-size:18px;display:flex;align-items:center;gap:2px}
.row .rlab b svg{width:14px;height:14px}
.row.pick{cursor:pointer;border-radius:12px;outline:3px solid var(--straw);outline-offset:3px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{outline-color:rgba(241,199,91,.3)}}
.slots{display:flex;gap:5px;flex-wrap:nowrap;min-width:0}
.slot{width:var(--cw);height:calc(var(--cw)*1.38);border-radius:calc(var(--cw)*.12);border:2px dashed rgba(255,255,255,.12);flex:none}
.slot.danger{border-color:rgba(200,64,46,.7);background:repeating-linear-gradient(45deg,rgba(200,64,46,.18) 0 6px,transparent 6px 12px)}
.bcard{width:var(--cw);height:calc(var(--cw)*1.38);border-radius:calc(var(--cw)*.12);background:var(--card);color:var(--card-ink);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--cw)*.07) 2px;box-shadow:0 3px 8px rgba(0,0,0,.45);border:2px solid var(--hc);position:relative;flex:none;overflow:hidden}
.bcard .num{font-family:var(--display);font-size:calc(var(--cw)*.42);line-height:1;color:var(--hc2,var(--card-ink))}
.bcard .heads{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;max-width:90%}
.bcard .heads svg{width:calc(var(--cw)*.18);height:calc(var(--cw)*.18);color:var(--hc)}
.bcard .band{position:absolute;inset:0 0 auto;height:18%;background:var(--hc);opacity:.35}
.h1{--hc:var(--h1);--hc2:#4a3f80}.h2{--hc:var(--h2);--hc2:#1f6c96}.h3{--hc:var(--h3);--hc2:#a35d00}.h5{--hc:var(--h5);--hc2:#a22a19}.h7{--hc:var(--h7);--hc2:#6a1f8f}
.bcard.sp{background:linear-gradient(160deg,#fff7d6,#f1c75b);--hc:#b48a26;--hc2:#5a3c00}
.bcard.sp .num{font-size:calc(var(--cw)*.3)}
.bcard.new{animation:drop .45s ease-out}
@keyframes drop{0%{transform:translateY(-30px) scale(1.15);opacity:0}100%{transform:none;opacity:1}}
.bcard.owner{outline:2px solid var(--straw);outline-offset:1px}
.reveal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:30px;--cw:clamp(40px,10vw,58px)}
.reveal .rv{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);font-weight:700}
.reveal .rv.done{opacity:.35}
.reveal .rv.now .bcard{box-shadow:0 0 0 3px var(--straw),0 6px 16px rgba(0,0,0,.5);transform:translateY(-4px)}
.handbox{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.handbox.active{border-color:var(--straw)}
.handbox h3{margin:0;font-family:var(--display);font-weight:400;font-size:18px;color:var(--straw);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.handbox h3 small{font-family:var(--body);color:var(--mute);font-size:13px;font-weight:600}
.hand{display:flex;flex-wrap:wrap;gap:6px;--cw:clamp(50px,12vw,74px)}
.hand button{transition:transform .15s}
.hand button.can:hover{transform:translateY(-6px)}
.hand button.can .bcard{box-shadow:0 0 0 2px var(--straw),0 3px 8px rgba(0,0,0,.45)}
.hand button:disabled{cursor:default}
.hand .risk{display:block;font-size:11px;font-weight:800;text-align:center;margin-top:3px;color:var(--mute)}
.hand .risk.bad{color:#ff9a86}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box h3{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:17px;color:var(--straw)}
.log{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:3px;max-height:200px;overflow:auto}
.log div:first-child{color:var(--ink)}
#modal{position:fixed;inset:0;z-index:40;background:rgba(15,7,4,.78);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.mpanel{background:var(--barn2);border:1px solid var(--straw-d);border-radius:16px;max-width:640px;width:100%;max-height:min(86vh,860px);overflow:auto;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mpanel h3{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:24px;color:var(--straw)}
.sub{color:var(--mute);margin:0 0 10px;font-size:14px}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.act{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;font-weight:700;display:flex;align-items:center;gap:10px;justify-content:space-between}
.act.main{border-color:var(--straw)}
.act .rowmini{display:flex;gap:3px;--cw:34px}
.ghost{border:1px solid var(--line);border-radius:9px;padding:8px 14px;margin-top:12px}
table.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.res td,table.res th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.res td:first-child,table.res th:first-child{text-align:left}
table.res tr.win td{color:var(--straw);font-weight:800}
.menu{max-width:760px;margin:0 auto;padding-block:30px 60px;display:flex;flex-direction:column;gap:22px}
.menu h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,9vw,84px);line-height:.95;margin:0;color:var(--straw)}
.menu .lead{font-size:18px;max-width:58ch;margin:0}
.menu h2{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);margin:0 0 8px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.pbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.pbtn b{font-family:var(--display);font-weight:400;font-size:18px}
.pbtn span{color:var(--mute);font-size:14px}
.pbtn.on{border-color:var(--straw);background:linear-gradient(180deg,#5a3a1a,var(--panel));box-shadow:0 0 0 1px var(--straw) inset}
.stepper{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;width:fit-content}
.stepper b{font-family:var(--display);font-weight:400;font-size:26px;min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.stepper button{width:36px;height:36px;border-radius:50%;background:var(--panel2);font-weight:800;font-size:20px}
.go{background:linear-gradient(180deg,#f6d27a,#c8962b);color:#2b1a10;border-radius:12px;padding:14px 22px;font-family:var(--display);font-size:21px;align-self:flex-start}
.preview{display:flex;gap:6px;flex-wrap:wrap;--cw:56px}
.ex{background:var(--panel);border-left:3px solid var(--straw);border-radius:6px;padding:8px 10px;font-size:14px;margin:10px 0}
.rules p,.rules li{font-size:14px;max-width:65ch}
.cover{position:fixed;inset:0;z-index:38;background:var(--barn);display:grid;place-items:center;padding:16px;text-align:center}
.cover h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,48px);color:var(--straw);margin:0 0 10px}
.float{position:fixed;z-index:45;pointer-events:none;font-family:var(--display);font-size:22px;color:#ff9a86;text-shadow:0 2px 6px rgba(0,0,0,.8);transform:translate(-50%,0);animation:floatUp 1.8s ease-out forwards;display:flex;align-items:center;gap:4px;white-space:nowrap}
.float svg{width:22px;height:22px}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.float{display:none}}

/*top-above*//*hh*/#modal,#cover{top:var(--hh,0px)!important}#modal>*{max-height:calc(100vh - var(--hh,0px) - 24px)!important;max-height:calc(100dvh - var(--hh,0px) - 24px)!important;overflow:auto}
/*top-above*/header.top{z-index:61!important}
/*NETCSS*//* hall (autonome : portail et jeux) */
#hall-modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;padding:12px}
#hall-modal[hidden]{display:none}
.hall-box{background:#fbf6ea;color:#2a2418;border-radius:16px;max-width:560px;width:100%;max-height:calc(100dvh - 24px);overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;font-family:"Nunito Sans",Karla,system-ui,sans-serif;text-align:left}
.hall-box h2{font-family:Georgia,serif;font-size:24px;margin:0 0 6px;color:#2a2418}
.hall-box h4{font-family:Georgia,serif;font-size:16px;margin:14px 0 6px;color:#2a2418}
.hall-box p{line-height:1.45;margin:6px 0}
.hall-in{font-weight:800;font-size:16px;font-family:inherit;padding:9px 11px;border-radius:9px;border:1px solid #c9b98f;background:#fff!important;color:#2a2418!important;-webkit-text-fill-color:#2a2418!important;caret-color:#2a2418;width:100%;max-width:300px}
.hall-in::placeholder{color:#a3926e!important;-webkit-text-fill-color:#a3926e!important;font-weight:600}
.hall-err{color:#b0412e;font-weight:800;min-height:1.2em;font-size:14px}
.hall-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.hall-btn{font-weight:800;font-size:14px;line-height:1;font-family:inherit;border-radius:9px;padding:8px 12px;border:1px solid #c9b98f;background:#ece3cf;color:#2a2418;cursor:pointer;touch-action:manipulation}
.hall-btn.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}
.hall-btn:disabled{opacity:.5}
.hall-link{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;cursor:pointer}
.hall-note{color:#6b5d40;font-size:14px}
.hall-me{background:#f0e6cf;border-radius:10px;padding:8px 10px;margin:6px 0}
.hall-list{list-style:none;margin:4px 0;padding:0;display:flex;flex-direction:column;gap:5px}
.hall-list li{display:flex;align-items:center;gap:9px;background:#f6efdc;border-radius:10px;padding:6px 8px}
.hall-tx{flex:1;min-width:0;display:flex;flex-direction:column}.hall-tx small{color:#6b5d40;font-size:12.5px}
.hall-av{width:30px;height:30px;border-radius:50%;background:#2a2418;color:#fff;display:grid;place-items:center;font-weight:900;flex:none;text-transform:uppercase}
.hall-games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.hall-spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid #c9b98f;border-top-color:#2a2418;animation:hallr 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes hallr{to{transform:rotate(360deg)}}
.hall-invite{position:fixed;right:12px;bottom:12px;z-index:85;background:#fbf6ea;color:#2a2418;border-radius:14px;padding:12px 14px 14px;box-shadow:0 14px 40px #000b;max-width:min(360px,calc(100vw - 24px));font-family:"Nunito Sans",Karla,system-ui,sans-serif;animation:hallin .35s cubic-bezier(.2,1.3,.4,1);overflow:hidden;border:2px solid #1d8f5a}
.hall-invite .hall-acts{margin-top:8px}
.hall-invite .hall-bar{position:absolute;left:0;bottom:0;height:4px;background:#1d8f5a;width:100%;animation:hallt 30s linear forwards}
@keyframes hallt{to{width:0}}
@keyframes hallin{from{transform:translateY(30px);opacity:0}}
.hall-toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-weight:700;font-family:system-ui,sans-serif}
#hall-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 0}
.hall-pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 13px;border:1px solid rgba(255,255,255,.25);background:rgba(29,143,90,.25);color:#eef3ea;font-weight:700;font-size:14px;line-height:1;font-family:inherit;cursor:pointer}
.hall-pill span{color:#d8b25a}
.hall-sub{font-size:14px;color:#a9c2b3}.hall-sub .hall-link{color:#eef3ea}
.hall-dot{width:9px;height:9px;border-radius:50%;background:#7dffb5;box-shadow:0 0 0 2px #fff4;animation:hallp 1.8s infinite}.hall-dot.off{background:#aaa;animation:none}
@keyframes hallp{50%{box-shadow:0 0 0 5px #7dffb500}}

/* salle en ligne */
#netBtn{display:inline-flex;align-items:center;gap:6px}
#netBtn.net-on{background:#1d8f5a;border-color:#1d8f5a;color:#fff}
.net-dot{width:9px;height:9px;border-radius:50%;background:#7dffb5;box-shadow:0 0 0 2px #fff6;animation:netp 1.8s infinite}
.net-dot.off{background:#ffb347;animation:none}
@keyframes netp{50%{box-shadow:0 0 0 5px #7dffb500}}
.hall-box .net-in,.mbox .net-in{font-family:inherit;font-weight:800;font-size:16px;padding:9px 11px;border-radius:9px;border:1px solid #c9b98f;background:#fff!important;color:#2a2418!important;-webkit-text-fill-color:#2a2418!important;caret-color:#2a2418;width:100%;max-width:280px}
.hall-box .net-in::placeholder,.mbox .net-in::placeholder{color:#a3926e!important;-webkit-text-fill-color:#a3926e!important;font-weight:600}
.hall-box .net-code,.mbox .net-code{letter-spacing:.35em;text-transform:uppercase;font-size:22px;text-align:center;max-width:170px}
.net-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.net-box{border:1px solid #d9caa4;border-radius:12px;padding:10px 12px;background:#f6efdc;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.net-box h4{margin:0!important}.net-box p{margin:0;font-size:14px}
.net-note{font-size:13.5px;color:#6b5d40}
.net-code-big{display:flex;gap:8px;justify-content:center;margin:10px 0}
.net-code-big b{font-family:var(--title,Georgia,serif);font-size:40px;width:58px;height:66px;display:grid;place-items:center;border-radius:12px;background:#2a2418;color:#fff;box-shadow:0 6px 0 #0003}
.net-share{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.net-list{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:5px}
.net-list li{display:flex;align-items:center;gap:8px;font-weight:800;background:#f6efdc;border-radius:10px;padding:6px 9px;flex-wrap:wrap}
.net-list li small{font-weight:600;color:#6b5d40}.net-list li.ai{opacity:.8}
.net-av{width:26px;height:26px;border-radius:50%;background:#2a2418;color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.net-ok{color:#1d7a46;font-weight:800}.net-ko{color:#b0412e;font-weight:800}
.net-wait{display:flex;align-items:center;gap:10px;font-weight:700}
.net-spin{width:18px;height:18px;border-radius:50%;border:3px solid #c9b98f;border-top-color:#2a2418;animation:netr 1s linear infinite;flex:none}
@keyframes netr{to{transform:rotate(360deg)}}
.net-rules{margin-top:6px}
@media (max-width:560px){.net-two{grid-template-columns:1fr}.net-code-big b{font-size:32px;width:50px;height:58px}}
.net-me{background:#f0e6cf;border-radius:10px;padding:8px 10px;margin:6px 0}
.net-link{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;cursor:pointer}
.net-chk{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;margin:6px 0}.net-chk input{width:18px;height:18px}
.net-list li .net-r{margin-left:auto}
/* contrôles dans la boîte du hall (indépendants du jeu) */
.hall-box .btn{background:#ece3cf;color:#2a2418;border:1px solid #c9b98f;border-radius:9px;padding:8px 12px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;line-height:1.1}
.hall-box .btn.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}.hall-box .btn:disabled{opacity:.45;cursor:default}
.hall-box .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.hall-box .seg{display:inline-flex;border:1px solid #c9b98f;border-radius:9px;overflow:hidden;flex-wrap:wrap;margin:2px 0}
.hall-box .seg button{border:0;background:#f6efdc;padding:7px 11px;font-weight:700;color:#2a2418;font-size:13.5px;font-family:inherit;cursor:pointer}
.hall-box .seg button.on{background:#2a2418;color:#fff}

.hall-box label{color:#2a2418}

<script>/*NETJS*//* ===== Hall de la Salle de jeux : joueurs connectés, pseudos uniques, tables ouvertes, invitations (Supabase Realtime, sans base) ===== */
const HALL=(()=>{
 const SB_URL='https://evepcodcppxpufbkuflq.supabase.co', SB_KEY='sb_publishable_iUC6966SeFt_05Iac1wGQw_yDo9zl7y';

 const q=s=>document.querySelector(s), es=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const ld=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, sv=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
 const note=s=>{ if(typeof toast==='function') return toast(s); const t=document.createElement('div'); t.className='hall-toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); };
 const H={note,ready:false,ok:null,pseudo:ld('net-name')||'',peers:{},me:{},listeners:[],page:'',title:''};

 /* ---------- pseudo ---------- */

 /* ---------- invitations ---------- */

 function invited(p){ const id='inv-'+p.code; if(q('#'+id)) return; if(typeof sfx==='function') sfx('ding');

 H.goTable=(g,code)=>{ if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined'){ NET.joinCode(code); return; } location.href=g+'.html?salle='+code; };
 H.inviteFlow=to=>{ const P=H.peers[to]; if(!P) return; const r=H.me.r;
   if(r&&r.host&&!r.started){ H.invite(to,r); return; }

   openBox(`<h2>Inviter ${es(P.p)}</h2><p>Choisis le jeu : une table s’ouvre et l’invitation part tout de suite.</p><div class="hall-games">${opts.map(([g,t])=>`<button class="hall-btn" data-g="${g}">${es(t)}</button>`).join('')}</div><div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button></div>`,e=>{
     const b=e.target.closest('[data-g],[data-hl]'); if(!b) return; if(b.dataset.hl){ closeBox(); return; } const g=b.dataset.g; sessionStorage.setItem('hall-invite',JSON.stringify({to,g})); closeBox();

 /* ---------- interface ---------- */

 H.panelHTML=(g)=>{ if(H.ok===false) return `<p class="hall-note">Le salon en ligne n’est pas joignable d’ici.${/github\.io$/.test(location.hostname)?' Vérifie ta connexion.':` Ouvre la salle sur <a href="${SITE}" target="_blank" rel="noopener">le site</a>.`}</p>`;

   return `<div class="hall-me">${H.pseudo?`Ton pseudo : <b>${es(H.pseudo)}</b> <button class="hall-link" data-hl="pseudo">changer</button>`:`<button class="hall-btn pri" data-hl="pseudo">Choisir un pseudo</button> <span class="hall-note">pour apparaître et être invité</span>`}</div>
    <h4>Tables ouvertes${g?'':' (tous les jeux)'}</h4>${tabs.length?`<ul class="hall-list">${tabs.map(t=>`<li><span class="hall-av">${es(t.p[0])}</span><span class="hall-tx"><b>${es(t.gt)}</b><small>table de ${es(t.p)} · ${t.n}/${t.max} joueurs</small></span>${t.cid===H.cid?'<small>ta table</small>':`<button class="hall-btn pri" data-join="${es(t.g)}:${es(t.code)}">Rejoindre</button>`}</li>`).join('')}</ul>`:`<p class="hall-note">Aucune table ouverte${g?' pour ce jeu':''} pour l’instant.</p>`}
    <h4>Joueurs en ligne (${ppl.length})</h4>${H.anon()?`<p class="hall-note">+ ${H.anon()} visiteur${H.anon()>1?'s':''} sans pseudo</p>`:''}${ppl.length?`<ul class="hall-list">${ppl.map(m=>`<li><span class="hall-av">${es(m.p[0])}</span><span class="hall-tx"><b>${es(m.p)}</b><small>${where(m)}</small></span>${H.pseudo&&!busy(m)?`<button class="hall-btn" data-inv="${m.cid}">Inviter</button>`:''}</li>`).join('')}</ul>`:'<p class="hall-note">Personne d’autre pour le moment. Partage le lien du site à tes amis !</p>'}`; };
 H.panelClick=e=>{ const b=e.target.closest('[data-hl],[data-join],[data-inv]'); if(!b) return false;
   if(b.dataset.hl==='pseudo'){ H.askPseudo(); return true; }
   if(b.dataset.join){ const [g,c]=b.dataset.join.split(':'); closeBox(); H.ensure().then(()=>H.goTable(g,c)); return true; }

 let boxCb=null;

 H.openBox=openBox; H.closeBox=closeBox;
 H.openPanel=g=>{ const draw=()=>openBox(`<h2>Le salon</h2>${H.panelHTML(g)}<div class="hall-acts"><button class="hall-btn" data-hl="close">Fermer</button></div>`,e=>{ const b=e.target.closest('[data-hl=close]'); if(b){ closeBox(); return; } H.panelClick(e); });
   draw(); H.redraw=()=>{ const m=q('#hall-modal'); if(m&&!m.hidden&&q('#hall-box h2')&&q('#hall-box h2').textContent==='Le salon') draw(); }; };
 function paint(){ const bar=q('#hall-bar'); if(bar){ const n=H.count();
     bar.innerHTML=H.ok===false?'':`<button class="hall-pill" data-hl="open"><i class="hall-dot ${H.ok?'':'off'}"></i><b>${H.ok?n:'…'}</b> en ligne${H.pseudo?` · <span>${es(H.pseudo)}</span>`:''}</button>${H.ok?`<span class="hall-sub">${H.tables().length?`${H.tables().length} table${H.tables().length>1?'s':''} ouverte${H.tables().length>1?'s':''} · `:''}<button class="hall-link" data-hl="open">Voir qui joue</button>${H.pseudo?'':' · <button class="hall-link" data-hl="pseudo">choisir un pseudo</button>'}</span>`:''}`;
     bar.onclick=e=>{ const b=e.target.closest('[data-hl]'); if(!b) return; if(b.dataset.hl==='open') H.openPanel(''); else H.askPseudo(); }; }
   if(H.redraw) H.redraw(); if(typeof NET!=='undefined'&&NET.hallChanged) NET.hallChanged(); }

 return H; })();
addEventListener('load',()=>setTimeout(()=>{ if(!window.NETGAME) HALL.where('',''); HALL.connect(); },0));

/* ===== Salle en ligne : tables (Supabase Realtime, l'hôte fait tourner la partie), sur le hall commun =====
   Le jeu déclare window.NETGAME = { id, title, min, max, rules():html, rulesClick(e):bool,
     start(list), state():G, receive(msg):Promise, act(seat,fn,args):bool, busy():bool, resume(), leave() } */
const NET=(()=>{
 const $q=s=>document.querySelector(s), es=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const nt=s=>HALL.note(s), snd=n=>{ try{ if(typeof sfx==='function') snd(n); }catch(e){} }, sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const ld=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, svs=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
 let BOXCB=null; const box=(h,locked)=>{ BOXCB=null; HALL.openBox(h,e=>{ if(e.target.closest('[data-hl=close]')){ HALL.closeBox(); return; } (BOXCB||onClick)(e); },locked); };
 const PL=G=>G?(G.players||G.P||[]):[];
 const gameClose=()=>{ try{ if(typeof closeModal==='function') closeModal(true); }catch(e){} };
 const SITE='https://mushu1994.github.io/duel-des-ages/';
 const LET='ABCDEFGHJKLMNPQRSTUVWXYZ';
 const BOTS=['Ada','Hal','Pixel','Nova','Atlas','Écho','Zéphyr','Orbit','Volt','Lumen','Quartz','Sirius'];
 const N={on:false,host:false,guest:false,started:false,code:null,name:'',seat:null,peers:{},v:0,hs:null,lastV:-1,lastHs:null,q:[],aq:[],ai:{n:0,level:'normal'},ui:null,known:new Set(),waitHost:false,open:(()=>{ try{ return localStorage.getItem('net-open')!=='false'; }catch(e){ return true; } })(),invited:new Set()};
 N.cid=HALL.cid;
 let client=null, ch=null;
 const NG=()=>window.NETGAME;
 function newCode(){ let c=''; for(let i=0;i<4;i++) c+=LET[Math.floor(Math.random()*LET.length)]; return c; }
 const link=()=>{ const base=/github\.io$/.test(location.hostname)?location.origin+location.pathname:SITE+NG().id+'.html'; return base+'?salle='+N.code; };
 const sess=()=>ld('net-sess'), setSess=v=>svs('net-sess',v);
 const isGh=()=>/github\.io$/.test(location.hostname);
 /* ---------- connexion à une table ---------- */
 async function connect(code,asHost){ client=await HALL.client();
   if(ch){ try{ await client.removeChannel(ch); }catch(e){} ch=null; }
   N.code=code; N.host=asHost; N.guest=!asHost; N.on=true; N.peers={}; N.known=new Set(); N.hs=Math.random().toString(36).slice(2,8); N.name=HALL.pseudo;
   ch=client.channel('salle:'+NG().id+':'+code,{config:{broadcast:{self:false},presence:{key:N.cid}}});
   ch.on('broadcast',{event:'st'},({payload})=>{ if(N.guest) enqueue(payload&&payload.j?JSON.parse(payload.j):payload); });
   ch.on('broadcast',{event:'act'},({payload})=>{ if(N.host){ N.aq.push(payload&&payload.j?JSON.parse(payload.j):payload); drain(); } });
   ch.on('broadcast',{event:'hello'},()=>{ if(N.host){ if(N.started) pushFull(); else pushLobby(); } });
   ch.on('broadcast',{event:'lobby'},({payload})=>{ if(N.guest&&!N.started){ N.lobby=payload; if(N.ui==='lobby') lobbyUI(); } });
   ch.on('broadcast',{event:'close'},()=>{ if(N.guest){ nt('L’hôte a fermé la table'); leave(true); } });
   ch.on('presence',{event:'sync'},onSync);
   return new Promise((res,rej)=>{ let done=false; const to=setTimeout(()=>{ if(!done){ done=true; rej(new Error('timeout')); } },9000);
     ch.subscribe(async st=>{ if(st==='SUBSCRIBED'){ await ch.track({name:N.name,host:asHost,at:Date.now()}); if(!done){ done=true; clearTimeout(to); res(); } if(N.guest) send('hello',{}); }
       else if((st==='CHANNEL_ERROR'||st==='TIMED_OUT')&&!done){ done=true; clearTimeout(to); rej(new Error(st)); } }); }); }

 function onSync(){ const st=ch.presenceState(); const peers={}; for(const k in st){ const m=st[k][st[k].length-1]; peers[k]=m; } const before=N.peers; N.peers=peers;
   const names=k=>(peers[k]||before[k]||{}).name||'Un joueur';
   for(const k in peers) if(!before[k]&&k!==N.cid){ if(N.known.has(k)) nt(`${names(k)} est de retour`); else if(N.host&&!N.started){ nt(`${names(k)} rejoint la table`); snd('pop'); } }

   if(N.host){ if(N.started){ const G=NG().state(); let ch2=false; if(G) PL(G).forEach(P=>{ if(P.cid&&P.away&&peers[P.cid]){ P.ai=false; P.away=false; ch2=true; } }); if(ch2) NG().resume(); pushFull(); } else pushLobby(); }
   hallRoom(); badge(); if(N.ui==='lobby') lobbyUI(); else if(N.ui==='panel') panelUI(); }
 function hallRoom(){ if(!N.on){ HALL.set({r:null}); return; } const n=N.host&&!N.started?lobbyOrder().length+N.ai.n:Object.keys(N.peers).length;
   HALL.set({r:{g:NG().id,gt:NG().title,code:N.code,host:N.host,open:N.host?N.open:false,started:N.started,n,max:NG().max}}); }
 /* ---------- hôte ---------- */
 function pushLobby(){ if(!N.host||N.started) return; send('lobby',{order:lobbyOrder().map(k=>({cid:k,name:N.peers[k].name})),ai:N.ai}); }
 function lobbyOrder(){ return Object.keys(N.peers).sort((a,b)=>(N.peers[b].host-N.peers[a].host)||(N.peers[a].at-N.peers[b].at)); }
 let pushT=null;

  G.rows=[0,1,2,3].map(()=>({cards:[deck.pop()],limit:null}));
  G.rows.forEach(r=>{if(G.elastic&&r.cards[0].h>=2)r.limit=1+r.cards[0].h;});
  G.seen=new Set();G.rows.forEach(r=>r.cards.forEach(c=>G.seen.add(c.v)));

async function runGame(res){
  if(!res)setupRound();

    if(!G.P[0].hand.length){endRound();if(G.over)break;if(!G.fast)await roundModal();setupRound();continue;}
    saveGame();
    G.trick++;
    if(G.pass&&G.P[0].hand.length>1)await passPhase();
    await choosePhase();
    await resolvePhase();
  }
  clearSave();render();showEnd();
}
async function passPhase(){
  const gifts=[];
  if(NETON()){ await Promise.all(G.P.map(async(p,i)=>{ const k=isAI(i)?aiPass(i):(await input(i,{hand:true,kind:'pass',prompt:`Choisis la carte à donner à ${G.P[(i+1)%G.P.length].name}`})).card; gifts[i]=p.hand.splice(k,1)[0]; render(); })); }
  else
  for(let i=0;i<G.P.length;i++){
    const p=G.P[i];let k;
    if(isAI(i))k=aiPass(i);
    else{await coverFor(i,'donner une carte');k=(await input(i,{hand:true,prompt:`${p.name} : choisis la carte à donner à ${G.P[(i+1)%G.P.length].name}`})).card;}
    gifts[i]=p.hand.splice(k,1)[0];
  }
  gifts.forEach((c,i)=>{const to=G.P[(i+1)%G.P.length];to.hand.push(c);to.hand.sort((a,b)=>a.v-b.v);to.gotGift=c;});

}
async function choosePhase(){
  G.played=G.P.map(()=>null);G.step=-1;render();
  if(NETON()){ await Promise.all(G.P.map(async(p,i)=>{ const k=isAI(i)?aiChoose(i):(await input(i,{hand:true,kind:'choose',prompt:'Choisis la carte à jouer'})).card; G.played[i]=p.hand.splice(k,1)[0]; render(); })); return; }
  for(let i=0;i<G.P.length;i++){
    const p=G.P[i];let k;
    if(isAI(i)){k=aiChoose(i);}
    else{await coverFor(i,'choisir ta carte');k=(await input(i,{hand:true,prompt:`${p.name} : choisis la carte à jouer`})).card;}
    G.played[i]=p.hand.splice(k,1)[0];render();
  }

}
async function resolvePhase(){
  const order=G.played.map((c,i)=>({c,i})).sort((a,b)=>a.c.v-b.c.v);
  G.order=order;G.step=-1;render();await sleep(900);
  for(let s=0;s<order.length;s++){
    G.step=s;const {c,i}=order[s];render();await sleep(500);
    await place(i,c);

  }
  G.played=null;G.order=null;G.step=-1;
}
async function chooseRow(i,c,cands,why){
  if(cands.length===1)return cands[0];
  if(isAI(i)){return cands.slice().sort((a,b)=>rowHeads(G.rows[a])-rowHeads(G.rows[b])||G.rows[a].cards.length-G.rows[b].cards.length)[0];}
  hideCover();return (await input(i,{rows:cands,prompt:`${G.P[i].name} : ${why}`,card:c})).row;
}
async function take(i,r,c){
  const row=G.rows[r];const hh=rowHeads(row);
  G.P[i].pile.push(...row.cards);log(`${G.P[i].name} ramasse la rangée ${r+1} (${hh} tête${hh>1?'s':''}).`);
  if(!G.fast){floatHeads(r,hh);sfx('moo');}
  row.cards=[c];row.limit=(G.elastic&&!c.sp&&c.h>=2)?1+c.h:null;c.isNew=true;
}
async function place(i,c){
  if(c.sp){
    const ok=G.rows.map((r,k)=>k).filter(k=>G.rows[k].cards.length<Math.min(5,rowLimit(G.rows[k]))&&!lastIsSp(G.rows[k]));
    if(ok.length){const r=isAI(i)?aiSpRow(i,ok):await chooseRow(i,c,ok,`où poser ta carte spéciale ${c.lab} ?`);G.rows[r].cards.push(c);c.isNew=true;log(`${G.P[i].name} pose la spéciale ${c.lab} sur la rangée ${r+1}.`);return;}
    const r=await chooseRow(i,c,[0,1,2,3],'aucune rangée ne peut recevoir ta spéciale : choisis la rangée à ramasser');
    await take(i,r,c);return;
  }
  let best=-1,bv=-1;
  G.rows.forEach((r,k)=>{const lv=lastVal(r);if(lv<c.v&&lv>bv){bv=lv;best=k;}});
  if(best<0){
    const r=await chooseRow(i,c,[0,1,2,3],`ta carte ${c.v} est plus petite que toutes les rangées : choisis celle que tu ramasses`);
    await take(i,r,c);return;
  }
  const row=G.rows[best];
  if(row.cards.length>=rowLimit(row)){await take(i,best,c);return;}
  row.cards.push(c);c.isNew=true;
  if(G.elastic&&!row.limit&&c.h>=2)row.limit=Math.min(11,row.cards.length+c.h);
}
function endRound(){
  const sc=G.P.map(p=>p.pile.reduce((a,c)=>a+c.h,0));
  G.P.forEach((p,i)=>{p.total+=sc[i];p.hist.push(sc[i]);});
  log(`Fin de la manche ${G.round}.`);
  if(Math.max(...G.P.map(p=>p.total))>=G.target){const m=Math.min(...G.P.map(p=>p.total));G.over={winners:G.P.map((p,i)=>p.total===m?i:-1).filter(i=>i>=0)};}
}

const LEVELS={facile:{noise:4,n:'Facile'},normal:{noise:.8,n:'Normal'},difficile:{noise:.15,n:'Difficile'}};
function unseen(i){const max=G.tactical?10*G.P.length+4:104;let n=0;const mine=new Set(G.P[i].hand.map(c=>c.v));for(let v=1;v<=max;v++)if(!G.seen.has(v)&&!mine.has(v))n++;return n;}
function risk(i,c){
  if(c.sp){const ok=G.rows.some(r=>r.cards.length<Math.min(5,rowLimit(r))&&!lastIsSp(r));return ok?0.2:Math.min(...G.rows.map(rowHeads));}
  let best=-1,bv=-1;G.rows.forEach((r,k)=>{const lv=lastVal(r);if(lv<c.v&&lv>bv){bv=lv;best=k;}});
  if(best<0)return Math.min(...G.rows.map(rowHeads))*.9;
  const row=G.rows[best];const lim=rowLimit(row);
  if(row.cards.length>=lim)return rowHeads(row);
  const mine=new Set(G.P[i].hand.map(x=>x.v));const max=G.tactical?10*G.P.length+4:104;
  let between=0;for(let v=Math.floor(bv)+1;v<c.v;v++)if(!G.seen.has(v)&&!mine.has(v))between++;
  const nOpp=G.P.length-1;const e=between*nOpp/Math.max(1,unseen(i));
  const fill=row.cards.length+e;const p=1/(1+Math.exp(-3*(fill-(lim-.6))));
  return p*(rowHeads(row)+1.4*e)+(row.cards.length===lim-1?.4:0);
}
function aiChoose(i){
  const W=LEVELS[G.level];const p=G.P[i];
  let best=0,bv=1e9;
  p.hand.forEach((c,k)=>{let r=risk(i,c);if(c.sp)r=p.hand.some(x=>!x.sp&&risk(i,x)<2)?6:0.5;r+=Math.random()*W.noise*.5;if(r<bv){bv=r;best=k;}});
  return best;
}
function aiPass(i){const p=G.P[i];let best=0,bv=-1;p.hand.forEach((c,k)=>{if(c.sp)return;const r=risk(i,c)+c.h*.3;if(r>bv){bv=r;best=k;}});return best;}
function aiSpRow(i,ok){return ok.slice().sort((a,b)=>rowHeads(G.rows[b])-rowHeads(G.rows[a]))[0];}

function floatHeads(r,h){if(IS_NODE)return;const el=$('row'+r);if(!el)return;const b=el.getBoundingClientRect();const d=document.createElement('div');d.className='float';d.innerHTML=`+${h} ${bullS}`;d.style.left=(b.left+b.width/2)+'px';d.style.top=b.top+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1900);}
/* Sauvegarde (en début de tour) */
const SAVE_KEY='tetes-de-boeuf-save';
function saveGame(){if(IS_NODE||G.fast)return;const d={v:1,G:{...G,input:null,seen:[...G.seen]}};try{localStorage.setItem(SAVE_KEY,JSON.stringify(d));}catch(e){}}
function clearSave(){if(IS_NODE||G.fast)return;try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function loadSave(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return d&&d.v===1&&!d.G.over?d:null;}catch(e){return null;}}
function resumeGame(d){GEN++;inputResolve=null;closeModal(true);G=d.G;G.seen=new Set(G.seen);G.played=null;G.order=null;log('Partie reprise.');const r=runGame(true);r.catch(e=>{if(e!=='abort')console.error(e);});}
let AC=null,MUTED=false;try{MUTED=localStorage.getItem('tdb-mute')==='1';}catch(e){}
function ac(){if(IS_NODE)return null;if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
function tn(a,t,f,d,type,v,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function sfx(n){if(IS_NODE||MUTED||(G&&G.fast))return;const a=ac();if(!a||a.state!=='running')return;const t=a.currentTime+.01;
  if(n==='moo'){tn(a,t,170,.9,'sawtooth',.09,120);tn(a,t,172,.9,'triangle',.06,118);}
  if(n==='card')tn(a,t,700,.1,'triangle',.06,350);
  if(n==='win')[523,659,784,1046].forEach((f,k)=>tn(a,t+k*.12,f,.35,'triangle',.11));}
if(!IS_NODE){
document.addEventListener('click',e=>{
  if(!MUTED)ac();
  if(e.target.id==='modal'){closeModal(false);return;}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;const inp=myInp();
  if(NETON()&&(a==='card'||a==='row')){ if(!inp) return; const val=a==='card'?{card:+v}:{row:+v}; if(a==='card'&&!inp.hand) return; if(a==='row'&&!(inp.rows&&inp.rows.includes(+v))) return; sfx('card'); if(NET.guest){ delete G.inputs[NET.seat]; render(); NET.act('in',[NET.seat,val]); } else if(WAITS[NET.seat]) WAITS[NET.seat](val); return; }
  switch(a){
    case 'card':if(inp&&inp.hand){sfx('card');inputResolve({card:+v});}break;
    case 'row':if(inp&&inp.rows&&inp.rows.includes(+v))inputResolve({row:+v});break;
    case 'uncover':if(G&&G.coverRes){const r=G.coverRes;G.coverRes=null;r();}break;
    case 'next':if(NET.guest)break;if(inputResolve)inputResolve();break;
    case 'close':closeModal(false);break;
    case 'help':showHelp();break;
    case 'risk':G.showRisk=!G.showRisk;render();break;
    case 'sound':MUTED=!MUTED;try{localStorage.setItem('tdb-mute',MUTED?'1':'0');}catch(e){}render();break;
    case 'menu':if(NET.onNew&&NET.onNew())break;GEN++;inputResolve=null;closeModal(true);hideCover();G=null;render();scrollTo(0,0);break;
    case 'n':MENU.n=Math.max(2,Math.min(10,MENU.n+(+v)));MENU.humans=Math.min(MENU.humans,MENU.n);render();break;
    case 'h':MENU.humans=Math.max(1,Math.min(MENU.n,MENU.humans+(+v)));render();break;
    case 'level':MENU.level=v;render();break;
    case 'opt':MENU[v]=!MENU[v];render();break;
    case 'target':MENU.target=+v;render();break;
    case 'start':try{localStorage.removeItem(SAVE_KEY);}catch(e){}newGame(MENU);scrollTo(0,0);break;
    case 'again':{if(NETON()&&NET.host){closeModal(true);NET.restart();break;}if(NETON())break;const o={n:G.P.length,humans:humansCount(),level:G.level,sp:G.sp,pass:G.pass,elastic:G.elastic,tactical:G.tactical,target:G.target};newGame(o);scrollTo(0,0);break;}
    case 'resume':{const d=loadSave();if(d)resumeGame(d);break;}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal(false);});
let ENDSHOWN=false;
window.TDB={get G(){return G;}};
window.NETGAME={id:'tetes-de-boeuf',title:'Têtes de Bœuf',min:2,max:10,btnHost:'.top .hrow',
  rules(){ return `<h4>Variantes</h4>${[['sp','Cartes spéciales'],['pass','Passe à gauche'],['elastic','Rangées élastiques'],['tactical','Jeu tactique']].map(([k,l])=>`<label class="opt"><input type="checkbox" data-o="${k}" ${MENU[k]?'checked':''}><span>${l}</span></label>`).join('')}<h4>Longueur</h4><div class="seg"><button class="${MENU.target===66?'on':''}" data-m="t:66">66 têtes</button><button class="${MENU.target===33?'on':''}" data-m="t:33">33 têtes</button></div>`; },
  rulesClick(e){ const x=e.target.closest('[data-o],[data-m^="t:"]'); if(!x) return false; if(x.dataset.m) MENU.target=+x.dataset.m.split(':')[1]; else document.querySelectorAll('#hall-box [data-o]').forEach(i=>{ MENU[i.dataset.o]=i.checked; }); return true; },
  start(list){ GEN++; inputResolve=null; WAITS={}; ENDSHOWN=false; closeModal(true); hideCover(); const o=MENU;
    G={P:list.map(x=>({name:x.name,cid:x.cid||null,ai:!!x.ai,level:x.level||o.level,total:0,hist:[],pile:[],hand:[]})),level:o.level,sp:o.sp,pass:o.pass,elastic:o.elastic,tactical:o.tactical,target:o.target,fast:false,round:0,trick:0,rows:[],log:[],over:null,played:null,step:-1,net:true,inputs:{}};
    NET.push(null,'new'); runGame().catch(e=>{ if(e!=='abort') console.error(e); }); scrollTo(0,0); },
  state:()=>G?Object.assign({},G,{seen:G.seen?[...G.seen]:[],coverRes:null}):null, busy:()=>false,
  resume(){ Object.keys(WAITS).forEach(i=>{ if(G.P[i].ai) aiResolve(+i); }); },
  act(seat,fn,args){ if(fn!=='in'||!G||args[0]!==seat||!WAITS[seat]) return false; const c=G.inputs[seat], v=args[1]||{}; if(!c) return false;
    if(c.rows){ if(!c.rows.includes(+v.row)) return false; WAITS[seat]({row:+v.row}); return true; }
    if(c.hand){ const k=+v.card; if(!(k>=0&&k<G.P[seat].hand.length)) return false; WAITS[seat]({card:k}); return true; } return false; },
  async receive(m){ if(m.kind==='lobby'){ GEN++; G=null; render(); return; }
    if(m.kind==='new'){ ENDSHOWN=false; closeModal(true); }
    const wasRm=G&&G.rm; G=m.G; G.seen=new Set(G.seen||[]); render();
    if(G.rm&&!wasRm) roundModal(); else if(!G.rm&&wasRm&&!G.over) closeModal(true);
    if(G.over&&!ENDSHOWN){ ENDSHOWN=true; closeModal(true); showEnd(); } },
  menuLocal(){ G=null; render(); },
  leave(){ GEN++; WAITS={}; G=null; render(); } };
render();
}
if(IS_NODE)module.exports={newGame,get G(){return G}};
