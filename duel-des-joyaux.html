<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duel des Joyaux</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Duel des Joyaux : duel de joailliers pour deux joueurs, contre l'IA ou à deux, avec le module Faussaires.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Karla:wght@400;500;700;800&display=swap">
<style>
/* Écrin de velours bordeaux, laiton ; plateau central (pyramide + 5×5) et colonne latérale (cartes royales, faussaires, chronique) */
:root{
  --velvet:#1c0d14; --velvet2:#27121c; --panel:#2f1825; --panel2:#3d2131; --line:#5b3448;
  --ink:#f6eee3; --mute:#bca7b2; --brass:#dcb565; --brass-d:#8c6a2a;
  --p0:#f0c75e; --p1:#8fd3e0; --good:#7fd49a; --bad:#f07a68;
  --ivory:#f4ecdc; --ivory-ink:#2a1a14;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--velvet);background-image:radial-gradient(900px 500px at 50% -10%,#4a1a2f 0%,transparent 70%),radial-gradient(700px 400px at 0% 100%,#2e1422 0%,transparent 70%);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--velvet)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,[data-a]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
a{color:var(--brass)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(28,13,20,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.home{font-size:13px;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.home:hover{color:var(--ink);border-color:var(--brass)}
.logo{font-family:var(--display);font-weight:700;font-size:25px;letter-spacing:.02em;color:var(--brass);white-space:nowrap}
.spacer{flex:1}
.hbtn{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:14px}
.hbtn:hover{border-color:var(--brass)}
.short{display:none}@media (max-width:560px){.long{display:none}.short{display:inline}.logo{font-size:21px}}
.turnbar{background:var(--tc);color:#1a1008}
.turnbar .wrap{display:flex;align-items:center;gap:10px;padding-block:7px;flex-wrap:wrap;font-weight:700}
.turnbar .who{font-family:var(--display);font-size:22px;font-weight:700}
.turnbar .hint{font-weight:500;opacity:.85}
.turnbar .dot{width:12px;height:12px;border-radius:50%;background:#1a1008;animation:blink 1.2s ease-in-out infinite}
.turnbar.done{background:var(--panel2);color:var(--ink)}.turnbar.done .dot{display:none}
@keyframes blink{50%{opacity:.25}}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding-block:16px 40px}
@media (max-width:940px){.layout{grid-template-columns:minmax(0,1fr)}}
main,aside{min-width:0;display:flex;flex-direction:column;gap:14px}

/* Joueur */
.pl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pl.p0{--pc:var(--p0)}.pl.p1{--pc:var(--p1)}
.pl.active{border-color:var(--pc);animation:glow 2s ease-in-out infinite}
.pl:not(.active){opacity:.85}
@keyframes glow{50%{box-shadow:0 0 0 1px var(--pc) inset,0 0 22px color-mix(in srgb,var(--pc) 40%,transparent)}}
.pl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pl-name{font-family:var(--display);font-weight:700;font-size:22px;color:var(--pc)}
.flag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:var(--pc);color:#1a1008;border-radius:4px;padding:1px 6px;font-weight:800}
.stats{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:4px;background:var(--velvet2);border-radius:7px;padding:3px 8px;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.stat svg{width:16px;height:16px}
.stat.pts{background:#2f6a3b;color:#eaffee}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);min-width:64px}
.tchip{display:inline-flex;align-items:center;gap:3px;background:var(--velvet2);border-radius:999px;padding:2px 8px 2px 2px;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.tchip.zero{opacity:.35}
.bcol{display:inline-flex;flex-direction:column;align-items:center;gap:1px;background:var(--velvet2);border-radius:8px;padding:4px 6px;min-width:44px;font-variant-numeric:tabular-nums}
.bcol .bn{font-weight:800;font-size:14px}
.bcol .bp{font-size:11px;color:var(--mute)}
.bcol.zero{opacity:.35}
.mini-cards{display:flex;flex-wrap:wrap;gap:6px}
.threat{background:#5a1a16;border:1px solid var(--bad);color:#ffd9d2;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.xbtn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:13px}
.xbtn.hot{border-color:var(--brass);color:var(--brass)}
.xbtn:disabled{opacity:.4;cursor:not-allowed}

/* Gemmes */
.gem{display:inline-block;width:var(--gs,22px);height:var(--gs,22px);border-radius:50%;flex:none;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.35)}
.gem::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,rgba(255,255,255,.28) 0 12%,transparent 0 25%,rgba(255,255,255,.14) 0 37%,transparent 0 50%,rgba(255,255,255,.22) 0 62%,transparent 0 75%,rgba(255,255,255,.1) 0 87%,transparent 0)}
.g-W{background:radial-gradient(circle at 35% 30%,#fff,#d6deea 55%,#8592a8)}
.g-B{background:radial-gradient(circle at 35% 30%,#b9d4ff,#2a62d6 55%,#0d2766)}
.g-G{background:radial-gradient(circle at 35% 30%,#b6f5c9,#18a457 55%,#06481f)}
.g-R{background:radial-gradient(circle at 35% 30%,#ffc0c7,#d41f3c 55%,#650818)}
.g-K{background:radial-gradient(circle at 35% 30%,#9b9ba8,#2c2c36 55%,#09090d)}
.g-P{background:radial-gradient(circle at 35% 30%,#ffe9f3,#f28cbf 52%,#a83f78)}
.g-P::after{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.9) 0 12%,transparent 30%)}
.g-Y{background:radial-gradient(circle at 35% 30%,#fff6c2,#e6b632 55%,#8a6410)}
.g-V{background:radial-gradient(circle at 35% 30%,rgba(240,220,255,.95),rgba(160,95,235,.85) 55%,rgba(70,30,130,.9));box-shadow:0 0 8px rgba(170,110,255,.6),inset 0 0 0 1px rgba(255,255,255,.4)}
.gem.big{--gs:30px}
.cost-chip{display:inline-flex;align-items:center;justify-content:center;position:relative;--gs:calc(var(--cw)*.2)}
.cost-chip b{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.13);font-weight:800;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
.cost-chip.light b{color:#1a1008;text-shadow:0 0 2px #fff}
.cost-chip.pk b{color:#fff;text-shadow:0 1px 2px #5a1038,0 0 3px #5a1038}

/* Cartes */
.jcard{--cw:78px;width:var(--cw);height:calc(var(--cw)*1.38);border-radius:calc(var(--cw)*.09);background:var(--ivory);color:var(--ivory-ink);display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.5);border:1px solid rgba(0,0,0,.4);flex:none;text-align:left}
.jcard .top{height:42%;background:var(--facet),var(--cc);position:relative;display:flex;align-items:flex-start;justify-content:space-between;padding:calc(var(--cw)*.05)}
.jcard .bonus{--gs:calc(var(--cw)*.27)}
.jcard .pts{font-family:var(--display);font-weight:700;font-size:calc(var(--cw)*.32);line-height:.9;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.jcard .crw{display:flex;gap:1px;position:absolute;left:calc(var(--cw)*.05);bottom:calc(var(--cw)*.04)}
.jcard .crw svg{width:calc(var(--cw)*.16);height:calc(var(--cw)*.16)}
.jcard .ab{position:absolute;right:calc(var(--cw)*.04);bottom:calc(var(--cw)*.04);font-size:calc(var(--cw)*.105);font-weight:800;background:rgba(0,0,0,.55);color:#fff;border-radius:3px;padding:1px 3px;white-space:nowrap}
.jcard .costs{margin-top:auto;display:flex;flex-wrap:wrap;gap:2px;padding:calc(var(--cw)*.05);align-content:flex-end}
.jcard .lvl{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--cw)*.05);font-size:calc(var(--cw)*.1);font-weight:800;color:rgba(255,255,255,.8)}
.c-W{--cc:linear-gradient(160deg,#eef2f8,#aeb9cc)}.c-B{--cc:linear-gradient(160deg,#4f86e8,#173d94)}.c-G{--cc:linear-gradient(160deg,#36b96a,#0d5e2f)}.c-R{--cc:linear-gradient(160deg,#e2475d,#7a0d20)}.c-K{--cc:linear-gradient(160deg,#55555f,#16161c)}
.c-X{--cc:linear-gradient(160deg,#b89a6a,#6e5430)}.c-J{--cc:conic-gradient(from 0deg,#e2475d,#e6b632,#36b96a,#4f86e8,#9b5de5,#e2475d)}
.c-F{--cc:linear-gradient(160deg,#9b5de5,#3e1a72)}
.jcard{--facet:linear-gradient(115deg,rgba(255,255,255,.18) 0 18%,transparent 18% 40%,rgba(255,255,255,.1) 40% 52%,transparent 52%)}
.jcard.c-W .pts{color:#2a1a14;text-shadow:0 0 3px #fff}
.jcard.can{box-shadow:0 0 0 3px var(--good),0 4px 12px rgba(0,0,0,.5)}
.jcard.click{cursor:pointer;transition:transform .15s}
.jcard.click:hover{transform:translateY(-3px)}
.jcard.hl{box-shadow:0 0 0 3px var(--p1),0 0 20px var(--p1);transform:translateY(-6px) scale(1.05)}
.jcard.danger{outline:3px solid var(--bad);outline-offset:1px}
.jcard .fname{font-size:calc(var(--cw)*.11);font-weight:800;padding:2px calc(var(--cw)*.05) 0;line-height:1.1;color:var(--ivory-ink)}
.deck{--cw:78px;width:var(--cw);height:calc(var(--cw)*1.38);border-radius:calc(var(--cw)*.09);display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:700;color:rgba(255,255,255,.9);font-size:calc(var(--cw)*.24);position:relative;border:1px solid rgba(0,0,0,.4);box-shadow:3px 3px 0 rgba(0,0,0,.35),6px 6px 0 rgba(0,0,0,.2)}
.deck.l1{background:linear-gradient(145deg,#2c6b4a,#123825)}.deck.l2{background:linear-gradient(145deg,#a0782a,#5a3d0c)}.deck.l3{background:linear-gradient(145deg,#2b4c8c,#121f44)}
.deck small{position:absolute;bottom:4px;font-family:var(--body);font-size:11px;font-weight:700}
.deck.empty{opacity:.25}
.deck.click{cursor:pointer}

/* Plateau */
.board{background:linear-gradient(180deg,rgba(70,30,48,.55),rgba(39,18,28,.45));border:1px solid var(--line);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;gap:14px;align-items:center}
.pyr{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;--cw:clamp(52px,14.5vw,82px)}
.pyr .jcard,.pyr .deck{--cw:inherit}
.prow{display:flex;gap:6px;justify-content:center;align-items:center}
.prow .sep{width:6px}
.tokwrap{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(5,var(--cs));gap:6px;--cs:clamp(42px,11vw,54px);background:radial-gradient(circle at 50% 50%,#3a1a2b,#1d0c15);padding:10px;border-radius:12px;border:2px solid var(--brass-d);box-shadow:inset 0 0 20px rgba(0,0,0,.6)}
.cell{width:var(--cs);height:var(--cs);border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center;position:relative}
.cell.on{cursor:pointer}
.cell .gem{--gs:calc(var(--cs)*.82);transition:transform .15s}
.cell.on:hover .gem{transform:scale(1.07)}
.cell.sel{box-shadow:0 0 0 3px var(--tc,var(--brass)),0 0 14px var(--tc,var(--brass))}
.cell.sel .gem{transform:scale(1.1)}
.cell.taken .gem{animation:pop .4s ease-in reverse}
.side-info{display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:13px;color:var(--mute)}
.privs{display:flex;gap:4px}
.scroll{width:26px;height:30px}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cbtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px}
.cbtn.main{background:linear-gradient(180deg,#e7c06a,#a87a2a);color:#1d1206;border-color:transparent}
.cbtn:disabled{opacity:.38;cursor:not-allowed}
.selhint{font-size:13px;color:var(--mute);text-align:center;min-height:1.2em}

/* Colonne */
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box h3{margin:0 0 8px;font-family:var(--display);font-weight:700;font-size:21px;color:var(--brass);display:flex;align-items:baseline;gap:8px}
.box h3 small{font-family:var(--body);font-size:12px;color:var(--mute);font-weight:500;margin-left:auto}
.royals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.royal{background:linear-gradient(160deg,#4a2b12,#24130a);border:1px solid var(--brass-d);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:3px;text-align:left}
.royal b{font-family:var(--display);font-size:17px;color:#ffe2a0}
.royal span{font-size:12px;color:#e9d8c0}
.royal .rp{font-family:var(--display);font-weight:700;font-size:22px;color:#fff}
.fakes{display:flex;gap:6px;flex-wrap:wrap;--cw:94px}
.log{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:3px;max-height:240px;overflow:auto}
.log div:first-child{color:var(--ink)}
.qbtn{width:22px;height:22px;border-radius:50%;border:1px solid var(--brass-d);color:var(--brass);font-weight:800;font-size:12px}

/* Modale */
#modal{position:fixed;inset:0;z-index:40;background:rgba(10,4,8,.75);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.mpanel{background:var(--velvet2);border:1px solid var(--brass-d);border-radius:14px;max-width:600px;width:100%;max-height:min(86vh,860px);overflow:auto;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mpanel h3{margin:0 0 6px;font-family:var(--display);font-weight:700;font-size:26px;color:var(--brass);text-wrap:balance}
.sub{color:var(--mute);margin:0 0 10px;font-size:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt .ot{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt .ot b{font-family:var(--display);font-weight:700;font-size:18px}
.opt .ot span{font-size:13px;color:var(--mute)}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.act{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.act.main{border-color:var(--brass)}
.act b{font-weight:700}.act span{font-size:12px;color:var(--mute)}
.act:disabled{opacity:.4;cursor:not-allowed}
.ghost{border:1px solid var(--line);border-radius:9px;padding:8px 14px;margin-top:12px}
.sheet{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.sheet ul{margin:0;padding-left:18px;font-size:14px}
.sheet>div:last-child{flex:1;min-width:180px}

/* Menu */
.menu{max-width:760px;margin:0 auto;padding-block:36px 60px;display:flex;flex-direction:column;gap:22px}
.menu h1{font-family:var(--display);font-weight:700;font-size:clamp(46px,9vw,80px);line-height:.95;margin:0;color:var(--brass);text-wrap:balance}
.menu .lead{font-size:18px;max-width:58ch;margin:0}
.menu h2{font-family:var(--body);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);margin:0 0 8px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.pbtn b{font-family:var(--display);font-weight:700;font-size:21px}
.pbtn span{color:var(--mute);font-size:14px}
.pbtn.on{border-color:var(--brass);background:linear-gradient(180deg,#4a3218,var(--panel));box-shadow:0 0 0 1px var(--brass) inset}
.go{background:linear-gradient(180deg,#e7c06a,#a87a2a);color:#1d1206;border-radius:12px;padding:14px 22px;font-family:var(--display);font-weight:700;font-size:22px;align-self:flex-start}
.preview{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.ex{background:var(--panel);border-left:3px solid var(--brass);border-radius:6px;padding:8px 10px;font-size:14px;margin:10px 0}
.rules h4{font-family:var(--display);font-weight:700;color:var(--brass);margin:14px 0 4px;font-size:20px}
.rules p,.rules li{font-size:14px;max-width:65ch}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
.tab.on{border-color:var(--brass);color:var(--brass)}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;font-size:13px}
.glist div{background:var(--panel);border-radius:6px;padding:6px 8px}

/* Animations */
.ff .pl.p1{transform:rotate(180deg)}
.mpanel.flip,.splash.flip div,.turnbar.flip .wrap{transform:rotate(180deg)}
.splash.flip div{animation-name:splashf}
@keyframes splashf{0%{opacity:0;transform:rotate(180deg) scale(.7)}15%{opacity:1;transform:rotate(180deg) scale(1.04)}25%{transform:rotate(180deg)}75%{opacity:1}100%{opacity:0;transform:rotate(180deg)}}
.ffnote{font-size:13px;color:var(--mute)}
.float{position:fixed;z-index:45;pointer-events:none;font-weight:800;font-size:19px;animation:floatUp 1.6s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.8);transform:translate(-50%,0);white-space:nowrap;display:flex;gap:4px;align-items:center}
.float.gain{color:#ffd76a}.float.loss{color:#ff8a78}.float.pts{color:#8ff0a6}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-56px)}}
.splash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:35}
.splash div{background:var(--tc);color:#1a1008;font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,48px);padding:12px 34px;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:splash 1.25s ease-out forwards;text-align:center}
.splash small{display:block;font-family:var(--body);font-size:15px;font-weight:700;opacity:.8}
@keyframes splash{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.04)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0}}
.flytok{position:fixed;z-index:44;pointer-events:none;--gs:34px}
@keyframes pop{to{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.float,.splash,.flytok{display:none}}

/*top-above*//*hh*/#modal,#cover{top:var(--hh,0px)!important}#modal>*{max-height:calc(100vh - var(--hh,0px) - 24px)!important;max-height:calc(100dvh - var(--hh,0px) - 24px)!important;overflow:auto}
/*top-above*/header.top{z-index:61!important}
/*NETCSS*//* hall (autonome : portail et jeux) */
#hall-modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;padding:12px}
#hall-modal[hidden]{display:none}
.hall-box{background:#fbf6ea;color:#2a2418;border-radius:16px;max-width:560px;width:100%;max-height:calc(100dvh - 24px);overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;font-family:"Nunito Sans",Karla,system-ui,sans-serif;text-align:left}
.hall-box h2{font-family:Georgia,serif;font-size:24px;margin:0 0 6px;color:#2a2418}
.hall-box h4{font-family:Georgia,serif;font-size:16px;margin:14px 0 6px;color:#2a2418}
.hall-box p{line-height:1.45;margin:6px 0}
.hall-in{font-weight:800;font-size:16px;font-family:inherit;padding:9px 11px;border-radius:9px;border:1px solid #c9b98f;background:#fff!important;color:#2a2418!important;-webkit-text-fill-color:#2a2418!important;caret-color:#2a2418;width:100%;max-width:300px}
.hall-in::placeholder{color:#a3926e!important;-webkit-text-fill-color:#a3926e!important;font-weight:600}
.hall-err{color:#b0412e;font-weight:800;min-height:1.2em;font-size:14px}
.hall-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.hall-btn{font-weight:800;font-size:14px;line-height:1;font-family:inherit;border-radius:9px;padding:8px 12px;border:1px solid #c9b98f;background:#ece3cf;color:#2a2418;cursor:pointer;touch-action:manipulation}
.hall-btn.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}
.hall-btn:disabled{opacity:.5}
.hall-link{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;cursor:pointer}
.hall-note{color:#6b5d40;font-size:14px}
.hall-me{background:#f0e6cf;border-radius:10px;padding:8px 10px;margin:6px 0}
.hall-list{list-style:none;margin:4px 0;padding:0;display:flex;flex-direction:column;gap:5px}
.hall-list li{display:flex;align-items:center;gap:9px;background:#f6efdc;border-radius:10px;padding:6px 8px}
.hall-tx{flex:1;min-width:0;display:flex;flex-direction:column}.hall-tx small{color:#6b5d40;font-size:12.5px}
.hall-av{width:30px;height:30px;border-radius:50%;background:#2a2418;color:#fff;display:grid;place-items:center;font-weight:900;flex:none;text-transform:uppercase}
.hall-games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.hall-spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid #c9b98f;border-top-color:#2a2418;animation:hallr 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes hallr{to{transform:rotate(360deg)}}
.hall-invite{position:fixed;right:12px;bottom:12px;z-index:85;background:#fbf6ea;color:#2a2418;border-radius:14px;padding:12px 14px 14px;box-shadow:0 14px 40px #000b;max-width:min(360px,calc(100vw - 24px));font-family:"Nunito Sans",Karla,system-ui,sans-serif;animation:hallin .35s cubic-bezier(.2,1.3,.4,1);overflow:hidden;border:2px solid #1d8f5a}
.hall-invite .hall-acts{margin-top:8px}
.hall-invite .hall-bar{position:absolute;left:0;bottom:0;height:4px;background:#1d8f5a;width:100%;animation:hallt 30s linear forwards}
@keyframes hallt{to{width:0}}
@keyframes hallin{from{transform:translateY(30px);opacity:0}}
.hall-toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-weight:700;font-family:system-ui,sans-serif}
#hall-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 0}
.hall-pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 13px;border:1px solid rgba(255,255,255,.25);background:rgba(29,143,90,.25);color:#eef3ea;font-weight:700;font-size:14px;line-height:1;font-family:inherit;cursor:pointer}
.hall-pill span{color:#d8b25a}
.hall-sub{font-size:14px;color:#a9c2b3}.hall-sub .hall-link{color:#eef3ea}
.hall-dot{width:9px;height:9px;border-radius:50%;background:#7dffb5;box-shadow:0 0 0 2px #fff4;animation:hallp 1.8s infinite}.hall-dot.off{background:#aaa;animation:none}
@keyframes hallp{50%{box-shadow:0 0 0 5px #7dffb500}}

/* salle en ligne */
#netBtn{display:inline-flex;align-items:center;gap:6px}
#netBtn.net-on{background:#1d8f5a;border-color:#1d8f5a;color:#fff}
.net-dot{width:9px;height:9px;border-radius:50%;background:#7dffb5;box-shadow:0 0 0 2px #fff6;animation:netp 1.8s infinite}
.net-dot.off{background:#ffb347;animation:none}
@keyframes netp{50%{box-shadow:0 0 0 5px #7dffb500}}
.hall-box .net-in,.mbox .net-in{font-family:inherit;font-weight:800;font-size:16px;padding:9px 11px;border-radius:9px;border:1px solid #c9b98f;background:#fff!important;color:#2a2418!important;-webkit-text-fill-color:#2a2418!important;caret-color:#2a2418;width:100%;max-width:280px}
.hall-box .net-in::placeholder,.mbox .net-in::placeholder{color:#a3926e!important;-webkit-text-fill-color:#a3926e!important;font-weight:600}
.hall-box .net-code,.mbox .net-code{letter-spacing:.35em;text-transform:uppercase;font-size:22px;text-align:center;max-width:170px}
.net-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.net-box{border:1px solid #d9caa4;border-radius:12px;padding:10px 12px;background:#f6efdc;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.net-box h4{margin:0!important}.net-box p{margin:0;font-size:14px}
.net-note{font-size:13.5px;color:#6b5d40}
.net-code-big{display:flex;gap:8px;justify-content:center;margin:10px 0}
.net-code-big b{font-family:var(--title,Georgia,serif);font-size:40px;width:58px;height:66px;display:grid;place-items:center;border-radius:12px;background:#2a2418;color:#fff;box-shadow:0 6px 0 #0003}
.net-share{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.net-list{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:5px}
.net-list li{display:flex;align-items:center;gap:8px;font-weight:800;background:#f6efdc;border-radius:10px;padding:6px 9px;flex-wrap:wrap}
.net-list li small{font-weight:600;color:#6b5d40}.net-list li.ai{opacity:.8}
.net-av{width:26px;height:26px;border-radius:50%;background:#2a2418;color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.net-ok{color:#1d7a46;font-weight:800}.net-ko{color:#b0412e;font-weight:800}
.net-wait{display:flex;align-items:center;gap:10px;font-weight:700}
.net-spin{width:18px;height:18px;border-radius:50%;border:3px solid #c9b98f;border-top-color:#2a2418;animation:netr 1s linear infinite;flex:none}
@keyframes netr{to{transform:rotate(360deg)}}
.net-rules{margin-top:6px}
@media (max-width:560px){.net-two{grid-template-columns:1fr}.net-code-big b{font-size:32px;width:50px;height:58px}}
.net-me{background:#f0e6cf;border-radius:10px;padding:8px 10px;margin:6px 0}
.net-link{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;cursor:pointer}
.net-chk{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;margin:6px 0}.net-chk input{width:18px;height:18px}
.net-list li .net-r{margin-left:auto}
/* contrôles dans la boîte du hall (indépendants du jeu) */
.hall-box .btn{background:#ece3cf;color:#2a2418;border:1px solid #c9b98f;border-radius:9px;padding:8px 12px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;line-height:1.1}
.hall-box .btn.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}.hall-box .btn:disabled{opacity:.45;cursor:default}
.hall-box .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.hall-box .seg{display:inline-flex;border:1px solid #c9b98f;border-radius:9px;overflow:hidden;flex-wrap:wrap;margin:2px 0}
.hall-box .seg button{border:0;background:#f6efdc;padding:7px 11px;font-weight:700;color:#2a2418;font-size:13.5px;font-family:inherit;cursor:pointer}
.hall-box .seg button.on{background:#2a2418;color:#fff}
.hall-box .opt{display:flex;align-items:flex-start;gap:8px;margin:6px 0;line-height:1.35}.hall-box .opt input{width:20px;height:20px;flex:none}
.hall-box label{color:#2a2418}
.net-fab{position:fixed;left:10px;bottom:10px;z-index:45;border-radius:999px!important;padding:8px 13px!important;background:#1b1b1f!important;color:#fff!important;border:1px solid #fff4!important;font-weight:800;box-shadow:0 6px 18px #0008;font-family:system-ui,sans-serif}
#netBtn .net-dot{display:inline-block;margin-right:5px;vertical-align:1px}
/*/NETCSS*/</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="crown" viewBox="0 0 20 16"><path d="M1 4 L5.5 9 L10 1.5 L14.5 9 L19 4 L17 14 H3 Z" fill="#f2c443" stroke="#7a5408" stroke-width="1.2" stroke-linejoin="round"/><circle cx="10" cy="1.8" r="1.4" fill="#fff3c0"/></symbol>
  <symbol id="scroll" viewBox="0 0 22 26"><rect x="4" y="3" width="14" height="20" rx="1.5" fill="#efe2c2" stroke="#8a7240" stroke-width="1.2"/><rect x="2" y="1" width="18" height="4" rx="2" fill="#d9c58c" stroke="#8a7240"/><rect x="2" y="21" width="18" height="4" rx="2" fill="#d9c58c" stroke="#8a7240"/><path d="M7 9H15M7 12.5H15M7 16H12" stroke="#8a7240" stroke-width="1.2"/><circle cx="15" cy="17" r="2.6" fill="#b3263a"/></symbol>

<div id="modal" hidden></div>
<script>/*NETJS*//* ===== Hall de la Salle de jeux : joueurs connectés, pseudos uniques, tables ouvertes, invitations (Supabase Realtime, sans base) ===== */
const HALL=(()=>{
 const SB_URL='https://evepcodcppxpufbkuflq.supabase.co', SB_KEY='sb_publishable_iUC6966SeFt_05Iac1wGQw_yDo9zl7y';
 const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
 const SITE='https://mushu1994.github.io/duel-des-ages/';
 const GAMES={"derniere-carte":"Dernière carte","quitte-ou-sept":"Quitte ou Sept","joyaux-renaissance":"Joyaux de la Renaissance","sept-merveilles":"Sept Merveilles","echecs":"Échecs","quatre-en-ligne":"Quatre en ligne","reversi":"Reversi","dames":"Dames","bataille-navale":"Bataille navale","code-secret":"Code Secret","bataille":"La Bataille","petits-chevaux":"Petits Chevaux","dominos":"Dominos","tetes-de-boeuf":"Têtes de Bœuf","plus-bas":"Plus Bas","petit-bac":"Petit Bac","poker":"Poker","president":"Président","tarot":"Tarot","rami":"Rami voleur","remparts":"Remparts","conquete":"Conquête","approche-finale":"Approche finale","duel-des-joyaux":"Duel des Joyaux","duel-des-ages":"Duel des Âges"};
 const q=s=>document.querySelector(s), es=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const ld=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, sv=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
 const note=s=>{ if(typeof toast==='function') return toast(s); const t=document.createElement('div'); t.className='hall-toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); };
 const H={note,ready:false,ok:null,pseudo:ld('net-name')||'',peers:{},me:{},listeners:[],page:'',title:''};
 let cid=ld('net-cid'); if(!cid){ cid=Math.random().toString(36).slice(2,10); sv('net-cid',cid); } H.cid=cid;
 const key=p=>String(p||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[^a-z0-9]/g,'');
 H.key=key;
 let client=null, ch=null, libP=null, syncedP=null, syncRes=null, at=ld('net-at')||Date.now();
 function lib(){ if(window.supabase) return Promise.resolve(); if(libP) return libP; libP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=LIB; s.onload=res; s.onerror=()=>{ libP=null; rej(new Error('lib')); }; document.head.appendChild(s); }); return libP; }
 H.client=async()=>{ await lib(); if(!client) client=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}}); return client; };
 /* ---------- connexion au hall ---------- */
 H.connect=async()=>{ if(ch) return syncedP; syncedP=new Promise(r=>syncRes=r);
   try{ await H.client(); }catch(e){ H.ok=false; paint(); return syncedP; }
   ch=client.channel('salle:hall',{config:{broadcast:{self:false},presence:{key:H.cid}}});
   ch.on('presence',{event:'sync'},onSync);
   ch.on('broadcast',{event:'inv'},({payload:p})=>{ if(p.to===H.cid) invited(p); });
   ch.on('broadcast',{event:'invr'},({payload:p})=>{ if(p.to===H.cid) note(p.ok?`${p.fromP} arrive à ta table`:`${p.fromP} ne peut pas jouer maintenant`); });
   const to=setTimeout(()=>{ if(H.ok==null){ H.ok=false; paint(); syncRes(); } },9000);
   ch.subscribe(async st=>{ if(st==='SUBSCRIBED'){ clearTimeout(to); H.ok=true; await track(); setTimeout(()=>syncRes(),900); paint(); } else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ if(H.ok==null){ H.ok=false; paint(); syncRes(); } } });
   return syncedP; };
 function payload(){ return Object.assign({p:H.pseudo,k:key(H.pseudo),at,g:H.page,gt:H.title},H.me); }
 async function track(){ if(!ch) return; try{ await ch.track(payload()); }catch(e){} }
 function onSync(){ const st=ch.presenceState(), peers={}; for(const k in st){ const m=st[k][st[k].length-1]; if(m) peers[k]=m; } H.peers=peers;
   // doublon de pseudo : le plus récent cède la place
   if(H.pseudo){ const mk=key(H.pseudo); for(const k in peers){ if(k===H.cid) continue; const o=peers[k]; if(o.p&&o.k===mk&&(o.at<at||(o.at===at&&k<H.cid))){ const old=H.pseudo; H.pseudo=''; sv('net-name',null); track(); note(`Le pseudo « ${old} » est déjà utilisé par quelqu’un d’autre`); setTimeout(()=>H.askPseudo(),300); break; } } }
   paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); }
 H.onChange=f=>H.listeners.push(f);
 H.set=o=>{ Object.assign(H.me,o); track(); };
 H.where=(page,title)=>{ H.page=page; H.title=title; track(); };
 H.list=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&m.p).map(([k,m])=>Object.assign({cid:k},m)).sort((a,b)=>a.p.localeCompare(b.p));
 H.count=()=>Object.keys(H.peers).length;
 H.tables=g=>Object.entries(H.peers).map(([k,m])=>m.p&&m.r&&m.r.host&&m.r.open&&!m.r.started&&m.r.n<m.r.max&&(!g||m.r.g===g)?Object.assign({cid:k,p:m.p},m.r):null).filter(Boolean);
 H.free=p=>{ const k=key(p); return !Object.entries(H.peers).some(([c,m])=>c!==H.cid&&m.p&&m.k===k); };
 H.anon=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&!m.p).length;
 /* ---------- pseudo ---------- */
 H.setPseudo=async p=>{ p=String(p||'').replace(/\s+/g,' ').trim(); if(p.length<2||p.length>16||key(p).length<2) return 'Entre 2 et 16 caractères (lettres ou chiffres).';
   if(/^(ordi|ordinateur|bot|ia|robot)\d*$/i.test(key(p))) return 'Ce pseudo est réservé.';
   await H.connect(); if(!H.ok) return 'Connexion impossible pour le moment.';
   if(!H.free(p)) return `« ${p} » est déjà utilisé par quelqu’un en ligne.`;
   H.pseudo=p; at=Date.now(); sv('net-at',at); sv('net-name',p); await track(); paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); return null; };
 H.ensure=()=>H.pseudo?Promise.resolve(H.pseudo):new Promise(res=>H.askPseudo(res));
 H.askPseudo=(cb)=>{ openBox(`<h2>Ton pseudo</h2><p>Il s’affiche pour les autres joueurs connectés. Deux personnes en ligne ne peuvent pas avoir le même.</p>
   <input class="hall-in" id="hallPseudo" maxlength="16" placeholder="Ex. : Mushu" value="${es(H.pseudo||ld('net-last')||'')}"><p class="hall-err" id="hallErr"></p>
   <div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button><button class="hall-btn pri" data-hl="ok">Valider</button></div>`,async e=>{ const b=e.target.closest('[data-hl]'); if(!b) return; if(b.dataset.hl==='close'){ closeBox(); return; }
     const v=q('#hallPseudo').value; b.disabled=true; const err=await H.setPseudo(v); b.disabled=false; if(err){ q('#hallErr').textContent=err; return; } sv('net-last',H.pseudo); closeBox(); if(cb) cb(H.pseudo); });
   const i=q('#hallPseudo'); if(i){ i.focus(); i.onkeydown=e=>{ if(e.key==='Enter') q('[data-hl=ok]').click(); }; } };
 /* ---------- invitations ---------- */
 H.invite=(to,room)=>{ if(!ch) return; ch.send({type:'broadcast',event:'inv',payload:{to,from:H.cid,fromP:H.pseudo,g:room.g,gt:room.gt,code:room.code}}); note(`Invitation envoyée à ${(H.peers[to]||{}).p||'ce joueur'}`); };
 function invited(p){ const id='inv-'+p.code; if(q('#'+id)) return; if(typeof sfx==='function') sfx('ding');
   const d=document.createElement('div'); d.className='hall-invite'; d.id=id;
   d.innerHTML=`<b>${es(p.fromP)}</b> t’invite à jouer à <b>${es(p.gt)}</b><div class="hall-acts"><button class="hall-btn" data-i="no">Pas maintenant</button><button class="hall-btn pri" data-i="ok">Rejoindre</button></div><i class="hall-bar"></i>`;
   document.body.appendChild(d); const t=setTimeout(()=>d.remove(),30000);
   d.onclick=e=>{ const b=e.target.closest('[data-i]'); if(!b) return; clearTimeout(t); d.remove(); const ok=b.dataset.i==='ok';
     if(ch) ch.send({type:'broadcast',event:'invr',payload:{to:p.from,fromP:H.pseudo,ok}}); if(ok) H.goTable(p.g,p.code); }; }
 H.goTable=(g,code)=>{ if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined'){ NET.joinCode(code); return; } location.href=g+'.html?salle='+code; };
 H.inviteFlow=to=>{ const P=H.peers[to]; if(!P) return; const r=H.me.r;
   if(r&&r.host&&!r.started){ H.invite(to,r); return; }
   const opts=Object.entries(GAMES).sort((a,b)=>a[1].localeCompare(b[1],'fr'));
   openBox(`<h2>Inviter ${es(P.p)}</h2><p>Choisis le jeu : une table s’ouvre et l’invitation part tout de suite.</p><div class="hall-games">${opts.map(([g,t])=>`<button class="hall-btn" data-g="${g}">${es(t)}</button>`).join('')}</div><div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button></div>`,e=>{
     const b=e.target.closest('[data-g],[data-hl]'); if(!b) return; if(b.dataset.hl){ closeBox(); return; } const g=b.dataset.g; sessionStorage.setItem('hall-invite',JSON.stringify({to,g})); closeBox();
     if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined') NET.createFor(); else location.href=g+'.html?creer=1'; }); };
 H.pendingInvite=g=>{ try{ const v=JSON.parse(sessionStorage.getItem('hall-invite')||'null'); if(v&&v.g===g){ sessionStorage.removeItem('hall-invite'); return v.to; } }catch(e){} return null; };
 /* ---------- interface ---------- */
 function where(m){ if(m.r&&m.r.started) return `joue à ${es(m.r.gt)}`; if(m.r&&m.r.host) return `ouvre une table de ${es(m.r.gt)}`; if(m.r) return `attend à une table de ${es(m.r.gt)}`; return m.gt?`regarde ${es(m.gt)}`:'sur le portail'; }
 function busy(m){ return m.r&&m.r.started; }
 H.panelHTML=(g)=>{ if(H.ok===false) return `<p class="hall-note">Le salon en ligne n’est pas joignable d’ici.${/github\.io$/.test(location.hostname)?' Vérifie ta connexion.':` Ouvre la salle sur <a href="${SITE}" target="_blank" rel="noopener">le site</a>.`}</p>`;
   if(H.ok==null) return '<p class="hall-note"><span class="hall-spin"></span>Connexion au salon…</p>';
   const tabs=H.tables(g), ppl=H.list();
   return `<div class="hall-me">${H.pseudo?`Ton pseudo : <b>${es(H.pseudo)}</b> <button class="hall-link" data-hl="pseudo">changer</button>`:`<button class="hall-btn pri" data-hl="pseudo">Choisir un pseudo</button> <span class="hall-note">pour apparaître et être invité</span>`}</div>
    <h4>Tables ouvertes${g?'':' (tous les jeux)'}</h4>${tabs.length?`<ul class="hall-list">${tabs.map(t=>`<li><span class="hall-av">${es(t.p[0])}</span><span class="hall-tx"><b>${es(t.gt)}</b><small>table de ${es(t.p)} · ${t.n}/${t.max} joueurs</small></span>${t.cid===H.cid?'<small>ta table</small>':`<button class="hall-btn pri" data-join="${es(t.g)}:${es(t.code)}">Rejoindre</button>`}</li>`).join('')}</ul>`:`<p class="hall-note">Aucune table ouverte${g?' pour ce jeu':''} pour l’instant.</p>`}

}

const cardName=c=>c.n||(c.col==='J'?`un joker${c.jc?' '+NM[c.jc].toLowerCase():''}`:c.col==='X'?'une carte de prestige':`une carte ${NM[c.col].toLowerCase()}`);
function canMain(pi){
  const p=G.P[pi];

  if(G.board.includes('Y')&&p.res.length<3&&(['1','2','3'].some(l=>G.decks[l].length||G.pyr[l].some(Boolean))))return true;

function allBuyables(pi){const p=G.P[pi];const l=[];

  if(G.fakeRow)G.fakeRow.forEach((f,i)=>{if(f&&payPlan(pi,f))l.push({t:'buy',src:'fake',i,card:f});});

/* ===================== IA ===================== */
const LEVELS={facile:{noise:4,deny:0,n:'Facile'},normal:{noise:.8,deny:.6,n:'Normal'},difficile:{noise:.15,deny:1,n:'Difficile'}};
function wouldWin(pi,card){
  const p=G.P[pi];if(card.kind)return points(p)+card.pts>=20;
  const cw=has(p,'win9crown')?9:10,cc=has(p,'win9color')?9:10;
  if(points(p)+card.pts>=20)return true;
  if(p.crowns+card.cr>=cw)return true;
  if(card.col!=='X'&&card.col!=='J'&&colPts(p,card.col)+card.pts>=cc)return true;
  if(card.col==='J'&&COLS.some(c=>bonus(p,c)>0&&colPts(p,c)+card.pts>=cc))return true;
  return false;
}
function cardValue(pi,card){
  const p=G.P[pi];if(card.kind)return fakeValue(pi,card);
  if(wouldWin(pi,card))return 999;
  let v=card.pts*1.7+card.cr*1.6;
  if(card.col!=='X')v+=1.6*(card.col==='J'?1.2:1);
  const cr=p.crowns+card.cr;if((p.crowns<3&&cr>=3)||(p.crowns<6&&cr>=6))v+=3;
  if(card.ab==='replay')v+=2.5;if(card.ab==='steal')v+=1.2;if(card.ab==='priv')v+=1;if(card.ab==='token')v+=.8;
  if(card.col!=='X'&&card.col!=='J'){const cp=colPts(p,card.col);if(cp+card.pts>=6)v+=card.pts;}
  return v;
}
function fakeValue(pi,f){let v=f.pts*1.7;if(f.kind==='passive')v+=2.2;if(f.kind==='active')v+=2;if(f.ab==='crown1')v+=1.6;if(f.ab==='replay')v+=2.5;if(f.ab==='priv2x')v+=2;if(f.ab==='goldTake')v+=1.2;if(points(G.P[pi])+f.pts>=20)v=999;return v;}
function royalValue(pi,r){let v=r.pts*1.7;if(r.ab==='replay')v+=2.5;if(r.ab==='steal'||r.ab==='priv')v+=1.2;if(r.ab==='win9crown')v+=G.P[pi].crowns>=6?4:1.5;if(r.ab==='win9color')v+=COLS.some(c=>colPts(G.P[pi],c)>=6)?4:1.5;if(r.ab==='crowns2')v+=3;if(r.ab==='take3')v+=3;if(r.ab==='gold')v+=1;if(r.ab==='freeFake')v+=2;if(r.ab==='noLimit')v+=1;if(r.ab==='priv2')v+=1.5;if(points(G.P[pi])+r.pts>=20)v=999;return v;}
function targets(pi){
  const p=G.P[pi];const list=[];
  [1,2,3].forEach(l=>G.pyr[l].forEach(c=>{if(c)list.push(c);}));p.res.forEach(c=>list.push(c));
  return list.map(c=>{let miss=0;for(const k in c.cost){if(k==='V')continue;miss+=Math.max(0,c.cost[k]-(k==='P'?0:bonus(p,k))-p.tok[k]);}miss=Math.max(0,miss-p.tok.Y);return{c,v:cardValue(pi,c)/(1+miss*.8),miss};}).sort((a,b)=>b.v-a.v).slice(0,3);
}
function tokNeed(pi,t){
  const p=G.P[pi];let need=0;
  targets(pi).forEach((x,k)=>{const c=x.c;const want=Math.max(0,(c.cost[t]||0)-(t==='P'||t==='V'||t==='Y'?0:bonus(p,t))-p.tok[t]);need+=Math.min(want,2)*(k===0?1.4:.7);});
  if(t==='V'&&G.fakeRow)need+=.6;
  return need+.15;
}
function lines(){
  const out=[];const D=[[1,0],[0,1],[1,1],[1,-1]];
  for(let i=0;i<25;i++){if(!G.board[i]||G.board[i]==='Y')continue;out.push([i]);
    const x=i%5,y=(i/5)|0;
    for(const[dx,dy] of D){const a=[i];for(let k=1;k<3;k++){const nx=x+dx*k,ny=y+dy*k;if(nx<0||nx>4||ny<0||ny>4)break;const j=ny*5+nx;if(!G.board[j]||G.board[j]==='Y')break;a.push(j);out.push(a.slice());}}}
  return out;
}
async function aiTurn(pi){
  await sleep(G.fast?0:700);
  const p=G.P[pi],o=G.P[1-pi],W=LEVELS[G.level||'normal'];
  const r=()=>Math.random()*W.noise;
  // actions optionnelles
  for(const f of p.fakes){if(f.kind==='active'&&!p.used[f.ab]&&p.tok.V>=f.pay&&f.ab!=='actRefill'&&!(f.ab==='actSteal'&&ntok(o)===0)&&Math.random()<.7)return{t:'act',ab:f.ab};}
  if(p.priv>0&&ntok(p)<=8){const best=G.board.map((t,i)=>t&&t!=='Y'?{i,v:tokNeed(pi,t)}:null).filter(Boolean).sort((a,b)=>b.v-a.v)[0];if(best&&best.v>1.2&&Math.random()<.6)return{t:'priv',idx:[best.i]};}
  if(boardCount(t=>t!=='Y')<=3&&G.bag.length>=4)return{t:'refill'};
  if(!canMain(pi)&&G.bag.length)return{t:'refill'};
  const opts=[];
  allBuyables(pi).forEach(b=>opts.push({v:cardValue(pi,b.card)+1+r(),a:b}));
  // menace : l'adversaire gagnerait avec une carte de la pyramide
  if(W.deny&&G.board.includes('Y')&&p.res.length<3)[1,2,3].forEach(l=>G.pyr[l].forEach((c,i)=>{if(c&&payPlan(1-pi,c)&&wouldWin(1-pi,c))opts.push({v:60*W.deny+r(),a:{t:'reserve',src:'pyr',lvl:l,i}});}));
  const room=10-ntok(p);
  lines().forEach(L=>{const toks=L.map(i=>G.board[i]);let v=toks.reduce((a,t)=>a+tokNeed(pi,t),0);
    if(L.length>room)v-=(L.length-room)*1.5;
    const same=toks.length===3&&toks.every(t=>t===toks[0]);const pearls=toks.filter(t=>t==='P').length>=2;if(same||pearls)v-=1.8;
    opts.push({v:v+r()*.5,a:{t:'take',idx:L}});});
  if(G.board.includes('Y')&&p.res.length<3){
    [1,2,3].forEach(l=>G.pyr[l].forEach((c,i)=>{if(c&&!payPlan(pi,c)){const v=cardValue(pi,c)*.35+.9+(p.tok.Y===0?.6:0);opts.push({v:v+r(),a:{t:'reserve',src:'pyr',lvl:l,i}});}}));
  }
  if(!opts.length)return G.bag.length?{t:'refill'}:{t:'pass'};
  opts.sort((a,b)=>b.v-a.v);
  const best=opts[0].a;
  if(!G.fast&&(best.t==='buy'||best.t==='reserve')){G.hl=best;render();await sleep(550);G.hl=null;}
  if(!G.fast&&best.t==='take'){SEL=best.idx.slice();render();await sleep(500);SEL=[];}
  return best;
}

  return new Promise(res=>{askResolve=i=>{askResolve=null;closeModal(true);res(i);};
    openModal(`<h3>${esc(title)}</h3>${cfg.sub?`<p class="sub">${cfg.sub}</p>`:''}<div class="opts">${opts.map((o,i)=>`<button class="opt" data-a="ask" data-v="${i}">${o.html||''}<span class="ot">${o.label?`<b>${esc(o.label)}</b>`:''}${o.desc?`<span>${esc(o.desc)}</span>`:''}</span></button>`).join('')}</div>`,{forced:true,who:pi});});

function askModal(a){ openModal(`<h3>${esc(a.title)}</h3>${a.sub?`<p class="sub">${a.sub}</p>`:''}<div class="opts">${a.opts.map((o,i)=>`<button class="opt" data-a="ask" data-v="${i}">${o.html||''}<span class="ot">${o.label?`<b>${esc(o.label)}</b>`:''}${o.desc?`<span>${esc(o.desc)}</span>`:''}</span></button>`).join('')}</div>`,{forced:true,who:a.pi}); }
function newGame(mode,opts){
  GEN++;uiResolve=askResolve=null;closeModal(true);UID=0;SEL=[];
  const d=buildDecks();const decks={};for(const l of [1,2,3])decks[l]=shuffle(d[l]).map(c=>({...c,lvl:l,id:++UID}));
  G={mode,level:opts.level||'normal',mods:{royalsExt:!!opts.royalsExt,fakes:!!opts.fakes},fast:mode==='aiai'&&IS_NODE,board:Array(25).fill(null),bag:[],decks,pyr:{1:[],2:[],3:[]},privSupply:3,cur:0,turn:0,log:[],over:null,awaiting:null,hl:null,
    P:[mkP(mode==='hot'?'Joueur 1':'Toi'),mkP(mode==='hot'?'Joueur 2':'IA')]};
  if(mode==='aiai'){G.P[0].name='IA Aube';G.P[1].name='IA Nuit';}
  for(const c of COLS)for(let k=0;k<4;k++)G.bag.push(c);G.bag.push('P','P','Y','Y','Y');
  if(G.mods.fakes){for(let k=0;k<4;k++)G.bag.push('V');G.fakeDeck=shuffle(FAKES).map(f=>({...f,id:++UID,kind:f.kind}));G.fakeRow=[G.fakeDeck.pop(),G.fakeDeck.pop(),G.fakeDeck.pop()];}
  G.royals=G.mods.royalsExt?ROYALS.concat(shuffle(ROYALS_EXT).slice(0,2)):ROYALS.slice();
  [[1,5],[2,4],[3,3]].forEach(([l,n])=>{for(let k=0;k<n;k++)G.pyr[l].push(G.decks[l].pop());});
  refill();gainPriv(1);
  log('La partie commence. Le second joueur reçoit un privilège.');

}
async function runGame(res){
  let pi=res?res.pi:0,prev=-1,replay=false;
  while(!G.over){
    G.turn++;if(G.turn>300){G.over={winner:points(G.P[0])===points(G.P[1])?null:points(G.P[0])>points(G.P[1])?0:1,type:'limite'};break;}
    G.cur=pi;G.P[pi].used={};saveGame(pi);
    if(pi!==prev||replay){splash(pi,replay?'Tour supplémentaire':'');}prev=pi;
    render();
    replay=await playTurn(pi);
    await discardExcess(pi);
    const w=checkWin(pi);if(w){G.over={winner:pi,type:w};break;}
    if(!replay)pi=1-pi;else log(`${G.P[pi].name} rejoue.`);
    if(!SIM&&!G.fast&&!IS_NODE&&G.turn%5===0&&!NETON())await updateOdds(pi);
  }
  clearSave();render();showEnd();
}
async function playTurn(pi){
  while(true){
    const act=isAI(pi)?await aiTurn(pi):await waitHuman(pi);
    G.awaiting=null;
    if(act.t==='priv'){await usePriv(pi,act.idx);render();continue;}
    if(act.t==='refill'){await doRefill(pi,false);render();continue;}
    if(act.t==='act'){await useActive(pi,act.ab);if(G.over)return false;render();continue;}
    if(act.t==='pass'){log(`${G.P[pi].name} ne peut rien faire.`);return false;}
    if(act.t==='take'){await doTake(pi,act.idx);return false;}
    if(act.t==='reserve'){await doReserve(pi,act);return false;}
    if(act.t==='buy'){return await doBuy(pi,act);}
  }
}
function finalWinner(){return G.over?G.over.winner:null;}

/* Chances de victoire : simulation de fins de partie depuis la situation actuelle */
async function simulate(n,pi){
  const real=G,ru=UID;const w=[0,0,0];SIM=true;
  try{for(let k=0;k<n;k++){
    G=JSON.parse(JSON.stringify(real));G.mode='aiai';G.fast=true;G.level='normal';G.over=null;G.log=[];G.awaiting=null;G.hl=null;
    await runGame({pi});const x=G.over?G.over.winner:null;w[x==null?2:x]++;
    if(k%10===9){G=real;SIM=false;await new Promise(r=>setTimeout(r,0));SIM=true;}
  }}finally{G=real;UID=ru;SIM=false;}
  return w;
}
async function updateOdds(pi){
  const N=100;G.oddsBusy=true;render();
  const w=await simulate(N,pi);
  G.odds={p:[Math.round(w[0]/N*100),Math.round(w[1]/N*100)],tie:Math.round(w[2]/N*100),turn:G.turn};G.oddsBusy=false;render();
}

    <div class="sub" style="margin:6px 0 0">Calculé au tour ${o.turn} en jouant 100 fins de partie possibles. Prochaine mise à jour au tour ${next}.</div>`:`<div class="sub" style="margin:0">Première estimation au tour 5, puis tous les 5 tours.</div>`;
  return `<section class="box" id="oddsbox"><h3>Chances de victoire${G.oddsBusy?' <small>calcul…</small>':''}</h3>${body}</section>`;
}

function describe(c){
  const L=[];
  if(c.kind){L.push(c.d);L.push(`Type : ${c.kind==='passive'?'effet permanent':c.kind==='once'?'effet immédiat':'action une fois par tour'}`);}
  else{
    L.push(c.col==='X'?'Pas de bonus de couleur.':c.col==='J'?'Joker : prend la couleur d’une de tes cartes à l’achat (il en faut au moins une).':`Bonus permanent : 1 ${NM[c.col].toLowerCase()} de réduction sur tes achats.`);
    if(c.pts)L.push(pl(c.pts,'point')+' de prestige');if(c.cr)L.push(pl(c.cr,'couronne'));if(c.ab)L.push(ABD[c.ab]);
  }

}

function onCard(src,lvl,i){

/* Animations et sons */
let prev=null;
function floatAt(el,html,cls){if(!el)return;const r=el.getBoundingClientRect();if(!r.width)return;const d=document.createElement('div');d.className='float '+cls;d.innerHTML=html;d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top-6)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1700);}
function animateDiffs(){if(!G){prev=null;return;}const now={g:GEN,v:G.P.map(p=>({pts:points(p),cr:p.crowns}))};
  if(prev&&prev.g===GEN)now.v.forEach((n,i)=>{const d=n.pts-prev.v[i].pts,c=n.cr-prev.v[i].cr;if(d>0){floatAt($('pts'+i),`+${d} pts`,'pts');setTimeout(()=>sfx('pts'),200);}if(c>0)setTimeout(()=>floatAt($('pts'+i),`+${c} ${crownS.replace('<svg','<svg style="width:18px;height:18px"')}`,'gain'),300);});
  prev=now;}
function flyTokens(idx,pi){if(IS_NODE||G.fast)return;try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
  const dst=$('tk'+pi);if(!dst)return;const b=dst.getBoundingClientRect();
  idx.forEach((i,k)=>{const cell=document.querySelector(`.cell[data-v="${i}"]`);if(!cell||!G.board[i])return;const a=cell.getBoundingClientRect();
    const el=document.createElement('div');el.className='flytok';el.innerHTML=gemH(G.board[i]);el.style.left=a.left+'px';el.style.top=a.top+'px';document.body.appendChild(el);
    const an=el.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${(b.left-a.left)*.5}px,${(b.top-a.top)*.5-40}px) scale(1.3)`,offset:.5},{transform:`translate(${b.left-a.left}px,${b.top-a.top}px) scale(.6)`,opacity:.3}],{duration:650,delay:k*90,easing:'ease-in-out',fill:'forwards'});an.onfinish=()=>el.remove();setTimeout(()=>el.remove(),1200);});}
async function flyCard(act,pi){if(IS_NODE||G.fast)return;try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
  sfx('card');const sel=act.src==='pyr'?`[data-a="card"][data-v="${act.lvl}-${act.i}"]`:act.src==='fake'?`[data-a="fakebuy"][data-v="${act.i}"]`:`[data-a="res"][data-v="${pi}-${act.i}"]`;
  const src=document.querySelector(sel),dst=$('pl'+pi);if(!src||!dst)return;const a=src.getBoundingClientRect(),b=dst.getBoundingClientRect();
  const c=src.cloneNode(true);c.style.cssText=`position:fixed;left:${a.left}px;top:${a.top}px;z-index:44;pointer-events:none;margin:0`;document.body.appendChild(c);src.style.visibility='hidden';
  const an=c.animate([{transform:'none'},{transform:`translate(${(b.left+b.width/2-a.left-a.width/2)}px,${(b.top+40-a.top)}px) scale(.4)`,opacity:.4}],{duration:600,easing:'ease-in',fill:'forwards'});
  await new Promise(r=>{an.onfinish=r;setTimeout(r,800);});c.remove();}
function splash(pi,sub){if(IS_NODE||G.fast)return;sfx('turn');const d=document.createElement('div');d.className='splash'+(FF&&pi===1?' flip':'');d.style.setProperty('--tc',`var(--p${pi})`);d.innerHTML=`<div>${G.mode==='ai'?(pi===0?'À toi de jouer':'Tour de l’IA'):esc(G.P[pi].name)+', à toi'}${sub?`<small>${sub}</small>`:''}</div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1300);}
let AC=null,MUTED=false;try{MUTED=typeof localStorage!=='undefined'&&localStorage.getItem('ddj-mute')==='1';}catch(e){}
function ac(){if(IS_NODE)return null;if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
function tn(a,t,f,d,type,v,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function sfx(n){if(IS_NODE||MUTED||(G&&G.fast))return;const a=ac();if(!a||a.state!=='running')return;const t=a.currentTime+.01;
  if(n==='token')[2400,3000].forEach((f,k)=>tn(a,t+k*.05,f,.15,'sine',.1));
  if(n==='card'){tn(a,t,700,.12,'triangle',.05,300);}
  if(n==='pts'){tn(a,t,880,.25,'sine',.12);tn(a,t+.1,1320,.35,'sine',.1);}
  if(n==='turn'){tn(a,t,523,.3,'sine',.07);tn(a,t+.08,784,.35,'sine',.05);}
  if(n==='deal')for(let k=0;k<6;k++)tn(a,t+k*.05,2000+k*200,.08,'sine',.05);
  if(n==='lose'){tn(a,t,520,.25,'square',.04,260);}
  if(n==='win')[523,659,784,1046].forEach((f,k)=>tn(a,t+k*.12,f,.35,'triangle',.11));}

/* Événements */
if(!IS_NODE){
document.addEventListener('click',e=>{
  if(!MUTED)ac();
  if(e.target.id==='modal'){closeModal(false);return;}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
  const me=AW();
  switch(a){
    case 'ask':if(NET.guest){ if(G.ask&&G.ask.pi===NET.seat){ closeModal(true); G.ask=null; NET.act('ask',[NET.seat,+v]); } break; }if(askResolve)askResolve(+v);break;
    case 'act':resolveAct(sheetActs[+v]);break;
    case 'close':closeModal(false);break;
    case 'cell':{if(me==null)return;const i=+v;if(!G.board[i])return;if(G.board[i]==='Y'){info('L’or ne se prend pas','<p>Pour obtenir un or, réserve une carte : touche une carte de la pyramide ou une pioche, puis « Réserver ».</p>');return;}const k=SEL.indexOf(i);if(k>=0)SEL.splice(k,1);else{SEL.push(i);if(SEL.length>3)SEL.shift();}render();break;}
    case 'clear':SEL=[];render();break;
    case 'take':if(me!=null&&validLine(SEL))resolveAct({t:'take',idx:SEL.slice()});break;
    case 'priv':if(me!=null)resolveAct({t:'priv',idx:SEL.slice()});break;
    case 'refill':if(me!=null)resolveAct({t:'refill'});break;
    case 'card':{const[l,i]=v.split('-').map(Number);onCard('pyr',l,i);break;}
    case 'fakebuy':onCard('fake',0,+v);break;
    case 'deck':{if(me==null)return;const l=+v;const p=G.P[me];if(!G.decks[l].length)return;sheetActs=[{t:'reserve',src:'deck',lvl:l}];openModal(`<h3>Pioche de niveau ${['','I','II','III'][l]}</h3><p class="sub">${pl(G.decks[l].length,'carte')} restante(s). Tu peux réserver la carte du dessus sans la voir.</p><div class="acts"><button class="act main" data-a="act" data-v="0" ${p.res.length>=3||!G.board.includes('Y')?'disabled':''}><b>Réserver la carte cachée (+1 or)</b><span>${p.res.length>=3?'Déjà 3 réservations':!G.board.includes('Y')?'Plus d’or sur le plateau':''}</span></button></div><button class="ghost" data-a="close">Fermer</button>`);break;}
    case 'res':{const[pp,i]=v.split('-').map(Number);const c=G.P[pp].res[i];if(isAI(pp)&&G.mode==='ai'){info('Carte réservée','<p class="sub">L’IA garde cette carte secrète.</p>');return;}if(me===pp){const pay=payPlan(pp,c);cardSheet(c,[{label:'Acheter',sub:payText(pp,c),dis:!pay,act:{t:'buy',src:'res',i}}]);}else cardSheet(c,[],'Carte réservée.');break;}
    case 'fake':{const[pp,ab]=[+v.split('-')[0],v.split('-').slice(1).join('-')];const p=G.P[pp];const f=p.fakes.find(x=>(x.ab||x.n)===ab);if(!f)return;const can=me===pp&&f.kind==='active'&&!p.used[f.ab]&&p.tok.V>=f.pay;sheetActs=[{t:'act',ab:f.ab}];openModal(`<h3>${esc(f.n)}</h3><p>${esc(f.d)}</p>${f.kind==='active'?`<div class="acts"><button class="act main" data-a="act" data-v="0" ${can?'':'disabled'}><b>Utiliser (${f.pay} verre${f.pay>1?'s':''})</b><span>${p.used[f.ab]?'Déjà utilisé ce tour':me!==pp?'Ce n’est pas ton tour':p.tok.V<f.pay?'Pas assez de verre':'Action gratuite, avant ton action principale'}</span></button></div>`:''}<button class="ghost" data-a="close">Fermer</button>`);break;}
    case 'help':showHelp(v||'bases');break;
    case 'ffset':FF=v==='1';try{localStorage.setItem('salle-ff',FF?'1':'0');}catch(e){}render();break;
    case 'ff':FF=!FF;try{localStorage.setItem('salle-ff',FF?'1':'0');}catch(e){}render();break;
    case 'sound':MUTED=!MUTED;try{localStorage.setItem('ddj-mute',MUTED?'1':'0');}catch(e){}render();break;
    case 'menu':if(NET.onNew&&NET.onNew())break;GEN++;uiResolve=askResolve=null;closeModal(true);G=null;render();scrollTo(0,0);break;
    case 'mode':MENU.mode=v;render();break;
    case 'level':MENU.level=v;render();break;
    case 'mod':MENU[v]=!MENU[v];render();break;
    case 'start':clearSave();newGame(MENU.mode,MENU);scrollTo(0,0);break;
    case 'again':if(NETON()){ if(NET.host){ closeModal(true); NET.restart(); } break; }clearSave();newGame(G.mode,{level:G.level,...G.mods});scrollTo(0,0);break;
    case 'resume':{const d=loadSave();if(d)resumeGame(d);scrollTo(0,0);break;}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal(false);});
window.DDJ={get G(){return G;}};
let ENDSH=false, ASKSH=null;
window.NETGAME={id:'duel-des-joyaux',title:'Duel des Joyaux',min:2,max:2,btnHost:'.top .hrow',
  rules(){ return `<label class="opt"><input type="checkbox" data-o="royalsExt" ${MENU.royalsExt?'checked':''}><span><b>Royales supplémentaires</b></span></label><label class="opt"><input type="checkbox" data-o="fakes" ${MENU.fakes?'checked':''}><span><b>Les Faussaires</b></span></label>`; },
  rulesClick(e){ const x=e.target.closest('[data-o]'); if(!x) return false; document.querySelectorAll('#hall-box [data-o]').forEach(i=>{ MENU[i.dataset.o]=i.checked; }); return true; },
  start(list){ clearSave(); ENDSH=false; newGame('net',{level:(list.find(x=>x.ai)||{}).level||MENU.level,royalsExt:MENU.royalsExt,fakes:MENU.fakes}); list.forEach((x,i)=>{ G.P[i].name=x.name; G.P[i].cid=x.cid||null; G.P[i].ai=!!x.ai; }); NET.push(null,'new'); render(); },
  state:()=>G, busy:()=>false, resume(){ if(G.ask&&G.P[G.ask.pi].ai&&askResolve) askResolve(0); },
  act(seat,fn,args){ if(!G||G.over||args[0]!==seat) return false;
    if(fn==='ui'){ if(G.awaiting!==seat||!uiResolve) return false; const a=args[1]||{}; if(!['priv','refill','act','pass','take','reserve','buy'].includes(a.t)) return false; const r=uiResolve; uiResolve=null; G.awaiting=null; r(a); return true; }
    if(fn==='ask'){ if(!G.ask||G.ask.pi!==seat||!askResolve) return false; const i=+args[1]; if(!(i>=0&&i<G.ask.opts.length)) return false; askResolve(i); return true; } return false; },
  async receive(m){ if(m.kind==='lobby'){ GEN++; G=null; render(); return; } if(m.kind==='new'){ ENDSH=false; ASKSH=null; closeModal(true); }
    G=m.G; render();
    const k=G.ask&&G.ask.pi===NET.seat?JSON.stringify(G.ask):null; if(k&&k!==ASKSH){ ASKSH=k; askModal(G.ask); } else if(!k&&ASKSH){ ASKSH=null; closeModal(true); }
    if(G.over&&!ENDSH){ ENDSH=true; closeModal(true); showEnd(); } },
  menuLocal(){ G=null; render(); },
  leave(){ GEN++; uiResolve=askResolve=null; G=null; render(); } };
try{window.claude?.hot?.snapshot?.(()=>({ddj:window.__ddj||null}));}catch(e){}
let hd=null;try{hd=window.claude?.hot?.data?.ddj||null;}catch(e){}
if(hd&&!hd.G.over)resumeGame(hd);else render();
}
if(IS_NODE)module.exports={newGame,get G(){return G},points,checkWin,simulate,setG:g=>{G=g}};
