/* ===== Salle en ligne : tables (Supabase Realtime, l'hôte fait tourner la partie), sur le hall commun =====

const NET=(()=>{

 /* ---------- connexion à une table ---------- */
 async function connect(code,asHost){ client=await HALL.client();

 /* ---------- interface ---------- */

    else { if(!deathSeen[i]) deathSeen[i]=now; const dtd=(now-deathSeen[i])/1000; x=BX+SPEED*(b.dk||0)*DT-cam; y=Math.min(GROUND-R,(b.dy||300)+.5*GRAV*dtd*dtd); vy=600; if(x<-30) return; }
    bird(ctx,x,y,vy,P.col,.55,false,t); ARC.text(ctx,P.name,x,y-R-14,11,'#fff','#000a'); });
  if(me!=null&&S.players[me]&&B){ const y=S.phase==='count'&&B.k===0?300+Math.sin(t*3)*8:B.y; let x=BX; if(!B.al&&B.dk!=null){ x=BX+SPEED*B.dk*DT-cam; }
    let yy=y; if(!B.al){ if(!deathSeen.me) deathSeen.me=now; const d=(now-deathSeen.me)/1000; yy=Math.min(GROUND-R,B.y+.5*GRAV*d*d); }
    if(x>-30) bird(ctx,x,yy,B.al?B.vy:600,S.players[me].col,1,true,t); }
  if(S.phase==='play'||S.phase==='res') ARC.text(ctx,String(me!=null&&B?B.s:scoreAt(K)),VW/2,70,54,'#fff','#0007');
  if(S.phase==='count'||(run&&now<RD.t0)){ const n=Math.max(1,Math.ceil((RD.t0-now)/1000)); ARC.text(ctx,`Manche ${S.round} / ${S.rounds}`,VW/2,170,28,'#fff','#0008'); ARC.text(ctx,String(n),VW/2,250,90,'#ffe066','#0008'); ARC.text(ctx,ARC.coarse?'Touche l’écran pour voler':'Espace ou clic pour voler',VW/2,470,18,'#fff','#0008'); if(n!==draw.lastN){ draw.lastN=n; sfx('beep'); } } else draw.lastN=null;
  if(S.phase==='play'&&B&&!B.al&&me!=null) ARC.text(ctx,'Tombé ! Regarde les autres…',VW/2,140,20,'#fff','#0008');
  if(S.phase==='res'&&S.last){ ctx.fillStyle='#0008'; A2(ctx); ARC.text(ctx,`Manche ${S.round}`,VW/2,180,30,'#ffe066','#0008'); S.last.order.slice(0,6).forEach((i,j)=>ARC.text(ctx,`${j+1}. ${S.players[i].name} · ${S.last.s[j]}`,VW/2,230+j*34,22,i===me?'#ffe066':'#fff','#0008')); } }
function A2(ctx){ ARC.rrect(ctx,30,140,VW-60,300,18); ctx.fill(); }
function pillar(ctx,x,y,w,h,top){ if(h<=0) return; ctx.fillStyle='#8f9bb0'; ctx.fillRect(x+4,y,w-8,h); ctx.fillStyle='#6d7890'; ctx.fillRect(x+w-16,y,12,h); ctx.fillStyle='#b4bfd2'; ctx.fillRect(x+6,y,8,h);
  ctx.strokeStyle='#5b657a55'; ctx.lineWidth=1; for(let yy=y+(top?h%22:22);yy<y+h;yy+=22){ ctx.beginPath(); ctx.moveTo(x+4,yy+.5); ctx.lineTo(x+w-4,yy+.5); ctx.stroke(); }
  const cy=top?y+h-20:y; ctx.fillStyle='#7a869c'; ctx.fillRect(x-2,cy,w+4,20); ctx.fillStyle='#a8b3c6'; ctx.fillRect(x-2,cy,w+4,5); ctx.fillStyle='#4f8f3e'; if(!top){ ctx.fillRect(x-2,cy,w+4,4); for(let i=0;i<5;i++){ ctx.beginPath(); ctx.ellipse(x+6+i*14,cy+3,6,4,0,0,7); ctx.fill(); } } }
function hud(now){ const S=host()?G:snap.cur; window.ARC_PLAYING=!!(S&&S.phase!=='over'); const me=ARC.seat();
  if(!S){ ARC.status('Piaf','Choisis un mode : en ligne ou entraînement.','#2a7ab8'); $('#board').innerHTML=''; return; }
  const P=me!=null?S.players[me]:null; const msg=S.phase==='over'?'Partie terminée':S.phase==='count'?'Prêt ?':S.phase==='res'?'Fin de la manche':!P?'Tu regardes':B&&B.al?'vole !':'tombé';
  ARC.status(P?esc(P.name):'Spectateur',msg,P?P.col:'#2a7ab8',`Manche ${S.round}/${S.rounds}`);
  const K=Math.max(0,Math.floor((now-RD.t0)/1000/DT));
  const rows=S.players.map((p,i)=>{ const b=S.b[i]||{}; const live=i===me&&B?B.s:b.al&&S.phase==='play'?scoreAt(K):b.s||0; return {name:p.name,col:p.col,me:i===me,out:S.phase==='play'&&!(i===me&&B?B.al:b.al),score:G&&S.rounds>1?`${S.pts[i]+(S.phase==='play'||S.phase==='count'?live:0)}`:live,tag:S.rounds>1?(S.wins[i]?'★'.repeat(S.wins[i]):''):''}; });
  rows.sort((a,b)=>(+b.score)-(+a.score)); ARC.board($('#board'),rows); }
function onEvent(e){ const me=ARC.seat(), S=host()?G:snap.cur;
  if(e.t==='go') sfx('go'); else if(e.t==='die'&&e.s!==me) sfx('pop');
  else if(e.t==='rend'){ if(e.w>=0){ if(e.w===me) { sfx('win'); } banner(e.w===me?'Manche gagnée !':`${S.players[e.w].name} gagne la manche`,null,S.players[e.w].col); } }
  else if(e.t==='over') setTimeout(showEnd,400); }
function showEnd(){ const S=host()?G:snap.cur; if(!S||S.phase!=='over') return; const me=ARC.seat(); const r=S.players.map((p,i)=>({name:p.name,col:p.col,me:i===me,pts:S.pts[i],w:S.wins[i]})).sort((a,b)=>(b.pts-a.pts)||(b.w-a.w));
  if(r.length===1){ const best=Math.max(load('piaf-best')||0,r[0].pts); store('piaf-best',best); }
  if(r[0].me&&r.length>1){ sfx('win'); confetti([r[0].col,'#fff','#ffe066']); }
  ARC.endBox(r.length>1?`${r[0].name} gagne !`:`${r[0].pts} colonnes`,r.map(x=>Object.assign(x,{score:`${x.pts}${S.rounds>1&&x.w?' · '+'★'.repeat(x.w):''}`})),()=>startLocal()); }
/* ---------- boucle ---------- */
ARC.loop((dt,now)=>{ const S=host()?G:snap.cur; if(S){ sync(S,now); stepOwn(S,now); }
  if(G&&host()){ hostStep(now); if(ARC.net()){ if(G.phase==='over'){ if(draw.over!==G.gid){ draw.over=G.gid; ARC.push(G,0,true); } } else if(L.dirty){ if(ARC.push(G,110)) L.dirty=false; } else ARC.push(G,1000); } }
  if(S) ARC.events(S,onEvent); draw(now); hud(now); });
/* ---------- menu, options ---------- */
const BOTS=['Ada','Hal','Pixel','Nova','Atlas','Écho','Zéphyr'];
function startLocal(){ const me=(typeof HALL!=='undefined'&&HALL.pseudo)||'Toi'; const list=[{name:me}]; for(let i=0;i<OPT.bots;i++) list.push({ai:true,name:BOTS[i],level:OPT.level}); newGame(list); }
function optsHTML(local){ const sg=(k,vals)=>`<div class="seg">${vals.map(([v,l])=>`<button class="${OPT[k]==v?'on':''}" data-o="${k}:${v}">${l}</button>`).join('')}</div>`;
  return `<h4>Écart entre les colonnes</h4>${sg('diff',[['facile','Large'],['normal','Normal'],['difficile','Serré']])}<p class="optnote">L’écart se resserre un peu à chaque colonne.</p>
   <h4>Manches</h4>${sg('rounds',[[1,'1'],[3,'3'],[5,'5']])}
   ${local?`<h4>Oiseaux de l’ordinateur</h4>${sg('bots',[[0,'0'],[1,'1'],[3,'3'],[5,'5']])}${OPT.bots?sg('level',[['facile','facile'],['normal','normal'],['difficile','difficile']]):''}`:''}`; }
function setOpt(b){ const [k,v]=b.dataset.o.split(':'); OPT[k]=/^\d+$/.test(v)?+v:v; store('piaf-opt',OPT); }
function menu(){ const best=load('piaf-best'); const draw=()=>openModal(`<h2>Piaf</h2><p>Tous les oiseaux dans le même parcours : passe entre les colonnes le plus loin possible. Le dernier en l’air gagne la manche.</p>
   <div class="bigchoice"><button class="pri" data-m="online"><b>Jouer en ligne</b><small>Avec tes amis connectés, chacun sur son écran.</small></button><button data-m="solo"><b>S’entraîner</b><small>Seul ou contre l’ordinateur, sans connexion.${best?` Record : ${best}.`:''}</small></button></div>
   <div class="opts">${optsHTML(true)}</div><div class="acts">${G?'<button class="btn" data-c="close">Fermer</button>':''}</div>`,e=>{ const o=e.target.closest('[data-o]'); if(o){ setOpt(o); draw(); return; }
   const m=e.target.closest('[data-m]'); if(!m) return; closeModal(); if(m.dataset.m==='online') NET.startUI(); else startLocal(); }); draw(); }
function help(){ helpTabs('Piaf',[['But du jeu','<p>Chaque joueur guide son oiseau dans le même parcours de colonnes. Chaque battement d’ailes le fait remonter, sinon il retombe. Toucher une colonne ou le sol, c’est la chute.</p><p>Chaque colonne franchie rapporte 1 point. La manche s’arrête quand tous les oiseaux sont tombés ; le dernier en l’air la gagne (★). Après toutes les manches, le total de colonnes décide du vainqueur.</p>'],['Commandes','<ul><li><b>Écran tactile</b> : touche n’importe où sur le jeu.</li><li><b>Clavier</b> : barre d’espace ou flèche du haut. <b>Souris</b> : clic.</li></ul><p class="ex">Astuce : des battements courts et réguliers valent mieux qu’un gros coup d’ailes.</p>'],['En ligne','<p>Les autres oiseaux apparaissent en transparence avec leur pseudo. Chacun voit le même parcours, et ton oiseau réagit sans aucun délai même si la connexion est lente.</p><p class="ex">Garde le jeu à l’écran pendant la partie : si l’hôte passe sur une autre appli, le jeu se fige pour tout le monde jusqu’à son retour.</p>']]); }
window.GAME={help,menu};
window.NETGAME={id:'piaf',title:'Piaf',min:1,max:8,
  rules:()=>`<div class="opts">${optsHTML(false)}</div>`, rulesClick(e){ const b=e.target.closest('[data-o]'); if(!b) return false; setOpt(b); return true; },
  start(list){ closeModal(); newGame(list); NET.push(null,'new'); }, state:()=>G, busy:()=>false, resume(){},
  act(seat,fn,args){ if(!G||!G.b[seat]) return false; const cur=G.b[seat]; const [k,y,v]=args.map(Number);
    if(fn==='f'){ if(!cur.al||k<cur.k) return true; G.b[seat]={k,y,vy:v,al:1,s:scoreAt(k)}; L.dirty=true; return true; }
    if(fn==='x'){ if(!cur.al) return true; G.b[seat]={k,y,vy:0,al:0,dk:k,dy:y,s:v}; L.dirty=true; emit({t:'die',s:seat}); return true; } return false; },
  async receive(m){ if(m.kind==='lobby'){ G=null; snap.reset(null); return; } const S=m.G; if(!S) return; if(!snap.cur||snap.cur.gid!==S.gid||m.kind==='new'){ closeModal(); snap.reset(S); } else snap.push(S); G=S; },
  leave(){ G=null; L=null; snap.reset(null); RD={rid:null,t0:0}; B=null; menu(); } };
const skip=/[?&](salle|creer)=/.test(location.search)||(()=>{ const s=load('net-sess'); return s&&s.game==='piaf'&&!s.host; })(); setTimeout(()=>{ if(!G&&!NET.on&&!skip) menu(); },60);
})();
