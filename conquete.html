<style>
/* Salle des cartes d'état-major : carte du monde sur table lumineuse au centre, registre des armées à droite, ordres en bas */
:root{--bg:#1b2026;--fg:#eef1f4;--accent:#c0392b;--title:"Alegreya SC",Georgia,serif;--ui:"Nunito Sans",system-ui,sans-serif;--titlec:#f3e3b8;--sea:#a9c9d6;--sea2:#8fb6c6;color-scheme:dark}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
.hbody p,.hbody li{line-height:1.5}.hbody ul,.hbody ol{padding-left:22px;margin:6px 0}.hbody li{margin:4px 0}.hbody .ex{background:#efe6d0;border-left:4px solid #c9b98f;border-radius:8px;padding:8px 12px;margin:10px 0}
/*top-above*//*hh*/#modal,#cover{top:var(--hh,0px)!important}#modal>*{max-height:calc(100vh - var(--hh,0px) - 24px)!important;max-height:calc(100dvh - var(--hh,0px) - 24px)!important;overflow:auto}

body{background:radial-gradient(ellipse at 50% 0%,#2b3640,#1b2026 70%) fixed,#14181d}
.cq{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:10px;padding:10px max(10px,env(safe-area-inset-right,0px)) 96px max(10px,env(safe-area-inset-left,0px));height:calc(100vh - 110px);height:calc(100dvh - 110px);min-height:460px}

#mp{width:100%;height:100%;display:block;cursor:grab;user-select:none}
#mp.drag{cursor:grabbing}
.terr{stroke:#3b3328;stroke-width:1;stroke-linejoin:round;transition:fill .5s,filter .2s}
.terr.sel{filter:brightness(1.25) drop-shadow(0 0 4px #fff);stroke:#fff;stroke-width:2.2}
.terr.tgt{animation:tgt 1s infinite;stroke:#fff;stroke-width:1.6}
@keyframes tgt{50%{filter:brightness(1.3)}}

.coast{fill:none;stroke:#2d4a5a;stroke-width:5;opacity:.25}
.link{stroke:#4a5560;stroke-width:1.4;stroke-dasharray:4 4;fill:none;opacity:.8}

.badge text{font:900 11px "Nunito Sans",Arial;fill:#fff;text-anchor:middle;pointer-events:none}
.badge.pop circle{animation:bpop .5s}
@keyframes bpop{40%{transform:scale(1.5)}}
.badge{transform-box:fill-box;transform-origin:center}
.clabel{font:700 13px "Alegreya SC",Georgia;fill:#2d3a44;opacity:.55;letter-spacing:.1em;pointer-events:none}
.tname{font:700 6.5px "Nunito Sans",Arial;fill:#2b2620;text-anchor:middle;pointer-events:none;opacity:.75}
.arrow{stroke:#fff;stroke-width:3;fill:none;marker-end:url(#ah);filter:drop-shadow(0 1px 2px #000);stroke-dasharray:6 4;animation:dash .6s linear infinite}

.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid #6b5a3a;background:#f3ead4e8;color:#2b2620;font-size:20px;font-weight:900}
.dice{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:16px;align-items:center;background:#1b2026e8;border-radius:14px;padding:8px 14px;z-index:4;box-shadow:0 8px 20px #000a}
.dice .grp{display:flex;gap:6px}
.die{width:34px;height:34px;border-radius:7px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px;box-shadow:inset 0 -3px 0 #0003}
.die span{width:6px;height:6px;border-radius:50%;background:#fff;align-self:center;justify-self:center;opacity:0}
.die span.on{opacity:1}
.die.a{background:#d64541}.die.d{background:#3b7dd8}
.die.lost{opacity:.35;transform:scale(.85)}
.die.roll{animation:droll .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes droll{from{transform:rotate(-270deg) scale(.4)}}
.side{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.card3{background:linear-gradient(#2b333c,#222930);border:1px solid #47515c;border-radius:12px;padding:9px 11px}
.card3 h3{font-family:var(--title);font-size:15px;margin:0 0 6px;color:#f3e3b8;letter-spacing:.04em}
.steps{display:flex;gap:4px}.steps span{flex:1;text-align:center;font-size:12px;font-weight:800;padding:5px 2px;border-radius:7px;background:#ffffff10;color:#aab4be}.steps span.on{background:var(--pc,#c0392b);color:#fff}
.plr{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 8px;align-items:center;padding:4px 6px;border-radius:8px;font-size:13px}
.plr.on{background:#ffffff12}.plr.dead{opacity:.4;text-decoration:line-through}
.plr i{width:12px;height:12px;border-radius:50%}
.plr b{font-variant-numeric:tabular-nums}
.cards{display:flex;gap:5px;flex-wrap:wrap}
.tc{width:52px;height:70px;border-radius:7px;background:#f3ead4;color:#2b2620;border:2px solid #b9a77c;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px;font-size:8.5px;font-weight:800;text-align:center;line-height:1.05;cursor:pointer}
.tc.sel{border-color:#c0392b;box-shadow:0 0 0 2px #c0392b;transform:translateY(-3px)}
.tc svg{width:28px;height:28px}
.mission{font-size:13px;line-height:1.4}
.act{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(#262e36f4,#181d22);border-top:1px solid #47515c;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));box-shadow:0 -8px 24px #0009}
.act .in2{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.act .msg2{flex:1;min-width:200px;font-size:14px;color:#cfd6dd}.act .msg2 b{color:#fff}
.act input[type=range]{width:160px;accent-color:#c0392b}
.seatrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}.seatrow input[type=text]{width:130px}
.scl{width:100%;border-collapse:collapse;margin:8px 0}.scl td,.scl th{padding:5px 8px;border-bottom:1px solid #e2d6b8;text-align:left}.scl td:not(:first-child),.scl th:not(:first-child){text-align:right}.scl tr.w td{font-weight:900;color:#1d6f3e}
@media (max-width:860px){.cq{grid-template-columns:1fr;grid-template-rows:minmax(300px,1fr) auto;height:auto;min-height:0}.mapw{height:56vh;height:56dvh}.side{overflow:visible}.act .in2{gap:6px}.act input[type=range]{width:120px}}
</style></head><body>
<header class="top"><a class="back" href="index.html">← Salle de jeux</a><h1>Conquête<small>dans l’esprit de Risk</small></h1>
<div class="tools"><button class="btn" id="sndBtn" data-c="sound">Son</button><button class="btn" data-c="help">Aide</button><button class="btn pri" data-c="new">Nouvelle partie</button></div></header>
<div class="status" id="status"></div>
<main class="cq"><div class="mapw" id="mapw"><svg id="mp" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fff"/></marker><pattern id="waves" width="40" height="16" patternUnits="userSpaceOnUse"><path d="M0 8q10-6 20 0t20 0" stroke="#ffffff40" fill="none" stroke-width="1.2"/></pattern></defs><g id="world"></g></svg>
<div class="zoom"><button data-z="in" aria-label="Zoomer">+</button><button data-z="out" aria-label="Dézoomer">−</button><button data-z="fit" aria-label="Vue entière" style="font-size:15px">⤢</button></div><div class="dice" id="dice" hidden></div></div>

<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SVGNS='http://www.w3.org/2000/svg';
function sel(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,REDUCED?Math.min(ms,30):ms));
function openModal(h,onclick){ $('#mbox').innerHTML=h; $('#mbox').onclick=onclick||null; $('#modal').hidden=false; }
function paintModal(h){ $('#mbox').innerHTML=h; $('#modal').hidden=false; }
function helpTabs(title,tabs){ let k=0; const draw=()=>paintModal('<h2>'+title+'</h2>'+(tabs.length>1?'<div class="tabs">'+tabs.map((t,i)=>'<button class="'+(i===k?'on':'')+'" data-ht="'+i+'">'+t[0]+'</button>').join('')+'</div>':'')+'<div class="hbody">'+tabs[k][1]+'</div><div class="acts"><button class="btn pri" data-c="close">Compris</button></div>'); draw(); $('#mbox').onclick=e=>{ const b=e.target.closest('[data-ht]'); if(b){ k=+b.dataset.ht; draw(); $('#mbox').scrollTop=0; } }; }
function closeModal(){ $('#modal').hidden=true; $('#mbox').onclick=null; window.COVER_HIDDEN=null; }
function toast(s){ const t=document.createElement('div'); t.className='toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2700); }
function banner(s,sub,col){ const b=document.createElement('div'); b.className='bannerx'; b.innerHTML=`<div style="${col?'--bc:'+col:''}">${esc(s)}${sub?`<small>${esc(sub)}</small>`:''}</div>`; document.body.appendChild(b); setTimeout(()=>b.remove(),2400); }
function confetti(cols){ if(REDUCED) return; cols=cols||['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#fff']; for(let i=0;i<80;i++){ const c=document.createElement('div'); c.style.cssText=`position:fixed;top:-12px;left:${Math.random()*100}vw;width:8px;height:12px;background:${cols[i%cols.length]};z-index:90;pointer-events:none;border-radius:2px`; document.body.appendChild(c);
  c.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*220}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`}],{duration:2200+Math.random()*1800,delay:Math.random()*700,easing:'ease-in'}).finished.then(()=>c.remove()); } }
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
/* sons */
let MUTED=!!load('salle-mute'), AC=null, NOISE=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(AC.state==='suspended') AC.resume().catch(()=>{}); return AC; }
function tn(a,t,f,d,type,v,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function nz(a,t,d,v,type,f){ if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;} const s=a.createBufferSource();s.buffer=NOISE;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02); }
function sfx(n){ if(MUTED) return; const a=ac(); if(!a||a.state!=='running') return; const t=a.currentTime+.01;
  switch(n){
    case 'click': tn(a,t,900,.06,'triangle',.06); break;
    case 'move': nz(a,t,.08,.25,'bandpass',900); tn(a,t,220,.08,'sine',.08); break;
    case 'capture': nz(a,t,.12,.35,'bandpass',1400); tn(a,t,520,.12,'triangle',.1,260); break;
    case 'card': nz(a,t,.1,.22,'bandpass',2800); break;
    case 'flip': nz(a,t,.06,.25,'highpass',3000); tn(a,t,1200,.05,'triangle',.04); break;
    case 'dice': for(let k=0;k<6;k++) nz(a,t+k*.07+Math.random()*.03,.05,.3,'bandpass',1800+Math.random()*1200); break;
    case 'ding': tn(a,t,1320,.5,'sine',.1); tn(a,t+.07,1760,.4,'sine',.06); break;
    case 'error': tn(a,t,220,.25,'square',.05,160); break;
    case 'win': [523,659,784,1046].forEach((f,k)=>tn(a,t+k*.12,f,.4,'triangle',.11)); break;
    case 'lose': [392,330,262].forEach((f,k)=>tn(a,t+k*.16,f,.45,'triangle',.1)); break;
    case 'splash': nz(a,t,.5,.3,'lowpass',800); break;
    case 'boom': nz(a,t,.7,.6,'lowpass',300); tn(a,t,90,.6,'sawtooth',.15,40); break;
    case 'pop': tn(a,t,600,.08,'sine',.1,900); break;
  } }
function updSnd(){ const b=$('#sndBtn'); if(b) b.textContent=MUTED?'Son : non':'Son : oui'; }
document.addEventListener('click',e=>{
  if(!MUTED) ac();
  if(e.target.id==='modal'&&window.MODAL_CLOSABLE!==false){ const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; return; }
  const t=e.target.closest('[data-c]'); if(!t) return;
  switch(t.dataset.c){
    case 'sound': MUTED=!MUTED; store('salle-mute',MUTED); updSnd(); break;
    case 'help': GAME.help(); break;
    case 'new': { const cv=$('#cover'); window.MODAL_CLOSABLE=true; GAME.menu(); if(cv&&!cv.hidden){ cv.hidden=true; window.COVER_HIDDEN=cv; } break; }
    case 'close': { const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; break; }
  }

function newGame(o,rng){ rng=rng||Math.random; const n=o.players.length;

function autoPlace(G,rng){ rng=rng||Math.random; G.players.forEach((P,i)=>{ const mine=TIDS.filter(id=>G.own[id]===i); while(G.pool[i]>0){ const id=P.neutral?mine[Math.floor(rng()*mine.length)]:aiSetupPick(G,i,rng); G.arm[id]++; G.pool[i]--; } }); startTurn(G,0); }
function setupPlace(G,p,id){ if(G.phase!=='setup'||G.cur!==p||G.own[id]!==p||G.pool[p]<1) return null; G.arm[id]++; G.pool[p]--; const ev=[{t:'add',id,n:1,p}];

function fixedValue(cs){ const s=cs.map(c=>c.s).filter(x=>x!=='joker'); if(s.length<3) return 12; if(s[0]===s[1]&&s[1]===s[2]) return {fant:4,cav:6,art:8}[s[0]]; return 10; }

async function show(ev,my,fast){ for(const e of ev||[]){ if(my!==GEN) return;
  switch(e.t){
   case 'add': render(); pop(e.id); sfx('pop'); if(G.players[e.p].ai) await wait(fast?40:120); break;
   case 'dice': { const d=$('#dice'); const la=e.la, ld=e.ld; const A=e.A.map((v,i)=>dieH(v,'a',i<Math.min(e.A.length,e.D.length)&&!(v>e.D[i]))), D=e.D.map((v,i)=>dieH(v,'d',i<Math.min(e.A.length,e.D.length)&&v<e.A[i]));
     d.innerHTML=`<div class="grp">${A.join('')}</div><b style="font-family:var(--title)">contre</b><div class="grp">${D.join('')}</div>`; d.hidden=false; SRC=e.a; DST=e.b; render(); sfx('dice'); await wait(fast?320:650); pop(e.a); pop(e.b); if(ld) sfx('capture'); else sfx('error'); await wait(fast?150:350); break; }
   case 'conquer': d0(); render(); pop(e.b); sfx('boom'); toast(`${G.players[e.p].name} conquiert ${TERR[e.b].name}`); await wait(400); break;
   case 'eliminated': banner(`${G.players[e.p].name} est éliminé`,e.cards?`${G.players[e.by].name} récupère ${e.cards} carte${e.cards>1?'s':''}`:'',PC[e.p]); sfx('lose'); await wait(1500); break;
   case 'move': case 'fort': SRC=e.a; DST=e.b; render(); sfx('move'); await wait(450); SRC=null; DST=null; render(); pop(e.b); await wait(150); break;
   case 'trade': render(); toast(`${G.players[e.p].name} échange 3 cartes : +${e.val} armées${e.extra?' (+2 sur '+TERR[e.extra].name+')':''}`); sfx('ding'); await wait(600); break;
   case 'card': if(isH(e.p)) toast('Carte gagnée : '+(e.c.id?TERR[e.c.id].name:'joker')); sfx('flip'); break;
   case 'turn': d0(); SRC=null; DST=null; render(); if(!fast) { banner(G.players[e.p].name,`${e.r} renforts${e.bon.length?' · '+e.bon.map(c=>MAP.cont[c].name).join(', '):''}`,PC[e.p]); await wait(1100); } break;
   case 'phase': d0(); render(); break;
   case 'win': d0(); render(); break;
  } } }
function d0(){ $('#dice').hidden=true; }
/* ---------- déroulement ---------- */
function save(){ store(KEY,G&&G.phase!=='over'?G:null); }
async function apply(ev,my,fast){ if(!ev){ sfx('error'); return false; } BUSY=true; await show(ev,my,fast); if(my!==GEN) return false; BUSY=false; step(); return true; }
function step(){ if(!G) return; render(); save(); const my=GEN;
  if(G.phase==='over'){ setTimeout(()=>{ if(my===GEN) gameEnd(); },600); return; }
  const p=G.cur;
  if(G.players[p].ai){ setTimeout(()=>{ if(my!==GEN||BUSY) return; const ev=aiStep(G); if(!ev){ endTurn(G,p); step(); return; } apply(ev,my,G.phase==='setup'); },G.phase==='setup'?60:420); return; }
  if(humans().length>1&&VIEW!==p){ VIEW=null; SHOWM=false; render(); cover(p); return; }
  VIEW=p; }
function cover(p){ const c=$('#cover'); c.innerHTML=`<div><span style="font-family:var(--title);letter-spacing:.15em;color:#f3e3b8">ORDRES SECRETS</span><h2 style="font-family:var(--title);color:${PC[p]}">${esc(G.players[p].name)}</h2><p>Passe l’appareil : tes cartes${G.missions?' et ta mission':''} sont confidentielles.</p><button class="btn pri" style="font-size:17px;padding:12px 20px" data-a="reveal">Prendre le commandement</button></div>`; c.style.background='radial-gradient(circle at 50% 35%,#2b3640,#101317)'; c.hidden=false; }
function gameEnd(){ store(KEY,null); const w=G.over.winner, hw=isH(w); banner(hw?'Victoire !':'Défaite',G.players[w].name,PC[w]); sfx(hw?'win':'lose'); if(hw) confetti(PC);
  setTimeout(()=>{ window.MODAL_CLOSABLE=true; openModal(`<h2>${esc(G.players[w].name)} l’emporte</h2>${G.missions?`<h4>Missions</h4><ul>${G.players.filter(P=>P.mission).map(P=>`<li><b>${esc(P.name)}</b> : ${esc(P.mission.txt)}</li>`).join('')}</ul>`:''}<table class="scl"><tr><th>Armée</th><th>Territoires</th><th>Armées</th></tr>${G.players.map((P,i)=>`<tr class="${i===w?'w':''}"><td><span style="color:${PC[i]}">●</span> ${esc(P.name)}</td><td>${owned(G,i).length}</td><td>${owned(G,i).reduce((s,id)=>s+G.arm[id],0)}</td></tr>`).join('')}</table><div class="acts"><button class="btn" data-c="new">Changer les réglages</button><button class="btn pri" data-a="again">Rejouer</button></div>`); },1700); }
async function blitz(){ const my=GEN, p=G.cur, a=SRC, b=DST; BUSY=true; render();
  while(my===GEN&&canAttack(G,p,a,b)){ const ev=attack(G,p,a,b,3); await show(ev,my,true); if(G.own[b]===p||G.phase==='over') break; }
  if(my!==GEN) return; BUSY=false; if(G.own[b]!==p){ SRC=null; DST=null; } step(); }
/* ---------- interactions carte ---------- */
(function(){ const svg=$('#mp'); const pts=new Map(); let start=null, moved=false, pinch=null;
  svg.addEventListener('pointerdown',e=>{ svg.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pts.size===1){ start={x:e.clientX,y:e.clientY,cx:V.cx,cy:V.cy,t:e.target}; moved=false; } else if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:V.s}; moved=true; } });
  svg.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&pinch){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y), r=svg.getBoundingClientRect(); zoomAt((pinch.s*d/pinch.d)/V.s,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top); return; }
    if(!start) return; const dx=e.clientX-start.x, dy=e.clientY-start.y; if(!moved&&Math.hypot(dx,dy)>8){ moved=true; svg.classList.add('drag'); } if(moved&&pts.size===1){ V.cx=start.cx-dx/V.s; V.cy=start.cy-dy/V.s; applyView(); } });
  const up=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null; if(pts.size) return; svg.classList.remove('drag'); if(start&&!moved) tap(start.t); start=null; };
  svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',e=>{ pts.delete(e.pointerId); start=null; svg.classList.remove('drag'); });
  svg.addEventListener('wheel',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top); },{passive:false});
  addEventListener('resize',()=>applyView()); })();
function tap(t){ const el=t.closest&&t.closest('[data-t]'); if(!el||!G||BUSY) return; const id=el.dataset.t, p=G.cur; if(!isH(p)||VIEW!==p) return;
  if(G.phase==='setup'){ if(G.own[id]!==p){ sfx('error'); return; } apply(setupPlace(G,p,id),GEN,true); return; }
  if(G.pendingMove) return;
  if(G.phase==='reinforce'){ if(G.own[id]!==p){ sfx('error'); return; } const n=AMT==='all'?G.reinf:Math.min(AMT,G.reinf); apply(place(G,p,id,n),GEN,true); return; }
  if(G.phase==='attack'){ if(G.own[id]===p){ SRC=G.arm[id]>=2?id:null; DST=null; if(!SRC) toast('Il faut au moins 2 armées pour attaquer'); sfx('click'); render(); return; }
    if(SRC&&canAttack(G,p,SRC,id)){ DST=id; ND=Math.min(3,G.arm[SRC]-1); sfx('click'); render(); } else sfx('error'); return; }
  if(G.phase==='fortify'){ if(!SRC||G.own[id]===p&&!connected(G,p,SRC,id)){ if(G.own[id]===p&&G.arm[id]>=2){ SRC=id; DST=null; MOVEN=G.arm[id]-1; render(); } else sfx('error'); return; } if(connected(G,p,SRC,id)){ DST=id; render(); } } }
document.addEventListener('input',e=>{ if(e.target.id==='mv'){ MOVEN=+e.target.value; $('#mvn').textContent=MOVEN; } });
document.addEventListener('click',e=>{ const z=e.target.closest('[data-z]'); if(z){ if(z.dataset.z==='fit') fit(); else zoomAt(z.dataset.z==='in'?1.3:1/1.3); return; }
  const t=e.target.closest('[data-a],[data-amt],[data-nd],[data-cd]'); if(!t||!G) return;
  if(t.dataset.a==='again'){ closeModal(); startGame(); return; }
  if(t.dataset.a==='reveal'){ $('#cover').hidden=true; VIEW=G.cur; render(); sfx('flip'); return; }
  if(t.dataset.a==='mission'){ SHOWM=!SHOWM; render(); return; }
  if(BUSY) return; const p=G.cur; if(!isH(p)) return;
  if(t.dataset.cd!=null){ const i=+t.dataset.cd; CSEL=CSEL.includes(i)?CSEL.filter(x=>x!==i):CSEL.concat(i).slice(-3); sfx('click'); render(); return; }
  if(t.dataset.amt){ AMT=t.dataset.amt==='all'?'all':+t.dataset.amt; render(); return; }
  if(t.dataset.nd){ ND=+t.dataset.nd; render(); return; }
  switch(t.dataset.a){
   case 'autosetup': { const my=GEN; BUSY=true; (async()=>{ while(G.phase==='setup'&&G.cur===p&&my===GEN){ const ev=setupPlace(G,p,aiSetupPick(G,p,Math.random)); if(!ev) break; await show(ev,my,true); } BUSY=false; step(); })(); break; }
   case 'trade': { const ev=trade(G,p,CSEL); CSEL=[]; apply(ev,GEN); break; }
   case 'autotrade': { const s=bestSet(G.players[p].cards); if(s) apply(trade(G,p,s),GEN); break; }
   case 'cancel': SRC=null; DST=null; render(); break;
   case 'attack': apply(attack(G,p,SRC,DST,ND),GEN).then(()=>{ if(G.own[DST]===p&&!G.pendingMove){ SRC=null; DST=null; render(); } else if(SRC&&G.arm[SRC]<2){ SRC=null; DST=null; render(); } }); break;
   case 'blitz': blitz(); break;
   case 'movein': { const ev=moveIn(G,p,MOVEN); SRC=null; DST=null; MOVEN=1; apply(ev,GEN); break; }
   case 'tofort': SRC=null; DST=null; apply(toFortify(G,p),GEN); break;
   case 'fortify': { const ev=fortify(G,p,SRC,DST,MOVEN); SRC=null; DST=null; apply(ev,GEN); break; }
   case 'end': SRC=null; DST=null; apply(endTurn(G,p),GEN); break; } });
/* ---------- menu ---------- */
let M={n:3,seats:Array.from({length:6},(_,i)=>({h:i===0?1:0,name:''})),level:'normal',missions:true,auto:true,fixed:false};
function startGame(){ GEN++; $('#cover').hidden=true; const hs=M.seats.slice(0,M.n).filter(s=>s.h).length;
  G=newGame({players:M.seats.slice(0,M.n).map((s,i)=>({name:(s.name||'').trim()||(s.h?(hs===1?'Toi':NAMES[i]):NAMES[(i+1)%6]),ai:!s.h,level:M.level})),missions:M.missions,autoSetup:M.auto,fixedTrade:M.fixed});
  VIEW=null; SRC=null; DST=null; CSEL=[]; SHOWM=false; buildMap(); fit(); render(); step(); }

function menu(){ window.MODAL_CLOSABLE=true;
  const draw=()=>{ const hs=M.seats.slice(0,M.n).filter(s=>s.h).length; paintModal(`<h2>Nouvelle partie</h2>
   <h4>Armées</h4><div class="seg">${[2,3,4,5,6].map(n=>`<button class="${M.n===n?'on':''}" data-m="n:${n}">${n}</button>`).join('')}</div>
   ${M.seats.slice(0,M.n).map((s,i)=>`<div class="seatrow"><span style="width:14px;height:14px;border-radius:50%;background:${PC[i]}"></span><input type="text" data-nm="${i}" value="${esc(s.name)}" placeholder="${s.h?(i===0?'Toi':NAMES[i]):NAMES[(i+1)%6]}" maxlength="14"><div class="seg"><button class="${s.h?'on':''}" data-m="h:${i}:1">Humain</button><button class="${s.h?'':'on'}" data-m="h:${i}:0">Ordinateur</button></div></div>`).join('')}
   ${M.n===2?'<p style="font-size:14px">À deux, une armée neutre grise occupe un tiers du monde et se défend sans attaquer.</p>':''}
   ${hs<M.n?`<h4>Niveau de l’ordinateur</h4><div class="seg">${['facile','normal','difficile'].map(l=>`<button class="${M.level===l?'on':''}" data-m="level:${l}">${l}</button>`).join('')}</div>`:''}
   <h4>Victoire</h4><div class="seg"><button class="${M.missions?'on':''}" data-m="missions:1">Missions secrètes</button><button class="${M.missions?'':'on'}" data-m="missions:0">Domination du monde</button></div>
   <h4>Déploiement initial</h4><div class="seg"><button class="${M.auto?'on':''}" data-m="auto:1">Automatique (rapide)</button><button class="${M.auto?'':'on'}" data-m="auto:0">Armée par armée</button></div>
   <h4>Échange des cartes</h4><div class="seg"><button class="${M.fixed?'':'on'}" data-m="fixed:0">Valeur croissante (4, 6, 8…)</button><button class="${M.fixed?'on':''}" data-m="fixed:1">Valeur fixe selon les symboles</button></div>
   <div class="acts">${G&&G.phase!=='over'?'<button class="btn" data-c="close">Annuler</button>':''}<button class="btn pri" data-m="go" ${hs?'':'disabled'}>Partir en campagne</button></div>`); };
  draw(); $('#mbox').onclick=e=>{ $$('#mbox [data-nm]').forEach(i=>{ M.seats[+i.dataset.nm].name=i.value; }); const x=e.target.closest('[data-m]'); if(!x) return; const [k,v,w]=x.dataset.m.split(':'); sfx('click');
    if(k==='go'){ closeModal(); store('cqp',M); startGame(); return; } if(k==='h') M.seats[+v].h=+w; else if(k==='n') M.n=+v; else if(['missions','auto','fixed'].includes(k)) M[k]=v==='1'; else M[k]=v; draw(); }; }
function help(){ helpTabs('Conquête',[
 ['But du jeu',`<p>Chaque joueur dirige une armée sur une carte du monde de 42 territoires répartis en 6 continents.</p><ul><li><b>Domination</b> : éliminer tous les adversaires.</li><li><b>Missions secrètes</b> : chacun reçoit une mission (conquérir des continents, 24 territoires, détruire une armée…). Le premier qui l’accomplit gagne aussitôt. Si l’armée à détruire est éliminée par un autre, la mission devient « conquérir 24 territoires ».</li></ul>`],
 ['Un tour',`<ol><li><b>Renforts</b> : 1 armée pour 3 territoires (au moins 3), plus le bonus de chaque continent contrôlé en entier, plus les échanges de cartes.</li><li><b>Attaque</b> (facultative, autant de fois que tu veux) : depuis un territoire d’au moins 2 armées vers un voisin ennemi (les pointillés relient les territoires séparés par la mer).</li><li><b>Manœuvre</b> (facultative) : un seul déplacement d’armées entre deux de tes territoires reliés par tes terres. Il doit toujours rester une armée.</li></ol>`],
 ['Combats',`<ul><li>L’attaquant lance jusqu’à 3 dés (une armée doit rester en arrière), le défenseur jusqu’à 2.</li><li>On compare les plus forts dés entre eux, puis les seconds. Le plus fort gagne, <b>l’égalité profite au défenseur</b>. Chaque dé perdu coûte une armée.</li><li>Quand le territoire est vidé, tu le conquiers et y fais entrer au moins autant d’armées que de dés lancés.</li></ul><p class="ex">Exemple : 6-4-2 contre 5-4 → le 6 bat le 5, le 4 contre le 4 est gagné par le défenseur : chacun perd une armée.</p>`],
 ['Cartes',`<ul><li>Si tu conquiers au moins un territoire pendant ton tour, tu gagnes une carte (fantassin, cavalier, canon ou joker).</li><li>Échange 3 cartes de même symbole ou de 3 symboles différents (le joker remplace n’importe lequel) contre des renforts : 4, 6, 8, 10, 12, 15 puis +5 à chaque échange, ou une valeur fixe selon l’option.</li><li>+2 armées sur un territoire d’une carte échangée que tu possèdes.</li><li>Avec 5 cartes ou plus, l’échange est obligatoire. Qui élimine un joueur récupère ses cartes.</li></ul>`],
 ['Jouer ici',`<ul><li>Touche tes territoires pour placer les renforts (+1, +5 ou tout).</li><li>Attaque : touche ton territoire, puis la cible qui clignote ; « Attaquer » lance un combat, « Attaque éclair » enchaîne jusqu’à la victoire ou l’épuisement.</li><li>Glisse pour déplacer la carte, pince ou utilise + et − pour zoomer.</li><li>À plusieurs humains, un écran de passage protège cartes et missions. À deux, une armée neutre occupe une partie du monde. La partie est sauvegardée automatiquement.</li></ul>`]]); }
window.CQ={get G(){return G;},get BUSY(){return BUSY;}};
(function boot(){ const p=load('cqp'); if(p) Object.assign(M,p); const s=load(KEY);
  if(s&&s.own&&s.phase!=='over'){ G=s; buildMap(); setTimeout(()=>{ fit(); render(); step(); },30); } else { G=null; buildMap(); setTimeout(fit,30); $$('.terr').forEach(el=>el.setAttribute('fill',MAP.cont[TERR[el.dataset.t].c].color)); $$('.badge').forEach(b=>b.style.display='none'); renderStatus(); menu(); } })();
}
