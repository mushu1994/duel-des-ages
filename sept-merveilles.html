.opt{display:flex;align-items:flex-start;gap:8px;margin:6px 0;line-height:1.35}.opt input{width:20px;height:20px;flex:none;margin-top:1px}

@media (max-width:900px){.handpan{order:-1}.row3{grid-template-columns:1fr 1fr}.row3 .mine{grid-column:1/-1;order:-1}.cd{width:calc(50% - 6px);min-height:140px}}
@media (max-width:420px){.sm{padding-inline:8px}.cd .hd{font-size:12.5px}}

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SVGNS='http://www.w3.org/2000/svg';
function sel(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,REDUCED?Math.min(ms,30):ms));
function openModal(h,onclick){ $('#mbox').innerHTML=h; $('#mbox').onclick=onclick||null; $('#modal').hidden=false; }
function paintModal(h){ $('#mbox').innerHTML=h; $('#modal').hidden=false; }
function helpTabs(title,tabs){ let k=0; const draw=()=>paintModal('<h2>'+title+'</h2>'+(tabs.length>1?'<div class="tabs">'+tabs.map((t,i)=>'<button class="'+(i===k?'on':'')+'" data-ht="'+i+'">'+t[0]+'</button>').join('')+'</div>':'')+'<div class="hbody">'+tabs[k][1]+'</div><div class="acts"><button class="btn pri" data-c="close">Compris</button></div>'); draw(); $('#mbox').onclick=e=>{ const b=e.target.closest('[data-ht]'); if(b){ k=+b.dataset.ht; draw(); $('#mbox').scrollTop=0; } }; }
function closeModal(){ $('#modal').hidden=true; $('#mbox').onclick=null; window.COVER_HIDDEN=null; }
function toast(s){ const t=document.createElement('div'); t.className='toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2700); }
function banner(s,sub,col){ const b=document.createElement('div'); b.className='bannerx'; b.innerHTML=`<div style="${col?'--bc:'+col:''}">${esc(s)}${sub?`<small>${esc(sub)}</small>`:''}</div>`; document.body.appendChild(b); setTimeout(()=>b.remove(),2400); }
function confetti(cols){ if(REDUCED) return; cols=cols||['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#fff']; for(let i=0;i<80;i++){ const c=document.createElement('div'); c.style.cssText=`position:fixed;top:-12px;left:${Math.random()*100}vw;width:8px;height:12px;background:${cols[i%cols.length]};z-index:90;pointer-events:none;border-radius:2px`; document.body.appendChild(c);
  c.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*220}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`}],{duration:2200+Math.random()*1800,delay:Math.random()*700,easing:'ease-in'}).finished.then(()=>c.remove()); } }
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
/* sons */
let MUTED=!!load('salle-mute'), AC=null, NOISE=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(AC.state==='suspended') AC.resume().catch(()=>{}); return AC; }
function tn(a,t,f,d,type,v,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function nz(a,t,d,v,type,f){ if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;} const s=a.createBufferSource();s.buffer=NOISE;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02); }
function sfx(n){ if(MUTED) return; const a=ac(); if(!a||a.state!=='running') return; const t=a.currentTime+.01;
  switch(n){
    case 'click': tn(a,t,900,.06,'triangle',.06); break;
    case 'move': nz(a,t,.08,.25,'bandpass',900); tn(a,t,220,.08,'sine',.08); break;
    case 'capture': nz(a,t,.12,.35,'bandpass',1400); tn(a,t,520,.12,'triangle',.1,260); break;
    case 'card': nz(a,t,.1,.22,'bandpass',2800); break;
    case 'flip': nz(a,t,.06,.25,'highpass',3000); tn(a,t,1200,.05,'triangle',.04); break;
    case 'dice': for(let k=0;k<6;k++) nz(a,t+k*.07+Math.random()*.03,.05,.3,'bandpass',1800+Math.random()*1200); break;
    case 'ding': tn(a,t,1320,.5,'sine',.1); tn(a,t+.07,1760,.4,'sine',.06); break;
    case 'error': tn(a,t,220,.25,'square',.05,160); break;
    case 'win': [523,659,784,1046].forEach((f,k)=>tn(a,t+k*.12,f,.4,'triangle',.11)); break;
    case 'lose': [392,330,262].forEach((f,k)=>tn(a,t+k*.16,f,.45,'triangle',.1)); break;
    case 'splash': nz(a,t,.5,.3,'lowpass',800); break;
    case 'boom': nz(a,t,.7,.6,'lowpass',300); tn(a,t,90,.6,'sawtooth',.15,40); break;
    case 'pop': tn(a,t,600,.08,'sine',.1,900); break;
  } }
function updSnd(){ const b=$('#sndBtn'); if(b) b.textContent=MUTED?'Son : non':'Son : oui'; }
document.addEventListener('click',e=>{
  if(!MUTED) ac();
  if(e.target.id==='modal'&&window.MODAL_CLOSABLE!==false){ const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; return; }
  const t=e.target.closest('[data-c]'); if(!t) return;
  switch(t.dataset.c){
    case 'sound': MUTED=!MUTED; store('salle-mute',MUTED); updSnd(); break;
    case 'help': GAME.help(); break;
    case 'new': { const cv=$('#cover'); window.MODAL_CLOSABLE=true; GAME.menu(); if(cv&&!cv.hidden){ cv.hidden=true; window.COVER_HIDDEN=cv; } break; }
    case 'close': { const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; break; }
  }
});
addEventListener('DOMContentLoaded',updSnd);


/* Sept Merveilles : données (dans l'esprit de 7 Wonders) — noms originaux, répartition par nombre de joueurs fidèle au jeu de base.
   Ressources : W bois, S pierre, C brique, O minerai, G verre, T tissu, P papyrus. Coût en pièces : chiffre. */

const RAW='WSCO', MANU='GTP';
// [nom, âge, couleur, coût, effet, joueurs minimums, chaîne depuis]
const CARDS_SRC=[

  const opps=G.players.map((P,i)=>`<div class="opp ${i===m?'me':''}"><b>${esc(P.name)}</b> · ${esc(wonderOf(P).name)}<br>● ${P.coins} · ⚔ ${shields(P)} · étapes ${P.stages}/${stagesOf(P).length}${G.choices[i]?' · ✓ a choisi':''}</div>`).join('');
  const ed=G.opts.edifice&&G.edif?`<div class="pan"><h3>Édifice de l’âge : ${esc(G.edif.name)}</h3><div style="font-size:13px">Participation en construisant une étape de merveille : ${G.edif.cost} pièces. Réussi si au moins ${Math.ceil(G.n*G.edif.need)} joueurs participent : récompense ${effTxt(G.edif.rew)} pour les participants, pénalité ${effTxt(G.edif.pen)} pour les autres. Participants : ${G.edif.by.map(i=>esc(G.players[i].name)).join(', ')||'aucun'}.</div></div>`:'';
  $('#tbl').innerHTML=`<div class="row3">${cityHTML(l,false)}${cityHTML(m,true)}${cityHTML(r,false)}</div>${ed}<div class="pan handpan"><h3>${hd}</h3><div class="hand">${canSee?hand.map((c,k)=>cardHTML(c,{cls:(SEL===c.id?'sel ':'')+'in',delay:k*40,tag:tag(c)})).join(''):''}</div></div><div class="opps">${opps}</div>`;
  LASTBUILT.clear(); renderAct(); renderStatus(); }
function renderAct(){ const a=$('#actin'); if(G.phase==='over'){ a.innerHTML=`<span class="msg2">Partie terminée.</span><button class="btn pri" data-c="new">Nouvelle partie</button>`; return; }
  const m=me(); if(BUSY){ a.innerHTML='<span class="msg2">Les cités construisent…</span>'; return; }
  if(G.phase==='disc'){ a.innerHTML='<span class="msg2">Choix dans la défausse…</span>'; return; }
  if(G.choices[m]&&G.choices[m].type!=='skip'){ a.innerHTML=`<span class="msg2">Choix enregistré. En attente des autres cités…</span><button class="btn" data-a="undo">Changer</button>`; return; }
  if(G.phase==='ldraft'){ a.innerHTML=`<span class="msg2">Choisis le meneur à garder, les autres passent à ton voisin.</span><button class="btn pri" data-a="keep" ${SEL?'':'disabled'}>Garder</button>`; return; }
  if(G.phase==='recruit'){ const P=G.players[m], l=P.lhand.find(x=>x.id===SEL); a.innerHTML=`<span class="msg2">${l?`${esc(l.name)} : ${effTxt(l.eff)}`:'Choisis un meneur.'}</span><button class="btn" data-a="ldisc" ${l?'':'disabled'}>Renvoyer (+3 ●)</button><button class="btn pri" data-a="recruit" ${l&&P.coins>=l.cost?'':'disabled'}>Recruter (${l?l.cost:0} ●)</button>`; return; }
  if(G.phase==='last'&&!G.lastWho.includes(m)){ a.innerHTML='<span class="msg2">En attente…</span>'; return; }
  const c=(G.hands[m]||[]).find(x=>x.id===SEL); if(!c){ a.innerHTML=`<span class="msg2">Choisis une carte : la construire, l’utiliser pour une étape de ta merveille, ou la défausser contre 3 pièces.</span>`; return; }
  const o=buildOptions(G,m,c), so=stageOptions(G,m), P=G.players[m];
  const bTxt=o&&o.chain?'Construire (gratuit, chaîne)':o&&o.ok?`Construire${o.plan.coins?` (${o.plan.coins} ●${o.plan.toL||o.plan.toR?`, dont ${o.plan.toL} à gauche et ${o.plan.toR} à droite`:''})`:''}`:'Construire';
  const fl=G.opts.armada&&['red','yellow','blue','green'].includes(c.color)?`<label><input type="checkbox" id="fleet" ${FLEETO?'checked':''}> Avancer la flotte (+1 ●)</label>`:'';
  const ed=G.opts.edifice&&G.edif&&so&&so.ok?`<label><input type="checkbox" id="edif" ${EDIFO?'checked':''}> Participer à l’édifice (+${G.edif.cost} ●)</label>`:'';
  a.innerHTML=`<span class="msg2"><b>${esc(c.name)}</b>${o&&!o.ok&&!o.free?' : '+esc(o.why||''):''}</span>${fl}${ed}<button class="btn" data-a="discard">Défausser (+3 ●)</button>${so?`<button class="btn" data-a="wonder" ${so.ok?'':'disabled'}>Étape de merveille${so.ok&&so.plan.coins?` (${so.plan.coins} ●)`:''}</button>`:''}${o&&o.free&&!o.ok?`<button class="btn" data-a="free">Construire gratuitement (pouvoir)</button>`:''}<button class="btn pri" data-a="build" ${o&&o.ok?'':'disabled'}>${bTxt}</button>`; }
function renderStatus(){ const st=$('#status'); if(!G){ st.innerHTML=''; return; } st.style.setProperty('--pc',G.phase==='over'?'#1d6f3e':['','#7a4a1e','#2f6fb8','#7d3c98'][G.age]||'#7a4a1e');
  st.innerHTML=G.phase==='over'?`<span class="who">Fin</span><span class="msg">${G.over.winners.map(i=>esc(G.players[i].name)).join(' et ')} l’emporte.</span>`:`<span class="who">Âge ${['','I','II','III'][G.age]||'—'}</span><span class="msg">${G.phase==='ldraft'?'Sélection des meneurs':G.phase==='recruit'?'Recrutement des meneurs':'Tour '+G.turn+(G.age===2?' · on passe à droite':' · on passe à gauche')}</span><span class="right">${G.n} cités</span>`; }
/* ---------- déroulement ---------- */
function save(){ store(KEY,G&&G.phase!=='over'?{G,UID}:null); }
function nextHuman(){ return humans().find(i=>!G.choices[i]&&(G.phase!=='last'||G.lastWho.includes(i))); }
function step(){ if(!G) return; const my=GEN; save();
  if(G.phase==='over'){ render(); setTimeout(()=>{ if(my===GEN) gameEnd(); },500); return; }
  if(G.phase==='disc'){ const p=G.pendingDisc[0]; if(G.players[p].ai){ setTimeout(()=>{ if(my!==GEN) return; const ev=chooseDisc(G,p,aiDisc(G,p)); after(ev,my); },700); } else discModal(p); render(); return; }
  // les ordinateurs choisissent
  G.players.forEach((P,i)=>{ if(P.ai&&!G.choices[i]){ if(G.phase==='last'){ if(G.lastWho.includes(i)){ const c=aiLast(G,i); if(!choose(G,i,c)) choose(G,i,{type:'discard',id:c.id}); } } else { const c=aiChoice(G,i); if(!choose(G,i,c)) choose(G,i,{type:'discard',id:G.hands[i][0].id}); } } });
  if(allChosen(G)){ resolve(); return; }
  const h=nextHuman(); if(h==null){ render(); return; }
  if(humans().length>1&&VIEW!==h){ VIEW=null; render(); cover(h); return; }
  VIEW=h; render(); }
async function resolve(){ const my=GEN; BUSY=true; render(); await wait(350); if(my!==GEN) return; const ev=G.phase==='last'?resolveLast(G):resolveTurn(G); after(ev,my); }
async function after(ev,my){ BUSY=true; await show(ev,my); if(my!==GEN) return; BUSY=false; SEL=null; FLEETO=false; EDIFO=false; if(humans().length>1) VIEW=null; step(); }
async function show(ev,my){ const builds=ev.filter(e=>e.t==='build'||e.t==='stage');
  builds.forEach(e=>{ if(e.card) LASTBUILT.add(e.card.id); });
  const m=me(); const mine=ev.filter(e=>(e.t==='build'||e.t==='stage'||e.t==='discard')&&e.p!==m);
  if(builds.length||ev.some(e=>e.t==='discard')){ render(); sfx('card'); const sum=mine.slice(0,3).map(e=>`${G.players[e.p].name} ${e.t==='build'?'construit '+e.card.name:e.t==='stage'?'bâtit une étape de merveille':'défausse une carte'}`).join(' · '); if(sum) toast(sum); await wait(900); }
  for(const e of ev){ if(my!==GEN) return;
   if(e.t==='stage'&&isH(e.p)){ sfx('ding'); }
   if(e.t==='debt'){ toast(`${G.players[e.p].name} lève un impôt : chacun perd ${e.n} pièce${e.n>1?'s':''}`); sfx('error'); await wait(500); }
   if(e.t==='leader'&&!isH(e.p)) toast(`${G.players[e.p].name} recrute ${e.l.name}`);
   if(e.t==='war'){ await warShow(e,my); }
   if(e.t==='edif'){ toast(`Édifice « ${e.name} » ${e.ok?'achevé':'abandonné'}`); await wait(700); }
   if(e.t==='age'){ banner(`Âge ${['','I','II','III'][e.age]}`,e.age===2?'Les cartes passent à droite':'Les cartes passent à gauche',['','#7a4a1e','#2f6fb8','#7d3c98'][e.age]); sfx('ding'); await wait(1500); }
   if(e.t==='pass'){ sfx('flip'); } } }
async function warShow(e,my){ const val={1:1,2:3,3:5}[e.age]; banner('Conflits militaires',`Fin de l’âge ${['','I','II','III'][e.age]} · victoire +${val}, défaite −1`,'#c0392b'); sfx('boom'); await wait(1500); if(my!==GEN) return;
  const lines=e.res.map(r=>r.tie?`<div>⚔ ${esc(G.players[r.tie[0]].name)} et ${esc(G.players[r.tie[1]].name)} : égalité</div>`:`<div>⚔ <span style="color:#1d6f3e">${esc(G.players[r.w].name)} +${val}</span> contre <span style="color:#a12a1d">${esc(G.players[r.l].name)} −1</span></div>`).join('');
  await new Promise(res=>{ window.MODAL_CLOSABLE=false; openModal(`<h2>Conflits de l’âge ${['','I','II','III'][e.age]}</h2><div class="war">${lines}</div><div class="acts"><button class="btn pri" data-w="1">Continuer</button></div>`,ev=>{ if(!ev.target.closest('[data-w]')) return; closeModal(); window.MODAL_CLOSABLE=true; res(); }); }); }
function discModal(p){ const P=G.players[p], cs=G.discard.filter(c=>!P.built.some(b=>b.name===c.name)); window.MODAL_CLOSABLE=false;
  openModal(`<h2>Mausolée : construire depuis la défausse</h2><p>Choisis une carte de la défausse à construire gratuitement.</p><div class="dpick">${cs.map(c=>cardHTML(c)).join('')}</div>`,e=>{ const b=e.target.closest('[data-card]'); if(!b) return; closeModal(); window.MODAL_CLOSABLE=true; after(chooseDisc(G,p,b.dataset.card),GEN); }); }
function cover(p){ const c=$('#cover'); c.innerHTML=`<div><span style="font-family:Cinzel,Georgia;letter-spacing:.15em;color:#f3d58a">À TOI DE CHOISIR</span><h2 style="font-family:Cinzel,Georgia">${esc(G.players[p].name)}</h2><p>Les autres détournent les yeux : ta main est secrète.</p><button class="btn pri" style="font-size:17px;padding:12px 20px" data-a="reveal" data-p="${p}">Voir ma main</button></div>`; c.style.background='radial-gradient(circle at 50% 35%,#5a3f22,#140e09)'; c.hidden=false; }
function gameEnd(){ store(KEY,null); const w=G.over.winners, hw=w.some(i=>isH(i)); banner(hw?'Victoire !':'Fin de partie',w.map(i=>G.players[i].name).join(' et '),'#b8862b'); sfx(hw?'win':'lose'); if(hw) confetti(Object.values(CC));
  const cat=[['mil','⚔ Militaire','#c0392b'],['coin','● Trésor','#d9a520'],['wonder','Merveille','#b8862b'],['civ','Civil','#2f6fb8'],['com','Commerce','#d9a520'],['guild','Guildes','#7d3c98'],['sci','Science','#2e8b57'],['lead','Meneurs','#e6dcc0'],['other','Autres','#888']];
  setTimeout(()=>{ window.MODAL_CLOSABLE=true; openModal(`<h2>${w.map(i=>esc(G.players[i].name)).join(' et ')} l’emporte</h2><div style="overflow-x:auto"><table class="scl"><tr><th>Cité</th>${cat.map(c=>`<th title="${c[1]}"><i style="background:${c[2]}"></i></th>`).join('')}<th>Total</th></tr>${G.players.map((P,i)=>({P,i,s:G.over.sc[i]})).sort((a,b)=>b.s.total-a.s.total).map(({P,i,s})=>`<tr class="${w.includes(i)?'w':''}"><td>${esc(P.name)}</td>${cat.map(c=>`<td>${s[c[0]]}</td>`).join('')}<td><b>${s.total}</b></td></tr>`).join('')}</table></div><p style="font-size:13px">${cat.map(c=>`<span style="white-space:nowrap"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${c[2]}"></i> ${c[1]}</span>`).join(' · ')}</p><div class="acts"><button class="btn" data-c="new">Changer les réglages</button><button class="btn pri" data-a="again">Rejouer</button></div>`); },1700); }
/* ---------- clics ---------- */
document.addEventListener('change',e=>{ if(e.target.id==='fleet') FLEETO=e.target.checked; if(e.target.id==='edif') EDIFO=e.target.checked; });
document.addEventListener('click',e=>{ const t=e.target.closest('[data-card],[data-a]'); if(!t||!G) return;
  if(t.dataset.a==='again'){ closeModal(); startGame(); return; }
  if(t.dataset.a==='reveal'){ $('#cover').hidden=true; VIEW=+t.dataset.p; SEL=null; render(); sfx('flip'); return; }
  if(BUSY||G.phase==='over'||!$('#modal').hidden) return; const m=me();
  if(t.dataset.card&&t.closest('.hand')){ if(G.choices[m]) return; SEL=SEL===t.dataset.card?null:t.dataset.card; FLEETO=false; EDIFO=false; sfx('click'); render(); return; }
  const a=t.dataset.a; let ok=false;
  if(a==='undo'){ delete G.choices[m]; render(); return; }
  if(!SEL) return;
  if(a==='keep') ok=choose(G,m,{type:'keep',id:SEL});
  else if(a==='recruit') ok=choose(G,m,{type:'recruit',id:SEL}); else if(a==='ldisc') ok=choose(G,m,{type:'ldisc',id:SEL});
  else if(a==='build') ok=choose(G,m,{type:'build',id:SEL,fleet:FLEETO}); else if(a==='free') ok=choose(G,m,{type:'build',id:SEL,free:true});
  else if(a==='wonder') ok=choose(G,m,{type:'wonder',id:SEL,edif:EDIFO}); else if(a==='discard') ok=choose(G,m,{type:'discard',id:SEL});
  else return;
  if(!ok){ sfx('error'); toast('Action impossible'); return; } sfx('pop'); SEL=null; save(); step(); });
/* ---------- menu ---------- */
let M={n:4,seats:Array.from({length:7},(_,i)=>({h:i===0?1:0,name:''})),level:'normal',side:'A',leaders:false,cities:false,armada:false,edifice:false};
function startGame(){ GEN++; $('#cover').hidden=true; const hs=M.seats.slice(0,M.n).filter(s=>s.h).length;
  G=newGame({players:M.seats.slice(0,M.n).map((s,i)=>({name:(s.name||'').trim()||(s.h?(hs===1?'Toi':NAMES[i]):NAMES[(i+1)%7]),ai:!s.h,level:M.level})),leaders:M.leaders,cities:M.cities,armada:M.armada,edifice:M.edifice,side:M.side});
  VIEW=null; SEL=null; banner(G.phase==='ldraft'?'Les meneurs':'Âge I',G.phase==='ldraft'?'Choisis 4 meneurs, un par un':'Les cartes passent à gauche','#7a4a1e'); setTimeout(step,900); render(); }
function menu(){ window.MODAL_CLOSABLE=true;
  const draw=()=>{ const hs=M.seats.slice(0,M.n).filter(s=>s.h).length; paintModal(`<h2>Nouvelle partie</h2>
   <h4>Cités</h4><div class="seg">${[3,4,5,6,7].map(n=>`<button class="${M.n===n?'on':''}" data-m="n:${n}">${n}</button>`).join('')}</div>
   ${M.seats.slice(0,M.n).map((s,i)=>`<div class="seatrow"><input type="text" data-nm="${i}" value="${esc(s.name)}" placeholder="${s.h?(i===0?'Toi':NAMES[i]):NAMES[(i+1)%7]}" maxlength="14"><div class="seg"><button class="${s.h?'on':''}" data-m="h:${i}:1">Humain</button><button class="${s.h?'':'on'}" data-m="h:${i}:0">Ordinateur</button></div></div>`).join('')}
   ${hs<M.n?`<h4>Niveau de l’ordinateur</h4><div class="seg">${['facile','normal','difficile'].map(l=>`<button class="${M.level===l?'on':''}" data-m="level:${l}">${l}</button>`).join('')}</div>`:''}
   <h4>Face des merveilles</h4><div class="seg">${[['A','Face A (conseillée)'],['B','Face B'],['mix','Au hasard']].map(([v,l])=>`<button class="${M.side===v?'on':''}" data-m="side:${v}">${l}</button>`).join('')}</div>
   <h4>Extensions</h4>
   <label class="opt"><input type="checkbox" data-o="leaders" ${M.leaders?'checked':''}><span><b>Meneurs</b> : 4 meneurs à sélectionner au début, un recruté à chaque âge. On commence avec 6 pièces.</span></label>
   <label class="opt"><input type="checkbox" data-o="cities" ${M.cities?'checked':''}><span><b>Cités</b> : cartes noires (impôts, diplomatie, espionnage). 8 cartes par âge.</span></label>
   <label class="opt"><input type="checkbox" data-o="armada" ${M.armada?'checked':''}><span><b>Armada</b> : quatre flottes à faire avancer et des batailles navales.</span></label>
   <label class="opt"><input type="checkbox" data-o="edifice" ${M.edifice?'checked':''}><span><b>Édifices</b> : un grand projet commun par âge.</span></label>
   <div class="acts">${G&&G.phase!=='over'?'<button class="btn" data-c="close">Annuler</button>':''}<button class="btn pri" data-m="go" ${hs?'':'disabled'}>Fonder les cités</button></div>`); };
  draw(); $('#mbox').onclick=e=>{ $$('#mbox [data-nm]').forEach(i=>{ M.seats[+i.dataset.nm].name=i.value; }); $$('#mbox [data-o]').forEach(i=>{ M[i.dataset.o]=i.checked; }); const x=e.target.closest('[data-m]'); if(!x) return; const [k,v,w]=x.dataset.m.split(':'); sfx('click');
    if(k==='go'){ closeModal(); store('smp',M); startGame(); return; } if(k==='h') M.seats[+v].h=+w; else if(k==='n') M.n=+v; else M[k]=v; draw(); }; }
function help(){ helpTabs('Sept Merveilles',[
 ['But du jeu',`<p>Chaque joueur dirige une cité antique et sa merveille pendant trois âges. Le plus grand total de points de victoire l’emporte (égalité : le plus riche).</p><p>À chaque âge, chacun reçoit 7 cartes. Tout le monde choisit <b>en même temps</b> une carte, la joue, puis passe le reste de sa main à son voisin (à gauche aux âges I et III, à droite à l’âge II). On joue 6 cartes, la septième est défaussée.</p>`],
 ['Jouer une carte',`<ul><li><b>Construire</b> le bâtiment en payant son coût avec tes ressources. Il te manque une ressource ? Achète-la à un voisin direct qui la produit : 2 pièces (1 avec un comptoir ou un marché). Les ventes ne coûtent rien au voisin.</li><li><b>Chaîne</b> : certains bâtiments sont gratuits si tu possèdes déjà leur prédécesseur (indiqué sur la carte).</li><li><b>Étape de merveille</b> : utilise la carte, face cachée, pour bâtir l’étape suivante de ta merveille en payant son coût.</li><li><b>Défausser</b> la carte pour gagner 3 pièces.</li></ul><p>On ne peut pas construire deux bâtiments identiques.</p>`],
 ['Les cartes',`<ul><li><b>Marron</b> et <b>grises</b> : produisent des ressources chaque tour.</li><li><b>Bleues</b> : points de victoire.</li><li><b>Jaunes</b> : pièces, commerce moins cher, ressources au choix, points à l’âge III.</li><li><b>Rouges</b> : boucliers pour les conflits.</li><li><b>Vertes</b> : symboles de science (compas, engrenage, tablette).</li><li><b>Violettes</b> (âge III) : guildes, points selon tes voisins ou toi.</li></ul>`],
 ['Conflits et points',`<p>À la fin de chaque âge, chaque cité compare ses boucliers avec ses deux voisins : victoire +1, +3 puis +5 points selon l’âge, défaite −1, égalité rien.</p><ul><li>Pièces : 1 point pour 3.</li><li>Science : pour chaque symbole, le nombre d’exemplaires au carré, plus 7 points par série complète des trois symboles.</li></ul><p class="ex">Exemple : 3 compas, 2 engrenages, 1 tablette → 9 + 4 + 1 + 7 = 21 points.</p>`],
 ['Extensions',`<ul><li><b>Meneurs</b> : avant l’âge I, chacun garde 4 meneurs (on se passe les mains). Au début de chaque âge, on en recrute un (en payant son coût) ou on le renvoie pour 3 pièces. Effets : points, boucliers, science, commerce…</li><li><b>Cités</b> : cartes noires ajoutées à chaque âge. L’impôt fait perdre des pièces aux adversaires (dette de −1 point par pièce manquante), la diplomatie permet d’éviter le prochain conflit.</li><li><b>Armada</b> : en construisant une carte rouge, jaune, bleue ou verte, tu peux payer 1 pièce de plus pour avancer la flotte de cette couleur : puissance navale (batailles avec le voisin de droite à chaque âge), pièces, points ou science.</li><li><b>Édifices</b> : un projet commun par âge. En bâtissant une étape de merveille, tu peux payer pour y participer. S’il y a assez de participants, ils sont récompensés et les autres pénalisés.</li></ul><p>Ces extensions reprennent l’esprit et les grandes mécaniques des originales, sous une forme simplifiée.</p>`],
 ['Jouer ici',`<ul><li>Touche une carte de ta main : l’étiquette indique si elle est prête, ce qu’elle coûte en commerce, ou si elle est gratuite par chaîne.</li><li>Tes voisins sont affichés de part et d’autre de ta cité, avec leurs productions pour le commerce.</li><li>De 3 à 7 cités, humains ou ordinateurs. À plusieurs humains, un écran de passage cache les mains. La partie est sauvegardée automatiquement.</li></ul>`]]); }
window.SM={get G(){return G;},get BUSY(){return BUSY;}};
(function boot(){ const p=load('smp'); if(p) Object.assign(M,p); const s=load(KEY); if(s&&s.G&&s.G.phase!=='over'){ G=s.G; UID=s.UID||999; step(); } else { G=null; render(); menu(); } })();
}
