<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Le téléphone dessiné</title>
<meta name="theme-color" content="#15133a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
:root{--fg:#eef3ff;--accent:#3a7bd5;--title:"Baloo 2",system-ui,sans-serif;--ui:"Nunito Sans",system-ui,sans-serif;--titlec:#d6e8ff}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui,"Nunito Sans",system-ui,sans-serif);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar,#0006);border-bottom:1px solid #fff2;flex-wrap:wrap}
.top h1{font-family:var(--title,Georgia,serif);font-weight:800;font-size:24px;margin:0;color:var(--titlec,#fff);letter-spacing:.5px}
.top h1 small{font-family:var(--ui);font-weight:600;font-size:13px;opacity:.75;margin-left:8px;letter-spacing:0}
.back{color:inherit;opacity:.9;text-decoration:none;font-size:14px;border:1px solid #fff4;padding:5px 10px;border-radius:8px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#ffffff1c;color:inherit;border:1px solid #ffffff40;border-radius:9px;padding:7px 12px;font-size:14px;font-weight:700}
.btn:hover{background:#ffffff2e}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:#fff;color:#222}
.status{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--pc,var(--accent));color:#fff;font-weight:800;min-height:44px;box-shadow:0 4px 14px #0005;transition:background .35s;flex-wrap:wrap}
.status .who{font-family:var(--title,Georgia,serif);font-size:19px}
.status .msg{font-weight:600}
.status .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
#modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:12px}
#modal[hidden]{display:none}
.mbox{background:#fbfaff;color:#1a1740;border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox h2{font-family:var(--title,Georgia,serif);font-size:26px;margin:0 0 6px}
.mbox h4{font-family:var(--title,Georgia,serif);font-size:16px;margin:14px 0 6px}
.mbox p,.mbox li{line-height:1.5}
.mbox .btn{background:#e9e5fb;color:#1a1740;border-color:#cfc9ef}
.mbox .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.mbox .btn.on{background:#1a1740;color:#fff}
.seg{display:inline-flex;border:1px solid #cfc9ef;border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#f1eefc;padding:7px 11px;font-weight:700;color:#1a1740;font-size:13.5px}
.seg button.on{background:#1a1740;color:#fff}
.prow{display:flex;gap:8px;align-items:center;margin:7px 0;flex-wrap:wrap}
.prow .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);border:2px solid #0004}
.prow input[type=text]{font-family:inherit;font-weight:700;font-size:16px;padding:6px 9px;border-radius:8px;border:1px solid #cfc9ef;background:#fff;color:#1a1740;-webkit-text-fill-color:#1a1740;caret-color:var(--accent);width:150px;color-scheme:light}
.prow input[type=text]::placeholder{color:#8f8ab8;-webkit-text-fill-color:#8f8ab8;font-weight:600}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:1px solid #cfc9ef;background:#f1eefc;border-radius:20px;padding:5px 12px;font-weight:800;color:#1a1740}
.tabs button.on{background:#1a1740;color:#fff}
.toast{position:fixed;left:50%;top:100px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #000a;z-index:70;font-weight:700;animation:toast 2.6s forwards;pointer-events:none;max-width:90vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.bannerx{position:fixed;inset:0;display:grid;place-items:center;z-index:65;pointer-events:none}
.bannerx div{font-family:var(--title,Georgia,serif);font-weight:800;font-size:clamp(30px,6vw,64px);color:#fff;background:var(--bc,var(--accent));padding:10px 36px;border-radius:14px;box-shadow:0 20px 50px #000a;animation:ban 2.3s forwards;text-align:center}
.bannerx small{display:block;font-family:var(--ui);font-size:.34em;font-weight:700}
@keyframes ban{0%{transform:scale(2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.92)}}
#cover{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);text-align:center;padding:20px}
#cover[hidden]{display:none}
#cover h2{font-family:var(--title,Georgia,serif);font-size:36px;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
body{background:radial-gradient(ellipse at 50% 0%,#24406e,#0b1426 75%) fixed,#0b1426}
html,body{overscroll-behavior:none}
body{overflow-x:hidden}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 8px 10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{display:block;border-radius:14px;box-shadow:0 10px 30px #0008,0 0 0 2px #ffffff22;touch-action:none;background:#000}
.board{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:980px;min-height:28px}
.bp{display:flex;align-items:center;gap:6px;background:#ffffff14;border:1px solid #ffffff26;border-radius:999px;padding:3px 10px;font-size:13.5px;font-weight:700;white-space:nowrap}
.bp i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px #0004;flex:none}
.bp b{max-width:110px;overflow:hidden;text-overflow:ellipsis}
.bp span{font-family:var(--title);font-weight:800;font-size:16px;margin-left:2px}
.bp small{opacity:.78;font-weight:700}
.bp.me{background:#ffffff30;border-color:#fffa}
.bp.out{opacity:.45}
.rank{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;align-items:center;gap:9px;background:#f0e6cf;border-radius:10px;padding:7px 11px;font-weight:700}
.rank li.me{outline:2px solid var(--accent)}
.rank .pos{font-family:var(--title);font-weight:800;width:20px}
.rank i{width:14px;height:14px;border-radius:50%;flex:none}
.rank span:last-child{margin-left:auto;font-family:var(--title);font-weight:800;font-size:18px}
.note{font-size:14px;color:#6b5d40}
.opts h4{margin:12px 0 5px}
.opts .seg{margin:0 6px 4px 0}
.optnote{font-size:13px;color:#6b5d40;margin:4px 0 0}
.cover-acts{display:flex;flex-direction:column;gap:10px;align-items:stretch;margin-top:12px}
.cover-acts .btn{font-size:16px;padding:12px 14px}
.bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bigchoice button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid #cfc9ef;background:#f1eefc;border-radius:12px;padding:12px;color:#1a1740;font-family:inherit}
.bigchoice button b{font-family:var(--title);font-size:19px}
.bigchoice button small{font-size:13px;color:#5d588a;line-height:1.35}
.bigchoice button.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}
.bigchoice button.pri small{color:#e3f5ea}
@media (max-width:520px){.bigchoice{grid-template-columns:1fr}}
.top h1 small{display:inline}
@media (max-width:520px){.top h1 small{display:none}.top{padding:8px 10px;gap:8px}.top .btn{padding:6px 9px;font-size:13px}}

.cvwrap{position:relative;line-height:0}
.pad{position:absolute;bottom:10px;width:min(56vw,230px);height:min(56vw,230px);touch-action:none;-webkit-user-select:none;user-select:none;z-index:4}
.pad[hidden]{display:none}
.pad[data-pos="centre"]{left:50%;transform:translateX(-50%)}.pad[data-pos="gauche"]{left:10px}.pad[data-pos="droite"]{right:10px}
.pad svg{width:100%;height:100%;display:block;opacity:.62}
.pad .pbg{fill:#0006;stroke:#fff6;stroke-width:2}
.pad .pw path{fill:#ffffff22;stroke:#ffffff55;stroke-width:1.5}.pad .pw .pa{fill:#fffd;stroke:none}
.pad .pw.on path{fill:#ffffff88}.pad .pw.on .pa{fill:#fff}
.pad .pc{fill:#0005;stroke:#fff5}
.step{display:inline-flex;align-items:center;gap:0;border:1px solid #c9b98f;border-radius:9px;overflow:hidden}
.step button{border:0;background:#f6efdc;color:#2a2418;font-weight:900;font-size:18px;width:40px;height:36px;font-family:inherit;cursor:pointer}
.step b{min-width:46px;text-align:center;font-size:17px;color:#2a2418}

/* plein écran immersif et paysage */
#fsExit{display:none}
body.immersive .top,body.immersive .status{display:none}
body.immersive #fsExit{display:grid;place-items:center;position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:60;width:38px;height:38px;border-radius:50%;border:1px solid #fff6;background:#0008;color:#fff;font-size:18px}
body.immersive .stage{padding-top:max(6px,env(safe-area-inset-top))}
@media (orientation:landscape) and (max-height:540px){
 .top{padding:4px 10px}.top h1{font-size:20px}.status{padding:4px 12px;font-size:14px}
 .stage{flex-direction:row;align-items:flex-start;justify-content:center;gap:10px;padding:6px}
 .board{flex-direction:column;flex-wrap:nowrap;max-width:190px;justify-content:flex-start}
 .pad{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));width:min(48vh,180px);height:min(48vh,180px);transform:none!important}
 .pad[data-pos="centre"],.pad[data-pos="gauche"]{left:max(10px,env(safe-area-inset-left));right:auto}
 .pad[data-pos="droite"]{right:max(10px,env(safe-area-inset-right));left:auto}
 .stage:has(.pad:not([hidden]):not([data-pos="droite"])){padding-left:calc(min(48vh,180px) + 20px)}
 .stage:has(.pad[data-pos="droite"]:not([hidden])){padding-right:calc(min(48vh,180px) + 20px)}
}
.tuto{text-align:center}.tuto-ic{font-size:56px;line-height:1.1;margin:4px 0 6px}.tuto h2{margin:0 0 6px}.tuto p{margin:0 auto;max-width:34ch;line-height:1.45}
.tuto-dots{display:flex;gap:6px;justify-content:center;margin:12px 0 2px}.tuto-dots i{width:8px;height:8px;border-radius:50%;background:#c9b98f}.tuto-dots i.on{background:var(--accent)}
.optrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0}.optrow input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}

/* croix tactile : sous le plateau en portrait, à côté en paysage, plus grande sur tablette */
:root{--padsz:min(46vw,210px)}
@media (pointer:coarse) and (min-width:600px){:root{--padsz:min(34vw,300px)}}
@media (orientation:portrait) and (pointer:coarse){
 .cvwrap:has(.pad:not([hidden])){padding-bottom:calc(var(--padsz) + 14px)}
 .cvwrap .pad{bottom:0;width:var(--padsz);height:var(--padsz)}
 .cvwrap .pad[data-pos="gauche"]{left:4px}.cvwrap .pad[data-pos="droite"]{right:4px}
 .cvwrap .pad svg{opacity:.85}
}
@media (orientation:landscape) and (pointer:coarse) and (min-height:541px){
 .pad{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));width:min(36vh,300px);height:min(36vh,300px);transform:none!important}
 .pad svg{opacity:.8}
 .pad[data-pos="centre"],.pad[data-pos="gauche"]{left:max(18px,env(safe-area-inset-left));right:auto}
 .pad[data-pos="droite"]{right:max(18px,env(safe-area-inset-right));left:auto}
 .stage:has(.pad:not([hidden]):not([data-pos="droite"])){padding-left:calc(min(36vh,300px) + 34px)}
 .stage:has(.pad[data-pos="droite"]:not([hidden])){padding-right:calc(min(36vh,300px) + 34px)}
}

.avmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:10px 0;max-height:52vh;overflow:auto;padding:2px}
.avl{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;border:2px solid #c9b98f;background:#fffaf0;padding:8px 4px;cursor:pointer;color:#2a2418}
.avl b{font:800 22px var(--title)}.avl small{font-size:11px;line-height:1.15;text-align:center;min-height:26px}.avl span{color:#e0a800;letter-spacing:1px}
.avl.cur{border-color:var(--accent);box-shadow:0 0 0 3px #2f8a4a55}.avl.lock{opacity:.45;cursor:default}

.hbody p,.hbody li{line-height:1.5}.hbody ul,.hbody ol{padding-left:22px;margin:6px 0}.hbody li{margin:4px 0}.hbody .ex{background:#efe6d0;border-left:4px solid #c9b98f;border-radius:8px;padding:8px 12px;margin:10px 0}
#cv{background:#fff}
.dbelow{width:min(96vw,820px);display:flex;flex-direction:column;gap:6px}
.dtools{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;background:#ffffff14;border-radius:12px;padding:6px}
.dtools[hidden]{display:none}
.dtools button{border:2px solid #ffffff40;border-radius:9px;background:#ffffff20;color:#fff;height:34px;min-width:34px;font-size:17px;display:grid;place-items:center;padding:0;cursor:pointer}
.dtools .dc{background:var(--c);width:30px;min-width:30px;height:30px;border-radius:50%}
.dtools .on{outline:3px solid #ffe066;outline-offset:1px}
.dtools .dw i{display:block;border-radius:50%;background:#fff}
.dtools .dsep{width:8px}
.dchat{display:flex;flex-direction:column;gap:6px}
.dlog{background:#0006;border-radius:12px;padding:6px 10px;height:120px;overflow-y:auto;font-size:14px;line-height:1.35}
.dlog p{margin:2px 0;word-break:break-word}
.dlog .sys{color:#aac;font-style:italic}.dlog .ok{color:#7be07b;font-weight:800}.dlog .close{color:#ffd166;font-weight:800}.dlog .f{opacity:.75}
#dform{display:flex;gap:6px}#dform[hidden]{display:none}
#din{flex:1;min-width:0;border-radius:10px;border:1px solid #ffffff40;background:#fff;color:#111;font:700 16px var(--ui);padding:10px 12px}
.ddw{display:flex;flex-direction:column;gap:8px;margin-top:10px}.ddw .btn{font-size:20px;padding:12px}
@media (orientation:landscape) and (max-height:540px){.dbelow{width:260px}.dlog{height:150px}}

.cvwrap{position:relative}
.treact{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.treact .fly{position:absolute;bottom:6%;font-size:44px;animation:flyup 1.8s ease-out forwards;filter:drop-shadow(0 3px 6px #0006)}
@keyframes flyup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-30px) scale(1.15)}100%{transform:translateY(-320px) scale(1);opacity:0}}
.tpanel{display:flex;flex-direction:column;align-items:center;gap:8px;background:#ffffff14;border-radius:14px;padding:10px}
.tpanel[hidden]{display:none}
.tpanel p{margin:0;text-align:center}.tpanel .tbig{font:800 24px var(--title)}.tpanel .tsmall{opacity:.8;font-size:14px}
.tpanel .btn.big{font-size:18px;padding:12px 24px}
.tform{display:flex;gap:6px;width:100%}.tform input{flex:1;min-width:0;border-radius:10px;border:2px solid #ffffff40;background:#fff;color:#111;font:700 17px var(--ui);padding:11px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.chip{border:2px solid #ffffff40;background:#ffffff1c;color:#fff;border-radius:20px;padding:6px 12px;font-weight:700;cursor:pointer}
.reacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.rb{position:relative;border:2px solid #ffffff40;background:#ffffff1a;border-radius:14px;font-size:26px;width:54px;height:50px;cursor:pointer}
.rb.on{background:#ffe06655;border-color:#ffe066}.rb small{position:absolute;right:-6px;top:-8px;background:#e8433a;color:#fff;font:800 12px var(--ui);border-radius:10px;padding:1px 6px}
.qr{display:flex;gap:4px;flex-wrap:wrap;width:100%;justify-content:center}.qr button{border:1px solid #ffffff40;background:#ffffff14;border-radius:10px;font-size:18px;padding:3px 9px;cursor:pointer}
#dform{flex-wrap:wrap}
.lnames{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:8px 0}.lnames input{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid #cfc9ef;background:#fff;color:#1a1740}

/*top-above*//*hh*/#modal,#cover{top:var(--hh,0px)!important}#modal>*{max-height:calc(100vh - var(--hh,0px) - 24px)!important;max-height:calc(100dvh - var(--hh,0px) - 24px)!important;overflow:auto}
/*top-above*/header.top{position:relative;z-index:61!important}
.ddown{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px 0 6px}.ddown input{flex:1;min-width:180px;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid #cfc9ef;background:#fff;color:#1a1740}.ddown input:focus{outline:none;border-color:#12a594}
</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&display=swap">

 const lastAct={};

 A.pad=(box,cb,rel)=>{ box.innerHTML='<svg viewBox="-100 -100 200 200" aria-hidden="true"><circle r="98" class="pbg"/>'+[0,1,2,3].map(d=>`<g class="pw" data-d="${d}" transform="rotate(${d*90})"><path d="M0 -10 L-60 -70 A85 85 0 0 1 60 -70 Z"/><path class="pa" d="M0 -84 L-16 -60 L16 -60 Z"/></g>`).join('')+'<circle r="22" class="pc"/></svg>';
   let id=null, cur=-1;
   const hit=e=>{ const r=box.getBoundingClientRect(), x=e.clientX-(r.left+r.width/2), y=e.clientY-(r.top+r.height/2); if(Math.hypot(x,y)<r.width*.08) return -1; const d=Math.abs(x)>Math.abs(y)?(x>0?1:3):(y>0?2:0); return d; };
   const set=d=>{ if(d===cur) return; cur=d; box.querySelectorAll('.pw').forEach(g=>g.classList.toggle('on',+g.dataset.d===d)); if(d>=0) cb(d); else if(rel) rel(); };
   box.addEventListener('pointerdown',e=>{ if(blocked()) return; e.preventDefault(); e.stopPropagation(); id=e.pointerId; try{ box.setPointerCapture(id); }catch(x){} cur=-1; set(hit(e)); });
   box.addEventListener('pointermove',e=>{ if(e.pointerId!==id) return; set(hit(e)); });
   const end=()=>{ id=null; set(-1); cur=-1; }; box.addEventListener('pointerup',end); box.addEventListener('pointercancel',end);

const B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

/* ---------- déroulement ---------- */

const kindOf=k=>k===0?'w':k%2?'d':'g';
const chainOf=(s,k,n)=>((s-k)%n+n)%n;
const pickN=n=>{ const o=[]; while(o.length<n){ const w=DD_LISTE[Math.floor(Math.random()*DD_LISTE.length)]; if(!o.includes(w)) o.push(w); } return o; };
function newGame(list,local){ const o=Object.assign({},OPT), n=list.length;
  G={gid:rid(),players:ARC.recolor(list.map(x=>({name:x.name,cid:x.cid||null}))),local:!!local,ns:stagesFor(n,o.len),st:0,phase:'play',left:0,tdraw:o.tdraw,ttxt:o.ttxt,
    ch:list.map(()=>[]),done:[],imgs:{},iv:0,al:null,re:{},sc:list.map(()=>0),chat:[],cn:0,sugg:list.map(()=>pickN(3)),ev:[],evn:0};

function startStage(){ const S=G, kind=kindOf(S.st); S.done=[]; S.imgs={};
  if(kind==='g') S.ch.forEach(ch=>{ const e=ch[S.st-1]; if(e&&e.id) S.imgs[e.id]=L.data[e.id]||''; });
  S.iv++; L.dl=performance.now()+(kind==='d'?S.tdraw:S.ttxt)*1000; L.cur=null; L.dirty=true; emit({t:'stage',k:S.st}); }
function submit(s,k,val){ const S=G; if(!S||S.phase!=='play'||+k!==S.st||S.done.includes(s)||!S.players[s]) return; const n=S.players.length, c=chainOf(s,S.st,n), kind=kindOf(S.st);
  if(kind==='d'){ const id=c+':'+S.st; L.data[id]=String(val||'').slice(0,90000); S.ch[c][S.st]={t:'d',p:s,id}; S.imgs[id]=L.data[id]; S.iv++; }
  else { let v=String(val||'').replace(/\s+/g,' ').trim().slice(0,70); if(!v) v=kind==='w'?(S.sugg[s]||pickN(1))[0]:'…'; S.ch[c][S.st]={t:kind,p:s,v}; }

function startAlbum(){ const S=G; S.phase='album'; S.al={c:0,k:0}; albumImgs(); emit({t:'album'}); L.dirty=true; }
function albumImgs(){ const S=G; S.imgs={}; S.ch[S.al.c].forEach(e=>{ if(e&&e.t==='d') S.imgs[e.id]=L.data[e.id]||''; }); S.iv++; }
const ownerOf=S=>S.al?S.ch[S.al.c][0].p:-1;
function advance(s,force){ const S=G; if(!S||S.phase!=='album') return; if(!force&&s!==ownerOf(S)) return;
  if(S.al.k<S.ns) S.al.k++;
  else if(S.al.c<S.players.length-1){ S.al={c:S.al.c+1,k:0}; albumImgs(); }

  emit({t:'step'}); L.dirty=true; }
function scores(S){ const sc=S.players.map(()=>0); for(const key in S.re){ const [c,k]=key.split(':').map(Number), e=S.ch[c]&&S.ch[c][k]; if(!e) continue; for(const em in S.re[key]) sc[e.p]+=S.re[key][em].filter(x=>x!==e.p).length; } return sc; }
function react(s,c,k,e){ const S=G; if(!S||!REACT.includes(e)||!S.ch[c]||!S.ch[c][k]) return; const key=c+':'+k; const R=S.re[key]||(S.re[key]={}); const a=R[e]||(R[e]=[]);
  const i=a.indexOf(s); if(i>=0) a.splice(i,1); else { a.push(s); emit({t:'re',e,s}); } S.sc=scores(S); L.dirty=true; }

function hostStep(now){ const S=G; if(S.phase!=='play') return;

const SENT={key:null};
const stKey=S=>S.gid+':'+S.st+':'+(S.local?L.cur:'');

const drawing=()=>{ const S=ST(), me=meSeat(), t=myTask(S,me); return !!(t&&t.kind==='d'&&!isDone(S,me)); };
const pos=e=>{ const r=$('#cv').getBoundingClientRect(); return [Math.round((e.clientX-r.left)/r.width*VW),Math.round((e.clientY-r.top)/r.height*VH)]; };
$('#cv').addEventListener('pointerdown',e=>{ if(!drawing()||ARC.blocked()) return; e.preventDefault(); try{ $('#cv').setPointerCapture(e.pointerId); }catch(x){} const p=pos(e); if(p[1]<64) return; MY.draw={c:MY.c,w:MY.w,p:[p[0],p[1],p[0],p[1]],pid:e.pointerId}; });

function sendMine(auto){ const S=ST(), me=meSeat(), t=myTask(S,me); if(!t||isDone(S,me)) return;

function line(ctx,c){ const p=c.p; if(!p||p.length<2) return; ctx.strokeStyle=PAL[c.c]; ctx.lineWidth=WID[c.w]; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(p[0],p[1]); for(let k=2;k<p.length;k+=2) ctx.lineTo(p[k],p[k+1]); if(p.length===2||(p.length===4&&p[0]===p[2]&&p[1]===p[3])) ctx.lineTo(p[0]+.1,p[1]); ctx.stroke(); }
const DC={};
function drawSk(ctx,id,str,x,y,w,h){ let sk=DC[id]; if(!sk||sk.s!==str){ sk={s:str,k:dec(str)}; DC[id]=sk; } ctx.save(); ctx.fillStyle='#fff'; ctx.fillRect(x,y,w,h); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip(); const k=Math.min(w/VW,h/(VH-64)); ctx.translate(x+(w-VW*k)/2,y+(h-(VH-64)*k)/2-64*k); ctx.scale(k,k); sk.k.forEach(c=>line(ctx,c)); ctx.restore();
  if(!sk.k.length) ARC.text(ctx,'(dessin vide)',x+w/2,y+h/2,Math.max(14,22*Math.min(1,w/VW)),'#bbb'); }
function wrap(ctx,txt,x,y,maxW,size,col){ ctx.save(); ctx.font=`800 ${size}px Figtree,system-ui,sans-serif`; ctx.textAlign='center'; ctx.fillStyle=col||'#1a1740'; const words=String(txt).split(' '), lines=[]; let cur='';
  for(const w of words){ const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=t; } if(cur) lines.push(cur);
  const lh=size*1.2; lines.forEach((l,i)=>ctx.fillText(l,x,y+(i-(lines.length-1)/2)*lh+size*.35)); ctx.restore(); }
function card(ctx,who,txt,x,y,w,h,col){ ctx.fillStyle='#fffdf6'; ARC.rrect(ctx,x,y,w,h,22); ctx.fill(); ctx.strokeStyle=col||'#d9cfb4'; ctx.lineWidth=4; ARC.rrect(ctx,x,y,w,h,22); ctx.stroke();
  if(who) ARC.text(ctx,who,x+w/2,y+34,Math.min(22,w/14),col||'#6d6896'); wrap(ctx,'« '+txt+' »',x+w/2,y+h/2+(who?14:0),w-50,Math.max(20,Math.min(46,w/(4+String(txt).length*.42))),'#1a1740'); }
function band(ctx,txt,col,right){ ctx.fillStyle='#000b'; ctx.fillRect(0,0,VW,64); ARC.text(ctx,txt,VW/2,33,txt.length>38?22:30,col||'#fff'); if(right) ARC.text(ctx,right,VW-16,33,28,'#fff',null,'right'); }
const nm=(S,s)=>S.players[s]?S.players[s].name:'?';
function draw(now){ const ctx=cv.begin(), S=ST();
  ctx.fillStyle='#f4efe4'; ctx.fillRect(0,0,VW,VH);
  if(!S){ ARC.text(ctx,'Le téléphone dessiné',VW/2,230,52,'#e8433a','#fff'); ARC.text(ctx,'Un mot, un dessin, une devinette… jusqu’au fou rire',VW/2,296,24,'#555'); const sk=DD_SK['soleil']; if(sk) sk.forEach(([c,w,p])=>line(ctx,{c,w:Math.min(2,Math.round(w/7)),p:p.map((v,k)=>k%2?v*.35+380:v*.35+260)})); return; }

    if(S.local&&L.cur==null){ key='cover:'+S.st+':'+S.done.length; const nx=S.players.findIndex((_,s)=>!S.done.includes(s)); html=nx>=0?`<p class="tbig">Au tour de <b style="color:${S.players[nx].col}">${esc(nm(S,nx))}</b> !</p><p>Les autres, ne regardez pas l’écran 🙈</p><button class="btn pri big" data-a="me" data-s="${nx}">C’est moi, j’y vais</button>`:''; }

    else { key='g:'+stKey(S); html=`<form class="tform" onsubmit="return false"><input id="tin" maxlength="70" autocomplete="off" placeholder="Ce que tu vois…" enterkeyhint="done"><button class="btn pri" data-a="send">Valider</button></form>`; } }
  else if(S.phase==='album'){ const al=S.al, own=ownerOf(S), can=S.local||me===own||host()&&(!ARC.net()||!onlineSeat(S,own)), k=Math.min(al.k,S.ns-1), R=(S.re||{})[al.c+':'+k]||{};

  $('#dtools').hidden=!drawing(); $('#tchat').hidden=!S||S.local;
  if(!S){ ARC.status('Le téléphone dessiné','Choisis un mode : en ligne ou sur un seul écran.','#e8433a'); $('#board').innerHTML=''; $('#dlog').innerHTML=''; panel(); return; }
  const t=myTask(S,me), P=me!=null?S.players[me]:null;
  const msg=S.phase==='over'?'Partie terminée':S.phase==='album'?`album de ${esc(nm(S,ownerOf(S)))}`:!t?'…':isDone(S,me)?'envoyé, on attend les autres':t.kind==='w'?'écris le début de ta chaîne':t.kind==='d'?'dessine la phrase reçue':'devine le dessin reçu';
  ARC.status(S.local?(S.phase==='play'?(L.cur!=null?esc(nm(S,L.cur)):'À qui le tour ?'):'Le téléphone dessiné'):(P?esc(P.name):'Spectateur'),msg,P?P.col:'#e8433a',S.phase==='play'?`Étape ${S.st+1} / ${S.ns}`:'');
  ARC.board($('#board'),S.players.map((p,i)=>({name:p.name,col:p.col,me:i===me&&!S.local,score:S.phase==='play'?'':`${(S.sc||[])[i]||0} ❤️`,tag:S.phase==='play'&&S.done.includes(i)?'✅':S.phase==='album'&&i===ownerOf(S)?'📖':''})));
  chat(S); panel();
  /* envoi automatique à la fin du temps */
  if(S.phase==='play'&&t&&!isDone(S,me)&&!(S.local&&L.cur==null)){ const left=host()?S.left:Math.max(0,S.left-(performance.now()-snap.t)); if(left>0&&left<700) sendMine(true); } }
function onEvent(e){ const S=ST(), me=meSeat(); if(!S) return;
  if(e.t==='stage'){ sfx('go'); MY.sk=[]; MY.draw=null; if(!S.local) banner(kindOf(e.k)==='w'?'Écris !':kindOf(e.k)==='d'?'Dessine !':'Devine !',`Étape ${e.k+1} / ${S.ns}`,'#e8433a'); }
  else if(e.t==='done'){ if(e.s!==me) sfx('pop'); }
  else if(e.t==='album'){ sfx('win'); banner('Les albums !','On découvre les chaînes','#3a7bd5'); }
  else if(e.t==='step') sfx('ding');
  else if(e.t==='re'){ floatEmoji(e.e,S.players[e.s]&&S.players[e.s].col); }
  else if(e.t==='msg'){ if(e.s!==ARC.seat()) sfx('click'); }
  else if(e.t==='over') setTimeout(showEnd,400); }
function showEnd(){ const S=ST(); if(!S||S.phase!=='over') return; const me=ARC.seat(), sc=S.sc||scores(S);
  const r=S.players.map((p,i)=>({name:p.name,col:p.col,me:i===me&&!S.local,v:sc[i]})).sort((a,b)=>b.v-a.v); confetti([r[0].col,'#fff','#ffe066']);
  if(me!=null&&!S.local&&window.PROF) PROF.result('telephone',{win:r[0].me,score:sc[me]});
  ARC.endBox(r[0].v?`${r[0].name} a fait le plus réagir !`:'Fin de la partie',r.map(x=>Object.assign(x,{score:`${x.v} réaction${x.v>1?'s':''}`})),()=>menu(),null); }
/* ---------- boucle ---------- */
ARC.loop((dt,now)=>{ const S=ST(); ARC.idle=!S||S.phase==='over';
  if(G&&host()){ hostStep(now); if(ARC.net()){ if(G.phase==='over'){ if(draw.over!==G.gid){ draw.over=G.gid; ARC.push(G,0,true); } } else if(L.dirty){ if(ARC.push(G,120)) L.dirty=false; } else ARC.push(G,1000); } else L.dirty=false; }
  if(S) ARC.events(S,onEvent); draw(now); hud(); });
/* ---------- menu, options ---------- */
const sg=(k,vals)=>`<div class="seg">${vals.map(([v,l])=>`<button class="${String(OPT[k])===String(v)?'on':''}" data-o="${k}:${v}">${l}</button>`).join('')}</div>`;
function optsHTML(){ return `<h4>Longueur des chaînes</h4>${sg('len',[['court','Un tour de table'],['long','Deux tours']])}<p class="optnote">Chaque chaîne passe par tous les joueurs (deux fois en mode long) et se termine toujours par un dessin.</p>
  <h4>Temps pour dessiner</h4>${sg('tdraw',[[60,'60 s'],[90,'90 s'],[120,'120 s']])}<h4>Temps pour écrire et deviner</h4>${sg('ttxt',[[30,'30 s'],[45,'45 s'],[60,'60 s']])}`; }
function setOpt(b){ const [k,v]=b.dataset.o.split(':'); OPT[k]=/^\d+$/.test(v)?+v:v; store('telephone-opt',OPT); }
function localMenu(){ const me=(typeof HALL!=='undefined'&&HALL.pseudo)||'Joueur 1'; const n=Math.max(3,Math.min(8,LOCAL.n||4)); const names=Array.from({length:n},(_,i)=>LOCAL.names[i]||(i?`Joueur ${i+1}`:me));
  openModal(`<h2>Sur un seul écran</h2><p>On se passe l’appareil : chacun joue à son tour sans regarder ce que font les autres.</p><h4>Joueurs</h4><div class="step"><button data-n="-1">−</button><b>${n}</b><button data-n="1">+</button></div>
    <div class="lnames">${names.map((x,i)=>`<input data-i="${i}" maxlength="14" value="${esc(x)}">`).join('')}</div><div class="opts">${optsHTML()}</div><div class="acts"><button class="btn" data-c="back">Retour</button><button class="btn pri" data-c="go">C’est parti</button></div>`,e=>{
    const keep=()=>{ $$('#mbox .lnames input').forEach(i=>LOCAL.names[+i.dataset.i]=i.value.trim()); store('telephone-local',LOCAL); };
    const o=e.target.closest('[data-o]'); if(o){ keep(); setOpt(o); localMenu(); return; }
    const d=e.target.closest('[data-n]'); if(d){ keep(); LOCAL.n=Math.max(3,Math.min(8,n+ +d.dataset.n)); store('telephone-local',LOCAL); localMenu(); return; }
    const c=e.target.closest('[data-c]'); if(!c) return; if(c.dataset.c==='back'){ closeModal(); menu(); return; }
    keep(); closeModal(); const list=Array.from({length:n},(_,i)=>({name:(LOCAL.names[i]||`Joueur ${i+1}`).slice(0,14)})); newGame(list,true); }); }
function menu(){ const draw=()=>{ openModal(`<h2>Le téléphone dessiné</h2><p>Chacun écrit une phrase, que son voisin dessine. Le suivant devine le dessin, un autre dessine ce qu’il a deviné… À la fin, chacun découvre ce qu’est devenue sa phrase de départ. Fous rires garantis !</p>
   <div class="bigchoice"><button class="pri" data-m="online"><b>Jouer en ligne</b><small>Avec tes amis connectés, chacun sur son écran (2 à 8), avec un chat pour réagir.</small></button><button data-m="local"><b>Sur un seul écran</b><small>De 3 à 8 joueurs, on se passe l’appareil.</small></button></div>
   <div class="opts">${optsHTML()}<h4>Réglages</h4>${window.PROF?PROF.optsHTML():''}</div><div class="acts">${G?'<button class="btn" data-c="close">Fermer</button>':''}</div>`,e=>{ const o=e.target.closest('[data-o]'); if(o){ setOpt(o); draw(); return; }
   if(e.target.closest('[data-c="close"]')){ closeModal(); return; }
   const m=e.target.closest('[data-m]'); if(!m) return; closeModal(); if(m.dataset.m==='online') NET.startUI(); else localMenu(); }); if(window.PROF) PROF.bindOpts($('#mbox')); };
  ARC.tuto('telephone',[['✏️','Écris','Au début, chacun écrit un mot ou une phrase rigolote. C’est le départ de sa chaîne.'],['🎨','Dessine, devine','Tu reçois la phrase d’un autre : dessine-la. Puis tu reçois un dessin : écris ce que tu crois y voir. Et ainsi de suite.'],['📖','Les albums','À la fin, chacun fait défiler sa chaîne, du mot de départ au dessin final. Réagis avec les émojis et le chat !']],draw); }
function help(){ helpTabs('Le téléphone dessiné',[['Règles','<ul><li>Au départ, chaque joueur écrit un mot ou une phrase : c’est le début de <b>sa chaîne</b>.</li><li>Les chaînes tournent : tu reçois la phrase d’un autre et tu la <b>dessines</b>. Ensuite, tu reçois un dessin et tu écris ce que tu crois y voir. Puis tu dessines la devinette suivante… Tout le monde joue en même temps.</li><li>Tu ne vois que ce qu’on te passe : la phrase précédente ou le dessin précédent.</li><li>Chaque chaîne finit par un dessin. Ensuite viennent les <b>albums</b> : l’auteur de chaque phrase de départ fait défiler sa chaîne, jusqu’au dessin final et au bilan « au départ / à l’arrivée ».</li></ul>'],
  ['Réactions et chat','<ul><li>Pendant les albums, réagis à chaque étape avec 😂 😍 😮 👏 💀 🔥. Les réactions s’affichent chez tout le monde.</li><li>Le chat sous l’image sert à se moquer gentiment ou à commenter, à tout moment de la partie (en ligne).</li><li>À la fin, le joueur qui a reçu le plus de réactions est mis à l’honneur.</li></ul>'],
  ['Sur un seul écran','<ul><li>De 3 à 8 joueurs : on se passe l’appareil. Un écran « Au tour de… » cache le travail des autres.</li><li>Quand tout le monde a joué une étape, on passe à la suivante.</li></ul>'],
  ['Temps','<ul><li>Chaque étape a un temps limité (réglable). Si le temps s’écoule, ton dessin ou ton texte part tel quel.</li></ul>']]); }
window.GAME={help,menu,state:()=>G};
document.addEventListener('sdj-opts',e=>{ if(e.detail.k==='cb'&&G) ARC.recolor(G.players); });
/* ---------- en ligne : les images ne partent qu'aux moments utiles ---------- */
const base=ARC.wirer({stat:['players'],skip:['imgs']}); let wiv=null, wn=0;
const IMGC={gid:null,m:{}};
window.NETGAME={id:'telephone',title:'Le téléphone dessiné',min:2,max:8,noAI:true,
  rules:()=>`<div class="opts">${optsHTML()}</div>`, rulesClick(e){ const b=e.target.closest('[data-o]'); if(!b) return false; setOpt(b); return true; },
  start(list){ closeModal(); newGame(list,false); NET.push(null,'new'); }, state:()=>G, busy:()=>false, resume(){},
  wire(S){ if(!S) return S; const o=base(S); const v=S.gid+':'+S.iv; if(v!==wiv){ wiv=v; wn=0; } wn++; if(wn<=4||wn%8===0) o.imgs=S.imgs; return o; },
  adopt(){ if(!G) return; const now=performance.now(); L={data:Object.assign({},IMGC.gid===G.gid?IMGC.m:{}),dl:now+(G.left||15000),dirty:true,cur:null,pdl:0}; G.imgs=Object.assign({},G.imgs||{}); },
  demoted(){ snap.reset(G); },
  act(seat,fn,args){ if(!G||!L) return false; const S=G;
    if(fn==='sub'){ submit(seat,+args[0],args[1]); return true; }
    if(fn==='m'){ say(seat,args[0]); return true; }
    if(fn==='re'){ react(seat,+args[0],+args[1],String(args[2])); return true; }
    if(fn==='nx'){ advance(seat,false); return true; } return false; },
  async receive(m){ if(m.kind==='lobby'){ G=null; snap.reset(null); return; } const S=m.G; if(!S||!ARC.fill(S,['players'])) return; ARC.recolor(S.players);
    if(IMGC.gid!==S.gid){ IMGC.gid=S.gid; IMGC.m={}; } if(S.imgs) Object.assign(IMGC.m,S.imgs); S.imgs=IMGC.m;
    if(!snap.cur||snap.cur.gid!==S.gid||m.kind==='new'){ closeModal(); snap.reset(S); SENT.key=null; } else snap.push(S); G=S; },
  leave(){ G=null; L=null; snap.reset(null); menu(); } };
const skip=/[?&](salle|creer)=/.test(location.search)||(()=>{ const s=load('net-sess'); return s&&s.game==='telephone'&&!s.host; })(); setTimeout(()=>{ if(!G&&!NET.on&&!skip) menu(); },60);
window.TEL={enc,dec,stagesFor,chainOf,MY,sendMine,L:()=>L};
})();
