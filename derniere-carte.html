<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dernière carte</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<style>
/* Table de salon en velours indigo : adversaires en haut, pioche et défausse au centre, ta main en éventail en bas */
:root{--bg:#171433;--fg:#f3f0ff;--accent:#e5383b;--title:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;--ui:"Nunito Sans",system-ui,sans-serif;--titlec:#fff6d8;--cr:#e5383b;--cy:#f5bd1f;--cg:#22a96b;--cb:#2f78dc;--ck:#1d1b26;--felt:#2b2560;--felt2:#1b1742;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui,"Nunito Sans",system-ui,sans-serif);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar,#0006);border-bottom:1px solid #fff2;flex-wrap:wrap}
.top h1{font-family:var(--title,Georgia,serif);font-weight:800;font-size:24px;margin:0;color:var(--titlec,#fff);letter-spacing:.5px}
.top h1 small{font-family:var(--ui);font-weight:600;font-size:13px;opacity:.75;margin-left:8px;letter-spacing:0}
.back{color:inherit;opacity:.9;text-decoration:none;font-size:14px;border:1px solid #fff4;padding:5px 10px;border-radius:8px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#ffffff1c;color:inherit;border:1px solid #ffffff40;border-radius:9px;padding:7px 12px;font-size:14px;font-weight:700}
.btn:hover{background:#ffffff2e}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:#fff;color:#222}
.status{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--pc,var(--accent));color:#fff;font-weight:800;min-height:44px;box-shadow:0 4px 14px #0005;transition:background .35s;flex-wrap:wrap}
.status .who{font-family:var(--title,Georgia,serif);font-size:19px}
.status .msg{font-weight:600}
.status .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
#modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:12px}
#modal[hidden]{display:none}
.mbox{background:#fbf6ea;color:#2a2418;border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox h2{font-family:var(--title,Georgia,serif);font-size:26px;margin:0 0 6px}
.mbox h4{font-family:var(--title,Georgia,serif);font-size:16px;margin:14px 0 6px}
.mbox p,.mbox li{line-height:1.5}
.mbox .btn{background:#ece3cf;color:#2a2418;border-color:#c9b98f}
.mbox .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.mbox .btn.on{background:#2a2418;color:#fff}
.seg{display:inline-flex;border:1px solid #c9b98f;border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#f6efdc;padding:7px 11px;font-weight:700;color:#2a2418;font-size:13.5px}
.seg button.on{background:#2a2418;color:#fff}
.prow{display:flex;gap:8px;align-items:center;margin:7px 0;flex-wrap:wrap}
.prow .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);border:2px solid #0004}
.prow input[type=text]{font-family:inherit;font-weight:700;font-size:16px;padding:6px 9px;border-radius:8px;border:1px solid #c9b98f;background:#fff;color:#2a2418;-webkit-text-fill-color:#2a2418;caret-color:var(--accent);width:150px;color-scheme:light}
.prow input[type=text]::placeholder{color:#a3926e;-webkit-text-fill-color:#a3926e;font-weight:600}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:1px solid #c9b98f;background:#f6efdc;border-radius:20px;padding:5px 12px;font-weight:800;color:#2a2418}
.tabs button.on{background:#2a2418;color:#fff}
.toast{position:fixed;left:50%;top:100px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #000a;z-index:70;font-weight:700;animation:toast 2.6s forwards;pointer-events:none;max-width:90vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.bannerx{position:fixed;inset:0;display:grid;place-items:center;z-index:65;pointer-events:none}
.bannerx div{font-family:var(--title,Georgia,serif);font-weight:800;font-size:clamp(30px,6vw,64px);color:#fff;background:var(--bc,var(--accent));padding:10px 36px;border-radius:14px;box-shadow:0 20px 50px #000a;animation:ban 2.3s forwards;text-align:center}
.bannerx small{display:block;font-family:var(--ui);font-size:.34em;font-weight:700}
@keyframes ban{0%{transform:scale(2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.92)}}
#cover{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);text-align:center;padding:20px}
#cover[hidden]{display:none}
#cover h2{font-family:var(--title,Georgia,serif);font-size:36px;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
.hbody p,.hbody li{line-height:1.5}.hbody ul,.hbody ol{padding-left:22px;margin:6px 0}.hbody li{margin:4px 0}.hbody .ex{background:#efe6d0;border-left:4px solid #c9b98f;border-radius:8px;padding:8px 12px;margin:10px 0}
/*top-above*//*hh*/#modal,#cover{top:var(--hh,0px)!important}#modal>*{max-height:calc(100vh - var(--hh,0px) - 24px)!important;max-height:calc(100dvh - var(--hh,0px) - 24px)!important;overflow:auto}
/*top-above*/header.top{position:relative;z-index:61!important}

/* hall (autonome : portail et jeux) */
#hall-modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;padding:12px}
#hall-modal[hidden]{display:none}
.hall-box{background:#fbf6ea;color:#2a2418;border-radius:16px;max-width:560px;width:100%;max-height:calc(100dvh - 24px);overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;font-family:"Nunito Sans",Karla,system-ui,sans-serif;text-align:left}
.hall-box h2{font-family:Georgia,serif;font-size:24px;margin:0 0 6px;color:#2a2418}
.hall-box h4{font-family:Georgia,serif;font-size:16px;margin:14px 0 6px;color:#2a2418}
.hall-box p{line-height:1.45;margin:6px 0}
.hall-in{font-weight:800;font-size:16px;font-family:inherit;padding:9px 11px;border-radius:9px;border:1px solid #c9b98f;background:#fff!important;color:#2a2418!important;-webkit-text-fill-color:#2a2418!important;caret-color:#2a2418;width:100%;max-width:300px}
.hall-in::placeholder{color:#a3926e!important;-webkit-text-fill-color:#a3926e!important;font-weight:600}
.hall-err{color:#b0412e;font-weight:800;min-height:1.2em;font-size:14px}
.hall-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.hall-btn{font-weight:800;font-size:14px;line-height:1;font-family:inherit;border-radius:9px;padding:8px 12px;border:1px solid #c9b98f;background:#ece3cf;color:#2a2418;cursor:pointer;touch-action:manipulation}
.hall-btn.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}
.hall-btn:disabled{opacity:.5}
.hall-link{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;cursor:pointer}
.hall-note{color:#6b5d40;font-size:14px}
.hall-me{background:#f0e6cf;border-radius:10px;padding:8px 10px;margin:6px 0}
.hall-list{list-style:none;margin:4px 0;padding:0;display:flex;flex-direction:column;gap:5px}
.hall-list li{display:flex;align-items:center;gap:9px;background:#f6efdc;border-radius:10px;padding:6px 8px}
.hall-tx{flex:1;min-width:0;display:flex;flex-direction:column}.hall-tx small{color:#6b5d40;font-size:12.5px}
.hall-av{width:30px;height:30px;border-radius:50%;background:#2a2418;color:#fff;display:grid;place-items:center;font-weight:900;flex:none;text-transform:uppercase}
.hall-games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.hall-spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid #c9b98f;border-top-color:#2a2418;animation:hallr 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes hallr{to{transform:rotate(360deg)}}
.hall-invite{position:fixed;right:12px;bottom:12px;z-index:85;background:#fbf6ea;color:#2a2418;border-radius:14px;padding:12px 14px 14px;box-shadow:0 14px 40px #000b;max-width:min(360px,calc(100vw - 24px));font-family:"Nunito Sans",Karla,system-ui,sans-serif;animation:hallin .35s cubic-bezier(.2,1.3,.4,1);overflow:hidden;border:2px solid #1d8f5a}
.hall-invite .hall-acts{margin-top:8px}
.hall-invite .hall-bar{position:absolute;left:0;bottom:0;height:4px;background:#1d8f5a;width:100%;animation:hallt 30s linear forwards}
@keyframes hallt{to{width:0}}
@keyframes hallin{from{transform:translateY(30px);opacity:0}}
.hall-toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-weight:700;font-family:system-ui,sans-serif}
#hall-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 0}
.hall-pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 13px;border:1px solid rgba(255,255,255,.25);background:rgba(29,143,90,.25);color:#eef3ea;font-weight:700;font-size:14px;line-height:1;font-family:inherit;cursor:pointer}
.hall-pill span{color:#d8b25a}
.hall-sub{font-size:14px;color:#a9c2b3}.hall-sub .hall-link{color:#eef3ea}
.hall-dot{width:9px;height:9px;border-radius:50%;background:#7dffb5;box-shadow:0 0 0 2px #fff4;animation:hallp 1.8s infinite}.hall-dot.off{background:#aaa;animation:none}
@keyframes hallp{50%{box-shadow:0 0 0 5px #7dffb500}}

/* salle en ligne */
#netBtn{display:inline-flex;align-items:center;gap:6px}
#netBtn.net-on{background:#1d8f5a;border-color:#1d8f5a;color:#fff}
.net-dot{width:9px;height:9px;border-radius:50%;background:#7dffb5;box-shadow:0 0 0 2px #fff6;animation:netp 1.8s infinite}
.net-dot.off{background:#ffb347;animation:none}
@keyframes netp{50%{box-shadow:0 0 0 5px #7dffb500}}
.hall-box .net-in,.mbox .net-in{font-family:inherit;font-weight:800;font-size:16px;padding:9px 11px;border-radius:9px;border:1px solid #c9b98f;background:#fff!important;color:#2a2418!important;-webkit-text-fill-color:#2a2418!important;caret-color:#2a2418;width:100%;max-width:280px}
.hall-box .net-in::placeholder,.mbox .net-in::placeholder{color:#a3926e!important;-webkit-text-fill-color:#a3926e!important;font-weight:600}
.hall-box .net-code,.mbox .net-code{letter-spacing:.35em;text-transform:uppercase;font-size:22px;text-align:center;max-width:170px}
.net-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.net-box{border:1px solid #d9caa4;border-radius:12px;padding:10px 12px;background:#f6efdc;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.net-box h4{margin:0!important}.net-box p{margin:0;font-size:14px}
.net-note{font-size:13.5px;color:#6b5d40}
.net-code-big{display:flex;gap:8px;justify-content:center;margin:10px 0}
.net-code-big b{font-family:var(--title,Georgia,serif);font-size:40px;width:58px;height:66px;display:grid;place-items:center;border-radius:12px;background:#2a2418;color:#fff;box-shadow:0 6px 0 #0003}
.net-share{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.net-list{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:5px}
.net-list li{display:flex;align-items:center;gap:8px;font-weight:800;background:#f6efdc;border-radius:10px;padding:6px 9px;flex-wrap:wrap}
.net-list li small{font-weight:600;color:#6b5d40}.net-list li.ai{opacity:.8}
.net-av{width:26px;height:26px;border-radius:50%;background:#2a2418;color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.net-ok{color:#1d7a46;font-weight:800}.net-ko{color:#b0412e;font-weight:800}
.net-wait{display:flex;align-items:center;gap:10px;font-weight:700}
.net-spin{width:18px;height:18px;border-radius:50%;border:3px solid #c9b98f;border-top-color:#2a2418;animation:netr 1s linear infinite;flex:none}
@keyframes netr{to{transform:rotate(360deg)}}
.net-rules{margin-top:6px}
@media (max-width:560px){.net-two{grid-template-columns:1fr}.net-code-big b{font-size:32px;width:50px;height:58px}}
.net-me{background:#f0e6cf;border-radius:10px;padding:8px 10px;margin:6px 0}
.net-link{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;cursor:pointer}
.net-chk{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;margin:6px 0}.net-chk input{width:18px;height:18px}
.net-list li .net-r{margin-left:auto}
/* contrôles dans la boîte du hall (indépendants du jeu) */
.hall-box .btn{background:#ece3cf;color:#2a2418;border:1px solid #c9b98f;border-radius:9px;padding:8px 12px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;line-height:1.1}
.hall-box .btn.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}.hall-box .btn:disabled{opacity:.45;cursor:default}
.hall-box .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.hall-box .seg{display:inline-flex;border:1px solid #c9b98f;border-radius:9px;overflow:hidden;flex-wrap:wrap;margin:2px 0}
.hall-box .seg button{border:0;background:#f6efdc;padding:7px 11px;font-weight:700;color:#2a2418;font-size:13.5px;font-family:inherit;cursor:pointer}
.hall-box .seg button.on{background:#2a2418;color:#fff}
.hall-box .opt{display:flex;align-items:flex-start;gap:8px;margin:6px 0;line-height:1.35}.hall-box .opt input{width:20px;height:20px;flex:none}
.hall-box label{color:#2a2418}
.net-fab{position:fixed;left:10px;bottom:10px;z-index:45;border-radius:999px!important;padding:8px 13px!important;background:#1b1b1f!important;color:#fff!important;border:1px solid #fff4!important;font-weight:800;box-shadow:0 6px 18px #0008;font-family:system-ui,sans-serif}
#netBtn .net-dot{display:inline-block;margin-right:5px;vertical-align:1px}

body{background:radial-gradient(ellipse at 50% 38%,#3a3280 0%,#1b1742 55%,#100d26 100%) fixed,#100d26}
.status{gap:10px}
.dct{display:flex;flex-direction:column;gap:10px;padding:10px max(10px,env(safe-area-inset-right,0px)) 14px max(10px,env(safe-area-inset-left,0px));max-width:1100px;margin:0 auto;min-height:calc(100vh - 110px)}
/* adversaires */
.dc-opps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dc-seat{position:relative;display:flex;align-items:center;gap:8px;background:#ffffff10;border:1px solid #ffffff22;border-radius:14px;padding:6px 10px 6px 6px;min-width:0;transition:box-shadow .3s,transform .3s}
.dc-seat.on{box-shadow:0 0 0 3px #fff6d8,0 0 22px #fff6d866;transform:translateY(-2px)}
.dc-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--title);font-size:17px;color:#fff;flex:none;box-shadow:inset 0 -3px 0 #0003}
.dc-nm{font-weight:800;font-size:14px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc-ct{font-size:12px;color:#c9c3ef;font-variant-numeric:tabular-nums}
.dc-fan{display:flex;margin-left:2px}
.dc-fan i{width:12px;height:18px;border-radius:3px;background:linear-gradient(135deg,#2b2560,#5b4fc4);border:1px solid #ffffffa0;margin-left:-6px}
.dc-fan i:first-child{margin-left:0}
.dc-bub{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:var(--cy);color:#2a1d00;font-family:var(--title);font-size:13px;padding:2px 10px;border-radius:12px;white-space:nowrap;box-shadow:0 4px 10px #0007;animation:bub .5s cubic-bezier(.3,1.6,.5,1);z-index:3}
@keyframes bub{from{transform:translateX(-50%) scale(0)}}
.dc-catch{position:absolute;right:-6px;bottom:-12px;background:var(--cr);color:#fff;border:2px solid #fff;border-radius:12px;font-weight:900;font-size:12px;padding:3px 8px;animation:wob .6s infinite alternate;z-index:4}
@keyframes wob{to{transform:rotate(-6deg) scale(1.08)}}
.dc-x{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--title);font-size:40px;color:#fff;text-shadow:0 0 12px var(--cr);animation:xx .9s forwards}
@keyframes xx{0%{transform:scale(2.4);opacity:0}30%{transform:scale(1);opacity:1}100%{opacity:0}}
/* centre */
.dc-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(18px,5vw,48px);min-height:200px;position:relative}
.dc-ring{position:absolute;width:min(420px,88vw);aspect-ratio:1;max-width:100%;border-radius:50%;pointer-events:none;opacity:.55}
.dc-ring svg{width:100%;height:100%;animation:spin 14s linear infinite}
.dc-ring.ccw svg{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.dc-pile{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.dc-pile small{font-size:12px;color:#e9e4ff;font-weight:700;background:#100d26cc;padding:2px 9px;border-radius:10px;margin-top:10px;white-space:nowrap}
.dc-deck{background:none;border:0;padding:0;position:relative}
.dc-deck .crd{box-shadow:3px 3px 0 #1b1742,6px 6px 0 #5b4fc4,7px 7px 0 #1b1742,0 12px 22px #0009}
.dc-deck.can .crd{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:3px 3px 0 #1b1742,6px 6px 0 #5b4fc4,0 0 0 6px #fff6d888,0 12px 22px #0009}}
.dc-disc{position:relative;width:var(--cw);height:calc(var(--cw)*1.5)}
.dc-disc .crd{position:absolute;inset:0}
.dc-halo{position:absolute;inset:-14px;border-radius:22px;transition:box-shadow .4s,background .4s}
.dc-pend{position:absolute;right:-16px;top:-14px;background:var(--cr);color:#fff;font-family:var(--title);font-size:20px;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;border:3px solid #fff;z-index:4;animation:bub .4s}
/* cartes */
.dct{--cw:clamp(70px,9vw,96px)}
.crd{width:var(--cw);height:calc(var(--cw)*1.5);border-radius:calc(var(--cw)*.12);background:#fff;padding:calc(var(--cw)*.06);box-shadow:0 4px 10px #0006;position:relative;flex:none;user-select:none}
.crd .in{position:absolute;inset:calc(var(--cw)*.06);border-radius:calc(var(--cw)*.08);overflow:hidden;display:grid;place-items:center;color:#fff}
.crd.r .in{background:var(--cr)}.crd.y .in{background:var(--cy)}.crd.g .in{background:var(--cg)}.crd.b .in{background:var(--cb)}.crd.w .in{background:var(--ck)}
.crd .in::before{content:"";position:absolute;width:150%;height:38%;background:#ffffff26;transform:rotate(-32deg)}
.crd .big{position:relative;font-family:var(--title);font-size:calc(var(--cw)*.52);line-height:1;text-shadow:0 3px 0 #0005,0 0 1px #000;-webkit-text-stroke:1px #0004}
.crd .cn{position:absolute;font-family:var(--title);font-size:calc(var(--cw)*.17);line-height:1;text-shadow:0 1px 0 #0006}
.crd .cn.a{left:7%;top:5%}.crd .cn.b{right:7%;bottom:5%;transform:rotate(180deg)}
.crd svg.sym{position:relative;width:62%;height:auto;filter:drop-shadow(0 3px 0 #0005)}
.crd.back{background:#fff}
.crd.back .in{background:radial-gradient(circle at 50% 50%,#5b4fc4,#2b2560)}
.crd.back .in::before{display:none}
.crd.back .lg{position:relative;font-family:var(--title);font-size:calc(var(--cw)*.2);color:#fff6d8;transform:rotate(-24deg);text-align:center;line-height:.95;text-shadow:0 2px 0 #0007}
/* ma main */
.dct:not(.ffm) .dc-me{position:sticky;bottom:0;z-index:5;background:linear-gradient(#251f57f2,#1b1742f8);backdrop-filter:blur(6px)}
.dc-me{display:flex;flex-direction:column;gap:8px;background:linear-gradient(#ffffff0c,#ffffff04);border:1px solid #ffffff1c;border-radius:18px;padding:8px 10px 10px}
.dc-me.flip{transform:rotate(180deg)}
.dc-mehd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dc-mehd .dc-nm{font-size:15px;max-width:none}
.dc-acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.dc-hand{display:flex;justify-content:center;padding:14px 8px 6px;overflow-x:auto;overflow-y:visible;min-height:calc(var(--cw)*1.5 + 24px);scrollbar-width:thin}
.dc-hand .hc{background:none;border:0;padding:0;margin-left:calc(var(--cw)*var(--ov,-.35));transition:transform .18s,margin .2s;position:relative}
.dc-hand .hc:first-child{margin-left:0}
.dc-hand .hc.ok{transform:translateY(-12px)}
.dc-hand .hc.ok:hover,.dc-hand .hc.ok:focus-visible{transform:translateY(-22px) rotate(-2deg);z-index:2}
.dc-hand .hc.no .crd{filter:brightness(.55) saturate(.6)}
.dc-hand .hc.nw .crd{animation:nw .6s}
@keyframes nw{0%{transform:translateY(-60px) scale(.6);opacity:0}}
.dc-hide{display:grid;place-items:center;min-height:calc(var(--cw)*1.5 + 24px)}
.btn.last{background:var(--cy);border-color:var(--cy);color:#2a1d00;font-family:var(--title);font-size:16px;letter-spacing:.5px;animation:wob .5s infinite alternate}
.btn.last.done{animation:none;opacity:.6}
.fly{position:fixed;z-index:80;pointer-events:none;transition:transform .45s cubic-bezier(.35,.1,.25,1.2),opacity .3s}
/* modales */
.dc-cols{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.dc-cols button{height:86px;border-radius:16px;border:4px solid #fff;font-family:var(--title);font-size:22px;color:#fff;text-shadow:0 2px 0 #0006;box-shadow:0 6px 14px #0004;transition:transform .15s}
.dc-cols button:hover{transform:scale(1.04)}
.seatrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}
.seatrow input[type=text]{width:130px}
.scl{width:100%;border-collapse:collapse;margin:8px 0}.scl td,.scl th{padding:5px 8px;border-bottom:1px solid #e2d6b8;text-align:left}.scl td:last-child,.scl th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.scl tr.w td{font-weight:900;color:#1d6f3e}
.opt{display:flex;align-items:flex-start;gap:8px;margin:6px 0;line-height:1.35}
.opt input{width:20px;height:20px;margin-top:1px;flex:none}
.ff .dc-opps{order:0}
@media (max-width:600px){.dct{--cw:62px;padding-inline:8px;min-height:0}.dc-mid{min-height:190px}.dc-ring{width:min(300px,80vw)}.dc-seat{padding:4px 8px 4px 4px}.dc-av{width:28px;height:28px;font-size:14px}.dc-nm{max-width:72px;font-size:13px}.dc-fan{display:none}}
</style></head><body>
<header class="top"><a class="back" href="index.html">← Salle de jeux</a><h1>Dernière carte<small>dans l’esprit du Uno</small></h1>
<div class="tools"><button class="btn" id="sndBtn" data-c="sound">Son</button><button class="btn" data-c="help">Aide</button><button class="btn pri" data-c="new">Nouvelle partie</button></div></header>
<div class="status" id="status"></div>
<main class="dct" id="tbl"></main>
<div id="cover" hidden></div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SVGNS='http://www.w3.org/2000/svg';
function sel(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,REDUCED?Math.min(ms,30):ms));
function openModal(h,onclick){ $('#mbox').innerHTML=h; $('#mbox').onclick=onclick||null; $('#modal').hidden=false; }
function paintModal(h){ $('#mbox').innerHTML=h; $('#modal').hidden=false; }
function helpTabs(title,tabs){ let k=0; const draw=()=>paintModal('<h2>'+title+'</h2>'+(tabs.length>1?'<div class="tabs">'+tabs.map((t,i)=>'<button class="'+(i===k?'on':'')+'" data-ht="'+i+'">'+t[0]+'</button>').join('')+'</div>':'')+'<div class="hbody">'+tabs[k][1]+'</div><div class="acts"><button class="btn pri" data-c="close">Compris</button></div>'); draw(); $('#mbox').onclick=e=>{ const b=e.target.closest('[data-ht]'); if(b){ k=+b.dataset.ht; draw(); $('#mbox').scrollTop=0; } }; }
function closeModal(){ $('#modal').hidden=true; $('#mbox').onclick=null; window.COVER_HIDDEN=null; }
function toast(s){ const t=document.createElement('div'); t.className='toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2700); }
function banner(s,sub,col){ const b=document.createElement('div'); b.className='bannerx'; b.innerHTML=`<div style="${col?'--bc:'+col:''}">${esc(s)}${sub?`<small>${esc(sub)}</small>`:''}</div>`; document.body.appendChild(b); setTimeout(()=>b.remove(),2400); }
function confetti(cols){ if(REDUCED) return; cols=cols||['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#fff']; for(let i=0;i<80;i++){ const c=document.createElement('div'); c.style.cssText=`position:fixed;top:-12px;left:${Math.random()*100}vw;width:8px;height:12px;background:${cols[i%cols.length]};z-index:90;pointer-events:none;border-radius:2px`; document.body.appendChild(c);
  c.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*220}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`}],{duration:2200+Math.random()*1800,delay:Math.random()*700,easing:'ease-in'}).finished.then(()=>c.remove()); } }
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
/* sons */
let MUTED=!!load('salle-mute'), AC=null, NOISE=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(AC.state==='suspended') AC.resume().catch(()=>{}); return AC; }
function tn(a,t,f,d,type,v,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function nz(a,t,d,v,type,f){ if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;} const s=a.createBufferSource();s.buffer=NOISE;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02); }
function sfx(n){ if(MUTED) return; const a=ac(); if(!a||a.state!=='running') return; const t=a.currentTime+.01;
  switch(n){
    case 'click': tn(a,t,900,.06,'triangle',.06); break;
    case 'move': nz(a,t,.08,.25,'bandpass',900); tn(a,t,220,.08,'sine',.08); break;
    case 'capture': nz(a,t,.12,.35,'bandpass',1400); tn(a,t,520,.12,'triangle',.1,260); break;
    case 'card': nz(a,t,.1,.22,'bandpass',2800); break;
    case 'flip': nz(a,t,.06,.25,'highpass',3000); tn(a,t,1200,.05,'triangle',.04); break;
    case 'dice': for(let k=0;k<6;k++) nz(a,t+k*.07+Math.random()*.03,.05,.3,'bandpass',1800+Math.random()*1200); break;
    case 'ding': tn(a,t,1320,.5,'sine',.1); tn(a,t+.07,1760,.4,'sine',.06); break;
    case 'error': tn(a,t,220,.25,'square',.05,160); break;
    case 'win': [523,659,784,1046].forEach((f,k)=>tn(a,t+k*.12,f,.4,'triangle',.11)); break;
    case 'lose': [392,330,262].forEach((f,k)=>tn(a,t+k*.16,f,.45,'triangle',.1)); break;
    case 'splash': nz(a,t,.5,.3,'lowpass',800); break;
    case 'boom': nz(a,t,.7,.6,'lowpass',300); tn(a,t,90,.6,'sawtooth',.15,40); break;
    case 'pop': tn(a,t,600,.08,'sine',.1,900); break;
  } }
function updSnd(){ const b=$('#sndBtn'); if(b) b.textContent=MUTED?'Son : non':'Son : oui'; }
document.addEventListener('click',e=>{
  if(!MUTED) ac();
  if(e.target.id==='modal'&&window.MODAL_CLOSABLE!==false){ const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; return; }
  const t=e.target.closest('[data-c]'); if(!t) return;
  switch(t.dataset.c){
    case 'sound': MUTED=!MUTED; store('salle-mute',MUTED); updSnd(); break;
    case 'help': GAME.help(); break;
    case 'new': { const cv=$('#cover'); window.MODAL_CLOSABLE=true; GAME.menu(); if(cv&&!cv.hidden){ cv.hidden=true; window.COVER_HIDDEN=cv; } break; }
    case 'close': { const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; break; }
  }
});
addEventListener('DOMContentLoaded',updSnd);


/* ===== Hall de la Salle de jeux : joueurs connectés, pseudos uniques, tables ouvertes, invitations (Supabase Realtime, sans base) ===== */
const HALL=(()=>{
 const SB_URL='https://evepcodcppxpufbkuflq.supabase.co', SB_KEY='sb_publishable_iUC6966SeFt_05Iac1wGQw_yDo9zl7y';
 const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
 const SITE='https://mushu1994.github.io/duel-des-ages/';
 const GAMES={"derniere-carte":"Dernière carte","quitte-ou-sept":"Quitte ou Sept","joyaux-renaissance":"Joyaux de la Renaissance","sept-merveilles":"Sept Merveilles","echecs":"Échecs","quatre-en-ligne":"Quatre en ligne","reversi":"Reversi","dames":"Dames","bataille-navale":"Bataille navale","code-secret":"Code Secret","bataille":"La Bataille","petits-chevaux":"Petits Chevaux","dominos":"Dominos","tetes-de-boeuf":"Têtes de Bœuf","plus-bas":"Plus Bas","petit-bac":"Petit Bac","poker":"Poker","president":"Président","tarot":"Tarot","rami":"Rami voleur","remparts":"Remparts","conquete":"Conquête","approche-finale":"Approche finale"};
 const q=s=>document.querySelector(s), es=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const ld=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, sv=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
 const note=s=>{ if(typeof toast==='function') return toast(s); const t=document.createElement('div'); t.className='hall-toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); };
 const H={note,ready:false,ok:null,pseudo:ld('net-name')||'',peers:{},me:{},listeners:[],page:'',title:''};
 let cid=ld('net-cid'); if(!cid){ cid=Math.random().toString(36).slice(2,10); sv('net-cid',cid); } H.cid=cid;
 const key=p=>String(p||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[^a-z0-9]/g,'');
 H.key=key;
 let client=null, ch=null, libP=null, syncedP=null, syncRes=null, at=ld('net-at')||Date.now();
 function lib(){ if(window.supabase) return Promise.resolve(); if(libP) return libP; libP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=LIB; s.onload=res; s.onerror=()=>{ libP=null; rej(new Error('lib')); }; document.head.appendChild(s); }); return libP; }
 H.client=async()=>{ await lib(); if(!client) client=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}}); return client; };
 /* ---------- connexion au hall ---------- */
 H.connect=async()=>{ if(ch) return syncedP; syncedP=new Promise(r=>syncRes=r);
   try{ await H.client(); }catch(e){ H.ok=false; paint(); return syncedP; }
   ch=client.channel('salle:hall',{config:{broadcast:{self:false},presence:{key:H.cid}}});
   ch.on('presence',{event:'sync'},onSync);
   ch.on('broadcast',{event:'inv'},({payload:p})=>{ if(p.to===H.cid) invited(p); });
   ch.on('broadcast',{event:'invr'},({payload:p})=>{ if(p.to===H.cid) note(p.ok?`${p.fromP} arrive à ta table`:`${p.fromP} ne peut pas jouer maintenant`); });
   const to=setTimeout(()=>{ if(H.ok==null){ H.ok=false; paint(); syncRes(); } },9000);
   ch.subscribe(async st=>{ if(st==='SUBSCRIBED'){ clearTimeout(to); H.ok=true; await track(); setTimeout(()=>syncRes(),900); paint(); } else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ if(H.ok==null){ H.ok=false; paint(); syncRes(); } } });
   return syncedP; };
 function payload(){ return Object.assign({p:H.pseudo,k:key(H.pseudo),at,g:H.page,gt:H.title},H.me); }
 async function track(){ if(!ch) return; try{ await ch.track(payload()); }catch(e){} }
 function onSync(){ const st=ch.presenceState(), peers={}; for(const k in st){ const m=st[k][st[k].length-1]; if(m) peers[k]=m; } H.peers=peers;
   // doublon de pseudo : le plus récent cède la place
   if(H.pseudo){ const mk=key(H.pseudo); for(const k in peers){ if(k===H.cid) continue; const o=peers[k]; if(o.p&&o.k===mk&&(o.at<at||(o.at===at&&k<H.cid))){ const old=H.pseudo; H.pseudo=''; sv('net-name',null); track(); note(`Le pseudo « ${old} » est déjà utilisé par quelqu’un d’autre`); setTimeout(()=>H.askPseudo(),300); break; } } }
   paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); }
 H.onChange=f=>H.listeners.push(f);
 H.set=o=>{ Object.assign(H.me,o); track(); };
 H.where=(page,title)=>{ H.page=page; H.title=title; track(); };
 H.list=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&m.p).map(([k,m])=>Object.assign({cid:k},m)).sort((a,b)=>a.p.localeCompare(b.p));
 H.count=()=>Object.keys(H.peers).length;
 H.tables=g=>Object.entries(H.peers).map(([k,m])=>m.p&&m.r&&m.r.host&&m.r.open&&!m.r.started&&m.r.n<m.r.max&&(!g||m.r.g===g)?Object.assign({cid:k,p:m.p},m.r):null).filter(Boolean);
 H.free=p=>{ const k=key(p); return !Object.entries(H.peers).some(([c,m])=>c!==H.cid&&m.p&&m.k===k); };
 H.anon=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&!m.p).length;
 /* ---------- pseudo ---------- */
 H.setPseudo=async p=>{ p=String(p||'').replace(/\s+/g,' ').trim(); if(p.length<2||p.length>16||key(p).length<2) return 'Entre 2 et 16 caractères (lettres ou chiffres).';
   if(/^(ordi|ordinateur|bot|ia|robot)\d*$/i.test(key(p))) return 'Ce pseudo est réservé.';
   await H.connect(); if(!H.ok) return 'Connexion impossible pour le moment.';
   if(!H.free(p)) return `« ${p} » est déjà utilisé par quelqu’un en ligne.`;
   H.pseudo=p; at=Date.now(); sv('net-at',at); sv('net-name',p); await track(); paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); return null; };
 H.ensure=()=>H.pseudo?Promise.resolve(H.pseudo):new Promise(res=>H.askPseudo(res));
 H.askPseudo=(cb)=>{ openBox(`<h2>Ton pseudo</h2><p>Il s’affiche pour les autres joueurs connectés. Deux personnes en ligne ne peuvent pas avoir le même.</p>
   <input class="hall-in" id="hallPseudo" maxlength="16" placeholder="Ex. : Mushu" value="${es(H.pseudo||ld('net-last')||'')}"><p class="hall-err" id="hallErr"></p>
   <div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button><button class="hall-btn pri" data-hl="ok">Valider</button></div>`,async e=>{ const b=e.target.closest('[data-hl]'); if(!b) return; if(b.dataset.hl==='close'){ closeBox(); return; }
     const v=q('#hallPseudo').value; b.disabled=true; const err=await H.setPseudo(v); b.disabled=false; if(err){ q('#hallErr').textContent=err; return; } sv('net-last',H.pseudo); closeBox(); if(cb) cb(H.pseudo); });
   const i=q('#hallPseudo'); if(i){ i.focus(); i.onkeydown=e=>{ if(e.key==='Enter') q('[data-hl=ok]').click(); }; } };
 /* ---------- invitations ---------- */
 H.invite=(to,room)=>{ if(!ch) return; ch.send({type:'broadcast',event:'inv',payload:{to,from:H.cid,fromP:H.pseudo,g:room.g,gt:room.gt,code:room.code}}); note(`Invitation envoyée à ${(H.peers[to]||{}).p||'ce joueur'}`); };
 function invited(p){ const id='inv-'+p.code; if(q('#'+id)) return; if(typeof sfx==='function') sfx('ding');
   const d=document.createElement('div'); d.className='hall-invite'; d.id=id;
   d.innerHTML=`<b>${es(p.fromP)}</b> t’invite à jouer à <b>${es(p.gt)}</b><div class="hall-acts"><button class="hall-btn" data-i="no">Pas maintenant</button><button class="hall-btn pri" data-i="ok">Rejoindre</button></div><i class="hall-bar"></i>`;
   document.body.appendChild(d); const t=setTimeout(()=>d.remove(),30000);
   d.onclick=e=>{ const b=e.target.closest('[data-i]'); if(!b) return; clearTimeout(t); d.remove(); const ok=b.dataset.i==='ok';
     if(ch) ch.send({type:'broadcast',event:'invr',payload:{to:p.from,fromP:H.pseudo,ok}}); if(ok) H.goTable(p.g,p.code); }; }
 H.goTable=(g,code)=>{ if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined'){ NET.joinCode(code); return; } location.href=g+'.html?salle='+code; };
 H.inviteFlow=to=>{ const P=H.peers[to]; if(!P) return; const r=H.me.r;
   if(r&&r.host&&!r.started){ H.invite(to,r); return; }
   const opts=Object.entries(GAMES).sort((a,b)=>a[1].localeCompare(b[1],'fr'));
   openBox(`<h2>Inviter ${es(P.p)}</h2><p>Choisis le jeu : une table s’ouvre et l’invitation part tout de suite.</p><div class="hall-games">${opts.map(([g,t])=>`<button class="hall-btn" data-g="${g}">${es(t)}</button>`).join('')}</div><div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button></div>`,e=>{
     const b=e.target.closest('[data-g],[data-hl]'); if(!b) return; if(b.dataset.hl){ closeBox(); return; } const g=b.dataset.g; sessionStorage.setItem('hall-invite',JSON.stringify({to,g})); closeBox();
     if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined') NET.createFor(); else location.href=g+'.html?creer=1'; }); };
 H.pendingInvite=g=>{ try{ const v=JSON.parse(sessionStorage.getItem('hall-invite')||'null'); if(v&&v.g===g){ sessionStorage.removeItem('hall-invite'); return v.to; } }catch(e){} return null; };
 /* ---------- interface ---------- */
 function where(m){ if(m.r&&m.r.started) return `joue à ${es(m.r.gt)}`; if(m.r&&m.r.host) return `ouvre une table de ${es(m.r.gt)}`; if(m.r) return `attend à une table de ${es(m.r.gt)}`; return m.gt?`regarde ${es(m.gt)}`:'sur le portail'; }
 function busy(m){ return m.r&&m.r.started; }
 H.panelHTML=(g)=>{ if(H.ok===false) return `<p class="hall-note">Le salon en ligne n’est pas joignable d’ici.${/github\.io$/.test(location.hostname)?' Vérifie ta connexion.':` Ouvre la salle sur <a href="${SITE}" target="_blank" rel="noopener">le site</a>.`}</p>`;
   if(H.ok==null) return '<p class="hall-note"><span class="hall-spin"></span>Connexion au salon…</p>';
   const tabs=H.tables(g), ppl=H.list();
   return `<div class="hall-me">${H.pseudo?`Ton pseudo : <b>${es(H.pseudo)}</b> <button class="hall-link" data-hl="pseudo">changer</button>`:`<button class="hall-btn pri" data-hl="pseudo">Choisir un pseudo</button> <span class="hall-note">pour apparaître et être invité</span>`}</div>
    <h4>Tables ouvertes${g?'':' (tous les jeux)'}</h4>${tabs.length?`<ul class="hall-list">${tabs.map(t=>`<li><span class="hall-av">${es(t.p[0])}</span><span class="hall-tx"><b>${es(t.gt)}</b><small>table de ${es(t.p)} · ${t.n}/${t.max} joueurs</small></span>${t.cid===H.cid?'<small>ta table</small>':`<button class="hall-btn pri" data-join="${es(t.g)}:${es(t.code)}">Rejoindre</button>`}</li>`).join('')}</ul>`:`<p class="hall-note">Aucune table ouverte${g?' pour ce jeu':''} pour l’instant.</p>`}
    <h4>Joueurs en ligne (${ppl.length})</h4>${H.anon()?`<p class="hall-note">+ ${H.anon()} visiteur${H.anon()>1?'s':''} sans pseudo</p>`:''}${ppl.length?`<ul class="hall-list">${ppl.map(m=>`<li><span class="hall-av">${es(m.p[0])}</span><span class="hall-tx"><b>${es(m.p)}</b><small>${where(m)}</small></span>${H.pseudo&&!busy(m)?`<button class="hall-btn" data-inv="${m.cid}">Inviter</button>`:''}</li>`).join('')}</ul>`:'<p class="hall-note">Personne d’autre pour le moment. Partage le lien du site à tes amis !</p>'}`; };
 H.panelClick=e=>{ const b=e.target.closest('[data-hl],[data-join],[data-inv]'); if(!b) return false;
   if(b.dataset.hl==='pseudo'){ H.askPseudo(); return true; }
   if(b.dataset.join){ const [g,c]=b.dataset.join.split(':'); closeBox(); H.ensure().then(()=>H.goTable(g,c)); return true; }
   if(b.dataset.inv){ H.inviteFlow(b.dataset.inv); return true; } return false; };
 let boxCb=null;

const NET=(()=>{

 async function connect(code,asHost){ client=await HALL.client();

 function onClick(e){ const b=e.target.closest('[data-net]'); if(!b){ if(N.ui==='lobby'&&N.host&&NG().rulesClick&&NG().rulesClick(e)) lobbyUI(); return; } const [k,v]=b.dataset.net.split(':'); snd('click');

const ENG={play:(G,p,id,col,tg)=>play(G,p,id,col,tg),draw:(G,p)=>draw(G,p),pass:(G,p)=>pass(G,p),chooseColor:(G,p,c)=>chooseColor(G,p,c),challenge:(G,p,y)=>challenge(G,p,!!y)};
function doAct(fn,args,src){ if(NET.guest){ NET.act(fn,args); return; } return apply(ENG[fn](G,...args),GEN,src); }
function meZones(){ if(MODE==='net') return NET.seat!=null?[NET.seat]:[]; if(MODE==='ff') return [1,0]; if(MODE==='ia') return [humans()[0]]; return VIEW!=null?[VIEW]:[]; }
function actor(){ return G.phase==='color'?G.colorBy:G.turn; }
function seatHTML(p){ const x=G.players[p], on=actor()===p&&!['roundOver','over'].includes(G.phase); const fan=Array.from({length:Math.min(x.hand.length,8)},()=>'<i></i>').join('');
  return `<div class="dc-seat ${on?'on':''}" id="seat-${p}"><span class="dc-av" style="background:${AVC[p%10]}">${esc(x.name[0]||'?')}</span><div style="min-width:0"><div class="dc-nm">${esc(x.name)}${x.ai?'':' 🙂'}</div><div class="dc-ct">${x.hand.length} carte${x.hand.length>1?'s':''} · ${x.score} pts</div></div><div class="dc-fan">${fan}</div>${catchBtn(p)}</div>`; }
function catchBtn(p){ if(!G.uno||!G.uno.open||G.uno.p!==p) return ''; const hs=MODE==='net'?(NET.seat!=null&&NET.seat!==p?[NET.seat]:[]):humans().filter(h=>h!==p); return hs.length?`<button class="dc-catch" data-a="catch">Il n’a rien dit !</button>`:''; }
function zoneHTML(p,flip){ const x=G.players[p], my=G.turn===p&&G.phase==='play'&&!BUSY, on=actor()===p&&!['roundOver','over'].includes(G.phase);
  const showHand=MODE!=='ff'||(on&&REVEAL);
  let acts='';
  if(my&&showHand){ const pl=playables(G,p).length;
    if(x.hand.length===2&&pl) acts+=`<button class="btn last ${x.said?'done':''}" data-a="say">${x.said?'Annoncé ✓':'Dernière carte !'}</button>`;
    if(G.drawn!=null) acts+=`<button class="btn" data-a="pass">Garder et passer</button>`;
    else acts+=`<button class="btn ${pl?'':'pri'}" data-a="draw">${G.pending?'Piocher '+G.pending:'Piocher'}</button>`; }
  let hand;
  if(showHand){ const ps=my?new Set(playables(G,p).map(c=>c.id)):null; const n=x.hand.length, ov=n>14?-.62:n>10?-.55:n>7?-.45:-.3;
    hand=`<div class="dc-hand" style="--ov:${ov}">${sortHand(x.hand).map(c=>`<button class="hc ${ps?(ps.has(c.id)?'ok':'no'):''} ${NEWIDS.has(c.id)?'nw':''}" data-id="${c.id}" aria-label="${esc(desc(c))}">${cardHTML(c)}</button>`).join('')}</div>`; }
  else hand=`<div class="dc-hide">${on?`<button class="btn pri" data-a="reveal-ff" style="font-size:17px;padding:12px 18px">Voir ma main (${x.hand.length} cartes)</button>`:`<span class="dc-ct">${x.hand.length} cartes cachées</span>`}</div>`;
  return `<section class="dc-me ${flip?'flip':''}" id="zone-${p}"><div class="dc-mehd"><span class="dc-av" style="background:${AVC[p%10]}">${esc(x.name[0]||'?')}</span><span class="dc-nm">${esc(x.name)}</span><span class="dc-ct">${x.score} pts</span>${catchBtn(p)}<div class="dc-acts">${acts}</div></div>${hand}</section>`; }
function sortHand(h){ const o={r:0,y:1,g:2,b:3,w:4}, ov=v=>/^\d$/.test(v)?+v:{skip:10,rev:11,'+2':12,wild:13,'+4':14}[v]; return h.slice().sort((a,b)=>o[a.c]-o[b.c]||ov(a.v)-ov(b.v)); }
function desc(c){ return (c.c==='w'?'':COLN[c.c]+' ')+({skip:'passe ton tour',rev:'inversion','+2':'+2',wild:'joker','+4':'+4 joker'}[c.v]||c.v); }
function midHTML(){ const t=topCard(G), canDraw=G.phase==='play'&&!BUSY&&isH(G.turn)&&G.drawn==null&&meZones().includes(G.turn)&&(MODE!=='ff'||REVEAL);
  const col={r:'#e5383b',y:'#f5bd1f',g:'#22a96b',b:'#2f78dc'}[G.color]||'#fff';
  return `<div class="dc-mid"><div class="dc-ring ${G.dir<0?'ccw':''}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#fff6d8" stroke-width=".6" stroke-dasharray="2 3"/>${[0,90,180,270].map(a=>`<path transform="rotate(${a} 50 50)" d="M50 4l5 3-5 3Z" fill="#fff6d8"/>`).join('')}</svg></div>
   <div class="dc-pile"><button class="dc-deck ${canDraw?'can':''}" id="deck" data-a="draw" aria-label="Piocher">${cardHTML(null,{back:1})}</button><small>Pioche · ${G.deck.length}</small></div>
   <div class="dc-pile"><div class="dc-disc" id="disc"><div class="dc-halo" style="box-shadow:0 0 0 4px ${col},0 0 34px ${col}aa;background:${col}22"></div>${G.discard.slice(-3).map((c,k,a)=>`<div style="position:absolute;inset:0;transform:rotate(${((c.id*37)%17)-8}deg)">${cardHTML(c)}</div>`).join('')}${G.pending?`<span class="dc-pend">+${G.pending}</span>`:''}</div><small>${G.dir>0?'↻ sens horaire':'↺ sens inverse'} · couleur <b style="color:${col}">${COLN[G.color]||'—'}</b></small></div></div>`; }
function render(){ if(!G){ $('#tbl').innerHTML=''; renderStatus(); return; }
  const z=meZones(), opps=G.players.map((x,i)=>i).filter(i=>!z.includes(i));
  let h='';
  if(MODE==='ff') h=zoneHTML(1,true)+midHTML()+zoneHTML(0,false);
  else h=`<div class="dc-opps">${opps.map(seatHTML).join('')}</div>`+midHTML()+(z.length?zoneHTML(z[0],false):`<section class="dc-me"><div class="dc-hide"><span class="dc-ct">Les mains sont cachées</span></div></section>`);
  $('#tbl').innerHTML=h; $('#tbl').classList.toggle('ffm',MODE==='ff'); NEWIDS.clear(); renderStatus(); }
function renderStatus(){ const st=$('#status'); if(!G){ st.innerHTML=''; return; } const a=actor(), x=G.players[a];
  let m; if(G.phase==='over') m=`${G.players[G.over.winner].name} remporte la partie !`; else if(G.phase==='roundOver') m=`${G.players[G.winner].name} gagne la manche.`;
  else if(G.phase==='color') m=`${x.name} choisit une couleur.`; else if(G.phase==='challenge') m=`${x.name} peut contester le +4.`;
  else m=x.ai?`${x.name} réfléchit…`:(G.pending?`${x.name} : pose un ${topCard(G).v==='+4'?'+4':'+2 ou +4'} ou pioche ${G.pending}.`:G.drawn!=null?`${x.name} : joue la carte piochée ou passe.`:`${x.name} : pose une carte ${COLN[G.color]||''} ou un ${lab(topCard(G))}.`);
  st.style.setProperty('--pc',G.phase==='over'?'#1d6f3e':AVC[a%10]);
  st.innerHTML=`<span class="who">${esc(x.name)}</span><span class="msg">${esc(m)}</span><span class="right">Manche ${G.round} · objectif ${G.opts.target>=9999?'1 manche':G.opts.target+' pts'}</span>`; }
/* ---------- animations ---------- */
function rectOf(el){ return el?el.getBoundingClientRect():null; }
function fly(html,from,to,ms){ return new Promise(res=>{ if(!from||!to||REDUCED){ res(); return; } const f=document.createElement('div'); f.className='fly'; f.innerHTML=html; f.style.left=from.left+'px'; f.style.top=from.top+'px'; f.style.setProperty('--cw',getComputedStyle($('#tbl')).getPropertyValue('--cw'));
  document.body.appendChild(f); requestAnimationFrame(()=>{ f.style.transform=`translate(${to.left-from.left}px,${to.top-from.top}px) rotate(${Math.random()*30-15}deg)`; }); setTimeout(()=>{ f.remove(); res(); },ms||470); }); }
function srcOf(p,cid){ const c=$(`[data-id="${cid}"]`); if(c) return rectOf(c); return rectOf($('#seat-'+p)||$('#zone-'+p)); }
function dstOf(p){ const z=$('#zone-'+p); if(z){ const h=z.querySelector('.dc-hand,.dc-hide'); return rectOf(h||z); } return rectOf($('#seat-'+p)); }
function bubble(p,txt){ const s=$('#seat-'+p)||$('#zone-'+p); if(!s) return; const b=document.createElement('span'); b.className='dc-bub'; b.textContent=txt; s.appendChild(b); setTimeout(()=>b.remove(),1800); }
function xmark(p,t){ const s=$('#seat-'+p)||$('#zone-'+p); if(!s) return; const b=document.createElement('span'); b.className='dc-x'; b.textContent=t||'⊘'; s.appendChild(b); setTimeout(()=>b.remove(),900); }
async function showEvents(ev,my,src){ for(const e of ev||[]){ if(my!==GEN) return;
  switch(e.t){
   case 'play': { const from=src||srcOf(e.p,e.c.id); const to=rectOf($('#disc')); await fly(cardHTML(e.c),from,to); sfx('card'); render(); await wait(120); break; }
   case 'draw': { const visible=meZones().includes(e.p)&&(MODE!=='ff'||REVEAL); const hand=G.players[e.p].hand; const ids=hand.slice(-e.n).map(c=>c.id);
     for(let k=0;k<Math.min(e.n,8);k++){ fly(cardHTML(null,{back:1}),rectOf($('#deck')),dstOf(e.p),420); sfx('flip'); await wait(110); }
     await wait(380); if(visible) ids.forEach(i=>NEWIDS.add(i)); render(); if(e.forced&&e.n>1) toast(`${G.players[e.p].name} pioche ${e.n} cartes`); break; }
   case 'skip': render(); xmark(e.p,'⊘'); sfx('pop'); await wait(650); break;
   case 'rev': render(); toast('Changement de sens !'); sfx('flip'); await wait(450); break;
   case 'color': render(); toast(`Couleur choisie : ${COLN[e.color]}`); sfx('ding'); await wait(400); break;
   case 'last': render(); bubble(e.p,'Dernière carte !'); sfx('ding'); await wait(500); break;
   case 'caught': render(); bubble(e.p,'Pris !'); toast(`${G.players[e.p].name} n’avait pas annoncé « Dernière carte » : +2`); sfx('error'); await wait(500); break;
   case 'challenge': toast(e.ok?`Contestation réussie : ${G.players[e.by].name} avait la couleur et pioche 4 !`:`Contestation ratée : ${G.players[e.p].name} pioche 6 !`); sfx(e.ok?'win':'error'); await wait(900); break;
   case 'swap': render(); toast(`${G.players[e.a].name} échange sa main avec ${G.players[e.b].name}`); sfx('flip'); await wait(700); break;
   case 'rotate': render(); toast('Le 0 fait tourner toutes les mains !'); sfx('flip'); await wait(700); break;
   case 'canPlay': render(); if(isH(e.p)) toast('Tu peux jouer la carte piochée ou passer'); break;
   case 'roundWin': render(); break;
  } } }
/* ---------- déroulement ---------- */
function save(){ if(NET.guest) return; store(KEY,G&&G.phase!=='over'?{G,MODE}:null); }
async function apply(ev,my,src){ if(!ev) return false; NET.push(ev); BUSY=true; await showEvents(ev,my,src); if(my!==GEN) return true; BUSY=false; next(); return true; }
function next(){ if(!G) return; render(); save(); NET.push(); const my=GEN;
  if(G.phase==='roundOver'||G.phase==='over'){ const k=G.phase+G.round; if(ENDKEY===k) return; ENDKEY=k; setTimeout(()=>{ if(my===GEN) (G.phase==='over'?gameEnd:roundEnd)(); },900); return; }
  ENDKEY=null; if(!NET.guest) scheduleCatch();
  const a=actor();
  if(MODE==='net'&&(NET.guest||!G.players[a].ai)){ if(a===NET.seat){ if(G.phase==='color') colorModal(a); else if(G.phase==='challenge') chalModal(a); } NET.drain(); return; }
  if(G.players[a].ai){ const slow=G.uno&&G.uno.open&&isH(G.uno.p)===false&&humans().length?2300:900; setTimeout(()=>{ if(my===GEN&&!BUSY) aiStep(); },slow); return; }
  if(MODE==='hot'&&VIEW!==a){ VIEW=null; render(); cover(a); return; }
  if(MODE==='ff'&&LASTACT!==a){ REVEAL=false; render(); }
  LASTACT=a;
  if(G.phase==='color') colorModal(a); else if(G.phase==='challenge') chalModal(a); }
function scheduleCatch(){ if(!G.uno||!G.uno.open||CATCHT) return; const p=G.uno.p, my=GEN;
  const cs=G.players.map((x,i)=>i).filter(i=>i!==p&&G.players[i].ai&&Math.random()<CATCH[G.players[i].level]);
  if(!cs.length) return; const by=cs[0];
  CATCHT=setTimeout(async()=>{ CATCHT=null; if(my!==GEN||!G.uno||!G.uno.open||G.uno.p!==p) return; if(BUSY){ return; } const ev=catchLast(G,by); if(ev){ BUSY=true; await showEvents(ev,my); BUSY=false; save(); render(); } },500+Math.random()*900); }
async function aiStep(){ if(!G||BUSY) return; const p=actor(); if(!G.players[p].ai) return; const my=GEN; const a=aiAct(G,p); if(!a) return;
  if(a.a==='color') return apply(chooseColor(G,p,a.color),my);
  if(a.a==='challenge'){ if(a.yes) toast(`${G.players[p].name} conteste le +4 !`); return apply(challenge(G,p,a.yes),my); }
  if(a.a==='draw') return apply(draw(G,p),my);
  if(a.a==='pass') return apply(pass(G,p),my);
  if(a.say){ sayLast(G,p); }
  return apply(play(G,p,a.id,a.color,a.target),my); }
async function humanPlay(id){ const p=G.turn; if(BUSY||!isH(p)||G.phase!=='play') return; const c=G.players[p].hand.find(x=>x.id===id); if(!c) return;
  if(!playable(G,p,c)){ sfx('error'); const el=$(`[data-id="${id}"]`); if(el){ el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:260}); } toast(G.pending?'Il faut poser un +2 ou un +4, ou piocher.':`Pose une carte ${COLN[G.color]} ou un ${lab(topCard(G))}.`); return; }
  const my=GEN; let target=null;
  if(G.opts.sevenZero&&c.v==='7'&&G.players[p].hand.length>1){ target=await pickTarget(p); if(target==null) return; }
  const src=rectOf($(`[data-id="${id}"]`)); return doAct('play',[p,id,null,target],src); }
function pickTarget(p){ return new Promise(res=>{ window.MODAL_CLOSABLE=true; openModal(`<h2>Échanger ta main</h2><p>Le 7 échange ta main avec celle du joueur de ton choix.</p><div class="acts" style="justify-content:flex-start">${G.players.map((x,i)=>i===p?'':`<button class="btn" data-t="${i}">${esc(x.name)} · ${x.hand.length} cartes</button>`).join('')}</div><div class="acts"><button class="btn" data-t="-1">Annuler</button></div>`,e=>{ const b=e.target.closest('[data-t]'); if(!b) return; closeModal(); const v=+b.dataset.t; res(v<0?null:v); }); }); }
function colorModal(p){ window.MODAL_CLOSABLE=false; openModal(`<h2>${esc(G.players[p].name)}, choisis la couleur</h2><div class="dc-cols">${['r','y','g','b'].map(c=>`<button data-col="${c}" style="background:var(--c${c})">${COLN[c]} <small style="display:block;font-family:var(--ui);font-size:13px">${G.players[p].hand.filter(x=>x.c===c).length} en main</small></button>`).join('')}</div>`,e=>{ const b=e.target.closest('[data-col]'); if(!b) return; closeModal(); window.MODAL_CLOSABLE=true; doAct('chooseColor',[p,b.dataset.col]); }); }
function chalModal(p){ const by=G.chal.by; window.MODAL_CLOSABLE=false; openModal(`<h2>${esc(G.players[by].name)} a posé un +4</h2><p>Tu peux le contester si tu penses qu’il avait une carte de la couleur demandée (<b>${COLN[G.chal.prevColor]||''}</b>).</p><ul><li>S’il en avait une : c’est lui qui pioche 4 cartes.</li><li>Sinon : tu pioches 6 cartes au lieu de 4.</li></ul><div class="acts"><button class="btn" data-ch="0">Accepter, piocher 4</button><button class="btn pri" data-ch="1">Contester</button></div>`,e=>{ const b=e.target.closest('[data-ch]'); if(!b) return; closeModal(); window.MODAL_CLOSABLE=true; doAct('challenge',[p,b.dataset.ch==='1'?1:0]); }); }
function cover(p){ const c=$('#cover'); c.innerHTML=`<div><span style="font-family:var(--title);letter-spacing:.15em;color:#ffcf5a">À TOI DE JOUER</span><h2 style="font-family:var(--title)">${esc(G.players[p].name)}</h2><p>Les autres détournent les yeux : ta main est secrète.</p><button class="btn pri" style="font-size:17px;padding:12px 20px" data-a="reveal">Voir ma main</button></div>`; c.style.background='radial-gradient(circle at 50% 35%,#3a3280,#100d26)'; c.hidden=false; }
function roundEnd(){ const w=G.winner, hw=isH(w); if(hw||humans().length===0) confetti(['#e5383b','#f5bd1f','#22a96b','#2f78dc']); sfx(hw?'win':'lose'); banner(`${G.players[w].name} gagne la manche`,'',AVC[w%10]);
  const rows=G.players.map((x,i)=>({x,i})).sort((a,b)=>b.x.score-a.x.score);
  setTimeout(()=>{ window.MODAL_CLOSABLE=false; openModal(`<h2>Fin de la manche ${G.round}</h2><p><b>${esc(G.players[w].name)}</b> marque les points des cartes restantes : chiffres à leur valeur, actions 20, jokers 50.</p><table class="scl"><tr><th>Joueur</th><th>Cartes</th><th>Score</th></tr>${rows.map(({x,i})=>`<tr class="${i===w?'w':''}"><td>${esc(x.name)}</td><td>${x.hand.length}</td><td>${x.score}</td></tr>`).join('')}</table>${NET.guest?'<p class="net-wait"><span class="net-spin"></span>L’hôte lance la manche suivante…</p>':'<div class="acts"><button class="btn pri" data-r="go">Manche suivante</button></div>'}`,e=>{ if(!e.target.closest('[data-r]')) return; closeModal(); window.MODAL_CLOSABLE=true; newRound(); }); },1300); }
function gameEnd(){ const w=G.over.winner; store(KEY,null); banner('Victoire !',G.players[w].name,AVC[w%10]); sfx(isH(w)?'win':'lose'); confetti();
  setTimeout(()=>{ window.MODAL_CLOSABLE=true; openModal(`<h2>${esc(G.players[w].name)} gagne la partie</h2><table class="scl"><tr><th>Joueur</th><th>Score</th></tr>${G.players.map((x,i)=>({x,i})).sort((a,b)=>b.x.score-a.x.score).map(({x,i})=>`<tr class="${i===w?'w':''}"><td>${esc(x.name)}</td><td>${x.score}</td></tr>`).join('')}</table>${NET.guest?NET.waitHTML:'<div class="acts"><button class="btn" data-c="new">Changer les réglages</button><button class="btn pri" data-a="again">Rejouer</button></div>'}`); },1500); }
async function newRound(){ const my=++GEN; BUSY=true; const ev=startRound(G); NET.push(ev,'round'); return dealAnim(ev,my); }
async function dealAnim(ev,my){ BUSY=true; VIEW=MODE==='ia'?humans()[0]:null; LASTACT=null; REVEAL=false; render();
  // distribution animée
  const seats=G.players.map((x,i)=>i); for(let k=0;k<7;k++){ for(const p of seats){ if(my!==GEN) return; fly(cardHTML(null,{back:1}),rectOf($('#deck')),dstOf(p),360); } sfx('card'); await wait(140); }
  await wait(300); if(my!==GEN) return; BUSY=false; render(); await showEvents(ev.filter(e=>e.t!=='deal'),my); if(my!==GEN) return; next(); }
/* ---------- clics ---------- */
document.addEventListener('click',e=>{ const t=e.target.closest('[data-a],[data-id]'); if(!t||!G) return;
  const a=t.dataset.a;
  if(a==='reveal'){ $('#cover').hidden=true; VIEW=G.turn===null?null:actor(); LASTACT=VIEW; render(); sfx('flip'); next(); return; }
  if(a==='again'){ closeModal(); if(NET.host) NET.restart(); else startGame(); return; }
  if(a==='catch'){ if(!G.uno||!G.uno.open) return; const p=G.uno.p, by=MODE==='net'?NET.seat:humans().find(h=>h!==p); if(NET.guest){ NET.act('catchLast',[by]); return; } const ev=catchLast(G,by); if(ev) NET.push(ev); if(ev){ clearTimeout(CATCHT); CATCHT=null; BUSY=true; showEvents(ev,GEN).then(()=>{ BUSY=false; save(); render(); }); } return; }
  if(BUSY) return; const p=G.turn;
  if(a==='reveal-ff'){ REVEAL=true; sfx('flip'); render(); return; }
  if(!isH(p)||G.phase!=='play'||!meZones().includes(p)||(MODE==='ff'&&!REVEAL)) return;
  if(t.dataset.id){ humanPlay(+t.dataset.id); return; }
  if(a==='say'){ if(NET.guest){ NET.act('sayLast',[p]); return; } if(sayLast(G,p)){ bubble(p,'Dernière carte !'); sfx('ding'); save(); render(); NET.push([{t:'last',p}]); } return; }
  if(a==='draw'){ if(G.drawn!=null) return; doAct('draw',[p]); return; }
  if(a==='pass'){ doAct('pass',[p]); return; } });
/* ---------- menu ---------- */
let M={n:4,seats:[{h:1,name:''},{h:0,name:''},{h:0,name:''},{h:0,name:''},{h:0,name:''},{h:0,name:''},{h:0,name:''},{h:0,name:''},{h:0,name:''},{h:0,name:''}],level:'normal',opts:{stack:false,drawUntil:false,sevenZero:false,challenge:true},target:500,ff:true};
function startGame(){ GEN++; clearTimeout(CATCHT); CATCHT=null; $('#cover').hidden=true;
  const ps=M.seats.slice(0,M.n).map((s,i)=>({name:(s.name||'').trim()||(s.h?(M.seats.slice(0,M.n).filter(x=>x.h).length===1?'Toi':NAMES[i]):NAMES[(i+3)%10]),ai:!s.h,level:M.level}));
  G=newGame({players:ps,opts:Object.assign({},M.opts,{target:M.target})});
  const hs=ps.filter(x=>!x.ai).length; MODE=hs<=1?'ia':(hs===2&&M.n===2&&M.ff?'ff':'hot');
  newRound(); }
function rulesHTML(){ return `<h4>Objectif</h4><div class="seg">${[[9999,'1 manche'],[200,'200 points'],[500,'500 points']].map(([v,l])=>`<button class="${M.target===v?'on':''}" data-m="target:${v}">${l}</button>`).join('')}</div>
   <h4>Règles</h4>
   <label class="opt"><input type="checkbox" data-o="challenge" ${M.opts.challenge?'checked':''}><span><b>Défi du +4</b> (règle officielle) : le +4 se pose à tout moment, mais peut être contesté.</span></label>
   <label class="opt"><input type="checkbox" data-o="stack" ${M.opts.stack?'checked':''}><span><b>Cumul</b> : on peut répondre à un +2 par un +2 ou un +4, et à un +4 par un +4. Le suivant pioche le total.</span></label>
   <label class="opt"><input type="checkbox" data-o="drawUntil" ${M.opts.drawUntil?'checked':''}><span><b>Piocher jusqu’à pouvoir jouer</b> au lieu d’une seule carte.</span></label>
   <label class="opt"><input type="checkbox" data-o="sevenZero" ${M.opts.sevenZero?'checked':''}><span><b>Règle du 7 et du 0</b> : le 7 échange ta main avec un joueur, le 0 fait tourner toutes les mains.</span></label>`; }
function menu(){ window.MODAL_CLOSABLE=true;
  const draw=()=>{ const hs=M.seats.slice(0,M.n).filter(x=>x.h).length;
    paintModal(`<h2>Nouvelle partie</h2>
   <h4>Joueurs autour de la table</h4><div class="seg">${[2,3,4,5,6,7,8,9,10].map(n=>`<button class="${M.n===n?'on':''}" data-m="n:${n}">${n}</button>`).join('')}</div>
   ${M.seats.slice(0,M.n).map((s,i)=>`<div class="seatrow"><span class="dc-av" style="background:${AVC[i]};width:26px;height:26px;font-size:13px">${i+1}</span><input type="text" data-nm="${i}" value="${esc(s.name)}" placeholder="${s.h?(i===0?'Toi':NAMES[i]):NAMES[(i+3)%10]}" maxlength="14"><div class="seg"><button class="${s.h?'on':''}" data-m="h:${i}:1">Humain</button><button class="${s.h?'':'on'}" data-m="h:${i}:0">Ordinateur</button></div></div>`).join('')}
   ${hs<M.n?`<h4>Niveau de l’ordinateur</h4><div class="seg">${['facile','normal','difficile'].map(l=>`<button class="${M.level===l?'on':''}" data-m="level:${l}">${l}</button>`).join('')}</div>`:''}
   ${hs===2&&M.n===2?`<h4>À deux sur un appareil</h4><div class="seg"><button class="${M.ff?'on':''}" data-m="ff:1">Face à face (tablette à plat)</button><button class="${M.ff?'':'on'}" data-m="ff:0">Côte à côte avec écran de passage</button></div>`:''}
   ${rulesHTML()}
   <div class="acts">${G&&G.phase!=='over'?'<button class="btn" data-c="close">Annuler</button>':''}<button class="btn pri" data-m="go" ${hs?'':'disabled'}>Distribuer</button></div>`); };
  draw(); $('#mbox').onclick=e=>{ $$('#mbox [data-nm]').forEach(i=>{ M.seats[+i.dataset.nm].name=i.value; }); $$('#mbox [data-o]').forEach(i=>{ M.opts[i.dataset.o]=i.checked; });
    const x=e.target.closest('[data-m]'); if(!x) return; const [k,v,w]=x.dataset.m.split(':'); sfx('click');
    if(k==='go'){ closeModal(); store('dcp',M); startGame(); return; }
    if(k==='h') M.seats[+v].h=+w; else if(k==='n'||k==='target') M[k]=+v; else if(k==='ff') M.ff=v==='1'; else M[k]=v; draw(); }; }
function help(){ helpTabs('Dernière carte',[
 ['But du jeu',`<p>Être le premier à se débarrasser de toutes ses cartes. Le gagnant de la manche marque les points des cartes restées dans les mains adverses ; la partie se joue en une manche, 200 ou 500 points.</p><p>108 cartes : 4 couleurs (rouge, jaune, vert, bleu) avec des chiffres de 0 à 9 et trois cartes action, plus 8 jokers noirs. Chacun reçoit 7 cartes.</p>`],
 ['Ton tour',`<ol><li>Pose une carte de <b>la même couleur</b> ou du <b>même chiffre ou symbole</b> que la carte du dessus.</li><li>Un <b>joker</b> se pose sur n’importe quoi et te laisse choisir la couleur.</li><li>Si tu ne peux pas (ou ne veux pas) jouer, pioche une carte. Si elle convient, tu peux la poser tout de suite, sinon ton tour passe.</li></ol><p class="ex">Exemple : sur un 7 bleu, tu peux poser n’importe quelle carte bleue, n’importe quel 7, ou un joker.</p>`],
 ['Cartes action',`<ul><li><b>⊘ Passe ton tour</b> : le joueur suivant ne joue pas.</li><li><b>⇄ Inversion</b> : le sens du jeu change. À deux, elle fait rejouer.</li><li><b>+2</b> : le suivant pioche 2 cartes et passe son tour.</li><li><b>Joker</b> : tu choisis la couleur.</li><li><b>+4</b> : tu choisis la couleur, le suivant pioche 4 cartes et passe son tour. Tu n’as le droit de le poser que si tu n’as <b>aucune carte de la couleur demandée</b>.</li></ul><p>Points en fin de manche : chiffres à leur valeur, actions 20, jokers 50.</p>`],
 ['Dernière carte !',`<p>Quand tu poses ton avant-dernière carte, appuie d’abord sur <b>Dernière carte !</b> (le bouton jaune apparaît quand il te reste 2 cartes).</p><p>Si tu oublies, un adversaire peut te dénoncer avec « Il n’a rien dit ! » avant que le joueur suivant joue : tu pioches 2 cartes. Tu peux faire pareil avec les ordinateurs distraits.</p>`],
 ['Variantes',`<ul><li><b>Défi du +4</b> : le joueur visé peut contester. Si le poseur avait la couleur demandée, c’est lui qui pioche 4 ; sinon le contestataire pioche 6.</li><li><b>Cumul</b> : réponds à un +2 par un +2 ou un +4, à un +4 par un +4 ; le premier qui ne peut pas suivre pioche tout.</li><li><b>Piocher jusqu’à pouvoir jouer</b>.</li><li><b>7 et 0</b> : le 7 échange ta main avec celle d’un joueur, le 0 fait passer toutes les mains au voisin.</li></ul>`],
 ['Jouer ici',`<ul><li>Les cartes jouables sont surélevées ; touche-en une pour la poser. Touche la pioche pour piocher.</li><li>De 2 à 10 joueurs, humains ou ordinateurs (trois niveaux).</li><li>À plusieurs humains, un écran de passage cache les mains. À deux, le mode <b>face à face</b> place chacun d’un côté de la tablette : touche « Voir ma main » quand c’est ton tour.</li><li>La partie est sauvegardée automatiquement.</li><li><b>En ligne</b> : touche « En ligne » en haut, crée une salle et envoie son code de 4 lettres (ou le lien) à tes amis. Chacun joue sur son téléphone ou son ordinateur, l’ordinateur peut compléter la table. L’hôte garde la partie : s’il recharge la page, la salle reprend.</li></ul>`]]); }
window.DC={get G(){return G;},get BUSY(){return BUSY;}};
window.NETGAME={id:'derniere-carte',title:'Dernière carte',min:2,max:10,rules:rulesHTML,
  rulesClick(e){ const x=e.target.closest('[data-m^="target:"],[data-o]'); if(!x) return false; if(x.dataset.m) M.target=+x.dataset.m.split(':')[1]; $$('#mbox [data-o]').forEach(i=>{ M.opts[i.dataset.o]=i.checked; }); store('dcp',M); return true; },
  start(list){ GEN++; clearTimeout(CATCHT); CATCHT=null; ENDKEY=null; $('#cover').hidden=true; let k=0;
    G=newGame({players:list.map(x=>x.ai?{name:x.name||NAMES[(k++ +3)%10],ai:true,level:x.level}:{name:x.name,ai:false}),opts:Object.assign({},M.opts,{target:M.target})});
    list.forEach((x,i)=>{ if(x.cid) G.players[i].cid=x.cid; }); G.net=true; MODE='net'; newRound(); },
  state:()=>G, busy:()=>BUSY, resume(){ if(!BUSY) next(); },
  act(seat,fn,args){ if(!G||args[0]!==seat) return false;
    if(fn==='sayLast'){ if(sayLast(G,seat)){ bubble(seat,'Dernière carte !'); save(); render(); NET.push([{t:'last',p:seat}]); } return true; }
    if(fn==='catchLast'){ const ev=catchLast(G,seat); if(ev){ clearTimeout(CATCHT); CATCHT=null; NET.push(ev); BUSY=true; showEvents(ev,GEN).then(()=>{ BUSY=false; save(); render(); NET.push(); NET.drain(); }); } return true; }
    if(!ENG[fn]) return false; const ev=ENG[fn](G,...args); if(!ev) return false; apply(ev,GEN); return true; },
  async receive(m){ if(m.kind==='lobby'){ GEN++; G=null; BUSY=false; render(); return; }
    if(m.kind==='new'||m.kind==='round'){ GEN++; ENDKEY=null; MODE='net'; $('#cover').hidden=true; if(!$('#modal').hidden&&!$('#mbox [data-net]')&&!$('#netName')) closeModal(); }
    G=m.G; const my=GEN;
    if(m.kind==='round'){ await dealAnim(m.ev,my); return; }
    if(m.ev){ BUSY=true; await showEvents(m.ev,my); }
    BUSY=false; if(my===GEN) next(); },
  leave(){ GEN++; clearTimeout(CATCHT); CATCHT=null; G=null; BUSY=false; ENDKEY=null; MODE='ia'; render(); GAME.menu(); } };
(function boot(){ const p=load('dcp'); if(p) Object.assign(M,p); const s=load(KEY);
  if(s&&s.G&&s.G.phase&&s.G.phase!=='over'){ G=s.G; MODE=s.MODE||'ia'; VIEW=MODE==='ia'?humans()[0]:null; render(); if(G.phase==='roundOver') roundEnd(); else next(); }
  else { G=null; render(); menu(); } })();
}

</script>
