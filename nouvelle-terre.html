    ${rank.map(i=>{ const p=P(i); const s=countB(i,'s'), c=countB(i,'c'); const bonus=(G.longest===i?2:0)+(G.army===i?2:0)+p.isl.length*2+p.hero+(G.merchant&&G.merchant.p===i?1:0)+Object.values(G.bv).filter(b=>b.p===i&&b.metro).length*2; return `<tr class="${i===w?'win':''}"><td><b style="color:${PCOL[p.col].d}">${esc(p.name)}</b></td><td>${s}</td><td>${c}</td><td>${bonus}</td><td>${p.vpDev+p.progVP}</td><td style="font-family:var(--title);font-size:20px">${vp(i)}</td></tr>`; }).join('')}</table>
    <div style="text-align:right;margin-top:14px"><button class="btn" data-a="close">Voir le plateau</button> <button class="btn pri" data-a="menu">Nouvelle partie</button></div>`);
}
function confetti(){ if(REDUCED) return; for(let i=0;i<70;i++){ const c=document.createElement('div'); c.style.cssText=`position:fixed;top:-10px;left:${Math.random()*100}vw;width:8px;height:12px;background:${PCOL[i%6].h};z-index:90;pointer-events:none;border-radius:2px`; document.body.appendChild(c);
  c.animate([{transform:`translate(0,0) rotate(0)`},{transform:`translate(${(Math.random()-.5)*200}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`}],{duration:2200+Math.random()*1800,delay:Math.random()*600,easing:'ease-in'}).finished.then(()=>c.remove()); } }

/* ---------------- modales ---------------- */
function paintModal(h){ $('#mbox').innerHTML=h; $('#modal').hidden=false; }
function openModal(h){ $('#mbox').innerHTML=h; $('#mbox').onclick=null; $('#modal').hidden=false; }
function closeModal(){ $('#modal').hidden=true; $('#mbox').onclick=null; window.COVER_HIDDEN=null; }
let MENU=null;
function openMenu(){ const s=loadSave(); MENU={n:PREFS.n,slots:PREFS.slots||[{h:1,name:'Toi',lv:'normal'}].concat(AI_NAMES.slice(0,5).map(n=>({h:0,name:n,lv:'normal'}))),nav:PREFS.nav,ck:PREFS.ck,target:PREFS.target,speed:PREFS.speed}; drawMenu(s); }
const HUMAN_NAMES=['Camille','Lucas','Emma','Hugo','Léa','Jules'];
function defName(i,s){ return s.h?(i===0?'Toi':HUMAN_NAMES[i]):AI_NAMES[i]; }
function defTarget(){ return 10+(MENU.nav?3:0)+(MENU.ck?3:0)-(MENU.nav&&MENU.ck?1:0); }
function drawMenu(save){
  const tgt=MENU.target||defTarget();
  openModal(`<h2>Nouvelle partie</h2><p style="margin:0;color:var(--ink2)">Colonise une île vierge : récolte, échange, bâtis… et sois le premier à atteindre l'objectif.</p>
   ${save?`<div class="prow" style="background:#fff8;border-radius:10px;padding:8px"><b style="flex:1">Partie en cours (tour ${save.G.turn}).</b><button class="btn pri" data-a="resume">Reprendre</button></div>`:''}
   <h4>Extensions</h4><div class="ext">
    <div class="extc ${MENU.n>=5?'on':''} lock"><b>5–6 colons</b><small>Plateau agrandi de 30 tuiles et phase de construction spéciale entre les tours. S'active automatiquement à 5 ou 6 joueurs.</small></div>
    <div class="extc ${MENU.nav?'on':''}" data-a="tnav"><b>Au-delà des mers</b><small>Archipel à explorer : navires, îles lointaines (+2 PV à la découverte), champs d'or, pirate.</small></div>
    <div class="extc ${MENU.ck?'on':''}" data-a="tck"><b>Cités &amp; Remparts</b><small>Marchandises, améliorations de cité, métropoles, chevaliers, invasions barbares et 54 cartes progrès.</small></div>
   </div>
   <h4>Joueurs</h4><div class="seg">${[2,3,4,5,6].map(n=>`<button class="${n===MENU.n?'on':''}" data-a="pn" data-v="${n}">${n}</button>`).join('')}</div>
   ${MENU.slots.slice(0,MENU.n).map((s,i)=>`<div class="prow" style="--pc:${PCOL[i].h}"><span class="dot"></span><input type="text" data-name="${i}" value="${esc(s.name)}" placeholder="${esc(defName(i,s))}" maxlength="14" autocomplete="off" enterkeyhint="done"><div class="seg">${['Humain','IA facile','IA normale','IA difficile'].map((l,k)=>{const on=(k===0&&s.h)||(!s.h&&['','facile','normal','difficile'][k]===s.lv);return `<button class="${on?'on':''}" data-a="ptype" data-v="${i}:${k}">${l}</button>`;}).join('')}</div></div>`).join('')}
   <h4>Options</h4><div class="prow">Objectif <div class="seg">${[8,10,12,13,14,15,16,18].map(v=>`<button class="${v===tgt?'on':''}" data-a="ptgt" data-v="${v}">${v} PV</button>`).join('')}</div></div>
   <div class="prow">Vitesse des IA <div class="seg">${['lente','normale','rapide'].map(v=>`<button class="${MENU.speed===v?'on':''}" data-a="pspeed" data-v="${v}">${v}</button>`).join('')}</div></div>
   <div style="text-align:right;margin-top:12px">${G&&G.players&&G.players.length&&!G.over?'<button class="btn" data-a="close">Annuler</button> ':''}<button class="btn pri" data-a="start">Débarquer !</button></div>`);
  document.querySelectorAll('[data-name]').forEach(i=>i.oninput=()=>{MENU.slots[+i.dataset.name].name=i.value;});
}
function startGame(){
  const players=MENU.slots.slice(0,MENU.n).map((s,i)=>({name:(s.name||'').trim()||defName(i,s),ai:!s.h,level:s.lv||'normal'}));
  PREFS={n:MENU.n,slots:MENU.slots,nav:MENU.nav,ck:MENU.ck,target:MENU.target,speed:MENU.speed}; try{localStorage.setItem('nt-prefs',JSON.stringify(PREFS));}catch(e){}
  closeModal(); GEN++; UI={mode:null,wait:null,ask:null,view:players.findIndex(p=>!p.ai),trade:null,sel:null};
  newGame({players,nav:MENU.nav,ck:MENU.ck,target:MENU.target||defTarget(),speed:{lente:1000,normale:550,rapide:180}[MENU.speed]});
  if(UI.view<0) UI.view=0;
  setMods(); buildBoard(true); uiRender(); sfx('horn'); log('Les colons débarquent sur la Nouvelle Terre.');
  setTimeout(()=>runGame().catch(e=>{if(e!=='abort')console.error(e);}), REDUCED?0:2200);
}
function setMods(){ const m=[]; if(G.mods.ext56) m.push('5–6 colons'); if(G.mods.nav) m.push('Au-delà des mers'); if(G.mods.ck) m.push('Cités & Remparts'); $('#modsname').textContent=m.length?'· '+m.join(' · '):''; }
function resumeGame(d){ closeModal(); GEN++; G=d.G; UI={mode:null,wait:null,ask:null,view:G.players.findIndex(p=>!p.ai),trade:null,sel:null}; if(UI.view<0)UI.view=0; setMods(); buildBoard(true); uiRender(); log('Partie reprise.');
  setTimeout(()=>{ if(G.phase!=='setup'){ G.turn--; } runGame().catch(e=>{if(e!=='abort')console.error(e);}); }, REDUCED?0:1800); }
function openCosts(){ openModal(`<h2>Coûts de construction</h2><div class="costs" style="font-size:15px;gap:8px 14px">
  <b>Route</b><span>${chips(COST.road)} · 1 PV pour la Grande Route (5+ segments) : +2</span>
  ${G&&G.mods&&G.mods.nav?`<b>Navire</b><span>${chips(COST.ship)}</span>`:''}
  <b>Colonie</b><span>${chips(COST.settle)} · 1 PV</span><b>Cité</b><span>${chips(COST.city)} · 2 PV</span>
  ${G&&G.mods&&G.mods.ck?`<b>Chevalier</b><span>${chips(COST.knight)} (promotion : idem, activation : ${chips(COST.kact)})</span><b>Rempart</b><span>${chips(COST.wall)} · +2 cartes avant défausse</span><b>Amélioration</b><span>niveau n = n marchandises de la couleur</span>`:`<b>Carte dév.</b><span>${chips(COST.dev)}</span>`}
  </div><div style="text-align:right;margin-top:12px"><button class="btn pri" data-a="close">OK</button></div>`); }
function openHelp(tab){
  tab=tab||'base';
  const T={
   base:`<p>Chaque tuile produit une ressource quand son numéro sort aux dés : <b>forêt → bois</b>, <b>colline → argile</b>, <b>pré → laine</b>, <b>champ → blé</b>, <b>montagne → minerai</b>. Le désert ne produit rien.</p>
    <p><b>Mise en place :</b> chacun pose une colonie et une route, puis une seconde dans l'ordre inverse (elle rapporte aussitôt les ressources voisines). Deux colonies ne peuvent jamais être voisines.</p>
    <p><b>Ton tour :</b> lance les dés (tout le monde récolte), puis commerce et construis autant que tu veux, et termine.</p>
    <ul><li><b>Route</b> (bois+argile), <b>Colonie</b> (bois+argile+laine+blé, 1 PV), <b>Cité</b> (2 blé+3 minerai, remplace une colonie, 2 PV et double récolte), <b>Carte de développement</b> (laine+blé+minerai).</li>
    <li><b>7 :</b> qui a plus de 7 cartes en défausse la moitié ; le lanceur déplace le brigand (la tuile ne produit plus) et vole une carte à un voisin.</li>
    <li><b>Commerce :</b> 4:1 avec la banque, 3:1 ou 2:1 grâce aux ports, ou librement avec les autres joueurs.</li>
    <li><b>Cartes de développement :</b> Chevalier (déplace le brigand ; 3 chevaliers joués et le plus = Grande Armée +2 PV), Construction de routes (2 routes gratuites), Abondance (2 ressources au choix), Monopole (tout le monde te donne une ressource), Point de victoire. Une seule carte par tour, pas celle achetée ce tour-ci.</li>
    <li><b>Grande Route :</b> la plus longue route continue d'au moins 5 segments : +2 PV.</li></ul>`,
   ext:`<h4>5–6 colons</h4><p>Plateau de 30 tuiles, 11 ports. Après chaque tour, les autres joueurs, dans l'ordre, peuvent construire (sans commercer) : c'est la <b>phase de construction spéciale</b>.</p>
    <h4>Au-delà des mers</h4><p>Le plateau devient un archipel. Tu démarres sur l'île principale. Les <b>navires</b> (bois+laine) se posent sur les bords maritimes et prolongent ton réseau ; une route et un navire ne se relient que par une colonie. Une fois par tour, tu peux <b>déplacer</b> le navire au bout d'une ligne ouverte (pas celui construit ce tour-ci).</p>
    <p>Première colonie sur chaque nouvelle île : <b>+2 PV</b>. Les <b>champs d'or</b> donnent la ressource de ton choix. Sur un 7 (ou un chevalier), tu peux déplacer le <b>pirate</b> sur la mer : il bloque les navires voisins et vole les joueurs qui y naviguent.</p>
    <h4>Cités &amp; Remparts</h4><ul><li>Les cités produisent une <b>marchandise</b> : forêt → papier, pré → tissu, montagne → monnaie (champ et colline donnent 2 ressources). La seconde pose de départ est une cité.</li>
    <li><b>Améliorations</b> (Science/papier, Commerce/tissu, Politique/monnaie) : niveau n coûte n marchandises. Niveau 3 : Aqueduc, Comptoir 2:1, Forteresse. Niveau 4 : la première <b>Métropole</b> de la couleur (+2 PV, à l'abri des barbares).</li>
    <li><b>Dé d'événement :</b> navire = les barbares avancent ; porte colorée = cartes progrès de cette couleur pour ceux dont le niveau + 1 ≥ dé rouge.</li>
    <li><b>Barbares :</b> à l'arrivée, on compare le nombre de cités à la force des chevaliers <b>actifs</b>. Défaite : les plus faibles perdent une cité (pas la métropole). Victoire : le meilleur défenseur devient Héros (+1 PV). Ensuite tous les chevaliers se désactivent. Le brigand reste au désert jusqu'à la première attaque.</li>
    <li><b>Chevaliers :</b> recrutés (laine+minerai) au bord de ton réseau, promus (laine+minerai), activés (blé). Un chevalier actif peut se déplacer ou chasser le brigand d'une tuile voisine. <b>Rempart</b> (2 argile) : +2 cartes avant défausse.</li>
    <li><b>Cartes progrès :</b> 54 cartes (Science, Commerce, Politique), jusqu'à 4 en main. Il n'y a plus de cartes de développement.</li></ul>`,
   ui:`<ul><li>Choisis une construction dans la barre d'actions : les emplacements possibles se mettent à briller sur le plateau.</li><li>Le bouton « Commerce » ouvre la banque, les ports et les échanges avec les autres joueurs (les IA acceptent ou refusent).</li><li>Plusieurs humains : un écran de passage protège ta main.</li><li>La partie est sauvegardée à chaque tour.</li></ul>`};
  const N={base:'Règles de base',ext:'Extensions',ui:'Interface'};
  openModal(`<h2>Aide</h2><div class="tabs">${Object.keys(T).map(k=>`<button class="${k===tab?'on':''}" data-a="helptab" data-v="${k}">${N[k]}</button>`).join('')}</div>${T[tab]}<div style="text-align:right"><button class="btn pri" data-a="close">Compris</button></div>`);
}

/* ---------------- sons ---------------- */
let AC=null,NOISE=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(AC.state==='suspended') AC.resume().catch(()=>{}); return AC; }
function tn(a,t,f,d,type,v,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function nz(a,t,d,v,type,f){ if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;} const s=a.createBufferSource();s.buffer=NOISE;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02); }
function sfx(n){ if(MUTED||!G||G.fast) return; const a=ac(); if(!a||a.state!=='running') return; const t=a.currentTime+.01;
  switch(n){ case 'dice': for(let k=0;k<6;k++) nz(a,t+k*.07+Math.random()*.03,.05,.3,'bandpass',1800+Math.random()*1200); break;
    case 'build': tn(a,t,140,.18,'triangle',.25,70); nz(a,t,.08,.25,'lowpass',600); break;
    case 'splash': nz(a,t,.4,.2,'lowpass',900); break;
    case 'gain': [880,1175].forEach((f,k)=>tn(a,t+k*.07,f,.3,'sine',.08)); break;
    case 'card': nz(a,t,.12,.22,'bandpass',2600); break;
    case 'robber': tn(a,t,110,.5,'sawtooth',.08,70); break;
    case 'steal': tn(a,t,600,.15,'square',.05,300); break;
    case 'bad': tn(a,t,260,.4,'sawtooth',.08,120); break;
    case 'horn': tn(a,t,147,.9,'sawtooth',.07,140); tn(a,t,220,.9,'triangle',.05,215); break;
    case 'win': [523,659,784,1046].forEach((f,k)=>tn(a,t+k*.12,f,.4,'triangle',.11)); break; } }
function updSnd(){ $('#sndBtn').textContent=MUTED?'Son : non':'Son : oui'; }

/* ---------------- événements ---------------- */
document.addEventListener('click',e=>{
  if(!MUTED) ac();
  const t=e.target.closest('[data-a]'); if(!t) return; const a=t.dataset.a, v=t.dataset.v;
  switch(a){
    case 'roll': resolveTurn({a:'roll'}); break;
    case 'mode': if(UI.ask) break; UI.mode=UI.mode===v?null:v; UI.sel=null; uiRender(); if(UI.mode) showPrompt({road:'Choisis où poser ta route',ship:'Choisis où lancer ton navire',settle:'Choisis l\'emplacement de la colonie',city:'Choisis la colonie à transformer',knight:'Où recruter ton chevalier ?',kup:'Quel chevalier promouvoir ?',kact:'Quel chevalier activer ?',kmove:'Quel chevalier déplacer ?',kchase:'Quel chevalier chasse le brigand ?',wall:'Quelle cité fortifier ?',moveShip:'Quel navire déplacer ?'}[UI.mode],true); else hidePrompt(); break;
    case 'cancelmode': UI.mode=null; UI.sel=null; hidePrompt(); uiRender(); break;
    case 'buydev': resolveTurn({a:'dev'}); break;
    case 'playdev': resolveTurn({a:'playDev',c:v}); break;
    case 'playprog': resolveTurn({a:'prog',i:+v}); break;
    case 'trade': openTrade(); break;
    case 'impr': openImpr(); break;
    case 'endturn': UI.mode=null; UI.tradeOpen=false; resolveTurn({a:'end'}); break;
    case 'costs': openCosts(); break;
    case 'sound': MUTED=!MUTED; try{localStorage.setItem('nt-mute',MUTED?'1':'0');}catch(e){} updSnd(); break;
    case 'help': openHelp(); break; case 'helptab': openHelp(v); break;
    case 'menu': { const cv=$('#cover'); openMenu(); if(cv&&!cv.hidden){ cv.hidden=true; window.COVER_HIDDEN=cv; } break; } case 'close': { const cv=window.COVER_HIDDEN; closeModal(); UI.tradeOpen=false; if(cv) cv.hidden=false; break; }
    case 'resume': { const s=loadSave(); if(s) resumeGame(s); break; }
    case 'tnav': MENU.nav=!MENU.nav; MENU.target=null; drawMenu(loadSave()); break;
    case 'tck': MENU.ck=!MENU.ck; MENU.target=null; drawMenu(loadSave()); break;
    case 'pn': MENU.n=+v; drawMenu(loadSave()); break;
    case 'ptgt': MENU.target=+v; drawMenu(loadSave()); break;
    case 'pspeed': MENU.speed=v; drawMenu(loadSave()); break;
    case 'ptype': { const [i,k]=v.split(':').map(Number); const s=MENU.slots[i]; if(k===0){ s.h=1; if(AI_NAMES.includes(s.name)||/^Joueur \d$/.test(s.name)) s.name=defName(i,s);} else { if(s.h&&(/^(Toi|Joueur \d)$/.test(s.name)||HUMAN_NAMES.includes(s.name)||!s.name.trim())) s.name=AI_NAMES[i]; s.h=0; s.lv=['','facile','normal','difficile'][k]; } drawMenu(loadSave()); break; }
    case 'start': startGame(); break;
  }
});
(function boot(){
  updSnd(); const s=loadSave();
  if(s){ resumeGame(s); return; }
  // plateau de démonstration en fond
  newGame({players:[{name:'—',ai:true},{name:'—',ai:true},{name:'—',ai:true}],fast:false}); G.players=[]; G.log=[]; G.fake=true;
  buildBoard(true); $('#actions').innerHTML=''; $('#hand').innerHTML='<span class="lab">Bienvenue sur la Nouvelle Terre !</span>';
  setTimeout(openMenu, REDUCED?0:1600);
})();
