<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nouvelle Terre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800;6..12,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f2a3a;--bg2:#163a4f;--panel:#f7eedb;--panel2:#ecdfc2;--ink:#2d2416;--ink2:#6e5f45;--gold:#e0b44c;--accent:#c0532b;
  --ui:"Nunito Sans",system-ui,sans-serif;--title:"Cinzel",Georgia,serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(ellipse at 50% 0%,#1f5670,var(--bg) 70%) fixed,var(--bg);color:#f3ead6;font-family:var(--ui);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#0b2230;border-bottom:1px solid #24506a;flex-wrap:wrap}
.top h1{font-family:var(--title);font-weight:800;font-size:24px;margin:0;color:#f6dc9a;letter-spacing:1px}
.top h1 small{font-family:var(--ui);font-weight:600;font-size:13px;color:#9cc3d6;margin-left:8px;letter-spacing:0}
.back{color:#cfe3ee;text-decoration:none;font-size:14px;border:1px solid #2e5d78;padding:5px 10px;border-radius:8px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#1c4660;color:#eef6fa;border:1px solid #33708f;border-radius:9px;padding:7px 12px;font-size:14px;font-weight:700}
.btn:hover{background:#245675}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:linear-gradient(#e0703f,#b64a22);border-color:#f08a5a;color:#fff}
.btn.on{background:var(--gold);color:#2a1c05;border-color:#ffd98a}
.turnbar{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--pc,#e0b44c);color:#fff;font-weight:800;box-shadow:0 4px 14px #0007;transition:background .4s;flex-wrap:wrap;min-height:46px}
.turnbar .who{font-family:var(--title);font-size:20px;text-shadow:0 1px 0 #0005}
.turnbar .msg{font-weight:600}
.turnbar .vpgoal{margin-left:auto;background:#0003;padding:3px 10px;border-radius:20px;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;padding:12px 14px 40px;max-width:1650px;margin:0 auto}
@media(max-width:1000px){.layout{grid-template-columns:1fr;padding:8px 8px 40px}}
.boardcol{min-width:0;display:flex;flex-direction:column;gap:10px}
#board{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#3f8fb5,#1b5677 60%,#0f3a55);box-shadow:0 12px 30px #0009,inset 0 0 60px #0006}
#map{display:block;width:100%;height:auto;max-height:calc(100vh - 260px);min-height:300px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.barb{position:absolute;left:10px;top:10px;background:#0b2230d9;border:1px solid #3a6f8c;border-radius:12px;padding:6px 10px;font-size:12px;font-weight:700;color:#dcebf2;z-index:2}
.barb .trk{display:flex;gap:3px;margin-top:4px;align-items:center}
.barb .trk i{width:16px;height:12px;border-radius:3px;background:#23506a;display:block}
.barb .trk i.on{background:#c0392b;box-shadow:0 0 8px #ff6040}
.barb .trk i.end{background:#5a2a1a;width:20px}
.barb b{color:#ffd27a}
.prompt{pointer-events:none;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#0b2230ee;color:#fff;padding:8px 14px;border-radius:12px;font-weight:700;z-index:3;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px #0008;max-width:calc(100% - 20px)}
.prompt[hidden]{display:none}
.prompt .btn{padding:4px 10px;font-size:13px;pointer-events:auto}
@media(max-width:700px){.prompt{bottom:auto;top:6px;left:auto;right:6px;transform:none;font-size:12px;padding:5px 9px;max-width:60%;opacity:.92}.barb{transform:scale(.8);transform-origin:top left}}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:linear-gradient(#173f57,#12344a);border:1px solid #2c6584;border-radius:14px;padding:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;background:#1f4d68;border:1px solid #3c7c9e;color:#fff;border-radius:11px;padding:6px 9px;min-width:68px;font-weight:800;font-size:13px;transition:transform .12s}
.act:hover:not(:disabled){transform:translateY(-2px);background:#286080}
.act:disabled{opacity:.38;cursor:default}
.act.on{background:var(--gold);color:#2a1c05;border-color:#ffe2a0}
.act .cost{display:flex;gap:1px}
.act.big{background:linear-gradient(#e0703f,#b64a22);border-color:#f08a5a;min-width:92px;font-size:15px}
.act.end{background:#3b2a52;border-color:#7a5aa8}
.dice{display:flex;gap:8px;align-items:center;margin-right:6px;perspective:400px}
.die{width:38px;height:38px;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.9,.3,1.1)}
.die .f{position:absolute;inset:0;border-radius:8px;background:linear-gradient(145deg,#fffdf6,#e6dcc6);border:1px solid #bba;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px;backface-visibility:hidden}
.die.red .f{background:linear-gradient(145deg,#ff7a6a,#c2372b);border-color:#902}
.die.ev .f{background:linear-gradient(145deg,#f4f0ff,#cfc6e6)}
.die .f span{width:7px;height:7px;border-radius:50%;background:#2a2418;place-self:center}
.die.red .f span{background:#fff}
.die .f.s1{transform:translateZ(19px)}.die .f.s2{transform:rotateY(90deg) translateZ(19px)}.die .f.s3{transform:rotateX(90deg) translateZ(19px)}
.die .f.s4{transform:rotateX(-90deg) translateZ(19px)}.die .f.s5{transform:rotateY(-90deg) translateZ(19px)}.die .f.s6{transform:rotateY(180deg) translateZ(19px)}
.die.ev .f{display:grid;place-items:center;grid-template:1fr/1fr;font-size:20px}
.hand{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(#f7eedb,#eadcbc);color:var(--ink);border-radius:14px;padding:10px 12px;min-height:76px;box-shadow:0 6px 16px #0006}
.hand .lab{font-family:var(--title);font-size:15px;font-weight:800;margin-right:4px}
.rc{position:relative;width:46px;height:62px;border-radius:7px;background:var(--rc);border:2px solid #fff;box-shadow:0 2px 6px #0005;display:grid;place-items:center;transition:transform .2s}
.rc svg{width:32px;height:32px}
.rc .n{position:absolute;right:-7px;top:-7px;background:var(--ink);color:#fff;font-weight:900;font-size:12px;min-width:21px;height:21px;border-radius:11px;display:grid;place-items:center;border:2px solid #f7eedb}
.rc.zero{opacity:.28}
.rc.pop{animation:rcpop .5s}
@keyframes rcpop{40%{transform:translateY(-8px) scale(1.12)}}
.cards{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.cardx{background:#fff;border:2px solid var(--cc,#7a5aa8);border-radius:9px;padding:5px 8px;font-size:12px;font-weight:800;color:var(--ink);display:flex;flex-direction:column;gap:3px;max-width:150px;box-shadow:0 2px 6px #0003}
.cardx small{font-weight:600;color:var(--ink2);line-height:1.2}
.cardx button{font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid #aaa;background:#f3ead6;font-weight:800}
.cardx.new{opacity:.6}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.pl{position:relative;background:#12344a;border:1px solid #2b6080;border-radius:13px;padding:9px 11px 9px 15px;overflow:hidden;transition:all .3s}
.pl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--pc)}
.pl.cur{box-shadow:0 0 0 2px var(--pc),0 8px 20px #0008;transform:translateX(-3px);background:#174560}
.pl .top1{display:flex;align-items:center;gap:6px}
.pl .nm{font-weight:900;font-size:15px}
.pl .lv{font-size:11px;color:#9cc3d6;font-weight:600}
.pl .vp{margin-left:auto;font-family:var(--title);font-weight:800;font-size:26px;color:#ffd77e}
.pl .st{display:flex;gap:9px;flex-wrap:wrap;font-size:12px;color:#cfe3ee;margin-top:2px}
.pl .st b{color:#fff}
.badge{display:inline-block;font-size:10.5px;font-weight:900;padding:1px 6px;border-radius:6px;background:#e0b44c;color:#2a1c05;margin-top:3px;margin-right:3px}
.impr{display:flex;gap:5px;margin-top:4px}
.impr span{display:flex;gap:1px;align-items:center;font-size:10px;font-weight:800}
.impr i{width:7px;height:9px;border-radius:2px;background:#2b5a74;display:block}
.panel{background:#12344a;border:1px solid #2b6080;border-radius:13px;padding:10px 12px}
.panel h3{margin:0 0 6px;font-family:var(--title);font-size:15px;color:#f6dc9a}
#log{max-height:240px;overflow:auto;font-size:12.5px;color:#cfe3ee;display:flex;flex-direction:column-reverse;gap:2px}
#log div{border-bottom:1px dashed #2b6080;padding:2px 0}
.costs{font-size:12px;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center}
.chips{display:inline-flex;gap:1px;align-items:center}
.chip{width:16px;height:16px;border-radius:4px;background:var(--rc);display:inline-grid;place-items:center;border:1px solid #0003}
.chip svg{width:12px;height:12px}
#modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:12px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);color:var(--ink);border-radius:16px;max-width:880px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox h2{font-family:var(--title);font-size:26px;margin:0 0 4px}
.mbox h4{font-family:var(--title);font-size:16px;margin:14px 0 6px}
.mbox p,.mbox li{line-height:1.5}
.mbox .btn{background:#e6d8b8;color:var(--ink);border-color:#bba57a}
.mbox .btn.pri{background:linear-gradient(#e0703f,#b64a22);color:#fff;border-color:#f08a5a}
.mbox .btn.on{background:var(--ink);color:#fff}
.seg{display:inline-flex;border:1px solid #bba57a;border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#f7efdc;padding:6px 10px;font-weight:700;color:var(--ink);font-size:13px}
.seg button.on{background:var(--ink);color:#fff}
.prow{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.prow .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);border:2px solid #0004}
.prow input[type=text]{font-family:inherit;font-weight:700;font-size:16px;padding:6px 9px;border-radius:8px;border:1px solid #bba57a;background:#fff;color:#2d2416;-webkit-text-fill-color:#2d2416;caret-color:#c0532b;width:140px;color-scheme:light}
.prow input[type=text]::placeholder{color:#a3926e;-webkit-text-fill-color:#a3926e;font-weight:600}
.prow input[type=text]:focus{outline:2px solid #c0532b;outline-offset:1px}
.ext{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.extc{border:2px solid #d4c29a;border-radius:12px;padding:10px;background:#fff8;cursor:pointer}
.extc.on{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px #c0532b33}
.extc b{font-family:var(--title);font-size:15px}
.extc small{display:block;color:var(--ink2);margin-top:3px;line-height:1.35}
.extc.lock{cursor:default;opacity:.8}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pick .rc{cursor:pointer;touch-action:manipulation}
@media(pointer:coarse){.pick .rc{width:58px;height:76px}.pick{gap:12px}}
.pick .rc.sel{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:1px solid #bba57a;background:#f7efdc;border-radius:20px;padding:5px 12px;font-weight:800;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
table.res{width:100%;border-collapse:collapse;font-size:14px}
table.res td,table.res th{padding:6px;border-bottom:1px solid #d9c9a3;text-align:right}
table.res td:first-child,table.res th:first-child{text-align:left}
table.res tr.win td{background:#f6df9f}
#cover{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(circle,#1f5670,#081820);text-align:center;padding:20px}
#cover[hidden]{display:none}
#cover h2{font-family:var(--title);font-size:38px;margin:0 0 8px;color:#f6dc9a}
.toast{position:fixed;left:50%;top:104px;transform:translateX(-50%);background:#0b2230;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #000a;z-index:70;font-weight:700;border:1px solid #3a6f8c;animation:toast 2.8s forwards;pointer-events:none;max-width:90vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.bannerx{position:fixed;inset:0;display:grid;place-items:center;z-index:65;pointer-events:none}
.bannerx div{font-family:var(--title);font-weight:800;font-size:clamp(30px,6vw,64px);color:#fff;background:var(--bc,#c0532b);padding:10px 36px;border-radius:12px;box-shadow:0 20px 50px #000a;animation:ban 2.3s forwards;text-align:center}
.bannerx small{display:block;font-family:var(--ui);font-size:.35em;font-weight:700}
@keyframes ban{0%{transform:scale(2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.92)}}
.fly{position:fixed;z-index:80;pointer-events:none;width:30px;height:40px;border-radius:5px;border:2px solid #fff;display:grid;place-items:center;box-shadow:0 4px 10px #0007}
.fly svg{width:22px;height:22px}
/* SVG */
#map .tile{cursor:default}
#map .tile.sel{cursor:pointer}
#map .tile.sel .top{filter:brightness(1.15)}
#map .hexhl{fill:#fff;opacity:0;pointer-events:none}
#map .tile.sel .hexhl{animation:hexp 1.2s infinite}
@keyframes hexp{50%{opacity:.28}}
#map .tok.hot{animation:tokhot 1.4s ease-out}
@keyframes tokhot{0%{transform:translateY(0)}20%{transform:translateY(-14px) scale(1.25)}45%{transform:translateY(0) scale(1)}}
#map .tok{transform-box:fill-box;transform-origin:center bottom}
#map .mk{cursor:pointer}
#map .mk circle.g{fill:#fff;stroke:var(--mc);stroke-width:3;animation:mkp 1s infinite}
@keyframes mkp{50%{r:10;opacity:.7}}
#map .mk line.g{stroke:#fff;stroke-width:7;stroke-linecap:round;opacity:.9;animation:mkl 1s infinite}
#map .mk line.h{stroke:transparent;stroke-width:22}
@keyframes mkl{50%{opacity:.35}}
#map .pc{transform-box:fill-box;transform-origin:center bottom}
#map .drop{animation:drop .55s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
#map .tdrop{animation:tdrop .7s cubic-bezier(.3,1.4,.5,1) backwards}
@keyframes tdrop{from{transform:translateY(-120px);opacity:0}}
#map .fadein{animation:fi .6s backwards}
@keyframes fi{from{opacity:0}}
#map .dust{fill:none;stroke:#fff;stroke-width:2;animation:dust .7s ease-out forwards}
@keyframes dust{from{opacity:.8;transform:scale(.3)}to{opacity:0;transform:scale(1.8)}}
#map .dust{transform-box:fill-box;transform-origin:center}
#map .kin{opacity:.55;filter:saturate(.3)}
#map .kon{filter:drop-shadow(0 0 4px #fff6a0)}
#map .waves{animation:wv 6s linear infinite}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(24px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}

/*top-above*//*hh*/#modal,#cover{top:var(--hh,0px)!important}#modal>*{max-height:calc(100vh - var(--hh,0px) - 24px)!important;max-height:calc(100dvh - var(--hh,0px) - 24px)!important;overflow:auto}
/*top-above*/header.top{position:relative;z-index:61!important}
</style>
</head>
<body>

<header class="top">
  <a class="back" href="index.html">← Salle de jeux</a>
  <h1>Nouvelle Terre <small id="modsname"></small></h1>
  <div class="tools"><button class="btn" data-a="costs">Coûts</button><button class="btn" data-a="sound" id="sndBtn">Son</button><button class="btn" data-a="help">Aide</button><button class="btn pri" data-a="menu">Nouvelle partie</button></div>
</header>
<div class="turnbar" id="turnbar"><span class="who">Nouvelle Terre</span></div>
<main class="layout">
  <section class="boardcol">
    <div id="board"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg><div id="barb" class="barb" hidden></div><div id="prompt" class="prompt" hidden></div></div>
    <div class="actions" id="actions"></div>
    <div class="hand" id="hand"></div>
  </section>
  <aside class="side"><div id="players"></div><div class="panel"><h3>Chronique</h3><div id="log"></div></div></aside>

<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="cover" hidden></div>
<script>
'use strict';
/* =================== NOUVELLE TERRE — moteur =================== */
const IS_NODE = typeof window === 'undefined';
const R5 = ['bois','argile','laine','ble','minerai'];
const C3 = ['papier','tissu','monnaie'];
const ALLC = R5.concat(C3);
const RNAME = {bois:'Bois',argile:'Argile',laine:'Laine',ble:'Blé',minerai:'Minerai',papier:'Papier',tissu:'Tissu',monnaie:'Monnaie'};
const TRES = {foret:'bois',colline:'argile',pre:'laine',champ:'ble',montagne:'minerai'};
const TCOM = {foret:'papier',pre:'tissu',montagne:'monnaie'};
const TNAME = {foret:'Forêt',colline:'Colline',pre:'Pré',champ:'Champ',montagne:'Montagne',desert:'Désert',mer:'Mer',or:"Champ d'or"};
const PIPS = {2:1,3:2,4:3,5:4,6:5,8:5,9:4,10:3,11:2,12:1};
const TRACKS = {science:'papier',commerce:'tissu',politique:'monnaie'};

/* ---------------- plateau ---------------- */
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const hk=(q,r)=>q+','+r;
function hexDist(a,b){return (Math.abs(a.q-b.q)+Math.abs(a.r-b.r)+Math.abs(a.q+a.r-b.q-b.r))/2;}
function numberBag(n){ const base=[2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12]; const ext=[2,3,4,5,6,8,9,10,11,12]; const out=[]; let k=0;
  while(out.length<n){ out.push(...(k===0?base:ext)); k++; } return shuffle(out.slice(0,n)); }
function assignNumbers(hexes){
  const prod=hexes.filter(h=>h.t!=='mer'&&h.t!=='desert');
  const idx={}; hexes.forEach((h,i)=>idx[hk(h.q,h.r)]=i);
  for(let tries=0;tries<800;tries++){
    const bag=numberBag(prod.length); prod.forEach((h,i)=>h.n=bag[i]);
    let ok=true;
    for(const h of prod){ if(h.n!==6&&h.n!==8) continue; for(const [dq,dr] of DIRS){ const o=hexes[idx[hk(h.q+dq,h.r+dr)]]; if(o&&(o.n===6||o.n===8)&&o!==h){ok=false;break;} } if(!ok)break; }
    if(ok) return;
  }
}
function ringAround(land){
  const set=new Set(land.map(h=>hk(h.q,h.r))), sea=[], seen=new Set();
  for(const h of land) for(const [dq,dr] of DIRS){ const k=hk(h.q+dq,h.r+dr); if(!set.has(k)&&!seen.has(k)){ seen.add(k); sea.push({q:h.q+dq,r:h.r+dr,t:'mer'}); } }
  return sea;
}
function genClassic(n){
  const land=[];
  if(n<=4){ for(let q=-2;q<=2;q++) for(let r=-2;r<=2;r++) if(Math.abs(q+r)<=2) land.push({q,r}); }
  else { for(let r=-3;r<=3;r++){ const L=6-Math.abs(r); for(let k=0;k<L;k++) land.push({q:k-(L-1)/2+.5-r/2,r}); } }
  const bag = n<=4 ? [].concat(Array(4).fill('foret'),Array(4).fill('pre'),Array(4).fill('champ'),Array(3).fill('colline'),Array(3).fill('montagne'),['desert'])
                   : [].concat(Array(6).fill('foret'),Array(6).fill('pre'),Array(6).fill('champ'),Array(5).fill('colline'),Array(5).fill('montagne'),['desert','desert']);
  shuffle(bag); land.forEach((h,i)=>h.t=bag[i]);
  const hexes=land.concat(ringAround(land));
  assignNumbers(hexes);
  return {hexes, ports: n<=4?9:11, portTypes: n<=4?['3','3','3','3','bois','argile','laine','ble','minerai']:['3','3','3','3','3','bois','argile','laine','laine','ble','minerai'], home:null};
}
function genNav(n){
  const R = n<=4?5:6, all=[]; for(let q=-R;q<=R;q++) for(let r=-R;r<=R;r++) if(Math.abs(q+r)<=R) all.push({q,r,t:'mer'});
  const idx={}; all.forEach((h,i)=>idx[hk(h.q,h.r)]=i);
  const get=(q,r)=>all[idx[hk(q,r)]];
  const nb=h=>DIRS.map(([dq,dr])=>get(h.q+dq,h.r+dr)).filter(Boolean);
  const isLand=h=>h&&h.land;
  // île principale
  const mainSize = n<=4?18:25; const start=get(-Math.round(R*.42),Math.round(R*.2));
  start.land=1; let main=[start];
  while(main.length<mainSize){ const fr=[]; for(const h of main) for(const o of nb(h)) if(!o.land&&hexDist(o,{q:0,r:0})<R-0.5&&hexDist(o,start)<=(n<=4?3:4)&&!fr.includes(o)) fr.push(o);
    fr.sort((a,b)=>nb(b).filter(isLand).length-nb(a).filter(isLand).length+ (rand()-.5)*1.6); const pick=fr[0]; pick.land=1; main.push(pick); }
  main.forEach(h=>h.isl=0);
  const islands=[]; const nIsl=n<=4?4:5;
  for(let k=0,tries=0;k<nIsl&&tries<400;tries++){
    const seed=all[Math.floor(rand()*all.length)];
    if(seed.land||hexDist(seed,{q:0,r:0})>R-1) continue;
    if(all.some(h=>h.land&&hexDist(h,seed)<3)) continue;
    const size=3+Math.floor(rand()*2), isl=[seed]; seed.land=1; seed.isl=k+1;
    let guard=0;
    while(isl.length<size&&guard++<40){ const fr=[]; for(const h of isl) for(const o of nb(h)) if(!o.land&&hexDist(o,{q:0,r:0})<=R-1&&!all.some(x=>x.land&&x.isl!==k+1&&hexDist(x,o)<2)) fr.push(o);
      if(!fr.length) break; const p=fr[Math.floor(rand()*fr.length)]; p.land=1; p.isl=k+1; isl.push(p); }
    islands.push(isl); k++;
  }
  // terrains
  const mainBag=shuffle([].concat(Array(Math.round(mainSize*.21)).fill('foret'),Array(Math.round(mainSize*.2)).fill('pre'),Array(Math.round(mainSize*.2)).fill('champ'),Array(Math.round(mainSize*.16)).fill('colline'),Array(Math.round(mainSize*.16)).fill('montagne')));
  while(mainBag.length<mainSize-1) mainBag.push(['foret','pre','champ'][mainBag.length%3]);
  mainBag.length=mainSize-1; mainBag.push('desert'); shuffle(mainBag);
  main.forEach((h,i)=>h.t=mainBag[i]);
  islands.forEach((isl,k)=>{ const b=shuffle(['montagne','colline','or','champ','foret','pre','montagne']); isl.forEach((h,i)=>h.t=b[i]); if(k%2===1&&!isl.some(h=>h.t==='or')) isl[0].t='or'; });
  const hexes=all.map(h=>({q:h.q,r:h.r,t:h.land?h.t:'mer',isl:h.land?h.isl:-1}));
  assignNumbers(hexes);
  return {hexes, ports:n<=4?5:7, portTypes:n<=4?['3','3','bois','laine','minerai']:['3','3','3','bois','argile','laine','ble'], home:0, nav:true};
}
function buildGraph(B){
  const H=B.hexes, V=[], E=[], vk={}, ek={};
  H.forEach((h,i)=>{ h.x=Math.sqrt(3)*(h.q+h.r/2); h.y=1.5*h.r; h.v=[]; h.e=[];
    for(let k=0;k<6;k++){ const a=(60*k-90)*Math.PI/180, x=h.x+Math.cos(a), y=h.y+Math.sin(a), key=Math.round(x*100)+','+Math.round(y*100);
      if(vk[key]==null){ vk[key]=V.length; V.push({x,y,hex:[],adjV:[],adjE:[]}); } V[vk[key]].hex.push(i); h.v.push(vk[key]); }
    for(let k=0;k<6;k++){ const a=h.v[k], b=h.v[(k+1)%6], key=Math.min(a,b)+'-'+Math.max(a,b);
      if(ek[key]==null){ ek[key]=E.length; E.push({v:[a,b],hex:[]}); V[a].adjE.push(ek[key]); V[b].adjE.push(ek[key]); V[a].adjV.push(b); V[b].adjV.push(a); }
      E[ek[key]].hex.push(i); h.e.push(ek[key]); }
  });
  V.forEach(v=>{ v.land=v.hex.some(i=>H[i].t!=='mer'); v.isl=[...new Set(v.hex.filter(i=>H[i].t!=='mer').map(i=>H[i].isl==null?0:H[i].isl))]; });
  E.forEach(e=>{ e.landAdj=e.hex.some(i=>H[i].t!=='mer'); e.seaAdj=e.hex.some(i=>H[i].t==='mer')||e.hex.length<2; e.x=(V[e.v[0]].x+V[e.v[1]].x)/2; e.y=(V[e.v[0]].y+V[e.v[1]].y)/2; });
  // ports
  let coast=E.map((e,i)=>i).filter(i=>{const e=E[i]; return e.landAdj&&e.hex.some(h=>H[h].t==='mer')&&(B.home==null||e.hex.some(h=>H[h].t!=='mer'&&H[h].isl===B.home));});
  const cx=coast.reduce((s,i)=>s+E[i].x,0)/coast.length, cy=coast.reduce((s,i)=>s+E[i].y,0)/coast.length;
  coast.sort((a,b)=>Math.atan2(E[a].y-cy,E[a].x-cx)-Math.atan2(E[b].y-cy,E[b].x-cx));
  const off=Math.floor(rand()*coast.length), ports=[], types=shuffle(B.portTypes.slice()), used=new Set();
  for(let k=0;k<B.ports;k++){ let i=Math.floor(off+k*coast.length/B.ports)%coast.length; let guard=0;
    while(guard++<coast.length&&E[coast[i]].v.some(v=>used.has(v))) i=(i+1)%coast.length;
    const e=coast[i]; E[e].v.forEach(v=>{used.add(v);V[v].adjV.forEach(w=>used.add(w));}); ports.push({e,t:types[k]}); E[e].port=k; E[e].v.forEach(v=>V[v].port=types[k]); }
  return {H,V,E,ports};
}

function newGame(cfg){
  const n=cfg.players.length, mods={ext56:n>=5, nav:!!cfg.nav, ck:!!cfg.ck};
  const B = mods.nav?genNav(n):genClassic(n);
  const gr = buildGraph(B);
  G = {v:1, cfg, fast:!!cfg.fast, mods, target: cfg.target || (10+(mods.nav?3:0)+(mods.ck?3:0)-(mods.nav&&mods.ck?1:0)),
    H:gr.H, V:gr.V, E:gr.E, ports:gr.ports,
    players: cfg.players.map((p,i)=>({name:p.name, ai:!!p.ai, level:p.level||'normal', col:i, res:emptyRes(), dev:[], devNew:[], knightsPlayed:0, vpDev:0,
      isl:[], hero:0, progVP:0, impr:{science:0,commerce:0,politique:0}, prog:[], walls:0})),
    bv:{}, be:{}, kn:{}, robber:-1, pirate:-1, longest:-1, army:-1, devDeck:[], prog:{science:[],commerce:[],politique:[]},
    barb:0, attacked:false, metro:{science:-1,commerce:-1,politique:-1}, merchant:null,
    cur:0, turn:0, phase:'setup', setupStep:0, dice:null, over:false, winner:-1, log:[], flags:{}};
  G.robber = G.H.findIndex(h=>h.t==='desert'); if(G.robber<0) G.robber=-1;
  if(mods.nav){ const seas=G.H.map((h,i)=>i).filter(i=>G.H[i].t==='mer'&&G.H[i].e.every(e=>!G.E[e].landAdj));
    const mid=seas.sort((a,b)=>Math.hypot(G.H[a].x,G.H[a].y)-Math.hypot(G.H[b].x,G.H[b].y)); G.pirate=mid[Math.floor(mid.length*.3)]??-1; }
  if(!mods.ck){ const d=[]; const add=(k,n)=>{for(let i=0;i<n;i++)d.push(k);}; add('chevalier',14+(mods.ext56?6:0)); add('pv',5); add('routes',2+(mods.ext56?1:0)); add('abondance',2+(mods.ext56?1:0)); add('monopole',2+(mods.ext56?1:0)); G.devDeck=shuffle(d); }
  else for(const t in PROG){ const d=[]; PROG[t].forEach(([k,n])=>{for(let i=0;i<n;i++)d.push(k);}); G.prog[t]=shuffle(d); }
  G.order = cfg.players.map((_,i)=>i);
  return G;
}
const P = i => G.players[i];
function others(pi){ return G.players.map((_,i)=>i).filter(i=>i!==pi); }
function countB(pi,type){ let n=0; for(const k in G.bv) if(G.bv[k].p===pi&&G.bv[k].t===type) n++; return n; }
function countE(pi,type){ let n=0; for(const k in G.be) if(G.be[k].p===pi&&G.be[k].t===type) n++; return n; }
function knights(pi){ return Object.keys(G.kn).map(Number).filter(v=>G.kn[v].p===pi); }
function vp(pi,hidden){
  const p=P(pi); let s=0;
  for(const k in G.bv){ const b=G.bv[k]; if(b.p!==pi) continue; s+= b.t==='s'?1:2; if(b.metro) s+=2; }
  if(G.longest===pi) s+=2; if(G.army===pi) s+=2;
  s+= p.isl.length*2 + p.hero + p.progVP + (G.merchant&&G.merchant.p===pi?1:0);
  if(!hidden) s+= p.vpDev;
  return s;
}
function canPay(pi,cost){ const r=P(pi).res; for(const k in cost) if((r[k]||0)<cost[k]) return false; return true; }
function pay(pi,cost){ const r=P(pi).res; for(const k in cost) r[k]-=cost[k]; }
function gain(pi,k,n){ P(pi).res[k]+=n; }

/* --------- légalité --------- */
function vFree(v){ return !G.bv[v] && G.kn[v]==null; }
function distOK(v){ return !G.V[v].adjV.some(w=>G.bv[w]); }
function ownEdgeAt(pi,v,type){ return G.V[v].adjE.some(e=>G.be[e]&&G.be[e].p===pi&&(!type||G.be[e].t===type)); }
function blockedFor(pi,v){ const b=G.bv[v]; if(b&&b.p!==pi) return true; const k=G.kn[v]; return k!=null&&k.p!==pi; }
function canSettleAt(pi,v,setup){
  const V=G.V[v]; if(!V.land||G.bv[v]||G.kn[v]!=null&&G.kn[v].p!==pi||!distOK(v)) return false;
  if(G.kn[v]!=null) return false;
  if(setup){ if(G.mods.nav && !V.isl.includes(0)) return false; return true; }
  return ownEdgeAt(pi,v);
}
function spotFree(v){ const V=G.V[v]; return V.land&&!G.bv[v]&&G.kn[v]==null&&distOK(v); }
function pirateNear(e){ return G.pirate>=0 && G.E[e].hex.includes(G.pirate); }
function canRoadAt(pi,e){
  const E=G.E[e]; if(!E.landAdj||G.be[e]) return false;
  return E.v.some(v=>{ const b=G.bv[v]; if(b&&b.p===pi) return true; if(blockedFor(pi,v)) return false; return V_roadEnd(pi,v,'road'); });
}
function V_roadEnd(pi,v,type){ return G.V[v].adjE.some(o=>G.be[o]&&G.be[o].p===pi&&G.be[o].t===type); }
function canShipAt(pi,e){
  if(!G.mods.nav) return false; const E=G.E[e]; if(!E.seaAdj||G.be[e]||pirateNear(e)) return false;
  if(!E.v.every(v=>G.V[v].hex.length>=2||G.V[v].land)) return false;
  return E.v.some(v=>{ const b=G.bv[v]; if(b&&b.p===pi) return true; if(blockedFor(pi,v)) return false; return V_roadEnd(pi,v,'ship'); });
}
function legal(pi,kind){
  const out=[];
  if(kind==='settle'){ for(let v=0;v<G.V.length;v++) if(canSettleAt(pi,v,false)) out.push(v); }
  else if(kind==='city'){ for(const k in G.bv) if(G.bv[k].p===pi&&G.bv[k].t==='s') out.push(+k); }
  else if(kind==='road'){ for(let e=0;e<G.E.length;e++) if(canRoadAt(pi,e)) out.push(e); }
  else if(kind==='ship'){ for(let e=0;e<G.E.length;e++) if(canShipAt(pi,e)) out.push(e); }
  else if(kind==='knight'){ for(let v=0;v<G.V.length;v++) if(vFree(v)&&G.V[v].land&&ownEdgeAt(pi,v)) out.push(v); }
  else if(kind==='wall'){ for(const k in G.bv) if(G.bv[k].p===pi&&G.bv[k].t==='c'&&!G.bv[k].wall) out.push(+k); }
  return out;
}
function shipMovable(pi){ // navires en bout de ligne
  if(G.flags.shipMoved) return [];
  return Object.keys(G.be).map(Number).filter(e=>{ const b=G.be[e]; if(b.p!==pi||b.t!=='ship'||b.turn===G.turn||pirateNear(e)) return false;
    return G.E[e].v.some(v=>{ const bb=G.bv[v]; if(bb&&bb.p===pi) return false; return !G.V[v].adjE.some(o=>o!==e&&G.be[o]&&G.be[o].p===pi&&G.be[o].t==='ship'); }); });
}
function pieceLeft(pi,kind){ if(kind==='road') return countE(pi,'road')<LIMIT.road; if(kind==='ship') return countE(pi,'ship')<LIMIT.ship;
  if(kind==='settle') return countB(pi,'s')<LIMIT.settle; if(kind==='city') return countB(pi,'c')<LIMIT.city; return true; }
function knightCount(pi,lvl){ return knights(pi).filter(v=>G.kn[v].lvl===lvl).length; }
function canKnightUp(pi,v){ const k=G.kn[v]; if(!k||k.p!==pi||k.lvl>=3||k.upTurn===G.turn) return false; if(k.lvl===2&&P(pi).impr.politique<3) return false; return knightCount(pi,k.lvl+1)<2; }

/* --------- route la plus longue --------- */
function longestFor(pi){
  const es=Object.keys(G.be).map(Number).filter(e=>G.be[e].p===pi); if(!es.length) return 0;
  const adj={}; es.forEach(e=>G.E[e].v.forEach(v=>(adj[v]=adj[v]||[]).push(e)));
  let best=0; const used=new Set(); let steps=0;
  const dfs=(v,len,lastT)=>{ if(++steps>60000) return; best=Math.max(best,len);
    if(len>0&&blockedFor(pi,v)) return;
    const own=G.bv[v]&&G.bv[v].p===pi;
    for(const e of adj[v]||[]){ if(used.has(e)) continue; const t=G.be[e].t; if(lastT&&t!==lastT&&!own) continue; used.add(e); const o=G.E[e].v[0]===v?G.E[e].v[1]:G.E[e].v[0]; dfs(o,len+1,t); used.delete(e); } };
  Object.keys(adj).forEach(v=>dfs(+v,0,null));
  return best;
}
function updateLongest(){
  const L=G.players.map((_,i)=>longestFor(i)); const mx=Math.max(...L); const prev=G.longest;
  if(mx<5){ G.longest=-1; }
  else if(prev>=0&&L[prev]===mx){ }
  else { const top=L.map((l,i)=>l===mx?i:-1).filter(i=>i>=0); G.longest = top.length===1?top[0]:-1; }
  G.longLen=L;
  if(prev!==G.longest&&G.longest>=0) { log(`${P(G.longest).name} prend la Grande Route (${mx}).`); if(!IS_NODE&&!G.fast) uiFx('longest',G.longest); }
}

/* --------- dés & production --------- */
async function roll(pi){
  let d1=1+Math.floor(rand()*6), d2=1+Math.floor(rand()*6);
  if(G.flags.alchimie){ [d1,d2]=G.flags.alchimie; G.flags.alchimie=null; }
  let ev=null; if(G.mods.ck){ const f=Math.floor(rand()*6); ev= f<3?'barb':['science','commerce','politique'][f-3]; }
  G.dice=[d1,d2,ev]; const s=d1+d2;
  log(`${P(pi).name} lance les dés : ${s}${ev?(ev==='barb'?' · les barbares avancent':' · porte '+TRNAME[ev]):''}.`);
  if(!IS_NODE&&!G.fast) await uiDice(d1,d2,ev);
  if(G.mods.ck){
    if(ev==='barb'){ G.barb++; if(!IS_NODE&&!G.fast) await uiFx('barb'); if(G.barb>=7) await barbarianAttack(); }
    else { for(const i of turnOrderFrom(pi)) { const L=P(i).impr[ev]; if(L>=1 && d1<=L+1 && G.prog[ev].length) await drawProg(i,ev); } }
  }
  if(s===7) await seven(pi); else await produce(s);
}
function turnOrderFrom(pi){ const n=G.players.length; return Array.from({length:n},(_,k)=>(pi+k)%n); }
async function produce(s){
  const got=G.players.map(()=>emptyRes()), gold=G.players.map(()=>0);
  G.H.forEach((h,hi)=>{ if(h.n!==s||hi===G.robber) return;
    for(const v of h.v){ const b=G.bv[v]; if(!b) continue; const m=b.t==='c'?2:1;
      if(h.t==='or'){ gold[b.p]+=m; continue; }
      const r=TRES[h.t]; if(!r) continue;
      if(G.mods.ck&&b.t==='c'&&TCOM[h.t]){ got[b.p][r]+=1; got[b.p][TCOM[h.t]]+=1; } else got[b.p][r]+=m; } });
  for(let i=0;i<G.players.length;i++){ for(const k in got[i]) gain(i,k,got[i][k]); }
  if(!IS_NODE&&!G.fast) await uiProduce(s,got);
  for(let i=0;i<G.players.length;i++){
    if(gold[i]){ const pick=await choose(i,'res',{n:gold[i],pool:R5,why:`Champ d'or : choisis ${gold[i]} ressource${gold[i]>1?'s':''}`}); pick.forEach(k=>gain(i,k,1)); got[i].gold=gold[i]; log(`${P(i).name} extrait de l'or (${gold[i]}).`); }
    if(G.mods.ck&&P(i).impr.science>=3&&sum(got[i])===0&&!gold[i]){ const pick=await choose(i,'res',{n:1,pool:R5,why:'Aqueduc : tu ne reçois rien, choisis 1 ressource'}); pick.forEach(k=>gain(i,k,1)); log(`${P(i).name} profite de son aqueduc.`); }
  }
  const parts=G.players.map((p,i)=>sum(got[i])?`${p.name} +${sum(got[i])}`:'').filter(Boolean);
  if(parts.length) log('Récolte : '+parts.join(', ')+'.');
}
function handLimit(pi){ return 7 + (G.mods.ck?2*Object.values(G.bv).filter(b=>b.p===pi&&b.wall).length:0); }
async function seven(pi){
  for(const i of turnOrderFrom(pi)){ const n=resCount(P(i)); if(n>handLimit(i)){ const k=Math.floor(n/2); const d=await choose(i,'discard',{n:k}); for(const r in d){ P(i).res[r]-=d[r]; } log(`${P(i).name} défausse ${k} cartes.`); } }
  if(G.mods.ck&&!G.attacked){ log('Les barbares ne sont pas encore venus : le brigand reste au désert.'); return; }
  await moveRobber(pi,true);
}
async function moveRobber(pi,allowPirate){
  const land=G.H.map((h,i)=>i).filter(i=>G.H[i].t!=='mer'&&i!==G.robber);
  const sea=G.mods.nav&&allowPirate?G.H.map((h,i)=>i).filter(i=>G.H[i].t==='mer'&&i!==G.pirate):[];
  const h=await choose(pi,'hex',{opts:land.concat(sea),why:G.mods.nav?'Déplace le brigand (terre) ou le pirate (mer)':'Déplace le brigand'});
  const isSea=G.H[h].t==='mer';
  if(isSea){ G.pirate=h; log(`${P(pi).name} envoie le pirate.`); } else { G.robber=h; log(`${P(pi).name} déplace le brigand (${TNAME[G.H[h].t]}).`); }
  if(!IS_NODE&&!G.fast) await uiFx(isSea?'pirate':'robber',h);
  let victims;
  if(isSea) victims=[...new Set(G.H[h].e.filter(e=>G.be[e]&&G.be[e].t==='ship').map(e=>G.be[e].p))].filter(i=>i!==pi&&resCount(P(i))>0);
  else victims=[...new Set(G.H[h].v.filter(v=>G.bv[v]).map(v=>G.bv[v].p))].filter(i=>i!==pi&&resCount(P(i))>0);
  if(victims.length){ const t=victims.length===1?victims[0]:await choose(pi,'player',{opts:victims,why:'Choisis à qui voler une carte'}); steal(pi,t); }
}
function steal(pi,t){ const pool=[]; for(const k of ALLC) for(let i=0;i<P(t).res[k];i++) pool.push(k); if(!pool.length) return null; const k=pool[Math.floor(rand()*pool.length)]; P(t).res[k]--; P(pi).res[k]++; log(`${P(pi).name} vole une carte à ${P(t).name}.`); if(!IS_NODE&&!G.fast) uiFx('steal',pi,t,k); return k; }

/* --------- cartes développement (base) --------- */
async function playDev(pi,card){
  const p=P(pi), i=p.dev.indexOf(card); if(i<0||G.flags.devPlayed) return false;
  p.dev.splice(i,1); G.flags.devPlayed=true; log(`${p.name} joue ${DEVS[card]}.`);
  if(!IS_NODE&&!G.fast) await uiFx('card',pi,DEVS[card]);
  if(card==='chevalier'){ p.knightsPlayed++; updateArmy(pi); await moveRobber(pi,true); }
  else if(card==='routes'){ await freeRoads(pi,2); }
  else if(card==='abondance'){ const r=await choose(pi,'res',{n:2,pool:R5,why:'Abondance : prends 2 ressources'}); r.forEach(k=>gain(pi,k,1)); }
  else if(card==='monopole'){ const r=(await choose(pi,'res',{n:1,pool:R5,why:'Monopole : choisis une ressource'}))[0]; let tot=0; for(const o of others(pi)){ tot+=P(o).res[r]; P(pi).res[r]+=P(o).res[r]; P(o).res[r]=0; } log(`${p.name} rafle ${tot} ${RNAME[r].toLowerCase()}.`); }
  return true;
}
async function freeRoads(pi,n){
  for(let k=0;k<n;k++){ const opts=legal(pi,'road').filter(()=>pieceLeft(pi,'road')).map(e=>({e,t:'road'})).concat(G.mods.nav&&pieceLeft(pi,'ship')?legal(pi,'ship').map(e=>({e,t:'ship'})):[]);
    if(!opts.length) break; const c=await choose(pi,'edge',{opts:opts.map(o=>o.e),types:opts,why:`Construction gratuite (${k+1}/${n})`}); if(c==null) break;
    const o=opts.find(o=>o.e===c.e&&o.t===c.t)||opts.find(o=>o.e===(c.e??c)); await placeEdge(pi,o.e,o.t,true); }
}

/* --------- commerce --------- */
function ratio(pi,k){
  const p=P(pi); let r=4;
  if(R5.includes(k)){ for(const v in G.bv) if(G.bv[v].p===pi&&G.V[v].port){ const t=G.V[v].port; if(t==='3') r=Math.min(r,3); else if(t===k) r=2; } }
  else { for(const v in G.bv) if(G.bv[v].p===pi&&G.V[v].port==='3') r=Math.min(r,3); if(G.mods.ck&&p.impr.commerce>=3) r=2; }
  if(G.merchant&&G.merchant.p===pi&&G.merchant.r===k) r=2;
  if(G.flags.flotte===k) r=2;
  return r;
}
function bankTrade(pi,give,get){ const r=ratio(pi,give); if(P(pi).res[give]<r) return false; P(pi).res[give]-=r; P(pi).res[get]++; log(`${P(pi).name} échange ${r} ${RNAME[give].toLowerCase()} contre 1 ${RNAME[get].toLowerCase()}.`); return true; }

/* --------- Cités & Remparts --------- */
function cityCount(){ return Object.values(G.bv).filter(b=>b.t==='c').length; }
function strength(pi){ return knights(pi).filter(v=>G.kn[v].active).reduce((s,v)=>s+G.kn[v].lvl,0); }
async function barbarianAttack(){
  const att=cityCount(), def=G.players.map((_,i)=>strength(i)), tot=def.reduce((a,b)=>a+b,0);
  log(`⚔ Les barbares débarquent : ${att} contre ${tot}.`);
  if(!IS_NODE&&!G.fast) await uiFx('attack',att,tot);
  if(att>tot){
    const cand=G.players.map((_,i)=>i).filter(i=>Object.values(G.bv).some(b=>b.p===i&&b.t==='c'&&!b.metro));
    if(cand.length){ const mn=Math.min(...cand.map(i=>def[i])); for(const i of cand.filter(i=>def[i]===mn)){
      const cities=Object.keys(G.bv).map(Number).filter(v=>G.bv[v].p===i&&G.bv[v].t==='c'&&!G.bv[v].metro);
      const v=cities.length===1?cities[0]:await choose(i,'vertex',{opts:cities,why:'Les barbares pillent une de tes cités'});
      if(G.bv[v].wall){ G.bv[v].wall=false; } G.bv[v].t='s'; log(`${P(i).name} perd une cité, réduite en colonie.`); if(!IS_NODE&&!G.fast) await uiPlace('pillage',v,i); } }
  } else {
    const mx=Math.max(...def); const top=def.map((d,i)=>d===mx?i:-1).filter(i=>i>=0);
    if(top.length===1){ P(top[0]).hero++; log(`${P(top[0]).name} est sacré Héros de la Nouvelle Terre (+1 PV) !`); }
    else for(const i of top){ const deck=await choose(i,'deck',{why:'Victoire partagée : choisis une carte progrès'}); if(G.prog[deck].length) await drawProg(i,deck); }
  }
  for(const v in G.kn) G.kn[v].active=false;
  G.barb=0; if(!G.attacked){ G.attacked=true; log('Le brigand et le pirate peuvent désormais agir.'); }
}
async function drawProg(pi,deck){
  const c=G.prog[deck].pop(); if(!c) return;
  if(PVPROG.includes(c)){ P(pi).progVP++; log(`${P(pi).name} révèle ${PNAME[c]} : +1 PV.`); if(!IS_NODE&&!G.fast) await uiFx('card',pi,PNAME[c]); return; }
  P(pi).prog.push({k:c,deck}); log(`${P(pi).name} reçoit une carte progrès (${TRNAME[deck]}).`);
  if(!IS_NODE&&!G.fast) uiFx('prog',pi,deck);
  if(P(pi).prog.length>4){ const i=await choose(pi,'discardProg',{}); const [d]=P(pi).prog.splice(i,1); G.prog[d.deck].unshift(d.k); log(`${P(pi).name} écarte une carte progrès.`); }
}
function imprCost(pi,t){ const L=P(pi).impr[t]; const c={}; c[TRACKS[t]]=Math.max(0,L+1-(G.flags.grue?1:0)); return c; }
function canImpr(pi,t){ const L=P(pi).impr[t]; if(L>=5) return false; if(!Object.values(G.bv).some(b=>b.p===pi&&b.t==='c')) return false;
  if(L>=3){ const m=G.metro[t]; if(m!==pi&&m>=0&&L+1===4) { /* niveau 4 possible, pas de métropole */ } }
  return canPay(pi,imprCost(pi,t)); }
async function improve(pi,t){ pay(pi,imprCost(pi,t)); G.flags.grue=false; P(pi).impr[t]++; log(`${P(pi).name} améliore ${TRNAME[t]} au niveau ${P(pi).impr[t]}.`); if(!IS_NODE&&!G.fast) await uiFx('impr',pi,t); assignMetros(); }
function assignMetros(){
  for(const t in TRACKS){ const cur=G.metro[t];
    for(let i=0;i<G.players.length;i++){ const L=P(i).impr[t]; if(L<4||cur===i) continue;
      if(cur<0 || (L===5 && P(cur).impr[t]<5)){ // prend (ou vole) la métropole
        const free=Object.keys(G.bv).map(Number).filter(v=>G.bv[v].p===i&&G.bv[v].t==='c'&&!G.bv[v].metro); if(!free.length) continue;
        if(cur>=0){ for(const v in G.bv) if(G.bv[v].metro===t) G.bv[v].metro=null; }
        G.bv[free[0]].metro=t; G.metro[t]=i; log(`${P(i).name} érige la Métropole de ${TRNAME[t]} (+2 PV) !`); if(!IS_NODE&&!G.fast) uiFx('metro',free[0],t); break; } } }
}
async function placeKnight(pi,v,free,lvl){ if(!free) pay(pi,COST.knight); G.kn[v]={p:pi,lvl:lvl||1,active:false,upTurn:G.turn}; log(`${P(pi).name} recrute un chevalier.`); updateLongest(); if(!IS_NODE&&!G.fast) await uiPlace('knight',v,pi); }
async function upKnight(pi,v,free){ if(!free) pay(pi,COST.kup); G.kn[v].lvl++; G.kn[v].upTurn=G.turn; log(`${P(pi).name} promeut un chevalier (niveau ${G.kn[v].lvl}).`); if(!IS_NODE&&!G.fast) await uiPlace('kup',v,pi); }
async function actKnight(pi,v,free){ if(!free) pay(pi,COST.kact); G.kn[v].active=true; G.kn[v].actTurn=G.turn; log(`${P(pi).name} active un chevalier.`); if(!IS_NODE&&!G.fast) await uiPlace('kact',v,pi); }
function knightMoves(pi,v){ // sommets vides atteignables par le réseau du joueur
  const seen=new Set([v]), q=[v], out=[];
  while(q.length){ const u=q.shift(); for(const e of G.V[u].adjE){ const b=G.be[e]; if(!b||b.p!==pi) continue; const w=G.E[e].v[0]===u?G.E[e].v[1]:G.E[e].v[0]; if(seen.has(w)) continue; seen.add(w);
    if(G.bv[w]&&G.bv[w].p!==pi) continue; if(G.kn[w]!=null&&G.kn[w].p!==pi) continue; if(vFree(w)&&G.V[w].land) out.push(w); q.push(w); } }
  return out;
}
function canChase(pi,v){ const k=G.kn[v]; return k&&k.p===pi&&k.active&&k.actTurn!==G.turn&&G.attacked&&G.robber>=0&&G.H[G.robber].v.includes(v); }
async function chaseRobber(pi,v){ G.kn[v].active=false; log(`${P(pi).name} lance un chevalier contre le brigand !`); await moveRobber(pi,false); }
async function moveKnight(pi,from,to){ const k=G.kn[from]; delete G.kn[from]; k.active=false; G.kn[to]=k; log(`${P(pi).name} déplace un chevalier.`); updateLongest(); if(!IS_NODE&&!G.fast) await uiPlace('knight',to,pi); }

/* --------- cartes progrès --------- */
function progPlayable(pi,c,pre){
  if(c==='alchimiste') return pre;
  if(pre) return false;
  const p=P(pi);
  switch(c){
    case 'medecine': return legal(pi,'city').length>0&&p.res.minerai>=2&&p.res.ble>=1&&pieceLeft(pi,'city');
    case 'ingenieur': return legal(pi,'wall').length>0&&Object.values(G.bv).filter(b=>b.p===pi&&b.wall).length<3;
    case 'forgeron': return knights(pi).some(v=>canKnightUp(pi,v));
    case 'routes': return legal(pi,'road').length+legal(pi,'ship').length>0;
    case 'grue': return !G.flags.grue;
    case 'maitre': return others(pi).some(o=>vp(o,true)>vp(pi,true)&&resCount(P(o))>0);
    case 'eveque': return G.attacked;
    case 'diplomate': return openRoads(pi).length>0;
    case 'intrigue': return intrigueTargets(pi).length>0;
    case 'espion': return others(pi).some(o=>P(o).prog.length>0);
    case 'seigneur': return knights(pi).some(v=>!G.kn[v].active);
    case 'mariage': return others(pi).some(o=>vp(o,true)>vp(pi,true)&&resCount(P(o))>0);
    case 'deserteur': return others(pi).some(o=>knights(o).length>0);
    case 'inventeur': return swappable().length>=2;
    case 'marchand': return merchantHexes(pi).length>0;
  }
  return true;
}
function swappable(){ return G.H.map((h,i)=>i).filter(i=>G.H[i].n&&![2,12,6,8].includes(G.H[i].n)); }
function merchantHexes(pi){ return G.H.map((h,i)=>i).filter(i=>TRES[G.H[i].t]&&G.H[i].v.some(v=>G.bv[v]&&G.bv[v].p===pi)); }
function openRoads(pi){ return Object.keys(G.be).map(Number).filter(e=>{ const b=G.be[e]; if(b.p===pi||b.t!=='road') return false; return G.E[e].v.some(v=>!G.bv[v]&&G.kn[v]==null&&!G.V[v].adjE.some(o=>o!==e&&G.be[o]&&G.be[o].p===b.p)); }); }
function intrigueTargets(pi){ return Object.keys(G.kn).map(Number).filter(v=>G.kn[v].p!==pi&&ownEdgeAt(pi,v)); }
async function playProg(pi,idx){
  const p=P(pi), card=p.prog[idx]; if(!card) return false; const c=card.k;
  p.prog.splice(idx,1); G.prog[card.deck].unshift(c);
  log(`${p.name} joue ${PNAME[c]}.`); if(!IS_NODE&&!G.fast) await uiFx('card',pi,PNAME[c]);
  const opp=others(pi);
  switch(c){
    case 'alchimiste': { const d=await choose(pi,'dice',{}); G.flags.alchimie=d; break; }
    case 'inventeur': { const opts=swappable(); const a=await choose(pi,'hex',{opts,why:'Inventeur : premier jeton'}); const b=await choose(pi,'hex',{opts:opts.filter(x=>x!==a),why:'Inventeur : second jeton'}); const t=G.H[a].n; G.H[a].n=G.H[b].n; G.H[b].n=t; log('Deux jetons échangent leur place.'); break; }
    case 'irrigation': case 'mine': { const t=c==='irrigation'?'champ':'montagne', r=TRES[t]; const n=G.H.filter(h=>h.t===t&&h.v.some(v=>G.bv[v]&&G.bv[v].p===pi)).length; gain(pi,r,2*n); log(`${p.name} reçoit ${2*n} ${RNAME[r].toLowerCase()}.`); break; }
    case 'medecine': { const v=await choose(pi,'vertex',{opts:legal(pi,'city'),why:'Médecine : quelle colonie ?'}); await placeCity(pi,v,false,{minerai:2,ble:1}); break; }
    case 'ingenieur': { const v=await choose(pi,'vertex',{opts:legal(pi,'wall'),why:'Ingénieur : rempart gratuit'}); G.bv[v].wall=true; if(!IS_NODE&&!G.fast) await uiPlace('wall',v,pi); break; }
    case 'forgeron': { for(let k=0;k<2;k++){ const opts=knights(pi).filter(v=>canKnightUp(pi,v)); if(!opts.length) break; const v=await choose(pi,'vertex',{opts,why:`Forgeron : promotion ${k+1}/2`}); await upKnight(pi,v,true); } break; }
    case 'routes': await freeRoads(pi,2); break;
    case 'grue': G.flags.grue=true; break;
    case 'marchand': { const h=await choose(pi,'hex',{opts:merchantHexes(pi),why:'Marchand : choisis un hexagone voisin de tes bâtiments'}); G.merchant={p:pi,h,r:TRES[G.H[h].t]}; if(!IS_NODE&&!G.fast) await uiFx('merchant',h); break; }
    case 'flotte': { const r=(await choose(pi,'res',{n:1,pool:G.mods.ck?ALLC:R5,why:'Flotte marchande : 2:1 pour quelle carte ?'}))[0]; G.flags.flotte=r; break; }
    case 'monoRes': { const r=(await choose(pi,'res',{n:1,pool:R5,why:'Monopole : quelle ressource ?'}))[0]; let t=0; for(const o of opp){ const n=Math.min(2,P(o).res[r]); P(o).res[r]-=n; p.res[r]+=n; t+=n; } log(`${p.name} récupère ${t} ${RNAME[r].toLowerCase()}.`); break; }
    case 'monoCom': { const r=(await choose(pi,'res',{n:1,pool:C3,why:'Monopole commercial : quelle marchandise ?'}))[0]; let t=0; for(const o of opp){ if(P(o).res[r]>0){ P(o).res[r]--; p.res[r]++; t++; } } log(`${p.name} récupère ${t} ${RNAME[r].toLowerCase()}.`); break; }
    case 'maitre': { const opts=opp.filter(o=>vp(o,true)>vp(pi,true)&&resCount(P(o))>0); const t=opts.length===1?opts[0]:await choose(pi,'player',{opts,why:'Maître marchand : chez qui ?'}); steal(pi,t); steal(pi,t); break; }
    case 'portMarchand': { for(const o of opp){ const cm=C3.filter(k=>P(o).res[k]>0); if(!cm.length) continue; const k=cm[Math.floor(rand()*cm.length)]; P(o).res[k]--; p.res[k]++; const mine=R5.filter(r=>p.res[r]>0).sort((a,b)=>p.res[b]-p.res[a]); if(mine.length){ p.res[mine[0]]--; P(o).res[mine[0]]++; } } log(`${p.name} négocie au port marchand.`); break; }

    case 'saboteur': { for(const o of opp.filter(o=>vp(o,true)>=vp(pi,true))){ const n=Math.floor(resCount(P(o))/2); if(!n) continue; const d=await choose(o,'discard',{n}); for(const r in d) P(o).res[r]-=d[r]; log(`${P(o).name} perd ${n} cartes.`); } break; }
    case 'deserteur': { const opts=opp.filter(o=>knights(o).length>0); const t=opts.length===1?opts[0]:await choose(pi,'player',{opts,why:'Déserteur : quel adversaire ?'}); const ks=knights(t).sort((a,b)=>G.kn[a].lvl-G.kn[b].lvl); const lv=G.kn[ks[0]].lvl; delete G.kn[ks[0]];
      log(`Un chevalier de ${P(t).name} déserte.`); const spots=legal(pi,'knight'); let L=lv; while(L>1&&knightCount(pi,L)>=2) L--; if(spots.length&&knightCount(pi,L)<2){ const v=await choose(pi,'vertex',{opts:spots,why:'Déserteur : où placer ton nouveau chevalier ?'}); await placeKnight(pi,v,true,L); } updateLongest(); break; }
  }
  return true;
}

/* --------- tour de jeu --------- */
async function runGame(){
  const my=++GEN;
  try{
    if(!IS_NODE&&!G.fast) uiRender();
    if(G.phase==='setup') await setupPhase();
    while(!G.over){
      if(my!==GEN) return;
      await playTurn(G.cur);
      if(my!==GEN||G.over) break;
      if(G.mods.ext56) await specialBuild(G.cur);
      if(G.over) break;
      G.cur=(G.cur+1)%G.players.length;
      if(G.turn>600){ G.over=true; break; }
    }
    if(!IS_NODE&&!G.fast) await uiEnd(); else finalize();
  }catch(e){ if(e!=='abort') throw e; }
}
function finalize(){ if(G.winner<0){ const v=G.players.map((_,i)=>vp(i)); const mx=Math.max(...v); G.winner=v.indexOf(mx);} G.over=true; }
async function setupPhase(){
  const n=G.players.length, seq=[...Array(n).keys()].concat([...Array(n).keys()].reverse());
  for(;G.setupStep<seq.length;G.setupStep++){
    const pi=seq[G.setupStep], second=G.setupStep>=n; G.cur=pi;
    if(!IS_NODE&&!G.fast){ uiSave(); uiRender(); }
    if(!P(pi).ai&&humansCount()>1&&!IS_NODE&&!G.fast) await uiCover(pi);
    const opts=[]; for(let v=0;v<G.V.length;v++) if(canSettleAt(pi,v,true)&&G.V[v].adjE.some(e=>!G.be[e]&&(G.E[e].landAdj||(G.mods.nav&&G.E[e].seaAdj&&!pirateNear(e))))) opts.push(v);
    const v=await choose(pi,'vertex',{opts,why:second&&G.mods.ck?'Place ta cité de départ':'Place une colonie de départ',setup:true,kind:second&&G.mods.ck?'city':'settle'});
    await placeSettle(pi,v,true);
    if(second){ if(G.mods.ck){ G.bv[v].t='c'; if(!IS_NODE&&!G.fast) await uiPlace('city',v,pi); }
      for(const h of G.V[v].hex){ const t=G.H[h].t; if(TRES[t]) gain(pi,TRES[t],1); else if(t==='or') { const r=await choose(pi,'res',{n:1,pool:R5,why:"Champ d'or : choisis 1 ressource"}); gain(pi,r[0],1); } } }
    const eopts=G.V[v].adjE.filter(e=>!G.be[e]&&(G.E[e].landAdj||(G.mods.nav&&G.E[e].seaAdj)));
    const types=[]; eopts.forEach(e=>{ if(G.E[e].landAdj) types.push({e,t:'road'}); if(G.mods.nav&&G.E[e].seaAdj&&!pirateNear(e)) types.push({e,t:'ship'}); });
    if(!types.length) continue;
    const c=await choose(pi,'edge',{opts:[...new Set(types.map(t=>t.e))],types,why:'Ajoute une route'+(G.mods.nav?' ou un navire':'')+' à cette colonie',setup:true});
    const o=types.find(o=>o.e===(c.e??c)&&(!c.t||o.t===c.t))||types[0]; await placeEdge(pi,o.e,o.t,true);
  }
  G.phase='play'; G.cur=0; G.turn=1;
}
function humansCount(){ return G.players.filter(p=>!p.ai).length; }
async function playTurn(pi){
  G.turn++; G.flags={}; G.cur=pi; G.phase='pre';
  const p=P(pi); p.dev.push(...p.devNew); p.devNew=[];
  if(!IS_NODE&&!G.fast){ uiSave(); uiRender(); }
  if(p.ai){ await sleep(G.cfg.speed??600); await aiTurn(pi); }
  else { if(humansCount()>1&&!IS_NODE&&!G.fast) await uiCover(pi); await humanTurn(pi); }
  checkWin(pi);
}
function checkWin(pi){ if(!G.over&&vp(pi)>=G.target){ G.over=true; G.winner=pi; log(`🏆 ${P(pi).name} atteint ${vp(pi)} points et remporte la partie !`); return true; } return false; }
async function specialBuild(after){
  for(let k=1;k<G.players.length;k++){ const pi=(after+k)%G.players.length; G.phase='special'; G.sbp=pi;
    if(P(pi).ai) await aiBuildLoop(pi,false); else if(['road','ship','settle','city','dev','knight','wall'].some(k=>COST[k]&&canPay(pi,COST[k]))||(G.mods.ck&&Object.keys(TRACKS).some(t=>canImpr(pi,t)))) { if(humansCount()>1&&!IS_NODE&&!G.fast) await uiCover(pi,'Phase de construction spéciale'); await humanSpecial(pi); } }
  G.sbp=null;
}

/* --------- actions humaines (validation) --------- */
async function doAction(pi,a){
  const p=P(pi);
  switch(a.a){
    case 'roll': await roll(pi); G.phase='main'; return;
    case 'settle': if(pieceLeft(pi,'settle')&&canPay(pi,COST.settle)&&canSettleAt(pi,a.v,false)) await placeSettle(pi,a.v); return;
    case 'city': if(pieceLeft(pi,'city')&&canPay(pi,COST.city)&&G.bv[a.v]&&G.bv[a.v].p===pi&&G.bv[a.v].t==='s') await placeCity(pi,a.v); return;
    case 'road': if(pieceLeft(pi,'road')&&canPay(pi,COST.road)&&canRoadAt(pi,a.e)) await placeEdge(pi,a.e,'road'); return;
    case 'ship': if(pieceLeft(pi,'ship')&&canPay(pi,COST.ship)&&canShipAt(pi,a.e)) await placeEdge(pi,a.e,'ship'); return;
    case 'moveShip': if(shipMovable(pi).includes(a.from)){ const b=G.be[a.from]; delete G.be[a.from]; if(canShipAt(pi,a.to)&&a.to!==a.from){ G.be[a.to]={p:pi,t:'ship',turn:b.turn}; G.flags.shipMoved=true; log(`${p.name} déplace un navire.`); updateLongest(); if(!IS_NODE&&!G.fast) await uiPlace('ship',a.to,pi); } else G.be[a.from]=b; } return;
    case 'dev': if(G.devDeck.length&&canPay(pi,COST.dev)) await buyDev(pi); return;
    case 'playDev': await playDev(pi,a.c); return;
    case 'bank': bankTrade(pi,a.give,a.get); return;
    case 'ptrade': { const o=P(a.with); for(const k in a.give) if(p.res[k]<a.give[k]) return; for(const k in a.get) if(o.res[k]<a.get[k]) return;
      for(const k in a.give){ p.res[k]-=a.give[k]; o.res[k]+=a.give[k]; } for(const k in a.get){ o.res[k]-=a.get[k]; p.res[k]+=a.get[k]; } log(`${p.name} commerce avec ${o.name}.`); return; }
    case 'knight': if(canPay(pi,COST.knight)&&knightCount(pi,1)<2&&legal(pi,'knight').includes(a.v)) await placeKnight(pi,a.v); return;
    case 'kup': if(canPay(pi,COST.kup)&&canKnightUp(pi,a.v)) await upKnight(pi,a.v); return;
    case 'kact': if(canPay(pi,COST.kact)&&G.kn[a.v]&&G.kn[a.v].p===pi&&!G.kn[a.v].active) await actKnight(pi,a.v); return;
    case 'kmove': if(G.kn[a.v]&&G.kn[a.v].p===pi&&G.kn[a.v].active&&G.kn[a.v].actTurn!==G.turn&&knightMoves(pi,a.v).includes(a.to)) await moveKnight(pi,a.v,a.to); return;
    case 'kchase': if(canChase(pi,a.v)) await chaseRobber(pi,a.v); return;
    case 'wall': if(canPay(pi,COST.wall)&&legal(pi,'wall').includes(a.v)&&Object.values(G.bv).filter(b=>b.p===pi&&b.wall).length<3){ pay(pi,COST.wall); G.bv[a.v].wall=true; log(`${p.name} érige un rempart.`); if(!IS_NODE&&!G.fast) await uiPlace('wall',a.v,pi); } return;
    case 'impr': if(canImpr(pi,a.t)) await improve(pi,a.t); return;
    case 'prog': if(p.prog[a.i]&&progPlayable(pi,p.prog[a.i].k,G.phase==='pre')) await playProg(pi,a.i); return;
  }
}
async function humanTurn(pi){
  while(true){
    const a=await uiTurn(pi,G.phase);
    if(a.a==='end'){ if(G.phase==='pre') continue; return; }
    if(G.phase==='pre'&&!['roll','playDev','prog'].includes(a.a)) continue;
    await doAction(pi,a);
    if(checkWin(pi)) return;
  }
}
async function humanSpecial(pi){
  while(true){ const a=await uiTurn(pi,'special'); if(a.a==='end') return; if(['settle','city','road','ship','dev','knight','kup','kact','wall','impr'].includes(a.a)) await doAction(pi,a); }
}

/* =================== IA =================== */
function prodWeights(pi){ const w={}; R5.forEach(r=>w[r]=0); for(const v in G.bv){ const b=G.bv[v]; if(b.p!==pi) continue; for(const h of G.V[v].hex){ const H=G.H[h]; if(TRES[H.t]&&H.n) w[TRES[H.t]]+=PIPS[H.n]*(b.t==='c'?2:1); } } return w; }
function vertexValue(pi,v){
  const V=G.V[v], w=prodWeights(pi); let s=0; const types=new Set();
  for(const h of V.hex){ const H=G.H[h]; if(!H.n||h===G.robber) continue; const r=TRES[H.t];
    let k=PIPS[H.n]; if(H.t==='or') k*=1.35; else { k*= {bois:1.05,argile:1.05,laine:.9,ble:1.05,minerai:1.08}[r]; if(w[r]<2) k*=1.3; if(!types.has(r)) k*=1.08; types.add(r); }
    if(G.mods.ck&&TCOM[H.t]) k*=1.12; s+=k; }
  if(V.port){ if(V.port==='3') s+=1.5; else s+= (w[V.port]||0)>=4?3:1; }
  if(G.mods.nav){ const isl=V.isl.filter(i=>i>0&&!P(pi).isl.includes(i)); if(isl.length&&G.phase!=='setup') s+=6; }
  return s;
}
function aiChoose(pi,kind,d){
  const p=P(pi), lv=LV[p.level]||LV.normal, noise=()=>rand()*lv.noise;
  switch(kind){
    case 'vertex': {
      if(d.setup) return d.opts.map(v=>({v,s:vertexValue(pi,v)+noise()})).sort((a,b)=>b.s-a.s)[0].v;
      if(/pillent/.test(d.why||'')) return d.opts.map(v=>({v,s:vertexValue(pi,v)})).sort((a,b)=>a.s-b.s)[0].v;
      return d.opts.map(v=>({v,s:vertexValue(pi,v)+(G.robber>=0&&G.H[G.robber].v.includes(v)?3:0)+noise()*.3})).sort((a,b)=>b.s-a.s)[0].v;
    }
    case 'edge': {
      const types=d.types||d.opts.map(e=>({e,t:'road'}));
      const plan=aiTarget(pi); let best=null,bv=-1e9;
      for(const o of types){ let s=noise()*.2; if(plan&&plan.first===o.e&&plan.type===o.t) s+=10;
        const far=G.E[o.e].v.map(v=>spotFree(v)?vertexValue(pi,v):0); s+=Math.max(...far)*.3; if(o.t==='ship') s+= G.mods.nav?.5:-.5; if(s>bv){bv=s;best=o;} }
      return best||types[0];
    }
    case 'hex': {
      if(/Inventeur/.test(d.why)) return d.opts[Math.floor(rand()*d.opts.length)];
      if(/Marchand/.test(d.why)) return d.opts.map(h=>({h,s:prodWeights(pi)[TRES[G.H[h].t]]||0})).sort((a,b)=>b.s-a.s)[0].h;
      const lead=G.players.map((_,i)=>vp(i,true));
      return d.opts.map(h=>{ const H=G.H[h]; let s=noise()*.3;
        if(H.t==='mer'){ for(const e of H.e){ const b=G.be[e]; if(b&&b.t==='ship') s+= b.p===pi?-3:1; } return {h,s:s*.8}; }
        for(const v of H.v){ const b=G.bv[v]; if(!b) continue; const w=(H.n?PIPS[H.n]:0)*(b.t==='c'?2:1); s+= b.p===pi? -w*3 : w*(1+lead[b.p]/10)+(resCount(P(b.p))>0?1:0); }
        return {h,s}; }).sort((a,b)=>b.s-a.s)[0].h;
    }
    case 'player': return d.opts.slice().sort((a,b)=>vp(b,true)-vp(a,true)+ (resCount(P(b))-resCount(P(a)))*.1)[0];
    case 'res': { const need=aiNeeds(pi); const pool=d.pool.slice(); const out=[]; for(let k=0;k<d.n;k++){ pool.sort((a,b)=>(need[b]||0)-(need[a]||0)+rand()*.1); out.push(pool[0]); need[pool[0]]=(need[pool[0]]||0)-1; } return out; }
    case 'discard': { const need=aiNeeds(pi); const r={...p.res}; const out={}; for(let k=0;k<d.n;k++){ const c=ALLC.filter(x=>r[x]>0).sort((a,b)=>(r[b]-(need[b]||0)*1.5)-(r[a]-(need[a]||0)*1.5))[0]; r[c]--; out[c]=(out[c]||0)+1; } return out; }
    case 'deck': { const t=Object.keys(TRACKS).sort((a,b)=>p.impr[b]-p.impr[a])[0]; return G.prog[t].length?t:Object.keys(TRACKS).find(x=>G.prog[x].length)||t; }
    case 'discardProg': return 0;
    case 'dice': { let best=[1,1],bv=-1; for(let a=1;a<=6;a++) for(let b=1;b<=6;b++){ const s=a+b; if(s===7) continue; let v=0; G.H.forEach((h,hi)=>{ if(h.n!==s||hi===G.robber) return; h.v.forEach(x=>{ const bb=G.bv[x]; if(bb) v+= (bb.p===pi?1:-.4)*(bb.t==='c'?2:1); }); }); if(v>bv){bv=v;best=[a,b];} } return best; }
  }
}
function aiNeeds(pi){ // besoin pondéré par ressource selon les objectifs
  const p=P(pi), need={}; ALLC.forEach(k=>need[k]=0);
  const add=(c,w)=>{ for(const k in c) need[k]+=Math.max(0,c[k]-p.res[k])*w+c[k]*.2*w; };
  if(legal(pi,'city').length&&pieceLeft(pi,'city')) add(COST.city,1.3);
  add(COST.settle,1.1); add(G.mods.nav?COST.ship:COST.road,.6);
  if(!G.mods.ck) add(COST.dev,.5); else { add(COST.knight,.5); for(const t in TRACKS){ const c={}; c[TRACKS[t]]=p.impr[t]+1; add(c,.6); } }
  return need;
}
function aiTarget(pi){ // meilleur emplacement de colonie atteignable
  const start=[]; for(let v=0;v<G.V.length;v++){ const b=G.bv[v]; if(b&&b.p===pi) { start.push({v,mode:'any'}); continue; } if(blockedFor(pi,v)) continue;
    if(V_roadEnd(pi,v,'road')) start.push({v,mode:'road'}); if(V_roadEnd(pi,v,'ship')) start.push({v,mode:'ship'}); }
  const seen=new Map(), q=[]; for(const s of start){ seen.set(s.v+s.mode,1); q.push({v:s.v,mode:s.mode,d:0,first:null,type:null}); }
  let best=null,bv=-1;
  while(q.length){ const c=q.shift();
    if(c.d>0&&spotFree(c.v)){ const s=vertexValue(pi,c.v)/(1+c.d*.55); if(s>bv){bv=s;best=c;} }
    if(c.d>=(G.mods.nav?7:4)) continue;
    for(const e of G.V[c.v].adjE){ if(G.be[e]) continue; const w=G.E[e].v[0]===c.v?G.E[e].v[1]:G.E[e].v[0]; if(blockedFor(pi,w)) continue;
      const modes=[]; if(G.E[e].landAdj&&c.mode!=='ship') modes.push('road'); if(G.mods.nav&&G.E[e].seaAdj&&c.mode!=='road'&&!pirateNear(e)&&(G.V[w].hex.length>=2)) modes.push('ship');
      for(const m of modes){ const key=w+m; if(seen.has(key)) continue; seen.set(key,1); q.push({v:w,mode:m,d:c.d+1,first:c.first??e,type:c.type??m}); } } }
  return best?{v:best.v,first:best.first,type:best.type,d:best.d,val:bv}:null;
}
function aiOptions(pi,allowDev){
  const p=P(pi), out=[], lv=LV[p.level]||LV.normal, noise=()=>rand()*lv.noise;
  const cityV=legal(pi,'city'); if(cityV.length&&pieceLeft(pi,'city')) { const v=cityV.map(v=>({v,s:vertexValue(pi,v)})).sort((a,b)=>b.s-a.s)[0]; out.push({a:'city',v:v.v,cost:COST.city,s:100+v.s+noise()}); }
  const setV=legal(pi,'settle'); if(setV.length&&pieceLeft(pi,'settle')){ const v=setV.map(v=>({v,s:vertexValue(pi,v)})).sort((a,b)=>b.s-a.s)[0]; out.push({a:'settle',v:v.v,cost:COST.settle,s:95+v.s+noise()}); }
  else { const t=aiTarget(pi); if(t&&t.first!=null){ const type=t.type; if(pieceLeft(pi,type)) out.push({a:type,e:t.first,cost:COST[type],s:55+t.val*1.5-t.d*3+noise()}); } }
  // route la plus longue
  if(G.longLen&&!setV.length){ const my=G.longLen[pi]||0, best=Math.max(...G.longLen); if(my>=3&&my+2>=best&&G.longest!==pi){ const opts=legal(pi,'road'); if(opts.length&&pieceLeft(pi,'road')) out.push({a:'road',e:opts[Math.floor(rand()*opts.length)],cost:COST.road,s:45+noise()}); } }
  if(!G.mods.ck&&allowDev&&G.devDeck.length) out.push({a:'dev',cost:COST.dev,s:42+(cityV.length?0:6)+noise()});
  if(G.mods.ck){
    const nc=Object.values(G.bv).filter(b=>b.p===pi&&b.t==='c').length;
    if(nc) for(const t in TRACKS){ const L=p.impr[t]; if(L<5) out.push({a:'impr',t,cost:imprCost(pi,t),s:62+L*4+(L===3?8:0)+(t==='science'&&L<3?4:0)+noise()}); }
    const danger=G.barb>=4, my=strength(pi), cities=cityCount(), totalDef=G.players.reduce((s,_,i)=>s+strength(i),0);
    const kspots=legal(pi,'knight'); if(kspots.length&&knightCount(pi,1)<2&&(danger||rand()<.25)) out.push({a:'knight',v:kspots.map(v=>({v,s:(G.robber>=0&&G.H[G.robber].v.includes(v)?4:0)+G.V[v].adjV.filter(w=>G.bv[w]&&G.bv[w].p===pi).length+rand()})).sort((a,b)=>b.s-a.s)[0].v,cost:COST.knight,s:(danger&&totalDef<cities?82:40)+noise()});
    for(const v of knights(pi)){ const k=G.kn[v]; if(!k.active) out.push({a:'kact',v,cost:COST.kact,s:(G.barb>=5?85:G.barb>=3?50:15)+k.lvl*2+noise()}); if(canKnightUp(pi,v)) out.push({a:'kup',v,cost:COST.kup,s:(danger?55:30)+noise()}); if(canChase(pi,v)&&G.H[G.robber].v.some(x=>G.bv[x]&&G.bv[x].p===pi)) out.push({a:'kchase',v,cost:{},s:70}); }
    const walls=legal(pi,'wall'); if(walls.length&&resCount(p)>=7&&Object.values(G.bv).filter(b=>b.p===pi&&b.wall).length<3) out.push({a:'wall',v:walls[0],cost:COST.wall,s:35+noise()});
  }
  return out.sort((a,b)=>b.s-a.s);

async function aiTradeFor(pi,cost){

      case 'medecine': case 'ingenieur': case 'forgeron': case 'marchand': case 'maitre': case 'espion': case 'mariage': case 'eveque': case 'monoCom': case 'portMarchand': case 'deserteur': case 'intrigue': ok=true; break;
      case 'routes': ok=!legal(pi,'settle').length; break; case 'grue': ok=Object.keys(TRACKS).some(t=>{const c2={};c2[TRACKS[t]]=Math.max(0,p.impr[t]);return p.impr[t]<5&&canPay(pi,c2);}); break;

function aiAcceptTrade(ai,from,give,get){ // give: ce que l'IA reçoit ; get: ce que l'IA donne

function currentTargets(){

  const w=UI.wait; if(!w||!UI.mode) return null; const pi=w.pi, m=UI.mode;
  if(m==='road') return {kind:'edge',opts:legal(pi,'road'),col:pi};
  if(m==='ship') return {kind:'edge',opts:legal(pi,'ship'),col:pi};
  if(m==='settle') return {kind:'vertex',opts:legal(pi,'settle'),col:pi};
  if(m==='city') return {kind:'vertex',opts:legal(pi,'city'),col:pi};
  if(m==='knight') return {kind:'vertex',opts:legal(pi,'knight'),col:pi};
  if(m==='kup') return {kind:'vertex',opts:knights(pi).filter(v=>canKnightUp(pi,v)),col:pi};
  if(m==='kact') return {kind:'vertex',opts:knights(pi).filter(v=>!G.kn[v].active),col:pi};
  if(m==='kmove') return UI.sel==null?{kind:'vertex',opts:knights(pi).filter(v=>G.kn[v].active&&G.kn[v].actTurn!==G.turn&&knightMoves(pi,v).length),col:pi}:{kind:'vertex',opts:knightMoves(pi,UI.sel),col:pi};
  if(m==='kchase') return {kind:'vertex',opts:knights(pi).filter(v=>canChase(pi,v)),col:pi};
  if(m==='wall') return {kind:'vertex',opts:legal(pi,'wall'),col:pi};

async function pickTarget(x){

    UI.ask=null; hidePrompt(); renderMarks(); a.resolve(x); return; }
  const w=UI.wait; if(!w) return; const m=UI.mode;
  if(m==='kmove'&&UI.sel==null){ UI.sel=x; renderMarks(); showPrompt('Où déplacer ce chevalier ?',true); return; }
  if(m==='moveShip'&&UI.sel==null){ UI.sel=x; renderMarks(); showPrompt('Choisis la nouvelle position du navire',true); return; }
  let act;
  if(m==='kmove') act={a:'kmove',v:UI.sel,to:x}; else if(m==='moveShip') act={a:'moveShip',from:UI.sel,to:x};
