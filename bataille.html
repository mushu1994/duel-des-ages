 H.panelHTML=(g)=>{ if(H.ok===false) return `<p class="hall-note">Le salon en ligne n’est pas joignable d’ici.${/github\.io$/.test(location.hostname)?' Vérifie ta connexion.':` Ouvre la salle sur <a href="${SITE}" target="_blank" rel="noopener">le site</a>.`}</p>`;

addEventListener('load',()=>setTimeout(()=>{ if(!window.NETGAME) HALL.where('',''); HALL.connect(); },0));

/* ===== Salle en ligne : tables (Supabase Realtime, l'hôte fait tourner la partie), sur le hall commun =====
   Le jeu déclare window.NETGAME = { id, title, min, max, rules():html, rulesClick(e):bool,
     start(list), state():G, receive(msg):Promise, act(seat,fn,args):bool, busy():bool, resume(), leave() } */
const NET=(()=>{
 const $q=s=>document.querySelector(s), es=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const nt=s=>HALL.note(s), snd=n=>{ try{ if(typeof sfx==='function') snd(n); }catch(e){} }, sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const ld=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, svs=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
 let BOXCB=null; const box=(h,locked)=>{ BOXCB=null; HALL.openBox(h,e=>{ if(e.target.closest('[data-hl=close]')){ HALL.closeBox(); return; } (BOXCB||onClick)(e); },locked); };
 const PL=G=>G?(G.players||G.P||[]):[];
 const gameClose=()=>{ try{ if(typeof closeModal==='function') closeModal(true); }catch(e){} };
 const SITE='https://mushu1994.github.io/duel-des-ages/';
 const LET='ABCDEFGHJKLMNPQRSTUVWXYZ';
 const BOTS=['Ada','Hal','Pixel','Nova','Atlas','Écho','Zéphyr','Orbit','Volt','Lumen','Quartz','Sirius'];
 const N={on:false,host:false,guest:false,started:false,code:null,name:'',seat:null,peers:{},v:0,hs:null,lastV:-1,lastHs:null,q:[],aq:[],ai:{n:0,level:'normal'},ui:null,known:new Set(),waitHost:false,open:(()=>{ try{ return localStorage.getItem('net-open')!=='false'; }catch(e){ return true; } })(),invited:new Set()};
 N.cid=HALL.cid;
 let client=null, ch=null;
 const NG=()=>window.NETGAME;

 const link=()=>{ const base=/github\.io$/.test(location.hostname)?location.origin+location.pathname:SITE+NG().id+'.html'; return base+'?salle='+N.code; };
 const sess=()=>ld('net-sess'), setSess=v=>svs('net-sess',v);
 const isGh=()=>/github\.io$/.test(location.hostname);
 /* ---------- connexion à une table ---------- */
 async function connect(code,asHost){ client=await HALL.client();
   if(ch){ try{ await client.removeChannel(ch); }catch(e){} ch=null; }
   N.code=code; N.host=asHost; N.guest=!asHost; N.on=true; N.peers={}; N.known=new Set(); N.hs=Math.random().toString(36).slice(2,8); N.name=HALL.pseudo;
   ch=client.channel('salle:'+NG().id+':'+code,{config:{broadcast:{self:false},presence:{key:N.cid}}});
   ch.on('broadcast',{event:'st'},({payload})=>{ if(N.guest) enqueue(payload); });

   ch.on('broadcast',{event:'hello'},()=>{ if(N.host){ if(N.started) pushFull(); else pushLobby(); } });
   ch.on('broadcast',{event:'lobby'},({payload})=>{ if(N.guest&&!N.started){ N.lobby=payload; if(N.ui==='lobby') lobbyUI(); } });
   ch.on('broadcast',{event:'close'},()=>{ if(N.guest){ nt('L’hôte a fermé la table'); leave(true); } });
   ch.on('presence',{event:'sync'},onSync);
   return new Promise((res,rej)=>{ let done=false; const to=setTimeout(()=>{ if(!done){ done=true; rej(new Error('timeout')); } },9000);
     ch.subscribe(async st=>{ if(st==='SUBSCRIBED'){ await ch.track({name:N.name,host:asHost,at:Date.now()}); if(!done){ done=true; clearTimeout(to); res(); } if(N.guest) send('hello',{}); }
       else if((st==='CHANNEL_ERROR'||st==='TIMED_OUT')&&!done){ done=true; clearTimeout(to); rej(new Error(st)); } }); }); }

 function onSync(){ const st=ch.presenceState(); const peers={}; for(const k in st){ const m=st[k][st[k].length-1]; peers[k]=m; } const before=N.peers; N.peers=peers;
   const names=k=>(peers[k]||before[k]||{}).name||'Un joueur';
   for(const k in peers) if(!before[k]&&k!==N.cid){ if(N.known.has(k)) nt(`${names(k)} est de retour`); else if(N.host&&!N.started){ nt(`${names(k)} rejoint la table`); snd('pop'); } }
   for(const k in before) if(!peers[k]&&k!==N.cid) nt(`${names(k)} a quitté la table`);
   Object.keys(peers).forEach(k=>N.known.add(k));
   if(N.guest){ const hostHere=Object.values(peers).some(m=>m.host); N.waitHost=!hostHere&&N.started; }
   if(N.host){ if(N.started){ const G=NG().state(); let ch2=false; if(G) PL(G).forEach(P=>{ if(P.cid&&P.away&&peers[P.cid]){ P.ai=false; P.away=false; ch2=true; } }); if(ch2) NG().resume(); pushFull(); } else pushLobby(); }

 function pushLobby(){ if(!N.host||N.started) return; send('lobby',{order:lobbyOrder().map(k=>({cid:k,name:N.peers[k].name})),ai:N.ai}); }

 let pushT=null;
 function push(ev,kind){ if(!N.host||!N.started) return; if(!ev&&!kind){ if(!pushT) pushT=setTimeout(()=>{ pushT=null; pushNow(null,null); },40); return; } if(pushT){ clearTimeout(pushT); pushT=null; } pushNow(ev,kind); }
 function pushNow(ev,kind){ if(!N.host||!N.started) return; N.v++; const G=NG().state(); if(!G) return; const p={hs:N.hs,v:N.v,G,ev:ev||null,kind:kind||null}; N.last=p; send('st',p); }

 function drain(){ if(!N.host||!N.started) return; while(N.aq.length&&!NG().busy()){ const m=N.aq.shift(); const G=NG().state(); const seat=G?PL(G).findIndex(P=>P.cid===m.cid):-1; if(seat<0||PL(G)[seat].ai) continue; NG().act(seat,m.fn,m.args||[]); } }
 /* ---------- invité ---------- */
 function enqueue(p){ if(p.hs!==N.lastHs){ N.lastHs=p.hs; N.lastV=-1; } if(p.v<=N.lastV) return; N.lastV=p.v; N.q.push(p); pump(); }
 async function pump(){ if(N.pumping) return; N.pumping=true;
   while(N.q.length){ let p=N.q.shift(); if(p.kind==='full'||!p.ev){ while(N.q.length&&(N.q[0].kind==='full'||!N.q[0].ev)&&N.q[0].kind!=='lobby'&&N.q[0].kind!=='new') p=N.q.shift(); }
     if(p.kind==='lobby'||!p.G){ N.started=false; N.seat=null; try{ NG().receive({kind:'lobby'}); }catch(e){} hallRoom(); lobbyUI(); continue; }
     const first=!N.started; N.started=true; N.waitHost=false; const s=PL(p.G).findIndex(P=>P.cid===N.cid); N.seat=s>=0?s:null;
     if(first){ HALL.closeBox(); gameClose(); N.ui=null; hallRoom(); if(N.seat==null) nt('Partie déjà commencée : tu regardes'); }
     try{ await NG().receive(Object.assign({},p,{kind:first&&p.kind!=='new'?'new':p.kind})); }catch(e){ console.error(e); } badge(); }
   N.pumping=false; }
 function act(fn,args){ if(!N.guest) return false; if(N.waitHost){ nt('En attente de l’hôte…'); return true; } send('act',{cid:N.cid,fn,args}); snd('click'); return true; }
 /* ---------- interface ---------- */
 function badge(){ const b=$q('#netBtn'); if(!b) return; if(!N.on){ const n=HALL.ok?HALL.count():0; b.innerHTML=`<i class="net-dot ${HALL.ok?'':'off'}"></i>En ligne${n?` · ${n}`:''}`; b.classList.remove('net-on'); return; }
   const n=Object.keys(N.peers).length; b.innerHTML=`<i class="net-dot ${N.waitHost?'off':''}"></i>Table ${N.code} · ${n}`; b.classList.add('net-on'); }
 N.hallChanged=()=>{ badge(); const vis=$q('#hall-modal')&&!$q('#hall-modal').hidden&&$q('#hall-box [data-net]')&&!$q('#hallPseudo'); if(!vis) return; if(N.ui==='start') startUI(); else if(N.ui==='lobby'&&N.host) lobbyUI(); };
 function startUI(prefill){ N.ui='start'; const g=NG(); const tabs=HALL.ok?HALL.tables(g.id):[];
   const off=HALL.ok===false;
   box(`<h2>Jouer en ligne</h2>

const SUITS=['♠','♥','♦','♣'], RN={11:'V',12:'D',13:'R',14:'A'};
let B=null, AUTO=false, BUSY=false, READY=[false,false], GEN=0;
const NETON=()=>B&&B.cfg.mode==='net';
const V=i=>NETON()&&NET.seat===1?1-i:i;
function sv(v){ if(!NET.guest) store('bat-save',v===undefined?B:v); if(NETON()){ B.ready=READY.slice(); NET.push(); } }
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function deck(n){ const d=[]; const lo=n===32?7:2; for(let s=0;s<4;s++) for(let r=lo;r<=14;r++) d.push({s,r}); for(let i=d.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [d[i],d[j]]=[d[j],d[i]]; } return d; }
function newGame(cfg){ GEN++; const d=deck(cfg.n); B={cfg,p:[d.filter((_,i)=>i%2===0),d.filter((_,i)=>i%2===1)],rounds:0,wars:0,over:null}; READY=[false,false]; AUTO=false; store('bat-save',B); clearMid(); render(); }
const rl=r=>RN[r]||String(r);
function cardEl(c,up){ const d=document.createElement('div'); d.className='cd '+(c&&(c.s===1||c.s===2)?'red':'blk')+(up?' up':''); if(c){ const face=c.r>=11&&c.r<=13; d.innerHTML=`<div class="bk"></div><div class="fc"><div class="ix">${rl(c.r)}<small>${SUITS[c.s]}</small></div><div class="ix b">${rl(c.r)}<small>${SUITS[c.s]}</small></div><div class="big ${face?'face':''}">${face?`<span>${rl(c.r)}${SUITS[c.s]}</span>`:c.r===14?`<b style="font-size:1.4em">${SUITS[c.s]}</b>`:SUITS[c.s]}</div></div>`; } else d.innerHTML='<div class="bk"></div>'; return d; }
function render(){
  for(const i of [0,1]){ const pile=$('#pile'+V(i)); pile.innerHTML=''; const n=B.p[i].length; for(let k=0;k<Math.min(5,Math.ceil(n/8));k++){ const c=cardEl(null); c.style.transform=`translate(${-k*2}px,${-k*2}px)`; pile.appendChild(c); }
    pile.insertAdjacentHTML('beforeend',`<span class="cnt">${n}</span>`); pile.classList.toggle('can',!B.over&&!BUSY&&isHuman(i)&&!READY[i]&&!AUTO&&(!NETON()||NET.seat===i));
    $('#name'+V(i)).innerHTML=`${esc(B.cfg.names[i])}<small>${n} carte${n>1?'s':''}</small>`; }
  $('#topSide').classList.toggle('ff',B.cfg.mode==='2p'&&B.cfg.ff);
  const st=$('#status'); st.style.setProperty('--pc',B.over?'#7a1a1a':'#8a5a10');
  st.innerHTML=B.over?`<span class="who">${esc(B.over)}</span>`:`<span class="who">Manche ${B.rounds+1}</span><span class="msg">${NETON()?(READY[NET.seat]?'En attente de '+esc(B.cfg.names[1-NET.seat])+'…':'Touche ton paquet pour retourner une carte.'):AUTO?'Jeu automatique…':B.cfg.mode==='ia'?'Touche ton paquet pour retourner une carte.':'Chacun touche son paquet.'}</span>`;
  $('#stats').textContent=`${B.rounds} manches · ${B.wars} batailles`; $('#autoBtn').textContent=AUTO?'Arrêter':'Jeu automatique';
}
const isHuman=i=>NETON()?!B.players[i].ai:B.cfg.mode==='2p'||i===0;
function clearMid(){ $('#m0').innerHTML=''; $('#m1').innerHTML=''; }
async function flipTo(i,c,up,off){ const m=$('#m'+V(i)), pile=$('#pile'+V(i)); const el=cardEl(c,false); m.appendChild(el);
  const a=pile.getBoundingClientRect(), b=m.getBoundingClientRect(); const dx=a.left-b.left, dy=a.top-b.top;
  el.style.zIndex=10+m.children.length; const fin=`translate(${off*14}px,${off*6}px) ${up?'rotateY(180deg)':''}`;
  sfx('card'); if(!REDUCED){ await el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:fin}],{duration:AUTO?220:420,easing:'cubic-bezier(.3,.9,.4,1)',fill:'forwards'}).finished; } el.style.transform=fin; if(up) el.classList.add('up'); return el; }
async function round(seed){
  if(B.over||BUSY) return; if(seed==null) seed=Math.floor(Math.random()*1e9); if(NETON()&&NET.host){ B.ready=[false,false]; NET.push([{t:'round',seed}]); } const R0=rng(seed);
  BUSY=true; READY=[false,false]; render(); const my=GEN;
  const pot=[]; let off=0, els=[[],[]];
  const play=async(up)=>{ for(const i of [0,1]){ const c=B.p[i].shift(); pot.push(c); els[i].push(await Promise.resolve(flipTo(i,c,up,off))); } off++; };
  await Promise.all([0,1].map(async i=>{ const c=B.p[i].shift(); pot.push(c); els[i].push(await flipTo(i,c,true,off)); })); off++;
  if(my!==GEN) return;
  let a=pot[pot.length-2], b=pot[pot.length-1]; // a = joueur 0, b = joueur 1 (ordre de push)
  const last=()=>[els[0][els[0].length-1], els[1][els[1].length-1]];
  let w;
  while(true){
    const c0=pot[pot.length-2], c1=pot[pot.length-1];
    if(c0.r!==c1.r){ w=c0.r>c1.r?0:1; break; }
    B.wars++; sfx('capture'); const wb=document.createElement('div'); wb.className='warbadge'; wb.textContent='Bataille !'; $('.mid').appendChild(wb); setTimeout(()=>wb.remove(),1200);
    await wait(AUTO?500:1000); if(my!==GEN) return;
    if(B.p[0].length<2||B.p[1].length<2){ w=B.p[0].length>=B.p[1].length?0:1; if(B.p[0].length<2&&B.p[1].length<2) w=B.p[0].length>=B.p[1].length?0:1; break; }
    await Promise.all([0,1].map(async i=>{ const c=B.p[i].shift(); pot.push(c); els[i].push(await flipTo(i,c,false,off)); })); off++;
    await wait(AUTO?150:350);
    const hold=[]; await Promise.all([0,1].map(async i=>{ const c=B.p[i].shift(); hold[i]=c; els[i].push(await flipTo(i,c,true,off)); })); pot.push(hold[0],hold[1]); off++;
  }
  last()[w].classList.add('win'); sfx(w===0&&B.cfg.mode==='ia'?'ding':'pop');
  await wait(AUTO?350:850); if(my!==GEN) return;
  // ramasser
  const pile=$('#pile'+V(w)).getBoundingClientRect();
  await Promise.all($$('.mid .cd').map(el=>{ const r=el.getBoundingClientRect(); return REDUCED?null:el.animate([{transform:el.style.transform},{transform:`translate(${pile.left-r.left}px,${pile.top-r.top}px) rotateY(0deg) scale(.9)`,opacity:.6}],{duration:AUTO?220:380,easing:'ease-in',fill:'forwards'}).finished; }));
  clearMid();
  B.p[w].push(...pot.sort(()=>R0()-.5)); B.rounds++;
  if(!B.p[0].length||!B.p[1].length||(B.cfg.limit&&B.rounds>=B.cfg.limit)){ const win=B.p[0].length===B.p[1].length?-1:(B.p[0].length>B.p[1].length?0:1);
    B.over=win<0?'Égalité !':`${B.cfg.names[win]} gagne la partie !`; AUTO=false; sv(null); BUSY=false; render();
    if(NETON()){ const me=win===NET.seat; banner(win<0?'Égalité':me?'Victoire !':'Défaite…',win<0?'':B.cfg.names[win],me?'#2f8a4a':'#5a1a1a'); sfx(me?'win':'lose'); if(me) confetti(); return; }
    banner(win<0?'Égalité':(B.cfg.mode==='ia'?(win===0?'Victoire !':'Défaite…'):'Victoire !'),win<0?'':B.cfg.names[win],win===1&&B.cfg.mode==='ia'?'#5a1a1a':'#2f8a4a'); sfx(win===0||B.cfg.mode==='2p'?'win':'lose'); if(win===0||(B.cfg.mode==='2p'&&win>=0)) confetti(); return; }
  sv(); BUSY=false; render(); if(NETON()) netNext();
  if(AUTO){ await wait(B.cfg.speed||250); if(AUTO&&my===GEN) round(); }
}
for(const k of [0,1]) $('#pile'+k).addEventListener('click',()=>{ const i=V(k); if(!B||B.over||BUSY||AUTO||!isHuman(i)) return; if(NETON()){ if(NET.seat!==i||READY[i]) return; sfx('click'); if(NET.guest){ READY[i]=true; render(); NET.act('ready',[i]); return; } READY[i]=true; render(); netNext(); return; } READY[i]=true; if(B.cfg.mode==='ia') READY[1]=true; sfx('click'); render(); if(READY[0]&&READY[1]) round(); });
document.addEventListener('click',e=>{ if(e.target.closest('[data-a="auto"]')&&NETON()){ toast('Pas de jeu automatique en ligne'); return; } if(e.target.closest('[data-a="auto"]')&&B&&!B.over){ AUTO=!AUTO; render(); if(AUTO&&!BUSY) round(); } });
document.addEventListener('keydown',e=>{ if(e.key===' '&&B&&!B.over&&!AUTO){ e.preventDefault(); if(NETON()){ $('#pile0').click(); return; } $('#pile0').click(); if(B.cfg.mode==='2p') $('#pile1').click(); } });
let M={mode:'ia',n:52,limit:0,names:['Toi','Lucas'],ff:false};
function menu(){ const s=load('bat-save');
  const draw=()=>paintModal(`<h2>Nouvelle partie</h2>${s&&!s.over?'<div class="prow"><button class="btn pri" data-m="resume">Reprendre la partie en cours</button></div>':''}
   <h4>Adversaire</h4><div class="seg"><button class="${M.mode==='ia'?'on':''}" data-m="mode:ia">Contre l'ordinateur</button><button class="${M.mode==='2p'?'on':''}" data-m="mode:2p">À deux sur cet écran</button></div>
   ${M.mode==='2p'?`<div class="prow"><input type="text" id="n0" value="${esc(M.names[0])}" placeholder="Camille" maxlength="14"> contre <input type="text" id="n1" value="${esc(M.names[1])}" placeholder="Lucas" maxlength="14"></div><div class="seg"><button class="${!M.ff?'on':''}" data-m="ff:0">Côte à côte</button><button class="${M.ff?'on':''}" data-m="ff:1">Face à face (tablette posée)</button></div>`:''}
   <h4>Jeu de cartes</h4><div class="seg"><button class="${M.n===52?'on':''}" data-m="n:52">52 cartes</button><button class="${M.n===32?'on':''}" data-m="n:32">32 cartes (partie plus courte)</button></div>
   <h4>Durée</h4><div class="seg"><button class="${!M.limit?'on':''}" data-m="limit:0">Jusqu'au bout</button><button class="${M.limit===100?'on':''}" data-m="limit:100">100 manches max</button><button class="${M.limit===50?'on':''}" data-m="limit:50">50 manches max</button></div>
   <div class="acts">${B?'<button class="btn" data-c="close">Annuler</button>':''}<button class="btn pri" data-m="start">Distribuer</button></div>`);
  draw(); $('#mbox').onclick=e=>{ const x=e.target.closest('[data-m]'); if(!x) return; if($('#n0')) M.names=[$('#n0').value,$('#n1').value]; const [k,v]=x.dataset.m.split(':');
    if(k==='resume'){ closeModal(); GEN++; B=s; clearMid(); render(); return; }
    if(k==='start'){ closeModal(); store('bat-prefs',M); const names=M.mode==='ia'?['Toi','Ordinateur']:[M.names[0].trim()||'Camille',M.names[1].trim()||'Lucas']; newGame({mode:M.mode,n:M.n,limit:M.limit,names,ff:M.ff}); return; }
    M[k]=k==='mode'?v:k==='ff'?v==='1':+v; draw(); }; }
function help(){ helpTabs("La Bataille",[["But du jeu","<p>Récupérer <b>toutes</b> les cartes. Les cartes sont partagées en deux paquets, faces cachées.</p><p>Ordre des cartes, de la plus forte à la plus faible : As, Roi, Dame, Valet, 10, 9 … 2. Les couleurs ne comptent pas.</p>"],["Déroulement","<ol><li>Chacun retourne la carte du dessus de son paquet.</li><li>La plus forte remporte les deux cartes, qui vont sous le paquet du gagnant.</li><li><b>Égalité : bataille !</b> Chacun pose une carte face cachée puis une face visible. La plus forte rafle tout le tas. Nouvelle égalité : on recommence.</li></ol><p>Un joueur qui n’a plus assez de cartes pour finir une bataille perd la partie.</p><h4>Options du menu</h4><ul><li><b>52 cartes</b> ou <b>32 cartes</b> (du 7 à l’As, partie plus courte).</li><li><b>Durée</b> : jusqu’au bout, ou arrêt après 100 ou 50 manches (celui qui a le plus de cartes gagne).</li><li>À deux : <b>côte à côte</b> ou <b>face à face</b> (tablette posée entre vous).</li></ul>"],["Jouer ici","<ul><li>Touche ton paquet (ou la barre d’espace) pour retourner ta carte.</li><li><b>Jeu automatique</b> enchaîne les manches tout seul.</li><li>La partie est sauvegardée : « Reprendre la partie en cours » dans le menu.</li></ul>"]]); }
function netNext(){ if(!NETON()||NET.guest||B.over||BUSY) return; B.players.forEach((P,i)=>{ if(P.ai) READY[i]=true; }); if(READY[0]&&READY[1]) round(); else { sv(); NET.drain(); } }
window.BAT={get B(){return B;},get BUSY(){return BUSY;},get READY(){return READY;}};
window.NETGAME={id:'bataille',title:'La Bataille',min:2,max:2,
  rules(){ return `<h4>Jeu de cartes</h4><div class="seg"><button class="${M.n===52?'on':''}" data-m="n:52">52 cartes</button><button class="${M.n===32?'on':''}" data-m="n:32">32 cartes</button></div> <div class="seg"><button class="${!M.limit?'on':''}" data-m="limit:0">Jusqu'au bout</button><button class="${M.limit===100?'on':''}" data-m="limit:100">100 manches max</button><button class="${M.limit===50?'on':''}" data-m="limit:50">50 manches max</button></div>`; },
  rulesClick(e){ const x=e.target.closest('[data-m^="n:"],[data-m^="limit:"]'); if(!x) return false; const [k,v]=x.dataset.m.split(':'); M[k]=+v; store('bat-prefs',M); return true; },
  start(list){ GEN++; const d=deck(M.n); B={cfg:{mode:'net',n:M.n,limit:M.limit,names:list.map(x=>x.name)},players:list.map(x=>({name:x.name,cid:x.cid||null,ai:!!x.ai,level:x.level||'normal'})),p:[d.filter((_,i)=>i%2===0),d.filter((_,i)=>i%2===1)],rounds:0,wars:0,over:null,net:true,ready:[false,false]}; READY=[false,false]; AUTO=false; BUSY=false; clearMid(); render(); sv(); NET.push(null,'new'); },
  state:()=>B, busy:()=>BUSY, resume(){ READY=B.ready||[false,false]; render(); netNext(); },
  act(seat,fn,args){ if(fn!=='ready'||!B||B.over||BUSY||args[0]!==seat||READY[seat]) return false; READY[seat]=true; render(); netNext(); return true; },
  async receive(m){ if(m.kind==='lobby'){ GEN++; return; }
    if(m.kind==='new'){ GEN++; B=m.G; READY=(B.ready||[false,false]).slice(); BUSY=false; clearMid(); render(); banner('La Bataille','Touchez vos paquets !','#8a5a10'); return; }
    if(m.ev&&m.ev[0]&&m.ev[0].t==='round'){ B=m.G; READY=[false,false]; BUSY=false; await round(m.ev[0].seed); return; }
    if(!BUSY){ B=m.G; READY=(B.ready||[false,false]).slice(); render(); } },
  leave(){ GEN++; window.GAME.menu(); } };
(function boot(){ const p=load('bat-prefs'); if(p) Object.assign(M,p); const s=load('bat-save'); if(s&&!s.over){ B=s; READY=(B.ready||[false,false]).slice(); render(); } else { newGame({mode:'ia',n:M.n,limit:M.limit,names:['Toi','Ordinateur']}); menu(); } })();
