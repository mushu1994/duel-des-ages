<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Bataille</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
:root{--fg:#fff7ea;--accent:#c4322f;--title:"Abril Fatface",Georgia,serif;--ui:"Nunito Sans",system-ui,sans-serif;--titlec:#ffe7b0;--cw:min(120px,22vw);--ch:calc(var(--cw)*1.4)}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui,"Nunito Sans",system-ui,sans-serif);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar,#0006);border-bottom:1px solid #fff2;flex-wrap:wrap}
.top h1{font-family:var(--title,Georgia,serif);font-weight:800;font-size:24px;margin:0;color:var(--titlec,#fff);letter-spacing:.5px}
.top h1 small{font-family:var(--ui);font-weight:600;font-size:13px;opacity:.75;margin-left:8px;letter-spacing:0}
.back{color:inherit;opacity:.9;text-decoration:none;font-size:14px;border:1px solid #fff4;padding:5px 10px;border-radius:8px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#ffffff1c;color:inherit;border:1px solid #ffffff40;border-radius:9px;padding:7px 12px;font-size:14px;font-weight:700}
.btn:hover{background:#ffffff2e}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:#fff;color:#222}
.status{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--pc,var(--accent));color:#fff;font-weight:800;min-height:44px;box-shadow:0 4px 14px #0005;transition:background .35s;flex-wrap:wrap}
.status .who{font-family:var(--title,Georgia,serif);font-size:19px}
.status .msg{font-weight:600}
.status .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
#modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:12px}
#modal[hidden]{display:none}
.mbox{background:#fbf6ea;color:#2a2418;border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox h2{font-family:var(--title,Georgia,serif);font-size:26px;margin:0 0 6px}
.mbox h4{font-family:var(--title,Georgia,serif);font-size:16px;margin:14px 0 6px}
.mbox p,.mbox li{line-height:1.5}
.mbox .btn{background:#ece3cf;color:#2a2418;border-color:#c9b98f}
.mbox .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.mbox .btn.on{background:#2a2418;color:#fff}
.seg{display:inline-flex;border:1px solid #c9b98f;border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#f6efdc;padding:7px 11px;font-weight:700;color:#2a2418;font-size:13.5px}
.seg button.on{background:#2a2418;color:#fff}
.prow{display:flex;gap:8px;align-items:center;margin:7px 0;flex-wrap:wrap}
.prow .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);border:2px solid #0004}
.prow input[type=text]{font-family:inherit;font-weight:700;font-size:16px;padding:6px 9px;border-radius:8px;border:1px solid #c9b98f;background:#fff;color:#2a2418;-webkit-text-fill-color:#2a2418;caret-color:var(--accent);width:150px;color-scheme:light}
.prow input[type=text]::placeholder{color:#a3926e;-webkit-text-fill-color:#a3926e;font-weight:600}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:1px solid #c9b98f;background:#f6efdc;border-radius:20px;padding:5px 12px;font-weight:800;color:#2a2418}
.tabs button.on{background:#2a2418;color:#fff}
.toast{position:fixed;left:50%;top:100px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #000a;z-index:70;font-weight:700;animation:toast 2.6s forwards;pointer-events:none;max-width:90vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.bannerx{position:fixed;inset:0;display:grid;place-items:center;z-index:65;pointer-events:none}
.bannerx div{font-family:var(--title,Georgia,serif);font-weight:800;font-size:clamp(30px,6vw,64px);color:#fff;background:var(--bc,var(--accent));padding:10px 36px;border-radius:14px;box-shadow:0 20px 50px #000a;animation:ban 2.3s forwards;text-align:center}
.bannerx small{display:block;font-family:var(--ui);font-size:.34em;font-weight:700}
@keyframes ban{0%{transform:scale(2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.92)}}
#cover{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);text-align:center;padding:20px}
#cover[hidden]{display:none}
#cover h2{font-family:var(--title,Georgia,serif);font-size:36px;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}

body{background:radial-gradient(ellipse at 50% 45%,#1f7a46,#0d3a20 75%) fixed,#0d3a20;overflow-x:hidden}
.table{position:relative;max-width:820px;margin:0 auto;height:calc(100vh - 130px);min-height:520px;display:grid;grid-template-rows:1fr auto 1fr;align-items:center;justify-items:center;padding:10px}
.side{display:flex;align-items:center;gap:18px}
.side.tside.ff{transform:rotate(180deg)}
.pile{position:relative;width:var(--cw);height:var(--ch);cursor:pointer}
.pile .cd{position:absolute;inset:0}
.pile .cnt{position:absolute;right:-12px;top:-12px;background:#fff;color:#1d1d1d;font-weight:900;border-radius:20px;padding:2px 9px;font-size:15px;z-index:20;box-shadow:0 2px 6px #0006}
.pile.can{animation:pl 1.2s infinite}
@keyframes pl{50%{filter:drop-shadow(0 0 14px #ffe08a)}}
.pname{font-family:var(--title);font-size:22px;color:#ffe7b0;text-shadow:0 2px 0 #0006}
.pname small{display:block;font-family:var(--ui);font-size:13px;color:#cfe8d6;font-weight:700}
.mid{position:relative;width:100%;height:calc(var(--ch)*1.1 + 20px);display:flex;justify-content:center;gap:10%;align-items:center}
.slotm{position:relative;width:var(--cw);height:var(--ch)}
.cd{position:absolute;width:var(--cw);height:var(--ch);border-radius:8%/6%;box-shadow:0 2px 6px #0007;transform-style:preserve-3d}
.cd .fc,.cd .bk{position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden}
.cd .fc{background:linear-gradient(160deg,#fff,#f3efe6);border:1px solid #bbb;transform:rotateY(180deg)}
.cd .bk{background:repeating-linear-gradient(45deg,#1e3d8b 0 6px,#2b4fa8 6px 12px);border:4px solid #fff;box-shadow:inset 0 0 0 2px #1e3d8b}
.cd.up{transform:rotateY(180deg)}
.cd .ix{position:absolute;left:7%;top:3%;line-height:.9;text-align:center;font-weight:800;font-size:calc(var(--cw)*.22);font-family:Georgia,serif}
.cd .ix small{display:block}.cd .ix.b{left:auto;top:auto;right:7%;bottom:3%;transform:rotate(180deg)}
.cd .big{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.5);font-family:Georgia,serif}
.cd .big.face span{display:grid;place-items:center;width:58%;height:62%;border-radius:8px;border:2px solid currentColor;font-size:calc(var(--cw)*.36);font-weight:800}
.cd.red{color:#c8203a}.cd.blk{color:#1c1c24}
.cd.win{box-shadow:0 0 0 4px #ffe08a,0 0 30px #ffe08a}
.warbadge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--title);font-size:clamp(34px,8vw,64px);color:#fff;text-shadow:0 4px 0 #8a1010,0 0 30px #f33;z-index:50;pointer-events:none;animation:wb 1.2s forwards}
@keyframes wb{0%{transform:translate(-50%,-50%) scale(3);opacity:0}20%{transform:translate(-50%,-50%) scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:6px}
.bar2{position:absolute;left:10px;bottom:8px;font-size:13px;opacity:.85;font-weight:700}
</style></head><body>
<header class="top"><a class="back" href="index.html">← Salle de jeux</a><h1>La Bataille</h1>
<div class="tools"><button class="btn" id="autoBtn" data-a="auto">Jeu automatique</button><button class="btn" id="sndBtn" data-c="sound">Son</button><button class="btn" data-c="help">Aide</button><button class="btn pri" data-c="new">Nouvelle partie</button></div></header>
<div class="status" id="status"></div>
<div class="table">
  <div class="side tside" id="topSide"><div class="pile" id="pile1"></div><div class="pname" id="name1"></div></div>
  <div class="mid"><div class="slotm" id="m1"></div><div class="slotm" id="m0"></div></div>
  <div class="side bottom"><div class="pile" id="pile0"></div><div class="pname" id="name0"></div></div>
  <div class="bar2" id="stats"></div>
</div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SVGNS='http://www.w3.org/2000/svg';
function sel(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,REDUCED?Math.min(ms,30):ms));
function openModal(h,onclick){ $('#mbox').innerHTML=h; $('#mbox').onclick=onclick||null; $('#modal').hidden=false; }
function paintModal(h){ $('#mbox').innerHTML=h; $('#modal').hidden=false; }
function closeModal(){ $('#modal').hidden=true; $('#mbox').onclick=null; }
function toast(s){ const t=document.createElement('div'); t.className='toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2700); }
function banner(s,sub,col){ const b=document.createElement('div'); b.className='bannerx'; b.innerHTML=`<div style="${col?'--bc:'+col:''}">${esc(s)}${sub?`<small>${esc(sub)}</small>`:''}</div>`; document.body.appendChild(b); setTimeout(()=>b.remove(),2400); }
function confetti(cols){ if(REDUCED) return; cols=cols||['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#fff']; for(let i=0;i<80;i++){ const c=document.createElement('div'); c.style.cssText=`position:fixed;top:-12px;left:${Math.random()*100}vw;width:8px;height:12px;background:${cols[i%cols.length]};z-index:90;pointer-events:none;border-radius:2px`; document.body.appendChild(c);
  c.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*220}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`}],{duration:2200+Math.random()*1800,delay:Math.random()*700,easing:'ease-in'}).finished.then(()=>c.remove()); } }
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
/* sons */
let MUTED=!!load('salle-mute'), AC=null, NOISE=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(AC.state==='suspended') AC.resume().catch(()=>{}); return AC; }
function tn(a,t,f,d,type,v,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function nz(a,t,d,v,type,f){ if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;} const s=a.createBufferSource();s.buffer=NOISE;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02); }
function sfx(n){ if(MUTED) return; const a=ac(); if(!a||a.state!=='running') return; const t=a.currentTime+.01;
  switch(n){
    case 'click': tn(a,t,900,.06,'triangle',.06); break;
    case 'move': nz(a,t,.08,.25,'bandpass',900); tn(a,t,220,.08,'sine',.08); break;
    case 'capture': nz(a,t,.12,.35,'bandpass',1400); tn(a,t,520,.12,'triangle',.1,260); break;
    case 'card': nz(a,t,.1,.22,'bandpass',2800); break;
    case 'flip': nz(a,t,.06,.25,'highpass',3000); tn(a,t,1200,.05,'triangle',.04); break;
    case 'dice': for(let k=0;k<6;k++) nz(a,t+k*.07+Math.random()*.03,.05,.3,'bandpass',1800+Math.random()*1200); break;
    case 'ding': tn(a,t,1320,.5,'sine',.1); tn(a,t+.07,1760,.4,'sine',.06); break;
    case 'error': tn(a,t,220,.25,'square',.05,160); break;
    case 'win': [523,659,784,1046].forEach((f,k)=>tn(a,t+k*.12,f,.4,'triangle',.11)); break;
    case 'lose': [392,330,262].forEach((f,k)=>tn(a,t+k*.16,f,.45,'triangle',.1)); break;
    case 'splash': nz(a,t,.5,.3,'lowpass',800); break;
    case 'boom': nz(a,t,.7,.6,'lowpass',300); tn(a,t,90,.6,'sawtooth',.15,40); break;
    case 'pop': tn(a,t,600,.08,'sine',.1,900); break;
  } }
function updSnd(){ const b=$('#sndBtn'); if(b) b.textContent=MUTED?'Son : non':'Son : oui'; }
document.addEventListener('click',e=>{
  if(!MUTED) ac();
  if(e.target.id==='modal'&&window.MODAL_CLOSABLE!==false){ closeModal(); return; }
  const t=e.target.closest('[data-c]'); if(!t) return;
  switch(t.dataset.c){
    case 'sound': MUTED=!MUTED; store('salle-mute',MUTED); updSnd(); break;
    case 'help': GAME.help(); break;
    case 'new': GAME.menu(); break;
    case 'close': closeModal(); break;
  }
});
addEventListener('DOMContentLoaded',updSnd);

const GAME={help,menu};
const SUITS=['♠','♥','♦','♣'], RN={11:'V',12:'D',13:'R',14:'A'};
let B=null, AUTO=false, BUSY=false, READY=[false,false], GEN=0;
function deck(n){ const d=[]; const lo=n===32?7:2; for(let s=0;s<4;s++) for(let r=lo;r<=14;r++) d.push({s,r}); for(let i=d.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [d[i],d[j]]=[d[j],d[i]]; } return d; }
function newGame(cfg){ GEN++; const d=deck(cfg.n); B={cfg,p:[d.filter((_,i)=>i%2===0),d.filter((_,i)=>i%2===1)],rounds:0,wars:0,over:null}; READY=[false,false]; AUTO=false; store('bat-save',B); clearMid(); render(); }
const rl=r=>RN[r]||String(r);
function cardEl(c,up){ const d=document.createElement('div'); d.className='cd '+(c&&(c.s===1||c.s===2)?'red':'blk')+(up?' up':''); if(c){ const face=c.r>=11&&c.r<=13; d.innerHTML=`<div class="bk"></div><div class="fc"><div class="ix">${rl(c.r)}<small>${SUITS[c.s]}</small></div><div class="ix b">${rl(c.r)}<small>${SUITS[c.s]}</small></div><div class="big ${face?'face':''}">${face?`<span>${rl(c.r)}${SUITS[c.s]}</span>`:c.r===14?`<b style="font-size:1.4em">${SUITS[c.s]}</b>`:SUITS[c.s]}</div></div>`; } else d.innerHTML='<div class="bk"></div>'; return d; }
function render(){
  for(const i of [0,1]){ const pile=$('#pile'+i); pile.innerHTML=''; const n=B.p[i].length; for(let k=0;k<Math.min(5,Math.ceil(n/8));k++){ const c=cardEl(null); c.style.transform=`translate(${-k*2}px,${-k*2}px)`; pile.appendChild(c); }
    pile.insertAdjacentHTML('beforeend',`<span class="cnt">${n}</span>`); pile.classList.toggle('can',!B.over&&!BUSY&&isHuman(i)&&!READY[i]&&!AUTO);
    $('#name'+i).innerHTML=`${esc(B.cfg.names[i])}<small>${n} carte${n>1?'s':''}</small>`; }
  $('#topSide').classList.toggle('ff',B.cfg.mode==='2p'&&B.cfg.ff);
  const st=$('#status'); st.style.setProperty('--pc',B.over?'#7a1a1a':'#8a5a10');
  st.innerHTML=B.over?`<span class="who">${esc(B.over)}</span>`:`<span class="who">Manche ${B.rounds+1}</span><span class="msg">${AUTO?'Jeu automatique…':B.cfg.mode==='ia'?'Touche ton paquet pour retourner une carte.':'Chacun touche son paquet.'}</span>`;
  $('#stats').textContent=`${B.rounds} manches · ${B.wars} batailles`; $('#autoBtn').textContent=AUTO?'Arrêter':'Jeu automatique';
}
const isHuman=i=>B.cfg.mode==='2p'||i===0;
function clearMid(){ $('#m0').innerHTML=''; $('#m1').innerHTML=''; }
async function flipTo(i,c,up,off){ const m=$('#m'+i), pile=$('#pile'+i); const el=cardEl(c,false); m.appendChild(el);
  const a=pile.getBoundingClientRect(), b=m.getBoundingClientRect(); const dx=a.left-b.left, dy=a.top-b.top;
  el.style.zIndex=10+m.children.length; const fin=`translate(${off*14}px,${off*6}px) ${up?'rotateY(180deg)':''}`;
  sfx('card'); if(!REDUCED){ await el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:fin}],{duration:AUTO?220:420,easing:'cubic-bezier(.3,.9,.4,1)',fill:'forwards'}).finished; } el.style.transform=fin; if(up) el.classList.add('up'); return el; }
async function round(){
  if(B.over||BUSY) return; BUSY=true; READY=[false,false]; render(); const my=GEN;
  const pot=[]; let off=0, els=[[],[]];
  const play=async(up)=>{ for(const i of [0,1]){ const c=B.p[i].shift(); pot.push(c); els[i].push(await Promise.resolve(flipTo(i,c,up,off))); } off++; };
  await Promise.all([0,1].map(async i=>{ const c=B.p[i].shift(); pot.push(c); els[i].push(await flipTo(i,c,true,off)); })); off++;
  if(my!==GEN) return;
  let a=pot[pot.length-2], b=pot[pot.length-1]; // a = joueur 0, b = joueur 1 (ordre de push)
  const last=()=>[els[0][els[0].length-1], els[1][els[1].length-1]];
  let w;
  while(true){
    const c0=pot[pot.length-2], c1=pot[pot.length-1];
    if(c0.r!==c1.r){ w=c0.r>c1.r?0:1; break; }
    B.wars++; sfx('capture'); const wb=document.createElement('div'); wb.className='warbadge'; wb.textContent='Bataille !'; $('.mid').appendChild(wb); setTimeout(()=>wb.remove(),1200);
    await wait(AUTO?500:1000); if(my!==GEN) return;
    if(B.p[0].length<2||B.p[1].length<2){ w=B.p[0].length>=B.p[1].length?0:1; if(B.p[0].length<2&&B.p[1].length<2) w=B.p[0].length>=B.p[1].length?0:1; break; }
    await Promise.all([0,1].map(async i=>{ const c=B.p[i].shift(); pot.push(c); els[i].push(await flipTo(i,c,false,off)); })); off++;
    await wait(AUTO?150:350);
    const hold=[]; await Promise.all([0,1].map(async i=>{ const c=B.p[i].shift(); hold[i]=c; els[i].push(await flipTo(i,c,true,off)); })); pot.push(hold[0],hold[1]); off++;
  }
  last()[w].classList.add('win'); sfx(w===0&&B.cfg.mode==='ia'?'ding':'pop');
  await wait(AUTO?350:850); if(my!==GEN) return;
  // ramasser
  const pile=$('#pile'+w).getBoundingClientRect();
  await Promise.all($$('.mid .cd').map(el=>{ const r=el.getBoundingClientRect(); return REDUCED?null:el.animate([{transform:el.style.transform},{transform:`translate(${pile.left-r.left}px,${pile.top-r.top}px) rotateY(0deg) scale(.9)`,opacity:.6}],{duration:AUTO?220:380,easing:'ease-in',fill:'forwards'}).finished; }));
  clearMid();
  B.p[w].push(...pot.sort(()=>Math.random()-.5)); B.rounds++;
  if(!B.p[0].length||!B.p[1].length||(B.cfg.limit&&B.rounds>=B.cfg.limit)){ const win=B.p[0].length===B.p[1].length?-1:(B.p[0].length>B.p[1].length?0:1);
    B.over=win<0?'Égalité !':`${B.cfg.names[win]} gagne la partie !`; AUTO=false; store('bat-save',null); BUSY=false; render();
    banner(win<0?'Égalité':(B.cfg.mode==='ia'?(win===0?'Victoire !':'Défaite…'):'Victoire !'),win<0?'':B.cfg.names[win],win===1&&B.cfg.mode==='ia'?'#5a1a1a':'#2f8a4a'); sfx(win===0||B.cfg.mode==='2p'?'win':'lose'); if(win===0||(B.cfg.mode==='2p'&&win>=0)) confetti(); return; }
  store('bat-save',B); BUSY=false; render();
  if(AUTO){ await wait(B.cfg.speed||250); if(AUTO&&my===GEN) round(); }
}
for(const i of [0,1]) $('#pile'+i).addEventListener('click',()=>{ if(!B||B.over||BUSY||AUTO||!isHuman(i)) return; READY[i]=true; if(B.cfg.mode==='ia') READY[1]=true; sfx('click'); render(); if(READY[0]&&READY[1]) round(); });
document.addEventListener('click',e=>{ if(e.target.closest('[data-a="auto"]')&&B&&!B.over){ AUTO=!AUTO; render(); if(AUTO&&!BUSY) round(); } });
document.addEventListener('keydown',e=>{ if(e.key===' '&&B&&!B.over&&!AUTO){ e.preventDefault(); $('#pile0').click(); if(B.cfg.mode==='2p') $('#pile1').click(); } });
let M={mode:'ia',n:52,limit:0,names:['Toi','Lucas'],ff:false};
function menu(){ const s=load('bat-save');
  const draw=()=>paintModal(`<h2>Nouvelle partie</h2>${s&&!s.over?'<div class="prow"><button class="btn pri" data-m="resume">Reprendre la partie en cours</button></div>':''}
   <h4>Adversaire</h4><div class="seg"><button class="${M.mode==='ia'?'on':''}" data-m="mode:ia">Contre l'ordinateur</button><button class="${M.mode==='2p'?'on':''}" data-m="mode:2p">À deux sur cet écran</button></div>
   ${M.mode==='2p'?`<div class="prow"><input type="text" id="n0" value="${esc(M.names[0])}" placeholder="Camille" maxlength="14"> contre <input type="text" id="n1" value="${esc(M.names[1])}" placeholder="Lucas" maxlength="14"></div><div class="seg"><button class="${!M.ff?'on':''}" data-m="ff:0">Côte à côte</button><button class="${M.ff?'on':''}" data-m="ff:1">Face à face (tablette posée)</button></div>`:''}
   <h4>Jeu de cartes</h4><div class="seg"><button class="${M.n===52?'on':''}" data-m="n:52">52 cartes</button><button class="${M.n===32?'on':''}" data-m="n:32">32 cartes (partie plus courte)</button></div>
   <h4>Durée</h4><div class="seg"><button class="${!M.limit?'on':''}" data-m="limit:0">Jusqu'au bout</button><button class="${M.limit===100?'on':''}" data-m="limit:100">100 manches max</button><button class="${M.limit===50?'on':''}" data-m="limit:50">50 manches max</button></div>
   <div class="acts">${B?'<button class="btn" data-c="close">Annuler</button>':''}<button class="btn pri" data-m="start">Distribuer</button></div>`);
  draw(); $('#mbox').onclick=e=>{ const x=e.target.closest('[data-m]'); if(!x) return; if($('#n0')) M.names=[$('#n0').value,$('#n1').value]; const [k,v]=x.dataset.m.split(':');
    if(k==='resume'){ closeModal(); GEN++; B=s; clearMid(); render(); return; }
    if(k==='start'){ closeModal(); store('bat-prefs',M); const names=M.mode==='ia'?['Toi','Ordinateur']:[M.names[0].trim()||'Camille',M.names[1].trim()||'Lucas']; newGame({mode:M.mode,n:M.n,limit:M.limit,names,ff:M.ff}); return; }
    M[k]=k==='mode'?v:k==='ff'?v==='1':+v; draw(); }; }
function help(){ openModal(`<h2>La Bataille</h2><ul><li>Les cartes sont partagées entre les deux joueurs, faces cachées.</li><li>Chacun retourne la carte du dessus de son paquet : la plus forte remporte les deux (As &gt; Roi &gt; Dame &gt; Valet &gt; 10 … &gt; 2).</li><li>En cas d'égalité, c'est la <b>bataille</b> ! Chacun pose une carte face cachée puis une face visible : la plus forte rafle tout le tas.</li><li>Celui qui récupère toutes les cartes gagne. Si un joueur n'a plus assez de cartes pendant une bataille, il perd.</li></ul><p>Touche ton paquet (ou Espace) pour jouer, ou lance le jeu automatique.</p><div class="acts"><button class="btn pri" data-c="close">Compris</button></div>`); }
(function boot(){ const p=load('bat-prefs'); if(p) Object.assign(M,p); const s=load('bat-save'); if(s&&!s.over){ B=s; render(); } else { newGame({mode:'ia',n:M.n,limit:M.limit,names:['Toi','Ordinateur']}); menu(); } })();
</script></body></html>
