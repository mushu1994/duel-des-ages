<style>

/*top-above*//*hh*/#modal,#cover{top:var(--hh,0px)!important}#modal>*{max-height:calc(100vh - var(--hh,0px) - 24px)!important;max-height:calc(100dvh - var(--hh,0px) - 24px)!important;overflow:auto}

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SVGNS='http://www.w3.org/2000/svg';
function sel(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,REDUCED?Math.min(ms,30):ms));
function openModal(h,onclick){ $('#mbox').innerHTML=h; $('#mbox').onclick=onclick||null; $('#modal').hidden=false; }
function paintModal(h){ $('#mbox').innerHTML=h; $('#modal').hidden=false; }
function helpTabs(title,tabs){ let k=0; const draw=()=>paintModal('<h2>'+title+'</h2>'+(tabs.length>1?'<div class="tabs">'+tabs.map((t,i)=>'<button class="'+(i===k?'on':'')+'" data-ht="'+i+'">'+t[0]+'</button>').join('')+'</div>':'')+'<div class="hbody">'+tabs[k][1]+'</div><div class="acts"><button class="btn pri" data-c="close">Compris</button></div>'); draw(); $('#mbox').onclick=e=>{ const b=e.target.closest('[data-ht]'); if(b){ k=+b.dataset.ht; draw(); $('#mbox').scrollTop=0; } }; }
function closeModal(){ $('#modal').hidden=true; $('#mbox').onclick=null; window.COVER_HIDDEN=null; }
function toast(s){ const t=document.createElement('div'); t.className='toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2700); }
function banner(s,sub,col){ const b=document.createElement('div'); b.className='bannerx'; b.innerHTML=`<div style="${col?'--bc:'+col:''}">${esc(s)}${sub?`<small>${esc(sub)}</small>`:''}</div>`; document.body.appendChild(b); setTimeout(()=>b.remove(),2400); }
function confetti(cols){ if(REDUCED) return; cols=cols||['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#fff']; for(let i=0;i<80;i++){ const c=document.createElement('div'); c.style.cssText=`position:fixed;top:-12px;left:${Math.random()*100}vw;width:8px;height:12px;background:${cols[i%cols.length]};z-index:90;pointer-events:none;border-radius:2px`; document.body.appendChild(c);
  c.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*220}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`}],{duration:2200+Math.random()*1800,delay:Math.random()*700,easing:'ease-in'}).finished.then(()=>c.remove()); } }
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
/* sons */
let MUTED=!!load('salle-mute'), AC=null, NOISE=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(AC.state==='suspended') AC.resume().catch(()=>{}); return AC; }
function tn(a,t,f,d,type,v,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function nz(a,t,d,v,type,f){ if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;} const s=a.createBufferSource();s.buffer=NOISE;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02); }
function sfx(n){ if(MUTED) return; if(n==='click'&&window.ARC_PLAYING) return; const a=ac(); if(!a||a.state!=='running') return; const t=a.currentTime+.01;
  switch(n){
    case 'click': tn(a,t,900,.06,'triangle',.06); break;
    case 'move': nz(a,t,.08,.25,'bandpass',900); tn(a,t,220,.08,'sine',.08); break;
    case 'capture': nz(a,t,.12,.35,'bandpass',1400); tn(a,t,520,.12,'triangle',.1,260); break;
    case 'card': nz(a,t,.1,.22,'bandpass',2800); break;
    case 'flip': nz(a,t,.06,.25,'highpass',3000); tn(a,t,1200,.05,'triangle',.04); break;
    case 'dice': for(let k=0;k<6;k++) nz(a,t+k*.07+Math.random()*.03,.05,.3,'bandpass',1800+Math.random()*1200); break;
    case 'ding': tn(a,t,1320,.5,'sine',.1); tn(a,t+.07,1760,.4,'sine',.06); break;
    case 'error': tn(a,t,220,.25,'square',.05,160); break;
    case 'win': [523,659,784,1046].forEach((f,k)=>tn(a,t+k*.12,f,.4,'triangle',.11)); break;
    case 'lose': [392,330,262].forEach((f,k)=>tn(a,t+k*.16,f,.45,'triangle',.1)); break;
    case 'splash': nz(a,t,.5,.3,'lowpass',800); break;
    case 'boom': nz(a,t,.7,.6,'lowpass',300); tn(a,t,90,.6,'sawtooth',.15,40); break;
    case 'eat': tn(a,t,780,.05,'square',.025,980); break;
    case 'chomp': tn(a,t,330,.07,'square',.04,520); break;
    case 'power': [440,554,659,880].forEach((f,k)=>tn(a,t+k*.06,f,.18,'square',.05)); break;
    case 'die': tn(a,t,600,.6,'sawtooth',.07,90); break;
    case 'flap': nz(a,t,.08,.18,'bandpass',1400); tn(a,t,420,.07,'sine',.05,620); break;
    case 'point': tn(a,t,988,.09,'square',.04); tn(a,t+.08,1318,.16,'square',.04); break;
    case 'go': tn(a,t,880,.25,'square',.06); break;
    case 'beep': tn(a,t,520,.12,'square',.05); break;
    case 'hit': nz(a,t,.25,.5,'lowpass',500); tn(a,t,160,.25,'square',.08,60); break;
    case 'catch': [660,880,1100].forEach((f,k)=>tn(a,t+k*.05,f,.12,'triangle',.08)); break;
    case 'pop': tn(a,t,600,.08,'sine',.1,900); break;
  } }
function updSnd(){ const b=$('#sndBtn'); if(b) b.textContent=MUTED?'Son : non':'Son : oui'; }
document.addEventListener('click',e=>{
  if(!MUTED) ac();
  if(e.target.id==='modal'&&window.MODAL_CLOSABLE!==false){ const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; return; }
  const t=e.target.closest('[data-c]'); if(!t) return;
  switch(t.dataset.c){
    case 'sound': MUTED=!MUTED; store('salle-mute',MUTED); updSnd(); break;
    case 'help': GAME.help(); break;
    case 'new': { const cv=$('#cover'); window.MODAL_CLOSABLE=true; GAME.menu(); if(cv&&!cv.hidden){ cv.hidden=true; window.COVER_HIDDEN=cv; } break; }
    case 'close': { const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; break; }
  }
});
addEventListener('DOMContentLoaded',updSnd);


/* ===== Kit « tour par tour » : partie locale, contre l'ordinateur ou en ligne, reprise, sauvegarde, fin de partie ===== */
window.PROF_MANUAL=true;
const TK=(()=>{
 const T={}; let D=null, G=null, GEN=0, nextT=null, shown=null, endShown=null;
 const FAST=(()=>{ try{ return localStorage.getItem('tk-fast')==='1'; }catch(e){ return false; } })(); T.FAST=FAST;
 T.G=()=>G;
 const net=()=>typeof NET!=='undefined'&&NET.on&&NET.started;
 const guest=()=>net()&&NET.guest;
 T.net=net; T.guest=guest;
 const COLS=['#e8433a','#2f7fd6','#2fa65a','#e8b030','#9b59b6','#e67e22'];
 T.COLS=COLS;
 /* ---------- qui regarde l'écran ---------- */
 const humans=()=>G?G.players.map((p,i)=>p.ai?-1:i).filter(i=>i>=0):[];
 T.viewer=()=>{ if(!G) return null; if(net()) return NET.seat; const h=humans(); if(h.length===1) return h[0]; if(!h.length) return 0;
   const a=D.actors(G).find(s=>!G.players[s].ai); if(a!=null&&(!D.hidden||shown===a)) return a; return D.hidden?shown:(a!=null?a:h[0]); };

/* ===== Awalé (abapa) ===== */
(function(){
/* plateau : cases 0 à 5 au joueur 1 (en bas, de gauche à droite), 6 à 11 au joueur 2 (en haut, de droite à gauche) ; on sème dans le sens des indices */
const own=(s,p)=>s===0?p<6:p>=6;
function sow(b,p){ const n=b[p]; b[p]=0; let i=p; const path=[]; for(let k=0;k<n;k++){ i=(i+1)%12; if(i===p) i=(i+1)%12; b[i]++; path.push(i); } return {last:i,path}; }
function captures(b,s,last){ const cap=[]; let i=last; while(!own(s,i)&&(b[i]===2||b[i]===3)){ cap.push(i); i=(i+11)%12; } return cap; }
function seedsOf(b,s){ let t=0; for(let i=s?6:0;i<(s?12:6);i++) t+=b[i]; return t; }
/* coup simulé : renvoie le nouveau plateau, les prises (sans grand chelem) */
function sim(b,s,p){ const nb=b.slice(); const {last,path}=sow(nb,p); let cap=captures(nb,s,last); let gain=0;
  if(cap.length){ const tot=cap.reduce((a,i)=>a+nb[i],0); if(tot===seedsOf(nb,1-s)) cap=[]; else { gain=tot; cap.forEach(i=>nb[i]=0); } }
  return {nb,path,cap,gain}; }
function legal(G,s){ const b=G.b; const mine=[]; for(let i=s?6:0;i<(s?12:6);i++) if(b[i]) mine.push(i);
  if(seedsOf(b,1-s)===0){ const feed=mine.filter(p=>seedsOf(sim(b,s,p).nb,1-s)>0); return feed; } return mine; }
function finish(G,reason){ const s0=seedsOf(G.b,0), s1=seedsOf(G.b,1); G.st[0]+=s0; G.st[1]+=s1; G.b=G.b.map(()=>0);
  const w=G.st[0]>G.st[1]?[0]:G.st[1]>G.st[0]?[1]:[0,1];
  G.over={winners:w,title:w.length>1?'Égalité : 24 graines chacun':`${G.players[w[0]].name} gagne !`,text:reason}; }
const D={id:'awale',title:'Awalé',min:2,max:2,maxLocal:2,
  desc:'Le grand jeu de semailles d’Afrique de l’Ouest : sème tes graines et récolte celles de l’adversaire.',
  opt:{},
  init(players){ return {b:new Array(12).fill(4),st:[0,0],turn:Math.random()<.5?0:1,last:null,noCap:0,moves:0,players}; },
  actors:G=>G.over?[]:[G.turn],
  apply(G,s,a){ const p=a&&+a.p; if(!legal(G,s).includes(p)) return false;
    const r=sim(G.b,s,p); G.b=r.nb; G.st[s]+=r.gain; G.last={p,path:r.path,cap:r.cap,s}; G.moves++; G.noCap=r.gain?0:G.noCap+1;
    const ev=[{t:'sow',p,s,path:r.path,cap:r.cap,gain:r.gain}];
    if(G.st[s]>=25){ finish(G,`${G.players[s].name} a récolté plus de la moitié des graines.`); return ev; }
    G.turn=1-s;
    if(!legal(G,G.turn).length){ finish(G,seedsOf(G.b,G.turn)?'Plus aucun coup ne peut nourrir l’adversaire : chacun garde les graines de son camp.':`${G.players[G.turn].name} n’a plus de graines et personne ne peut le nourrir.`); return ev; }
    if(G.noCap>=60||G.moves>=300){ finish(G,'La partie tourne en rond : chacun garde les graines de son camp.'); return ev; }
    return ev; },
  ai(G,s,lv){ const depth={facile:1,normal:4,difficile:7}[lv]||4; const L=legal(G,s);
    if(lv==='facile'&&Math.random()<.35) return {p:L[Math.floor(Math.random()*L.length)]};
    const rec=(b,st,turn,d,a,bt)=>{ const ms=[]; for(let i=turn?6:0;i<(turn?12:6);i++) if(b[i]) ms.push(i); let mv=ms; if(seedsOf(b,1-turn)===0) mv=ms.filter(p=>seedsOf(sim(b,turn,p).nb,1-turn)>0);
      if(!mv.length){ const f=st.slice(); f[0]+=seedsOf(b,0); f[1]+=seedsOf(b,1); return (f[s]-f[1-s])*100; }
      if(st[s]>=25) return 1000+d; if(st[1-s]>=25) return -1000-d; if(d===0) return (st[s]-st[1-s])*10+(seedsOf(b,s)-seedsOf(b,1-s))*.5;
      let best=turn===s?-Infinity:Infinity;
      for(const p of mv){ const r=sim(b,turn,p); const ns=st.slice(); ns[turn]+=r.gain; const v=rec(r.nb,ns,1-turn,d-1,a,bt);
        if(turn===s){ if(v>best) best=v; if(v>a) a=v; } else { if(v<best) best=v; if(v<bt) bt=v; } if(a>=bt) break; } return best; };
    let best=L[0], bv=-Infinity; for(const p of L){ const r=sim(G.b,s,p); const ns=G.st.slice(); ns[s]+=r.gain; const v=rec(r.nb,ns,1-s,depth-1,-Infinity,Infinity)+Math.random()*.01; if(v>bv){ bv=v; best=p; } }
    return {p:best}; },
  aiDelay:()=>900,
  status(G,v){ if(G.over) return {who:'Partie terminée',msg:'',col:'#5a3a22'}; const P=G.players[G.turn];
    return {who:P.name,msg:TK.canPlay()?'choisis une case de ton camp.':(P.ai?'réfléchit…':'joue…'),col:P.col,right:`${G.players[0].name} ${G.st[0]} · ${G.players[1].name} ${G.st[1]}`}; },
  ranking:G=>[0,1].sort((a,b)=>G.st[b]-G.st[a]).map(s=>({seat:s,score:G.st[s]+' graines'})),
  sound(e){ if(e.t==='sow'){ sfx('move'); if(e.gain) setTimeout(()=>sfx('capture'),300); } },
  render(G,v,ev){ const flip=TK.net()&&v===1; const bottom=flip?1:0, top=1-bottom;
    const play=TK.canPlay()?legal(G,v):[]; const L=G.last||{};
    const pit=(i)=>{ const n=G.b[i]; const seeds=Array.from({length:Math.min(n,30)},(_,k)=>{ const a=(k*137.5+i*31)%360*Math.PI/180, r=Math.min(30,5+Math.sqrt(k)*6.2); return `<circle cx="${(Math.cos(a)*r).toFixed(1)}" cy="${(Math.sin(a)*r).toFixed(1)}" r="5.2" class="sd s${(k+i)%3}"/>`; }).join('');
      const cls=['pit',play.includes(i)?'can':'',L.p===i?'from':'',(L.path||[]).includes(i)?'got':'',(L.cap||[]).includes(i)?'cap':''].join(' ');
      return `<g class="${cls}" data-p="${i}"><circle r="42" class="hole"/>${seeds}<text y="64" class="cnt">${n}</text></g>`; };
    const rowB=Array.from({length:6},(_,k)=>bottom===0?k:6+k).map((i,k)=>`<g transform="translate(${150+k*100},270)">${pit(i)}</g>`).join('');
    const rowT=Array.from({length:6},(_,k)=>top===1?11-k:5-k).map((i,k)=>`<g transform="translate(${150+k*100},120)">${pit(i)}</g>`).join('');
    const store=(s,x)=>`<g transform="translate(${x},195)"><rect x="-38" y="-120" width="76" height="240" rx="38" class="store"/><text y="8" class="stn">${G.st[s]}</text><text y="40" class="stl">${esc(G.players[s].name.slice(0,8))}</text></g>`;
    $('#ab').innerHTML=`<rect x="10" y="20" width="880" height="350" rx="60" class="wood"/>${store(top,58)}${store(bottom,842)}${rowT}${rowB}`;
    $('#ab').querySelectorAll('.got .sd').forEach(x=>x.classList.add('new'));
    $('#who').innerHTML=[top,bottom].map(s=>`<span class="pchip${G.turn===s&&!G.over?' turn':''}" style="--pcol:${G.players[s].col}"><i style="background:${G.players[s].col}"></i>${esc(G.players[s].name)} · ${G.st[s]}</span>`).join(''); },
  help(){ helpTabs('Awalé',[['But du jeu','<p>Récolter plus de graines que l’adversaire : <b>25 graines</b> sur 48 suffisent pour gagner.</p><p>Chaque joueur possède la rangée de 6 cases de son côté. On commence avec 4 graines par case.</p>'],
    ['Semer','<ul><li>À ton tour, prends toutes les graines d’une case de ton camp et sème-les une par une dans les cases suivantes, dans le sens inverse des aiguilles d’une montre.</li><li>Avec 12 graines ou plus, on fait le tour du plateau en sautant la case de départ.</li></ul>'],
    ['Récolter','<ul><li>Si la dernière graine tombe chez l’adversaire et que la case contient alors <b>2 ou 3 graines</b>, tu les récoltes.</li><li>Tu récoltes aussi les cases précédentes de l’adversaire tant qu’elles contiennent 2 ou 3 graines.</li><li>Si une récolte prenait toutes les graines adverses (grand chelem), elle n’a pas lieu.</li></ul>'],
    ['Nourrir et fin','<ul><li>Si l’adversaire n’a plus de graines, tu dois jouer un coup qui lui en donne. Si c’est impossible, la partie s’arrête et chacun garde les graines de son camp.</li><li>Si la partie tourne en rond (60 coups sans récolte), elle s’arrête de la même façon.</li></ul><p class="ex">Astuce : garder une case bien remplie permet un grand tour qui récolte plusieurs cases d’un coup.</p>']]); } };
TK.def(D);
$('#ab').addEventListener('click',e=>{ const g=e.target.closest('.pit.can'); if(g) TK.input({p:+g.dataset.p}); });
})();
