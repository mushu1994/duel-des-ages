<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--fg:#f6efe2;--accent:#c4322f;--title:"Playfair Display",Georgia,serif;--ui:"Nunito Sans",system-ui,sans-serif;--titlec:#ffd98a}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui,"Nunito Sans",system-ui,sans-serif);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar,#0006);border-bottom:1px solid #fff2;flex-wrap:wrap}
.top h1{font-family:var(--title,Georgia,serif);font-weight:800;font-size:24px;margin:0;color:var(--titlec,#fff);letter-spacing:.5px}
.top h1 small{font-family:var(--ui);font-weight:600;font-size:13px;opacity:.75;margin-left:8px;letter-spacing:0}
.back{color:inherit;opacity:.9;text-decoration:none;font-size:14px;border:1px solid #fff4;padding:5px 10px;border-radius:8px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#ffffff1c;color:inherit;border:1px solid #ffffff40;border-radius:9px;padding:7px 12px;font-size:14px;font-weight:700}
.btn:hover{background:#ffffff2e}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:#fff;color:#222}
.status{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--pc,var(--accent));color:#fff;font-weight:800;min-height:44px;box-shadow:0 4px 14px #0005;transition:background .35s;flex-wrap:wrap}
.status .who{font-family:var(--title,Georgia,serif);font-size:19px}
.status .msg{font-weight:600}
.status .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
#modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:12px}
#modal[hidden]{display:none}
.mbox{background:#fbf6ea;color:#2a2418;border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox h2{font-family:var(--title,Georgia,serif);font-size:26px;margin:0 0 6px}
.mbox h4{font-family:var(--title,Georgia,serif);font-size:16px;margin:14px 0 6px}
.mbox p,.mbox li{line-height:1.5}
.mbox .btn{background:#ece3cf;color:#2a2418;border-color:#c9b98f}
.mbox .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.mbox .btn.on{background:#2a2418;color:#fff}
.seg{display:inline-flex;border:1px solid #c9b98f;border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#f6efdc;padding:7px 11px;font-weight:700;color:#2a2418;font-size:13.5px}
.seg button.on{background:#2a2418;color:#fff}
.prow{display:flex;gap:8px;align-items:center;margin:7px 0;flex-wrap:wrap}
.prow .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);border:2px solid #0004}
.prow input[type=text]{font-family:inherit;font-weight:700;font-size:16px;padding:6px 9px;border-radius:8px;border:1px solid #c9b98f;background:#fff;color:#2a2418;-webkit-text-fill-color:#2a2418;caret-color:var(--accent);width:150px;color-scheme:light}
.prow input[type=text]::placeholder{color:#a3926e;-webkit-text-fill-color:#a3926e;font-weight:600}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:1px solid #c9b98f;background:#f6efdc;border-radius:20px;padding:5px 12px;font-weight:800;color:#2a2418}
.tabs button.on{background:#2a2418;color:#fff}
.toast{position:fixed;left:50%;top:100px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #000a;z-index:70;font-weight:700;animation:toast 2.6s forwards;pointer-events:none;max-width:90vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.bannerx{position:fixed;inset:0;display:grid;place-items:center;z-index:65;pointer-events:none}
.bannerx div{font-family:var(--title,Georgia,serif);font-weight:800;font-size:clamp(30px,6vw,64px);color:#fff;background:var(--bc,var(--accent));padding:10px 36px;border-radius:14px;box-shadow:0 20px 50px #000a;animation:ban 2.3s forwards;text-align:center}
.bannerx small{display:block;font-family:var(--ui);font-size:.34em;font-weight:700}
@keyframes ban{0%{transform:scale(2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.92)}}
#cover{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);text-align:center;padding:20px}
#cover[hidden]{display:none}
#cover h2{font-family:var(--title,Georgia,serif);font-size:36px;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}

.pcard{--cw:64px;position:relative;width:var(--cw);height:calc(var(--cw)*1.42);border-radius:8%/6%;box-shadow:0 2px 5px #0006;flex:none;user-select:none}
.pcard .fc{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,#fff,#f2eee4);border:1px solid #b9b2a2;overflow:hidden}
.pcard .bk{position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(45deg,#8b1e2e 0 5px,#a32a3c 5px 10px);border:3px solid #fff;box-shadow:inset 0 0 0 2px #8b1e2e}
.pcard .ix{position:absolute;left:7%;top:3%;line-height:.9;text-align:center;font-weight:800;font-size:calc(var(--cw)*.25);font-family:Georgia,serif}
.pcard .ix small{display:block;font-size:.85em}
.pcard .ix.b{left:auto;top:auto;right:7%;bottom:3%;transform:rotate(180deg)}
.pcard .big{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.5);font-family:Georgia,serif}
.pcard .big b{font-size:1.25em}
.pcard .big.face span{display:grid;place-items:center;width:56%;height:60%;border-radius:6px;border:2px solid currentColor;font-size:calc(var(--cw)*.3);font-weight:800;background:repeating-linear-gradient(135deg,#0000 0 5px,#00000008 5px 10px)}
.pcard.red{color:#c8203a}.pcard.blk{color:#1c1c24}
.pcard.joker{color:#7a3fb0}.pcard.joker .big span{font-size:calc(var(--cw)*.17);font-weight:900;letter-spacing:1px;writing-mode:vertical-rl}
.pcard.sel{transform:translateY(-14px);box-shadow:0 0 0 3px #ffd34a,0 8px 14px #0008}
.pcard.dim{filter:brightness(.6)}
.pcard.play{cursor:pointer}
.fan{display:flex;justify-content:center;padding:18px 10px 8px}
.fan .pcard{margin-left:calc(var(--cw)*-.42);transition:transform .15s}
.fan .pcard:first-child{margin-left:0}
.fan .pcard.play:hover{transform:translateY(-8px)}
.fan .pcard.sel:hover{transform:translateY(-14px)}


body{background:radial-gradient(ellipse at 50% 40%,#7a1f2a,#2a0a10 80%) fixed,#2a0a10}
.table{max-width:1000px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.opps{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.opp{background:#ffffff12;border:1px solid #ffffff26;border-radius:14px;padding:8px 12px;min-width:140px;text-align:center;position:relative;transition:all .25s}
.opp.cur{box-shadow:0 0 0 3px #ffd34a,0 8px 18px #0008;transform:translateY(-3px)}
.opp.done{opacity:.6}
.opp .nm{font-weight:900}.opp .role{font-size:11px;font-weight:800;color:#ffd98a;min-height:14px}
.opp .bk{display:flex;justify-content:center;margin-top:4px}
.opp .bk .pcard{--cw:26px;margin-left:-16px}.opp .bk .pcard:first-child{margin-left:0}
.opp .said{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);background:#fff;color:#222;font-weight:800;font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap;box-shadow:0 2px 6px #0006}
.felt{position:relative;min-height:220px;border-radius:120px;background:radial-gradient(ellipse,#2e7a4c,#174a2c);border:8px solid #5a2a14;box-shadow:inset 0 0 40px #0008;display:grid;place-items:center}
.pile{position:relative;display:flex;gap:6px;justify-content:center}
.pile .pcard{--cw:72px}
.pile .pcard.in{animation:pin .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes pin{from{transform:translateY(80px) scale(.8);opacity:0}}
.pile .who{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-weight:800;font-size:13px;white-space:nowrap;background:#0005;padding:2px 10px;border-radius:10px}
.felt .info{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;opacity:.85;white-space:nowrap}
.me{background:#0003;border-radius:16px;padding:6px 10px 10px}
.me .head{display:flex;align-items:center;gap:10px;font-weight:900}
.me .head .role{color:#ffd98a;font-size:13px}
.me .acts2{margin-left:auto;display:flex;gap:8px}
.fan .pcard{--cw:min(70px,13vw)}
</style></head><body>
<header class="top"><a class="back" href="index.html">← Salle de jeux</a><h1>Président</h1>
<div class="tools"><button class="btn" data-a="scores">Scores</button><button class="btn" id="sndBtn" data-c="sound">Son</button><button class="btn" data-c="help">Aide</button><button class="btn pri" data-c="new">Nouvelle partie</button></div></header>
<div class="status" id="status"></div>
<div class="table"><div class="opps" id="opps"></div><div class="felt" id="felt"></div><div class="me"><div class="head" id="mehead"></div><div class="fan" id="hand"></div></div></div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SVGNS='http://www.w3.org/2000/svg';
function sel(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,REDUCED?Math.min(ms,30):ms));
function openModal(h,onclick){ $('#mbox').innerHTML=h; $('#mbox').onclick=onclick||null; $('#modal').hidden=false; }
function paintModal(h){ $('#mbox').innerHTML=h; $('#modal').hidden=false; }
function closeModal(){ $('#modal').hidden=true; $('#mbox').onclick=null; }
function toast(s){ const t=document.createElement('div'); t.className='toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2700); }
function banner(s,sub,col){ const b=document.createElement('div'); b.className='bannerx'; b.innerHTML=`<div style="${col?'--bc:'+col:''}">${esc(s)}${sub?`<small>${esc(sub)}</small>`:''}</div>`; document.body.appendChild(b); setTimeout(()=>b.remove(),2400); }
function confetti(cols){ if(REDUCED) return; cols=cols||['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#fff']; for(let i=0;i<80;i++){ const c=document.createElement('div'); c.style.cssText=`position:fixed;top:-12px;left:${Math.random()*100}vw;width:8px;height:12px;background:${cols[i%cols.length]};z-index:90;pointer-events:none;border-radius:2px`; document.body.appendChild(c);
  c.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*220}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`}],{duration:2200+Math.random()*1800,delay:Math.random()*700,easing:'ease-in'}).finished.then(()=>c.remove()); } }
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
/* sons */
let MUTED=!!load('salle-mute'), AC=null, NOISE=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(AC.state==='suspended') AC.resume().catch(()=>{}); return AC; }
function tn(a,t,f,d,type,v,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function nz(a,t,d,v,type,f){ if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;} const s=a.createBufferSource();s.buffer=NOISE;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02); }
function sfx(n){ if(MUTED) return; const a=ac(); if(!a||a.state!=='running') return; const t=a.currentTime+.01;
  switch(n){
    case 'click': tn(a,t,900,.06,'triangle',.06); break;
    case 'move': nz(a,t,.08,.25,'bandpass',900); tn(a,t,220,.08,'sine',.08); break;
    case 'capture': nz(a,t,.12,.35,'bandpass',1400); tn(a,t,520,.12,'triangle',.1,260); break;
    case 'card': nz(a,t,.1,.22,'bandpass',2800); break;
    case 'flip': nz(a,t,.06,.25,'highpass',3000); tn(a,t,1200,.05,'triangle',.04); break;
    case 'dice': for(let k=0;k<6;k++) nz(a,t+k*.07+Math.random()*.03,.05,.3,'bandpass',1800+Math.random()*1200); break;
    case 'ding': tn(a,t,1320,.5,'sine',.1); tn(a,t+.07,1760,.4,'sine',.06); break;
    case 'error': tn(a,t,220,.25,'square',.05,160); break;
    case 'win': [523,659,784,1046].forEach((f,k)=>tn(a,t+k*.12,f,.4,'triangle',.11)); break;
    case 'lose': [392,330,262].forEach((f,k)=>tn(a,t+k*.16,f,.45,'triangle',.1)); break;
    case 'splash': nz(a,t,.5,.3,'lowpass',800); break;
    case 'boom': nz(a,t,.7,.6,'lowpass',300); tn(a,t,90,.6,'sawtooth',.15,40); break;
    case 'pop': tn(a,t,600,.08,'sine',.1,900); break;
  } }
function updSnd(){ const b=$('#sndBtn'); if(b) b.textContent=MUTED?'Son : non':'Son : oui'; }
document.addEventListener('click',e=>{
  if(!MUTED) ac();
  if(e.target.id==='modal'&&window.MODAL_CLOSABLE!==false){ closeModal(); return; }
  const t=e.target.closest('[data-c]'); if(!t) return;
  switch(t.dataset.c){
    case 'sound': MUTED=!MUTED; store('salle-mute',MUTED); updSnd(); break;
    case 'help': GAME.help(); break;
    case 'new': GAME.menu(); break;
    case 'close': closeModal(); break;
  }
});
addEventListener('DOMContentLoaded',updSnd);

/* cartes à jouer communes (jeu de 52 + jokers) */
const SUITS=['♠','♥','♦','♣'], SUITN=['pique','cœur','carreau','trèfle'];
const RLAB={1:'A',11:'V',12:'D',13:'R',14:'A'};
const rlab=r=>RLAB[r]||String(r);
const isRed=c=>c.s===1||c.s===2;
function cardHTML(c,opts){ opts=opts||{}; if(!c||opts.back) return `<div class="pcard back ${opts.cls||''}" ${opts.attr||''}><div class="bk"></div></div>`;
  if(c.j) return `<div class="pcard joker ${opts.cls||''}" ${opts.attr||''}><div class="fc"><div class="ix">J<small>★</small></div><div class="big"><span>JOKER</span></div></div></div>`;
  const face=c.r>=11&&c.r<=13, s=SUITS[c.s];
  return `<div class="pcard ${isRed(c)?'red':'blk'} ${opts.cls||''}" ${opts.attr||''}><div class="fc"><div class="ix">${rlab(c.r)}<small>${s}</small></div><div class="ix b">${rlab(c.r)}<small>${s}</small></div><div class="big ${face?'face':''}">${face?`<span>${rlab(c.r)}${s}</span>`:(c.r===1||c.r===14)?`<b>${s}</b>`:s}</div></div></div>`; }
function deck52(lo){ const d=[]; for(let s=0;s<4;s++) for(let r=lo||2;r<=14;r++) d.push({s,r,id:s*20+r}); return d; }
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }


/* ===== moteur ===== */
const IS_NODE=typeof window==='undefined';
const rv=c=>c.r===2?15:c.r;
const ROLES={5:['Président','Vice-président','Neutre','Vice-trou','Trou'],4:['Président','Vice-président','Vice-trou','Trou'],3:['Président','Neutre','Trou'],6:['Président','Vice-président','Neutre','Neutre','Vice-trou','Trou']};
function groups(hand){ const g={}; hand.forEach(c=>{ (g[rv(c)]=g[rv(c)]||[]).push(c); }); return g; }
function aiChoice(hand,cur,opt,level){ // cur: {rank,count} ou null
  const g=groups(hand), ranks=Object.keys(g).map(Number).sort((a,b)=>a-b), noise=()=>Math.random()*({facile:6,normal:1.2,difficile:0.2}[level]||1);
  if(!cur){ // ouverture
    const cand=ranks.filter(r=>r!==15||ranks.length===1||hand.length<=g[15].length+1);
    const r=(cand.length?cand:ranks).map(r=>({r,v:r-g[r].length*1.5+noise()})).sort((a,b)=>a.v-b.v)[0].r; return g[r]; }
  const ok=ranks.filter(r=>(r>cur.rank||(opt.equal&&r===cur.rank))&&g[r].length>=cur.count);
  if(!ok.length) return null;
  const sc=ok.map(r=>{ let v=r+(g[r].length>cur.count?(g[r].length-cur.count)*4:0)+noise(); if(r===15&&hand.length>cur.count+3) v+=12; if(r>=13&&hand.length>8) v+=3; return {r,v}; }).sort((a,b)=>a.v-b.v);
  const best=sc[0]; if(best.r===15&&hand.length>6&&Math.random()<.6) return null;
  return g[best.r].slice(0,cur.count); }
if(IS_NODE) module.exports={aiChoice,groups,rv};
else {
/* ===== interface ===== */
let P=null, GEN=0, SEL=new Set(), WAIT=null; const GAME={help,menu};
const AIN=['Gaspard','Héloïse','Basile','Margot','Félix'];
function newMatch(cfg){ GEN++; P={cfg,players:Array.from({length:cfg.n},(_,i)=>({name:i===0?cfg.me:AIN[i-1],ai:i>0,hand:[],role:null,score:0,done:false})),round:0}; newRound(); }
function sortHand(h){ h.sort((a,b)=>rv(a)-rv(b)||a.s-b.s); }
async function newRound(){ const my=GEN; P.round++; const d=shuffleArr(deck52(2)); P.players.forEach(p=>{ p.hand=[]; p.done=false; p.said=''; });
  d.forEach((c,i)=>P.players[i%P.players.length].hand.push(c)); P.players.forEach(p=>sortHand(p.hand));
  P.finish=[]; P.trick=null; P.passes=0; render();
  if(P.round>1) await exchange(); if(my!==GEN) return;
  P.cur=P.round===1?P.players.findIndex(p=>p.hand.some(c=>c.r===3&&c.s===3)):P.players.findIndex(p=>p.role==='Trou');
  P.lead=P.cur; render(); turn(); }
async function exchange(){ const n=P.players.length; const idx=r=>P.players.findIndex(p=>p.role===r);
  const pairs=[['Trou','Président',2]]; if(n>=4) pairs.push(['Vice-trou','Vice-président',1]);
  for(const [low,high,k] of pairs){ const L=idx(low), H=idx(high); if(L<0||H<0) continue;
    const give=P.players[L].hand.splice(-k,k); P.players[H].hand.push(...give); sortHand(P.players[H].hand);
    let back; if(P.players[H].ai) back=P.players[H].hand.splice(0,k); else back=await chooseGive(H,k,give);
    P.players[L].hand.push(...back); sortHand(P.players[L].hand);
    if(L===0) toast(`Tu donnes ${give.map(c=>rlab(c.r)+SUITS[c.s]).join(' ')} et reçois ${back.map(c=>rlab(c.r)+SUITS[c.s]).join(' ')}.`);
    render(); }
}
function chooseGive(H,k,got){ return new Promise(res=>{ SEL=new Set(); WAIT={give:k,res,got}; render(); }); }
function render(){ const n=P.players.length;
  $('#opps').innerHTML=P.players.slice(1).map((p,k)=>{ const i=k+1; return `<div class="opp ${i===P.cur&&!P.over?'cur':''} ${p.done?'done':''}"><div class="nm">${esc(p.name)}</div><div class="role">${p.done?'✓ '+(P.finish.indexOf(i)+1)+'ᵉ':p.role||''}</div><div class="bk">${Array.from({length:Math.min(p.hand.length,13)},()=>cardHTML(null,{back:1})).join('')}</div><small>${p.hand.length} carte${p.hand.length>1?'s':''}</small>${p.said?`<div class="said">${esc(p.said)}</div>`:''}</div>`; }).join('');
  const t=P.trick; $('#felt').innerHTML=`<div class="pile">${t?`<span class="who">${esc(P.players[t.by].name)}</span>${t.cards.map(c=>cardHTML(c,{cls:'in'})).join('')}`:'<span style="opacity:.6;font-weight:800">Nouveau pli</span>'}</div><div class="info">Manche ${P.round}${t?` · ${t.count===1?'carte seule':t.count===2?'paire':t.count===3?'brelan':'carré'}`:''}</div>`;
  const me=P.players[0], myTurn=WAIT&&WAIT.play;
  $('#mehead').innerHTML=`${esc(me.name)} <span class="role">${me.done?'✓ terminé':me.role||''}</span><span class="acts2">${WAIT&&WAIT.give?`<button class="btn pri" data-a="give" ${SEL.size===WAIT.give?'':'disabled'}>Donner ${WAIT.give} carte${WAIT.give>1?'s':''}</button>`:myTurn?`<button class="btn" data-a="pass" ${P.trick?'':'disabled'}>Passer</button><button class="btn pri" data-a="play" ${validSel()?'':'disabled'}>Jouer</button>`:''}</span>`;
  $('#hand').innerHTML=me.hand.map((c,i)=>cardHTML(c,{cls:(SEL.has(i)?'sel ':'')+((myTurn||WAIT&&WAIT.give)?'play':''),attr:`data-c="${i}"`})).join('');
  const st=$('#status'), cp=P.players[P.cur];
  st.style.setProperty('--pc',P.over?'#5a2a7a':P.cur===0?'#2f8a4a':'#7a1f2a');
  st.innerHTML=WAIT&&WAIT.give?`<span class="who">Échange</span><span class="msg">Tu as reçu ${WAIT.got.map(c=>rlab(c.r)+SUITS[c.s]).join(' ')}. Choisis ${WAIT.give} carte${WAIT.give>1?'s':''} à rendre.</span>`:P.over?`<span class="who">${esc(P.over)}</span>`:cp?`<span class="who">${esc(cp.name)}</span><span class="msg">${P.cur===0?(P.trick?`Joue ${P.trick.count} carte${P.trick.count>1?'s':''} plus forte${P.trick.count>1?'s':''} que ${rlab(P.trick.cards[0].r)}, ou passe.`:'Tu ouvres : joue une carte, une paire, un brelan ou un carré.'):'réfléchit…'}</span>`:''; }
function validSel(){ if(!WAIT||!WAIT.play) return false; const cs=[...SEL].map(i=>P.players[0].hand[i]); if(!cs.length) return false; const r=rv(cs[0]); if(!cs.every(c=>rv(c)===r)) return false;
  if(!P.trick) return true; return cs.length===P.trick.count&&(r>P.trick.rank||(P.cfg.equal&&r===P.trick.rank)); }
const active=()=>P.players.map((p,i)=>i).filter(i=>!P.players[i].done);
function nextActive(i){ const n=P.players.length; for(let k=1;k<=n;k++){ const j=(i+k)%n; if(!P.players[j].done) return j; } return -1; }
async function turn(){ const my=GEN; if(P.over) return; const p=P.players[P.cur];
  if(!p.ai){ WAIT={play:true}; SEL=new Set(); render(); return; }
  WAIT=null; render(); await wait(P.cfg.speed); if(my!==GEN) return;
  const cards=aiChoice(p.hand,P.trick,P.cfg,p.level||P.cfg.level); if(cards) act(cards); else act(null); }
function act(cards){ const i=P.cur, p=P.players[i]; WAIT=null; SEL=new Set();
  if(cards){ cards.forEach(c=>p.hand.splice(p.hand.indexOf(c),1)); P.trick={cards,count:cards.length,rank:rv(cards[0]),by:i}; P.passes=0; p.said=''; P.players.forEach((q,k)=>{ if(k!==i) q.said=''; }); sfx(cards.length>1?'capture':'card');
    if(!p.hand.length){ p.done=true; P.finish.push(i); toast(`${p.name} n'a plus de cartes : ${P.finish.length}ᵉ !`); sfx('ding'); }
    if(active().length<=1){ const last=active()[0]; if(last!=null){ P.finish.push(last); P.players[last].done=true; } endRound(); return; }
    if(P.cfg.twoCloses&&P.trick.rank===15){ toast('Le 2 ferme le pli !'); return closeTrick(i); }
    if(P.trick.count===4){ return closeTrick(i); } }
  else { p.said='Passe'; P.passes++; sfx('click'); }
  // fin du pli : tous les autres joueurs actifs ont passé depuis le dernier coup
  const others=active().filter(k=>k!==P.trick.by).length;
  if(P.trick&&P.passes>=(P.players[P.trick.by].done?active().length:others)){ return closeTrick(P.trick.by); }
  P.cur=nextActive(i); render(); turn(); }
async function closeTrick(winner){ const my=GEN; render(); await wait(900); if(my!==GEN) return; P.trick=null; P.passes=0; P.players.forEach(q=>q.said='');
  P.cur=P.players[winner].done?nextActive(winner):winner; render(); turn(); }
function endRound(){ const n=P.players.length, roles=ROLES[n]; P.finish.forEach((pi,k)=>{ P.players[pi].role=roles[k]; P.players[pi].score+=n-1-k; });
  P.over=`${P.players[P.finish[0]].name} est Président !`; render(); const me=P.finish.indexOf(0);
  banner(me===0?'Président !':roles[me],me===0?'Bravo, tu gagnes la manche':`Tu finis ${me+1}ᵉ`,me===0?'#2f8a4a':me===n-1?'#5a1a1a':'#7a5a1a'); sfx(me===0?'win':me===n-1?'lose':'ding'); if(me===0) confetti();
  setTimeout(()=>openModal(`<h2>Fin de la manche ${P.round}</h2><table style="width:100%;border-collapse:collapse">${P.finish.map((pi,k)=>`<tr><td style="padding:4px"><b>${k+1}.</b> ${esc(P.players[pi].name)}</td><td><b>${roles[k]}</b></td><td style="text-align:right">${P.players[pi].score} pts</td></tr>`).join('')}</table><p style="font-size:14px">À la prochaine manche, le Trou donne ses ${n>=4?'deux':'deux'} meilleures cartes au Président, qui lui en rend deux de son choix${n>=4?' (et le Vice-trou une au Vice-président)':''}.</p><div class="acts"><button class="btn pri" data-a="next">Manche suivante</button></div>`),1600); }
document.addEventListener('click',e=>{ if(!P) return; const c=e.target.closest('#hand .pcard.play');
  if(c){ const i=+c.dataset.c; if(SEL.has(i)) SEL.delete(i); else { if(WAIT&&WAIT.give&&SEL.size>=WAIT.give) return; if(WAIT&&WAIT.play){ const r=rv(P.players[0].hand[i]); [...SEL].forEach(j=>{ if(rv(P.players[0].hand[j])!==r) SEL.delete(j); }); } SEL.add(i); } sfx('click'); render(); return; }
  const a=e.target.closest('[data-a]'); if(!a) return;
  switch(a.dataset.a){ case 'play': if(validSel()){ const h=P.players[0].hand; act([...SEL].sort((x,y)=>x-y).map(i=>h[i])); } break;
    case 'pass': if(WAIT&&WAIT.play&&P.trick) act(null); break;
    case 'give': if(WAIT&&WAIT.give&&SEL.size===WAIT.give){ const h=P.players[0].hand; const cs=[...SEL].sort((x,y)=>y-x).map(i=>h.splice(i,1)[0]); const r=WAIT.res; WAIT=null; SEL=new Set(); r(cs); } break;
    case 'next': closeModal(); P.over=null; newRound(); break;
    case 'scores': openModal(`<h2>Scores</h2><table style="width:100%">${P.players.slice().sort((a,b)=>b.score-a.score).map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.role||''}</td><td style="text-align:right">${p.score}</td></tr>`).join('')}</table><p style="font-size:14px">Chaque manche : ${P.players.length-1} points au Président, puis un de moins à chaque place.</p><div class="acts"><button class="btn pri" data-c="close">OK</button></div>`); break; } });
let M={n:4,level:'normal',me:'Toi',equal:false,twoCloses:true,speed:700};
function menu(){ const draw=()=>paintModal(`<h2>Nouvelle partie</h2><h4>Joueurs</h4><div class="seg">${[3,4,5,6].map(n=>`<button class="${M.n===n?'on':''}" data-m="n:${n}">${n}</button>`).join('')}</div>
  <div class="prow">Ton prénom <input type="text" id="me" value="${esc(M.me)}" placeholder="Toi" maxlength="14"></div>
  <h4>Niveau des adversaires</h4><div class="seg">${['facile','normal','difficile'].map(l=>`<button class="${M.level===l?'on':''}" data-m="level:${l}">${l}</button>`).join('')}</div>
  <h4>Règles</h4><div class="seg"><button class="${M.twoCloses?'on':''}" data-m="twoCloses:1">Le 2 ferme le pli</button><button class="${!M.twoCloses?'on':''}" data-m="twoCloses:0">Le 2 ne ferme pas</button></div> <div class="seg"><button class="${!M.equal?'on':''}" data-m="equal:0">Strictement plus fort</button><button class="${M.equal?'on':''}" data-m="equal:1">Égalité permise</button></div>
  <h4>Vitesse</h4><div class="seg">${[[1100,'lente'],[700,'normale'],[300,'rapide']].map(([v,l])=>`<button class="${M.speed===v?'on':''}" data-m="speed:${v}">${l}</button>`).join('')}</div>
  <div class="acts">${P?'<button class="btn" data-c="close">Annuler</button>':''}<button class="btn pri" data-m="start">Distribuer</button></div>`);
  draw(); $('#mbox').onclick=e=>{ const x=e.target.closest('[data-m]'); if(!x) return; M.me=$('#me').value; const [k,v]=x.dataset.m.split(':');
    if(k==='start'){ closeModal(); M.me=M.me.trim()||'Toi'; store('pres-prefs',M); newMatch({...M}); return; }
    M[k]=k==='level'?v:(k==='equal'||k==='twoCloses')?v==='1':+v; draw(); }; }
function help(){ openModal(`<h2>Président</h2><ul><li>Toutes les cartes sont distribuées. Ordre : 3 &lt; 4 &lt; … &lt; Roi &lt; As &lt; <b>2</b> (le plus fort).</li><li>Celui qui ouvre pose une carte seule, une paire, un brelan ou un carré. Les suivants doivent poser <b>le même nombre</b> de cartes, plus fortes, ou passer.</li><li>Quand tout le monde passe, le dernier à avoir joué ramasse le pli et rouvre. Un carré (et le 2, selon la règle) ferme le pli.</li><li>Le premier sans carte devient <b>Président</b>, le dernier <b>Trou</b>. À la manche suivante, le Trou donne ses 2 meilleures cartes au Président, qui lui en rend 2 au choix (idem 1 carte entre Vice-trou et Vice-président).</li></ul><p>Touche tes cartes de même valeur puis « Jouer ».</p><div class="acts"><button class="btn pri" data-c="close">Compris</button></div>`); }
window.__T={get P(){return P},get WAIT(){return WAIT},set SEL(v){SEL=v},act,aiChoice};
(function boot(){ const p=load('pres-prefs'); if(p) Object.assign(M,p); menu(); })();
}
</script></body></html>
