<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Duel des Âges : jeu de civilisation à deux, contre l'IA ou à 2 joueurs, avec les modules Panthéon et Agora.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Duel des Âges</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Plateau nocturne lapis-lazuli, accents bronze ; plateau central + colonne latérale (marché des jetons, Panthéon, Sénat, chronique) */
:root{
  --night:#0f1430; --night2:#161d40; --panel:#1c2450; --panel2:#26306a; --line:#384480;
  --ink:#f0ead8; --mute:#a9a8c4; --bronze:#d9a54f; --bronze-d:#8f6427;
  --p0:#eab85a; --p1:#7cc6da; --good:#74c98f; --bad:#e8705f;
  --display:'Marcellus',Georgia,'Times New Roman',serif;
  --body:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --c-brown:#8a5a34; --c-grey:#7f8492; --c-red:#b33d2b; --c-green:#3a8b4c; --c-blue:#3668b0;
  --c-yellow:#cf9d1f; --c-purple:#74469a; --c-temple:#cfc3a1; --c-senate:#2a2a34;
  --parch:#efe5cb; --parch-ink:#231d14;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);background-image:radial-gradient(1200px 600px at 50% -10%,#24306b 0%,transparent 70%),radial-gradient(800px 500px at 100% 100%,#1b2350 0%,transparent 70%);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[data-a]:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(15,20,48,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:22px;letter-spacing:.04em;color:var(--bronze);white-space:nowrap}
.status{flex:1;min-width:0;font-weight:500;color:var(--mute)}
.status b{color:var(--ink)}
@media (max-width:640px){.logo{font-size:19px}.status{order:9;flex-basis:100%;font-size:14px}.hbtn{padding:4px 8px;font-size:13px}.top .spacer{flex:1}}
.age-pill{font-family:var(--display);border:1px solid var(--bronze-d);color:var(--bronze);padding:2px 10px;border-radius:999px;font-size:14px}
.hbtn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--ink);font-size:14px}
.hbtn:hover{border-color:var(--bronze)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;padding-block:16px 40px}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}
main,aside{min-width:0;display:flex;flex-direction:column;gap:14px}

/* Cité */
.city{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;position:relative}
.city.active{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc) inset}
.city.p0{--pc:var(--p0)} .city.p1{--pc:var(--p1)}
.city-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.city-name{font-family:var(--display);font-size:18px;color:var(--pc)}
.turnflag{font-size:12px;text-transform:uppercase;letter-spacing:.08em;background:var(--pc);color:#151515;border-radius:4px;padding:1px 6px;font-weight:800}
.purse{margin-left:auto;display:flex;gap:8px;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);min-width:62px}
.pr{display:inline-flex;align-items:center;gap:2px;background:var(--night2);border-radius:6px;padding:2px 5px;font-variant-numeric:tabular-nums;font-size:13px}
.pr.zero{opacity:.38}
.pr.ch{border:1px dashed var(--bronze-d)}
.pr.tr{border:1px solid var(--c-yellow)}
.pr i{font-style:normal;color:var(--mute);font-size:11px}
.chip{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:5px;background:var(--cc);color:#fff;font-weight:800;font-size:12px;padding:0 4px;font-variant-numeric:tabular-nums}
.col-brown{--cc:var(--c-brown)}.col-grey{--cc:var(--c-grey)}.col-red{--cc:var(--c-red)}.col-green{--cc:var(--c-green)}.col-blue{--cc:var(--c-blue)}.col-yellow{--cc:var(--c-yellow)}.col-purple{--cc:var(--c-purple)}.col-temple{--cc:var(--c-temple)}.col-senate{--cc:var(--c-senate)}
.chip.col-temple{color:#2a2414}
.wonders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:520px){.wonders{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wtile{background:linear-gradient(180deg,#2c3672,#222a5a);border:1px solid var(--line);border-radius:8px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left}
.wtile.built{background:linear-gradient(180deg,#5b4317,#3a2a0f);border-color:var(--bronze)}
.wtile.dead{opacity:.32;filter:grayscale(1)}
.wn{font-family:var(--display);font-size:14px;line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.wdesc{display:flex;flex-direction:column;gap:1px;font-size:12px;line-height:1.25;color:#e8e2cf}
.wdesc span::before{content:"▸ ";color:var(--bronze)}
.wtile.built .wdesc{color:#fff3d6}
.wcl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-right:3px}
.wtile[data-a]{cursor:pointer}
.wtile[data-a]:hover{border-color:var(--bronze)}
.wsplash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:36;padding:16px}
.wsplash>div{background:linear-gradient(180deg,#6a4c18,#2e2109);border:2px solid var(--bronze);color:#fff3d6;border-radius:16px;padding:18px 26px;max-width:460px;box-shadow:0 0 60px rgba(255,190,80,.45);animation:wsp 2.6s ease-out forwards;text-align:center}
.wsplash h4{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:clamp(24px,5vw,34px);color:#ffd77a}
.wsplash .by{font-size:13px;opacity:.8;margin-bottom:10px}
.wsplash ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:16px;font-weight:700}
@keyframes wsp{0%{opacity:0;transform:scale(.6) rotate(-3deg)}12%{opacity:1;transform:scale(1.05)}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
.wfx,.wc{display:flex;flex-wrap:wrap;gap:2px;align-items:center;--is:14px}
.wtile .badge{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--bronze)}
.extras{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--mute)}
.xbtn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:13px}
.xbtn.hot{border-color:var(--bronze);color:var(--bronze)}

/* Icônes */
.ic{width:var(--is,14px);height:var(--is,14px);display:inline-block;vertical-align:middle;flex:none}
.coin{display:inline-grid;place-items:center;width:var(--is,16px);height:var(--is,16px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe08a,#c9921c 70%);color:#3a2604;font-weight:800;font-size:calc(var(--is,16px)*.62);font-variant-numeric:tabular-nums;flex:none;border:1px solid #8a5f0e}
.coin.big{--is:24px}
.coin.neg{background:radial-gradient(circle at 35% 30%,#ffb3a6,#b2412f 70%);color:#fff;border-color:#6d1f13;width:auto;padding:0 3px;border-radius:999px}
.vp{display:inline-grid;place-items:center;min-width:var(--is,16px);height:var(--is,16px);border-radius:4px;background:#2f6a3b;color:#e8ffe9;font-weight:800;font-size:calc(var(--is,16px)*.62);padding:0 2px;clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%);flex:none}
.sci{display:inline-grid;place-items:center;width:var(--is,16px);height:var(--is,16px);border-radius:4px;background:#1f5e2c;color:#e9f6d8;flex:none}
.sci svg{width:82%;height:82%}
.cube{display:inline-block;width:calc(var(--is,14px)*.75);height:calc(var(--is,14px)*.75);background:#d8d8e0;border:1px solid #333;transform:rotate(45deg);margin:0 1px}
.cube.p0{background:var(--p0)} .cube.p1{background:var(--p1)}
.gtag{display:inline-block;font-size:calc(var(--is,14px)*.62);line-height:1;padding:2px 3px;border-radius:3px;background:rgba(0,0,0,.35);color:#fff;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.gtag.x{background:#7a1f14}
.choice,.trade,.per{display:inline-flex;align-items:center;gap:1px;background:rgba(0,0,0,.22);border-radius:3px;padding:1px}
.choice i,.per i{font-style:normal;font-size:calc(var(--is,14px)*.6);color:#fff;opacity:.8}
.trade{outline:1px solid #ffe08a}
.minichip{display:inline-block;width:calc(var(--is,14px)*.8);height:calc(var(--is,14px)*.95);border-radius:2px;background:var(--cc);border:1px solid rgba(0,0,0,.4)}
.mtag{display:inline-grid;place-items:center;font-size:calc(var(--is,14px)*.6);font-weight:800;width:var(--is,14px);height:var(--is,14px);background:#3c2a0c;color:#ffd77a;border-radius:3px}

/* Piste militaire */
.track{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.cap{font-family:var(--display);font-size:12px;writing-mode:horizontal-tb;white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis}
.cap.p0{color:var(--p0)} .cap.p1{color:var(--p1);text-align:right}
.cells{flex:1;display:grid;grid-template-columns:repeat(19,minmax(0,1fr));gap:2px;min-width:0}
.cell{height:26px;border-radius:3px;background:#262f62;position:relative;display:grid;place-items:center}
.cell.z1{background:#2e3a78}.cell.z2{background:#3a3a7a}.cell.z3{background:#55306a}
.cell.mid{background:#4b5596}
.cell.end{background:#7a2a2a}
.pawn{width:70%;aspect-ratio:1;max-width:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9d8a,#b8261a 70%);border:1px solid #4a0c06;box-shadow:0 0 8px rgba(255,90,70,.6);position:relative;z-index:2}
.loot{position:absolute;bottom:-9px;font-size:10px;font-weight:800;color:#3a2604;background:#e7b84a;border-radius:3px;padding:0 3px;line-height:14px;z-index:1}
.mil-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:-6px;padding:0 4px}

/* Structure */
.board-card{background:linear-gradient(180deg,rgba(38,48,106,.55),rgba(22,29,64,.4));border:1px solid var(--line);border-radius:14px;padding:14px 10px 18px}
.board-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 4px 10px;flex-wrap:wrap}
.board-title h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px;color:var(--bronze)}
.board-title span{font-size:13px;color:var(--mute)}
.struct-wrap{max-width:640px;margin:0 auto;width:100%;container-type:inline-size}
.struct{position:relative;width:100%}
.slot{position:absolute;--cw:15.3cqw;width:var(--cw);height:calc(var(--cw)*1.4);transition:transform .15s ease, filter .15s}
.slot.acc{cursor:pointer}
.slot.acc .card{box-shadow:0 0 0 2px var(--bronze),0 4px 12px rgba(0,0,0,.5)}
.slot.acc:hover{transform:translateY(-4px)}
.slot.hl{transform:translateY(-8px) scale(1.06);z-index:50!important}
.slot.hl .card{box-shadow:0 0 0 3px var(--p1),0 0 22px var(--p1)}
.slot.wait .card{filter:brightness(.82)}
.cw{width:var(--cw);height:calc(var(--cw)*1.4);flex:none}
.card{width:100%;height:100%;border-radius:calc(var(--cw)*.08);background:var(--parch);color:var(--parch-ink);display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(0,0,0,.45);box-shadow:0 3px 8px rgba(0,0,0,.45);--is:calc(var(--cw)*.2);position:relative}
.card .band{background:var(--cc);min-height:42%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:calc(var(--cw)*.025);padding:calc(var(--cw)*.04)}
.card.col-temple .band{background:linear-gradient(135deg,#e7dcb8,#b9a77a)}
.card.col-senate .band{background:linear-gradient(135deg,#3a3a46,#1d1d24);border-bottom:1px solid #9a9ab0}
.card .nm{font-weight:700;font-size:clamp(6.5px,calc(var(--cw)*.115),14px);line-height:1.1;padding:calc(var(--cw)*.035) calc(var(--cw)*.05) 0;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .cost{margin-top:auto;display:flex;flex-wrap:wrap;gap:1px;padding:calc(var(--cw)*.04);align-items:center;--is:calc(var(--cw)*.17)}
.lk{font-size:calc(var(--cw)*.085);font-weight:800;background:#e2d3a8;border:1px solid #9b8550;border-radius:3px;padding:0 2px;color:#5a4416}
.card.back{background:linear-gradient(145deg,var(--b1),var(--b2));display:grid;place-items:center;color:rgba(255,255,255,.85);font-family:var(--display);font-size:calc(var(--cw)*.32)}
.card.back.a1{--b1:#7a5a26;--b2:#4b3512}.card.back.a2{--b1:#2d5b8f;--b2:#173352}.card.back.a3{--b1:#6a3c86;--b2:#3a1f4c}
.card.back::after{content:"";position:absolute;inset:calc(var(--cw)*.06);border:1px solid rgba(255,255,255,.3);border-radius:calc(var(--cw)*.05)}
.seal{position:absolute;top:calc(var(--cw)*-.08);right:calc(var(--cw)*-.08);width:calc(var(--cw)*.34);height:calc(var(--cw)*.34);border-radius:50%;background:var(--sc);border:2px solid #f3e6c0;display:grid;place-items:center;font-family:var(--display);font-size:calc(var(--cw)*.17);color:#fff;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.offer{position:absolute;top:calc(var(--cw)*-.08);left:calc(var(--cw)*-.08);min-width:calc(var(--cw)*.34);height:calc(var(--cw)*.34);border-radius:999px;background:#f3e6c0;color:#3a2a10;display:grid;place-items:center;font-weight:800;font-size:calc(var(--cw)*.15);z-index:3;border:2px solid #b68a3a;padding:0 2px}

/* Colonne latérale */
.side-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.side-box h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:17px;color:var(--bronze);display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.side-box h3 small{font-family:var(--body);font-size:12px;color:var(--mute)}
.tokens{display:flex;flex-wrap:wrap;gap:8px}
.tok{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#4fa265,#1f5a30 75%);border:2px solid #9cd4a7;color:#fff;font-family:var(--display);font-size:12px;display:grid;place-items:center;text-align:center;line-height:1.05;padding:2px}
.tok.sm{width:32px;height:32px;font-size:10px;border-width:1px}
.pan{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.gslot{background:var(--night2);border:1px dashed var(--line);border-radius:8px;min-height:74px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.gslot.full{border-style:solid;border-color:var(--gc);background:linear-gradient(180deg,color-mix(in srgb,var(--gc) 35%,var(--night2)),var(--night2))}
.gslot.can{cursor:pointer;box-shadow:0 0 0 2px var(--bronze)}
.gslot .gn{font-family:var(--display);font-size:13px}
.gslot .gcu{font-size:9px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gslot{min-width:0}
.senate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chamber{background:var(--night2);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px;display:flex;flex-direction:column;gap:3px;text-align:left}
.chamber.c0{border-color:var(--p0);box-shadow:0 0 0 1px var(--p0) inset}
.chamber.c1{border-color:var(--p1);box-shadow:0 0 0 1px var(--p1) inset}
.chamber b{font-family:var(--display);font-weight:400;font-size:13px}
.chamber .cnt{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-weight:800}
.chamber .cnt .a{color:var(--p0)} .chamber .cnt .b{color:var(--p1)}
.log{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:3px;max-height:260px;overflow:auto}
.log div:first-child{color:var(--ink)}
.log .age{color:var(--bronze);font-family:var(--display)}
.discard-btn{width:100%;text-align:left;background:var(--night2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}

/* Modale */
#modal{position:fixed;inset:0;z-index:40;background:rgba(5,8,22,.72);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#modal[hidden]{display:none}
.mpanel{background:var(--night2);border:1px solid var(--bronze-d);border-radius:14px;max-width:620px;width:100%;max-height:min(86vh,860px);overflow:auto;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mpanel.wide{max-width:860px}
.mpanel h3{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:22px;color:var(--bronze);text-wrap:balance}
.sub{color:var(--mute);margin:0 0 10px;font-size:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.opt:hover:not(:disabled){border-color:var(--bronze)}
.opt:disabled{opacity:.42;cursor:not-allowed}
.opt .ot{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt .ot b{font-family:var(--display);font-weight:400;font-size:16px}
.opt .ot span{font-size:13px;color:var(--mute)}
.opts.grid .opt{flex-direction:column;align-items:stretch}
.opts.grid .wtile{--is:18px}
.opts.grid .wn{font-size:16px}
.sheet{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sheet ul{margin:0;padding-left:18px;font-size:14px}
.sheet>div:last-child{flex:1;min-width:180px}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.act{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.act b{font-weight:700}
.act span{font-size:12px;color:var(--mute)}
.act.main{border-color:var(--bronze)}
.act:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line);border-radius:9px;padding:8px 14px;margin-top:12px}
.cardgrid{display:flex;flex-wrap:wrap;gap:8px;--cw:76px}
.colhead{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:12px 0 6px}
table.score{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin:8px 0}
table.score td,table.score th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right}
table.score td:first-child,table.score th:first-child{text-align:left}
table.score tr.tot td{font-weight:800;font-size:17px;border-bottom:none;color:var(--bronze)}
table.score th.p0{color:var(--p0)} table.score th.p1{color:var(--p1)}

/* Menu */
.menu{max-width:760px;margin:0 auto;padding-block:40px 60px;display:flex;flex-direction:column;gap:22px}
.menu h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,72px);line-height:1;margin:0;color:var(--bronze);text-wrap:balance;letter-spacing:.02em}
.menu .lead{font-size:18px;max-width:58ch;color:var(--ink);margin:0}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.pbtn b{font-family:var(--display);font-weight:400;font-size:19px}
.pbtn span{color:var(--mute);font-size:14px}
.pbtn.on{border-color:var(--bronze);background:linear-gradient(180deg,#3a3418,var(--panel));box-shadow:0 0 0 1px var(--bronze) inset}
.menu h2{font-family:var(--display);font-weight:400;font-size:15px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);margin:0 0 8px}
.go{background:linear-gradient(180deg,#e6b45d,#a87526);color:#22170a;border:none;border-radius:12px;padding:14px 22px;font-family:var(--display);font-size:20px;align-self:flex-start}
.preview{display:flex;gap:8px;--cw:70px;flex-wrap:wrap}
.rules h4{font-family:var(--display);font-weight:400;color:var(--bronze);margin:14px 0 4px;font-size:17px}
.rules p,.rules li{font-size:14px;max-width:65ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--bronze-d);border-radius:999px;padding:8px 16px;z-index:30;font-size:14px;max-width:calc(100% - 32px);text-align:center}
/* Illustrations, lisibilité, tour, animations */
.card .band{background-size:cover;background-position:center bottom;position:relative}
.fxbox{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:calc(var(--cw)*.025);background:rgba(250,244,226,.9);border-radius:calc(var(--cw)*.06);padding:calc(var(--cw)*.03) calc(var(--cw)*.045);box-shadow:0 1px 3px rgba(0,0,0,.4);max-width:100%}
.card{--is:calc(var(--cw)*.24)}
.card .cost{--is:calc(var(--cw)*.19)}
.ic{filter:drop-shadow(0 0 .5px rgba(0,0,0,.6))}
.pr .ic{--is:20px}
.pr{padding:3px 6px;font-size:14px}
.pr .rn{font-size:11px;color:var(--mute)}
.hrow{display:flex;align-items:center;gap:12px;padding-block:10px}
.hrow .spacer{flex:1}
.short{display:none}@media (max-width:520px){.long{display:none}.short{display:inline}}
.turnbar{background:var(--tc);color:#16120a;transition:background .3s}
.turnbar .wrap{display:flex;align-items:center;gap:10px;padding-block:7px;font-size:15px;font-weight:700;flex-wrap:wrap}
.turnbar .who{font-family:var(--display);font-size:19px;font-weight:400}
.turnbar .hint{font-weight:500;opacity:.85}
.turnbar .dot{width:12px;height:12px;border-radius:50%;background:#16120a;animation:blink 1.2s ease-in-out infinite}
.turnbar.done{background:var(--panel2);color:var(--ink)}
.turnbar.done .dot{display:none}
@keyframes blink{50%{opacity:.25}}
.city.active{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 1px var(--pc) inset,0 0 22px color-mix(in srgb,var(--pc) 45%,transparent)}}
.city:not(.active){opacity:.82}
.city .ptsbig{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;background:#2f6a3b;color:#e8ffe9;border-radius:6px;padding:2px 8px}
.slot.acc .card{box-shadow:0 0 0 3px var(--tc,var(--bronze)),0 4px 14px rgba(0,0,0,.5);animation:accp 1.6s ease-in-out infinite}
@keyframes accp{50%{box-shadow:0 0 0 3px var(--tc,var(--bronze)),0 0 18px var(--tc,var(--bronze))}}
.qbtn{width:24px;height:24px;border-radius:50%;border:1px solid var(--bronze-d);background:transparent;color:var(--bronze);font-weight:800;font-size:13px;padding:0}
.float{position:fixed;z-index:45;pointer-events:none;font-weight:800;font-size:20px;display:flex;align-items:center;gap:4px;animation:floatUp 1.6s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.8);white-space:nowrap;transform:translate(-50%,0)}
.float.gain{color:#ffd76a}.float.loss{color:#ff7a66}.float.pts{color:#8ff0a6}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
.pawn.moved{animation:pawnpop .7s ease-out}
@keyframes pawnpop{0%{transform:scale(1.8)}100%{transform:scale(1)}}
.splash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:35}
.splash div{background:var(--tc);color:#16120a;font-family:var(--display);font-size:clamp(26px,6vw,46px);padding:14px 34px;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:splash 1.25s ease-out forwards;text-align:center}
.splash small{display:block;font-family:var(--body);font-size:15px;font-weight:700;opacity:.8}
@keyframes splash{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.04)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.96)}}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
.tab.on{border-color:var(--bronze);color:var(--bronze)}
.legend{width:100%;border-collapse:collapse;--cw:150px}
.legend td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
.legend td:first-child{width:72px;--is:24px;white-space:nowrap}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:14px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--bronze);color:#1a1205;font-weight:800;display:grid;place-items:center}
.ex{background:var(--panel);border-left:3px solid var(--bronze);border-radius:6px;padding:8px 10px;font-size:14px;margin:10px 0}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;font-size:13px}
.glist div{background:var(--panel);border-radius:6px;padding:6px 8px}
/* Cités visuelles */
.stacks{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;min-height:30px}
.stack{display:flex;flex-direction:column;position:relative;cursor:pointer;--cw:50px}
.stack .cw+.cw{margin-top:calc(var(--cw)*-1.4 + 23px)}
.stack .scount{position:absolute;top:-7px;right:-7px;z-index:5;background:var(--night);border:1px solid var(--line);color:var(--ink);font-size:11px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.stack .card .nm{display:none}
.empty-city{font-size:13px;color:var(--mute);padding:6px 0}
.cw.arrive{animation:arrive .7s ease-out}
@keyframes arrive{0%{transform:scale(1.35);filter:brightness(1.6)}100%{transform:none;filter:none}}
/* Animations de cartes */
.flying{position:fixed;z-index:44;pointer-events:none;will-change:transform}
.slot.flipin .card{animation:flipin .65s ease-out both}
@keyframes flipin{0%{transform:perspective(500px) rotateY(90deg);filter:brightness(1.8)}100%{transform:none;filter:none}}
.slot.deal{animation:deal .5s ease-out both}
@keyframes deal{0%{opacity:0;transform:translateY(-40px) rotate(-6deg)}100%{opacity:1;transform:none}}
.wtile.wbuild{animation:wbuild 1.4s ease-out}
@keyframes wbuild{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,200,90,0)}30%{transform:scale(1.12);box-shadow:0 0 30px 8px rgba(255,200,90,.8)}100%{transform:none;box-shadow:0 0 0 0 rgba(255,200,90,0)}}
/* Menaces */
.threats{display:flex;flex-wrap:wrap;gap:6px}
.threat{background:#5a1a16;border:1px solid var(--bad);color:#ffd9d2;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;animation:thr 1.6s ease-in-out infinite}
@keyframes thr{50%{background:#7a2219}}
.alerts{display:flex;flex-direction:column;gap:6px;margin:0 4px 10px}
.alert{border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;border:1px solid var(--bad);background:rgba(120,30,25,.35)}
.alert b{color:var(--ac)}
.warn{position:absolute;bottom:calc(var(--cw)*-.07);right:calc(var(--cw)*-.07);z-index:4;background:var(--bad);color:#fff;font-weight:800;border-radius:999px;padding:1px 5px;font-size:clamp(9px,calc(var(--cw)*.13),13px);box-shadow:0 2px 6px rgba(0,0,0,.5);white-space:nowrap}
.warn.win{background:var(--good);color:#0b2414}
.slot.danger .card{outline:3px solid var(--bad);outline-offset:1px}
/* Bataille */
.flyshield{position:fixed;z-index:46;pointer-events:none;width:44px;height:44px;margin:-22px 0 0 -22px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(255,80,50,.7))}
.flyshield svg{width:100%;height:100%}
.clash{position:fixed;z-index:46;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--display);font-size:34px;color:#ffd0c4;text-shadow:0 0 18px #ff3b1f,0 2px 4px #000;animation:clash 1.1s ease-out forwards;white-space:nowrap}
@keyframes clash{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.shake{animation:shake .5s linear}
@keyframes shake{10%,50%,90%{transform:translateX(-5px)}30%,70%{transform:translateX(5px)}}
.burst{position:fixed;z-index:45;pointer-events:none;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(circle,rgba(255,220,150,.95),rgba(255,90,40,.6) 40%,transparent 70%);animation:burst .6s ease-out forwards}
@keyframes burst{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.6);opacity:0}}
/* Chances de victoire */
.odds{display:flex;flex-direction:column;gap:14px;margin:8px 0}
.odd .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.odd .nm{font-family:var(--display);font-size:20px;color:var(--oc)}
.odd .pct{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--oc)}
.bar{height:14px;border-radius:999px;background:var(--night);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.bar .b0{background:var(--p0)}.bar .b1{background:var(--p1)}.bar .bd{background:var(--mute)}
.split{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.split span{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.crit{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;margin-top:6px}
.crit td,.crit th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:center}
.crit td:first-child,.crit th:first-child{text-align:left;color:var(--mute)}
.crit .lead{color:var(--good);font-weight:800}
.crit th.p0{color:var(--p0)}.crit th.p1{color:var(--p1)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--bronze);border-radius:50%;animation:spin 1s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.float,.splash{display:none}}
</style>

const has=(p,t)=>p.tokens.includes(t);

function fixedProd(p){const o={W:0,S:0,C:0,G:0,P:0};p.cards.forEach(c=>{if((c.col==='brown'||c.col==='grey')&&c.e.prod)for(const r of c.e.prod)o[r]++;});return o;}
function choiceSrc(p){const l=[];p.cards.forEach(c=>{if(c.e.choice)l.push(c.e.choice)});p.wonders.forEach(w=>{if(w.built&&w.e.choice)l.push(w.e.choice)});return l;}
function fixedTrade(p){const s=new Set();p.cards.forEach(c=>{if(c.e.trade)for(const r of c.e.trade)s.add(r)});return s;}
function controller(ch){return ch.cubes[0]>ch.cubes[1]?0:ch.cubes[1]>ch.cubes[0]?1:null;}
function ctl(key){if(!G.mods.agora)return null;const ch=G.senate.find(c=>c.d===key);return ch?controller(ch):null;}
function unitPrice(pi,r){const p=G.P[pi],o=G.P[1-pi];let v=(p.tradeAll||fixedTrade(p).has(r))?1:2+fixedProd(o)[r];if(ctl('peage')===1-pi)v+=1;return v;}
function chainOk(p,card){return !!card.e.from&&p.cards.some(c=>c.e.link===card.e.from);}
function costInfo(pi,cost,kind,col){
  const p=G.P[pi];const need={};const fp=fixedProd(p);
  for(const r in cost.res)need[r]=Math.max(0,cost.res[r]-fp[r]);
  let disc=0;
  if(kind==='wonder'){if(has(p,'archi'))disc+=2;if(ctl('travaux')===pi)disc+=1;}
  if(kind==='card'&&col==='blue'&&has(p,'macon'))disc+=2;
  const ch=choiceSrc(p);const price={};RES.forEach(r=>price[r]=unitPrice(pi,r));
  let best=null;
  const rec=(i)=>{
    if(i===ch.length){const u=[];for(const r in need)for(let k=0;k<need[r];k++)u.push(price[r]);u.sort((a,b)=>b-a);const rest=u.slice(disc);const t=rest.reduce((a,b)=>a+b,0);if(!best||t<best.trade)best={trade:t,units:rest.length};return;}
    let used=false;for(const r of ch[i]){if(need[r]>0){used=true;need[r]--;rec(i+1);need[r]++;}}if(!used)rec(i+1);
  };
  rec(0);
  return{trade:best.trade,units:best.units,total:cost.coins+best.trade,chain:false};
}
function cardCost(pi,card){if(chainOk(G.P[pi],card))return{chain:true,total:0,trade:0,units:0};return costInfo(pi,card.cost,'card',card.col);}
function wonderCost(pi,w){return costInfo(pi,w.cost,'wonder');}
function pay(pi,ci){const p=G.P[pi],o=G.P[1-pi];p.coins-=ci.total;if(ci.trade>0&&has(o,'eco'))o.coins+=ci.trade;if(ci.units&&ctl('monop')===1-pi)o.coins+=ci.units;}
function accessible(s){return !s.taken&&G.struct.every(t=>!(t.row===s.row+1&&Math.abs(t.x-s.x)===1)||t.taken);}
function revealNew(){G.struct.forEach(s=>{if(!s.taken&&!s.up&&accessible(s)){s.up=true;s.flip=true;}});}
function win(pi,type){if(!G.over)G.over={winner:pi,type};}
function guildMax(t){const v=G.P.map(p=>t==='yellow'?count(p,'yellow'):t==='brgr'?count(p,'brown')+count(p,'grey'):t==='wonder'?builtW(p):t==='coins'?Math.floor(p.coins/3):count(p,t));return Math.max(...v);}
function guildPts(t){return t==='wonder'?2*guildMax(t):guildMax(t);}
function guildCoins(t){return ['wonder','coins'].includes(t)?0:guildMax(t);}
function coinPerAmt(p,[w,n]){return n*(w==='wonder'?builtW(p):count(p,w));}
function discardGain(pi){return 2+count(G.P[pi],'yellow')+(ctl('fisc')===pi?2:0);}
function godCost(pi,i){const off=G.P[pi].offerings;return Math.max(0,G.pcost[i]-(off.length?Math.max(...off):0));}

async function military(pi,n){
  if(!n)return;
  await battleFx(pi,n);const dir=pi===0?1:-1;
  for(let k=0;k<n;k++){
    G.conflict+=dir;const c=G.conflict;
    for(const L of G.loot){if(!L.taken&&L.at===c){L.taken=true;const loser=c>0?1:0;const amt=Math.min(G.P[loser].coins,L.v);G.P[loser].coins-=amt;log(`${G.P[loser].name} subit un pillage : −${amt} pièces.`);}}
    if(Math.abs(c)>=9){G.conflict=Math.sign(c)*9;win(pi,'militaire');return;}
  }
}
async function addSci(pi,sym){
  const p=G.P[pi];p.sci[sym]=(p.sci[sym]||0)+1;
  if(Object.keys(p.sci).length>=6){win(pi,'scientifique');return;}
  if(p.sci[sym]===2&&G.board.length){log(`${p.name} réunit une paire de symboles ${SCIN[sym]}.`);await chooseToken(pi,G.board,'board');}
}
async function chooseToken(pi,list,src){
  if(!list.length)return;
  const p=G.P[pi];
  const i=await ask(pi,`${p.name} : choisis un jeton progrès`,list.map(t=>({html:`<span class="tok">${TOKENS[t].a}</span>`,label:TOKENS[t].n,desc:TOKENS[t].d,v:tokenValue(pi,t)})));
  const t=list[i];
  if(src==='board')G.board.splice(G.board.indexOf(t),1);else G.box.splice(G.box.indexOf(t),1);
  p.tokens.push(t);sfx('token');log(`${p.name} prend le jeton ${TOKENS[t].n}.`);
  if(t==='agri'||t==='urba')p.coins+=6;
  if(t==='loi')await addSci(pi,'balance');
}

async function buildCard(pi,card,free){
  const p=G.P[pi];
  if(!free){const ci=cardCost(pi,card);pay(pi,ci);if(ci.chain&&has(p,'urba'))p.coins+=4;if(ci.chain)log(`${p.name} construit ${card.n} gratuitement (chaînage).`);else log(`${p.name} construit ${card.n}${ci.total?` pour ${plural(ci.total,'pièce')}`:''}.`);}
  else log(`${p.name} construit ${card.n} gratuitement.`);
  p.cards.push(card);G.arrive=card.id;
  await cardFx(pi,card);
}
async function cardFx(pi,card){
  const p=G.P[pi],e=card.e;
  if(e.coins)p.coins+=e.coins;
  if(e.coinPer)p.coins+=coinPerAmt(p,e.coinPer);
  if(e.guild)p.coins+=guildCoins(e.guild);
  if(card.col==='blue'&&ctl('mecenat')===pi)p.coins+=2;
  if(card.col==='green'&&ctl('acad')===pi)p.coins+=2;
  if(card.col==='yellow'&&ctl('presea')===pi)p.coins+=2;
  if(e.sh){let s=e.sh;if(card.col==='red'){if(has(p,'strat'))s++;if(ctl('disc')===pi)s++;}await military(pi,s);if(G.over)return;}
  if(e.sci){await addSci(pi,e.sci);if(G.over)return;}
  if(e.senator)await placeCubes(pi,e.senator);
  if(e.consp)await conspirator(pi);
}
function discardCard(pi,card){const g=discardGain(pi);G.P[pi].coins+=g;G.discard.push(card);log(`${G.P[pi].name} défausse ${card.n} (+${g} pièces).`);}
async function buildWonder(pi,wi,card){
  const p=G.P[pi],w=p.wonders[wi];const ci=wonderCost(pi,w);pay(pi,ci);
  w.built=true;w.justBuilt=true;G.built++;log(`${p.name} bâtit ${w.n}.`,'big');
  if(G.built===7)G.P.forEach(q=>q.wonders.forEach(x=>{if(!x.built&&!x.dead){x.dead=true;log(`${x.n} ne sera jamais bâtie (7 merveilles atteintes).`);}}));
  render();wonderSplash(pi,w);if(!G.fast)await sleep(isAI(pi)?2300:1600);
  const prevSrc=G.fxSrc;G.fxSrc=w.n;
  const rep=await applyFx(pi,w.e,{wonder:true});
  G.fxSrc=prevSrc;
  return rep||has(p,'theo');
}
async function applyFx(pi,fx,opt={}){
  const p=G.P[pi],o=G.P[1-pi];
  if(fx.coins)p.coins+=fx.coins;
  if(fx.pts&&!opt.wonder)p.bonus+=fx.pts;
  if(fx.oppLose){const a=Math.min(o.coins,fx.oppLose);o.coins-=a;log(`${o.name} perd ${plural(a,'pièce')}.`);}
  if(fx.stealHalf){const a=Math.floor(o.coins/2);o.coins-=a;p.coins+=a;log(`${p.name} extorque ${plural(a,'pièce')}.`);}
  if(fx.tradeAll)p.tradeAll=true;
  if(fx.destroy)await destroyFx(pi,fx.destroy);
  if(fx.steal)await stealFx(pi);
  if(fx.sh){await military(pi,fx.sh);if(G.over)return false;}
  if(fx.sci){await addSci(pi,fx.sci);if(G.over)return false;}
  if(fx.library){const pool=shuffle(G.box).slice(0,3);await chooseToken(pi,pool,'box');if(G.over)return false;}
  if(fx.boardToken){await chooseToken(pi,G.board,'board');if(G.over)return false;}
  if(fx.discardStruct)for(let k=0;k<fx.discardStruct;k++)await discardStructFx(pi);
  if(fx.removeCubes)await removeCubesFx(pi,fx.removeCubes);
  if(fx.cubes)await placeCubes(pi,fx.cubes,fx.cubeSame);
  if(G.over)return false;
  if(fx.discardBuild)await discardBuildFx(pi);
  if(G.over)return false;
  if(fx.freeGod)await freeGodFx(pi);
  if(G.over)return false;
  return !!fx.replay;
}
async function destroyFx(pi,kind){
  const o=G.P[1-pi];const ok=c=>kind==='browngrey'?(c.col==='brown'||c.col==='grey'):c.col===kind;
  const list=o.cards.filter(ok);if(!list.length){log('Aucune carte à détruire.');return;}
  const i=await ask(pi,`Détruis une carte de ${o.name}`,list.map(c=>({html:miniCard(c,56),label:c.n,desc:fxText(c.e).join(' · '),v:(c.e.prod||'').length*2+(fixedProd(G.P[pi])[c.e.prod?.[0]]?0:1)})));
  const c=list[i];o.cards.splice(o.cards.indexOf(c),1);G.discard.push(c);log(`${G.P[pi].name} détruit ${c.n} chez ${o.name}.`);
}
async function stealFx(pi){
  const o=G.P[1-pi];const list=o.cards.filter(c=>c.col==='brown'||c.col==='grey');if(!list.length){log('Aucune carte à prendre.');return;}
  const i=await ask(pi,`Prends une carte de ${o.name}`,list.map(c=>({html:miniCard(c,56),label:c.n,desc:fxText(c.e).join(' · '),v:(c.e.prod||'').length*2})));

}
async function discardStructFx(pi){
  const list=G.struct.filter(accessible);if(!list.length)return;
  const i=await ask(pi,'Défausse une carte accessible de la structure',list.map(s=>({html:miniCard(s.card,56),label:s.card.n,desc:fxText(s.card.e).join(' · '),v:Math.min(cardValue(1-pi,s.card),40)})));
  const s=list[i];s.taken=true;G.discard.push(s.card);log(`${G.P[pi].name} fait défausser ${s.card.n}.`);revealNew();

async function discardBuildFx(pi){
  if(!G.discard.length){log('La défausse est vide.');return;}

async function freeGodFx(pi){

  const i=await ask(pi,'Invoque gratuitement un dieu',idx.map(k=>godOpt(pi,G.pan[k])));
  const g=G.pan[idx[i]];G.pan[idx[i]]=null;G.P[pi].gods++;log(`${G.P[pi].name} invoque ${g.n}.`,'big');await applyFx(pi,g.fx);
}

/* Panthéon */
async function placeGod(pi,cu){
  const deck=G.gdecks[cu];const free=G.pan.indexOf(null);if(free<0||!deck.length)return;
  const two=deck.splice(0,2);
  const i=two.length>1?await ask(pi,`Sceau des ${CULT[cu].n} : choisis le dieu qui rejoint le Panthéon`,two.map(g=>godOpt(pi,g))):0;
  const g=two.splice(i,1)[0];deck.push(...two);G.pan[free]=g;log(`${g.n} rejoint le Panthéon (coût ${G.pcost[free]}).`);
}
async function invokeGodInner(pi,slot){
  const p=G.P[pi],g=G.pan[slot];const c=godCost(pi,slot);
  if(p.offerings.length&&c<G.pcost[slot]){const m=Math.max(...p.offerings);p.offerings.splice(p.offerings.indexOf(m),1);}
  p.coins-=c;G.pan[slot]=null;p.gods++;log(`${p.name} invoque ${g.n} (${plural(c,'pièce')}).`,'big');
  return await applyFx(pi,g.fx);
}

function controlsAll(pi){return G.senate.every(ch=>controller(ch)===pi);}
function chamberScore(pi,ch){

const resVal=a=>[0,2.6,1.6,0.35][a];
function cardValue(pi,card){
  const p=G.P[pi],a=G.age,e=card.e;let v=0;
  v+=e.pts||0;if(e.coins)v+=e.coins/3;
  if(e.prod){const fp=fixedProd(p);const op=fixedProd(G.P[1-pi]);for(const r of e.prod)v+=(fp[r]?0.45:1)*resVal(a)*(op[r]?1:1.25);}
  if(e.choice)v+=(4-a)*1.1;if(e.trade)v+=e.trade.length*(4-a)*0.8;if(e.link&&a<3)v+=1.3;
  if(e.sh){let s=e.sh;if(card.col==='red'){if(has(p,'strat'))s++;if(ctl('disc')===pi)s++;}const c=G.conflict*(pi===0?1:-1);if(c+s>=9)return 999;v+=s*1.5+(c<=-3?s:0)+(c+s>=6&&c<6?2:0)+(c<=-6?3:0);}
  if(e.sci){const n=p.sci[e.sci]||0,d=Object.keys(p.sci).length;if(n===0){if(d+1>=6)return 999;v+=1.5+d*1.15;}else if(n===1)v+=G.board.length?4:0.5;else v+=0.3;}
  if(e.coinPer)v+=coinPerAmt(p,e.coinPer)/3;
  if(e.guild)v+=guildPts(e.guild)+guildCoins(e.guild)/3;
  if(e.temple)v+=4+2*p.gods+(G.mods.pantheon?1:0);

  return v;
}
function fxValue(pi,fx){
  const p=G.P[pi];let v=0;const dir=pi===0?1:-1;
  v+=(fx.pts||0)+(fx.coins||0)/3+(fx.oppLose||0)/3.5;
  if(fx.sh){if(G.conflict*dir+fx.sh>=9)return 999;v+=fx.sh*1.6;}
  if(fx.sci){if(!p.sci[fx.sci]){if(Object.keys(p.sci).length+1>=6)return 999;v+=3;}else v+=2;}
  if(fx.replay)v+=3;if(fx.choice)v+=(4-(G.age||1))*1.2;if(fx.destroy)v+=2.5;if(fx.steal)v+=3;
  if(fx.library||fx.boardToken)v+=3.5;if(fx.discardBuild)v+=Math.max(1,...G.discard.map(c=>Math.min(cardValue(pi,c),30)));
  if(fx.stealHalf)v+=G.P[1-pi].coins/6;if(fx.tradeAll)v+=(4-(G.age||1))*1.5;if(fx.discardStruct)v+=1.5*fx.discardStruct;
  if(fx.cubes)v+=1.8*fx.cubes;if(fx.removeCubes)v+=1.5*fx.removeCubes;if(fx.freeGod)v+=(G.pan&&G.pan.some(x=>x))?5:0;
  return v;
}
function tokenValue(pi,t){const p=G.P[pi],d=Object.keys(p.sci).length;switch(t){
  case 'loi':return p.sci.balance?2:(d+1>=6?999:4+d*0.6);case 'philo':return 7;case 'agri':return 6;case 'math':return 3*(p.tokens.length+1);
  case 'theo':return G.age<3?5:2;case 'strat':return G.age<3?4.5:2.5;case 'eco':return 3.5;case 'archi':return p.wonders.some(w=>!w.built&&!w.dead)?4.5:0.5;
  case 'urba':return G.age<3?4.5:2.5;case 'macon':return G.age<3?3:1.5;}return 1;}
function exposure(pi,s){
  let worst=0;
  G.struct.forEach(t=>{if(t.taken||t.row!==s.row-1||Math.abs(t.x-s.x)!==1)return;
    const cov=G.struct.filter(u=>u.row===t.row+1&&Math.abs(u.x-t.x)===1&&u!==s);
    if(cov.every(u=>u.taken)){const v=t.up?Math.min(cardValue(1-pi,t.card),40):2.5;worst=Math.max(worst,v);}});
  return worst*0.3;
}
const LEVELS={facile:{den:0.15,ex:0,noise:4,n:'Facile'},normal:{den:0.55,ex:0.3,noise:0.6,n:'Normal'},difficile:{den:0.75,ex:0.5,noise:0.1,n:'Difficile'}};
async function aiTurn(pi){
  await sleep(G.fast?0:700);

  if(p.consp.length)return{type:'consp',idx:argmax(p.consp.map(c=>fxValue(pi,c.fx)))};
  const opts=[];
  G.struct.filter(accessible).forEach(s=>{
    const c=s.card;const den=Math.min(cardValue(1-pi,c),W===LEVELS.difficile?80:40)*W.den;const ex=exposure(pi,s)*W.ex/0.3;
    const ci=cardCost(pi,c);
    if(ci.total<=p.coins)opts.push({v:cardValue(pi,c)-ci.total/3.2+den-ex+(ci.chain?1:0),a:{type:'build',slot:s.i}});
    opts.push({v:discardGain(pi)/3.5+den-ex-0.8,a:{type:'discard',slot:s.i}});
    if(G.built<7)p.wonders.forEach((w,wi)=>{if(w.built||w.dead)return;const wc=wonderCost(pi,w);if(wc.total<=p.coins)opts.push({v:fxValue(pi,w.e)+(has(p,'theo')&&!w.e.replay?3:0)-wc.total/3.2+den-ex+0.6,a:{type:'wonder',slot:s.i,wi}});});
  });
  if(G.mods.pantheon&&G.age>=2)G.pan.forEach((g,i)=>{if(!g)return;const c=godCost(pi,i);if(c<=p.coins)opts.push({v:fxValue(pi,g.fx)-c/3.2-0.5,a:{type:'god',slot:i}});});

async function runGame(res){

  if(res&&res.age){startAge=res.age;first=res.first;}
  else if(res){startAge=G.age;startPi=res.pi;last=res.last;}else await draft();
  for(let age=startAge;age<=3;age++){
    let pi;
    if(startPi!=null){pi=startPi;startPi=null;G.newAge=true;}
    else{setupAge(age);log(`Âge ${roman(age)}`,'age');G.newAge=true;pi=first;}
    while(G.struct.some(s=>!s.taken)){
      saveGame(pi,last);
      const na=G.newAge,changed=G.cur!==pi||na;G.newAge=false;
      G.cur=pi;render();
      if(changed||G.replayed)splash(pi,G.replayed?'Tour supplémentaire':na?`Début de l’Âge ${roman(age)}`:'');G.replayed=false;
      if(!G.fast&&(changed)&&isAI(pi))await sleep(400);
      const rep=await playTurn(pi);last=pi;
      if(G.over){clearSave();render();return showEnd();}
      if(rep&&G.struct.some(s=>!s.taken)){log(`${G.P[pi].name} rejoue.`);G.replayed=true;}else pi=1-pi;
    }
    if(age<3){first=G.conflict>0?1:G.conflict<0?0:1-last;log(`${G.P[first].name} ouvre l'Âge ${roman(age+1)}.`);
      if(!SIM&&!G.fast&&!IS_NODE)await showOdds(age+1,first);}
  }
  G.over={winner:null,type:'civile'};clearSave();render();return showEnd();
}

function setupAge(age){

async function playTurn(pi){

function score(pi){

  const c=G.conflict*(pi===0?1:-1);

    civil:sum('blue'),sci:sum('green'),com:sum('yellow'),
    guild:p.cards.filter(c=>c.e.guild).reduce((a,c)=>a+guildPts(c.e.guild),0),
    wond:p.wonders.filter(w=>w.built).reduce((a,w)=>a+(w.e.pts||0),0),
    prog:(has(p,'agri')?4:0)+(has(p,'philo')?7:0)+(has(p,'math')?3*p.tokens.length:0),
    mil:c>=6?10:c>=3?5:c>=1?2:0,coins:Math.floor(p.coins/3),

}

function wonderHTML(w,id){return `<div class="wtile ${w.built?'built':''} ${w.dead?'dead':''} ${id&&w.justBuilt?'wbuild':''}" ${id?`id="${id}" data-a="wonder" data-v="${id}" role="button" tabindex="0"`:''}><div class="wn">${esc(w.n)}</div><div class="wfx">${fxIcons(w.e)}</div><div class="wdesc">${fxText(w.e).map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="wc"><span class="wcl">Coût</span>${costIcons(w.cost)}</div>${w.built?'<span class="badge">✓ Bâtie</span>':w.dead?'<span class="badge">Abandonnée</span>':''}</div>`;}
function fxText(e){const L=[];
  if(e.prod)L.push(`Produit ${[...e.prod].map(r=>RN[r]).join(' + ')}`);
  if(e.choice)L.push(`Produit chaque tour au choix : ${[...e.choice].map(r=>RN[r]).join(' ou ')}`);
  if(e.trade)L.push(`Achat de ${[...e.trade].map(r=>RN[r]).join(' et ')} à 1 pièce`);
  if(e.sh)L.push(plural(e.sh,'bouclier'));
  if(e.sci)L.push(`Symbole scientifique : ${SCIN[e.sci]}`);
  if(e.coins)L.push(`+${e.coins} pièces`);
  if(e.coinPer)L.push(`+${e.coinPer[1]} pièce(s) par ${e.coinPer[0]==='wonder'?'merveille bâtie':'carte '+({grey:'grise',brown:'marron',red:'rouge',yellow:'jaune'}[e.coinPer[0]])} de votre cité`);
  if(e.guild)L.push(e.guild==='wonder'?'Fin de partie : 2 points par merveille dans la cité qui en a le plus':e.guild==='coins'?'Fin de partie : 1 point par lot de 3 pièces dans la cité la plus riche':`1 pièce maintenant et 1 point en fin de partie par ${GUILD_TXT[e.guild]} dans la cité qui en a le plus`);
  if(e.temple)L.push('Fin de partie : 4 points + 2 par dieu que vous avez invoqué');
  if(e.senator)L.push(`Placez ${plural(e.senator,'cube')} d'influence au Sénat`);
  if(e.consp)L.push("Ourdissez un complot ou placez 1 cube d'influence");
  if(e.cubes)L.push(`Placez ${plural(e.cubes,'cube')} d'influence`);
  if(e.replay)L.push('Rejouez : vous jouez un 2ᵉ tour tout de suite');
  if(e.destroy)L.push(`Détruisez une carte ${e.destroy==='brown'?'marron':e.destroy==='grey'?'grise':'marron ou grise'} de l'adversaire`);
  if(e.discardBuild)L.push('Choisissez une carte de la défausse et construisez-la gratuitement');
  if(e.library)L.push('Choisissez un jeton progrès parmi 3 tirés hors du marché');
  if(e.oppLose)L.push(`L'adversaire perd ${e.oppLose} pièces`);
  if(e.freeGod)L.push('Invoquez gratuitement un dieu du Panthéon');
  if(e.pts)L.push(plural(e.pts,'point'));
  return L;}
function describe(c){const k=c.cost,parts=[];if(k.coins)parts.push(plural(k.coins,'pièce'));RES.forEach(r=>{if(k.res[r])parts.push(RN[r]+(k.res[r]>1?' ×'+k.res[r]:''))});
  const L=['Coût : '+(parts.join(', ')||'gratuit')];
  if(c.e.from)L.push(`Gratuite si vous possédez le symbole « ${c.e.from} »`);
  if(c.e.link)L.push(`Donne le symbole de chaînage « ${c.e.link} »`);
  return L.concat(fxText(c.e));}

  const p=G.P[G.cur],ai=isAI(G.cur);
  const who=G.mode==='ai'?(G.cur===0?'À toi de jouer':'L’IA joue'):`Tour de ${esc(p.name)}`;

  return `<div class="turnbar" style="--tc:var(--p${G.cur})"><div class="wrap"><span class="dot"></span><span class="who">${who}</span><span class="hint">${hint}</span></div></div>`;
}
function statusText(){

function structHTML(){
  const step=12.1;const h=(G.rows-1)*step+15.3*1.4;

    const acc=accessible(s);const mine=G.awaiting!=null&&acc;
    const left=`calc(${(s.x+6)/12*100}cqw - 7.65cqw)`;const top=`${s.row*step}cqw`;
    const inner=s.up?cardHTML(s.card):`<div class="card back a${G.age}">${roman(G.age)}</div>`;
    const seal=s.seal?`<span class="seal" style="--sc:${CULT[s.seal].c}" title="Sceau des ${CULT[s.seal].n}">${CULT[s.seal].l}</span>`:'';
    const off=s.offer?`<span class="offer" title="Offrande">−${s.offer}</span>`:'';
    let warn='',dz='';
    if(s.up&&acc&&!G.over){const o=viewerOpp();if(cardValue(o,s.card)>=999){warn=`<span class="warn" title="Cette carte ferait gagner ${esc(G.P[o].name)}">⚠ victoire adverse</span>`;dz='danger';}

    return `<div class="slot ${mine?'acc':''} ${G.hl===s.i?'hl':''} ${dz}${fx}" style="left:${left};top:${top};z-index:${s.row+1};${G.deal?`animation-delay:${s.i*30}ms`:''}" data-a="slot" data-v="${s.i}" ${s.up?'tabindex="0" role="button"':''} aria-label="${s.up?esc(s.card.n):'Carte cachée'}">${inner}${seal}${off}${warn}</div>`;
  }).join('');
  if(G.deal)sfx('deal');else if(G.struct.some(s=>s.flip&&!s.taken))sfx('flip');
  G.struct.forEach(s=>s.flip=false);G.deal=false;
  return `<div class="struct-wrap"><div class="struct" style="height:${h}cqw;--tc:var(--p${G.awaiting??G.cur})">${slots}</div></div>`;
}

function onSlot(i){
  const s=G.struct[i];if(!s||s.taken)return;
  if(!s.up){info('Carte cachée',`<p class="sub">Elle sera révélée dès qu’elle deviendra accessible.${s.seal?` Elle porte le sceau des ${CULT[s.seal].n} : la prendre fait entrer un dieu au Panthéon.`:''}${s.offer?` Elle porte une offrande de −${s.offer} pièces pour une invocation.`:''}</p>`);return;}
  const c=s.card,pi=G.awaiting,can=pi!=null&&accessible(s);
  sheetActs=[];let btns='';
  const btn=(label,sub,dis,main)=>{const k=sheetActs.length-1;return `<button class="act ${main?'main':''}" data-a="act" data-v="${k}" ${dis?'disabled':''}><b>${label}</b><span>${sub}</span></button>`;};
  if(can){const p=G.P[pi];const ci=cardCost(pi,c);
    sheetActs.push({type:'build',slot:i});btns+=btn(ci.chain?'Construire — gratuit':`Construire — ${plural(ci.total,'pièce')}`,ci.chain?'Chaînage':ci.total>p.coins?`Il te manque ${ci.total-p.coins} pièce(s)`:ci.trade?`dont ${ci.trade} pour acheter ${plural(ci.units,'ressource')}`:'',ci.total>p.coins,true);
    sheetActs.push({type:'discard',slot:i});btns+=btn(`Défausser — +${discardGain(pi)} pièces`,'2 + 1 par carte jaune','',false);
    if(G.built<7)p.wonders.forEach((w,wi)=>{if(w.built||w.dead)return;const wc=wonderCost(pi,w);sheetActs.push({type:'wonder',slot:i,wi});btns+=btn(`Bâtir ${w.n} — ${plural(wc.total,'pièce')}`,fxText(w.e).join(' · '),wc.total>p.coins);});
  }

function showEnd(){
  if(IS_NODE||SIM)return;
  {const w=finalWinner();sfx(w==null?'turn':(G.mode==='ai'&&w===1)?'lose':'win');}
  const w=finalWinner();const s=[score(0),score(1)];
  const rows=[['civil','Bâtiments civils'],['sci','Bâtiments scientifiques'],['com','Bâtiments commerciaux'],['guild','Guildes'],['wond','Merveilles'],['prog','Jetons progrès'],['mil','Militaire'],['coins','Trésor (1 pt / 3 pièces)']];
  if(G.mods.pantheon||G.mods.agora)rows.push(['div','Temples, dieux et complots']);if(G.mods.agora)rows.push(['pol','Sénat']);
  const type=G.over.type;

let NB=null;
function noiseBuf(a){if(NB)return NB;NB=a.createBuffer(1,a.sampleRate,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NB;}
function nz(a,t,dur,vol,ftype,f0,f1){const s=a.createBufferSource();s.buffer=noiseBuf(a);const f=a.createBiquadFilter();f.type=ftype;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+dur+.05);}
function tn(a,t,freq,dur,type,vol,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(freq,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05);}

async function simulate(n,age,first){
  const real=G,realUID=UID;const res={w:[0,0,0],t:[{},{}]};
  SIM=true;
  try{
    for(let k=0;k<n;k++){
      G=JSON.parse(JSON.stringify(real));G.mode='aiai';G.fast=true;G.level='normal';G.over=null;G.log=[];G.awaiting=null;
      await runGame({age,first});
      const w=finalWinner();res.w[w==null?2:w]++;if(w!=null){const ty=G.over.type;res.t[w][ty]=(res.t[w][ty]||0)+1;}
      if(k%8===7){G=real;SIM=false;await new Promise(r=>setTimeout(r,0));SIM=true;}

}
function oddsCriteria(){
  const rows=[['Score actuel',pi=>score(pi).total],['Avance militaire',pi=>Math.max(0,G.conflict*(pi?-1:1))],['Symboles scientifiques',pi=>Object.keys(G.P[pi].sci).length+'/6'],['Merveilles bâties',pi=>builtW(G.P[pi])+'/4'],['Pièces',pi=>G.P[pi].coins],['Ressources produites',pi=>Object.values(fixedProd(G.P[pi])).reduce((a,b)=>a+b,0)+choiceSrc(G.P[pi]).length],['Jetons progrès',pi=>G.P[pi].tokens.length]];
  if(G.mods.agora)rows.push(['Chambres du Sénat',pi=>G.senate.filter(ch=>controller(ch)===pi).length+'/6']);
  if(G.mods.pantheon)rows.push(['Dieux invoqués',pi=>G.P[pi].gods]);
  return rows;
}
async function showOdds(age,first){
  const N=200;
  openModal(`<h3>Fin de l’Âge ${roman(age-1)}</h3><p class="sub">Calcul des chances : je joue ${N} fins de partie possibles à partir de la situation actuelle…</p><div class="spin"></div>`,{forced:true});
  await new Promise(r=>setTimeout(r,60));
  const r=await simulate(N,age,first);
  const pct=r.w.map(x=>Math.round(x/N*100));
  const TY={civile:'aux points',militaire:'militaire',scientifique:'scientifique',politique:'politique'};
  const odd=pi=>{const t=r.t[pi];const parts=Object.entries(t).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span>${TY[k]} ${Math.round(v/N*100)} %</span>`).join('');
    return `<div class="odd" style="--oc:var(--p${pi})"><div class="top"><span class="nm">${esc(G.P[pi].name)}</span><span class="pct">${pct[pi]} %</span></div>${parts?`<div class="split">${parts}</div>`:''}</div>`;};
  const rows=oddsCriteria().map(([l,f])=>{const a=f(0),b=f(1);const na=parseFloat(a),nb=parseFloat(b);return `<tr><td>${l}</td><td class="${na>nb?'lead':''}">${a}</td><td class="${nb>na?'lead':''}">${b}</td></tr>`;}).join('');
  const fav=pct[0]===pct[1]?null:pct[0]>pct[1]?0:1;
  const gap=fav==null?0:Math.abs(pct[0]-pct[1]);const adv=gap>=40?'nettement ':gap>=15?'':'légèrement ';const verdict=fav==null?'Partie parfaitement équilibrée.':(G.mode==='ai'&&fav===0)?`Tu es ${adv}favori.`:`${esc(G.P[fav].name)} est ${adv}favori.`;
  sfx('token');
  return new Promise(res=>{
    askResolve=()=>{askResolve=null;closeModal(true);res();};
    openModal(`<h3>Bilan de l’Âge ${roman(age-1)}</h3><p class="sub">${verdict} Chances estimées en simulant ${N} fins de partie (IA contre IA, niveau normal).</p>
      <div class="bar" aria-hidden="true"><span class="b0" style="width:${pct[0]}%"></span><span class="bd" style="width:${pct[2]?Math.round(r.w[2]/N*100):0}%"></span><span class="b1" style="width:${pct[1]}%"></span></div>
      <div class="odds">${odd(0)}${odd(1)}</div>
      ${r.w[2]?`<p class="sub">Égalités : ${Math.round(r.w[2]/N*100)} %</p>`:''}
      <table class="crit"><thead><tr><th>Critère</th><th class="p0">${esc(G.P[0].name)}</th><th class="p1">${esc(G.P[1].name)}</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="acts"><button class="act main" data-a="ask" data-v="0"><b>Commencer l’Âge ${roman(age)}</b><span>${esc(G.P[first].name)} ${first===0&&G.mode==='ai'?'commences':'commence'}</span></button></div>`,{forced:true});
  });
}

function splash(pi,sub){
  if(IS_NODE||G.fast||SIM)return;
  sfx('turn');
  const name=G.P[pi].name;const txt=G.mode==='ai'?(pi===0?'À toi de jouer':'Tour de l’IA'):`${name}, à toi`;
  const d=document.createElement('div');d.className='splash';d.style.setProperty('--tc',`var(--p${pi})`);
  d.innerHTML=`<div>${txt}${sub?`<small>${sub}</small>`:''}</div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1300);
}

/* Aide */

   <li><span>Il te manque une ressource ? Le jeu l’achète automatiquement à la banque : 2 pièces + 1 par exemplaire que l’adversaire produit. Le détail s’affiche sous le bouton Construire.</span></li>

   ${row(`<span class="choice">${ri('W')}<i>/</i>${ri('S')}</span>`,'Production au choix','Chaque tour, fournit une des ressources affichées.')}
   ${row(`<span class="trade">${ri('S')}${coin(1)}</span>`,'Dépôt','Cette ressource ne te coûte plus que 1 pièce à l’achat.')}

   ${row(shI+shI,'Boucliers','Chaque bouclier pousse le pion conflit d’une case vers l’adversaire.')}
   ${Object.keys(SCIN).map(s=>row(sciI(s),SCIN[s],'Symbole scientifique. 2 identiques = 1 jeton progrès, 6 différents = victoire.')).join('')}
   ${row(`<span class="lk">Lune</span>`,'Chaînage','Dans le coût : la carte est gratuite si tu possèdes ce symbole.')}
   ${row(`<span class="per">${coin(2)}<i>/</i><span class="minichip col-brown"></span></span>`,'Gain par carte','Pièces ou points pour chaque carte de cette couleur.')}
   ${row(`<span class="per">${coin(2)}<i>/</i><span class="mtag">M</span></span>`,'Par merveille','Pour chaque merveille bâtie.')}
   ${row('<span class="gtag" style="--is:22px">◆◆</span>','Influence (Agora)','Cubes à placer dans les chambres du Sénat.')}
   ${row('<span class="gtag" style="--is:22px">Rejoue</span>','Rejouer','Tu joues un tour supplémentaire immédiatement.')}
   </table>`;}
  if(tab==='victoires')return `<div class="ex"><b>Militaire</b> — le pion rouge atteint la capitale adverse (9 cases). En passant les cases 3 et 6, l’adversaire est pillé (−2 puis −5 pièces).</div><div class="ex"><b>Scientifique</b> — tu réunis 6 symboles scientifiques différents.</div><div class="ex"><b>Politique</b> (Agora) — tu contrôles les 6 chambres du Sénat en même temps.</div><div class="ex"><b>Civile</b> — à la fin de l’Âge III, le plus de points l’emporte. Ton score provisoire s’affiche en vert à côté de tes pièces.</div>`;
  if(tab==='pantheon')return `<p>Panthéon ajoute des dieux que tout le monde peut invoquer. Le jeu se déroule en trois temps.</p><ol class="steps">
   <li><span><b>Âge I : les sceaux.</b> Cinq cartes cachées portent une pastille de couleur (une par civilisation). Celui qui prend une de ces cartes, quelle que soit l’action, découvre 2 dieux de cette civilisation et en place un au Panthéon.</span></li>
   <li><span><b>Âge II et III : les invocations.</b> À ton tour, au lieu de prendre une carte, touche un dieu dans le panneau Panthéon et paie le prix de son emplacement (3 à 6 pièces). Son pouvoir s’applique tout de suite, puis l’emplacement se vide.</span></li>
   <li><span><b>Âge II : les offrandes.</b> Trois cartes portent une pastille « −2 », « −3 » ou « −4 ». En prenant la carte, tu gardes cette réduction pour ta prochaine invocation.</span></li>
   <li><span><b>Âge III : les grands temples.</b> Ces cartes beiges valent 4 points + 2 par dieu que tu as invoqué. Plus tu invoques, plus ils rapportent.</span></li></ol>
   <div class="ex"><b>Exemple.</b> Tu prends à l’Âge I une carte au sceau Φ (Phéniciens) : tu choisis entre Tanit et Baal, tu places Tanit. À l’Âge II, tu possèdes une offrande −3 : invoquer Tanit sur l’emplacement à 5 te coûte 2 pièces et t’en rapporte 12.</div>
   <div class="colhead">Les 15 dieux</div><div class="glist">${GODS.map(g=>`<div><b style="color:${CULT[g.cu].c}">${g.n}</b> · ${CULT[g.cu].n}<br>${esc(g.d)}</div>`).join('')}</div>

   <li><span><b>Déclencher un complot.</b> Au début de l’un de tes tours, un bouton « Déclencher un complot » apparaît dans ta cité. Le complot se résout, puis tu joues ton tour normalement.</span></li>

function showHelp(tab='bases'){
  openModal(`<h3>Aide</h3><div class="tabs">${HELP_TABS.map(([k,l])=>`<button class="tab ${k===tab?'on':''}" data-a="help" data-v="${k}">${l}</button>`).join('')}</div><div class="rules">${helpBody(tab)}</div><button class="ghost" data-a="close">Fermer</button>`,{wide:true});
}

/* Événements */
if(!IS_NODE){
document.addEventListener('click',e=>{
  if(!MUTED)ac();
  if(e.target.id==='modal'){closeModal(false);return;}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
  switch(a){
    case 'ask':if(askResolve)askResolve(+v);break;
    case 'slot':if(G&&!G.draft)onSlot(+v);break;
    case 'act':resolveAct(sheetActs[+v]);break;
    case 'close':closeModal(false);break;
    case 'city':showCity(+v);break;
    case 'tok':info(TOKENS[v].n,`<p>${TOKENS[v].d}</p>`);break;
    case 'god':onGod(+v);break;
    case 'sound':MUTED=!MUTED;try{localStorage.setItem('dda-mute',MUTED?'1':'0');}catch(e){}if(!MUTED){ac();sfx('coin');}render();break;
    case 'wonder':{const [pp,wi]=v.slice(1).split('-').map(Number);const w=G.P[pp].wonders[wi];const me=G.awaiting;
      const c=me===pp&&!w.built&&!w.dead?wonderCost(pp,w):null;
      info(esc(w.n),`<p class="sub">Merveille de ${esc(G.P[pp].name)} · ${w.built?'bâtie':w.dead?'abandonnée (7 merveilles déjà bâties)':'pas encore bâtie'}</p><ul>${fxText(w.e).map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p>Coût : ${costIcons(w.cost)}${c?` — pour toi maintenant : <b>${plural(c.total,'pièce')}</b>${c.total>G.P[pp].coins?' (pas assez)':''}`:''}</p><p class="sub">Pour la bâtir : touche une carte dorée de la pyramide, puis choisis « Bâtir ${esc(w.n)} ». La carte sert de fondation et disparaît.</p>`);break;}
    case 'consp':onConsp();break;
    case 'chamber':{const ch=G.senate[+v];info(`Chambre : ${DECREES[ch.d].n}`,`<p>${DECREES[ch.d].d}</p><p class="sub">${esc(G.P[0].name)} ${ch.cubes[0]} cube(s) · ${esc(G.P[1].name)} ${ch.cubes[1]} cube(s). ${controller(ch)!=null?'Contrôlée par '+esc(G.P[controller(ch)].name)+'.':'Personne ne la contrôle.'}</p>`);break;}
    case 'discards':info('Défausse',G.discard.length?`<div class="cardgrid">${G.discard.map(c=>miniCard(c,76)).join('')}</div>`:'<p class="sub">Aucune carte défaussée.</p>');break;
    case 'rules':showHelp('bases');break;
    case 'help':showHelp(v);break;
    case 'menu':GEN++;uiResolve=askResolve=null;closeModal(true);G=null;render();window.scrollTo(0,0);break;
    case 'mode':MENU.mode=v;render();break;
    case 'level':MENU.level=v;render();break;
    case 'mod':MENU[v]=!MENU[v];render();break;
    case 'start':clearSave();newGame(MENU.mode,{pantheon:MENU.pantheon,agora:MENU.agora},MENU.level);window.scrollTo(0,0);break;
    case 'again':clearSave();newGame(G.mode,G.mods,G.level);window.scrollTo(0,0);break;
    case 'resume':{const d=loadSave();if(d){resumeGame(d);window.scrollTo(0,0);}break;}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal(false);if((e.key==='Enter'||e.key===' ')&&e.target.matches('.slot')){e.preventDefault();e.target.click();}});
try{window.claude?.hot?.snapshot?.(()=>({dda:window.__dda||null}));}catch(e){}
let hotD=null;try{hotD=window.claude?.hot?.data?.dda||null;}catch(e){}
if(hotD&&!hotD.G.over)resumeGame(hotD);else render();
}
if(IS_NODE)module.exports={newGame,get G(){return G},score,finalWinner};
