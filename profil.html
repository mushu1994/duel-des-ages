<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Profil – Salle de jeux</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Karla:wght@400;500;700;800&display=swap">

<style>
:root{--felt:#123426;--felt2:#0d281d;--cream:#f4ecd9;--cream2:#e8dcc0;--ink:#1f1a12;--mute:#6b604c;--gold:#d8b25a;--chalk:#eef3ea;--chalk-mute:#a9c2b3;--display:'DM Serif Display',Georgia,serif;--body:'Karla',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--felt);background-image:radial-gradient(1000px 600px at 50% 0%,#1c4a35 0%,transparent 70%);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 60px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.back{color:var(--chalk);text-decoration:none;border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:6px 11px;font-weight:700;font-size:14px}
.topbar .sp{flex:1}
.card{background:var(--cream);color:var(--ink);border-radius:16px;padding:16px 18px;box-shadow:0 10px 26px rgba(0,0,0,.35);margin-bottom:16px}
.card h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 small{font-family:var(--body);font-size:14px;color:var(--mute);font-weight:700}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.av{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:50px;background:var(--c,#d8b25a);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 0 0 4px #fff;border:0;cursor:pointer;padding:0}
.av.ro{cursor:default}
.who h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,7vw,46px);line-height:1;margin:0;word-break:break-word}
.lvl{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.lvl b{background:var(--ink);color:var(--gold);border-radius:999px;padding:3px 11px;font-size:14px}
.bar{flex:1;min-width:140px;height:10px;border-radius:99px;background:var(--cream2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#d8a640,#f0cf7a)}
.lvl small{color:var(--mute);font-weight:700}
.bio{margin:10px 0 0;color:#3d3426}
.bio-in{width:100%;font:500 16px var(--body);border:1px solid #c9b98f;border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);-webkit-text-fill-color:var(--ink);margin-top:8px}
.vis{font-size:14px;color:var(--mute);margin:10px 0 0}
.vis.on{color:#1d7a46;font-weight:700}
.warn{background:#fbe1d6;color:#7a2a12;border-radius:10px;padding:8px 11px;font-weight:700;font-size:14px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:800 14px var(--body);border-radius:10px;padding:9px 13px;border:1px solid #c9b98f;background:#ece3cf;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}
.btn.gold{background:var(--ink);border-color:var(--ink);color:var(--gold)}
.btn:disabled{opacity:.5;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.st{background:#fbf6ea;border-radius:12px;padding:10px 12px}
.st b{display:block;font-family:var(--display);font-size:30px;font-weight:400;line-height:1.05}
.st span{font-size:13px;color:var(--mute);font-weight:700}
.podium{display:flex;justify-content:center;gap:10px;align-items:flex-end}.podium .pod{flex:1;max-width:220px}
.pod{background:#fbf6ea;border-radius:12px 12px 6px 6px;padding:10px;text-align:center;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px;border-bottom:6px solid var(--gold)}
.pod.p1{padding-top:22px;border-color:#d8a640}.pod.p2{border-color:#a9b2bf}.pod.p3{border-color:#c07a42}
.pod .m{font-size:28px}.pod b{font-size:15px}.pod small{color:var(--mute);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:700 14px var(--body);border-radius:999px;padding:6px 12px;border:1px solid #c9b98f;background:#fbf6ea;color:var(--ink);text-decoration:none;cursor:pointer}
.chip.on{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.chip.fav{background:#fff3cf;border-color:#e2c56a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ach{display:grid;grid-template-columns:40px 1fr;gap:4px 10px;background:#fbf6ea;border-radius:12px;padding:10px;align-items:center}
.ach .i{font-size:28px;grid-row:span 3;text-align:center;filter:grayscale(1);opacity:.45}
.ach.ok .i{filter:none;opacity:1}
.ach b{font-size:14.5px}.ach small{color:var(--mute);font-size:12.5px;line-height:1.3}
.ach .pb{height:6px;border-radius:9px;background:var(--cream2);overflow:hidden}.ach .pb i{display:block;height:100%;background:#1d8f5a}
.ach.ok{background:linear-gradient(135deg,#fff6dc,#fbe9b8);box-shadow:inset 0 0 0 1px #e2c56a}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.list li{display:flex;align-items:center;gap:10px;background:#fbf6ea;border-radius:12px;padding:8px 10px;flex-wrap:wrap}
.list li .tx{flex:1;min-width:150px}.list li .tx small{display:block;color:var(--mute);font-size:13px}
.mini{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--c,#d8b25a);flex:none}
.rk{font-family:var(--display);font-size:20px;width:26px;text-align:center}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--cream2)}
.tag.ok{background:#1d8f5a;color:#fff}.tag.new{background:#c0392b;color:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:end;margin-top:10px}
.form label{font-size:13px;font-weight:800;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.form select,.form input,.inp{font:600 16px var(--body);border:1px solid #c9b98f;border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);-webkit-text-fill-color:var(--ink)}
.note{font-size:14px;color:var(--mute);margin:6px 0}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:10px}
.picker button{font-size:26px;border:1px solid #d9caa4;background:#fbf6ea;border-radius:10px;height:46px;cursor:pointer}
.cols{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.cols button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #c9b98f;cursor:pointer}
.cols button.on{box-shadow:0 0 0 3px var(--ink)}
.code{font:800 20px ui-monospace,Menlo,monospace;letter-spacing:.12em;background:var(--ink);color:var(--gold);border-radius:10px;padding:8px 12px;display:inline-block;word-break:break-all}
.empty{color:var(--mute);font-size:14.5px}
.optrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0;font-weight:700}.optrow input[type=range]{flex:1;min-width:140px;accent-color:#1d8f5a}.optrow small{color:var(--mute);font-weight:500}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.load{display:inline-block;width:16px;height:16px;border-radius:50%;border:3px solid #c9b98f;border-top-color:var(--ink);animation:r 1s linear infinite;vertical-align:-3px}
@keyframes r{to{transform:rotate(360deg)}}
@media (max-width:520px){.hero{grid-template-columns:1fr;justify-items:start}.podium{gap:6px}.pod .m{font-size:22px}.pod b{font-size:13px}.card{padding:14px}}
</style>
<div class="wrap">
  <div class="topbar"><a class="back" href="index.html">← Salle de jeux</a><span class="sp"></span><div id="hall-bar" aria-live="polite"></div></div>
  <main id="app"><div class="card"><span class="load"></span> Chargement du profil…</div></main>
</div>
<script>
(function(){
const P=PROF, CAT=P.CAT, es=P.es, $=s=>document.querySelector(s);
const AV=['🎲','🦊','🐼','🐸','🐯','🦁','🐙','🦄','🐧','🐢','🦉','🐝','🐲','🐨','🐵','🐱','🐶','🦖','🚀','⚽','🎸','🎮','👑','🍀','🌟','🍕','🧀','🐍','🐦','🎯'];
const COLS=['#d8b25a','#e8735a','#5ab0e8','#6cc46a','#b07ae8','#f08ac0','#40c4b0','#f2c94c','#9aa3b5'];
const sp=new URLSearchParams(location.search); const other=sp.get('p');
const fmtT=m=>m<60?`${Math.round(m)} min`:`${Math.floor(m/60)} h ${String(Math.round(m%60)).padStart(2,'0')}`;
const share=async(text,url)=>{ if(navigator.share){ try{ await navigator.share({title:'Salle de jeux',text,url}); return; }catch(e){ if(e&&e.name==='AbortError') return; } } try{ await navigator.clipboard.writeText(text+' '+url); P.notice('Lien copié'); }catch(e){ prompt('Lien',url); } };
let ui={edit:false,fav:false,picker:false,code:false,defis:null,liste:null,q:'',fil:null,tab:'recus'};
function statsHTML(s,rec){ return `<div class="stats">
  <div class="st"><b>${s.parties}</b><span>parties jouées</span></div><div class="st"><b>${s.nbj}</b><span>jeux essayés sur ${Object.keys(CAT).length}</span></div>
  <div class="st"><b>${s.v}</b><span>victoires</span></div><div class="st"><b>${s.l}</b><span>parties en ligne</span></div>
  <div class="st"><b>${fmtT(s.t)}</b><span>de jeu</span></div><div class="st"><b>${s.best}</b><span>jours d’affilée (record)</span></div></div>`; }
function podium(s){ if(!s.top.length) return '<p class="empty">Aucune partie pour l’instant : lance-toi !</p>'; const order=[1,0,2].filter(i=>s.top[i]); const med=['🥇','🥈','🥉'];
  return `<div class="podium">${order.map(i=>{ const g=s.top[i]; return `<a class="pod p${i+1}" href="${g.k}.html"><span class="m">${med[i]}</span><b>${es(CAT[g.k].t)}</b><small>${g.p} partie${g.p>1?'s':''}${g.v?` · ${g.v} victoire${g.v>1?'s':''}`:''}</small></a>`; }).join('')}</div>`; }
function recHTML(d,own){ const ks=Object.keys(P.ARCADE).filter(k=>d.rec&&d.rec[k]); if(!ks.length) return '<p class="empty">Joue à Serpents, Souricière ou Piaf pour établir tes records.</p>';
  return `<ul class="list">${ks.map(k=>`<li><span class="mini" style="--c:#2a4a3a">${{serpents:'🐍',souriciere:'🧀',piaf:'🐦'}[k]}</span><span class="tx"><b>${es(CAT[k].t)}</b><small>${d.rec[k]} ${P.ARCADE[k].u}</small></span>${own?`<button class="btn" data-defi-rec="${k}">⚔️ Défier</button>`:`<a class="btn pri" href="${k}.html?defi=${encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify({d:d.__pseudo,dk:P.key(d.__pseudo),j:k,c:d.rec[k]})))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''))}">Battre ce record</a>`}</li>`).join('')}</ul>`; }
function achHTML(d,onlyOk){ const s=P.stats(d); const done=a=>!!(d.succes||{})[a.id], ratio=a=>Math.min(1,(a.f(s,d)||0)/a.goal); let list=P.SUCCES.filter(a=>!onlyOk||done(a)); if(!onlyOk){ list=list.slice().sort((a,b)=>(done(b)-done(a))||(ratio(b)-ratio(a))); if(!ui.allAch){ const k=list.filter(done).length+6; var more=list.length-k; list=list.slice(0,k); } } if(!list.length) return '<p class="empty">Aucun succès débloqué pour l’instant.</p>';
  return `<div class="grid">${list.map(a=>{ const ok=!!(d.succes||{})[a.id]; const pr=Math.min(a.goal,a.f(s,d)||0); return `<div class="ach${ok?' ok':''}"><span class="i">${a.ic}</span><b>${es(a.t)}</b><small>${es(a.d)}</small>${ok?`<small>Débloqué le ${new Date(d.succes[a.id]).toLocaleDateString('fr-FR')}</small>`:`<span class="pb"><i style="width:${pr/a.goal*100}%"></i></span>`}</div>`; }).join('')}</div>${!onlyOk?`<div class="row"><button class="btn" data-a="allach">${ui.allAch?'Afficher moins':`Voir les ${more>0?more+' autres':'autres'} succès`}</button></div>`:''}`; }
function favHTML(d,own){ const f=(d.favs||[]).filter(k=>CAT[k]);
  if(own&&ui.fav) return `<p class="note">Touche un jeu pour l’ajouter ou le retirer de tes favoris (ils apparaissent aussi en haut de l’accueil).</p><div class="chips">${Object.entries(CAT).sort((a,b)=>a[1].t.localeCompare(b[1].t,'fr')).map(([k,g])=>`<button class="chip ${f.includes(k)?'on':''}" data-fav="${k}">${f.includes(k)?'★ ':''}${es(g.t)}</button>`).join('')}</div>`;
  return f.length?`<div class="chips">${f.map(k=>`<a class="chip fav" href="${k}.html">★ ${es(CAT[k].t)}</a>`).join('')}</div>`:`<p class="empty">${own?'Pas encore de favoris.':'Pas de jeu favori pour l’instant.'}</p>`; }
/* ---------- profil d’un autre joueur ---------- */
async function showOther(){ const app=$('#app'); let r=null; try{ r=await P.rpc('profil_lire',{p_k:P.key(other)}); }catch(e){}
  if(!r){ app.innerHTML=`<div class="card"><h2>${es(other)}</h2><p>Ce profil n’est pas encore public : un profil devient visible des autres joueurs à partir de 4 parties jouées avec un pseudo.</p><div class="row"><a class="btn pri" href="profil.html">Voir mon profil</a><a class="btn" href="profil.html#classement">Classement des joueurs</a></div></div>`; return; }
  const d=Object.assign({jeux:{},succes:{},rec:{},favs:[]},r.data||{}); d.__pseudo=r.pseudo; d.fil=r.filleuls; const s=P.stats(d); const me=P.pseudo(); const mine=me&&P.key(me)===r.k;
  document.title=r.pseudo+' – Salle de jeux';
  app.innerHTML=`<div class="card"><div class="hero"><span class="av ro" style="--c:${es(d.couleur||'#d8b25a')}">${es(d.avatar||'🎲')}</span><div class="who"><h1>${es(r.pseudo)}</h1>
     <div class="lvl"><b>Niveau ${s.niveau}</b><span class="bar"><i style="width:${s.prog*100}%"></i></span><small>${s.nbs} succès</small></div>${d.bio?`<p class="bio">${es(d.bio)}</p>`:''}
     <p class="vis">Membre depuis ${new Date(r.cree).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}${r.filleuls?` · a fait venir ${r.filleuls} ami${r.filleuls>1?'s':''}`:''}</p></div></div>
     <div class="row">${mine?'<a class="btn pri" href="profil.html">Modifier mon profil</a>':`<button class="btn pri" data-a="defier">⚔️ Défier ${es(r.pseudo)}</button>`}<button class="btn" data-a="share-other">Partager ce profil</button></div>
     <div id="defiBox"></div></div>
    <div class="card"><h2>Statistiques</h2>${statsHTML(s)}</div>
    <div class="card"><h2>Top 3 des jeux</h2>${podium(s)}</div>
    <div class="card"><h2>Jeux favoris</h2>${favHTML(d,false)}</div>
    <div class="card"><h2>Records des mini-jeux</h2>${recHTML(d,false)}</div>
    <div class="card"><h2>Succès <small>${s.nbs} / ${P.SUCCES.length}</small></h2>${achHTML(d,true)}</div>`;
  app.onclick=async e=>{ const b=e.target.closest('[data-a]'); if(!b) return;
    if(b.dataset.a==='share-other') share(`Le profil de ${r.pseudo} sur la Salle de jeux`,P.SITE+'profil.html?p='+encodeURIComponent(r.pseudo));
    if(b.dataset.a==='defier') $('#defiBox').innerHTML=defiForm(r.pseudo);
    if(b.dataset.a==='send') sendDefi(b);
    if(b.dataset.a==='link') linkDefi(); }; }
/* ---------- défis ---------- */
function defiForm(to){ const D=P.data(); const opts=Object.entries(CAT).sort((a,b)=>a[1].t.localeCompare(b[1].t,'fr')).map(([k,g])=>`<option value="${k}">${es(g.t)}${P.ARCADE[k]&&D.rec[k]?` (ton record : ${D.rec[k]})`:''}</option>`).join('');
  return `<div class="form"><label>Jeu<select id="dJeu">${opts}</select></label><label>Adversaire (pseudo)<input id="dTo" list="dList" value="${es(to||'')}" placeholder="Pseudo d’un joueur" maxlength="16"><datalist id="dList">${(ui.liste||[]).map(p=>`<option value="${es(p.pseudo)}">`).join('')}</datalist></label>
    <div class="row" style="margin:0"><button class="btn pri" data-a="send">Envoyer le défi</button><button class="btn" data-a="link">Partager un lien</button></div></div>
    <p class="note">Aux mini-jeux vidéo, le défi est de battre ton record. Aux autres jeux, c’est une invitation à jouer. Le lien marche même pour quelqu’un qui n’a pas encore de profil.</p><p class="note" id="dMsg"></p>`; }
async function sendDefi(b){ const j=$('#dJeu').value, to=$('#dTo').value.trim(), D=P.data(); const msg=$('#dMsg'); if(!to){ msg.textContent='Indique le pseudo de ton adversaire, ou partage un lien.'; return; }
  if(!P.pseudo()){ msg.textContent='Choisis d’abord un pseudo.'; return; } b.disabled=true; msg.innerHTML='<span class="load"></span> Envoi…';
  let r=null; try{ r=await P.sendDefi(to,j,P.ARCADE[j]&&D.rec[j]?D.rec[j]:null); }catch(e){} b.disabled=false;
  msg.textContent={ok:`Défi envoyé à ${to} ! Il le verra dans son profil.`,inconnu:`Aucun profil « ${to} ». Partage-lui plutôt un lien.`,limite:'Tu as envoyé beaucoup de défis aujourd’hui : réessaie demain.',refuse:'Ton profil n’est pas encore enregistré : réessaie dans un instant.',pseudo:'Choisis d’abord un pseudo.',invalide:'Tu ne peux pas te défier toi-même.'}[r]||'Envoi impossible pour le moment.';
  if(r==='ok'){ ui.defis=null; setTimeout(render,1500); } }
function linkDefi(){ const j=$('#dJeu').value, D=P.data(); P.shareDefi(j,P.ARCADE[j]&&D.rec[j]?D.rec[j]:null); }
const b64=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function defisHTML(){ const D=P.data(); const act=D.defiActif;
  let h=act?`<div class="warn" style="background:#fff3cf;color:#5a4410">⚔️ Défi en cours : ${es(P.defiText(act))} <a class="btn pri" style="margin-left:6px" href="${act.j}.html">Jouer</a></div>`:'';
  if(!P.pseudo()) return h+'<p class="empty">Choisis un pseudo pour recevoir et envoyer des défis.</p>';
  const tabs=`<div class="tabs"><button class="chip ${ui.tab==='recus'?'on':''}" data-tab="recus">Reçus</button><button class="chip ${ui.tab==='envoyes'?'on':''}" data-tab="envoyes">Envoyés</button><button class="chip ${ui.tab==='nouveau'?'on':''}" data-tab="nouveau">⚔️ Lancer un défi</button></div>`;
  if(ui.tab==='nouveau') return h+tabs+defiForm('');
  if(!ui.defis) return h+tabs+'<p class="empty"><span class="load"></span> Chargement…</p>';
  const L=ui.defis[ui.tab]||[]; if(!L.length) return h+tabs+`<p class="empty">${ui.tab==='recus'?'Aucun défi reçu pour l’instant.':'Aucun défi envoyé. Lance le premier !'}</p>`;
  const st={nouveau:['nouveau','new'],vu:['vu',''],reussi:['réussi','ok'],refuse:['refusé','']};
  return h+tabs+`<ul class="list">${L.map(x=>{ const g=CAT[x.jeu]; if(!g) return ''; const c=x.data&&x.data.c; const txt=c!=null&&P.ARCADE[x.jeu]?`faire mieux que ${c} ${P.ARCADE[x.jeu].u}`:'jouer une partie';
    const link=`${x.jeu}.html?defi=${b64({d:x.de,dk:x.dek,j:x.jeu,c:c!=null?c:undefined,i:x.id})}`;
    return `<li><span class="tx"><b>${ui.tab==='recus'?es(x.de):'À '+es(x.a)} · ${es(g.t)}</b><small>${txt} · ${new Date(x.cree).toLocaleDateString('fr-FR')}</small></span><span class="tag ${st[x.statut][1]}">${st[x.statut][0]}</span>${ui.tab==='recus'&&x.statut!=='reussi'&&x.statut!=='refuse'?`<a class="btn pri" href="${link}" data-go="${x.id}">Relever</a><button class="btn" data-ref="${x.id}">Refuser</button>`:''}</li>`; }).join('')}</ul>`; }
/* ---------- mon profil ---------- */
function render(){ if(other) return; const D=P.data(), s=P.stats(), ps=P.pseudo(), app=$('#app'); const pub=s.parties>3;
  if(ui.fil!=null&&D.fil!==ui.fil){ D.fil=ui.fil; P.save(); }
  const left=Math.max(0,4-s.parties);
  app.innerHTML=`<div class="card"><div class="hero"><button class="av" style="--c:${es(D.couleur)}" data-a="picker" aria-label="Changer d’avatar">${es(D.avatar)}</button><div class="who">
      <h1>${ps?es(ps):'Joueur sans pseudo'}</h1>
      <div class="lvl"><b>Niveau ${s.niveau}</b><span class="bar"><i style="width:${s.prog*100}%"></i></span><small>${s.xp} XP · encore ${s.next} XP</small></div>
      ${ui.edit?`<input class="bio-in" id="bio" maxlength="140" placeholder="Une phrase pour te présenter (jeu préféré, défi favori…)" value="${es(D.bio)}">`:D.bio?`<p class="bio">${es(D.bio)}</p>`:''}
      ${ps?`<p class="vis ${pub?'on':''}">${pub?'✓ Ton profil est visible par les autres joueurs.':`Ton profil sera visible des autres après ${left} partie${left>1?'s':''} de plus.`}</p>`:''}</div></div>
    ${ui.picker?`<div class="picker">${AV.map(a=>`<button data-av="${a}">${a}</button>`).join('')}</div><div class="cols">${COLS.map(c=>`<button class="${D.couleur===c?'on':''}" style="background:${c}" data-col="${c}" aria-label="Couleur"></button>`).join('')}</div>`:''}
    ${D.pris&&ps&&P.key(ps)===D.pris?`<div class="warn">Le pseudo « ${es(ps)} » appartient déjà au profil de quelqu’un d’autre : ton profil n’est pas publié. Choisis un autre pseudo, ou récupère ce profil avec son code (en bas de page).</div>`:''}
    <div class="row">${ps?'':'<button class="btn pri" data-a="pseudo">Choisir un pseudo</button>'}<button class="btn" data-a="edit">${ui.edit?'Enregistrer':'Modifier ma présentation'}</button>${ps&&pub?'<button class="btn gold" data-a="share">Partager mon profil</button>':''}${ps?'<button class="btn" data-a="pseudo">Changer de pseudo</button>':''}</div></div>
   <div class="card"><h2>Statistiques</h2>${statsHTML(s)}</div>
   <div class="card"><h2>Top 3 de mes jeux</h2>${podium(s)}</div>
   <div class="card"><h2>Mes jeux favoris <button class="btn" data-a="fav">${ui.fav?'Terminer':'Modifier'}</button></h2>${favHTML(D,true)}</div>
   <div class="card"><h2>Records des mini-jeux</h2>${recHTML(D,true)}</div>
   <div class="card"><h2>Succès <small>${s.nbs} / ${P.SUCCES.length} débloqués</small></h2>${achHTML(D,false)}</div>
   <div class="card" id="defis"><h2>Défis</h2>${defisHTML()}</div>
   <div class="card"><h2>Invite tes amis</h2><p>Partage ton lien : chaque ami qui joue 4 parties compte comme ton filleul et te rapproche des succès <b>Parrain</b> et <b>Ambassadeur</b>.</p>
     <div class="stats" style="margin:10px 0"><div class="st"><b>${D.fil||0}</b><span>ami${(D.fil||0)>1?'s':''} parrainé${(D.fil||0)>1?'s':''}</span></div></div>
     <div class="row"><button class="btn gold" data-a="invite">📨 Partager mon lien d’invitation</button></div>${ps?'':'<p class="note">Choisis un pseudo pour que tes parrainages soient comptés.</p>'}</div>
   <div class="card" id="classement"><h2>Classement des joueurs</h2><input class="inp" id="q" placeholder="Rechercher un pseudo" value="${es(ui.q)}" style="width:100%;max-width:320px;margin-bottom:10px">${listeHTML()}</div>
   <div class="card"><h2>Réglages</h2>${P.optsHTML()}${P.standalone()?'':'<div class="row"><button class="btn gold" data-a="install">📲 Installer l’appli sur cet appareil</button></div>'}<p class="note">Les réglages valent pour toute la Salle de jeux, sur cet appareil.</p></div>
   <div class="card"><h2>Mon profil sur un autre appareil</h2><p class="note">Ton profil est enregistré dans ce navigateur et sur le serveur. Pour le retrouver sur ton téléphone ou ton ordinateur, utilise ton code personnel. Ne le donne à personne.</p>
     ${ps?(ui.code?`<p><span class="code">${P.secret().match(/.{1,6}/g).join('-')}</span></p>`:'<button class="btn" data-a="code">Afficher mon code</button>'):''}
     <div class="form"><label>Pseudo du profil<input id="rPs" maxlength="16" placeholder="Ton pseudo"></label><label>Code<input id="rCode" placeholder="xxxxxx-xxxxxx-xxxxxx"></label><div class="row" style="margin:0"><button class="btn" data-a="restore">Récupérer ce profil</button></div></div><p class="note" id="rMsg"></p></div>`;
  const q=$('#q'); if(q) q.oninput=()=>{ ui.q=q.value; clearTimeout(q.t); q.t=setTimeout(()=>{ ui.liste=null; loadListe(); },300); };
  const bio=$('#bio'); if(bio) bio.focus(); P.bindOpts(app); }
function listeHTML(){ if(!ui.liste) return '<p class="empty"><span class="load"></span> Chargement…</p>'; if(!ui.liste.length) return `<p class="empty">${ui.q?'Aucun joueur trouvé.':'Pas encore de profil public : sois le premier !'}</p>`;
  const me=P.key(P.pseudo()); return `<ul class="list">${ui.liste.slice(0,50).map((p,i)=>`<li style="${p.k===me?'outline:2px solid #1d8f5a':''}"><span class="rk">${i+1}</span><span class="mini" style="--c:${es(p.couleur||'#d8b25a')}">${es(p.avatar||'🎲')}</span><span class="tx"><b>${es(p.pseudo)}${p.k===me?' (toi)':''}</b><small>Niveau ${p.niveau} · ${p.parties} parties · ${p.succes} succès${p.filleuls?` · ${p.filleuls} filleul${p.filleuls>1?'s':''}`:''}</small></span><a class="btn" href="profil.html?p=${encodeURIComponent(p.pseudo)}">Voir</a></li>`).join('')}</ul>`; }
async function loadListe(){ try{ ui.liste=await P.rpc('profils_liste',{p_q:ui.q||''}); }catch(e){ ui.liste=[]; } const c=$('#classement'); if(c&&!other){ const ul=c.querySelector('.list,.empty'); if(ul) ul.outerHTML=listeHTML(); } }
async function loadDefis(){ ui.defis=await P.mesDefis()||{recus:[],envoyes:[]}; const nv=ui.defis.recus.filter(x=>x.statut==='nouveau'); if(nv.length){ nv.forEach(x=>P.defiStatut(x.id,'vu')); } const c=$('#defis'); if(c) c.innerHTML='<h2>Défis</h2>'+defisHTML(); }
document.addEventListener('click',async e=>{ if(other) return; const D=P.data(); const t=e.target;
  const av=t.closest('[data-av]'); if(av){ P.setData({avatar:av.dataset.av}); render(); return; }
  const col=t.closest('[data-col]'); if(col){ P.setData({couleur:col.dataset.col}); render(); return; }
  const fv=t.closest('[data-fav]'); if(fv){ const f=new Set(D.favs||[]); f.has(fv.dataset.fav)?f.delete(fv.dataset.fav):f.add(fv.dataset.fav); P.setData({favs:[...f]}); render(); return; }
  const tb=t.closest('[data-tab]'); if(tb){ ui.tab=tb.dataset.tab; $('#defis').innerHTML='<h2>Défis</h2>'+defisHTML(); return; }
  const rf=t.closest('[data-ref]'); if(rf){ await P.defiStatut(+rf.dataset.ref,'refuse'); loadDefis(); return; }
  const dr=t.closest('[data-defi-rec]'); if(dr){ P.shareDefi(dr.dataset.defiRec,D.rec[dr.dataset.defiRec]); return; }
  const b=t.closest('[data-a]'); if(!b) return; const a=b.dataset.a;
  if(a==='picker'){ ui.picker=!ui.picker; render(); }
  else if(a==='allach'){ ui.allAch=!ui.allAch; render(); }
  else if(a==='edit'){ if(ui.edit){ const v=$('#bio'); P.setData({bio:(v?v.value:'').slice(0,140)}); } ui.edit=!ui.edit; render(); }
  else if(a==='fav'){ ui.fav=!ui.fav; render(); }
  else if(a==='pseudo'){ HALL.askPseudo(()=>{ P.sync().then(()=>{ render(); loadDefis(); }); render(); }); }
  else if(a==='share'){ const ps=P.pseudo(); share(`Viens voir mon profil sur la Salle de jeux : niveau ${P.stats().niveau}, ${P.stats().nbs} succès !`,P.SITE+'profil.html?p='+encodeURIComponent(ps)+'&de='+P.key(ps)); }
  else if(a==='invite'){ const ps=P.pseudo(); share('Rejoins-moi sur la Salle de jeux : plus de 30 jeux de société et mini-jeux, gratuits, à jouer en ligne entre amis !',P.SITE+(ps?'?de='+P.key(ps):'')); }
  else if(a==='code'){ ui.code=true; render(); }
  else if(a==='install'){ P.install(); }
  else if(a==='send') sendDefi(b); else if(a==='link') linkDefi();
  else if(a==='restore'){ const ps=$('#rPs').value.trim(), c=$('#rCode').value.trim(), m=$('#rMsg'); if(!ps||!c){ m.textContent='Indique le pseudo et le code.'; return; } m.innerHTML='<span class="load"></span> Vérification…';
    let ok=false; try{ ok=await P.restore(ps,c); }catch(e){} if(!ok){ m.textContent='Pseudo ou code incorrect.'; return; } try{ HALL.pseudo=''; await HALL.setPseudo(ps); }catch(e){} m.textContent='Profil récupéré !'; ui.defis=null; render(); loadDefis(); } });
async function start(){ if(other){ await showOther(); return; } render(); loadListe(); loadDefis(); const me=await P.moi(); if(me){ ui.fil=me.filleuls||0; render(); } else if(P.pseudo()){ await P.sync(); const m2=await P.moi(); if(m2){ ui.fil=m2.filleuls||0; render(); } } }
addEventListener('load',()=>setTimeout(()=>{ HALL.where('profil','Profil'); start(); if(location.hash==='#classement') setTimeout(()=>{ const c=$('#classement'); if(c) c.scrollIntoView(); },600); },60));
})();
</script>

</body></html>
