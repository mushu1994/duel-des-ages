<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Profil – Salle de jeux</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Karla:wght@400;500;700;800&display=swap">
</head><body>
<!--HALL--><style>/* hall (autonome : portail et jeux) */
#hall-modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;padding:12px}
#hall-modal[hidden]{display:none}
.hall-box{background:#fbf6ea;color:#2a2418;border-radius:16px;max-width:560px;width:100%;max-height:calc(100dvh - 24px);overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;font-family:"Nunito Sans",Karla,system-ui,sans-serif;text-align:left}
.hall-box h2{font-family:Georgia,serif;font-size:24px;margin:0 0 6px;color:#2a2418}
.hall-box h4{font-family:Georgia,serif;font-size:16px;margin:14px 0 6px;color:#2a2418}
.hall-box p{line-height:1.45;margin:6px 0}
.hall-in{font-weight:800;font-size:16px;font-family:inherit;padding:9px 11px;border-radius:9px;border:1px solid #c9b98f;background:#fff!important;color:#2a2418!important;-webkit-text-fill-color:#2a2418!important;caret-color:#2a2418;width:100%;max-width:300px}
.hall-in::placeholder{color:#a3926e!important;-webkit-text-fill-color:#a3926e!important;font-weight:600}
.hall-err{color:#b0412e;font-weight:800;min-height:1.2em;font-size:14px}
.hall-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.hall-btn{font-weight:800;font-size:14px;line-height:1;font-family:inherit;border-radius:9px;padding:8px 12px;border:1px solid #c9b98f;background:#ece3cf;color:#2a2418;cursor:pointer;touch-action:manipulation}
.hall-btn.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}
.hall-btn:disabled{opacity:.5}
.hall-link{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;cursor:pointer}
.hall-note{color:#6b5d40;font-size:14px}
.hall-me{background:#f0e6cf;border-radius:10px;padding:8px 10px;margin:6px 0}
.hall-list{list-style:none;margin:4px 0;padding:0;display:flex;flex-direction:column;gap:5px}
.hall-list li{display:flex;align-items:center;gap:9px;background:#f6efdc;border-radius:10px;padding:6px 8px}
.hall-tx{flex:1;min-width:0;display:flex;flex-direction:column}.hall-tx small{color:#6b5d40;font-size:12.5px}
.hall-av{width:30px;height:30px;border-radius:50%;background:#2a2418;color:#fff;display:grid;place-items:center;font-weight:900;flex:none;text-transform:uppercase}
.hall-games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.hall-spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid #c9b98f;border-top-color:#2a2418;animation:hallr 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes hallr{to{transform:rotate(360deg)}}
.hall-invite{position:fixed;right:12px;bottom:12px;z-index:85;background:#fbf6ea;color:#2a2418;border-radius:14px;padding:12px 14px 14px;box-shadow:0 14px 40px #000b;max-width:min(360px,calc(100vw - 24px));font-family:"Nunito Sans",Karla,system-ui,sans-serif;animation:hallin .35s cubic-bezier(.2,1.3,.4,1);overflow:hidden;border:2px solid #1d8f5a}
.hall-invite .hall-acts{margin-top:8px}
.hall-invite .hall-bar{position:absolute;left:0;bottom:0;height:4px;background:#1d8f5a;width:100%;animation:hallt 30s linear forwards}
@keyframes hallt{to{width:0}}
@keyframes hallin{from{transform:translateY(30px);opacity:0}}
.hall-toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-weight:700;font-family:system-ui,sans-serif}
#hall-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 0}
.hall-pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 13px;border:1px solid rgba(255,255,255,.25);background:rgba(29,143,90,.25);color:#eef3ea;font-weight:700;font-size:14px;line-height:1;font-family:inherit;cursor:pointer}
.hall-pill span{color:#d8b25a}
.hall-sub{font-size:14px;color:#a9c2b3}.hall-sub .hall-link{color:#eef3ea}
.hall-dot{width:9px;height:9px;border-radius:50%;background:#7dffb5;box-shadow:0 0 0 2px #fff4;animation:hallp 1.8s infinite}.hall-dot.off{background:#aaa;animation:none}
@keyframes hallp{50%{box-shadow:0 0 0 5px #7dffb500}}
</style><script>/* ===== Hall de la Salle de jeux : joueurs connectés, pseudos uniques, tables ouvertes, invitations (Supabase Realtime, sans base) ===== */
const HALL=(()=>{
 const SB_URL='https://evepcodcppxpufbkuflq.supabase.co', SB_KEY='sb_publishable_iUC6966SeFt_05Iac1wGQw_yDo9zl7y';
 const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
 const SITE='https://mushu1994.github.io/duel-des-ages/';
 const GAMES={"serpents":"Serpents","souriciere":"Souricière","piaf":"Piaf","derniere-carte":"Dernière carte","quitte-ou-sept":"Quitte ou Sept","joyaux-renaissance":"Joyaux de la Renaissance","sept-merveilles":"Sept Merveilles","echecs":"Échecs","quatre-en-ligne":"Quatre en ligne","reversi":"Reversi","dames":"Dames","bataille-navale":"Bataille navale","code-secret":"Code Secret","bataille":"La Bataille","petits-chevaux":"Petits Chevaux","dominos":"Dominos","tetes-de-boeuf":"Têtes de Bœuf","plus-bas":"Plus Bas","petit-bac":"Petit Bac","poker":"Poker","president":"Président","tarot":"Tarot","rami":"Rami voleur","remparts":"Remparts","conquete":"Conquête","approche-finale":"Approche finale","duel-des-joyaux":"Duel des Joyaux","duel-des-ages":"Duel des Âges","grand-proprietaire":"Grand Propriétaire","nouvelle-terre":"Nouvelle Terre","rails-d-europe":"Rails d’Europe"};
 const q=s=>document.querySelector(s), es=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const ld=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, sv=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
 const note=s=>{ if(typeof toast==='function') return toast(s); const t=document.createElement('div'); t.className='hall-toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); };
 const H={note,ready:false,ok:null,pseudo:ld('net-name')||'',peers:{},me:{},listeners:[],page:'',title:''};
 let cid=ld('net-cid'); if(!cid){ cid=Math.random().toString(36).slice(2,10); sv('net-cid',cid); } H.cid=cid;
 const key=p=>String(p||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[^a-z0-9]/g,'');
 H.key=key;
 let client=null, ch=null, libP=null, syncedP=null, syncRes=null, at=ld('net-at')||Date.now();
 function lib(){ if(window.supabase) return Promise.resolve(); if(libP) return libP; libP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=LIB; s.onload=res; s.onerror=()=>{ libP=null; rej(new Error('lib')); }; document.head.appendChild(s); }); return libP; }
 H.client=async()=>{ await lib(); if(!client) client=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}}); return client; };
 /* ---------- connexion au hall ---------- */
 H.connect=async()=>{ if(ch) return syncedP; syncedP=new Promise(r=>syncRes=r);
   try{ await H.client(); }catch(e){ H.ok=false; paint(); return syncedP; }
   ch=client.channel('salle:hall',{config:{broadcast:{self:false},presence:{key:H.cid}}});
   ch.on('presence',{event:'sync'},onSync);
   ch.on('broadcast',{event:'inv'},({payload:p})=>{ if(p.to===H.cid) invited(p); });
   ch.on('broadcast',{event:'invr'},({payload:p})=>{ if(p.to===H.cid) note(p.ok?`${p.fromP} arrive à ta table`:`${p.fromP} ne peut pas jouer maintenant`); });
   const to=setTimeout(()=>{ if(H.ok==null){ H.ok=false; paint(); syncRes(); } },9000);
   ch.subscribe(async st=>{ if(st==='SUBSCRIBED'){ clearTimeout(to); H.ok=true; await track(); setTimeout(()=>syncRes(),900); paint(); } else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ if(H.ok==null){ H.ok=false; paint(); syncRes(); } } });
   return syncedP; };
 function payload(){ return Object.assign({p:H.pseudo,k:key(H.pseudo),at,g:H.page,gt:H.title},H.me); }
 async function track(){ if(!ch) return; try{ await ch.track(payload()); }catch(e){} }
 function onSync(){ const st=ch.presenceState(), peers={}; for(const k in st){ const m=st[k][st[k].length-1]; if(m) peers[k]=m; } H.peers=peers;
   // doublon de pseudo : le plus récent cède la place
   if(H.pseudo){ const mk=key(H.pseudo); for(const k in peers){ if(k===H.cid) continue; const o=peers[k]; if(o.p&&o.k===mk&&(o.at<at||(o.at===at&&k<H.cid))){ const old=H.pseudo; H.pseudo=''; sv('net-name',null); track(); note(`Le pseudo « ${old} » est déjà utilisé par quelqu’un d’autre`); setTimeout(()=>H.askPseudo(),300); break; } } }
   paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); }
 H.onChange=f=>H.listeners.push(f);
 H.set=o=>{ Object.assign(H.me,o); track(); };
 H.where=(page,title)=>{ H.page=page; H.title=title; track(); };
 H.list=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&m.p).map(([k,m])=>Object.assign({cid:k},m)).sort((a,b)=>a.p.localeCompare(b.p));
 H.count=()=>Object.keys(H.peers).length;
 H.tables=g=>Object.entries(H.peers).map(([k,m])=>m.p&&m.r&&m.r.host&&m.r.open&&!m.r.started&&m.r.n<m.r.max&&(!g||m.r.g===g)?Object.assign({cid:k,p:m.p},m.r):null).filter(Boolean);
 H.free=p=>{ const k=key(p); return !Object.entries(H.peers).some(([c,m])=>c!==H.cid&&m.p&&m.k===k); };
 H.anon=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&!m.p).length;
 /* ---------- pseudo ---------- */
 H.setPseudo=async p=>{ p=String(p||'').replace(/\s+/g,' ').trim(); if(p.length<2||p.length>16||key(p).length<2) return 'Entre 2 et 16 caractères (lettres ou chiffres).';
   if(/^(ordi|ordinateur|bot|ia|robot)\d*$/i.test(key(p))) return 'Ce pseudo est réservé.';
   await H.connect(); if(!H.ok) return 'Connexion impossible pour le moment.';
   if(!H.free(p)) return `« ${p} » est déjà utilisé par quelqu’un en ligne.`; if(typeof PROF!=='undefined'&&!(await PROF.libre(p))) return 'Ce pseudo appartient au profil de quelqu’un d’autre. Si c’est le tien, récupère-le avec ton code depuis la page Profil.';
   H.pseudo=p; at=Date.now(); sv('net-at',at); sv('net-name',p); await track(); paint(); if(typeof PROF!=='undefined'){ PROF.sync(); try{ H.set({n:PROF.stats().parties,av:PROF.data().avatar}); }catch(e){} } H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); return null; };
 H.ensure=()=>H.pseudo?Promise.resolve(H.pseudo):new Promise(res=>H.askPseudo(res));
 H.askPseudo=(cb)=>{ openBox(`<h2>Ton pseudo</h2><p>Il s’affiche pour les autres joueurs connectés. Deux personnes en ligne ne peuvent pas avoir le même.</p>
   <input class="hall-in" id="hallPseudo" maxlength="16" placeholder="Ex. : Mushu" value="${es(H.pseudo||ld('net-last')||'')}"><p class="hall-err" id="hallErr"></p>
   <div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button><button class="hall-btn pri" data-hl="ok">Valider</button></div>`,async e=>{ const b=e.target.closest('[data-hl]'); if(!b) return; if(b.dataset.hl==='close'){ closeBox(); return; }
     const v=q('#hallPseudo').value; b.disabled=true; const err=await H.setPseudo(v); b.disabled=false; if(err){ q('#hallErr').textContent=err; return; } sv('net-last',H.pseudo); closeBox(); if(cb) cb(H.pseudo); });
   const i=q('#hallPseudo'); if(i){ i.focus(); i.onkeydown=e=>{ if(e.key==='Enter') q('[data-hl=ok]').click(); }; } };
 /* ---------- invitations ---------- */
 H.invite=(to,room)=>{ if(!ch) return; ch.send({type:'broadcast',event:'inv',payload:{to,from:H.cid,fromP:H.pseudo,g:room.g,gt:room.gt,code:room.code}}); note(`Invitation envoyée à ${(H.peers[to]||{}).p||'ce joueur'}`); };
 function invited(p){ const id='inv-'+p.code; if(q('#'+id)) return; if(typeof sfx==='function') sfx('ding');
   const d=document.createElement('div'); d.className='hall-invite'; d.id=id;
   d.innerHTML=`<b>${es(p.fromP)}</b> t’invite à jouer à <b>${es(p.gt)}</b><div class="hall-acts"><button class="hall-btn" data-i="no">Pas maintenant</button><button class="hall-btn pri" data-i="ok">Rejoindre</button></div><i class="hall-bar"></i>`;
   document.body.appendChild(d); const t=setTimeout(()=>d.remove(),30000);
   d.onclick=e=>{ const b=e.target.closest('[data-i]'); if(!b) return; clearTimeout(t); d.remove(); const ok=b.dataset.i==='ok';
     if(ch) ch.send({type:'broadcast',event:'invr',payload:{to:p.from,fromP:H.pseudo,ok}}); if(ok) H.goTable(p.g,p.code); }; }
 H.goTable=(g,code)=>{ if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined'){ NET.joinCode(code); return; } location.href=g+'.html?salle='+code; };
 H.inviteFlow=to=>{ const P=H.peers[to]; if(!P) return; const r=H.me.r;
   if(r&&r.host&&!r.started){ H.invite(to,r); return; }
   const opts=Object.entries(GAMES).sort((a,b)=>a[1].localeCompare(b[1],'fr'));
   openBox(`<h2>Inviter ${es(P.p)}</h2><p>Choisis le jeu : une table s’ouvre et l’invitation part tout de suite.</p><div class="hall-games">${opts.map(([g,t])=>`<button class="hall-btn" data-g="${g}">${es(t)}</button>`).join('')}</div><div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button></div>`,e=>{
     const b=e.target.closest('[data-g],[data-hl]'); if(!b) return; if(b.dataset.hl){ closeBox(); return; } const g=b.dataset.g; sessionStorage.setItem('hall-invite',JSON.stringify({to,g})); closeBox();
     if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined') NET.createFor(); else location.href=g+'.html?creer=1'; }); };
 H.pendingInvite=g=>{ try{ const v=JSON.parse(sessionStorage.getItem('hall-invite')||'null'); if(v&&v.g===g){ sessionStorage.removeItem('hall-invite'); return v.to; } }catch(e){} return null; };
 /* ---------- interface ---------- */
 function where(m){ if(m.r&&m.r.started) return `joue à ${es(m.r.gt)}`; if(m.r&&m.r.host) return `ouvre une table de ${es(m.r.gt)}`; if(m.r) return `attend à une table de ${es(m.r.gt)}`; return m.gt?`regarde ${es(m.gt)}`:'sur le portail'; }
 function busy(m){ return m.r&&m.r.started; }
 H.panelHTML=(g)=>{ if(H.ok===false) return `<p class="hall-note">Le salon en ligne n’est pas joignable d’ici.${/github\.io$/.test(location.hostname)?' Vérifie ta connexion.':` Ouvre la salle sur <a href="${SITE}" target="_blank" rel="noopener">le site</a>.`}</p>`;
   if(H.ok==null) return '<p class="hall-note"><span class="hall-spin"></span>Connexion au salon…</p>';
   const tabs=H.tables(g), ppl=H.list();
   return `<div class="hall-me">${H.pseudo?`Ton pseudo : <b>${es(H.pseudo)}</b> <button class="hall-link" data-hl="pseudo">changer</button>`:`<button class="hall-btn pri" data-hl="pseudo">Choisir un pseudo</button> <span class="hall-note">pour apparaître et être invité</span>`}</div>
    <h4>Tables ouvertes${g?'':' (tous les jeux)'}</h4>${tabs.length?`<ul class="hall-list">${tabs.map(t=>`<li><span class="hall-av">${es(t.p[0])}</span><span class="hall-tx"><b>${es(t.gt)}</b><small>table de ${es(t.p)} · ${t.n}/${t.max} joueurs</small></span>${t.cid===H.cid?'<small>ta table</small>':`<button class="hall-btn pri" data-join="${es(t.g)}:${es(t.code)}">Rejoindre</button>`}</li>`).join('')}</ul>`:`<p class="hall-note">Aucune table ouverte${g?' pour ce jeu':''} pour l’instant.</p>`}
    <h4>Joueurs en ligne (${ppl.length})</h4>${H.anon()?`<p class="hall-note">+ ${H.anon()} visiteur${H.anon()>1?'s':''} sans pseudo</p>`:''}${ppl.length?`<ul class="hall-list">${ppl.map(m=>`<li><span class="hall-av">${es(m.p[0])}</span><span class="hall-tx"><b>${m.av?es(m.av)+' ':''}${es(m.p)}</b><small>${where(m)}${m.n>3?` · <a class="hall-link" href="profil.html?p=${encodeURIComponent(m.p)}">voir le profil</a>`:''}</small></span>${H.pseudo&&!busy(m)?`<button class="hall-btn" data-inv="${m.cid}">Inviter</button>`:''}</li>`).join('')}</ul>`:'<p class="hall-note">Personne d’autre pour le moment. Partage le lien du site à tes amis !</p>'}`; };
 H.panelClick=e=>{ const b=e.target.closest('[data-hl],[data-join],[data-inv]'); if(!b) return false;
   if(b.dataset.hl==='pseudo'){ H.askPseudo(); return true; }
   if(b.dataset.join){ const [g,c]=b.dataset.join.split(':'); closeBox(); H.ensure().then(()=>H.goTable(g,c)); return true; }
   if(b.dataset.inv){ H.inviteFlow(b.dataset.inv); return true; } return false; };
 let boxCb=null;
 function openBox(h,cb,locked){ let m=q('#hall-modal'); if(!m){ m=document.createElement('div'); m.id='hall-modal'; m.innerHTML='<div class="hall-box" id="hall-box"></div>'; document.body.appendChild(m); m.addEventListener('click',e=>{ if(e.target===m){ if(!m.dataset.locked) closeBox(); return; } if(boxCb) boxCb(e); }); }
   q('#hall-box').innerHTML=h; boxCb=cb; m.dataset.locked=locked?'1':''; m.hidden=false; }
 function closeBox(){ const m=q('#hall-modal'); if(m) m.hidden=true; boxCb=null; if(H.onBoxClose){ const f=H.onBoxClose; H.onBoxClose=null; f(); } }
 H.openBox=openBox; H.closeBox=closeBox;
 H.openPanel=g=>{ const draw=()=>openBox(`<h2>Le salon</h2>${H.panelHTML(g)}<div class="hall-acts"><button class="hall-btn" data-hl="close">Fermer</button></div>`,e=>{ const b=e.target.closest('[data-hl=close]'); if(b){ closeBox(); return; } H.panelClick(e); });
   draw(); H.redraw=()=>{ const m=q('#hall-modal'); if(m&&!m.hidden&&q('#hall-box h2')&&q('#hall-box h2').textContent==='Le salon') draw(); }; };
 function paint(){ const bar=q('#hall-bar'); if(bar){ const n=H.count();
     bar.innerHTML=H.ok===false?'':`<button class="hall-pill" data-hl="open"><i class="hall-dot ${H.ok?'':'off'}"></i><b>${H.ok?n:'…'}</b> en ligne${H.pseudo?` · <span>${es(H.pseudo)}</span>`:''}</button>${H.ok?`<span class="hall-sub">${H.tables().length?`${H.tables().length} table${H.tables().length>1?'s':''} ouverte${H.tables().length>1?'s':''} · `:''}<button class="hall-link" data-hl="open">Voir qui joue</button>${H.pseudo?'':' · <button class="hall-link" data-hl="pseudo">choisir un pseudo</button>'}</span>`:''}`;
     bar.onclick=e=>{ const b=e.target.closest('[data-hl]'); if(!b) return; if(b.dataset.hl==='open') H.openPanel(''); else H.askPseudo(); }; }
   if(H.redraw) H.redraw(); if(typeof NET!=='undefined'&&NET.hallChanged) NET.hallChanged(); }
 H.paint=paint;
 return H; })();
addEventListener('load',()=>setTimeout(()=>{ if(!window.NETGAME) HALL.where('',''); HALL.connect(); },0));
</script><!--/HALL-->
<!--PROF--><script>/* ===== Profil du joueur : parties, victoires, succès, défis, parrainage (local + Supabase) ===== */
const PROF=(()=>{
 const SB_URL='https://evepcodcppxpufbkuflq.supabase.co', SB_KEY='sb_publishable_iUC6966SeFt_05Iac1wGQw_yDo9zl7y';
 const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
 const SITE='https://mushu1994.github.io/duel-des-ages/';

 let SECRET=ld('prof-secret'); if(!SECRET){ const a=new Uint8Array(18); (crypto.getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256|0)); SECRET=[...a].map(x=>'abcdefghjkmnpqrstuvwxyz23456789'[x%31]).join(''); sv('prof-secret',SECRET); }

 /* ---------- statistiques ---------- */
 const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
 P.stats=(d)=>{ d=d||D; const js=Object.entries(d.jeux||{}); const sum=f=>js.reduce((a,[,x])=>a+(x[f]||0),0);
   const jours=(d.jours||[]).slice().sort(); let serie=0; if(jours.length){ let cur=new Date(jours[jours.length-1]+'T12:00'); const t=new Date(today()+'T12:00'); if((t-cur)/864e5<=1){ serie=1; for(let i=jours.length-2;i>=0;i--){ const p=new Date(jours[i]+'T12:00'); if(Math.round((cur-p)/864e5)===1){ serie++; cur=p; } else if(Math.round((cur-p)/864e5)>1) break; } } }
   let best=0, run=jours.length?1:0; for(let i=1;i<jours.length;i++){ const g=Math.round((new Date(jours[i]+'T12:00')-new Date(jours[i-1]+'T12:00'))/864e5); run=g===1?run+1:g===0?run:1; best=Math.max(best,run); } best=Math.max(best,run,serie);
   const parties=sum('p'), v=sum('v'), l=sum('l'), t=sum('t'), nbj=js.filter(([,x])=>x.p>0).length, nbs=Object.keys(d.succes||{}).length;
   const xp=parties*10+v*15+l*5+nbs*50; const niveau=Math.floor(Math.sqrt(xp/40))+1; const base=40*(niveau-1)**2, next=40*niveau**2;
   return {parties,v,l,t,nbj,nbs,serie,best,xp,niveau,prog:(xp-base)/(next-base),next:next-xp,top:js.filter(([,x])=>x.p>0).sort((a,b)=>b[1].p-a[1].p||(b[1].t||0)-(a[1].t||0)).slice(0,3).map(([k,x])=>Object.assign({k},x))}; };
 /* ---------- succès ---------- */
 const A=(id,ic,t,d,f,goal)=>({id,ic,t,d,f,goal});

  A('curieux','🧭','Curieux','Essayer 5 jeux différents',s=>s.nbj,5), A('explorateur','🗺️','Explorateur','Essayer 15 jeux différents',s=>s.nbj,15), A('tourcomplet','🏛️','Tour complet','Essayer 30 jeux différents',s=>s.nbj,30),
  A('vainqueur','🏅','Première victoire','Gagner une partie',s=>s.v,1), A('champion','🏆','Champion','Gagner 10 parties',s=>s.v,10), A('invincible','💎','Invincible','Gagner 50 parties',s=>s.v,50),
  A('enligne','🌐','Connecté','Jouer une partie en ligne',s=>s.l,1), A('social','🤝','Esprit d’équipe','Jouer 10 parties en ligne',s=>s.l,10), A('pilier','🏟️','Pilier du salon','Jouer 50 parties en ligne',s=>s.l,50),

  A('piaf','🐦','Bel envol','Passer 20 colonnes à Piaf',(s,d)=>d.rec.piaf||0,20), A('piaf50','🦅','Roi du ciel','Passer 50 colonnes à Piaf',(s,d)=>d.rec.piaf||0,50),
  A('fidele','📅','Fidèle','Jouer 3 jours d’affilée',s=>s.best,3), A('assidu','🗓️','Assidu','Jouer 7 jours d’affilée',s=>s.best,7),
  A('marathon','⏱️','Marathon','Cumuler 2 heures de jeu',s=>Math.floor(s.t/60),120),
  A('noctambule','🌙','Noctambule','Jouer entre minuit et 5 h',(s,d)=>d.nuit?1:0,1),
  A('favoris','⭐','Coups de cœur','Choisir 3 jeux favoris',(s,d)=>(d.favs||[]).length,3), A('portrait','🪞','Autoportrait','Choisir un avatar et écrire une présentation',(s,d)=>(d.avatar&&d.avatar!=='🎲'&&d.bio?1:0),1),
  A('defieur','⚔️','Défieur','Envoyer un défi',(s,d)=>d.env||0,1), A('provocateur','📣','Provocateur','Envoyer 10 défis',(s,d)=>d.env||0,10), A('releve','🎯','Défi relevé','Réussir un défi reçu',(s,d)=>d.ok||0,1), A('imbattable','🥇','Imbattable','Réussir 5 défis',(s,d)=>d.ok||0,5),
  A('parrain','📨','Parrain','Faire venir un ami qui joue 4 parties',(s,d)=>d.fil||0,1), A('ambassadeur','🎖️','Ambassadeur','Faire venir 5 amis',(s,d)=>d.fil||0,5)];
 P.progress=(a,d)=>{ d=d||D; const s=P.stats(d); return Math.min(a.goal,a.f(s,d)||0); };
 function checkSucces(silent){ const s=P.stats(); const fresh=[]; for(const a of P.SUCCES){ if(D.succes[a.id]) continue; if((a.f(s,D)||0)>=a.goal){ D.succes[a.id]=Date.now(); fresh.push(a); } }
   if(fresh.length&&!silent) fresh.forEach((a,i)=>setTimeout(()=>notice(`${a.ic} Succès débloqué : ${a.t}`,true),400+i*2600)); return fresh.length; }
 /* ---------- notifications ---------- */
 function notice(txt,good,act){ const st=document.getElementById('prof-st'); if(!st){ const s=document.createElement('style'); s.id='prof-st'; s.textContent='.prof-note{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:95;background:#1b1b1f;color:#fff;border-radius:14px;padding:10px 16px;font:700 15px "Nunito Sans",Karla,system-ui,sans-serif;box-shadow:0 12px 34px #000a;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 24px);animation:profin .35s cubic-bezier(.2,1.3,.4,1)}.prof-note.good{background:linear-gradient(135deg,#b8862b,#e9c46a);color:#2a1a05}.prof-note button,.prof-note a{font:800 14px inherit;border:0;border-radius:9px;padding:7px 11px;background:#fff;color:#2a1a05;cursor:pointer;text-decoration:none;white-space:nowrap}@keyframes profin{from{transform:translate(-50%,30px);opacity:0}}'; document.head.appendChild(s); }
   const n=document.createElement('div'); n.className='prof-note'+(good?' good':''); n.innerHTML=`<span>${es(txt)}</span>`; if(act){ const b=document.createElement('button'); b.textContent=act[0]; b.onclick=()=>{ n.remove(); act[1](); }; n.appendChild(b); }
   document.body.appendChild(n); try{ if(good&&typeof sfx==='function') sfx('ding'); }catch(e){} setTimeout(()=>n.remove(),act?9000:3800); }
 P.notice=notice;
 /* ---------- enregistrement ---------- */
 const J=s=>(D.jeux[s]=D.jeux[s]||{p:0,v:0,l:0,t:0});
 function mark(){ const t=today(); if(!D.jours.includes(t)){ D.jours.push(t); D.jours=D.jours.slice(-90); } const h=new Date().getHours(); if(h<5) D.nuit=1; }
 P.played=(s,online)=>{ s=s||P.slug; if(!s||!CAT[s]) return; const j=J(s); j.p++; if(online) j.l++; j.last=Date.now(); mark(); armed=false; inter=0; checkDefiPlayed(s); save(); };
 let lastWin=0; P.won=(s)=>{ s=s||P.slug; if(!s||!CAT[s]) return; if(Date.now()-lastWin<8000) return; lastWin=Date.now(); J(s).v++; save(); };
 P.result=(s,o)=>{ if(o.win) P.won(s); if(o.score!=null&&o.score>(D.rec[s]||0)){ D.rec[s]=o.score; if(o.score>=(ARCADE[s]||{}).min) setTimeout(()=>notice(`Nouveau record à ${CAT[s].t} : ${o.score} ${ARCADE[s].u}`,true),900); } if(o.score!=null) checkDefiScore(s,o.score); save(); };
 let saveT=null, syncT=null;

 /* ---------- serveur ---------- */
 let client=null, libP=null;
 P.client=async()=>{ if(typeof HALL!=='undefined'&&HALL.client) return HALL.client(); if(client) return client;
   if(!window.supabase){ if(!libP) libP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=LIB; s.onload=res; s.onerror=()=>{ libP=null; rej(new Error('lib')); }; document.head.appendChild(s); }); await libP; }
   client=window.supabase.createClient(SB_URL,SB_KEY); return client; };
 P.rpc=async(fn,args)=>{ const c=await P.client(); const {data,error}=await c.rpc(fn,args); if(error) throw error; return data; };
 async function sync(){ const ps=P.pseudo(); if(!ps) return null; const s=P.stats(); const k=key(ps); if(k.length<2) return null;
   const data=Object.assign({},D,{nbs:s.nbs,niveau:s.niveau,bio:String(D.bio||'').slice(0,140)}); delete data.defiActif;
   try{ const r=await P.rpc('profil_sauver',{p_k:k,p_pseudo:ps,p_secret:SECRET,p_data:data,p_parties:s.parties,p_parrain:ld('prof-parrain')}); D.pris=r==='pris'?k:null; sv('prof',D); return r; }catch(e){ return null; } }
 P.sync=sync;
 P.libre=async ps=>{ try{ return await P.rpc('pseudo_libre',{p_k:key(ps),p_secret:SECRET}); }catch(e){ return true; } };
 P.moi=async()=>{ const ps=P.pseudo(); if(!ps) return null; try{ return await P.rpc('profil_moi',{p_k:key(ps),p_secret:SECRET}); }catch(e){ return null; } };
 P.restore=async(ps,code)=>{ code=String(code||'').replace(/[^a-z0-9]/gi,'').toLowerCase(); const r=await P.rpc('profil_moi',{p_k:key(ps),p_secret:code}); if(!r) return false;
   SECRET=code; sv('prof-secret',code); const d=r.data||{}; for(const [k,x] of Object.entries(D.jeux)){ const y=(d.jeux=d.jeux||{})[k]||{}; d.jeux[k]={p:Math.max(x.p||0,y.p||0),v:Math.max(x.v||0,y.v||0),l:Math.max(x.l||0,y.l||0),t:Math.max(x.t||0,y.t||0),last:Math.max(x.last||0,y.last||0)}; }
   D=Object.assign({},D,d,{jeux:d.jeux,succes:Object.assign({},D.succes,d.succes),rec:Object.assign({},D.rec,d.rec)}); D.pris=null; sv('prof',D); sv('net-name',r.pseudo); return true; };
 P.setData=o=>{ Object.assign(D,o); save(); };
 /* ---------- défis ---------- */
 const b64=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 const unb64=s=>{ try{ return JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))))); }catch(e){ return null; } };
 P.defiText=(o)=>{ const g=CAT[o.j]; if(!g) return ''; return o.c!=null&&ARCADE[o.j]?`${o.d} te défie à ${g.t} : fais mieux que ${o.c} ${ARCADE[o.j].u} !`:`${o.d} te défie à ${g.t} : viens jouer une partie !`; };
 P.defiLink=(j,cible)=>{ const ps=P.pseudo()||'Un ami'; const o={d:ps,dk:key(ps),j}; if(cible!=null) o.c=cible; return SITE+j+'.html?defi='+b64(o)+(ps?'&de='+key(ps):''); };
 P.shareDefi=async(j,cible)=>{ const url=P.defiLink(j,cible); const txt=cible!=null&&ARCADE[j]?`Je te défie à ${CAT[j].t} : bats mes ${cible} ${ARCADE[j].u} !`:`Je te défie à ${CAT[j].t} sur la Salle de jeux !`;
   D.env=(D.env||0)+1; save();

 P.sendDefi=async(toPseudo,j,cible)=>{ const ps=P.pseudo(); if(!ps) return 'pseudo'; await sync(); const r=await P.rpc('defi_envoyer',{p_de:key(ps),p_secret:SECRET,p_a:key(toPseudo),p_jeu:j,p_data:cible!=null?{c:cible}:{}}); if(r==='ok'){ D.env=(D.env||0)+1; save(); } return r; };

 P.defiStatut=async(id,st)=>{ const ps=P.pseudo(); if(!ps||!id) return; try{ await P.rpc('defi_statut',{p_k:key(ps),p_secret:SECRET,p_id:id,p_statut:st}); }catch(e){} };
 P.acceptDefi=(o)=>{ D.defiActif=Object.assign({},o,{t0:Date.now()}); sv('prof',D); };
 function defiDone(){ const o=D.defiActif; if(!o) return; D.defiActif=null; D.ok=(D.ok||0)+1; if(o.i) P.defiStatut(o.i,'reussi'); save();
   const txt=o.c!=null?`Défi de ${o.d} relevé à ${CAT[o.j].t} !`:`Défi de ${o.d} relevé !`;
   setTimeout(()=>notice(txt,true,['Le lui dire',async()=>{ const m=o.c!=null?`J’ai relevé ton défi à ${CAT[o.j].t} : ${D.rec[o.j]} ${ARCADE[o.j].u} contre tes ${o.c} ! À toi de jouer.`:`J’ai relevé ton défi à ${CAT[o.j].t} ! Une revanche ?`; const url=P.defiLink(o.j,o.c!=null?D.rec[o.j]:null); if(navigator.share){ try{ await navigator.share({text:m,url}); return; }catch(e){} } try{ await navigator.clipboard.writeText(m+' '+url); notice('Message copié'); }catch(e){} }]),1200); }
 function checkDefiScore(s,score){ const o=D.defiActif; if(o&&o.j===s&&o.c!=null&&score>o.c) defiDone(); }
 function checkDefiPlayed(s){ const o=D.defiActif; if(o&&o.j===s&&o.c==null) defiDone(); }
 /* ---------- détection générique des parties (jeux de société) ---------- */
 let armed=true, inter=0, t0=Date.now(), lastIn=0;
 const modalOpen=()=>['modal','hall-modal','cover','menu','overlay'].some(id=>{ const e=document.getElementById(id); return e&&!e.hidden&&e.offsetParent!==null; });

   const t=e.target; if(t&&t.closest){ const b=t.closest('button,[data-c]'); if(b&&(b.dataset&&b.dataset.c==='new'||(t.closest('#modal,#mbox,.mbox')&&/jouer|rejouer|revanche|nouvelle|commencer|lancer|c.est parti|go/i.test(b.textContent||'')))){ armed=true; inter=0; t0=Date.now(); return; } }
   if(modalOpen()) return; if(!armed) return; inter++; if(inter>=10&&Date.now()-t0>=30000) P.played(P.slug,typeof NET!=='undefined'&&NET.on&&NET.started); }
 addEventListener('pointerdown',onInput,true); addEventListener('keydown',onInput,true);
 setInterval(()=>{ if(!P.slug||document.hidden) return; if(Date.now()-lastIn<60000){ J(P.slug).t=(J(P.slug).t||0)+.25; sv('prof',D); } },15000);
 /* ---------- branchements ---------- */
 addEventListener('load',()=>setTimeout(()=>{
   if(P.slug&&!window.PROF_MANUAL){
     if(typeof window.confetti==='function'){ const c0=window.confetti; window.confetti=function(){ P.won(P.slug); armed=true; inter=0; t0=Date.now(); return c0.apply(this,arguments); }; }
     if(typeof window.sfx==='function'){ const s0=window.sfx; window.sfx=function(n){ if(n==='win'){ P.won(P.slug); armed=true; inter=0; t0=Date.now(); } return s0.apply(this,arguments); }; }
     const NG=window.NETGAME; if(NG&&NG.start){ const st0=NG.start; NG.start=function(){ P.played(P.slug,true); return st0.apply(this,arguments); }; }
   }
   const NG=window.NETGAME; if(NG&&NG.receive){ const r0=NG.receive; NG.receive=function(m){ try{ if(m&&m.kind==='new'&&typeof NET!=='undefined'&&NET.guest) P.played(P.slug,true); }catch(e){} return r0.apply(this,arguments); }; }

   try{ if(typeof HALL!=='undefined'&&HALL.set) HALL.set({n:P.stats().parties,av:D.avatar}); }catch(e){}
   setTimeout(sync,4000);

.topbar .sp{flex:1}
.card{background:var(--cream);color:var(--ink);border-radius:16px;padding:16px 18px;box-shadow:0 10px 26px rgba(0,0,0,.35);margin-bottom:16px}
.card h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 small{font-family:var(--body);font-size:14px;color:var(--mute);font-weight:700}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.av{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:50px;background:var(--c,#d8b25a);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 0 0 4px #fff;border:0;cursor:pointer;padding:0}
.av.ro{cursor:default}
.who h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,7vw,46px);line-height:1;margin:0;word-break:break-word}
.lvl{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.lvl b{background:var(--ink);color:var(--gold);border-radius:999px;padding:3px 11px;font-size:14px}
.bar{flex:1;min-width:140px;height:10px;border-radius:99px;background:var(--cream2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#d8a640,#f0cf7a)}
.lvl small{color:var(--mute);font-weight:700}
.bio{margin:10px 0 0;color:#3d3426}
.bio-in{width:100%;font:500 16px var(--body);border:1px solid #c9b98f;border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);-webkit-text-fill-color:var(--ink);margin-top:8px}
.vis{font-size:14px;color:var(--mute);margin:10px 0 0}
.vis.on{color:#1d7a46;font-weight:700}
.warn{background:#fbe1d6;color:#7a2a12;border-radius:10px;padding:8px 11px;font-weight:700;font-size:14px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:800 14px var(--body);border-radius:10px;padding:9px 13px;border:1px solid #c9b98f;background:#ece3cf;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}
.btn.gold{background:var(--ink);border-color:var(--ink);color:var(--gold)}
.btn:disabled{opacity:.5;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.st{background:#fbf6ea;border-radius:12px;padding:10px 12px}
.st b{display:block;font-family:var(--display);font-size:30px;font-weight:400;line-height:1.05}
.st span{font-size:13px;color:var(--mute);font-weight:700}
.podium{display:flex;justify-content:center;gap:10px;align-items:flex-end}.podium .pod{flex:1;max-width:220px}
.pod{background:#fbf6ea;border-radius:12px 12px 6px 6px;padding:10px;text-align:center;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px;border-bottom:6px solid var(--gold)}
.pod.p1{padding-top:22px;border-color:#d8a640}.pod.p2{border-color:#a9b2bf}.pod.p3{border-color:#c07a42}
.pod .m{font-size:28px}.pod b{font-size:15px}.pod small{color:var(--mute);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:700 14px var(--body);border-radius:999px;padding:6px 12px;border:1px solid #c9b98f;background:#fbf6ea;color:var(--ink);text-decoration:none;cursor:pointer}
.chip.on{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.chip.fav{background:#fff3cf;border-color:#e2c56a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ach{display:grid;grid-template-columns:40px 1fr;gap:4px 10px;background:#fbf6ea;border-radius:12px;padding:10px;align-items:center}
.ach .i{font-size:28px;grid-row:span 3;text-align:center;filter:grayscale(1);opacity:.45}
.ach.ok .i{filter:none;opacity:1}
.ach b{font-size:14.5px}.ach small{color:var(--mute);font-size:12.5px;line-height:1.3}
.ach .pb{height:6px;border-radius:9px;background:var(--cream2);overflow:hidden}.ach .pb i{display:block;height:100%;background:#1d8f5a}
.ach.ok{background:linear-gradient(135deg,#fff6dc,#fbe9b8);box-shadow:inset 0 0 0 1px #e2c56a}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.list li{display:flex;align-items:center;gap:10px;background:#fbf6ea;border-radius:12px;padding:8px 10px;flex-wrap:wrap}
.list li .tx{flex:1;min-width:150px}.list li .tx small{display:block;color:var(--mute);font-size:13px}
.mini{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--c,#d8b25a);flex:none}
.rk{font-family:var(--display);font-size:20px;width:26px;text-align:center}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--cream2)}
.tag.ok{background:#1d8f5a;color:#fff}.tag.new{background:#c0392b;color:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:end;margin-top:10px}
.form label{font-size:13px;font-weight:800;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.form select,.form input,.inp{font:600 16px var(--body);border:1px solid #c9b98f;border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);-webkit-text-fill-color:var(--ink)}
.note{font-size:14px;color:var(--mute);margin:6px 0}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:10px}
.picker button{font-size:26px;border:1px solid #d9caa4;background:#fbf6ea;border-radius:10px;height:46px;cursor:pointer}
.cols{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.cols button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #c9b98f;cursor:pointer}
.cols button.on{box-shadow:0 0 0 3px var(--ink)}
.code{font:800 20px ui-monospace,Menlo,monospace;letter-spacing:.12em;background:var(--ink);color:var(--gold);border-radius:10px;padding:8px 12px;display:inline-block;word-break:break-all}
.empty{color:var(--mute);font-size:14.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.load{display:inline-block;width:16px;height:16px;border-radius:50%;border:3px solid #c9b98f;border-top-color:var(--ink);animation:r 1s linear infinite;vertical-align:-3px}
@keyframes r{to{transform:rotate(360deg)}}
@media (max-width:520px){.hero{grid-template-columns:1fr;justify-items:start}.podium{gap:6px}.pod .m{font-size:22px}.pod b{font-size:13px}.card{padding:14px}}
</style>
<div class="wrap">
  <div class="topbar"><a class="back" href="index.html">← Salle de jeux</a><span class="sp"></span><div id="hall-bar" aria-live="polite"></div></div>
  <main id="app"><div class="card"><span class="load"></span> Chargement du profil…</div></main>
</div>
<script>
(function(){
const P=PROF, CAT=P.CAT, es=P.es, $=s=>document.querySelector(s);
const AV=['🎲','🦊','🐼','🐸','🐯','🦁','🐙','🦄','🐧','🐢','🦉','🐝','🐲','🐨','🐵','🐱','🐶','🦖','🚀','⚽','🎸','🎮','👑','🍀','🌟','🍕','🧀','🐍','🐦','🎯'];
const COLS=['#d8b25a','#e8735a','#5ab0e8','#6cc46a','#b07ae8','#f08ac0','#40c4b0','#f2c94c','#9aa3b5'];
const sp=new URLSearchParams(location.search); const other=sp.get('p');
const fmtT=m=>m<60?`${Math.round(m)} min`:`${Math.floor(m/60)} h ${String(Math.round(m%60)).padStart(2,'0')}`;
const share=async(text,url)=>{ if(navigator.share){ try{ await navigator.share({title:'Salle de jeux',text,url}); return; }catch(e){ if(e&&e.name==='AbortError') return; } } try{ await navigator.clipboard.writeText(text+' '+url); P.notice('Lien copié'); }catch(e){ prompt('Lien',url); } };
let ui={edit:false,fav:false,picker:false,code:false,defis:null,liste:null,q:'',fil:null,tab:'recus'};
function statsHTML(s,rec){ return `<div class="stats">
  <div class="st"><b>${s.parties}</b><span>parties jouées</span></div><div class="st"><b>${s.nbj}</b><span>jeux essayés sur ${Object.keys(CAT).length}</span></div>
  <div class="st"><b>${s.v}</b><span>victoires</span></div><div class="st"><b>${s.l}</b><span>parties en ligne</span></div>
  <div class="st"><b>${fmtT(s.t)}</b><span>de jeu</span></div><div class="st"><b>${s.best}</b><span>jours d’affilée (record)</span></div></div>`; }
function podium(s){ if(!s.top.length) return '<p class="empty">Aucune partie pour l’instant : lance-toi !</p>'; const order=[1,0,2].filter(i=>s.top[i]); const med=['🥇','🥈','🥉'];
  return `<div class="podium">${order.map(i=>{ const g=s.top[i]; return `<a class="pod p${i+1}" href="${g.k}.html"><span class="m">${med[i]}</span><b>${es(CAT[g.k].t)}</b><small>${g.p} partie${g.p>1?'s':''}${g.v?` · ${g.v} victoire${g.v>1?'s':''}`:''}</small></a>`; }).join('')}</div>`; }
function recHTML(d,own){ const ks=Object.keys(P.ARCADE).filter(k=>d.rec&&d.rec[k]); if(!ks.length) return '<p class="empty">Joue à Serpents, Souricière ou Piaf pour établir tes records.</p>';
  return `<ul class="list">${ks.map(k=>`<li><span class="mini" style="--c:#2a4a3a">${{serpents:'🐍',souriciere:'🧀',piaf:'🐦'}[k]}</span><span class="tx"><b>${es(CAT[k].t)}</b><small>${d.rec[k]} ${P.ARCADE[k].u}</small></span>${own?`<button class="btn" data-defi-rec="${k}">⚔️ Défier</button>`:`<a class="btn pri" href="${k}.html?defi=${encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify({d:d.__pseudo,dk:P.key(d.__pseudo),j:k,c:d.rec[k]})))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''))}">Battre ce record</a>`}</li>`).join('')}</ul>`; }
function achHTML(d,onlyOk){ const s=P.stats(d); const done=a=>!!(d.succes||{})[a.id], ratio=a=>Math.min(1,(a.f(s,d)||0)/a.goal); let list=P.SUCCES.filter(a=>!onlyOk||done(a)); if(!onlyOk){ list=list.slice().sort((a,b)=>(done(b)-done(a))||(ratio(b)-ratio(a))); if(!ui.allAch){ const k=list.filter(done).length+6; var more=list.length-k; list=list.slice(0,k); } } if(!list.length) return '<p class="empty">Aucun succès débloqué pour l’instant.</p>';
  return `<div class="grid">${list.map(a=>{ const ok=!!(d.succes||{})[a.id]; const pr=Math.min(a.goal,a.f(s,d)||0); return `<div class="ach${ok?' ok':''}"><span class="i">${a.ic}</span><b>${es(a.t)}</b><small>${es(a.d)}</small>${ok?`<small>Débloqué le ${new Date(d.succes[a.id]).toLocaleDateString('fr-FR')}</small>`:`<span class="pb"><i style="width:${pr/a.goal*100}%"></i></span>`}</div>`; }).join('')}</div>${!onlyOk?`<div class="row"><button class="btn" data-a="allach">${ui.allAch?'Afficher moins':`Voir les ${more>0?more+' autres':'autres'} succès`}</button></div>`:''}`; }
function favHTML(d,own){ const f=(d.favs||[]).filter(k=>CAT[k]);
  if(own&&ui.fav) return `<p class="note">Touche un jeu pour l’ajouter ou le retirer de tes favoris (ils apparaissent aussi en haut de l’accueil).</p><div class="chips">${Object.entries(CAT).sort((a,b)=>a[1].t.localeCompare(b[1].t,'fr')).map(([k,g])=>`<button class="chip ${f.includes(k)?'on':''}" data-fav="${k}">${f.includes(k)?'★ ':''}${es(g.t)}</button>`).join('')}</div>`;
  return f.length?`<div class="chips">${f.map(k=>`<a class="chip fav" href="${k}.html">★ ${es(CAT[k].t)}</a>`).join('')}</div>`:`<p class="empty">${own?'Pas encore de favoris.':'Pas de jeu favori pour l’instant.'}</p>`; }
/* ---------- profil d’un autre joueur ---------- */
async function showOther(){ const app=$('#app'); let r=null; try{ r=await P.rpc('profil_lire',{p_k:P.key(other)}); }catch(e){}
  if(!r){ app.innerHTML=`<div class="card"><h2>${es(other)}</h2><p>Ce profil n’est pas encore public : un profil devient visible des autres joueurs à partir de 4 parties jouées avec un pseudo.</p><div class="row"><a class="btn pri" href="profil.html">Voir mon profil</a><a class="btn" href="profil.html#classement">Classement des joueurs</a></div></div>`; return; }
  const d=Object.assign({jeux:{},succes:{},rec:{},favs:[]},r.data||{}); d.__pseudo=r.pseudo; d.fil=r.filleuls; const s=P.stats(d); const me=P.pseudo(); const mine=me&&P.key(me)===r.k;
  document.title=r.pseudo+' – Salle de jeux';
  app.innerHTML=`<div class="card"><div class="hero"><span class="av ro" style="--c:${es(d.couleur||'#d8b25a')}">${es(d.avatar||'🎲')}</span><div class="who"><h1>${es(r.pseudo)}</h1>
     <div class="lvl"><b>Niveau ${s.niveau}</b><span class="bar"><i style="width:${s.prog*100}%"></i></span><small>${s.nbs} succès</small></div>${d.bio?`<p class="bio">${es(d.bio)}</p>`:''}
     <p class="vis">Membre depuis ${new Date(r.cree).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}${r.filleuls?` · a fait venir ${r.filleuls} ami${r.filleuls>1?'s':''}`:''}</p></div></div>
     <div class="row">${mine?'<a class="btn pri" href="profil.html">Modifier mon profil</a>':`<button class="btn pri" data-a="defier">⚔️ Défier ${es(r.pseudo)}</button>`}<button class="btn" data-a="share-other">Partager ce profil</button></div>
     <div id="defiBox"></div></div>
    <div class="card"><h2>Statistiques</h2>${statsHTML(s)}</div>
    <div class="card"><h2>Top 3 des jeux</h2>${podium(s)}</div>
    <div class="card"><h2>Jeux favoris</h2>${favHTML(d,false)}</div>
    <div class="card"><h2>Records des mini-jeux</h2>${recHTML(d,false)}</div>
    <div class="card"><h2>Succès <small>${s.nbs} / ${P.SUCCES.length}</small></h2>${achHTML(d,true)}</div>`;
  app.onclick=async e=>{ const b=e.target.closest('[data-a]'); if(!b) return;
    if(b.dataset.a==='share-other') share(`Le profil de ${r.pseudo} sur la Salle de jeux`,P.SITE+'profil.html?p='+encodeURIComponent(r.pseudo));
    if(b.dataset.a==='defier') $('#defiBox').innerHTML=defiForm(r.pseudo);
    if(b.dataset.a==='send') sendDefi(b);
    if(b.dataset.a==='link') linkDefi(); }; }
/* ---------- défis ---------- */
function defiForm(to){ const D=P.data(); const opts=Object.entries(CAT).sort((a,b)=>a[1].t.localeCompare(b[1].t,'fr')).map(([k,g])=>`<option value="${k}">${es(g.t)}${P.ARCADE[k]&&D.rec[k]?` (ton record : ${D.rec[k]})`:''}</option>`).join('');
  return `<div class="form"><label>Jeu<select id="dJeu">${opts}</select></label><label>Adversaire (pseudo)<input id="dTo" list="dList" value="${es(to||'')}" placeholder="Pseudo d’un joueur" maxlength="16"><datalist id="dList">${(ui.liste||[]).map(p=>`<option value="${es(p.pseudo)}">`).join('')}</datalist></label>
    <div class="row" style="margin:0"><button class="btn pri" data-a="send">Envoyer le défi</button><button class="btn" data-a="link">Partager un lien</button></div></div>
    <p class="note">Aux mini-jeux vidéo, le défi est de battre ton record. Aux autres jeux, c’est une invitation à jouer. Le lien marche même pour quelqu’un qui n’a pas encore de profil.</p><p class="note" id="dMsg"></p>`; }
async function sendDefi(b){ const j=$('#dJeu').value, to=$('#dTo').value.trim(), D=P.data(); const msg=$('#dMsg'); if(!to){ msg.textContent='Indique le pseudo de ton adversaire, ou partage un lien.'; return; }
  if(!P.pseudo()){ msg.textContent='Choisis d’abord un pseudo.'; return; } b.disabled=true; msg.innerHTML='<span class="load"></span> Envoi…';
  let r=null; try{ r=await P.sendDefi(to,j,P.ARCADE[j]&&D.rec[j]?D.rec[j]:null); }catch(e){} b.disabled=false;
  msg.textContent={ok:`Défi envoyé à ${to} ! Il le verra dans son profil.`,inconnu:`Aucun profil « ${to} ». Partage-lui plutôt un lien.`,limite:'Tu as envoyé beaucoup de défis aujourd’hui : réessaie demain.',refuse:'Ton profil n’est pas encore enregistré : réessaie dans un instant.',pseudo:'Choisis d’abord un pseudo.',invalide:'Tu ne peux pas te défier toi-même.'}[r]||'Envoi impossible pour le moment.';
  if(r==='ok'){ ui.defis=null; setTimeout(render,1500); } }
function linkDefi(){ const j=$('#dJeu').value, D=P.data(); P.shareDefi(j,P.ARCADE[j]&&D.rec[j]?D.rec[j]:null); }
const b64=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function defisHTML(){ const D=P.data(); const act=D.defiActif;
  let h=act?`<div class="warn" style="background:#fff3cf;color:#5a4410">⚔️ Défi en cours : ${es(P.defiText(act))} <a class="btn pri" style="margin-left:6px" href="${act.j}.html">Jouer</a></div>`:'';
  if(!P.pseudo()) return h+'<p class="empty">Choisis un pseudo pour recevoir et envoyer des défis.</p>';
  const tabs=`<div class="tabs"><button class="chip ${ui.tab==='recus'?'on':''}" data-tab="recus">Reçus</button><button class="chip ${ui.tab==='envoyes'?'on':''}" data-tab="envoyes">Envoyés</button><button class="chip ${ui.tab==='nouveau'?'on':''}" data-tab="nouveau">⚔️ Lancer un défi</button></div>`;
  if(ui.tab==='nouveau') return h+tabs+defiForm('');
  if(!ui.defis) return h+tabs+'<p class="empty"><span class="load"></span> Chargement…</p>';
  const L=ui.defis[ui.tab]||[]; if(!L.length) return h+tabs+`<p class="empty">${ui.tab==='recus'?'Aucun défi reçu pour l’instant.':'Aucun défi envoyé. Lance le premier !'}</p>`;
  const st={nouveau:['nouveau','new'],vu:['vu',''],reussi:['réussi','ok'],refuse:['refusé','']};
  return h+tabs+`<ul class="list">${L.map(x=>{ const g=CAT[x.jeu]; if(!g) return ''; const c=x.data&&x.data.c; const txt=c!=null&&P.ARCADE[x.jeu]?`faire mieux que ${c} ${P.ARCADE[x.jeu].u}`:'jouer une partie';
    const link=`${x.jeu}.html?defi=${b64({d:x.de,dk:x.dek,j:x.jeu,c:c!=null?c:undefined,i:x.id})}`;
    return `<li><span class="tx"><b>${ui.tab==='recus'?es(x.de):'À '+es(x.a)} · ${es(g.t)}</b><small>${txt} · ${new Date(x.cree).toLocaleDateString('fr-FR')}</small></span><span class="tag ${st[x.statut][1]}">${st[x.statut][0]}</span>${ui.tab==='recus'&&x.statut!=='reussi'&&x.statut!=='refuse'?`<a class="btn pri" href="${link}" data-go="${x.id}">Relever</a><button class="btn" data-ref="${x.id}">Refuser</button>`:''}</li>`; }).join('')}</ul>`; }
/* ---------- mon profil ---------- */
function render(){ if(other) return; const D=P.data(), s=P.stats(), ps=P.pseudo(), app=$('#app'); const pub=s.parties>3;
  if(ui.fil!=null&&D.fil!==ui.fil){ D.fil=ui.fil; P.save(); }
  const left=Math.max(0,4-s.parties);
  app.innerHTML=`<div class="card"><div class="hero"><button class="av" style="--c:${es(D.couleur)}" data-a="picker" aria-label="Changer d’avatar">${es(D.avatar)}</button><div class="who">
      <h1>${ps?es(ps):'Joueur sans pseudo'}</h1>
      <div class="lvl"><b>Niveau ${s.niveau}</b><span class="bar"><i style="width:${s.prog*100}%"></i></span><small>${s.xp} XP · encore ${s.next} XP</small></div>
      ${ui.edit?`<input class="bio-in" id="bio" maxlength="140" placeholder="Une phrase pour te présenter (jeu préféré, défi favori…)" value="${es(D.bio)}">`:D.bio?`<p class="bio">${es(D.bio)}</p>`:''}
      ${ps?`<p class="vis ${pub?'on':''}">${pub?'✓ Ton profil est visible par les autres joueurs.':`Ton profil sera visible des autres après ${left} partie${left>1?'s':''} de plus.`}</p>`:''}</div></div>
    ${ui.picker?`<div class="picker">${AV.map(a=>`<button data-av="${a}">${a}</button>`).join('')}</div><div class="cols">${COLS.map(c=>`<button class="${D.couleur===c?'on':''}" style="background:${c}" data-col="${c}" aria-label="Couleur"></button>`).join('')}</div>`:''}
    ${D.pris&&ps&&P.key(ps)===D.pris?`<div class="warn">Le pseudo « ${es(ps)} » appartient déjà au profil de quelqu’un d’autre : ton profil n’est pas publié. Choisis un autre pseudo, ou récupère ce profil avec son code (en bas de page).</div>`:''}
    <div class="row">${ps?'':'<button class="btn pri" data-a="pseudo">Choisir un pseudo</button>'}<button class="btn" data-a="edit">${ui.edit?'Enregistrer':'Modifier ma présentation'}</button>${ps&&pub?'<button class="btn gold" data-a="share">Partager mon profil</button>':''}${ps?'<button class="btn" data-a="pseudo">Changer de pseudo</button>':''}</div></div>
   <div class="card"><h2>Statistiques</h2>${statsHTML(s)}</div>
   <div class="card"><h2>Top 3 de mes jeux</h2>${podium(s)}</div>
   <div class="card"><h2>Mes jeux favoris <button class="btn" data-a="fav">${ui.fav?'Terminer':'Modifier'}</button></h2>${favHTML(D,true)}</div>
   <div class="card"><h2>Records des mini-jeux</h2>${recHTML(D,true)}</div>
   <div class="card"><h2>Succès <small>${s.nbs} / ${P.SUCCES.length} débloqués</small></h2>${achHTML(D,false)}</div>
   <div class="card" id="defis"><h2>Défis</h2>${defisHTML()}</div>
   <div class="card"><h2>Invite tes amis</h2><p>Partage ton lien : chaque ami qui joue 4 parties compte comme ton filleul et te rapproche des succès <b>Parrain</b> et <b>Ambassadeur</b>.</p>
     <div class="stats" style="margin:10px 0"><div class="st"><b>${D.fil||0}</b><span>ami${(D.fil||0)>1?'s':''} parrainé${(D.fil||0)>1?'s':''}</span></div></div>
     <div class="row"><button class="btn gold" data-a="invite">📨 Partager mon lien d’invitation</button></div>${ps?'':'<p class="note">Choisis un pseudo pour que tes parrainages soient comptés.</p>'}</div>
   <div class="card" id="classement"><h2>Classement des joueurs</h2><input class="inp" id="q" placeholder="Rechercher un pseudo" value="${es(ui.q)}" style="width:100%;max-width:320px;margin-bottom:10px">${listeHTML()}</div>
   <div class="card"><h2>Mon profil sur un autre appareil</h2><p class="note">Ton profil est enregistré dans ce navigateur et sur le serveur. Pour le retrouver sur ton téléphone ou ton ordinateur, utilise ton code personnel. Ne le donne à personne.</p>
     ${ps?(ui.code?`<p><span class="code">${P.secret().match(/.{1,6}/g).join('-')}</span></p>`:'<button class="btn" data-a="code">Afficher mon code</button>'):''}
     <div class="form"><label>Pseudo du profil<input id="rPs" maxlength="16" placeholder="Ton pseudo"></label><label>Code<input id="rCode" placeholder="xxxxxx-xxxxxx-xxxxxx"></label><div class="row" style="margin:0"><button class="btn" data-a="restore">Récupérer ce profil</button></div></div><p class="note" id="rMsg"></p></div>`;
  const q=$('#q'); if(q) q.oninput=()=>{ ui.q=q.value; clearTimeout(q.t); q.t=setTimeout(()=>{ ui.liste=null; loadListe(); },300); };
  const bio=$('#bio'); if(bio) bio.focus(); }
function listeHTML(){ if(!ui.liste) return '<p class="empty"><span class="load"></span> Chargement…</p>'; if(!ui.liste.length) return `<p class="empty">${ui.q?'Aucun joueur trouvé.':'Pas encore de profil public : sois le premier !'}</p>`;
  const me=P.key(P.pseudo()); return `<ul class="list">${ui.liste.slice(0,50).map((p,i)=>`<li style="${p.k===me?'outline:2px solid #1d8f5a':''}"><span class="rk">${i+1}</span><span class="mini" style="--c:${es(p.couleur||'#d8b25a')}">${es(p.avatar||'🎲')}</span><span class="tx"><b>${es(p.pseudo)}${p.k===me?' (toi)':''}</b><small>Niveau ${p.niveau} · ${p.parties} parties · ${p.succes} succès${p.filleuls?` · ${p.filleuls} filleul${p.filleuls>1?'s':''}`:''}</small></span><a class="btn" href="profil.html?p=${encodeURIComponent(p.pseudo)}">Voir</a></li>`).join('')}</ul>`; }
async function loadListe(){ try{ ui.liste=await P.rpc('profils_liste',{p_q:ui.q||''}); }catch(e){ ui.liste=[]; } const c=$('#classement'); if(c&&!other){ const ul=c.querySelector('.list,.empty'); if(ul) ul.outerHTML=listeHTML(); } }
async function loadDefis(){ ui.defis=await P.mesDefis()||{recus:[],envoyes:[]}; const nv=ui.defis.recus.filter(x=>x.statut==='nouveau'); if(nv.length){ nv.forEach(x=>P.defiStatut(x.id,'vu')); } const c=$('#defis'); if(c) c.innerHTML='<h2>Défis</h2>'+defisHTML(); }
document.addEventListener('click',async e=>{ if(other) return; const D=P.data(); const t=e.target;
  const av=t.closest('[data-av]'); if(av){ P.setData({avatar:av.dataset.av}); render(); return; }
  const col=t.closest('[data-col]'); if(col){ P.setData({couleur:col.dataset.col}); render(); return; }
  const fv=t.closest('[data-fav]'); if(fv){ const f=new Set(D.favs||[]); f.has(fv.dataset.fav)?f.delete(fv.dataset.fav):f.add(fv.dataset.fav); P.setData({favs:[...f]}); render(); return; }
  const tb=t.closest('[data-tab]'); if(tb){ ui.tab=tb.dataset.tab; $('#defis').innerHTML='<h2>Défis</h2>'+defisHTML(); return; }
  const rf=t.closest('[data-ref]'); if(rf){ await P.defiStatut(+rf.dataset.ref,'refuse'); loadDefis(); return; }
  const dr=t.closest('[data-defi-rec]'); if(dr){ P.shareDefi(dr.dataset.defiRec,D.rec[dr.dataset.defiRec]); return; }
  const b=t.closest('[data-a]'); if(!b) return; const a=b.dataset.a;
  if(a==='picker'){ ui.picker=!ui.picker; render(); }
  else if(a==='allach'){ ui.allAch=!ui.allAch; render(); }
  else if(a==='edit'){ if(ui.edit){ const v=$('#bio'); P.setData({bio:(v?v.value:'').slice(0,140)}); } ui.edit=!ui.edit; render(); }
  else if(a==='fav'){ ui.fav=!ui.fav; render(); }
  else if(a==='pseudo'){ HALL.askPseudo(()=>{ P.sync().then(()=>{ render(); loadDefis(); }); render(); }); }
  else if(a==='share'){ const ps=P.pseudo(); share(`Viens voir mon profil sur la Salle de jeux : niveau ${P.stats().niveau}, ${P.stats().nbs} succès !`,P.SITE+'profil.html?p='+encodeURIComponent(ps)+'&de='+P.key(ps)); }
  else if(a==='invite'){ const ps=P.pseudo(); share('Rejoins-moi sur la Salle de jeux : plus de 30 jeux de société et mini-jeux, gratuits, à jouer en ligne entre amis !',P.SITE+(ps?'?de='+P.key(ps):'')); }
  else if(a==='code'){ ui.code=true; render(); }
  else if(a==='send') sendDefi(b); else if(a==='link') linkDefi();
  else if(a==='restore'){ const ps=$('#rPs').value.trim(), c=$('#rCode').value.trim(), m=$('#rMsg'); if(!ps||!c){ m.textContent='Indique le pseudo et le code.'; return; } m.innerHTML='<span class="load"></span> Vérification…';
    let ok=false; try{ ok=await P.restore(ps,c); }catch(e){} if(!ok){ m.textContent='Pseudo ou code incorrect.'; return; } try{ HALL.pseudo=''; await HALL.setPseudo(ps); }catch(e){} m.textContent='Profil récupéré !'; ui.defis=null; render(); loadDefis(); } });
async function start(){ if(other){ await showOther(); return; } render(); loadListe(); loadDefis(); const me=await P.moi(); if(me){ ui.fil=me.filleuls||0; render(); } else if(P.pseudo()){ await P.sync(); const m2=await P.moi(); if(m2){ ui.fil=m2.filleuls||0; render(); } } }
addEventListener('load',()=>setTimeout(()=>{ HALL.where('profil','Profil'); start(); if(location.hash==='#classement') setTimeout(()=>{ const c=$('#classement'); if(c) c.scrollIntoView(); },600); },60));
})();
</script>

</body></html>
