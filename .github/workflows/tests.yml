# Tests automatiques de la Salle de jeux : test complet chaque lundi matin ; tests rapides après chaque mise à jour du site.
name: Tests de la Salle de jeux
on:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Playwright
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Attendre la mise en ligne de GitHub Pages
        if: github.event_name == 'push'
        run: sleep 90
      - name: Chaque page se charge sans erreur
        run: python tests/smoke.py https://mushu1994.github.io/duel-des-ages/
      - name: Appli installable et jeux hors ligne
        run: python tests/offline.py https://mushu1994.github.io/duel-des-ages/
      - name: Jeu en ligne à trois et reprise par un autre joueur (chaque semaine)
        if: github.event_name != 'push'
        run: python tests/online.py https://mushu1994.github.io/duel-des-ages/
