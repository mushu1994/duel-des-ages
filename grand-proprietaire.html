<script>/*NETJS*//* ===== Hall de la Salle de jeux : joueurs connectés, pseudos uniques, tables ouvertes, invitations (Supabase Realtime, sans base) ===== */
const HALL=(()=>{
 const SB_URL='https://evepcodcppxpufbkuflq.supabase.co', SB_KEY='sb_publishable_iUC6966SeFt_05Iac1wGQw_yDo9zl7y';
 const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
 const SITE='https://mushu1994.github.io/duel-des-ages/';
 const GAMES={"derniere-carte":"Dernière carte","quitte-ou-sept":"Quitte ou Sept","joyaux-renaissance":"Joyaux de la Renaissance","sept-merveilles":"Sept Merveilles","echecs":"Échecs","quatre-en-ligne":"Quatre en ligne","reversi":"Reversi","dames":"Dames","bataille-navale":"Bataille navale","code-secret":"Code Secret","bataille":"La Bataille","petits-chevaux":"Petits Chevaux","dominos":"Dominos","tetes-de-boeuf":"Têtes de Bœuf","plus-bas":"Plus Bas","petit-bac":"Petit Bac","poker":"Poker","president":"Président","tarot":"Tarot","rami":"Rami voleur","remparts":"Remparts","conquete":"Conquête","approche-finale":"Approche finale","duel-des-joyaux":"Duel des Joyaux","duel-des-ages":"Duel des Âges","grand-proprietaire":"Grand Propriétaire","nouvelle-terre":"Nouvelle Terre","rails-d-europe":"Rails d’Europe"};
 const q=s=>document.querySelector(s), es=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const ld=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, sv=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
 const note=s=>{ if(typeof toast==='function') return toast(s); const t=document.createElement('div'); t.className='hall-toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); };
 const H={note,ready:false,ok:null,pseudo:ld('net-name')||'',peers:{},me:{},listeners:[],page:'',title:''};
 let cid=ld('net-cid'); if(!cid){ cid=Math.random().toString(36).slice(2,10); sv('net-cid',cid); } H.cid=cid;
 const key=p=>String(p||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[^a-z0-9]/g,'');
 H.key=key;
 let client=null, ch=null, libP=null, syncedP=null, syncRes=null, at=ld('net-at')||Date.now();
 function lib(){ if(window.supabase) return Promise.resolve(); if(libP) return libP; libP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=LIB; s.onload=res; s.onerror=()=>{ libP=null; rej(new Error('lib')); }; document.head.appendChild(s); }); return libP; }
 H.client=async()=>{ await lib(); if(!client) client=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}}); return client; };
 /* ---------- connexion au hall ---------- */
 H.connect=async()=>{ if(ch) return syncedP; syncedP=new Promise(r=>syncRes=r);
   try{ await H.client(); }catch(e){ H.ok=false; paint(); return syncedP; }
   ch=client.channel('salle:hall',{config:{broadcast:{self:false},presence:{key:H.cid}}});
   ch.on('presence',{event:'sync'},onSync);
   ch.on('broadcast',{event:'inv'},({payload:p})=>{ if(p.to===H.cid) invited(p); });
   ch.on('broadcast',{event:'invr'},({payload:p})=>{ if(p.to===H.cid) note(p.ok?`${p.fromP} arrive à ta table`:`${p.fromP} ne peut pas jouer maintenant`); });
   const to=setTimeout(()=>{ if(H.ok==null){ H.ok=false; paint(); syncRes(); } },9000);
   ch.subscribe(async st=>{ if(st==='SUBSCRIBED'){ clearTimeout(to); H.ok=true; await track(); setTimeout(()=>syncRes(),900); paint(); } else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ if(H.ok==null){ H.ok=false; paint(); syncRes(); } } });
   return syncedP; };
 function payload(){ return Object.assign({p:H.pseudo,k:key(H.pseudo),at,g:H.page,gt:H.title},H.me); }
 async function track(){ if(!ch) return; try{ await ch.track(payload()); }catch(e){} }
 function onSync(){ const st=ch.presenceState(), peers={}; for(const k in st){ const m=st[k][st[k].length-1]; if(m) peers[k]=m; } H.peers=peers;
   // doublon de pseudo : le plus récent cède la place
   if(H.pseudo){ const mk=key(H.pseudo); for(const k in peers){ if(k===H.cid) continue; const o=peers[k]; if(o.p&&o.k===mk&&(o.at<at||(o.at===at&&k<H.cid))){ const old=H.pseudo; H.pseudo=''; sv('net-name',null); track(); note(`Le pseudo « ${old} » est déjà utilisé par quelqu’un d’autre`); setTimeout(()=>H.askPseudo(),300); break; } } }
   paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); }
 H.onChange=f=>H.listeners.push(f);
 H.set=o=>{ Object.assign(H.me,o); track(); };
 H.where=(page,title)=>{ H.page=page; H.title=title; track(); };
 H.list=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&m.p).map(([k,m])=>Object.assign({cid:k},m)).sort((a,b)=>a.p.localeCompare(b.p));
 H.count=()=>Object.keys(H.peers).length;
 H.tables=g=>Object.entries(H.peers).map(([k,m])=>m.p&&m.r&&m.r.host&&m.r.open&&!m.r.started&&m.r.n<m.r.max&&(!g||m.r.g===g)?Object.assign({cid:k,p:m.p},m.r):null).filter(Boolean);
 H.free=p=>{ const k=key(p); return !Object.entries(H.peers).some(([c,m])=>c!==H.cid&&m.p&&m.k===k); };
 H.anon=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&!m.p).length;
 /* ---------- pseudo ---------- */
 H.setPseudo=async p=>{ p=String(p||'').replace(/\s+/g,' ').trim(); if(p.length<2||p.length>16||key(p).length<2) return 'Entre 2 et 16 caractères (lettres ou chiffres).';

   if(!H.free(p)) return `« ${p} » est déjà utilisé par quelqu’un en ligne.`;
   H.pseudo=p; at=Date.now(); sv('net-at',at); sv('net-name',p); await track(); paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); return null; };
 H.ensure=()=>H.pseudo?Promise.resolve(H.pseudo):new Promise(res=>H.askPseudo(res));
 H.askPseudo=(cb)=>{ openBox(`<h2>Ton pseudo</h2><p>Il s’affiche pour les autres joueurs connectés. Deux personnes en ligne ne peuvent pas avoir le même.</p>
   <input class="hall-in" id="hallPseudo" maxlength="16" placeholder="Ex. : Mushu" value="${es(H.pseudo||ld('net-last')||'')}"><p class="hall-err" id="hallErr"></p>

const R=n=>Math.floor(Math.random()*n);
function shuf(a){ for(let i=a.length-1;i>0;i--){ const j=R(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newGame(cfg){
  const G={v:1,players:cfg.players.map(p=>({name:p.name,ai:!!p.ai,level:p.level||'normal',col:p.col,cash:cfg.cash||1500,pos:0,jail:0,jt:0,cards:[],lap:false,out:false})),
    own:{},cur:0,deck:{destin:shuf([...Array(16).keys()]),caisse:shuf([...Array(16).keys()])},bank:{h:32,H:12},phase:'start',dbl:0,round:1,turns:0,
    opt:{speed:cfg.speed!==false,limit:cfg.limit||0,auction:cfg.auction!==false},log:[],over:null,dice:[1,1,null],tradeMem:{}};
  OWNABLE.forEach(i=>G.own[i]={o:-1,h:0,m:false});
  return G; }
const alive=G=>G.players.map((p,i)=>i).filter(i=>!G.players[i].out);
const owner=(G,i)=>G.own[i]?G.own[i].o:-1;
function hasMono(G,pid,g){ return GIDX[g].every(i=>G.own[i].o===pid); }
function rentOf(G,i,dice,mult){ const s=SQ[i],o=G.own[i]; if(!o||o.o<0||o.m) return 0;
  if(s.t==='prop') return o.h>0?s.r[o.h]:(hasMono(G,o.o,s.g)?s.r[0]*2:s.r[0]);
  if(s.t==='rail'){ const n=RAILS.filter(j=>G.own[j].o===o.o).length; return 25*2**(n-1)*(mult===2?2:1); }
  const n=UTILS.filter(j=>G.own[j].o===o.o).length; return dice*(mult===10||n===2?10:4); }
function propsOf(G,pid){ return OWNABLE.filter(i=>G.own[i].o===pid); }
const hCost=i=>SQ[i].t==='prop'?GR[SQ[i].g].h:0;
const mortVal=i=>SQ[i].p/2, unmortCost=i=>Math.round(SQ[i].p/2*1.1);
function canBuild(G,pid,i){ const s=SQ[i],o=G.own[i]; if(s.t!=='prop'||o.o!==pid||o.h>=5) return false; if(!hasMono(G,pid,s.g)) return false;
  const grp=GIDX[s.g]; if(grp.some(j=>G.own[j].m)) return false; if(o.h>Math.min(...grp.map(j=>G.own[j].h))) return false;
  if(G.players[pid].cash<hCost(i)) return false; return o.h===4?G.bank.H>0:G.bank.h>0; }
function build(G,pid,i){ const o=G.own[i]; G.players[pid].cash-=hCost(i); if(o.h===4){ G.bank.H--; G.bank.h+=4; } else G.bank.h--; o.h++; }
function canSell(G,pid,i){ const s=SQ[i],o=G.own[i]; if(s.t!=='prop'||o.o!==pid||o.h<=0) return false; return o.h>=Math.max(...GIDX[s.g].map(j=>G.own[j].h)); }
function sell(G,pid,i){ const o=G.own[i],c=hCost(i)/2,p=G.players[pid];
  if(o.h===5){ G.bank.H++; const k=Math.min(4,G.bank.h); G.bank.h-=k; p.cash+=c*(5-k); o.h=k; }
  else { G.bank.h++; o.h--; p.cash+=c; } }
function canMort(G,pid,i){ const o=G.own[i]; if(!o||o.o!==pid||o.m) return false; const s=SQ[i]; return s.t!=='prop'||GIDX[s.g].every(j=>G.own[j].h===0); }
function mortgage(G,pid,i){ G.own[i].m=true; G.players[pid].cash+=mortVal(i); }
function canUnmort(G,pid,i){ const o=G.own[i]; return o&&o.o===pid&&o.m&&G.players[pid].cash>=unmortCost(i); }
function unmortgage(G,pid,i){ G.own[i].m=false; G.players[pid].cash-=unmortCost(i); }
function liquid(G,pid){ let v=G.players[pid].cash; for(const i of propsOf(G,pid)){ const o=G.own[i]; if(o.h) v+=o.h*hCost(i)/2; if(!o.m) v+=mortVal(i); } return v; }
function worth(G,pid){ let v=G.players[pid].cash; for(const i of propsOf(G,pid)){ const o=G.own[i]; v+=o.m?SQ[i].p/2:SQ[i].p; if(o.h) v+=o.h*hCost(i); } return v; }
function houseCount(G,pid){ let h=0,H=0; for(const i of propsOf(G,pid)){ const x=G.own[i].h; if(x===5)H++; else h+=x; } return {h,H}; }
function log(G,s){ G.log.push(s); if(G.log.length>80) G.log.shift(); }
const fmt=n=>n.toLocaleString('fr-FR')+' €';
const nm=(G,pid)=>G.players[pid].name;

/* --- argent --- */
async function pay(G,io,pid,to,amt,why){ if(amt<=0) return true; const p=G.players[pid];
  if(p.cash<amt) await io.raise(G,pid,amt,to,why);
  if(p.out) return false;
  if(p.cash<amt){ await bankrupt(G,io,pid,to); return false; }
  p.cash-=amt; if(to>=0) G.players[to].cash+=amt; await io.anim('cash',{pid,to,amt,why}); return true; }
async function gain(G,io,pid,amt,why){ G.players[pid].cash+=amt; await io.anim('cash',{pid:-1,to:pid,amt,why}); }
async function bankrupt(G,io,pid,to){ const p=G.players[pid]; if(p.out) return;
  for(const i of propsOf(G,pid)){ const o=G.own[i]; if(o.h){ if(o.h===5){G.bank.H++;p.cash+=5*hCost(i)/2;} else {G.bank.h+=o.h;p.cash+=o.h*hCost(i)/2;} o.h=0; } }
  const props=propsOf(G,pid);
  if(to>=0){ const c=G.players[to]; c.cash+=Math.max(0,p.cash); props.forEach(i=>G.own[i].o=to); c.cards.push(...p.cards);
    log(G,`💥 ${p.name} fait faillite : ${c.name} récupère ses biens.`); }
  else { props.forEach(i=>{G.own[i].o=-1;G.own[i].m=false;}); p.cards.forEach(k=>G.deck[k].push(CARDS[k].findIndex(c=>c.k==='free')));
    log(G,`💥 ${p.name} fait faillite face à la banque : ses terrains redeviennent libres.`); }
  p.cards=[]; p.cash=0; p.out=true; p.jail=0;
  await io.anim('bankrupt',{pid,to,props});
  checkEnd(G); }
function checkEnd(G){ const a=alive(G); if(a.length===1&&!G.over){ G.over={win:a[0],why:'last'}; log(G,`🏆 ${nm(G,a[0])} remporte la partie !`); } }
function endByLimit(G){ const a=alive(G).sort((x,y)=>worth(G,y)-worth(G,x)); G.over={win:a[0],why:'limit'}; log(G,`⏱ Fin de la partie : ${nm(G,a[0])} est le plus riche avec ${fmt(worth(G,a[0]))}.`); }

/* --- déplacement --- */
async function moveSteps(G,io,pid,n){ const p=G.players[pid],from=p.pos; const path=[];
  for(let k=1;k<=Math.abs(n);k++) path.push(((from+(n>0?k:-k))%40+40)%40);
  p.pos=path[path.length-1]; await io.anim('move',{pid,path,back:n<0});
  if(n>0&&from+n>=40) await passGo(G,io,pid); }
async function moveTo(G,io,pid,to){ const p=G.players[pid]; let n=(to-p.pos+40)%40; if(n===0) return; await moveSteps(G,io,pid,n); }
async function passGo(G,io,pid){ const p=G.players[pid]; p.lap=true; log(G,`${p.name} passe par Départ : +200 €.`); await io.anim('go',{pid}); await gain(G,io,pid,200,'Départ'); }
async function sendJail(G,io,pid,why){ const p=G.players[pid]; p.pos=10; p.jail=1; p.jt=0; G.dbl=0; log(G,`🚔 ${p.name} va en prison${why?' ('+why+')':''}.`); await io.anim('jail',{pid,why}); }
const roll=()=>1+R(6);
const SPEED=[1,2,3,'M','M','B'];

async function land(G,io,pid,ctx){ const p=G.players[pid],i=p.pos,s=SQ[i]; ctx=ctx||{};
  await io.anim('land',{pid,i});
  if(s.t==='gojail') return sendJail(G,io,pid,'attrapé par les autorités');
  if(s.t==='tax'){ log(G,`${p.name} paie ${s.n.toLowerCase()} : ${fmt(s.a)}.`); return pay(G,io,pid,-1,s.a,s.n); }
  if(s.t==='destin'||s.t==='caisse') return drawCard(G,io,pid,s.t);
  if(!G.own[i]) return;
  const o=G.own[i];
  if(o.o<0){ const want=await io.buy(G,pid,i);
    if(want&&p.cash>=s.p){ p.cash-=s.p; o.o=pid; log(G,`🏠 ${p.name} achète ${s.n} pour ${fmt(s.p)}.`); await io.anim('buy',{pid,i}); }
    else if(G.opt.auction) await auction(G,io,i);
    return; }
  if(o.o===pid) return;
  if(o.m){ log(G,`${s.n} est hypothéquée : pas de loyer.`); return; }
  let dice=ctx.dice||0, mult=ctx.mult;
  if(s.t==='util'&&mult===10){ const a=roll(),b=roll(); dice=a+b; await io.anim('dice',{d:[a,b,null],util:true}); }
  const r=rentOf(G,i,dice,mult);
  log(G,`${p.name} paie un loyer de ${fmt(r)} à ${nm(G,o.o)} (${s.n}).`);
  await pay(G,io,pid,o.o,r,'Loyer · '+s.n); }

async function drawCard(G,io,pid,deck){ const p=G.players[pid]; const id=G.deck[deck].shift(); const c=CARDS[deck][id];
  if(c.k!=='free') G.deck[deck].push(id);
  log(G,`${p.name} tire une carte ${deck==='destin'?'Imprévus du Destin':'Primes & Trésors'} : ${c.x}`);
  await io.card(G,pid,deck,c);
  switch(c.k){
    case 'goto': await moveTo(G,io,pid,c.to); return land(G,io,pid,{});
    case 'rail': { const t=RAILS.find(j=>j>p.pos)??RAILS[0]; await moveTo(G,io,pid,t); return land(G,io,pid,{mult:2}); }
    case 'util': { const t=UTILS.find(j=>j>p.pos)??UTILS[0]; await moveTo(G,io,pid,t); return land(G,io,pid,{mult:10}); }
    case 'cash': return c.a>0?gain(G,io,pid,c.a,'Carte'):pay(G,io,pid,-1,-c.a,'Carte');
    case 'free': p.cards.push(deck); return;
    case 'back': await moveSteps(G,io,pid,-c.a); return land(G,io,pid,{dice:0});
    case 'jail': return sendJail(G,io,pid,'carte');
    case 'repair': { const {h,H}=houseCount(G,pid); return pay(G,io,pid,-1,h*c.h+H*c.H,'Réparations'); }
    case 'each': for(const q of alive(G)){ if(q===pid) continue; if(G.players[pid].out) return;
        if(c.a<0) await pay(G,io,pid,q,-c.a,'Carte'); else await pay(G,io,q,pid,c.a,'Anniversaire'); } return; } }

async function auction(G,io,i){ const order=[]; const n=G.players.length; for(let k=0;k<n;k++){ const q=(G.cur+k)%n; if(!G.players[q].out) order.push(q); }
  let bid=0,hi=-1; const out=new Set(); await io.anim('auction',{i,start:true});
  let guard=0;
  while(guard++<400){ let acted=false;
    for(const q of order){ if(out.has(q)||q===hi) continue;
      if(order.filter(x=>!out.has(x)&&x!==hi).length===0) break;
      if(hi>=0&&order.filter(x=>!out.has(x)).length<=1) break;
      const b=await io.bid(G,q,i,bid,hi);
      if(b>bid&&b<=G.players[q].cash){ bid=b; hi=q; acted=true; await io.anim('auction',{i,bid,hi}); }
      else out.add(q); }
    if(!acted) break;
    if(order.filter(x=>!out.has(x)&&x!==hi).length===0) break; }
  await io.anim('auction',{i,end:true,bid,hi});
  if(hi>=0){ G.players[hi].cash-=bid; G.own[i].o=hi; log(G,`🔨 ${nm(G,hi)} remporte ${SQ[i].n} aux enchères pour ${fmt(bid)}.`); await io.anim('buy',{pid:hi,i}); }
  else log(G,`Personne n'enchérit : ${SQ[i].n} reste à la banque.`); }

/* Magnat (dé de rapidité) */
async function magnat(G,io,pid,dice){ const p=G.players[pid];
  let t=-1; for(let k=1;k<40;k++){ const j=(p.pos+k)%40; if(G.own[j]&&G.own[j].o<0){t=j;break;} }
  if(t<0) for(let k=1;k<40;k++){ const j=(p.pos+k)%40; const o=G.own[j]; if(o&&o.o>=0&&o.o!==pid&&!o.m){t=j;break;} }
  if(t<0){ log(G,`🎩 Magnat : rien à viser, ${p.name} reste sur place.`); await io.anim('magnat',{pid,none:true}); return; }
  log(G,`🎩 Magnat : ${p.name} file jusqu'à ${SQ[t].n}.`); await io.anim('magnat',{pid,t});
  await moveTo(G,io,pid,t); await land(G,io,pid,{dice}); }

/* tour complet (reprend selon G.phase) */
async function playTurn(G,io){ const pid=G.cur,p=G.players[pid];
  while(!G.over&&!p.out){
    if(G.phase==='post'){ await io.post(G,pid); break; }
    const a=await io.start(G,pid); if(p.out||G.over) break;
    if(p.jail&&(a==='pay'||a==='card')){
      if(a==='card'&&p.cards.length){ const k=p.cards.shift(); G.deck[k].push(CARDS[k].findIndex(c=>c.k==='free')); log(G,`${p.name} utilise son laissez-passer.`); }
      else { log(G,`${p.name} paie 50 € pour sortir de prison.`); if(!await pay(G,io,pid,-1,50,'Caution')) break; }
      p.jail=0; p.jt=0; await io.anim('free',{pid}); }
    const res=await rollMove(G,io,pid);
    if(G.over||p.out) break;
    G.phase=res==='again'?'start':'post'; io.save(G); }
  if(!G.over) nextPlayer(G); }
function nextPlayer(G){ const n=G.players.length; let k=G.cur; do{ k=(k+1)%n; }while(G.players[k].out);
  if(k<=G.cur) G.round++; G.cur=k; G.phase='start'; G.dbl=0; G.turns++;
  if(G.opt.limit&&G.round>G.opt.limit&&!G.over) endByLimit(G); }

async function rollMove(G,io,pid){ const p=G.players[pid];
  if(p.jail){ const a=roll(),b=roll(); G.dice=[a,b,null]; await io.anim('dice',{d:G.dice,pid});
    if(a===b){ p.jail=0;p.jt=0; log(G,`🎲 ${p.name} fait un double (${a}+${b}) et sort de prison !`); await io.anim('free',{pid}); await moveSteps(G,io,pid,a+b); await land(G,io,pid,{dice:a+b}); return 'end'; }
    p.jt++; if(p.jt<3){ log(G,`🎲 ${p.name} (${a}+${b}) reste en prison (essai ${p.jt}/3).`); return 'end'; }
    log(G,`${p.name} échoue une 3e fois : il paie 50 € et sort.`);
    if(!await pay(G,io,pid,-1,50,'Caution')) return 'end'; p.jail=0;p.jt=0; await io.anim('free',{pid});
    await moveSteps(G,io,pid,a+b); await land(G,io,pid,{dice:a+b}); return 'end'; }
  const a=roll(),b=roll(); const sp=G.opt.speed&&p.lap?SPEED[R(6)]:null; G.dice=[a,b,sp];
  await io.anim('dice',{d:G.dice,pid});
  if(typeof sp==='number'&&a===b&&b===sp){ log(G,`🎲 Triple ${a} ! ${p.name} peut aller sur la case de son choix.`);
    const dest=await io.triple(G,pid); if(dest!==p.pos){ await moveTo(G,io,pid,dest); } await land(G,io,pid,{dice:a+b+sp}); G.dbl=0; return 'end'; }
  const dbl=a===b;
  if(dbl){ G.dbl++; if(G.dbl>=3){ log(G,`🎲 Trois doubles d'affilée !`); await sendJail(G,io,pid,'trois doubles'); return 'end'; } }
  let steps=a+b;
  if(typeof sp==='number') steps+=sp;
  if(sp==='B'){ const c=await io.bus(G,pid,a,b); steps=c==='a'?a:c==='b'?b:a+b; }
  log(G,`🎲 ${p.name} : ${a} + ${b}${sp==null?'':typeof sp==='number'?' + '+sp:sp==='M'?' + Magnat':' + Bus'} → ${steps} case${steps>1?'s':''}${dbl?' (double)':''}.`);
  await moveSteps(G,io,pid,steps); await land(G,io,pid,{dice:steps});
  if(sp==='M'&&!p.jail&&!p.out&&!G.over) await magnat(G,io,pid,a+b);
  if(p.jail||p.out||G.over){ G.dbl=0; return 'end'; }
  return dbl?'again':'end'; }

/* ===== IA ===== */
function grpState(G,g){ const c={}; let bank=0,h=0; for(const j of GIDX[g]){ const o=G.own[j]; if(o.o<0) bank++; else c[o.o]=(c[o.o]||0)+1; h+=o.h; } return {c,bank,h,n:GIDX[g].length}; }
function completes(G,pid,i){ const s=SQ[i]; if(s.t!=='prop') return false; return GIDX[s.g].every(j=>j===i||G.own[j].o===pid); }
function blocks(G,pid,i){ const s=SQ[i]; if(s.t!=='prop') return false; const others=GIDX[s.g].filter(j=>j!==i).map(j=>G.own[j].o); return others[0]>=0&&others[0]!==pid&&others.every(o=>o===others[0]); }
function unownedCount(G){ return OWNABLE.filter(i=>G.own[i].o<0).length; }
function maxThreat(G,pid){ let m=0; for(const i of OWNABLE){ const o=G.own[i]; if(o.o>=0&&o.o!==pid&&!o.m){ const r=SQ[i].t==='util'?(UTILS.every(j=>G.own[j].o===o.o)?70:28):rentOf(G,i,7); if(r>m)m=r; } } return m; }
function reserve(G,pid){ const p=G.players[pid]; const base=p.level==='facile'?60:unownedCount(G)>12?60:120; return Math.min(p.level==='difficile'?250:350,Math.max(base,Math.round(maxThreat(G,pid)*(p.level==='difficile'?.3:.45)))); }
function aiBuy(G,pid,i){ const p=G.players[pid],s=SQ[i]; if(p.cash<s.p) return false;
  if(p.level==='facile') return p.cash-s.p>=40&&Math.random()<.85;
  if(completes(G,pid,i)||blocks(G,pid,i)) return p.cash-s.p>=10;
  return p.cash-s.p>=(unownedCount(G)>14?30:Math.min(reserve(G,pid),200)); }
function aiValue(G,pid,i){ const s=SQ[i]; let v=s.p; if(completes(G,pid,i)) v*=1.9; else if(blocks(G,pid,i)) v*=1.45; else if(s.t==='rail') v*=1+.15*RAILS.filter(j=>G.own[j].o===pid).length;
  const L=G.players[pid].level; return Math.round(v*(L==='facile'?.85:L==='difficile'?1.1:1)); }
function aiBid(G,pid,i,bid){ const p=G.players[pid]; const cap=Math.min(aiValue(G,pid,i),p.cash-(completes(G,pid,i)?0:40)); const step=bid<100?10:bid<300?20:50;
  const nb=bid+step; return nb<=cap?nb:0; }
function aiRaise(G,pid,amt){ const p=G.players[pid]; let guard=0;
  while(p.cash<amt&&guard++<200){
    const s=propsOf(G,pid).filter(i=>canSell(G,pid,i)).sort((x,y)=>hCost(x)-hCost(y)||G.own[y].h-G.own[x].h);
    const mono=g=>hasMono(G,pid,g);
    const m=propsOf(G,pid).filter(i=>canMort(G,pid,i)).sort((x,y)=>{ const mx=SQ[x].t==='prop'&&mono(SQ[x].g)?1:0,my=SQ[y].t==='prop'&&mono(SQ[y].g)?1:0; return mx-my||SQ[x].p-SQ[y].p; });
    if(m.length&&!(SQ[m[0]].t==='prop'&&mono(SQ[m[0]].g))) { mortgage(G,pid,m[0]); continue; }
    if(s.length){ sell(G,pid,s[0]); continue; }
    if(m.length){ mortgage(G,pid,m[0]); continue; }
    break; } }
const GPREF=[3,4,2,1,5,6,7,0];
function aiManage(G,pid){ const p=G.players[pid]; const acts=[];
