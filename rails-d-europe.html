<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rails d'Europe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700;800&family=Alegreya+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1d1812; --bg2:#2a221a; --panel:#f1e6cc; --panel2:#e6d6b2; --ink:#3a2a1b; --ink2:#6b5640; --gold:#c99a3b; --accent:#8b2e1f;
  --paper:#efe2c4; --sea:#b9cfc9; --seaInk:#2c4a52; --land:#ecdcb8; --mapInk:#4a3423; --frame:#5a3f26;
  --ui:"Alegreya Sans",system-ui,sans-serif; --title:"IM Fell English SC",Georgia,serif; --serif:"IM Fell English",Georgia,serif; --sc:"Alegreya SC",Georgia,serif;
}
body[data-map="na"]{--paper:#ecdcbc;--sea:#b4c8d3;--seaInk:#1f3d57;--land:#e7d3a4;--mapInk:#3d2c1e;--accent:#1f4e79;--frame:#4a3526}
body[data-map="no"]{--paper:#e9eeef;--sea:#9db8ca;--seaInk:#1d3550;--land:#f3f1e8;--mapInk:#22344a;--accent:#2f6489;--frame:#2c3d52}
body[data-map="jp"]{--paper:#f3ead8;--sea:#c3d3cf;--seaInk:#23423f;--land:#efe2c6;--mapInk:#2b2320;--accent:#b8322a;--frame:#3b2a22}
body[data-map="in"]{--paper:#f1dcb3;--sea:#b8cfc1;--seaInk:#264536;--land:#ebcd96;--mapInk:#4b2a14;--accent:#b5541b;--frame:#5b3417}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% -10%,#3a2e22,var(--bg) 60%) fixed,var(--bg);color:var(--panel);font-family:var(--ui);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(#2c231a,#221b14);border-bottom:1px solid #4a3a28;flex-wrap:wrap}
.top h1{font-family:var(--title);font-weight:400;font-size:26px;margin:0;color:#f3dfae;letter-spacing:.5px;white-space:nowrap}
.top h1 small{font-family:var(--serif);font-style:italic;font-size:15px;color:#c8b28a;margin-left:8px}
.back{color:#d8c59c;text-decoration:none;font-size:14px;border:1px solid #5a4630;padding:5px 10px;border-radius:8px}
.back:hover{background:#3a2e22}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#3a2e22;color:#f3e3bd;border:1px solid #6a5238;border-radius:9px;padding:7px 12px;font-size:14px;font-weight:600}
.btn:hover{background:#4a3a2a}
.btn.pri{background:linear-gradient(#b8432f,#8b2e1f);border-color:#d7664d;color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:#c99a3b;color:#2a1e10;border-color:#e8c26b}
.turnbar{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--pc,#c99a3b);color:#fff;font-weight:700;font-size:16px;box-shadow:0 4px 12px #0006;position:relative;z-index:3;transition:background .4s}
.turnbar .who{font-family:var(--title);font-weight:400;font-size:22px;text-shadow:0 1px 0 #0004;white-space:nowrap}
.turnbar .msg{font-weight:500;opacity:.95}
.turnbar .final{margin-left:auto;background:#fff;color:var(--accent);padding:3px 10px;border-radius:20px;font-size:13px;font-weight:800;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;padding:14px 16px 40px;max-width:1600px;margin:0 auto}
@media(max-width:980px){.layout{grid-template-columns:1fr;padding:10px 10px 40px}}
.boardwrap{min-width:0;display:flex;flex-direction:column;gap:10px}
#board{position:relative;width:min(100%,calc(max(420px,calc(100vh - 300px)) * var(--ar,1.4)));margin:0 auto;border-radius:14px;overflow:hidden;background:var(--frame);box-shadow:0 10px 30px #000a,inset 0 0 0 1px #0006;max-height:max(420px,calc(100vh - 300px));aspect-ratio:var(--ar,1.4)}
#map{width:100%;height:100%;display:block;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#map.drag{cursor:grabbing}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:34px;height:34px;border-radius:9px;border:1px solid #0005;background:#f3e8cfdd;color:#3a2a1b;font-size:18px;font-weight:700;box-shadow:0 2px 6px #0004}
.tip{position:absolute;pointer-events:none;background:#2a1f15ee;color:#f6ead0;padding:6px 9px;border-radius:8px;font-size:13px;z-index:4;white-space:nowrap;box-shadow:0 4px 12px #0006;transform:translate(-50%,-120%)}
.tip b{color:#ffd88a}
.caption{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-family:var(--title);font-size:clamp(18px,3vw,30px);color:var(--mapInk);background:#f5ebd3e6;padding:6px 18px;border-radius:6px;border:1px solid #0003;box-shadow:0 6px 18px #0004;opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;z-index:3}
.caption.show{opacity:1}
.caption small{display:block;font-family:var(--serif);font-style:italic;font-size:.55em;color:var(--ink2)}
.skip{position:absolute;left:12px;bottom:12px;z-index:5}
/* sheet (choix sur le plateau) */
.sheet{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(680px,calc(100% - 24px));background:#f4e9d0f2;color:var(--ink);border-radius:14px;padding:12px 14px;box-shadow:0 12px 36px #000a;z-index:6;border:1px solid #fff8;animation:sheetIn .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes sheetIn{from{transform:translate(-50%,40px);opacity:0}}
.sheet h3{margin:0 0 8px;font-family:var(--title);font-weight:400;font-size:20px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.sheet .btn{background:#e2d2ad;color:var(--ink);border-color:#b79e72}
.sheet .btn.pri{background:linear-gradient(#b8432f,#8b2e1f);color:#fff}
.payopt{display:flex;gap:4px;align-items:center;background:#fff8;border:2px solid transparent;border-radius:10px;padding:6px 8px;cursor:pointer;font-weight:700}
.payopt:hover{border-color:var(--accent)}
/* billets */
.tk{position:relative;display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#f7eccf,#efdfb8);color:var(--ink);border:1px solid #b89d6c;border-radius:6px;padding:7px 10px 7px 12px;font-size:14px;box-shadow:0 2px 4px #0003;cursor:default;min-width:0}
.tk::before,.tk::after{content:"";position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--bg2);transform:translateY(-50%)}
.tk::before{left:-6px}.tk::after{right:-6px}
.sheet .tk::before,.sheet .tk::after{background:#f4e9d0}
.tk .tc{flex:1;min-width:0;font-family:var(--sc);font-weight:700;line-height:1.15}
.tk .tc span{color:var(--ink2);font-weight:500}
.tk .tv{font-family:var(--ui);font-weight:800;font-variant-numeric:lining-nums;font-size:20px;color:var(--accent);min-width:26px;text-align:center}
.tk.long{background:linear-gradient(90deg,#f6dfa6,#e9c77c);border-color:#a17a2c}
.tk.done{opacity:.85}
.tk.done .stamp{position:absolute;right:38px;top:50%;transform:translateY(-50%) rotate(-12deg);border:2px solid #2c7a3e;color:#2c7a3e;font-family:var(--title);font-size:12px;padding:0 5px;border-radius:4px;background:#fff6}
.tk.sel{outline:3px solid var(--accent);outline-offset:1px}
.tk.pick{cursor:pointer;flex:1 1 200px}
.tk.pick:hover{transform:translateY(-2px)}
.tklist{display:flex;flex-direction:column;gap:7px}
/* cartes wagon */
.tcard{--c:#888;position:relative;width:58px;height:40px;border-radius:7px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 85%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 75%,#000));border:2px solid #fff;box-shadow:0 2px 5px #0006;display:grid;place-items:center;flex:none}
.tcard svg{width:36px;height:22px;fill:#0007;stroke:none}
.tcard.c-noir svg{fill:#fff8}.tcard.c-blanc{border-color:#cfc6b4}
.tcard.c-loco{background:conic-gradient(from 200deg,#c9363a,#e7862a,#eec535,#3b9a4e,#2d6fc2,#8549b8,#c9363a)}
.tcard.c-loco svg{fill:#fffd}
.tcard.back{background:repeating-linear-gradient(45deg,#7a2a1e 0 6px,#8f3626 6px 12px);border-color:#e6c98f}
.tcard.back svg{fill:#f2d79a}
.market{display:flex;gap:10px;align-items:center;background:linear-gradient(#3a2d20,#2c2218);border:1px solid #57432d;border-radius:14px;padding:10px 12px;flex-wrap:wrap}
.market .lab{font-family:var(--title);font-size:15px;color:#d9c49a;margin-right:4px}
.market .slot{cursor:default;transition:transform .15s}
.market .slot.can{cursor:pointer}
.market .slot.can:hover{transform:translateY(-4px)}
.market .slot.can .tcard{box-shadow:0 0 0 2px #ffd88a,0 4px 10px #000a}
.market .slot.dim{opacity:.45}
.market .sep{width:1px;align-self:stretch;background:#57432d;margin:0 4px}
.deckc{position:relative}
.deckc .n{position:absolute;right:-6px;bottom:-6px;background:#1d1812;color:#f3e3bd;font-size:11px;font-weight:800;border-radius:9px;padding:1px 6px;border:1px solid #6a5238}
.tdeck{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#f6dfa6,#e9c77c);color:var(--ink);border-radius:7px;padding:8px 12px;font-family:var(--title);font-size:15px;border:2px solid #fff;box-shadow:0 2px 5px #0006}
.handbar{display:flex;gap:12px;align-items:center;background:linear-gradient(#f1e6cc,#e3d2ab);color:var(--ink);border-radius:14px;padding:10px 12px;min-height:74px;flex-wrap:wrap;box-shadow:0 6px 16px #0006}
.handbar .lab{font-family:var(--title);font-size:17px;margin-right:4px}
.handbar .empty{color:var(--ink2);font-style:italic}
.stack{position:relative;width:70px;height:52px;transition:transform .2s}
.stack .tcard{position:absolute;left:0;top:6px}
.stack .cnt{position:absolute;right:-2px;top:-4px;background:var(--ink);color:#fff;font-weight:800;font-size:13px;border-radius:12px;min-width:22px;height:22px;display:grid;place-items:center;border:2px solid #f1e6cc;z-index:3}
.stack.glow .tcard:last-of-type{box-shadow:0 0 0 3px #fff,0 0 14px 4px var(--accent)}
.stack.glow{transform:translateY(-3px)}
.handbar .acts{margin-left:auto;display:flex;gap:8px}
.handbar .btn{background:#d9c79f;color:var(--ink);border-color:#a88c5c}
/* panneau latéral */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--bg2);border:1px solid #4a3a28;border-radius:14px;padding:12px}
.panel h3{margin:0 0 8px;font-family:var(--title);font-weight:400;color:#f0d9a4;font-size:18px}
.pl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--bg2);border:1px solid #4a3a28;border-radius:12px;padding:9px 12px;margin-bottom:8px;transition:all .3s;position:relative;overflow:hidden}
.pl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pc)}
.pl.cur{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc),0 6px 18px #0007;transform:translateX(-3px)}
.pl .nm{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.pl .nm .tag{font-size:10px;font-weight:800;background:var(--pc);color:#fff;border-radius:5px;padding:1px 5px;letter-spacing:.5px}
.pl .lv{font-size:11px;color:#bba887;font-weight:500}
.pl .sc{grid-row:span 2;font-family:var(--ui);font-weight:800;font-variant-numeric:lining-nums;font-size:26px;color:#ffe0a0;text-align:right;min-width:44px}
.pl .st{grid-column:1;font-size:12.5px;color:#d7c6a3;display:flex;gap:10px;flex-wrap:wrap}
.pl .st i{font-style:normal;font-weight:800;color:#fff}
.wag{display:inline-block;width:14px;height:8px;border-radius:2px;background:var(--pc);border:1px solid #0006;vertical-align:middle;margin-right:3px}
#tickets .tk{margin-bottom:7px}
#tickets .none{color:#bba887;font-style:italic;font-size:14px}
#log{max-height:220px;overflow:auto;font-size:13px;color:#d7c6a3;display:flex;flex-direction:column-reverse;gap:3px}
#log div{border-bottom:1px dashed #4a3a28;padding:2px 0}
/* modal */
#modal{position:fixed;inset:0;background:#0009;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:14px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);color:var(--ink);border-radius:16px;max-width:860px;width:100%;max-height:92vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px #000c;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox h2{font-family:var(--title);font-weight:400;font-size:30px;margin:0 0 4px;color:var(--ink)}
.mbox h4{font-family:var(--title);font-weight:400;font-size:19px;margin:16px 0 8px}
.mbox p,.mbox li{line-height:1.5}
.mbox .btn{background:#e2d2ad;color:var(--ink);border-color:#b79e72}
.mbox .btn.pri{background:linear-gradient(#b8432f,#8b2e1f);color:#fff;border-color:#d7664d}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mapc{border:2px solid #c9b48b;border-radius:12px;padding:8px;background:#fff6;cursor:pointer;text-align:center;transition:all .2s}
.mapc:hover{transform:translateY(-3px)}
.mapc.sel{border-color:var(--accent);box-shadow:0 0 0 3px #8b2e1f33;background:#fff}
.mapc svg{width:100%;height:96px;display:block;border-radius:7px}
.mapc b{display:block;font-family:var(--title);font-weight:400;font-size:17px;margin-top:4px}
.mapc small{display:block;color:var(--ink2);font-size:12px}
.prow{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.prow .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);border:2px solid #0004}
.prow input:not([type=checkbox]){font-family:inherit;font-weight:700;font-size:16px;padding:6px 9px;border-radius:8px;border:1px solid #b79e72;background:#fff;color:#3a2a1b;-webkit-text-fill-color:#3a2a1b;caret-color:#8b2e1f;width:150px;color-scheme:light}
.prow input::placeholder{color:#a8916a;-webkit-text-fill-color:#a8916a;font-weight:600}
.seg{display:inline-flex;border:1px solid #b79e72;border-radius:9px;overflow:hidden}
.seg button{border:0;background:#f4ead2;padding:6px 10px;font-weight:600;color:var(--ink);font-size:13px}
.seg button.on{background:var(--ink);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{border:1px solid #b79e72;background:#f4ead2;border-radius:20px;padding:5px 12px;font-weight:700;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
.ex{display:inline-flex;gap:4px;vertical-align:middle}
.ex i{display:inline-block;width:18px;height:9px;border-radius:2px;border:1px solid #3a2a1a}
table.res{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.res th,table.res td{padding:6px 8px;border-bottom:1px solid #d3bf95;text-align:right}
table.res th:first-child,table.res td:first-child{text-align:left}
table.res tr.win td{background:#f6df9f}
table.res td.tot{font-family:var(--title);font-size:22px}
/* écran de passage */
#cover{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#3a2e22,#120e0a);color:#f3dfae;text-align:center;padding:20px}
#cover[hidden]{display:none}
#cover h2{font-family:var(--title);font-weight:400;font-size:40px;margin:0 0 6px}
#cover .pc{display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--pc);vertical-align:middle;margin-right:8px;border:3px solid #fff}
.toast{position:fixed;left:50%;top:110px;transform:translateX(-50%);background:#2a1f15;color:#f8e8c4;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #000a;z-index:70;font-weight:600;border:1px solid #6a5238;animation:toast 2.6s forwards;pointer-events:none;max-width:90vw;text-align:center}
.toast.good{background:#244a2c;border-color:#5fae6c}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.bannerx{position:fixed;inset:0;display:grid;place-items:center;z-index:65;pointer-events:none}
.bannerx div{font-family:var(--title);font-size:clamp(34px,7vw,76px);color:#fff;background:var(--accent);padding:10px 40px;transform:rotate(-3deg);box-shadow:0 20px 50px #000a;animation:ban 2.2s forwards;border:4px double #fff}
@keyframes ban{0%{transform:scale(2) rotate(-8deg);opacity:0}15%{transform:scale(1) rotate(-3deg);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.9) rotate(-3deg)}}
.flycard{position:fixed;z-index:80;pointer-events:none}
/* ---------- carte SVG ---------- */
#map .cityc{fill:var(--paper);stroke:var(--mapInk);stroke-width:2}
#map .cityd{fill:var(--mapInk)}
#map .lbl{font-family:var(--sc);font-weight:700;font-size:11.5px;fill:var(--mapInk);paint-order:stroke;stroke:var(--paper);stroke-width:3.2px;stroke-linejoin:round;pointer-events:none}
#map .city{cursor:pointer}
#map .city.hl .cityc{fill:#ffe08a;stroke:var(--accent);stroke-width:3}
#map .city.hl .lbl{fill:var(--accent)}
#map .city.stmode .cityc{fill:#fff;stroke:#d48b1f;stroke-width:3;animation:stp 1s infinite}
@keyframes stp{50%{stroke-width:6}}
#map .ring{fill:none;stroke:var(--accent);stroke-width:2.5;animation:ring 1.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(2.6);opacity:0}}
#map .slot{stroke:#2f2215;stroke-width:.9}
#map .slot.tun{stroke:#140d07;stroke-width:1.7;stroke-dasharray:2.6 1.4}
#map .rt{cursor:pointer}
#map .rt .hit{stroke:transparent;stroke-width:20;fill:none}
#map .rt.hov .slot{filter:brightness(1.18);stroke:#000;stroke-width:1.6}
#map .rt.can .slot{animation:canGlow 1.6s infinite}
@keyframes canGlow{50%{stroke:#fff;stroke-width:2}}
#map .rt.taken{pointer-events:none}
#map .rt.dead .slot{opacity:.35}
#map.dimOthers .claimed:not(.focus){opacity:.15}
#map.dimOthers #routes{opacity:.22}
#map #routes,#map .claimed{transition:opacity .5s}
#map .wg{animation:drop .5s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes drop{from{transform:translateY(-38px);opacity:0}}
#map .wagon{stroke-width:.9}
#map .coast{fill:none;stroke:var(--mapInk);stroke-width:1.1;opacity:.85}
#map .bord{fill:none;stroke:var(--mapInk);stroke-width:.8;stroke-dasharray:1.5 2.5;opacity:.42}
#map .grat{fill:none;stroke:var(--seaInk);stroke-width:.6;opacity:.16}
#map .wl{fill:none;stroke:var(--seaInk)}
#map .cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
#map .trace{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#map .float{font-family:var(--title);font-size:26px;paint-order:stroke;stroke:#fff;stroke-width:4px;pointer-events:none}
#map .puff{fill:#fff;pointer-events:none}
#map .stn{animation:drop .6s cubic-bezier(.3,1.6,.5,1) backwards}
#map .aur{animation:aur 7s ease-in-out infinite alternate}
@keyframes aur{from{opacity:.25;transform:translateX(-20px)}to{opacity:.6;transform:translateX(30px)}}
#map .sunrays{animation:spin 90s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
#map .compass{animation:cin 2.4s ease-out backwards}
@keyframes cin{from{transform:rotate(-120deg) scale(.4);opacity:0}}
/* intro */
#map.intro .coast{stroke-dasharray:1;stroke-dashoffset:1;animation:ink 2.6s ease-in-out forwards}
@keyframes ink{to{stroke-dashoffset:0}}
#map.intro .landf{animation:fadeIn 1.4s 1.1s backwards}
#map.intro .wls,#map.intro .bord,#map.intro .decor{animation:fadeIn 1.2s 1.8s backwards}
#map.intro .city{animation:popC .5s cubic-bezier(.3,1.8,.5,1) backwards;animation-delay:var(--d)}
@keyframes popC{from{transform:scale(0);opacity:0}}
#map .city{transform-box:fill-box;transform-origin:center}
#map.intro .rt{animation:fadeIn .45s backwards;animation-delay:var(--d)}
#map.intro .lbl{animation:fadeIn .6s backwards;animation-delay:calc(var(--d) + .2s)}
@keyframes fadeIn{from{opacity:0}}
#map .city.big .lbl{fill:var(--accent);font-weight:700}
#map .city.big .cityc{fill:#ffe08a}

#hall-modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;padding:12px}

.hall-box{background:#fbf6ea;color:#2a2418;border-radius:16px;max-width:560px;width:100%;max-height:calc(100dvh - 24px);overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;font-family:"Nunito Sans",Karla,system-ui,sans-serif;text-align:left}
.hall-box h2{font-family:Georgia,serif;font-size:24px;margin:0 0 6px;color:#2a2418}

.hall-invite{position:fixed;right:12px;bottom:12px;z-index:85;background:#fbf6ea;color:#2a2418;border-radius:14px;padding:12px 14px 14px;box-shadow:0 14px 40px #000b;max-width:min(360px,calc(100vw - 24px));font-family:"Nunito Sans",Karla,system-ui,sans-serif;animation:hallin .35s cubic-bezier(.2,1.3,.4,1);overflow:hidden;border:2px solid #1d8f5a}

@keyframes hallt{to{width:0}}
@keyframes hallin{from{transform:translateY(30px);opacity:0}}
.hall-toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-weight:700;font-family:system-ui,sans-serif}

.net-spin{width:18px;height:18px;border-radius:50%;border:3px solid #c9b98f;border-top-color:#2a2418;animation:netr 1s linear infinite;flex:none}
@keyframes netr{to{transform:rotate(360deg)}}
.net-rules{margin-top:6px}

.net-me{background:#f0e6cf;border-radius:10px;padding:8px 10px;margin:6px 0}
.net-link{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;cursor:pointer}
.net-chk{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;margin:6px 0}.net-chk input{width:18px;height:18px}

/* contrôles dans la boîte du hall (indépendants du jeu) */

.hall-box .btn.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}.hall-box .btn:disabled{opacity:.45;cursor:default}
.hall-box .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}

.hall-box .opt{display:flex;align-items:flex-start;gap:8px;margin:6px 0;line-height:1.35}.hall-box .opt input{width:20px;height:20px;flex:none}

.net-fab{position:fixed;left:10px;bottom:10px;z-index:45;border-radius:999px!important;padding:8px 13px!important;background:#1b1b1f!important;color:#fff!important;border:1px solid #fff4!important;font-weight:800;box-shadow:0 6px 18px #0008;font-family:system-ui,sans-serif}
#netBtn .net-dot{display:inline-block;margin-right:5px;vertical-align:1px}
/*/NETCSS*/</style>

<script>/*NETJS*//* ===== Hall de la Salle de jeux : joueurs connectés, pseudos uniques, tables ouvertes, invitations (Supabase Realtime, sans base) ===== */
const HALL=(()=>{
 const SB_URL='https://evepcodcppxpufbkuflq.supabase.co', SB_KEY='sb_publishable_iUC6966SeFt_05Iac1wGQw_yDo9zl7y';
 const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
 const SITE='https://mushu1994.github.io/duel-des-ages/';
 const GAMES={"derniere-carte":"Dernière carte","quitte-ou-sept":"Quitte ou Sept","joyaux-renaissance":"Joyaux de la Renaissance","sept-merveilles":"Sept Merveilles","echecs":"Échecs","quatre-en-ligne":"Quatre en ligne","reversi":"Reversi","dames":"Dames","bataille-navale":"Bataille navale","code-secret":"Code Secret","bataille":"La Bataille","petits-chevaux":"Petits Chevaux","dominos":"Dominos","tetes-de-boeuf":"Têtes de Bœuf","plus-bas":"Plus Bas","petit-bac":"Petit Bac","poker":"Poker","president":"Président","tarot":"Tarot","rami":"Rami voleur","remparts":"Remparts","conquete":"Conquête","approche-finale":"Approche finale","duel-des-joyaux":"Duel des Joyaux","duel-des-ages":"Duel des Âges","grand-proprietaire":"Grand Propriétaire","nouvelle-terre":"Nouvelle Terre","rails-d-europe":"Rails d’Europe"};
 const q=s=>document.querySelector(s), es=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const ld=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, sv=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
 const note=s=>{ if(typeof toast==='function') return toast(s); const t=document.createElement('div'); t.className='hall-toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); };
 const H={note,ready:false,ok:null,pseudo:ld('net-name')||'',peers:{},me:{},listeners:[],page:'',title:''};
 let cid=ld('net-cid'); if(!cid){ cid=Math.random().toString(36).slice(2,10); sv('net-cid',cid); } H.cid=cid;
 const key=p=>String(p||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[^a-z0-9]/g,'');
 H.key=key;
 let client=null, ch=null, libP=null, syncedP=null, syncRes=null, at=ld('net-at')||Date.now();
 function lib(){ if(window.supabase) return Promise.resolve(); if(libP) return libP; libP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=LIB; s.onload=res; s.onerror=()=>{ libP=null; rej(new Error('lib')); }; document.head.appendChild(s); }); return libP; }
 H.client=async()=>{ await lib(); if(!client) client=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}}); return client; };
 /* ---------- connexion au hall ---------- */
 H.connect=async()=>{ if(ch) return syncedP; syncedP=new Promise(r=>syncRes=r);
   try{ await H.client(); }catch(e){ H.ok=false; paint(); return syncedP; }
   ch=client.channel('salle:hall',{config:{broadcast:{self:false},presence:{key:H.cid}}});
   ch.on('presence',{event:'sync'},onSync);
   ch.on('broadcast',{event:'inv'},({payload:p})=>{ if(p.to===H.cid) invited(p); });
   ch.on('broadcast',{event:'invr'},({payload:p})=>{ if(p.to===H.cid) note(p.ok?`${p.fromP} arrive à ta table`:`${p.fromP} ne peut pas jouer maintenant`); });
   const to=setTimeout(()=>{ if(H.ok==null){ H.ok=false; paint(); syncRes(); } },9000);
   ch.subscribe(async st=>{ if(st==='SUBSCRIBED'){ clearTimeout(to); H.ok=true; await track(); setTimeout(()=>syncRes(),900); paint(); } else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ if(H.ok==null){ H.ok=false; paint(); syncRes(); } } });
   return syncedP; };
 function payload(){ return Object.assign({p:H.pseudo,k:key(H.pseudo),at,g:H.page,gt:H.title},H.me); }
 async function track(){ if(!ch) return; try{ await ch.track(payload()); }catch(e){} }
 function onSync(){ const st=ch.presenceState(), peers={}; for(const k in st){ const m=st[k][st[k].length-1]; if(m) peers[k]=m; } H.peers=peers;
   // doublon de pseudo : le plus récent cède la place
   if(H.pseudo){ const mk=key(H.pseudo); for(const k in peers){ if(k===H.cid) continue; const o=peers[k]; if(o.p&&o.k===mk&&(o.at<at||(o.at===at&&k<H.cid))){ const old=H.pseudo; H.pseudo=''; sv('net-name',null); track(); note(`Le pseudo « ${old} » est déjà utilisé par quelqu’un d’autre`); setTimeout(()=>H.askPseudo(),300); break; } } }
   paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); }
 H.onChange=f=>H.listeners.push(f);
 H.set=o=>{ Object.assign(H.me,o); track(); };
 H.where=(page,title)=>{ H.page=page; H.title=title; track(); };
 H.list=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&m.p).map(([k,m])=>Object.assign({cid:k},m)).sort((a,b)=>a.p.localeCompare(b.p));
 H.count=()=>Object.keys(H.peers).length;
 H.tables=g=>Object.entries(H.peers).map(([k,m])=>m.p&&m.r&&m.r.host&&m.r.open&&!m.r.started&&m.r.n<m.r.max&&(!g||m.r.g===g)?Object.assign({cid:k,p:m.p},m.r):null).filter(Boolean);
 H.free=p=>{ const k=key(p); return !Object.entries(H.peers).some(([c,m])=>c!==H.cid&&m.p&&m.k===k); };
 H.anon=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&!m.p).length;
 /* ---------- pseudo ---------- */
 H.setPseudo=async p=>{ p=String(p||'').replace(/\s+/g,' ').trim(); if(p.length<2||p.length>16||key(p).length<2) return 'Entre 2 et 16 caractères (lettres ou chiffres).';
   if(/^(ordi|ordinateur|bot|ia|robot)\d*$/i.test(key(p))) return 'Ce pseudo est réservé.';
   await H.connect(); if(!H.ok) return 'Connexion impossible pour le moment.';
   if(!H.free(p)) return `« ${p} » est déjà utilisé par quelqu’un en ligne.`;
   H.pseudo=p; at=Date.now(); sv('net-at',at); sv('net-name',p); await track(); paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); return null; };
 H.ensure=()=>H.pseudo?Promise.resolve(H.pseudo):new Promise(res=>H.askPseudo(res));
 H.askPseudo=(cb)=>{ openBox(`<h2>Ton pseudo</h2><p>Il s’affiche pour les autres joueurs connectés. Deux personnes en ligne ne peuvent pas avoir le même.</p>
   <input class="hall-in" id="hallPseudo" maxlength="16" placeholder="Ex. : Mushu" value="${es(H.pseudo||ld('net-last')||'')}"><p class="hall-err" id="hallErr"></p>
   <div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button><button class="hall-btn pri" data-hl="ok">Valider</button></div>`,async e=>{ const b=e.target.closest('[data-hl]'); if(!b) return; if(b.dataset.hl==='close'){ closeBox(); return; }
     const v=q('#hallPseudo').value; b.disabled=true; const err=await H.setPseudo(v); b.disabled=false; if(err){ q('#hallErr').textContent=err; return; } sv('net-last',H.pseudo); closeBox(); if(cb) cb(H.pseudo); });
   const i=q('#hallPseudo'); if(i){ i.focus(); i.onkeydown=e=>{ if(e.key==='Enter') q('[data-hl=ok]').click(); }; } };
 /* ---------- invitations ---------- */
 H.invite=(to,room)=>{ if(!ch) return; ch.send({type:'broadcast',event:'inv',payload:{to,from:H.cid,fromP:H.pseudo,g:room.g,gt:room.gt,code:room.code}}); note(`Invitation envoyée à ${(H.peers[to]||{}).p||'ce joueur'}`); };
 function invited(p){ const id='inv-'+p.code; if(q('#'+id)) return; if(typeof sfx==='function') sfx('ding');
   const d=document.createElement('div'); d.className='hall-invite'; d.id=id;
   d.innerHTML=`<b>${es(p.fromP)}</b> t’invite à jouer à <b>${es(p.gt)}</b><div class="hall-acts"><button class="hall-btn" data-i="no">Pas maintenant</button><button class="hall-btn pri" data-i="ok">Rejoindre</button></div><i class="hall-bar"></i>`;
   document.body.appendChild(d); const t=setTimeout(()=>d.remove(),30000);
   d.onclick=e=>{ const b=e.target.closest('[data-i]'); if(!b) return; clearTimeout(t); d.remove(); const ok=b.dataset.i==='ok';
     if(ch) ch.send({type:'broadcast',event:'invr',payload:{to:p.from,fromP:H.pseudo,ok}}); if(ok) H.goTable(p.g,p.code); }; }
 H.goTable=(g,code)=>{ if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined'){ NET.joinCode(code); return; } location.href=g+'.html?salle='+code; };
 H.inviteFlow=to=>{ const P=H.peers[to]; if(!P) return; const r=H.me.r;
   if(r&&r.host&&!r.started){ H.invite(to,r); return; }
   const opts=Object.entries(GAMES).sort((a,b)=>a[1].localeCompare(b[1],'fr'));
   openBox(`<h2>Inviter ${es(P.p)}</h2><p>Choisis le jeu : une table s’ouvre et l’invitation part tout de suite.</p><div class="hall-games">${opts.map(([g,t])=>`<button class="hall-btn" data-g="${g}">${es(t)}</button>`).join('')}</div><div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button></div>`,e=>{
     const b=e.target.closest('[data-g],[data-hl]'); if(!b) return; if(b.dataset.hl){ closeBox(); return; } const g=b.dataset.g; sessionStorage.setItem('hall-invite',JSON.stringify({to,g})); closeBox();
     if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined') NET.createFor(); else location.href=g+'.html?creer=1'; }); };

  for(let k=0;k<n;k++){ let u=-1; for(let i=0;i<n;i++) if(!done[i]&&(u<0||d[i]<d[u])) u=i;
    if(u<0||d[u]===Infinity) break; done[u]=true; if(u===b) break;

  return {cost:d[b], edges};
}
function aiCost(pi,ri){
  if(G.own[ri]===pi) return 0;

}
function aiPlan(pi){
  const p=G.players[pi], U=netUF(pi), want=new Map(), planned=new Set();
  const open=p.tickets.filter(t=>!ticketDone(pi,t,U)).sort((x,y)=>y.v-x.v);
  let budget=p.wagons, blocked=[];
  for(const t of open){
    const res=sp(t.a,t.b,ri=>planned.has(ri)?0:aiCost(pi,ri));
    if(res.cost===Infinity){ blocked.push(t); continue; }
    const need=res.edges.filter(ri=>G.own[ri]!==pi&&!planned.has(ri)).reduce((s,ri)=>s+RT()[ri].len,0);
    if(need>budget+1) continue;
    budget-=need;
    for(const ri of res.edges) if(G.own[ri]!==pi){ planned.add(ri); want.set(ri,(want.get(ri)||0)+t.v+(t.long?6:0)); }

function demand(pi,want){
  const need={}; COLORS.forEach(c=>need[c]=0); let grey=0;
  for(const ri of want.keys()){ const r=RT()[ri]; if(r.c==='gris') grey=Math.max(grey,r.len); else need[r.c]=Math.max(need[r.c],r.len); }
  return {need, grey};
}
function aiPayment(pi,ri,want){
  const opts=payOptions(pi,ri); if(!opts.length) return null;
  const {need}=demand(pi,new Map([...want].filter(([k])=>k!==ri)));
  const h=G.players[pi].hand, r=RT()[ri];
  let best=null,bv=Infinity;
  for(const o of opts){ let v=o.nl*3 + (o.c!=='loco'?need[o.c]*.8:0);
    if(r.tun){ const spare=(o.c==='loco'?0:h[o.c]-o.nc)+(h.loco-o.nl); v-=spare*.5; }
    if(v<bv){bv=v;best=o;} }

}
async function aiTunnel(pi,ri,rev,extra,pay){ if(!IS_NODE&&!SIM) await showTunnel(pi,ri,rev,extra,pay,true); return !!pay; }
async function aiTurn(pi){
  const p=G.players[pi], lv=LV[p.level]||LV.normal;
  await sleep(G.cfg.speed||650);
  const {want,open,blocked}=aiPlan(pi);
  const finalRound=G.finalLeft>=0;
  // 1. prendre une route utile
  let best=null,bv=-Infinity;
  for(const [ri,w] of want){ if(!canTake(pi,ri)) continue; const opt=aiPayment(pi,ri,want); if(!opt) continue;
    const r=RT()[ri]; let v=w*.4 + PTS[r.len]*1.2 + (TWIN[G.map][ri]<0?2:0) - (r.tun?2:0) + rand()*lv.noise;
    if(v>bv){bv=v;best={ri,opt};} }
  if(best && (finalRound || rand()>=lv.hesit)){ await claim(pi,best.ri,best.opt,aiTunnel); return; }
  // 2. gare (Europe) pour débloquer un billet
  if(M().stations && p.stations>0 && blocked.length && G.turn>G.players.length*4){
    const t=blocked[0];
    const res=sp(t.a,t.b,ri=>{const c=aiCost(pi,ri); if(c<Infinity) return c; return G.own[ri]>=0&&G.own[ri]!==pi?RT()[ri].len+4:Infinity;});
    const opp=res.edges.find(ri=>G.own[ri]>=0&&G.own[ri]!==pi);
    if(opp!=null){ const r=RT()[opp]; const city=[r.a,r.b].find(c=>G.st[c]==null);
      const so=stationOptions(pi).sort((x,y)=>x.nl-y.nl)[0];
      if(city!=null && so && G.st[city]==null){ await buildStation(pi,city,so); return; } }
  }
  // 3. dernier tour ou plus d'objectif : marquer des points
  const anyWant=want.size>0;
  if(finalRound || !anyWant || p.wagons<=4){
    if(!finalRound && !anyWant && p.wagons>=lv.ticketWagons && G.tdeck.length && rand()<lv.ticketProb){ await drawTickets(pi,3,1); return; }
    let pick=null,pv=-1;
    RT().forEach((r,ri)=>{ if(!canTake(pi,ri)) return; const o=aiPayment(pi,ri,new Map()); if(!o) return; const v=PTS[r.len]-o.nl*.8+rand()*.3; if(v>pv){pv=v;pick={ri,opt:o};} });
    if(pick && (finalRound || p.wagons<=6 || RT()[pick.ri].len>=3 || handTotal(p)>=12)){ await claim(pi,pick.ri,pick.opt,aiTunnel); return; }
  }
  // 4. piocher
  if(canDrawAny()){ await aiDraw(pi,want,lv); return; }
  if(G.tdeck.length && !finalRound){ await drawTickets(pi,3,1); return; }

}
async function aiDraw(pi,want,lv){
  const p=G.players[pi], {need,grey}=demand(pi,want);
  const best=Math.max(...COLORS.map(c=>p.hand[c]));
  const def=c=>need[c]-p.hand[c] + (grey&&p.hand[c]===best&&best<grey?.5:0);
  for(let k=0;k<2;k++){
    let pick=-1, pv=0;
    G.face.forEach((c,i)=>{ if(!c||c==='loco') return; const v=def(c); if(v>pv){pv=v;pick=i;} });
    if(pick<0 && k===0 && G.face.includes('loco') && rand()<lv.locoTake){ await takeFace(pi,G.face.indexOf('loco')); return; }
    if(pick>=0) await takeFace(pi,pick);
    else if(G.deck.length+G.disc.length) await takeDeck(pi);
    else { const i=G.face.findIndex(c=>c&&c!=='loco'); if(i>=0) await takeFace(pi,i); else return; }
    if(k===0 && !(G.deck.length+G.disc.length) && !G.face.some(c=>c&&c!=='loco')) return;
  }
}
function aiKeep(pi,cand,min){
  const p=G.players[pi], lv=LV[p.level]||LV.normal, {want}=aiPlan(pi);
  let committed=[...want.keys()].reduce((s,ri)=>s+RT()[ri].len,0);
  const sc=cand.map(t=>{ const res=sp(t.a,t.b,ri=>want.has(ri)?0:aiCost(pi,ri)); return {t, cost:res.cost}; });
  sc.sort((x,y)=>(x.cost-x.t.v*.35)-(y.cost-y.t.v*.35));
  if(lv.keepGreed===0) shuffle(sc);
  const keep=[];
  for(const s of sc){ const cap=p.wagons-committed;
    if(keep.length<min || (lv.keepGreed>0 && s.cost<=cap*(lv.keepGreed>1?.7:.55) && s.cost<=s.t.v+2)) { keep.push(s.t); if(s.cost<Infinity) committed+=s.cost; } }
  return keep;
}

function scoreAll(){

function qpt(P0,C,P2,t){const u=1-t;return{x:u*u*P0.x+2*u*t*C.x+t*t*P2.x,y:u*u*P0.y+2*u*t*C.y+t*t*P2.y};}
function sample(P0,C,P2,n){const pts=[];for(let i=0;i<=n;i++)pts.push(qpt(P0,C,P2,i/n));const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));return{pts,cum,L:cum[cum.length-1]};}
function at(S,s){let i=1;while(i<S.cum.length-1&&S.cum[i]<s)i++;const a=S.pts[i-1],b=S.pts[i],f=(s-S.cum[i-1])/((S.cum[i]-S.cum[i-1])||1);return{x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,ang:Math.atan2(b.y-a.y,b.x-a.x)};}
function buildGeom(id){
  if(GEO[id]) return GEO[id];
  const m=DATA[id], C=m.cities, slotLen=Math.min(24,m.U*.78), minPitch=slotLen+3.5, geo=[], sideCache={};
  m.routes.forEach((r,ri)=>{
    const A=C[r.a],B=C[r.b],dx=B.x-A.x,dy=B.y-A.y,D=Math.hypot(dx,dy),ux=dx/D,uy=dy/D,nx=-uy,ny=ux;
    const off=r.dbl?(r.dbl===1?-5.6:5.6):0, mg=11;
    const P0={x:A.x+ux*mg+nx*off,y:A.y+uy*mg+ny*off}, P2={x:B.x-ux*mg+nx*off,y:B.y-uy*mg+ny*off};
    const M0={x:(P0.x+P2.x)/2,y:(P0.y+P2.y)/2};
    const key=r.a+'-'+r.b;
    let side=sideCache[key];
    if(side==null){ const test=s=>{const cx=(A.x+B.x)/2+nx*30*s,cy=(A.y+B.y)/2+ny*30*s;let mn=1e9;C.forEach((c,i)=>{if(i!==r.a&&i!==r.b)mn=Math.min(mn,Math.hypot(c.x-cx,c.y-cy));});return mn;};
      side=test(1)>=test(-1)?1:-1; sideCache[key]=side; }
    const need=r.len*minPitch; let h=0;
    if(D-2*mg<need){ for(h=3;h<500;h+=2){ const Cc={x:M0.x+nx*h*side*2,y:M0.y+ny*h*side*2}; if(sample(P0,Cc,P2,30).L>=need) break; } }
    const Cc={x:M0.x+nx*h*side*2,y:M0.y+ny*h*side*2};
    const S=sample(P0,Cc,P2,60), pitch=S.L/r.len, L=Math.min(slotLen*1.3,pitch-3.2);
    const slots=[]; for(let k=0;k<r.len;k++){ const p=at(S,(k+.5)*pitch); slots.push({x:+p.x.toFixed(1),y:+p.y.toFixed(1),a:+(p.ang*180/Math.PI).toFixed(1)}); }
    const mid=at(S,S.L/2);
    geo.push({d:`M${P0.x.toFixed(1)} ${P0.y.toFixed(1)}Q${Cc.x.toFixed(1)} ${Cc.y.toFixed(1)} ${P2.x.toFixed(1)} ${P2.y.toFixed(1)}`,slots,L,W:8.6,mid,S,nx:nx*side,ny:ny*side});
  });
  GEO[id]=geo; return geo;
}

function clampCam(){ const m=DATA[BUILT]; CAM.s=Math.max(1,Math.min(4.5,CAM.s)); CAM.x=Math.min(0,Math.max(m.w-m.w*CAM.s,CAM.x)); CAM.y=Math.min(0,Math.max(m.h-m.h*CAM.s,CAM.y)); }

    const s1=Math.exp(Math.log(f.s)+(Math.log(t.s)-Math.log(f.s))*k);
    const fc={x:(m.w/2-f.x)/f.s,y:(m.h/2-f.y)/f.s}, tc={x:cx,y:cy}; const c={x:fc.x+(tc.x-fc.x)*k,y:fc.y+(tc.y-fc.y)*k};

    start={x:e.clientX,y:e.clientY,cx:CAM.x,cy:CAM.y,target:e.target};
    if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:CAM.s}; } });
  svg.addEventListener('pointermove',e=>{

    if(pts.size===2&&pinch){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const mid=svgPt({clientX:(a.x+b.x)/2,clientY:(a.y+b.y)/2}); zoomAt(mid,(pinch.s*d/pinch.d)/CAM.s); moved=true; return; }

/* ---------- saisie humaine ---------- */
function input(pi,spec){ if(NETON()&&G.players[pi].ai) return Promise.resolve({type:'aiturn'});
  if(REM(pi)){ G.wait={pi,...spec}; return remote(pi,'input',spec).then(v=>{ if(G) G.wait=null; return v&&typeof v==='object'&&typeof v.type==='string'?v:{type:'noop'}; }); }
  G.wait={pi,...spec}; render(); return new Promise(res=>{inputResolve=v=>{inputResolve=null;G.wait=null;res(v);};}); }

async function humanTurn(pi){
  const p=G.players[pi]; TOAST_TO=REM(pi)?pi:null;
  if(humansCount()>1) await cover(pi);
  G.view=pi; let drawn=0; G.stationMode=false;
  while(true){
    const ev=await input(pi,{drawn});
    if(ev.type==='aiturn'){ TOAST_TO=null; if(!drawn) await aiTurn(pi); return; }
    if(ev.type==='face'||ev.type==='deck'){
      if(ev.type==='face'){ const c=G.face[ev.i]; if(!c) continue;
        if(c==='loco'&&drawn){ toast('Une locomotive visible ne peut pas être ta seconde carte.'); sfx('bad'); continue; }
        sfx('card'); await takeFace(pi,ev.i); if(c==='loco') return; }
      else { if(!(G.deck.length+G.disc.length)) continue; sfx('card'); await takeDeck(pi); }
      drawn++; if(drawn>=2) return;
      if(!(G.deck.length+G.disc.length)&&!G.face.some(c=>c&&c!=='loco')) return;
      continue;
    }
    if(drawn){ toast('Prends ta seconde carte : pioche ou carte visible.'); continue; }
    if(ev.type==='route'){
      const ri=ev.ri, r=RT()[ri];
      if(!routeFree(pi,ri)){ toast(G.own[ri]>=0?'Cette route est déjà prise.':(TWIN[G.map][ri]>=0&&G.own[TWIN[G.map][ri]]===pi?'Tu possèdes déjà la voie jumelle.':'À 2 ou 3 joueurs, une seule voie d\'une double route est utilisable.')); sfx('bad'); continue; }
      if(p.wagons<r.len){ toast('Il ne te reste pas assez de wagons.'); sfx('bad'); continue; }
      const opts=payOptions(pi,ri);
      if(!opts.length){ toast(`Il te faut ${r.len} cartes ${r.c==='gris'?"d'une même couleur":CNAME[r.c].toLowerCase()+'s'}${r.fer?` dont ${r.fer} locomotive${r.fer>1?'s':''}`:''}.`); sfx('bad'); continue; }
      const opt=await choosePay(`${CN(r.a)} – ${CN(r.b)}${r.tun?' (tunnel)':''}`,opts,ri); if(!opt) continue;
      await claim(pi,ri,opt,humanTunnel); return;
    }
    if(ev.type==='tickets'){ if(!G.tdeck.length){ toast('Il n\'y a plus de billets.'); continue; } await drawTickets(pi,3,1); return; }
    if(ev.type==='station'){ G.stationMode=!G.stationMode; render(); if(G.stationMode) toast(`Touche une ville libre pour y bâtir une gare (${stationCost(pi)} carte${stationCost(pi)>1?'s':''} de même couleur).`); continue; }
    if(ev.type==='city'){
      if(!M().stations||p.stations<=0) continue;
      if(G.st[ev.ci]!=null){ toast('Il y a déjà une gare dans cette ville.'); continue; }
      const so=stationOptions(pi); if(!so.length){ toast(`Une gare coûte ${stationCost(pi)} carte${stationCost(pi)>1?'s':''} de même couleur.`); sfx('bad'); continue; }
      const o=await choosePay(`Gare à ${CN(ev.ci)}`,so); if(!o) continue;
      G.stationMode=false; await buildStation(pi,ev.ci,o); return;
    }
  }
}

function runTrain(g,col,dur,pathS){
  if(G.fast||REDUCED) return Promise.resolve();
  const S=pathS||g.S, t=trainSprite(col); let lastPuff=0;
  return new Promise(res=>{ const t0=performance.now(); const step=now=>{ const k=Math.min(1,(now-t0)/dur); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; const p=at(S,S.L*e);
    t.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${p.ang*180/Math.PI+180})`);
    if(now-lastPuff>70){ lastPuff=now; puff(p.x-Math.cos(p.ang)*-8,p.y-Math.sin(p.ang)*-8-6); }
    if(k<1) requestAnimationFrame(step); else { t.animate([{opacity:1},{opacity:0}],{duration:300}); setTimeout(()=>{t.remove();res();},300); } }; requestAnimationFrame(step); });
}
function chainS(routeList,startCity){ // polyligne continue à travers plusieurs routes
  const m=M(); let pts=[], cur=startCity;
  for(const ri of routeList){ const r=m.routes[ri], S=GEO[G.map][ri].S; let seg=S.pts.slice(); if(r.a!==cur) seg.reverse(); pts=pts.concat(seg); cur=r.a===cur?r.b:r.a; }
  const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  return {pts,cum,L:cum[cum.length-1]||1};
}
async function tracePath(routeList,startCity,col,dur,width){
  if(!routeList.length) return; const S=chainS(routeList,startCity);
  const d='M'+S.pts.map(p=>p.x.toFixed(1)+' '+p.y.toFixed(1)).join('L');
  const glow=el('path',{d,class:'trace',stroke:col,'stroke-width':width||9,opacity:.55,'stroke-dasharray':S.L,'stroke-dashoffset':S.L},$('#fx'));
  const core=el('path',{d,class:'trace',stroke:'#fff','stroke-width':2.4,opacity:.9,'stroke-dasharray':S.L,'stroke-dashoffset':S.L},$('#fx'));
  if(G.fast||REDUCED){ glow.remove(); core.remove(); return; }
  const anim=[{strokeDashoffset:S.L},{strokeDashoffset:0}];
  glow.animate(anim,{duration:dur,fill:'forwards',easing:'ease-in-out'}); await core.animate(anim,{duration:dur,fill:'forwards',easing:'ease-in-out'}).finished.catch(()=>{});
  return {remove:()=>{ glow.animate([{opacity:.55},{opacity:0}],{duration:600}); core.animate([{opacity:.9},{opacity:0}],{duration:600}); setTimeout(()=>{glow.remove();core.remove();},620); }, S};
}
async function celebrateTickets(pi){

  if(REM(pi)){ const keys=[]; for(const t of p.tickets){ const k=t.a+'-'+t.b; if(p.seen.includes(k)||!ticketDone(pi,t,U)) continue; p.seen.push(k); keys.push(k); } if(keys.length) hostPush({t:'ui',f:'celeb',a:[pi,keys],to:pi}); return; }
  for(const t of p.tickets){ const k=t.a+'-'+t.b; if(p.seen.includes(k)||!ticketDone(pi,t,U)) continue; p.seen.push(k);
    const path=pathBetween(pi,t.a,t.b); sfx('ding'); toast(`Billet réalisé : ${CN(t.a)} → ${CN(t.b)} (${t.v})`,true);

}

  const m=DATA[BUILT]; CAM={x:0,y:0,s:1}; camTo(m.w*.5,m.h*.42,1.55,0); camTo(m.w/2,m.h/2,1,3600);

  return new Promise(res=>{ const done=()=>{ svg.classList.remove('intro'); camFit(400); caption(''); INTRO=null; res(); }; INTRO=done; setTimeout(()=>{ if(INTRO===done) done(); },4600); });

let capT=0;
function caption(t,sub,dur){ const c=$('#caption'); clearTimeout(capT); if(!t){ c.classList.remove('show'); return; } c.innerHTML=`${esc(t)}${sub?`<small>${esc(sub)}</small>`:''}`; c.classList.add('show'); if(dur) capT=setTimeout(()=>c.classList.remove('show'),dur); }
function clusters(m,k){ let cs=m.cities.slice(0,k).map((c,i)=>({x:m.cities[Math.floor(i*m.cities.length/k)].x,y:m.cities[Math.floor(i*m.cities.length/k)].y}));
  let as=[]; for(let it=0;it<12;it++){ as=m.cities.map(c=>{let b=0,bd=1e9;cs.forEach((q,j)=>{const d=Math.hypot(c.x-q.x,c.y-q.y);if(d<bd){bd=d;b=j;}});return b;});
    cs=cs.map((q,j)=>{const pts=m.cities.filter((_,i)=>as[i]===j);return pts.length?{x:pts.reduce((s,p)=>s+p.x,0)/pts.length,y:pts.reduce((s,p)=>s+p.y,0)/pts.length}:q;}); }
  return cs.map((q,j)=>({...q,ids:m.cities.map((_,i)=>i).filter(i=>as[i]===j)})).filter(c=>c.ids.length); }
let TOUR=0;
async function playTour(){
  if(!G||BUSY_ANIM) return; const my=++TOUR; const m=M(); BUSY_ANIM=true; sheet('');
  const skip=document.createElement('button'); skip.className='btn skip'; skip.textContent='Passer le survol'; $('#board').appendChild(skip);
  let stop=false; skip.onclick=()=>{stop=true;TOUR++;camAnim++;};
  try{
    sfx('whistle');
    const cl=clusters(m,Math.min(6,Math.max(4,Math.round(m.cities.length/8))));
    cl.sort((a,b)=>Math.atan2(a.y-m.h/2,a.x-m.w/2)-Math.atan2(b.y-m.h/2,b.x-m.w/2));
    for(const c of cl){ if(stop||my!==TOUR) break;
      const names=c.ids.slice().sort((a,b)=>ADJ[G.map][b].length-ADJ[G.map][a].length).slice(0,3).map(i=>m.cities[i].n);
      await camTo(c.x,c.y,2.5,1500); if(stop) break;
      c.ids.forEach(i=>{const e=$(`#map .city[data-ci="${i}"]`);if(e)e.classList.add('big');});
      caption(names.join(' · '),`${c.ids.length} gares dans la région`);
      sfx('chug'); await new Promise(r=>setTimeout(r,1200));
      c.ids.forEach(i=>{const e=$(`#map .city[data-ci="${i}"]`);if(e)e.classList.remove('big');});
    }
    caption('');
    if(!stop){ await camFit(1400);
      // train fantôme sur la plus grande traversée
      let best=null; const all=m.cities.length; for(let k=0;k<12;k++){ const a=Math.floor(Math.random()*all), b=Math.floor(Math.random()*all); if(a===b) continue; const r=sp(a,b,ri=>RT()[ri].len); if(!best||r.cost>best.cost) best={...r,a,b}; }
      if(best&&!stop){ const list=best.edges.slice().reverse(); caption(`${m.cities[best.a].n} → ${m.cities[best.b].n}`,'Le grand express traverse la carte',4200);
        const tr=await tracePath(list,best.a,'var(--accent)',3200,7); sfx('whistle'); const S=chainS(list,best.a); await runTrain(null,'#2b1e12',3000,S); if(tr) tr.remove(); }
    }
  } finally { skip.remove(); caption(''); BUSY_ANIM=false; if(stop) camFit(500); }
}

let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(AC.state==='suspended') AC.resume().catch(()=>{}); return AC; }
function tn(a,t,f,d,type,v,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);return o;}
let NOISE=null;
function noise(a,t,d,v,type,f,q){ if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate,a.sampleRate);const ch=NOISE.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}
  const s=a.createBufferSource();s.buffer=NOISE;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q||1;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02);}
function sfx(n){ if(IS_NODE||SIM||MUTED||(G&&G.fast)) return; const a=ac(); if(!a||a.state!=='running') return; const t=a.currentTime+.01;
  switch(n){
    case 'card': noise(a,t,.14,.25,'bandpass',2400,1.2); break;
    case 'chug': noise(a,t,.09,.35,'lowpass',380,1); tn(a,t,70,.08,'sine',.12); break;
    case 'whistle': { [880,1108].forEach(f=>{ const o=tn(a,t,f,.75,'triangle',.06); const l=a.createOscillator(),lg=a.createGain(); l.frequency.value=7; lg.gain.value=9; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t+.8); }); noise(a,t,.6,.05,'bandpass',3000,3); break; }
    case 'ticket': noise(a,t,.06,.2,'highpass',3500); noise(a,t+.08,.06,.15,'highpass',4200); break;
    case 'ding': tn(a,t,1320,.6,'sine',.12); tn(a,t+.08,1760,.5,'sine',.07); break;
    case 'bad': tn(a,t,300,.25,'triangle',.1,180); break;
    case 'tunnel': tn(a,t,55,.9,'sawtooth',.08,40); noise(a,t,.9,.12,'lowpass',200); break;
    case 'win': [523,659,784,1046].forEach((f,k)=>tn(a,t+k*.13,f,.4,'triangle',.11)); break;
  } }
function updSnd(){ $('#sndBtn').textContent=MUTED?'Son : non':'Son : oui'; }

/* ---------- événements ---------- */
document.addEventListener('click',e=>{
  if(!MUTED) ac();
  if(e.target.id==='modal'&&G&&G.players.length&&!G.over&&!G.setup){ const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; return; }
  const t=e.target.closest('[data-a]'); if(!t) return; const a=t.dataset.a, v=t.dataset.v;
  switch(a){
    case 'face': deliver({type:'face',i:+v}); break;
    case 'deck': deliver({type:'deck'}); break;
    case 'tickets': deliver({type:'tickets'}); break;
    case 'station': deliver({type:'station'}); break;
    case 'zin': { const m=DATA[BUILT]; const cx=(m.w/2-CAM.x)/CAM.s, cy=(m.h/2-CAM.y)/CAM.s; camTo(cx,cy,Math.min(4.5,CAM.s*1.5),300); } break;
    case 'zout': { const m=DATA[BUILT]; const cx=(m.w/2-CAM.x)/CAM.s, cy=(m.h/2-CAM.y)/CAM.s; camTo(cx,cy,Math.max(1,CAM.s/1.5),300); } break;
    case 'zfit': camFit(500); break;
    case 'tour': playTour(); break;
    case 'sound': MUTED=!MUTED; try{localStorage.setItem('rails-mute',MUTED?'1':'0');}catch(e){} updSnd(); break;
    case 'help': openHelp(); break;
    case 'helptab': openHelp(v); break;
    case 'menu': { if(NET.onNew&&NET.onNew()) break; const cv=$('#cover'); openMenu(); if(cv&&!cv.hidden){ cv.hidden=true; window.COVER_HIDDEN=cv; } break; }
    case 'close': { const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; break; }
    case 'resume': { const s=loadSave(); if(s) resumeGame(s); break; }
    case 'pickmap': MENU.map=v; drawMenu(loadSave()); break;
    case 'pn': MENU.n=+v; drawMenu(loadSave()); break;
    case 'ptype': { const [i,k]=v.split(':').map(Number); const s=MENU.slots[i]; if(k===0){s.h=1; if(AI_NAMES.includes(s.name)||/^Joueur \d$/.test(s.name)) s.name=defName(i,s);} else { if(s.h&&(/^(Toi|Joueur \d)$/.test(s.name)||HUMAN_NAMES.includes(s.name)||!s.name.trim())) s.name=AI_NAMES[i]; s.h=0; s.lv=['','facile','normal','difficile'][k]; } drawMenu(loadSave()); break; }
    case 'pspeed': MENU.speed=v; drawMenu(loadSave()); break;
    case 'start': startFromMenu(); break;
  }
});
document.addEventListener('mouseover',e=>{ const t=e.target.closest&&e.target.closest('#tickets .tk'); if(t) hlCities([+t.dataset.ca,+t.dataset.cb]); });
document.addEventListener('mouseout',e=>{ const t=e.target.closest&&e.target.closest('#tickets .tk'); if(t&&!t.contains(e.relatedTarget)) hlCities([]); });
const st=document.createElement('style'); st.textContent='@keyframes flipIn{from{transform:rotateY(90deg) scale(.6);opacity:0}}'; document.head.appendChild(st);

/* ---------- démarrage ---------- */
(function boot(){
  updSnd();
  const save=loadSave();
  // plateau d'accueil : la dernière carte jouée, en fond
  G={map:save?save.G.map:PREFS.map, players:[], own:[], st:{}, face:[], deck:[], disc:[], tdeck:[], log:[], cfg:{}, over:false, cur:0, finalLeft:-1};
  prepMap(G.map); buildBoard(G.map); G.own=RT().map(()=>-1);
  $('#players').innerHTML=''; $('#market').innerHTML=''; $('#handbar').innerHTML='<span class="lab">Bienvenue !</span><span class="empty">Choisis une carte pour commencer.</span>'; $('#tickets').innerHTML='<div class="none">—</div>';
  if(save) resumeGame(save); else playIntro().then(openMenu);
})();
