<script>/*NETJS*//* ===== Hall de la Salle de jeux : joueurs connectés, pseudos uniques, tables ouvertes, invitations (Supabase Realtime, sans base) ===== */
const HALL=(()=>{
 const SB_URL='https://evepcodcppxpufbkuflq.supabase.co', SB_KEY='sb_publishable_iUC6966SeFt_05Iac1wGQw_yDo9zl7y';
 const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
 const SITE='https://mushu1994.github.io/duel-des-ages/';
 const GAMES={"derniere-carte":"Dernière carte","quitte-ou-sept":"Quitte ou Sept","joyaux-renaissance":"Joyaux de la Renaissance","sept-merveilles":"Sept Merveilles","echecs":"Échecs","quatre-en-ligne":"Quatre en ligne","reversi":"Reversi","dames":"Dames","bataille-navale":"Bataille navale","code-secret":"Code Secret","bataille":"La Bataille","petits-chevaux":"Petits Chevaux","dominos":"Dominos"};
 const q=s=>document.querySelector(s), es=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const ld=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, sv=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
 const note=s=>{ if(typeof toast==='function') return toast(s); const t=document.createElement('div'); t.className='hall-toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); };
 const H={ready:false,ok:null,pseudo:ld('net-name')||'',peers:{},me:{},listeners:[],page:'',title:''};
 let cid=ld('net-cid'); if(!cid){ cid=Math.random().toString(36).slice(2,10); sv('net-cid',cid); } H.cid=cid;
 const key=p=>String(p||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[^a-z0-9]/g,'');
 H.key=key;
 let client=null, ch=null, libP=null, syncedP=null, syncRes=null, at=ld('net-at')||Date.now();
 function lib(){ if(window.supabase) return Promise.resolve(); if(libP) return libP; libP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=LIB; s.onload=res; s.onerror=()=>{ libP=null; rej(new Error('lib')); }; document.head.appendChild(s); }); return libP; }
 H.client=async()=>{ await lib(); if(!client) client=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}}); return client; };
 /* ---------- connexion au hall ---------- */
 H.connect=async()=>{ if(ch) return syncedP; syncedP=new Promise(r=>syncRes=r);
   try{ await H.client(); }catch(e){ H.ok=false; paint(); return syncedP; }
   ch=client.channel('salle:hall',{config:{broadcast:{self:false},presence:{key:H.cid}}});
   ch.on('presence',{event:'sync'},onSync);
   ch.on('broadcast',{event:'inv'},({payload:p})=>{ if(p.to===H.cid) invited(p); });
   ch.on('broadcast',{event:'invr'},({payload:p})=>{ if(p.to===H.cid) note(p.ok?`${p.fromP} arrive à ta table`:`${p.fromP} ne peut pas jouer maintenant`); });
   const to=setTimeout(()=>{ if(H.ok==null){ H.ok=false; paint(); syncRes(); } },9000);
   ch.subscribe(async st=>{ if(st==='SUBSCRIBED'){ clearTimeout(to); H.ok=true; await track(); setTimeout(()=>syncRes(),900); paint(); } else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ if(H.ok==null){ H.ok=false; paint(); syncRes(); } } });
   return syncedP; };
 function payload(){ return Object.assign({p:H.pseudo,k:key(H.pseudo),at,g:H.page,gt:H.title},H.me); }
 async function track(){ if(!ch) return; try{ await ch.track(payload()); }catch(e){} }
 function onSync(){ const st=ch.presenceState(), peers={}; for(const k in st){ const m=st[k][st[k].length-1]; if(m) peers[k]=m; } H.peers=peers;
   // doublon de pseudo : le plus récent cède la place
   if(H.pseudo){ const mk=key(H.pseudo); for(const k in peers){ if(k===H.cid) continue; const o=peers[k]; if(o.p&&o.k===mk&&(o.at<at||(o.at===at&&k<H.cid))){ const old=H.pseudo; H.pseudo=''; sv('net-name',null); track(); note(`Le pseudo « ${old} » est déjà utilisé par quelqu’un d’autre`); setTimeout(()=>H.askPseudo(),300); break; } } }
   paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); }
 H.onChange=f=>H.listeners.push(f);
 H.set=o=>{ Object.assign(H.me,o); track(); };
 H.where=(page,title)=>{ H.page=page; H.title=title; track(); };
 H.list=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&m.p).map(([k,m])=>Object.assign({cid:k},m)).sort((a,b)=>a.p.localeCompare(b.p));
 H.count=()=>Object.keys(H.peers).length;
 H.tables=g=>Object.entries(H.peers).map(([k,m])=>m.p&&m.r&&m.r.host&&m.r.open&&!m.r.started&&m.r.n<m.r.max&&(!g||m.r.g===g)?Object.assign({cid:k,p:m.p},m.r):null).filter(Boolean);
 H.free=p=>{ const k=key(p); return !Object.entries(H.peers).some(([c,m])=>c!==H.cid&&m.p&&m.k===k); };
 H.anon=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&!m.p).length;
 /* ---------- pseudo ---------- */
 H.setPseudo=async p=>{ p=String(p||'').replace(/\s+/g,' ').trim(); if(p.length<2||p.length>16||key(p).length<2) return 'Entre 2 et 16 caractères (lettres ou chiffres).';
   if(/^(ordi|ordinateur|bot|ia|robot)\d*$/i.test(key(p))) return 'Ce pseudo est réservé.';
   await H.connect(); if(!H.ok) return 'Connexion impossible pour le moment.';
   if(!H.free(p)) return `« ${p} » est déjà utilisé par quelqu’un en ligne.`;
   H.pseudo=p; at=Date.now(); sv('net-at',at); sv('net-name',p); await track(); paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); return null; };
 H.ensure=()=>H.pseudo?Promise.resolve(H.pseudo):new Promise(res=>H.askPseudo(res));
 H.askPseudo=(cb)=>{ openBox(`<h2>Ton pseudo</h2><p>Il s’affiche pour les autres joueurs connectés. Deux personnes en ligne ne peuvent pas avoir le même.</p>
   <input class="hall-in" id="hallPseudo" maxlength="16" placeholder="Ex. : Mushu" value="${es(H.pseudo||ld('net-last')||'')}"><p class="hall-err" id="hallErr"></p>
   <div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button><button class="hall-btn pri" data-hl="ok">Valider</button></div>`,async e=>{ const b=e.target.closest('[data-hl]'); if(!b) return; if(b.dataset.hl==='close'){ closeBox(); return; }
     const v=q('#hallPseudo').value; b.disabled=true; const err=await H.setPseudo(v); b.disabled=false; if(err){ q('#hallErr').textContent=err; return; } sv('net-last',H.pseudo); closeBox(); if(cb) cb(H.pseudo); });
   const i=q('#hallPseudo'); if(i){ i.focus(); i.onkeydown=e=>{ if(e.key==='Enter') q('[data-hl=ok]').click(); }; } };
 /* ---------- invitations ---------- */
 H.invite=(to,room)=>{ if(!ch) return; ch.send({type:'broadcast',event:'inv',payload:{to,from:H.cid,fromP:H.pseudo,g:room.g,gt:room.gt,code:room.code}}); note(`Invitation envoyée à ${(H.peers[to]||{}).p||'ce joueur'}`); };
 function invited(p){ const id='inv-'+p.code; if(q('#'+id)) return; if(typeof sfx==='function') sfx('ding');
   const d=document.createElement('div'); d.className='hall-invite'; d.id=id;
   d.innerHTML=`<b>${es(p.fromP)}</b> t’invite à jouer à <b>${es(p.gt)}</b><div class="hall-acts"><button class="hall-btn" data-i="no">Pas maintenant</button><button class="hall-btn pri" data-i="ok">Rejoindre</button></div><i class="hall-bar"></i>`;
   document.body.appendChild(d); const t=setTimeout(()=>d.remove(),30000);
   d.onclick=e=>{ const b=e.target.closest('[data-i]'); if(!b) return; clearTimeout(t); d.remove(); const ok=b.dataset.i==='ok';
     if(ch) ch.send({type:'broadcast',event:'invr',payload:{to:p.from,fromP:H.pseudo,ok}}); if(ok) H.goTable(p.g,p.code); }; }
 H.goTable=(g,code)=>{ if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined'){ NET.joinCode(code); return; } location.href=g+'.html?salle='+code; };
 H.inviteFlow=to=>{ const P=H.peers[to]; if(!P) return; const r=H.me.r;
   if(r&&r.host&&!r.started){ H.invite(to,r); return; }
   const opts=Object.entries(GAMES).sort((a,b)=>a[1].localeCompare(b[1],'fr'));
   openBox(`<h2>Inviter ${es(P.p)}</h2><p>Choisis le jeu : une table s’ouvre et l’invitation part tout de suite.</p><div class="hall-games">${opts.map(([g,t])=>`<button class="hall-btn" data-g="${g}">${es(t)}</button>`).join('')}</div><div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button></div>`,e=>{
     const b=e.target.closest('[data-g],[data-hl]'); if(!b) return; if(b.dataset.hl){ closeBox(); return; } const g=b.dataset.g; sessionStorage.setItem('hall-invite',JSON.stringify({to,g})); closeBox();
     if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined') NET.createFor(); else location.href=g+'.html?creer=1'; }); };
 H.pendingInvite=g=>{ try{ const v=JSON.parse(sessionStorage.getItem('hall-invite')||'null'); if(v&&v.g===g){ sessionStorage.removeItem('hall-invite'); return v.to; } }catch(e){} return null; };
 /* ---------- interface ---------- */
 function where(m){ if(m.r&&m.r.started) return `joue à ${es(m.r.gt)}`; if(m.r&&m.r.host) return `ouvre une table de ${es(m.r.gt)}`; if(m.r) return `attend à une table de ${es(m.r.gt)}`; return m.gt?`regarde ${es(m.gt)}`:'sur le portail'; }
 function busy(m){ return m.r&&m.r.started; }
 H.panelHTML=(g)=>{ if(H.ok===false) return `<p class="hall-note">Le salon en ligne n’est pas joignable d’ici.${/github\.io$/.test(location.hostname)?' Vérifie ta connexion.':` Ouvre la salle sur <a href="${SITE}" target="_blank" rel="noopener">le site</a>.`}</p>`;
   if(H.ok==null) return '<p class="hall-note"><span class="hall-spin"></span>Connexion au salon…</p>';
   const tabs=H.tables(g), ppl=H.list();
   return `<div class="hall-me">${H.pseudo?`Ton pseudo : <b>${es(H.pseudo)}</b> <button class="hall-link" data-hl="pseudo">changer</button>`:`<button class="hall-btn pri" data-hl="pseudo">Choisir un pseudo</button> <span class="hall-note">pour apparaître et être invité</span>`}</div>
    <h4>Tables ouvertes${g?'':' (tous les jeux)'}</h4>${tabs.length?`<ul class="hall-list">${tabs.map(t=>`<li><span class="hall-av">${es(t.p[0])}</span><span class="hall-tx"><b>${es(t.gt)}</b><small>table de ${es(t.p)} · ${t.n}/${t.max} joueurs</small></span>${t.cid===H.cid?'<small>ta table</small>':`<button class="hall-btn pri" data-join="${es(t.g)}:${es(t.code)}">Rejoindre</button>`}</li>`).join('')}</ul>`:`<p class="hall-note">Aucune table ouverte${g?' pour ce jeu':''} pour l’instant.</p>`}
    <h4>Joueurs en ligne (${ppl.length})</h4>${H.anon()?`<p class="hall-note">+ ${H.anon()} visiteur${H.anon()>1?'s':''} sans pseudo</p>`:''}${ppl.length?`<ul class="hall-list">${ppl.map(m=>`<li><span class="hall-av">${es(m.p[0])}</span><span class="hall-tx"><b>${es(m.p)}</b><small>${where(m)}</small></span>${H.pseudo&&!busy(m)?`<button class="hall-btn" data-inv="${m.cid}">Inviter</button>`:''}</li>`).join('')}</ul>`:'<p class="hall-note">Personne d’autre pour le moment. Partage le lien du site à tes amis !</p>'}`; };
 H.panelClick=e=>{ const b=e.target.closest('[data-hl],[data-join],[data-inv]'); if(!b) return false;
   if(b.dataset.hl==='pseudo'){ H.askPseudo(); return true; }
   if(b.dataset.join){ const [g,c]=b.dataset.join.split(':'); closeBox(); H.ensure().then(()=>H.goTable(g,c)); return true; }
   if(b.dataset.inv){ H.inviteFlow(b.dataset.inv); return true; } return false; };
 let boxCb=null;
 function openBox(h,cb){ let m=q('#hall-modal'); if(!m){ m=document.createElement('div'); m.id='hall-modal'; m.innerHTML='<div class="hall-box" id="hall-box"></div>'; document.body.appendChild(m); m.addEventListener('click',e=>{ if(e.target===m){ closeBox(); return; } if(boxCb) boxCb(e); }); }
   q('#hall-box').innerHTML=h; boxCb=cb; m.hidden=false; }
 function closeBox(){ const m=q('#hall-modal'); if(m) m.hidden=true; boxCb=null; if(H.onBoxClose){ const f=H.onBoxClose; H.onBoxClose=null; f(); } }
 H.openBox=openBox; H.closeBox=closeBox;
 H.openPanel=g=>{ const draw=()=>openBox(`<h2>Le salon</h2>${H.panelHTML(g)}<div class="hall-acts"><button class="hall-btn" data-hl="close">Fermer</button></div>`,e=>{ const b=e.target.closest('[data-hl=close]'); if(b){ closeBox(); return; } H.panelClick(e); });
   draw(); H.redraw=()=>{ const m=q('#hall-modal'); if(m&&!m.hidden&&q('#hall-box h2')&&q('#hall-box h2').textContent==='Le salon') draw(); }; };
 function paint(){ const bar=q('#hall-bar'); if(bar){ const n=H.count();
     bar.innerHTML=H.ok===false?'':`<button class="hall-pill" data-hl="open"><i class="hall-dot ${H.ok?'':'off'}"></i><b>${H.ok?n:'…'}</b> en ligne${H.pseudo?` · <span>${es(H.pseudo)}</span>`:''}</button>${H.ok?`<span class="hall-sub">${H.tables().length?`${H.tables().length} table${H.tables().length>1?'s':''} ouverte${H.tables().length>1?'s':''} · `:''}<button class="hall-link" data-hl="open">Voir qui joue</button>${H.pseudo?'':' · <button class="hall-link" data-hl="pseudo">choisir un pseudo</button>'}</span>`:''}`;
     bar.onclick=e=>{ const b=e.target.closest('[data-hl]'); if(!b) return; if(b.dataset.hl==='open') H.openPanel(''); else H.askPseudo(); }; }
   if(H.redraw) H.redraw(); if(typeof NET!=='undefined'&&NET.hallChanged) NET.hallChanged(); }
 H.paint=paint;
 return H; })();
addEventListener('load',()=>setTimeout(()=>{ if(!window.NETGAME) HALL.where('',''); HALL.connect(); },0));

/* ===== Salle en ligne : tables (Supabase Realtime, l'hôte fait tourner la partie), sur le hall commun =====
   Le jeu déclare window.NETGAME = { id, title, min, max, rules():html, rulesClick(e):bool,
     start(list), state():G, receive(msg):Promise, act(seat,fn,args):bool, busy():bool, resume(), leave() } */
const NET=(()=>{
 const SITE='https://mushu1994.github.io/duel-des-ages/';
 const LET='ABCDEFGHJKLMNPQRSTUVWXYZ';
 const BOTS=['Ada','Hal','Pixel','Nova','Atlas','Écho','Zéphyr','Orbit','Volt','Lumen','Quartz','Sirius'];
 const N={on:false,host:false,guest:false,started:false,code:null,name:'',seat:null,peers:{},v:0,hs:null,lastV:-1,lastHs:null,q:[],aq:[],ai:{n:0,level:'normal'},ui:null,known:new Set(),waitHost:false,open:(()=>{ try{ return localStorage.getItem('net-open')!=='false'; }catch(e){ return true; } })(),invited:new Set()};
 N.cid=HALL.cid;
 let client=null, ch=null;
 const NG=()=>window.NETGAME;
 function newCode(){ let c=''; for(let i=0;i<4;i++) c+=LET[Math.floor(Math.random()*LET.length)]; return c; }
 const link=()=>{ const base=/github\.io$/.test(location.hostname)?location.origin+location.pathname:SITE+NG().id+'.html'; return base+'?salle='+N.code; };
 const sess=()=>load('net-sess'), setSess=v=>store('net-sess',v);
 const isGh=()=>/github\.io$/.test(location.hostname);
 /* ---------- connexion à une table ---------- */
 async function connect(code,asHost){ client=await HALL.client();
   if(ch){ try{ await client.removeChannel(ch); }catch(e){} ch=null; }
   N.code=code; N.host=asHost; N.guest=!asHost; N.on=true; N.peers={}; N.known=new Set(); N.hs=Math.random().toString(36).slice(2,8); N.name=HALL.pseudo;
   ch=client.channel('salle:'+NG().id+':'+code,{config:{broadcast:{self:false},presence:{key:N.cid}}});
   ch.on('broadcast',{event:'st'},({payload})=>{ if(N.guest) enqueue(payload); });
   ch.on('broadcast',{event:'act'},({payload})=>{ if(N.host){ N.aq.push(payload); drain(); } });
   ch.on('broadcast',{event:'hello'},()=>{ if(N.host){ if(N.started) pushFull(); else pushLobby(); } });
   ch.on('broadcast',{event:'lobby'},({payload})=>{ if(N.guest&&!N.started){ N.lobby=payload; if(N.ui==='lobby') lobbyUI(); } });
   ch.on('broadcast',{event:'close'},()=>{ if(N.guest){ toast('L’hôte a fermé la table'); leave(true); } });
   ch.on('presence',{event:'sync'},onSync);
   return new Promise((res,rej)=>{ let done=false; const to=setTimeout(()=>{ if(!done){ done=true; rej(new Error('timeout')); } },9000);
     ch.subscribe(async st=>{ if(st==='SUBSCRIBED'){ await ch.track({name:N.name,host:asHost,at:Date.now()}); if(!done){ done=true; clearTimeout(to); res(); } if(N.guest) send('hello',{}); }
       else if((st==='CHANNEL_ERROR'||st==='TIMED_OUT')&&!done){ done=true; clearTimeout(to); rej(new Error(st)); } }); }); }
 function send(ev,payload){ if(ch) ch.send({type:'broadcast',event:ev,payload}).catch(()=>{}); }
 function onSync(){ const st=ch.presenceState(); const peers={}; for(const k in st){ const m=st[k][st[k].length-1]; peers[k]=m; } const before=N.peers; N.peers=peers;
   const names=k=>(peers[k]||before[k]||{}).name||'Un joueur';
   for(const k in peers) if(!before[k]&&k!==N.cid){ if(N.known.has(k)) toast(`${names(k)} est de retour`); else if(N.host&&!N.started){ toast(`${names(k)} rejoint la table`); sfx('pop'); } }
   for(const k in before) if(!peers[k]&&k!==N.cid) toast(`${names(k)} a quitté la table`);
   Object.keys(peers).forEach(k=>N.known.add(k));
   if(N.guest){ const hostHere=Object.values(peers).some(m=>m.host); N.waitHost=!hostHere&&N.started; }
   if(N.host){ if(N.started){ const G=NG().state(); let ch2=false; if(G) G.players.forEach(P=>{ if(P.cid&&P.away&&peers[P.cid]){ P.ai=false; P.away=false; ch2=true; } }); if(ch2) NG().resume(); pushFull(); } else pushLobby(); }
   hallRoom(); badge(); if(N.ui==='lobby') lobbyUI(); else if(N.ui==='panel') panelUI(); }
 function hallRoom(){ if(!N.on){ HALL.set({r:null}); return; } const n=N.host&&!N.started?lobbyOrder().length+N.ai.n:Object.keys(N.peers).length;
   HALL.set({r:{g:NG().id,gt:NG().title,code:N.code,host:N.host,open:N.host?N.open:false,started:N.started,n,max:NG().max}}); }
 /* ---------- hôte ---------- */
 function pushLobby(){ if(!N.host||N.started) return; send('lobby',{order:lobbyOrder().map(k=>({cid:k,name:N.peers[k].name})),ai:N.ai}); }
 function lobbyOrder(){ return Object.keys(N.peers).sort((a,b)=>(N.peers[b].host-N.peers[a].host)||(N.peers[a].at-N.peers[b].at)); }
 function push(ev,kind){ if(!N.host||!N.started) return; N.v++; const G=NG().state(); if(!G) return; const p={hs:N.hs,v:N.v,G,ev:ev||null,kind:kind||null}; N.last=p; send('st',p); }
 function pushFull(){ if(!N.host||!N.started) return; push(null,'full'); }
 function drain(){ if(!N.host||!N.started) return; while(N.aq.length&&!NG().busy()){ const m=N.aq.shift(); const G=NG().state(); const seat=G?G.players.findIndex(P=>P.cid===m.cid):-1; if(seat<0||G.players[seat].ai) continue; NG().act(seat,m.fn,m.args||[]); } }
 /* ---------- invité ---------- */
 function enqueue(p){ if(p.hs!==N.lastHs){ N.lastHs=p.hs; N.lastV=-1; } if(p.v<=N.lastV) return; N.lastV=p.v; N.q.push(p); pump(); }
 async function pump(){ if(N.pumping) return; N.pumping=true;
   while(N.q.length){ let p=N.q.shift(); if(p.kind==='full'||!p.ev){ while(N.q.length&&(N.q[0].kind==='full'||!N.q[0].ev)&&N.q[0].kind!=='lobby'&&N.q[0].kind!=='new') p=N.q.shift(); }
     if(p.kind==='lobby'||!p.G){ N.started=false; N.seat=null; try{ NG().receive({kind:'lobby'}); }catch(e){} hallRoom(); lobbyUI(); continue; }
     const first=!N.started; N.started=true; N.waitHost=false; const s=p.G.players.findIndex(P=>P.cid===N.cid); N.seat=s>=0?s:null;
     if(first){ closeModal(); HALL.closeBox(); window.MODAL_CLOSABLE=true; N.ui=null; hallRoom(); if(N.seat==null) toast('Partie déjà commencée : tu regardes'); }
     try{ await NG().receive(Object.assign({},p,{kind:first&&p.kind!=='new'?'new':p.kind})); }catch(e){ console.error(e); } badge(); }
   N.pumping=false; }
 function act(fn,args){ if(!N.guest) return false; if(N.waitHost){ toast('En attente de l’hôte…'); return true; } send('act',{cid:N.cid,fn,args}); sfx('click'); return true; }
 /* ---------- interface ---------- */
 function badge(){ const b=$('#netBtn'); if(!b) return; if(!N.on){ const n=HALL.ok?HALL.count():0; b.innerHTML=`<i class="net-dot ${HALL.ok?'':'off'}"></i>En ligne${n?` · ${n}`:''}`; b.classList.remove('net-on'); return; }
   const n=Object.keys(N.peers).length; b.innerHTML=`<i class="net-dot ${N.waitHost?'off':''}"></i>Table ${N.code} · ${n}`; b.classList.add('net-on'); }
 N.hallChanged=()=>{ badge(); if(N.ui==='start') startUI(); else if(N.ui==='lobby'&&N.host) lobbyUI(); };
 function startUI(prefill){ N.ui='start'; window.MODAL_CLOSABLE=true; const g=NG(); const tabs=HALL.ok?HALL.tables(g.id):[];
   const off=HALL.ok===false;
   paintModal(`<h2>Jouer en ligne</h2>
    ${off?`<p class="net-note">Le salon en ligne n’est pas joignable d’ici. ${isGh()?'Vérifie ta connexion internet.':`Ouvre le jeu sur le site : <a href="${SITE}${g.id}.html" target="_blank" rel="noopener">${SITE.replace('https://','')}${g.id}.html</a>`}</p>`:''}
    <div class="net-me">${HALL.pseudo?`Ton pseudo : <b>${esc(HALL.pseudo)}</b> <button class="net-link" data-net="pseudo">changer</button>`:`<button class="btn pri" data-net="pseudo">Choisir un pseudo</button> <span class="net-note">obligatoire pour jouer en ligne</span>`}</div>
    <h4>Tables ouvertes</h4>${HALL.ok==null?'<p class="net-wait"><span class="net-spin"></span>Connexion…</p>':tabs.length?`<ul class="net-list">${tabs.map(t=>`<li><span class="net-av">${esc(t.p[0])}</span>Table de ${esc(t.p)} <small>· ${t.n}/${t.max} joueurs</small>${t.cid===N.cid?'':`<button class="btn pri net-r" data-net="jt:${t.code}">Rejoindre</button>`}</li>`).join('')}</ul>`:'<p class="net-note">Aucune table ouverte pour ce jeu. Crée la tienne : elle apparaîtra pour tous les joueurs connectés.</p>'}
    <div class="net-two"><div class="net-box"><h4>Créer une table</h4><label class="net-chk"><input type="checkbox" id="netOpen" ${N.open?'checked':''}> Ouverte à tous les connectés</label><button class="btn pri" data-net="create">Créer une table</button></div>
    <div class="net-box"><h4>Rejoindre avec un code</h4><input type="text" class="net-in net-code" id="netCode" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="CODE" value="${esc(prefill||'')}"><button class="btn" data-net="join">Rejoindre</button></div></div>
    <p class="net-note">${HALL.ok?`${HALL.count()} personne${HALL.count()>1?"s":""} sur le site · <button class="net-link" data-net="hall">voir qui est là et inviter</button>`:''}</p>
    <div class="acts"><button class="btn" data-c="close">Fermer</button></div>`);
   $('#mbox').onclick=onClick; const c=$('#netCode'); if(c) c.oninput=()=>{ c.value=c.value.toUpperCase().replace(/[^A-Z]/g,''); }; const o=$('#netOpen'); if(o) o.onchange=()=>{ N.open=o.checked; store('net-open',N.open); }; }
 function busyUI(msg){ paintModal(`<h2>Jouer en ligne</h2><p class="net-wait"><span class="net-spin"></span>${msg}</p>`); }
 async function create(){ await HALL.ensure(); if(!HALL.pseudo) return; busyUI('Ouverture de la table…');
   try{ for(let t=0;t<4;t++){ const code=newCode(); await connect(code,true); await wait(700); const other=Object.entries(N.peers).some(([k,m])=>k!==N.cid&&m.host); if(!other) break; } }
   catch(e){ failUI(); return; }
   N.started=false; N.invited=new Set(); setSess({game:NG().id,code:N.code,host:true}); hallRoom(); lobbyUI(); badge();
   const to=HALL.pendingInvite(NG().id); if(to){ HALL.invite(to,{g:NG().id,gt:NG().title,code:N.code}); N.invited.add(to); lobbyUI(); } }
 async function join(code){ code=(code||'').toUpperCase(); if(!/^[A-Z]{4}$/.test(code)){ toast('Le code fait 4 lettres'); return; } await HALL.ensure(); if(!HALL.pseudo) return;
   if(N.on&&N.code===code) { lobbyUI(); return; } if(N.on) await leave(true);
   busyUI('Connexion à la table '+code+'…');
   try{ await connect(code,false); }catch(e){ failUI(); return; }

  for(let r=tries-1;r>=0;r--){ const row=S.rows[r], cur=!S.setting&&!S.over&&r===S.rows.length&&S.cfg.mode!=='ia'&&(!NN||isGuesser());
    const pegs=row?row.g:(cur?S.cur:[]);
    h+=`<div class="row ${cur?'cur':''}" style="--hs:${hs}"><span class="num">${r+1}</span><div class="holes">${Array.from({length:p},(_,i)=>`<div class="hole" data-h="${cur?i:''}">${pegs[i]!=null?`<div class="peg ${row&&row.fresh||cur&&i===S.cur.length-1?'drop':''}" style="--c:${PALETTE[pegs[i]]};animation-delay:${row&&row.fresh?i*.07:0}s"></div>`:''}</div>`).join('')}</div>
      <div class="fb" style="--fc:${Math.ceil(p/2)}">${Array.from({length:p},(_,i)=>{ const f=row&&row.f; const cl=f?(i<f[0]?'k':i<f[0]+f[1]?'w':''):''; return `<i class="${cl} ${row&&row.fresh&&cl?'pop':''}" style="animation-delay:${.35+i*.12}s"></i>`; }).join('')}</div></div>`; }
  $('#boardc').innerHTML=h; S.rows.forEach(r=>r.fresh=false);
  // setting row
  const setting=S.setting; const canPlay=!NN||(setting?isSetter():isGuesser());
  $('#pal').innerHTML=`<h3>${NN&&!canPlay?(setting?esc(S.players[S.setter].name)+' compose le code':esc(S.players[1-S.setter].name)+' cherche ton code'):setting?'Compose ton code':S.cfg.mode==='ia'?'L\'ordinateur cherche':'Ta proposition'}</h3>
   ${setting&&canPlay?`<div class="holes" style="--hs:42px">${Array.from({length:p},(_,i)=>`<div class="hole" data-sh="${i}" style="cursor:pointer">${S.cur[i]!=null?`<div class="peg" style="--c:${PALETTE[S.cur[i]]}"></div>`:''}</div>`).join('')}</div>`:''}
   ${(setting||S.cfg.mode!=='ia')&&!S.over&&canPlay?`<div class="colors">${Array.from({length:c},(_,i)=>`<button data-col="${i}" style="--c:${PALETTE[i]}" title="${PNAMES[i]}"></button>`).join('')}</div>
   <div class="prow"><button class="btn" data-a="back">⌫ Effacer</button><button class="btn pri" data-a="ok" ${S.cur.length===p?'':'disabled'}>${setting?'Valider le code':'Valider'}</button></div>`:''}
   ${S.cfg.mode==='ia'&&!setting?`<div class="think">${esc(S.thinking||'')}</div>`:''}
   <div class="legend"><i style="background:#c41f1f"></i>bonne couleur bien placée<br><i style="background:#eee"></i>bonne couleur mal placée<br>${p} pions · ${c} couleurs · ${S.cfg.dup?'doublons permis':'sans doublon'}</div>`;
  const st=$('#status'); st.style.setProperty('--pc',S.over?(S.won?'#2f8a4a':'#8a2a1a'):'#6a3fa0');
  st.innerHTML=S.over?`<span class="who">${esc(S.over)}</span>`:`<span class="who">${setting?'Code secret':'Essai '+(S.rows.length+1)+' / '+tries}</span><span class="msg">${NN?(setting?esc(S.players[S.setter].name)+' compose le code en secret.':esc(S.players[1-S.setter].name)+' cherche le code de '+esc(S.players[S.setter].name)+'.'):setting?(S.cfg.mode==='ia'?'Choisis un code : l\'ordinateur va le deviner.':esc(S.cfg.names[0])+' compose le code en cachette.'):S.cfg.mode==='ia'?'L\'ordinateur réfléchit…':S.cfg.mode==='2p'?esc(S.cfg.names[1])+' cherche le code.':'Trouve la combinaison !'}</span>`;
}
function addColor(i){ if(!S||S.over) return; if(NETON()&&!(S.setting?isSetter():isGuesser())) return; const {p,dup}=S.cfg; if(S.cur.length>=p) return; if(!dup&&S.cur.includes(i)){ toast('Pas de doublon dans cette partie.'); sfx('error'); return; } S.cur.push(i); sfx('pop'); render(); }
async function submit(){
  const {p,tries}=S.cfg; if(S.cur.length!==p) return;
  if(NETON()){ if(S.setting&&!isSetter()||!S.setting&&!isGuesser()) return; if(NET.guest){ NET.act(S.setting?'code':'guess',[NET.seat,S.cur.slice()]); if(S.setting){ S.secret=S.cur.slice(); S.setting=false; S.cur=[]; render(); } else { S.cur=[]; render(); } return; } if(S.setting){ setCode(S.cur.slice()); return; } return doGuess(S.cur.slice()); }
  if(S.setting){ S.secret=S.cur.slice(); S.cur=[]; sfx('ding');
    if(S.cfg.mode==='2p'){ startGuess(); coverMsg(`À ${S.cfg.names[1]} de jouer`,'Trouve le code secret !'); store('cs-save',S); return; }
    S.setting=false; render(); aiLoop(); return; }
  return doGuess(S.cur.slice()); }
function setCode(code){ S.secret=code; S.setting=false; S.cur=[]; sfx('ding'); sv(); render(); if(S.players[1-S.setter].ai) aiLoop(); }
async function doGuess(g){ const {p,tries}=S.cfg; if(NETON()&&NET.host) NET.push([{t:'guess',g}]);
  const f=score(S.secret,g); S.rows.push({g,f,fresh:true}); S.cur=[]; sfx('click'); render();
  await wait(400+p*120); f[0]===p?sfx('win'):(f[0]+f[1]?sfx('ding'):sfx('flip'));
  if(f[0]===p){ S.over=NETON()?`${S.players[1-S.setter].name} trouve le code en ${S.rows.length} essai${S.rows.length>1?'s':''} !`:`Code trouvé en ${S.rows.length} essai${S.rows.length>1?'s':''} !`; S.won=true; render(); banner(NETON()&&isSetter()?'Démasqué !':'Bravo !',S.over,'#2f8a4a'); if(!NETON()||isGuesser()) confetti(); sv(null); return; }
  if(S.rows.length>=tries){ S.over=NETON()?`Le code de ${S.players[S.setter].name} a résisté !`:'Perdu ! Voici le code secret.'; S.won=false; render(); banner(NETON()&&isSetter()?'Bien caché !':'Raté…','Le code est révélé',NETON()&&isSetter()?'#2f8a4a':'#8a2a1a'); sfx(NETON()&&isSetter()?'win':'lose'); sv(null); return; }
  sv(); if(NETON()) NET.drain();
}
async function aiLoop(){ const my=GEN; const {p,c,dup,tries}=S.cfg; S.all=allCodes(p,c,dup); let cands=S.all.slice();
  while(!S.over){ S.thinking=`${cands.length} combinaison${cands.length>1?'s':''} encore possible${cands.length>1?'s':''}…`; render(); await wait(700); if(my!==GEN) return;
    const g=S.rows.length===0&&p===4&&c===6&&dup?[0,0,1,1]:solverNext(cands,S.all,p);
    const f=score(S.secret,g); S.rows.push({g,f,fresh:true}); sfx('click'); render(); if(NETON()) NET.push(); await wait(500+p*120); if(my!==GEN) return; f[0]===p?sfx('lose'):sfx('ding');
    cands=cands.filter(x=>{ const s=score(x,g); return s[0]===f[0]&&s[1]===f[1]; });
    if(f[0]===p){ S.over=`L'ordinateur a trouvé ton code en ${S.rows.length} essai${S.rows.length>1?'s':''}.`; S.won=false; S.thinking=''; render(); banner('Démasqué !',`${S.rows.length} essais`,'#6a3fa0'); return; }
    if(S.rows.length>=tries){ S.over='Ton code a résisté à l\'ordinateur !'; S.won=true; render(); banner('Bien joué !','Code introuvable','#2f8a4a'); confetti(); return; } } }
document.addEventListener('click',e=>{ const col=e.target.closest('[data-col]'); if(col){ addColor(+col.dataset.col); return; }
  const h=e.target.closest('[data-h],[data-sh]'); if(h&&(h.dataset.h!==''&&h.dataset.h!=null||h.dataset.sh!=null)){ const i=+(h.dataset.h??h.dataset.sh); if(i<S.cur.length){ S.cur.splice(i,1); sfx('click'); render(); } return; }
  const a=e.target.closest('[data-a]'); if(!a) return; if(a.dataset.a==='back'){ S.cur.pop(); render(); } if(a.dataset.a==='ok') submit(); });
document.addEventListener('keydown',e=>{ if(!S||S.over||!$('#modal').hidden) return; if(/^[1-8]$/.test(e.key)&&+e.key<=S.cfg.c) addColor(+e.key-1); if(e.key==='Backspace'){ S.cur.pop(); render(); } if(e.key==='Enter') submit(); });
let M={mode:'solo',p:4,c:6,dup:true,tries:10,names:['Camille','Lucas']};
function menu(){ const draw=()=>paintModal(`<h2>Nouvelle partie</h2>
  <h4>Mode</h4><div class="seg"><button class="${M.mode==='solo'?'on':''}" data-m="mode:solo">Je devine le code de l'ordinateur</button><button class="${M.mode==='ia'?'on':''}" data-m="mode:ia">L'ordinateur devine mon code</button><button class="${M.mode==='2p'?'on':''}" data-m="mode:2p">À deux</button></div>
  ${M.mode==='2p'?`<div class="prow"><input type="text" id="n0" value="${esc(M.names[0])}" placeholder="Camille" maxlength="14"> compose, <input type="text" id="n1" value="${esc(M.names[1])}" placeholder="Lucas" maxlength="14"> devine</div>`:''}
  <h4>Difficulté</h4><div class="seg"><button class="${M.p===4&&M.c===6?'on':''}" data-m="pc:4:6">Classique · 4 pions, 6 couleurs</button><button class="${M.p===5&&M.c===8?'on':''}" data-m="pc:5:8">Grand · 5 pions, 8 couleurs</button><button class="${M.p===4&&M.c===8?'on':''}" data-m="pc:4:8">4 pions, 8 couleurs</button></div>

  <div class="acts">${S?'<button class="btn" data-c="close">Annuler</button>':''}<button class="btn pri" data-m="start">Jouer</button></div>`);
  draw(); $('#mbox').onclick=e=>{ const x=e.target.closest('[data-m]'); if(!x) return; if($('#n0')) M.names=[$('#n0').value,$('#n1').value]; const a=x.dataset.m.split(':');
    if(a[0]==='start'){ closeModal(); store('cs-prefs',M); newGame({...M,names:[M.names[0].trim()||'Camille',M.names[1].trim()||'Lucas']}); return; }
    if(a[0]==='mode') M.mode=a[1]; if(a[0]==='pc'){ M.p=+a[1]; M.c=+a[2]; } if(a[0]==='dup') M.dup=a[1]==='1'; if(a[0]==='tries') M.tries=+a[1]; draw(); }; }
function help(){ helpTabs("Code Secret",[["But du jeu","<p>Un code de pions de couleur est caché. Trouve-le en un minimum d’essais, avant la fin des essais autorisés.</p>"],["Les indices","<p>Après chaque proposition, tu reçois des petits pions :</p><ul><li><b>rouge</b> : une couleur juste, à la bonne place ;</li><li><b>blanc</b> : une couleur juste, mais mal placée.</li></ul><p>Les indices ne disent pas <i>quels</i> pions sont concernés : à toi de le déduire.</p><p class=\"ex\">Exemple : code <b>rouge bleu vert jaune</b>, proposition <b>rouge vert rouge orange</b> → 1 rouge (le rouge en 1<sup>re</sup> place) et 1 blanc (le vert, mal placé). Le second rouge ne compte pas : le code n’en a qu’un.</p>"],["Modes et options","<ul><li><b>Je devine</b> : l’ordinateur cache un code.</li><li><b>L’ordinateur devine</b> : compose ton code, il le trouve en général en 5 essais au plus.</li><li><b>À deux</b> : l’un compose, l’autre devine.</li><li>Difficulté : 4 pions et 6 couleurs (classique), 4 pions et 8 couleurs, ou 5 pions et 8 couleurs.</li><li><b>Doublons permis</b> : une couleur peut apparaître plusieurs fois dans le code.</li><li>Nombre d’essais : 8, 10 ou 12.</li></ul><p>Clavier : chiffres 1 à 8 pour les couleurs, Retour arrière pour effacer, Entrée pour valider.</p>"]]); }
window.CS={get S(){return S;},score};
window.NETGAME={id:'code-secret',title:'Code Secret',min:2,max:2,
  rules(){ return `<h4>Difficulté</h4><div class="seg"><button class="${M.p===4&&M.c===6?'on':''}" data-m="pc:4:6">4 pions, 6 couleurs</button><button class="${M.p===5&&M.c===8?'on':''}" data-m="pc:5:8">5 pions, 8 couleurs</button><button class="${M.p===4&&M.c===8?'on':''}" data-m="pc:4:8">4 pions, 8 couleurs</button></div> <div class="seg"><button class="${M.dup?'on':''}" data-m="dup:1">Doublons permis</button><button class="${!M.dup?'on':''}" data-m="dup:0">Sans doublon</button></div><p class="net-note">Le premier joueur compose le code, l’autre le cherche. On inverse les rôles à chaque nouvelle partie.</p>`; },
  rulesClick(e){ const x=e.target.closest('[data-m]'); if(!x) return false; const a=x.dataset.m.split(':'); if(a[0]==='pc'){ M.p=+a[1]; M.c=+a[2]; } else if(a[0]==='dup') M.dup=a[1]==='1'; else return false; store('cs-prefs',M); return true; },
  start(list){ GEN++; const setter=S&&S.cfg&&S.cfg.mode==='net'?1-S.setter:0; S={cfg:{mode:'net',p:M.p,c:M.c,dup:M.dup,tries:M.tries,names:list.map(x=>x.name)},players:list.map(x=>({name:x.name,cid:x.cid||null,ai:!!x.ai,level:x.level||'normal'})),setter,rows:[],cur:[],secret:null,over:null,thinking:'',setting:true,net:true};
    if(S.players[setter].ai){ S.secret=randCode(); S.setting=false; } sv(); NET.push(null,'new'); render(); banner('Nouvelle partie',S.players[setter].name+' compose le code','#6a3fa0'); if(!S.setting&&S.players[1-setter].ai) aiLoop(); },
  state:()=>S, busy:()=>false, resume(){ render(); },
  act(seat,fn,args){ if(!S||S.over) return false; const g=args[1]; if(!Array.isArray(g)||g.length!==S.cfg.p||g.some(x=>!(x>=0&&x<S.cfg.c))) return false;
    if(fn==='code'){ if(!S.setting||seat!==S.setter) return false; setCode(g.slice()); return true; }
    if(fn==='guess'){ if(S.setting||seat!==1-S.setter) return false; doGuess(g.slice()); return true; } return false; },
  async receive(m){ if(m.kind==='lobby'){ GEN++; S=null; return; }
    if(m.kind==='new'){ GEN++; S=m.G; render(); banner('Nouvelle partie',S.players[S.setter].name+' compose le code','#6a3fa0'); return; }
    if(m.ev&&m.ev[0]&&m.ev[0].t==='guess'){ S=m.G; await doGuess(m.ev[0].g); return; }
    const cur=S&&S.cur; S=m.G; if(cur&&cur.length&&!S.over) S.cur=cur; render(); },
  leave(){ GEN++; S=null; window.GAME.menu(); } };
(function boot(){ const p=load('cs-prefs'); if(p) Object.assign(M,p); const s=load('cs-save'); if(s&&!s.over&&s.cfg.mode!=='ia'&&!s.setting){ S=s; render(); } else { M.mode=M.mode||'solo'; S=null; menu(); } })();
