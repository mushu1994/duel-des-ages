<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Code Secret</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
:root{--fg:#f4ece0;--accent:#d2523a;--title:"Bungee",system-ui,sans-serif;--ui:"Nunito Sans",system-ui,sans-serif;--titlec:#ffd27a}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui,"Nunito Sans",system-ui,sans-serif);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar,#0006);border-bottom:1px solid #fff2;flex-wrap:wrap}
.top h1{font-family:var(--title,Georgia,serif);font-weight:800;font-size:24px;margin:0;color:var(--titlec,#fff);letter-spacing:.5px}
.top h1 small{font-family:var(--ui);font-weight:600;font-size:13px;opacity:.75;margin-left:8px;letter-spacing:0}
.back{color:inherit;opacity:.9;text-decoration:none;font-size:14px;border:1px solid #fff4;padding:5px 10px;border-radius:8px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#ffffff1c;color:inherit;border:1px solid #ffffff40;border-radius:9px;padding:7px 12px;font-size:14px;font-weight:700}
.btn:hover{background:#ffffff2e}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:#fff;color:#222}
.status{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--pc,var(--accent));color:#fff;font-weight:800;min-height:44px;box-shadow:0 4px 14px #0005;transition:background .35s;flex-wrap:wrap}
.status .who{font-family:var(--title,Georgia,serif);font-size:19px}
.status .msg{font-weight:600}
.status .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
#modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:12px}
#modal[hidden]{display:none}
.mbox{background:#fbf6ea;color:#2a2418;border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox h2{font-family:var(--title,Georgia,serif);font-size:26px;margin:0 0 6px}
.mbox h4{font-family:var(--title,Georgia,serif);font-size:16px;margin:14px 0 6px}
.mbox p,.mbox li{line-height:1.5}
.mbox .btn{background:#ece3cf;color:#2a2418;border-color:#c9b98f}
.mbox .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.mbox .btn.on{background:#2a2418;color:#fff}
.seg{display:inline-flex;border:1px solid #c9b98f;border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#f6efdc;padding:7px 11px;font-weight:700;color:#2a2418;font-size:13.5px}
.seg button.on{background:#2a2418;color:#fff}
.prow{display:flex;gap:8px;align-items:center;margin:7px 0;flex-wrap:wrap}
.prow .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);border:2px solid #0004}
.prow input[type=text]{font-family:inherit;font-weight:700;font-size:16px;padding:6px 9px;border-radius:8px;border:1px solid #c9b98f;background:#fff;color:#2a2418;-webkit-text-fill-color:#2a2418;caret-color:var(--accent);width:150px;color-scheme:light}
.prow input[type=text]::placeholder{color:#a3926e;-webkit-text-fill-color:#a3926e;font-weight:600}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:1px solid #c9b98f;background:#f6efdc;border-radius:20px;padding:5px 12px;font-weight:800;color:#2a2418}
.tabs button.on{background:#2a2418;color:#fff}
.toast{position:fixed;left:50%;top:100px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #000a;z-index:70;font-weight:700;animation:toast 2.6s forwards;pointer-events:none;max-width:90vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.bannerx{position:fixed;inset:0;display:grid;place-items:center;z-index:65;pointer-events:none}
.bannerx div{font-family:var(--title,Georgia,serif);font-weight:800;font-size:clamp(30px,6vw,64px);color:#fff;background:var(--bc,var(--accent));padding:10px 36px;border-radius:14px;box-shadow:0 20px 50px #000a;animation:ban 2.3s forwards;text-align:center}
.bannerx small{display:block;font-family:var(--ui);font-size:.34em;font-weight:700}
@keyframes ban{0%{transform:scale(2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.92)}}
#cover{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);text-align:center;padding:20px}
#cover[hidden]{display:none}
#cover h2{font-family:var(--title,Georgia,serif);font-size:36px;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}

body{background:radial-gradient(ellipse at 50% 0%,#3a2a4f,#141022 75%) fixed,#141022}
.top h1{font-weight:400;letter-spacing:1px}
.wrap{display:flex;gap:20px;justify-content:center;align-items:flex-start;padding:14px;flex-wrap:wrap}
.boardc{background:linear-gradient(90deg,#7a4a26,#9a6234 20%,#8a552c 50%,#9a6234 80%,#7a4a26);border-radius:18px;padding:12px 14px;box-shadow:0 20px 40px #000a,inset 0 0 0 3px #5a3416;min-width:min(96vw,420px)}
.secret{display:flex;gap:10px;align-items:center;justify-content:center;background:#3a2210;border-radius:10px;padding:10px;margin-bottom:10px;position:relative;overflow:hidden}
.secret .lid{position:absolute;inset:0;background:linear-gradient(#5a3416,#3a2210);display:grid;place-items:center;font-family:var(--title);color:#ffd27a;letter-spacing:2px;transition:transform .8s cubic-bezier(.6,0,.3,1)}
.secret.open .lid{transform:translateY(-105%)}
.row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;margin:3px 0}
.row.cur{background:#ffffff1c;box-shadow:inset 0 0 0 2px #ffd27a88}
.row .num{width:20px;text-align:right;font-weight:800;color:#f1d3a8;opacity:.7;font-size:13px}
.holes{display:flex;gap:9px}
.hole{width:var(--hs);height:var(--hs);border-radius:50%;background:radial-gradient(circle at 50% 40%,#2a170a,#4a2a12);box-shadow:inset 0 3px 5px #000a;display:grid;place-items:center;cursor:default}
.row.cur .hole{cursor:pointer}
.peg{width:92%;height:92%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,var(--c) 40%,color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 3px 4px #0008}
.peg.drop{animation:pd .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pd{from{transform:translateY(-24px) scale(1.2);opacity:0}}
.fb{display:grid;grid-template-columns:repeat(var(--fc),12px);gap:4px;margin-left:auto;padding:4px;background:#3a2210;border-radius:8px}
.fb i{width:12px;height:12px;border-radius:50%;background:#2a170a;box-shadow:inset 0 1px 2px #000}
.fb i.k{background:radial-gradient(circle at 35% 30%,#ff8a7a,#c41f1f);box-shadow:0 1px 2px #000}
.fb i.w{background:radial-gradient(circle at 35% 30%,#fff,#d8d2c4);box-shadow:0 1px 2px #000}
.fb i.pop{animation:fp .35s backwards}
@keyframes fp{from{transform:scale(0)}}
.pal{display:flex;flex-direction:column;gap:12px;background:#ffffff10;border:1px solid #ffffff22;border-radius:16px;padding:14px;min-width:220px}
.pal h3{margin:0;font-family:var(--title);font-weight:400;color:#ffd27a;font-size:16px}
.colors{display:grid;grid-template-columns:repeat(4,52px);gap:10px}
.colors button{width:52px;height:52px;border-radius:50%;border:3px solid #ffffff30;background:radial-gradient(circle at 35% 30%,#fffa,var(--c) 40%,color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 4px 8px #0008}
.colors button:active{transform:scale(.92)}
.legend{font-size:13px;line-height:1.6}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:4px}
.think{font-size:14px;opacity:.85;min-height:20px}

.hbody p,.hbody li{line-height:1.5}.hbody ul,.hbody ol{padding-left:22px;margin:6px 0}.hbody li{margin:4px 0}.hbody .ex{background:#efe6d0;border-left:4px solid #c9b98f;border-radius:8px;padding:8px 12px;margin:10px 0}
/*top-above*//*hh*/#modal,#cover{top:var(--hh,0px)!important}#modal>*{max-height:calc(100vh - var(--hh,0px) - 24px)!important;max-height:calc(100dvh - var(--hh,0px) - 24px)!important;overflow:auto}
/*top-above*/header.top{position:relative;z-index:61!important}
</style></head><body>
<header class="top"><a class="back" href="index.html">← Salle de jeux</a><h1>Code Secret</h1>
<div class="tools"><button class="btn" id="sndBtn" data-c="sound">Son</button><button class="btn" data-c="help">Aide</button><button class="btn pri" data-c="new">Nouvelle partie</button></div></header>
<div class="status" id="status"></div>
<div class="wrap"><div class="boardc" id="boardc"></div><div class="pal" id="pal"></div></div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="cover" hidden></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SVGNS='http://www.w3.org/2000/svg';
function sel(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,REDUCED?Math.min(ms,30):ms));
function openModal(h,onclick){ $('#mbox').innerHTML=h; $('#mbox').onclick=onclick||null; $('#modal').hidden=false; }
function paintModal(h){ $('#mbox').innerHTML=h; $('#modal').hidden=false; }
function helpTabs(title,tabs){ let k=0; const draw=()=>paintModal('<h2>'+title+'</h2>'+(tabs.length>1?'<div class="tabs">'+tabs.map((t,i)=>'<button class="'+(i===k?'on':'')+'" data-ht="'+i+'">'+t[0]+'</button>').join('')+'</div>':'')+'<div class="hbody">'+tabs[k][1]+'</div><div class="acts"><button class="btn pri" data-c="close">Compris</button></div>'); draw(); $('#mbox').onclick=e=>{ const b=e.target.closest('[data-ht]'); if(b){ k=+b.dataset.ht; draw(); $('#mbox').scrollTop=0; } }; }
function closeModal(){ $('#modal').hidden=true; $('#mbox').onclick=null; window.COVER_HIDDEN=null; }
function toast(s){ const t=document.createElement('div'); t.className='toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2700); }
function banner(s,sub,col){ const b=document.createElement('div'); b.className='bannerx'; b.innerHTML=`<div style="${col?'--bc:'+col:''}">${esc(s)}${sub?`<small>${esc(sub)}</small>`:''}</div>`; document.body.appendChild(b); setTimeout(()=>b.remove(),2400); }
function confetti(cols){ if(REDUCED) return; cols=cols||['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#fff']; for(let i=0;i<80;i++){ const c=document.createElement('div'); c.style.cssText=`position:fixed;top:-12px;left:${Math.random()*100}vw;width:8px;height:12px;background:${cols[i%cols.length]};z-index:90;pointer-events:none;border-radius:2px`; document.body.appendChild(c);
  c.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*220}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`}],{duration:2200+Math.random()*1800,delay:Math.random()*700,easing:'ease-in'}).finished.then(()=>c.remove()); } }
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
/* sons */
let MUTED=!!load('salle-mute'), AC=null, NOISE=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(AC.state==='suspended') AC.resume().catch(()=>{}); return AC; }
function tn(a,t,f,d,type,v,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function nz(a,t,d,v,type,f){ if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;} const s=a.createBufferSource();s.buffer=NOISE;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02); }
function sfx(n){ if(MUTED) return; const a=ac(); if(!a||a.state!=='running') return; const t=a.currentTime+.01;
  switch(n){
    case 'click': tn(a,t,900,.06,'triangle',.06); break;
    case 'move': nz(a,t,.08,.25,'bandpass',900); tn(a,t,220,.08,'sine',.08); break;
    case 'capture': nz(a,t,.12,.35,'bandpass',1400); tn(a,t,520,.12,'triangle',.1,260); break;
    case 'card': nz(a,t,.1,.22,'bandpass',2800); break;
    case 'flip': nz(a,t,.06,.25,'highpass',3000); tn(a,t,1200,.05,'triangle',.04); break;
    case 'dice': for(let k=0;k<6;k++) nz(a,t+k*.07+Math.random()*.03,.05,.3,'bandpass',1800+Math.random()*1200); break;
    case 'ding': tn(a,t,1320,.5,'sine',.1); tn(a,t+.07,1760,.4,'sine',.06); break;
    case 'error': tn(a,t,220,.25,'square',.05,160); break;
    case 'win': [523,659,784,1046].forEach((f,k)=>tn(a,t+k*.12,f,.4,'triangle',.11)); break;
    case 'lose': [392,330,262].forEach((f,k)=>tn(a,t+k*.16,f,.45,'triangle',.1)); break;
    case 'splash': nz(a,t,.5,.3,'lowpass',800); break;
    case 'boom': nz(a,t,.7,.6,'lowpass',300); tn(a,t,90,.6,'sawtooth',.15,40); break;
    case 'pop': tn(a,t,600,.08,'sine',.1,900); break;
  } }
function updSnd(){ const b=$('#sndBtn'); if(b) b.textContent=MUTED?'Son : non':'Son : oui'; }
document.addEventListener('click',e=>{
  if(!MUTED) ac();
  if(e.target.id==='modal'&&window.MODAL_CLOSABLE!==false){ const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; return; }
  const t=e.target.closest('[data-c]'); if(!t) return;
  switch(t.dataset.c){
    case 'sound': MUTED=!MUTED; store('salle-mute',MUTED); updSnd(); break;
    case 'help': GAME.help(); break;
    case 'new': { const cv=$('#cover'); window.MODAL_CLOSABLE=true; GAME.menu(); if(cv&&!cv.hidden){ cv.hidden=true; window.COVER_HIDDEN=cv; } break; }
    case 'close': { const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; break; }
  }
});
addEventListener('DOMContentLoaded',updSnd);

/* ===== moteur ===== */
const IS_NODE=typeof window==='undefined';
function score(code,guess){ let k=0,w=0; const a={},b={}; for(let i=0;i<code.length;i++){ if(code[i]===guess[i]) k++; else { a[code[i]]=(a[code[i]]||0)+1; b[guess[i]]=(b[guess[i]]||0)+1; } } for(const c in b) w+=Math.min(b[c],a[c]||0); return [k,w]; }
function allCodes(p,c,dup){ const out=[]; const rec=(pre)=>{ if(pre.length===p){ out.push(pre); return; } for(let x=0;x<c;x++){ if(!dup&&pre.includes(x)) continue; rec(pre.concat(x)); } }; rec([]); return out; }
function solverNext(cands,all,p){
  if(cands.length===1) return cands[0];
  if(all.length<=1500&&cands.length<=400){ // minimax (Knuth)
    let best=null,bv=Infinity; const pool=cands.length<=40?all:cands;
    for(const g of pool){ const parts={}; let worst=0; for(const c of cands){ const k=score(c,g).join(); parts[k]=(parts[k]||0)+1; if(parts[k]>worst) worst=parts[k]; }
      const v=worst-(cands.includes(g)?.5:0); if(v<bv){bv=v;best=g;} }
    return best; }
  return cands[Math.floor(Math.random()*cands.length)];
}
if(IS_NODE) module.exports={score,allCodes,solverNext};
else {
/* ===== interface ===== */
const PALETTE=['#e8433a','#2f7ee0','#3fbf5a','#f2c230','#f08a2a','#a84fd8','#f5f1e6','#2a2a30'];
const PNAMES=['rouge','bleu','vert','jaune','orange','violet','blanc','noir'];
let S=null, GEN=0;
const GAME=window.GAME={help,menu};
function newGame(cfg){ GEN++; S={cfg,rows:[],cur:[],secret:null,over:null,thinking:'',all:null,cands:null};
  if(cfg.mode==='solo'){ S.secret=randCode(); startGuess(); }
  else if(cfg.mode==='ia'){ S.setting=true; S.cur=[]; render(); }
  else { S.setting=true; S.cur=[]; render(); coverMsg(`${cfg.names[0]} compose le code secret`,'Les autres ferment les yeux !'); }
  store('cs-save',S); }
function randCode(){ const {p,c,dup}=S.cfg; const pool=[...Array(c).keys()]; const out=[]; while(out.length<p){ const x=pool[Math.floor(Math.random()*pool.length)]; if(!dup&&out.includes(x)) continue; out.push(x); } return out; }
function startGuess(){ S.setting=false; S.cur=[]; render(); }
function coverMsg(t,sub){ const c=$('#cover'); c.innerHTML=`<div><h2 style="font-family:var(--title);color:#ffd27a">${esc(t)}</h2><p>${esc(sub||'')}</p><button class="btn pri" style="font-size:18px;padding:12px 26px">C'est parti</button></div>`; c.hidden=false; c.querySelector('button').onclick=()=>{ c.hidden=true; }; }
function render(){
  const {p,c,tries}=S.cfg, hs=p>4?'38px':'42px';
  const open=!!S.over, showSecret=S.secret&&(S.over||S.cfg.mode==='ia'&&!S.setting);
  let h=`<div class="secret ${open||S.cfg.mode==='ia'&&!S.setting?'open':''}" style="--hs:${hs}"><div class="holes">${Array.from({length:p},(_,i)=>`<div class="hole">${S.secret&&(open||S.cfg.mode==='ia')?`<div class="peg" style="--c:${PALETTE[S.secret[i]]}"></div>`:''}</div>`).join('')}</div><div class="lid">CODE SECRET</div></div>`;
  for(let r=tries-1;r>=0;r--){ const row=S.rows[r], cur=!S.setting&&!S.over&&r===S.rows.length&&S.cfg.mode!=='ia';
    const pegs=row?row.g:(cur?S.cur:[]);
    h+=`<div class="row ${cur?'cur':''}" style="--hs:${hs}"><span class="num">${r+1}</span><div class="holes">${Array.from({length:p},(_,i)=>`<div class="hole" data-h="${cur?i:''}">${pegs[i]!=null?`<div class="peg ${row&&row.fresh||cur&&i===S.cur.length-1?'drop':''}" style="--c:${PALETTE[pegs[i]]};animation-delay:${row&&row.fresh?i*.07:0}s"></div>`:''}</div>`).join('')}</div>
      <div class="fb" style="--fc:${Math.ceil(p/2)}">${Array.from({length:p},(_,i)=>{ const f=row&&row.f; const cl=f?(i<f[0]?'k':i<f[0]+f[1]?'w':''):''; return `<i class="${cl} ${row&&row.fresh&&cl?'pop':''}" style="animation-delay:${.35+i*.12}s"></i>`; }).join('')}</div></div>`; }
  $('#boardc').innerHTML=h; S.rows.forEach(r=>r.fresh=false);
  // setting row
  const setting=S.setting;
  $('#pal').innerHTML=`<h3>${setting?'Compose ton code':S.cfg.mode==='ia'?'L\'ordinateur cherche':'Ta proposition'}</h3>
   ${setting?`<div class="holes" style="--hs:42px">${Array.from({length:p},(_,i)=>`<div class="hole" data-sh="${i}" style="cursor:pointer">${S.cur[i]!=null?`<div class="peg" style="--c:${PALETTE[S.cur[i]]}"></div>`:''}</div>`).join('')}</div>`:''}
   ${(setting||S.cfg.mode!=='ia')&&!S.over?`<div class="colors">${Array.from({length:c},(_,i)=>`<button data-col="${i}" style="--c:${PALETTE[i]}" title="${PNAMES[i]}"></button>`).join('')}</div>
   <div class="prow"><button class="btn" data-a="back">⌫ Effacer</button><button class="btn pri" data-a="ok" ${S.cur.length===p?'':'disabled'}>${setting?'Valider le code':'Valider'}</button></div>`:''}
   ${S.cfg.mode==='ia'&&!setting?`<div class="think">${esc(S.thinking||'')}</div>`:''}
   <div class="legend"><i style="background:#c41f1f"></i>bonne couleur bien placée<br><i style="background:#eee"></i>bonne couleur mal placée<br>${p} pions · ${c} couleurs · ${S.cfg.dup?'doublons permis':'sans doublon'}</div>`;
  const st=$('#status'); st.style.setProperty('--pc',S.over?(S.won?'#2f8a4a':'#8a2a1a'):'#6a3fa0');
  st.innerHTML=S.over?`<span class="who">${esc(S.over)}</span>`:`<span class="who">${setting?'Code secret':'Essai '+(S.rows.length+1)+' / '+tries}</span><span class="msg">${setting?(S.cfg.mode==='ia'?'Choisis un code : l\'ordinateur va le deviner.':esc(S.cfg.names[0])+' compose le code en cachette.'):S.cfg.mode==='ia'?'L\'ordinateur réfléchit…':S.cfg.mode==='2p'?esc(S.cfg.names[1])+' cherche le code.':'Trouve la combinaison !'}</span>`;
}
function addColor(i){ if(S.over) return; const {p,dup}=S.cfg; if(S.cur.length>=p) return; if(!dup&&S.cur.includes(i)){ toast('Pas de doublon dans cette partie.'); sfx('error'); return; } S.cur.push(i); sfx('pop'); render(); }
async function submit(){
  const {p,tries}=S.cfg; if(S.cur.length!==p) return;
  if(S.setting){ S.secret=S.cur.slice(); S.cur=[]; sfx('ding');
    if(S.cfg.mode==='2p'){ startGuess(); coverMsg(`À ${S.cfg.names[1]} de jouer`,'Trouve le code secret !'); store('cs-save',S); return; }
    S.setting=false; render(); aiLoop(); return; }
  const f=score(S.secret,S.cur); S.rows.push({g:S.cur.slice(),f,fresh:true}); S.cur=[]; sfx('click'); render();
  await wait(400+p*120); f[0]===p?sfx('win'):(f[0]+f[1]?sfx('ding'):sfx('flip'));
  if(f[0]===p){ S.over=`Code trouvé en ${S.rows.length} essai${S.rows.length>1?'s':''} !`; S.won=true; render(); banner('Bravo !',S.over,'#2f8a4a'); confetti(); store('cs-save',null); return; }
  if(S.rows.length>=tries){ S.over='Perdu ! Voici le code secret.'; S.won=false; render(); banner('Raté…','Le code est révélé','#8a2a1a'); sfx('lose'); store('cs-save',null); return; }
  store('cs-save',S);
}
async function aiLoop(){ const my=GEN; const {p,c,dup,tries}=S.cfg; S.all=allCodes(p,c,dup); let cands=S.all.slice();
  while(!S.over){ S.thinking=`${cands.length} combinaison${cands.length>1?'s':''} encore possible${cands.length>1?'s':''}…`; render(); await wait(700); if(my!==GEN) return;
    const g=S.rows.length===0&&p===4&&c===6&&dup?[0,0,1,1]:solverNext(cands,S.all,p);
    const f=score(S.secret,g); S.rows.push({g,f,fresh:true}); sfx('click'); render(); await wait(500+p*120); if(my!==GEN) return; f[0]===p?sfx('lose'):sfx('ding');
    cands=cands.filter(x=>{ const s=score(x,g); return s[0]===f[0]&&s[1]===f[1]; });
    if(f[0]===p){ S.over=`L'ordinateur a trouvé ton code en ${S.rows.length} essai${S.rows.length>1?'s':''}.`; S.won=false; S.thinking=''; render(); banner('Démasqué !',`${S.rows.length} essais`,'#6a3fa0'); return; }
    if(S.rows.length>=tries){ S.over='Ton code a résisté à l\'ordinateur !'; S.won=true; render(); banner('Bien joué !','Code introuvable','#2f8a4a'); confetti(); return; } } }
document.addEventListener('click',e=>{ const col=e.target.closest('[data-col]'); if(col){ addColor(+col.dataset.col); return; }
  const h=e.target.closest('[data-h],[data-sh]'); if(h&&(h.dataset.h!==''&&h.dataset.h!=null||h.dataset.sh!=null)){ const i=+(h.dataset.h??h.dataset.sh); if(i<S.cur.length){ S.cur.splice(i,1); sfx('click'); render(); } return; }
  const a=e.target.closest('[data-a]'); if(!a) return; if(a.dataset.a==='back'){ S.cur.pop(); render(); } if(a.dataset.a==='ok') submit(); });
document.addEventListener('keydown',e=>{ if(!S||S.over||!$('#modal').hidden) return; if(/^[1-8]$/.test(e.key)&&+e.key<=S.cfg.c) addColor(+e.key-1); if(e.key==='Backspace'){ S.cur.pop(); render(); } if(e.key==='Enter') submit(); });
let M={mode:'solo',p:4,c:6,dup:true,tries:10,names:['Camille','Lucas']};
function menu(){ const draw=()=>paintModal(`<h2>Nouvelle partie</h2>
  <h4>Mode</h4><div class="seg"><button class="${M.mode==='solo'?'on':''}" data-m="mode:solo">Je devine le code de l'ordinateur</button><button class="${M.mode==='ia'?'on':''}" data-m="mode:ia">L'ordinateur devine mon code</button><button class="${M.mode==='2p'?'on':''}" data-m="mode:2p">À deux</button></div>
  ${M.mode==='2p'?`<div class="prow"><input type="text" id="n0" value="${esc(M.names[0])}" placeholder="Camille" maxlength="14"> compose, <input type="text" id="n1" value="${esc(M.names[1])}" placeholder="Lucas" maxlength="14"> devine</div>`:''}
  <h4>Difficulté</h4><div class="seg"><button class="${M.p===4&&M.c===6?'on':''}" data-m="pc:4:6">Classique · 4 pions, 6 couleurs</button><button class="${M.p===5&&M.c===8?'on':''}" data-m="pc:5:8">Grand · 5 pions, 8 couleurs</button><button class="${M.p===4&&M.c===8?'on':''}" data-m="pc:4:8">4 pions, 8 couleurs</button></div>
  <h4>Options</h4><div class="seg"><button class="${M.dup?'on':''}" data-m="dup:1">Doublons permis</button><button class="${!M.dup?'on':''}" data-m="dup:0">Sans doublon</button></div> <div class="seg"><button class="${M.tries===10?'on':''}" data-m="tries:10">10 essais</button><button class="${M.tries===12?'on':''}" data-m="tries:12">12 essais</button><button class="${M.tries===8?'on':''}" data-m="tries:8">8 essais</button></div>
  <div class="acts">${S?'<button class="btn" data-c="close">Annuler</button>':''}<button class="btn pri" data-m="start">Jouer</button></div>`);
  draw(); $('#mbox').onclick=e=>{ const x=e.target.closest('[data-m]'); if(!x) return; if($('#n0')) M.names=[$('#n0').value,$('#n1').value]; const a=x.dataset.m.split(':');
    if(a[0]==='start'){ closeModal(); store('cs-prefs',M); newGame({...M,names:[M.names[0].trim()||'Camille',M.names[1].trim()||'Lucas']}); return; }
    if(a[0]==='mode') M.mode=a[1]; if(a[0]==='pc'){ M.p=+a[1]; M.c=+a[2]; } if(a[0]==='dup') M.dup=a[1]==='1'; if(a[0]==='tries') M.tries=+a[1]; draw(); }; }
function help(){ helpTabs("Code Secret",[["But du jeu","<p>Un code de pions de couleur est caché. Trouve-le en un minimum d’essais, avant la fin des essais autorisés.</p>"],["Les indices","<p>Après chaque proposition, tu reçois des petits pions :</p><ul><li><b>rouge</b> : une couleur juste, à la bonne place ;</li><li><b>blanc</b> : une couleur juste, mais mal placée.</li></ul><p>Les indices ne disent pas <i>quels</i> pions sont concernés : à toi de le déduire.</p><p class=\"ex\">Exemple : code <b>rouge bleu vert jaune</b>, proposition <b>rouge vert rouge orange</b> → 1 rouge (le rouge en 1<sup>re</sup> place) et 1 blanc (le vert, mal placé). Le second rouge ne compte pas : le code n’en a qu’un.</p>"],["Modes et options","<ul><li><b>Je devine</b> : l’ordinateur cache un code.</li><li><b>L’ordinateur devine</b> : compose ton code, il le trouve en général en 5 essais au plus.</li><li><b>À deux</b> : l’un compose, l’autre devine.</li><li>Difficulté : 4 pions et 6 couleurs (classique), 4 pions et 8 couleurs, ou 5 pions et 8 couleurs.</li><li><b>Doublons permis</b> : une couleur peut apparaître plusieurs fois dans le code.</li><li>Nombre d’essais : 8, 10 ou 12.</li></ul><p>Clavier : chiffres 1 à 8 pour les couleurs, Retour arrière pour effacer, Entrée pour valider.</p>"]]); }
(function boot(){ const p=load('cs-prefs'); if(p) Object.assign(M,p); const s=load('cs-save'); if(s&&!s.over&&s.cfg.mode!=='ia'&&!s.setting){ S=s; render(); } else { M.mode=M.mode||'solo'; S=null; menu(); } })();
}
