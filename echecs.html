function help(){ helpTabs("Échecs",[["But du jeu","<p>Mettre le roi adverse <b>échec et mat</b> : il est attaqué et ne peut plus y échapper. Les Blancs commencent.</p><p>Notation : R roi, D dame, T tour, F fou, C cavalier ; les pions n’ont pas de lettre.</p>"],["Pièces","<ul><li><b>Roi</b> : une case dans toutes les directions.</li><li><b>Dame</b> : autant de cases qu’elle veut en ligne droite ou en diagonale.</li><li><b>Tour</b> : en ligne droite. <b>Fou</b> : en diagonale.</li><li><b>Cavalier</b> : en « L » (2 cases puis 1 de côté), il saute par-dessus les pièces.</li><li><b>Pion</b> : avance d’une case (deux depuis sa case de départ) et prend en diagonale.</li></ul>"],["Règles spéciales","<ul><li><b>Roque</b> : roi et tour qui n’ont jamais bougé, cases libres entre eux, roi ni en échec ni traversant une case attaquée. Touche le roi, puis sa case d’arrivée.</li><li><b>Prise en passant</b> : un pion qui avance de deux cases peut être pris comme s’il n’avançait que d’une, au coup suivant seulement.</li><li><b>Promotion</b> : un pion qui atteint la dernière rangée devient la pièce de ton choix.</li><li><b>Nulle</b> : pat (aucun coup légal sans être en échec), 50 coups sans prise ni pion, triple répétition, matériel insuffisant.</li></ul>"],["Jouer ici","<ul><li>Touche une pièce, puis une case marquée.</li><li>Niveaux : <b>Débutant</b> (fait des erreurs), <b>Club</b> (calcule environ 4 demi-coups), <b>Maître</b> (cherche plus loin, environ 2,5 s par coup).</li><li>« Tourner » retourne l’échiquier ; à deux, il peut tourner tout seul à chaque coup.</li><li>« Annuler » reprend le dernier coup.</li></ul>"]]); }
window.ECH={get S(){return S;},legal,get BUSY(){return BUSY;}};
window.NETGAME={id:'echecs',title:'Échecs',min:2,max:2,
  start(list){ GEN++; S={P:newPos(),mode:'net',level:'normal',ai:null,names:{w:list[0].name,b:list[1].name},players:list.map(x=>({name:x.name,cid:x.cid||null,ai:!!x.ai,level:x.level||'normal'})),hist:[],san:[],capt:[],last:null,reps:{},over:null,net:true}; FLIP=false; build(); render(); store('ech',S); NET.push(null,'new'); banner('Nouvelle partie',S.names.w+' a les Blancs'); next(); },
  state:()=>S, busy:()=>BUSY, resume(){ render(); next(); },
  act(seat,fn,args){ if(fn!=='move'||!S||S.over||BUSY) return false; if(seat!==(S.P.t==='w'?0:1)) return false; const a=args[1]||{}; const m=legal(S.P).find(x=>x.from===a.from&&x.to===a.to&&(x.promo||null)===(a.promo||null)); if(!m) return false; doMove(m); return true; },
  async receive(m){ if(m.kind==='lobby'){ GEN++; S=null; return; }
    if(m.kind==='new'){ GEN++; S=m.G; FLIP=NET.seat===1; build(); render(); if(S.san.length===0) banner('Nouvelle partie',S.names.w+' a les Blancs'); return; }
    if(m.ev&&m.ev[0]&&m.ev[0].t==='move'){ S=m.G; const mv=legal(S.P).find(x=>x.from===m.ev[0].m.from&&x.to===m.ev[0].m.to&&(x.promo||null)===(m.ev[0].m.promo||null)); render(); if(mv) await doMove(mv); return; }
    if(!BUSY){ S=m.G; render(); } },
  leave(){ GEN++; S=null; window.GAME.menu(); } };
(function boot(){ const p=load('echp'); if(p) Object.assign(M,p); const s=load('ech'); if(s&&!s.over){ S=s; FLIP=S.mode==='ia'&&S.ai==='w'; build(); render(); next(); } else { S={P:newPos(),mode:'2p',names:{w:'',b:''},san:[],capt:[],reps:{},hist:[]}; build(); render(); S=null; menu(); } })();
}
