<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quitte ou Sept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<style>
/* Fête foraine de nuit : pioche et défausse sous un chapiteau, une piste par joueur où s'alignent les cartes retournées */
:root{--bg:#0f2b33;--fg:#fff7ea;--accent:#ff5d73;--title:"Bungee","Arial Black",system-ui,sans-serif;--ui:"Nunito Sans",system-ui,sans-serif;--titlec:#ffe9a8;--cream:#fff7ea;--teal:#1aa6a6;--rose:#ff5d73;--gold:#ffc23d;--ice:#8fd8ff;--ink:#1d2730;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui,"Nunito Sans",system-ui,sans-serif);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar,#0006);border-bottom:1px solid #fff2;flex-wrap:wrap}
.top h1{font-family:var(--title,Georgia,serif);font-weight:800;font-size:24px;margin:0;color:var(--titlec,#fff);letter-spacing:.5px}
.top h1 small{font-family:var(--ui);font-weight:600;font-size:13px;opacity:.75;margin-left:8px;letter-spacing:0}
.back{color:inherit;opacity:.9;text-decoration:none;font-size:14px;border:1px solid #fff4;padding:5px 10px;border-radius:8px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#ffffff1c;color:inherit;border:1px solid #ffffff40;border-radius:9px;padding:7px 12px;font-size:14px;font-weight:700}
.btn:hover{background:#ffffff2e}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:#fff;color:#222}
.status{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--pc,var(--accent));color:#fff;font-weight:800;min-height:44px;box-shadow:0 4px 14px #0005;transition:background .35s;flex-wrap:wrap}
.status .who{font-family:var(--title,Georgia,serif);font-size:19px}
.status .msg{font-weight:600}
.status .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
#modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:12px}
#modal[hidden]{display:none}
.mbox{background:#fbf6ea;color:#2a2418;border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox h2{font-family:var(--title,Georgia,serif);font-size:26px;margin:0 0 6px}
.mbox h4{font-family:var(--title,Georgia,serif);font-size:16px;margin:14px 0 6px}
.mbox p,.mbox li{line-height:1.5}
.mbox .btn{background:#ece3cf;color:#2a2418;border-color:#c9b98f}
.mbox .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.mbox .btn.on{background:#2a2418;color:#fff}
.seg{display:inline-flex;border:1px solid #c9b98f;border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#f6efdc;padding:7px 11px;font-weight:700;color:#2a2418;font-size:13.5px}
.seg button.on{background:#2a2418;color:#fff}
.prow{display:flex;gap:8px;align-items:center;margin:7px 0;flex-wrap:wrap}
.prow .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);border:2px solid #0004}
.prow input[type=text]{font-family:inherit;font-weight:700;font-size:16px;padding:6px 9px;border-radius:8px;border:1px solid #c9b98f;background:#fff;color:#2a2418;-webkit-text-fill-color:#2a2418;caret-color:var(--accent);width:150px;color-scheme:light}
.prow input[type=text]::placeholder{color:#a3926e;-webkit-text-fill-color:#a3926e;font-weight:600}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:1px solid #c9b98f;background:#f6efdc;border-radius:20px;padding:5px 12px;font-weight:800;color:#2a2418}
.tabs button.on{background:#2a2418;color:#fff}
.toast{position:fixed;left:50%;top:100px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #000a;z-index:70;font-weight:700;animation:toast 2.6s forwards;pointer-events:none;max-width:90vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.bannerx{position:fixed;inset:0;display:grid;place-items:center;z-index:65;pointer-events:none}
.bannerx div{font-family:var(--title,Georgia,serif);font-weight:800;font-size:clamp(30px,6vw,64px);color:#fff;background:var(--bc,var(--accent));padding:10px 36px;border-radius:14px;box-shadow:0 20px 50px #000a;animation:ban 2.3s forwards;text-align:center}
.bannerx small{display:block;font-family:var(--ui);font-size:.34em;font-weight:700}
@keyframes ban{0%{transform:scale(2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.92)}}
#cover{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);text-align:center;padding:20px}
#cover[hidden]{display:none}
#cover h2{font-family:var(--title,Georgia,serif);font-size:36px;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
.hbody p,.hbody li{line-height:1.5}.hbody ul,.hbody ol{padding-left:22px;margin:6px 0}.hbody li{margin:4px 0}.hbody .ex{background:#efe6d0;border-left:4px solid #c9b98f;border-radius:8px;padding:8px 12px;margin:10px 0}
/*top-above*//*hh*/#modal,#cover{top:var(--hh,0px)!important}#modal>*{max-height:calc(100vh - var(--hh,0px) - 24px)!important;max-height:calc(100dvh - var(--hh,0px) - 24px)!important;overflow:auto}
/*top-above*/header.top{position:relative;z-index:61!important}

/* hall (autonome : portail et jeux) */
#hall-modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;padding:12px}
#hall-modal[hidden]{display:none}
.hall-box{background:#fbf6ea;color:#2a2418;border-radius:16px;max-width:560px;width:100%;max-height:calc(100dvh - 24px);overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;font-family:"Nunito Sans",Karla,system-ui,sans-serif;text-align:left}
.hall-box h2{font-family:Georgia,serif;font-size:24px;margin:0 0 6px;color:#2a2418}
.hall-box h4{font-family:Georgia,serif;font-size:16px;margin:14px 0 6px;color:#2a2418}
.hall-box p{line-height:1.45;margin:6px 0}
.hall-in{font-weight:800;font-size:16px;font-family:inherit;padding:9px 11px;border-radius:9px;border:1px solid #c9b98f;background:#fff!important;color:#2a2418!important;-webkit-text-fill-color:#2a2418!important;caret-color:#2a2418;width:100%;max-width:300px}
.hall-in::placeholder{color:#a3926e!important;-webkit-text-fill-color:#a3926e!important;font-weight:600}
.hall-err{color:#b0412e;font-weight:800;min-height:1.2em;font-size:14px}
.hall-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.hall-btn{font-weight:800;font-size:14px;line-height:1;font-family:inherit;border-radius:9px;padding:8px 12px;border:1px solid #c9b98f;background:#ece3cf;color:#2a2418;cursor:pointer;touch-action:manipulation}
.hall-btn.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}
.hall-btn:disabled{opacity:.5}
.hall-link{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;cursor:pointer}
.hall-note{color:#6b5d40;font-size:14px}
.hall-me{background:#f0e6cf;border-radius:10px;padding:8px 10px;margin:6px 0}
.hall-list{list-style:none;margin:4px 0;padding:0;display:flex;flex-direction:column;gap:5px}
.hall-list li{display:flex;align-items:center;gap:9px;background:#f6efdc;border-radius:10px;padding:6px 8px}
.hall-tx{flex:1;min-width:0;display:flex;flex-direction:column}.hall-tx small{color:#6b5d40;font-size:12.5px}
.hall-av{width:30px;height:30px;border-radius:50%;background:#2a2418;color:#fff;display:grid;place-items:center;font-weight:900;flex:none;text-transform:uppercase}
.hall-games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.hall-spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid #c9b98f;border-top-color:#2a2418;animation:hallr 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes hallr{to{transform:rotate(360deg)}}
.hall-invite{position:fixed;right:12px;bottom:12px;z-index:85;background:#fbf6ea;color:#2a2418;border-radius:14px;padding:12px 14px 14px;box-shadow:0 14px 40px #000b;max-width:min(360px,calc(100vw - 24px));font-family:"Nunito Sans",Karla,system-ui,sans-serif;animation:hallin .35s cubic-bezier(.2,1.3,.4,1);overflow:hidden;border:2px solid #1d8f5a}
.hall-invite .hall-acts{margin-top:8px}
.hall-invite .hall-bar{position:absolute;left:0;bottom:0;height:4px;background:#1d8f5a;width:100%;animation:hallt 30s linear forwards}
@keyframes hallt{to{width:0}}
@keyframes hallin{from{transform:translateY(30px);opacity:0}}
.hall-toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-weight:700;font-family:system-ui,sans-serif}
#hall-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 0}
.hall-pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 13px;border:1px solid rgba(255,255,255,.25);background:rgba(29,143,90,.25);color:#eef3ea;font-weight:700;font-size:14px;line-height:1;font-family:inherit;cursor:pointer}
.hall-pill span{color:#d8b25a}
.hall-sub{font-size:14px;color:#a9c2b3}.hall-sub .hall-link{color:#eef3ea}
.hall-dot{width:9px;height:9px;border-radius:50%;background:#7dffb5;box-shadow:0 0 0 2px #fff4;animation:hallp 1.8s infinite}.hall-dot.off{background:#aaa;animation:none}
@keyframes hallp{50%{box-shadow:0 0 0 5px #7dffb500}}

/* salle en ligne */
#netBtn{display:inline-flex;align-items:center;gap:6px}
#netBtn.net-on{background:#1d8f5a;border-color:#1d8f5a;color:#fff}
.net-dot{width:9px;height:9px;border-radius:50%;background:#7dffb5;box-shadow:0 0 0 2px #fff6;animation:netp 1.8s infinite}
.net-dot.off{background:#ffb347;animation:none}
@keyframes netp{50%{box-shadow:0 0 0 5px #7dffb500}}
.hall-box .net-in,.mbox .net-in{font-family:inherit;font-weight:800;font-size:16px;padding:9px 11px;border-radius:9px;border:1px solid #c9b98f;background:#fff!important;color:#2a2418!important;-webkit-text-fill-color:#2a2418!important;caret-color:#2a2418;width:100%;max-width:280px}
.hall-box .net-in::placeholder,.mbox .net-in::placeholder{color:#a3926e!important;-webkit-text-fill-color:#a3926e!important;font-weight:600}
.hall-box .net-code,.mbox .net-code{letter-spacing:.35em;text-transform:uppercase;font-size:22px;text-align:center;max-width:170px}
.net-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.net-box{border:1px solid #d9caa4;border-radius:12px;padding:10px 12px;background:#f6efdc;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.net-box h4{margin:0!important}.net-box p{margin:0;font-size:14px}
.net-note{font-size:13.5px;color:#6b5d40}
.net-code-big{display:flex;gap:8px;justify-content:center;margin:10px 0}
.net-code-big b{font-family:var(--title,Georgia,serif);font-size:40px;width:58px;height:66px;display:grid;place-items:center;border-radius:12px;background:#2a2418;color:#fff;box-shadow:0 6px 0 #0003}
.net-share{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.net-list{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:5px}
.net-list li{display:flex;align-items:center;gap:8px;font-weight:800;background:#f6efdc;border-radius:10px;padding:6px 9px;flex-wrap:wrap}
.net-list li small{font-weight:600;color:#6b5d40}.net-list li.ai{opacity:.8}
.net-av{width:26px;height:26px;border-radius:50%;background:#2a2418;color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.net-ok{color:#1d7a46;font-weight:800}.net-ko{color:#b0412e;font-weight:800}
.net-wait{display:flex;align-items:center;gap:10px;font-weight:700}
.net-spin{width:18px;height:18px;border-radius:50%;border:3px solid #c9b98f;border-top-color:#2a2418;animation:netr 1s linear infinite;flex:none}
@keyframes netr{to{transform:rotate(360deg)}}
.net-rules{margin-top:6px}
@media (max-width:560px){.net-two{grid-template-columns:1fr}.net-code-big b{font-size:32px;width:50px;height:58px}}
.net-me{background:#f0e6cf;border-radius:10px;padding:8px 10px;margin:6px 0}
.net-link{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;cursor:pointer}
.net-chk{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;margin:6px 0}.net-chk input{width:18px;height:18px}
.net-list li .net-r{margin-left:auto}
/* contrôles dans la boîte du hall (indépendants du jeu) */
.hall-box .btn{background:#ece3cf;color:#2a2418;border:1px solid #c9b98f;border-radius:9px;padding:8px 12px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;line-height:1.1}
.hall-box .btn.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}.hall-box .btn:disabled{opacity:.45;cursor:default}
.hall-box .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.hall-box .seg{display:inline-flex;border:1px solid #c9b98f;border-radius:9px;overflow:hidden;flex-wrap:wrap;margin:2px 0}
.hall-box .seg button{border:0;background:#f6efdc;padding:7px 11px;font-weight:700;color:#2a2418;font-size:13.5px;font-family:inherit;cursor:pointer}
.hall-box .seg button.on{background:#2a2418;color:#fff}
.hall-box .opt{display:flex;align-items:flex-start;gap:8px;margin:6px 0;line-height:1.35}.hall-box .opt input{width:20px;height:20px;flex:none}
.hall-box label{color:#2a2418}
.net-fab{position:fixed;left:10px;bottom:10px;z-index:45;border-radius:999px!important;padding:8px 13px!important;background:#1b1b1f!important;color:#fff!important;border:1px solid #fff4!important;font-weight:800;box-shadow:0 6px 18px #0008;font-family:system-ui,sans-serif}
#netBtn .net-dot{display:inline-block;margin-right:5px;vertical-align:1px}

body{background:radial-gradient(ellipse at 50% -10%,#1f5761 0%,#0f2b33 55%,#0a1c22 100%) fixed,#0a1c22}
.qs{display:flex;flex-direction:column;gap:10px;padding:10px max(10px,env(safe-area-inset-right,0px)) 120px max(10px,env(safe-area-inset-left,0px));max-width:1100px;margin:0 auto;--cw:clamp(46px,6.2vw,64px)}
.qs-top{display:flex;align-items:center;justify-content:center;gap:clamp(14px,4vw,40px);padding:10px;position:relative}
.qs-top::before{content:"";position:absolute;inset:0 6%;background:repeating-linear-gradient(90deg,#ff5d7322 0 30px,#fff7ea10 30px 60px);border-radius:0 0 50% 50%/0 0 30px 30px;pointer-events:none}
.qs-pile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:1}
.qs-pile small{font-size:12px;font-weight:800;color:#bfe9e9;background:#0a1c22cc;padding:2px 9px;border-radius:10px}
.qs-deck .qc{box-shadow:3px 3px 0 #0a1c22,6px 6px 0 #1aa6a6,7px 7px 0 #0a1c22,0 10px 20px #0008}
.qs-info{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#cdeeee;max-width:240px;z-index:1}
.qs-info b{color:var(--gold);font-size:15px}
/* cartes */
.qc{width:var(--cw);height:calc(var(--cw)*1.42);border-radius:calc(var(--cw)*.13);background:var(--cream);border:2px solid #fff;box-shadow:0 3px 7px #0007;position:relative;display:grid;place-items:center;flex:none;overflow:hidden;color:var(--ink)}
.qc .v{font-family:var(--title);font-size:calc(var(--cw)*.55);line-height:1;color:var(--c);text-shadow:2px 2px 0 #0002}
.qc .ci{position:absolute;left:7%;top:4%;font-family:var(--title);font-size:calc(var(--cw)*.2);color:var(--c)}
.qc::after{content:"";position:absolute;inset:8%;border-radius:calc(var(--cw)*.09);border:1.5px dashed color-mix(in srgb,var(--c) 45%,transparent);pointer-events:none}
.qc.m{background:linear-gradient(160deg,#ffe28a,#ffc23d);--c:#7a4b00}
.qc.a{--c:#fff}.qc.a.freeze{background:linear-gradient(160deg,#bfe9ff,#3f9fd8)}.qc.a.flip3{background:linear-gradient(160deg,#ffb1bd,#ff5d73)}.qc.a.second{background:linear-gradient(160deg,#a8f0c6,#22a96b)}
.qc.a svg{width:62%;height:auto;filter:drop-shadow(0 2px 0 #0003)}
.qc .lbl{position:absolute;bottom:5%;left:0;right:0;text-align:center;font-weight:900;font-size:calc(var(--cw)*.14);color:#fff;text-shadow:0 1px 0 #0005}
.qc.back{background:repeating-linear-gradient(45deg,#1aa6a6 0 8px,#168f8f 8px 16px);border-color:#fff7ea}
.qc.back::after{border-color:#fff7ea88}
.qc.back .v{color:#fff7ea;font-size:calc(var(--cw)*.42)}
.qc.dup{animation:dup .5s 2}
@keyframes dup{50%{transform:rotate(-8deg) scale(1.1);box-shadow:0 0 0 4px var(--rose)}}
.qc.in{animation:flipin .45s cubic-bezier(.3,1.3,.5,1)}
@keyframes flipin{0%{transform:perspective(400px) rotateY(90deg) translateY(-20px)}100%{transform:none}}
/* pistes des joueurs */
.lanes{display:flex;flex-direction:column;gap:8px}
.lane{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;align-items:center;background:#ffffff0b;border:1px solid #ffffff1c;border-radius:16px;padding:8px 10px;position:relative;transition:box-shadow .3s,background .3s}
.lane.on{box-shadow:0 0 0 3px var(--gold),0 0 24px #ffc23d55;background:#ffffff14}
.lane.bust{background:#ff5d7318}.lane.bust .cards{filter:grayscale(.7) brightness(.7)}
.lane.frozen{background:linear-gradient(90deg,#8fd8ff22,#8fd8ff08)}
.lane.stay{background:#22a96b14}
.lane.tgt{cursor:pointer;box-shadow:0 0 0 3px var(--ice);animation:tg 1s infinite}
@keyframes tg{50%{box-shadow:0 0 0 6px #8fd8ff66}}
.lane.shake{animation:shake .5s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.who2{display:flex;align-items:center;gap:8px;min-width:0}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--title);font-size:15px;color:#fff;flex:none}
.who2 .nm2{font-weight:900;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who2 small{display:block;font-size:12px;color:#bfe9e9;font-variant-numeric:tabular-nums}
.chip2{display:inline-block;font-size:11px;font-weight:900;border-radius:10px;padding:1px 7px;margin-top:2px;background:#ffffff1c}
.chip2.bust{background:var(--rose)}.chip2.stay{background:#22a96b}.chip2.frozen{background:#3f9fd8}.chip2.f7{background:var(--gold);color:#3a2500}
.cards{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-height:calc(var(--cw)*1.42)}
.cards .sep{width:8px}
.rp{margin-left:auto;font-family:var(--title);font-size:22px;color:var(--gold);padding-left:8px;font-variant-numeric:tabular-nums}
.bar7{display:flex;gap:3px;margin-top:4px}.bar7 i{width:12px;height:6px;border-radius:3px;background:#ffffff22}.bar7 i.on{background:var(--gold)}
/* barre d'action */
.act{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(#0f2b33f2,#0a1c22);border-top:1px solid #ffffff22;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px #0009}
.act .in2{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.act .msg2{flex:1;min-width:180px;font-size:14px;color:#cdeeee}
.act .msg2 b{color:#fff}
.btn.big{font-size:17px;padding:11px 18px;border-radius:12px}
.btn.hit{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.stay2{background:#22a96b;border-color:#22a96b;color:#fff}

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SVGNS='http://www.w3.org/2000/svg';
function sel(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,REDUCED?Math.min(ms,30):ms));
function openModal(h,onclick){ $('#mbox').innerHTML=h; $('#mbox').onclick=onclick||null; $('#modal').hidden=false; }
function paintModal(h){ $('#mbox').innerHTML=h; $('#modal').hidden=false; }
function helpTabs(title,tabs){ let k=0; const draw=()=>paintModal('<h2>'+title+'</h2>'+(tabs.length>1?'<div class="tabs">'+tabs.map((t,i)=>'<button class="'+(i===k?'on':'')+'" data-ht="'+i+'">'+t[0]+'</button>').join('')+'</div>':'')+'<div class="hbody">'+tabs[k][1]+'</div><div class="acts"><button class="btn pri" data-c="close">Compris</button></div>'); draw(); $('#mbox').onclick=e=>{ const b=e.target.closest('[data-ht]'); if(b){ k=+b.dataset.ht; draw(); $('#mbox').scrollTop=0; } }; }
function closeModal(){ $('#modal').hidden=true; $('#mbox').onclick=null; window.COVER_HIDDEN=null; }
function toast(s){ const t=document.createElement('div'); t.className='toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2700); }
function banner(s,sub,col){ const b=document.createElement('div'); b.className='bannerx'; b.innerHTML=`<div style="${col?'--bc:'+col:''}">${esc(s)}${sub?`<small>${esc(sub)}</small>`:''}</div>`; document.body.appendChild(b); setTimeout(()=>b.remove(),2400); }
function confetti(cols){ if(REDUCED) return; cols=cols||['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#fff']; for(let i=0;i<80;i++){ const c=document.createElement('div'); c.style.cssText=`position:fixed;top:-12px;left:${Math.random()*100}vw;width:8px;height:12px;background:${cols[i%cols.length]};z-index:90;pointer-events:none;border-radius:2px`; document.body.appendChild(c);
  c.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*220}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`}],{duration:2200+Math.random()*1800,delay:Math.random()*700,easing:'ease-in'}).finished.then(()=>c.remove()); } }
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
/* sons */
let MUTED=!!load('salle-mute'), AC=null, NOISE=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(AC.state==='suspended') AC.resume().catch(()=>{}); return AC; }
function tn(a,t,f,d,type,v,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function nz(a,t,d,v,type,f){ if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;} const s=a.createBufferSource();s.buffer=NOISE;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02); }
function sfx(n){ if(MUTED) return; const a=ac(); if(!a||a.state!=='running') return; const t=a.currentTime+.01;
  switch(n){
    case 'click': tn(a,t,900,.06,'triangle',.06); break;
    case 'move': nz(a,t,.08,.25,'bandpass',900); tn(a,t,220,.08,'sine',.08); break;
    case 'capture': nz(a,t,.12,.35,'bandpass',1400); tn(a,t,520,.12,'triangle',.1,260); break;
    case 'card': nz(a,t,.1,.22,'bandpass',2800); break;
    case 'flip': nz(a,t,.06,.25,'highpass',3000); tn(a,t,1200,.05,'triangle',.04); break;
    case 'dice': for(let k=0;k<6;k++) nz(a,t+k*.07+Math.random()*.03,.05,.3,'bandpass',1800+Math.random()*1200); break;
    case 'ding': tn(a,t,1320,.5,'sine',.1); tn(a,t+.07,1760,.4,'sine',.06); break;
    case 'error': tn(a,t,220,.25,'square',.05,160); break;
    case 'win': [523,659,784,1046].forEach((f,k)=>tn(a,t+k*.12,f,.4,'triangle',.11)); break;
    case 'lose': [392,330,262].forEach((f,k)=>tn(a,t+k*.16,f,.45,'triangle',.1)); break;
    case 'splash': nz(a,t,.5,.3,'lowpass',800); break;
    case 'boom': nz(a,t,.7,.6,'lowpass',300); tn(a,t,90,.6,'sawtooth',.15,40); break;
    case 'pop': tn(a,t,600,.08,'sine',.1,900); break;
  } }
function updSnd(){ const b=$('#sndBtn'); if(b) b.textContent=MUTED?'Son : non':'Son : oui'; }
document.addEventListener('click',e=>{
  if(!MUTED) ac();
  if(e.target.id==='modal'&&window.MODAL_CLOSABLE!==false){ const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; return; }
  const t=e.target.closest('[data-c]'); if(!t) return;
  switch(t.dataset.c){
    case 'sound': MUTED=!MUTED; store('salle-mute',MUTED); updSnd(); break;
    case 'help': GAME.help(); break;
    case 'new': { const cv=$('#cover'); window.MODAL_CLOSABLE=true; GAME.menu(); if(cv&&!cv.hidden){ cv.hidden=true; window.COVER_HIDDEN=cv; } break; }
    case 'close': { const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; break; }
  }
});
addEventListener('DOMContentLoaded',updSnd);


/* ===== Hall de la Salle de jeux : joueurs connectés, pseudos uniques, tables ouvertes, invitations (Supabase Realtime, sans base) ===== */
const HALL=(()=>{
 const SB_URL='https://evepcodcppxpufbkuflq.supabase.co', SB_KEY='sb_publishable_iUC6966SeFt_05Iac1wGQw_yDo9zl7y';
 const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
 const SITE='https://mushu1994.github.io/duel-des-ages/';
 const GAMES={"derniere-carte":"Dernière carte","quitte-ou-sept":"Quitte ou Sept","joyaux-renaissance":"Joyaux de la Renaissance","sept-merveilles":"Sept Merveilles","echecs":"Échecs","quatre-en-ligne":"Quatre en ligne","reversi":"Reversi","dames":"Dames","bataille-navale":"Bataille navale","code-secret":"Code Secret","bataille":"La Bataille","petits-chevaux":"Petits Chevaux","dominos":"Dominos","tetes-de-boeuf":"Têtes de Bœuf","plus-bas":"Plus Bas","petit-bac":"Petit Bac","poker":"Poker","president":"Président","tarot":"Tarot"};
 const q=s=>document.querySelector(s), es=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const ld=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, sv=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
 const note=s=>{ if(typeof toast==='function') return toast(s); const t=document.createElement('div'); t.className='hall-toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); };
 const H={note,ready:false,ok:null,pseudo:ld('net-name')||'',peers:{},me:{},listeners:[],page:'',title:''};
 let cid=ld('net-cid'); if(!cid){ cid=Math.random().toString(36).slice(2,10); sv('net-cid',cid); } H.cid=cid;
 const key=p=>String(p||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[^a-z0-9]/g,'');
 H.key=key;
 let client=null, ch=null, libP=null, syncedP=null, syncRes=null, at=ld('net-at')||Date.now();
 function lib(){ if(window.supabase) return Promise.resolve(); if(libP) return libP; libP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=LIB; s.onload=res; s.onerror=()=>{ libP=null; rej(new Error('lib')); }; document.head.appendChild(s); }); return libP; }
 H.client=async()=>{ await lib(); if(!client) client=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}}); return client; };
 /* ---------- connexion au hall ---------- */
 H.connect=async()=>{ if(ch) return syncedP; syncedP=new Promise(r=>syncRes=r);
   try{ await H.client(); }catch(e){ H.ok=false; paint(); return syncedP; }
   ch=client.channel('salle:hall',{config:{broadcast:{self:false},presence:{key:H.cid}}});
   ch.on('presence',{event:'sync'},onSync);
   ch.on('broadcast',{event:'inv'},({payload:p})=>{ if(p.to===H.cid) invited(p); });
   ch.on('broadcast',{event:'invr'},({payload:p})=>{ if(p.to===H.cid) note(p.ok?`${p.fromP} arrive à ta table`:`${p.fromP} ne peut pas jouer maintenant`); });
   const to=setTimeout(()=>{ if(H.ok==null){ H.ok=false; paint(); syncRes(); } },9000);
   ch.subscribe(async st=>{ if(st==='SUBSCRIBED'){ clearTimeout(to); H.ok=true; await track(); setTimeout(()=>syncRes(),900); paint(); } else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ if(H.ok==null){ H.ok=false; paint(); syncRes(); } } });
   return syncedP; };
 function payload(){ return Object.assign({p:H.pseudo,k:key(H.pseudo),at,g:H.page,gt:H.title},H.me); }
 async function track(){ if(!ch) return; try{ await ch.track(payload()); }catch(e){} }
 function onSync(){ const st=ch.presenceState(), peers={}; for(const k in st){ const m=st[k][st[k].length-1]; if(m) peers[k]=m; } H.peers=peers;
   // doublon de pseudo : le plus récent cède la place
   if(H.pseudo){ const mk=key(H.pseudo); for(const k in peers){ if(k===H.cid) continue; const o=peers[k]; if(o.p&&o.k===mk&&(o.at<at||(o.at===at&&k<H.cid))){ const old=H.pseudo; H.pseudo=''; sv('net-name',null); track(); note(`Le pseudo « ${old} » est déjà utilisé par quelqu’un d’autre`); setTimeout(()=>H.askPseudo(),300); break; } } }
   paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); }
 H.onChange=f=>H.listeners.push(f);
 H.set=o=>{ Object.assign(H.me,o); track(); };
 H.where=(page,title)=>{ H.page=page; H.title=title; track(); };
 H.list=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&m.p).map(([k,m])=>Object.assign({cid:k},m)).sort((a,b)=>a.p.localeCompare(b.p));
 H.count=()=>Object.keys(H.peers).length;
 H.tables=g=>Object.entries(H.peers).map(([k,m])=>m.p&&m.r&&m.r.host&&m.r.open&&!m.r.started&&m.r.n<m.r.max&&(!g||m.r.g===g)?Object.assign({cid:k,p:m.p},m.r):null).filter(Boolean);
 H.free=p=>{ const k=key(p); return !Object.entries(H.peers).some(([c,m])=>c!==H.cid&&m.p&&m.k===k); };
 H.anon=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&!m.p).length;
 /* ---------- pseudo ---------- */
 H.setPseudo=async p=>{ p=String(p||'').replace(/\s+/g,' ').trim(); if(p.length<2||p.length>16||key(p).length<2) return 'Entre 2 et 16 caractères (lettres ou chiffres).';
   if(/^(ordi|ordinateur|bot|ia|robot)\d*$/i.test(key(p))) return 'Ce pseudo est réservé.';
   await H.connect(); if(!H.ok) return 'Connexion impossible pour le moment.';
   if(!H.free(p)) return `« ${p} » est déjà utilisé par quelqu’un en ligne.`;
   H.pseudo=p; at=Date.now(); sv('net-at',at); sv('net-name',p); await track(); paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); return null; };
 H.ensure=()=>H.pseudo?Promise.resolve(H.pseudo):new Promise(res=>H.askPseudo(res));
 H.askPseudo=(cb)=>{ openBox(`<h2>Ton pseudo</h2><p>Il s’affiche pour les autres joueurs connectés. Deux personnes en ligne ne peuvent pas avoir le même.</p>
   <input class="hall-in" id="hallPseudo" maxlength="16" placeholder="Ex. : Mushu" value="${es(H.pseudo||ld('net-last')||'')}"><p class="hall-err" id="hallErr"></p>
   <div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button><button class="hall-btn pri" data-hl="ok">Valider</button></div>`,async e=>{ const b=e.target.closest('[data-hl]'); if(!b) return; if(b.dataset.hl==='close'){ closeBox(); return; }
     const v=q('#hallPseudo').value; b.disabled=true; const err=await H.setPseudo(v); b.disabled=false; if(err){ q('#hallErr').textContent=err; return; } sv('net-last',H.pseudo); closeBox(); if(cb) cb(H.pseudo); });
   const i=q('#hallPseudo'); if(i){ i.focus(); i.onkeydown=e=>{ if(e.key==='Enter') q('[data-hl=ok]').click(); }; } };
 /* ---------- invitations ---------- */
 H.invite=(to,room)=>{ if(!ch) return; ch.send({type:'broadcast',event:'inv',payload:{to,from:H.cid,fromP:H.pseudo,g:room.g,gt:room.gt,code:room.code}}); note(`Invitation envoyée à ${(H.peers[to]||{}).p||'ce joueur'}`); };
 function invited(p){ const id='inv-'+p.code; if(q('#'+id)) return; if(typeof sfx==='function') sfx('ding');
   const d=document.createElement('div'); d.className='hall-invite'; d.id=id;
   d.innerHTML=`<b>${es(p.fromP)}</b> t’invite à jouer à <b>${es(p.gt)}</b><div class="hall-acts"><button class="hall-btn" data-i="no">Pas maintenant</button><button class="hall-btn pri" data-i="ok">Rejoindre</button></div><i class="hall-bar"></i>`;
   document.body.appendChild(d); const t=setTimeout(()=>d.remove(),30000);
   d.onclick=e=>{ const b=e.target.closest('[data-i]'); if(!b) return; clearTimeout(t); d.remove(); const ok=b.dataset.i==='ok';
     if(ch) ch.send({type:'broadcast',event:'invr',payload:{to:p.from,fromP:H.pseudo,ok}}); if(ok) H.goTable(p.g,p.code); }; }
 H.goTable=(g,code)=>{ if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined'){ NET.joinCode(code); return; } location.href=g+'.html?salle='+code; };
 H.inviteFlow=to=>{ const P=H.peers[to]; if(!P) return; const r=H.me.r;
   if(r&&r.host&&!r.started){ H.invite(to,r); return; }
   const opts=Object.entries(GAMES).sort((a,b)=>a[1].localeCompare(b[1],'fr'));
   openBox(`<h2>Inviter ${es(P.p)}</h2><p>Choisis le jeu : une table s’ouvre et l’invitation part tout de suite.</p><div class="hall-games">${opts.map(([g,t])=>`<button class="hall-btn" data-g="${g}">${es(t)}</button>`).join('')}</div><div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button></div>`,e=>{
     const b=e.target.closest('[data-g],[data-hl]'); if(!b) return; if(b.dataset.hl){ closeBox(); return; } const g=b.dataset.g; sessionStorage.setItem('hall-invite',JSON.stringify({to,g})); closeBox();
     if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined') NET.createFor(); else location.href=g+'.html?creer=1'; }); };
 H.pendingInvite=g=>{ try{ const v=JSON.parse(sessionStorage.getItem('hall-invite')||'null'); if(v&&v.g===g){ sessionStorage.removeItem('hall-invite'); return v.to; } }catch(e){} return null; };
 /* ---------- interface ---------- */
 function where(m){ if(m.r&&m.r.started) return `joue à ${es(m.r.gt)}`; if(m.r&&m.r.host) return `ouvre une table de ${es(m.r.gt)}`; if(m.r) return `attend à une table de ${es(m.r.gt)}`; return m.gt?`regarde ${es(m.gt)}`:'sur le portail'; }
 function busy(m){ return m.r&&m.r.started; }
 H.panelHTML=(g)=>{ if(H.ok===false) return `<p class="hall-note">Le salon en ligne n’est pas joignable d’ici.${/github\.io$/.test(location.hostname)?' Vérifie ta connexion.':` Ouvre la salle sur <a href="${SITE}" target="_blank" rel="noopener">le site</a>.`}</p>`;
   if(H.ok==null) return '<p class="hall-note"><span class="hall-spin"></span>Connexion au salon…</p>';
   const tabs=H.tables(g), ppl=H.list();
   return `<div class="hall-me">${H.pseudo?`Ton pseudo : <b>${es(H.pseudo)}</b> <button class="hall-link" data-hl="pseudo">changer</button>`:`<button class="hall-btn pri" data-hl="pseudo">Choisir un pseudo</button> <span class="hall-note">pour apparaître et être invité</span>`}</div>
    <h4>Tables ouvertes${g?'':' (tous les jeux)'}</h4>${tabs.length?`<ul class="hall-list">${tabs.map(t=>`<li><span class="hall-av">${es(t.p[0])}</span><span class="hall-tx"><b>${es(t.gt)}</b><small>table de ${es(t.p)} · ${t.n}/${t.max} joueurs</small></span>${t.cid===H.cid?'<small>ta table</small>':`<button class="hall-btn pri" data-join="${es(t.g)}:${es(t.code)}">Rejoindre</button>`}</li>`).join('')}</ul>`:`<p class="hall-note">Aucune table ouverte${g?' pour ce jeu':''} pour l’instant.</p>`}
    <h4>Joueurs en ligne (${ppl.length})</h4>${H.anon()?`<p class="hall-note">+ ${H.anon()} visiteur${H.anon()>1?'s':''} sans pseudo</p>`:''}${ppl.length?`<ul class="hall-list">${ppl.map(m=>`<li><span class="hall-av">${es(m.p[0])}</span><span class="hall-tx"><b>${es(m.p)}</b><small>${where(m)}</small></span>${H.pseudo&&!busy(m)?`<button class="hall-btn" data-inv="${m.cid}">Inviter</button>`:''}</li>`).join('')}</ul>`:'<p class="hall-note">Personne d’autre pour le moment. Partage le lien du site à tes amis !</p>'}`; };
 H.panelClick=e=>{ const b=e.target.closest('[data-hl],[data-join],[data-inv]'); if(!b) return false;
   if(b.dataset.hl==='pseudo'){ H.askPseudo(); return true; }
   if(b.dataset.join){ const [g,c]=b.dataset.join.split(':'); closeBox(); H.ensure().then(()=>H.goTable(g,c)); return true; }
   if(b.dataset.inv){ H.inviteFlow(b.dataset.inv); return true; } return false; };
 let boxCb=null;
 function openBox(h,cb,locked){ let m=q('#hall-modal'); if(!m){ m=document.createElement('div'); m.id='hall-modal'; m.innerHTML='<div class="hall-box" id="hall-box"></div>'; document.body.appendChild(m); m.addEventListener('click',e=>{ if(e.target===m){ if(!m.dataset.locked) closeBox(); return; } if(boxCb) boxCb(e); }); }
   q('#hall-box').innerHTML=h; boxCb=cb; m.dataset.locked=locked?'1':''; m.hidden=false; }
 function closeBox(){ const m=q('#hall-modal'); if(m) m.hidden=true; boxCb=null; if(H.onBoxClose){ const f=H.onBoxClose; H.onBoxClose=null; f(); } }
 H.openBox=openBox; H.closeBox=closeBox;
 H.openPanel=g=>{ const draw=()=>openBox(`<h2>Le salon</h2>${H.panelHTML(g)}<div class="hall-acts"><button class="hall-btn" data-hl="close">Fermer</button></div>`,e=>{ const b=e.target.closest('[data-hl=close]'); if(b){ closeBox(); return; } H.panelClick(e); });
   draw(); H.redraw=()=>{ const m=q('#hall-modal'); if(m&&!m.hidden&&q('#hall-box h2')&&q('#hall-box h2').textContent==='Le salon') draw(); }; };
 function paint(){ const bar=q('#hall-bar'); if(bar){ const n=H.count();

     bar.onclick=e=>{ const b=e.target.closest('[data-hl]'); if(!b) return; if(b.dataset.hl==='open') H.openPanel(''); else H.askPseudo(); }; }

addEventListener('load',()=>setTimeout(()=>{ if(!window.NETGAME) HALL.where('',''); HALL.connect(); },0));

/* ===== Salle en ligne : tables (Supabase Realtime, l'hôte fait tourner la partie), sur le hall commun =====
   Le jeu déclare window.NETGAME = { id, title, min, max, rules():html, rulesClick(e):bool,
     start(list), state():G, receive(msg):Promise, act(seat,fn,args):bool, busy():bool, resume(), leave() } */
const NET=(()=>{
 const $q=s=>document.querySelector(s), es=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const nt=s=>HALL.note(s), snd=n=>{ try{ if(typeof sfx==='function') snd(n); }catch(e){} }, sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const ld=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, svs=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
 let BOXCB=null; const box=(h,locked)=>{ BOXCB=null; HALL.openBox(h,e=>{ if(e.target.closest('[data-hl=close]')){ HALL.closeBox(); return; } (BOXCB||onClick)(e); },locked); };
 const PL=G=>G?(G.players||G.P||[]):[];
 const gameClose=()=>{ try{ if(typeof closeModal==='function') closeModal(true); }catch(e){} };
 const SITE='https://mushu1994.github.io/duel-des-ages/';
 const LET='ABCDEFGHJKLMNPQRSTUVWXYZ';
 const BOTS=['Ada','Hal','Pixel','Nova','Atlas','Écho','Zéphyr','Orbit','Volt','Lumen','Quartz','Sirius'];
 const N={on:false,host:false,guest:false,started:false,code:null,name:'',seat:null,peers:{},v:0,hs:null,lastV:-1,lastHs:null,q:[],aq:[],ai:{n:0,level:'normal'},ui:null,known:new Set(),waitHost:false,open:(()=>{ try{ return localStorage.getItem('net-open')!=='false'; }catch(e){ return true; } })(),invited:new Set()};
 N.cid=HALL.cid;
 let client=null, ch=null;
 const NG=()=>window.NETGAME;
 function newCode(){ let c=''; for(let i=0;i<4;i++) c+=LET[Math.floor(Math.random()*LET.length)]; return c; }
 const link=()=>{ const base=/github\.io$/.test(location.hostname)?location.origin+location.pathname:SITE+NG().id+'.html'; return base+'?salle='+N.code; };
 const sess=()=>ld('net-sess'), setSess=v=>svs('net-sess',v);
 const isGh=()=>/github\.io$/.test(location.hostname);
 /* ---------- connexion à une table ---------- */
 async function connect(code,asHost){ client=await HALL.client();
   if(ch){ try{ await client.removeChannel(ch); }catch(e){} ch=null; }
   N.code=code; N.host=asHost; N.guest=!asHost; N.on=true; N.peers={}; N.known=new Set(); N.hs=Math.random().toString(36).slice(2,8); N.name=HALL.pseudo;
   ch=client.channel('salle:'+NG().id+':'+code,{config:{broadcast:{self:false},presence:{key:N.cid}}});
   ch.on('broadcast',{event:'st'},({payload})=>{ if(N.guest) enqueue(payload); });
   ch.on('broadcast',{event:'act'},({payload})=>{ if(N.host){ N.aq.push(payload); drain(); } });
   ch.on('broadcast',{event:'hello'},()=>{ if(N.host){ if(N.started) pushFull(); else pushLobby(); } });
   ch.on('broadcast',{event:'lobby'},({payload})=>{ if(N.guest&&!N.started){ N.lobby=payload; if(N.ui==='lobby') lobbyUI(); } });
   ch.on('broadcast',{event:'close'},()=>{ if(N.guest){ nt('L’hôte a fermé la table'); leave(true); } });
   ch.on('presence',{event:'sync'},onSync);
   return new Promise((res,rej)=>{ let done=false; const to=setTimeout(()=>{ if(!done){ done=true; rej(new Error('timeout')); } },9000);
     ch.subscribe(async st=>{ if(st==='SUBSCRIBED'){ await ch.track({name:N.name,host:asHost,at:Date.now()}); if(!done){ done=true; clearTimeout(to); res(); } if(N.guest) send('hello',{}); }
       else if((st==='CHANNEL_ERROR'||st==='TIMED_OUT')&&!done){ done=true; clearTimeout(to); rej(new Error(st)); } }); }); }
 function send(ev,payload){ if(ch) ch.send({type:'broadcast',event:ev,payload}).catch(()=>{}); }
 function onSync(){ const st=ch.presenceState(); const peers={}; for(const k in st){ const m=st[k][st[k].length-1]; peers[k]=m; } const before=N.peers; N.peers=peers;
   const names=k=>(peers[k]||before[k]||{}).name||'Un joueur';
   for(const k in peers) if(!before[k]&&k!==N.cid){ if(N.known.has(k)) nt(`${names(k)} est de retour`); else if(N.host&&!N.started){ nt(`${names(k)} rejoint la table`); snd('pop'); } }
   for(const k in before) if(!peers[k]&&k!==N.cid) nt(`${names(k)} a quitté la table`);
   Object.keys(peers).forEach(k=>N.known.add(k));
   if(N.guest){ const hostHere=Object.values(peers).some(m=>m.host); N.waitHost=!hostHere&&N.started; }
   if(N.host){ if(N.started){ const G=NG().state(); let ch2=false; if(G) PL(G).forEach(P=>{ if(P.cid&&P.away&&peers[P.cid]){ P.ai=false; P.away=false; ch2=true; } }); if(ch2) NG().resume(); pushFull(); } else pushLobby(); }
   hallRoom(); badge(); if(N.ui==='lobby') lobbyUI(); else if(N.ui==='panel') panelUI(); }
 function hallRoom(){ if(!N.on){ HALL.set({r:null}); return; } const n=N.host&&!N.started?lobbyOrder().length+N.ai.n:Object.keys(N.peers).length;
   HALL.set({r:{g:NG().id,gt:NG().title,code:N.code,host:N.host,open:N.host?N.open:false,started:N.started,n,max:NG().max}}); }
 /* ---------- hôte ---------- */
 function pushLobby(){ if(!N.host||N.started) return; send('lobby',{order:lobbyOrder().map(k=>({cid:k,name:N.peers[k].name})),ai:N.ai}); }
 function lobbyOrder(){ return Object.keys(N.peers).sort((a,b)=>(N.peers[b].host-N.peers[a].host)||(N.peers[a].at-N.peers[b].at)); }
 let pushT=null;
 function push(ev,kind){ if(!N.host||!N.started) return; if(!ev&&!kind){ if(!pushT) pushT=setTimeout(()=>{ pushT=null; pushNow(null,null); },40); return; } if(pushT){ clearTimeout(pushT); pushT=null; } pushNow(ev,kind); }
 function pushNow(ev,kind){ if(!N.host||!N.started) return; N.v++; const G=NG().state(); if(!G) return; const p={hs:N.hs,v:N.v,G,ev:ev||null,kind:kind||null}; N.last=p; send('st',p); }
 function pushFull(){ if(!N.host||!N.started) return; push(null,'full'); }
 function drain(){ if(!N.host||!N.started) return; while(N.aq.length&&!NG().busy()){ const m=N.aq.shift(); const G=NG().state(); const seat=G?PL(G).findIndex(P=>P.cid===m.cid):-1; if(seat<0||PL(G)[seat].ai) continue; NG().act(seat,m.fn,m.args||[]); } }
 /* ---------- invité ---------- */
 function enqueue(p){ if(p.hs!==N.lastHs){ N.lastHs=p.hs; N.lastV=-1; } if(p.v<=N.lastV) return; N.lastV=p.v; N.q.push(p); pump(); }
 async function pump(){ if(N.pumping) return; N.pumping=true;
   while(N.q.length){ let p=N.q.shift(); if(p.kind==='full'||!p.ev){ while(N.q.length&&(N.q[0].kind==='full'||!N.q[0].ev)&&N.q[0].kind!=='lobby'&&N.q[0].kind!=='new') p=N.q.shift(); }
     if(p.kind==='lobby'||!p.G){ N.started=false; N.seat=null; try{ NG().receive({kind:'lobby'}); }catch(e){} hallRoom(); lobbyUI(); continue; }
     const first=!N.started; N.started=true; N.waitHost=false; const s=PL(p.G).findIndex(P=>P.cid===N.cid); N.seat=s>=0?s:null;
     if(first){ HALL.closeBox(); gameClose(); N.ui=null; hallRoom(); if(N.seat==null) nt('Partie déjà commencée : tu regardes'); }
     try{ await NG().receive(Object.assign({},p,{kind:first&&p.kind!=='new'?'new':p.kind})); }catch(e){ console.error(e); } badge(); }
   N.pumping=false; }
 function act(fn,args){ if(!N.guest) return false; if(N.waitHost){ nt('En attente de l’hôte…'); return true; } send('act',{cid:N.cid,fn,args}); snd('click'); return true; }
 /* ---------- interface ---------- */
 function badge(){ const b=$q('#netBtn'); if(!b) return; if(!N.on){ const n=HALL.ok?HALL.count():0; b.innerHTML=`<i class="net-dot ${HALL.ok?'':'off'}"></i>En ligne${n?` · ${n}`:''}`; b.classList.remove('net-on'); return; }
   const n=Object.keys(N.peers).length; b.innerHTML=`<i class="net-dot ${N.waitHost?'off':''}"></i>Table ${N.code} · ${n}`; b.classList.add('net-on'); }
 N.hallChanged=()=>{ badge(); const vis=$q('#hall-modal')&&!$q('#hall-modal').hidden&&$q('#hall-box [data-net]')&&!$q('#hallPseudo'); if(!vis) return; if(N.ui==='start') startUI(); else if(N.ui==='lobby'&&N.host) lobbyUI(); };
 function startUI(prefill){ N.ui='start'; const g=NG(); const tabs=HALL.ok?HALL.tables(g.id):[];
   const off=HALL.ok===false;
   box(`<h2>Jouer en ligne</h2>
    ${off?`<p class="net-note">Le salon en ligne n’est pas joignable d’ici. ${isGh()?'Vérifie ta connexion internet.':`Ouvre le jeu sur le site : <a href="${SITE}${g.id}.html" target="_blank" rel="noopener">${SITE.replace('https://','')}${g.id}.html</a>`}</p>`:''}
    <div class="net-me">${HALL.pseudo?`Ton pseudo : <b>${es(HALL.pseudo)}</b> <button class="net-link" data-net="pseudo">changer</button>`:`<button class="btn pri" data-net="pseudo">Choisir un pseudo</button> <span class="net-note">obligatoire pour jouer en ligne</span>`}</div>
    <h4>Tables ouvertes</h4>${HALL.ok==null?'<p class="net-wait"><span class="net-spin"></span>Connexion…</p>':tabs.length?`<ul class="net-list">${tabs.map(t=>`<li><span class="net-av">${es(t.p[0])}</span>Table de ${es(t.p)} <small>· ${t.n}/${t.max} joueurs</small>${t.cid===N.cid?'':`<button class="btn pri net-r" data-net="jt:${t.code}">Rejoindre</button>`}</li>`).join('')}</ul>`:'<p class="net-note">Aucune table ouverte pour ce jeu. Crée la tienne : elle apparaîtra pour tous les joueurs connectés.</p>'}
    <div class="net-two"><div class="net-box"><h4>Créer une table</h4><label class="net-chk"><input type="checkbox" id="netOpen" ${N.open?'checked':''}> Ouverte à tous les connectés</label><button class="btn pri" data-net="create">Créer une table</button></div>
    <div class="net-box"><h4>Rejoindre avec un code</h4><input type="text" class="net-in net-code" id="netCode" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="CODE" value="${es(prefill||'')}"><button class="btn" data-net="join">Rejoindre</button></div></div>
    <p class="net-note">${HALL.ok?`${HALL.count()} personne${HALL.count()>1?"s":""} sur le site · <button class="net-link" data-net="hall">voir qui est là et inviter</button>`:''}</p>
    <div class="acts"><button class="btn" data-hl="close">Fermer</button></div>`);
   const c=$q('#netCode'); if(c) c.oninput=()=>{ c.value=c.value.toUpperCase().replace(/[^A-Z]/g,''); }; const o=$q('#netOpen'); if(o) o.onchange=()=>{ N.open=o.checked; svs('net-open',N.open); }; }
 function busyUI(msg){ box(`<h2>Jouer en ligne</h2><p class="net-wait"><span class="net-spin"></span>${msg}</p>`); }
 async function create(){ await HALL.ensure(); if(!HALL.pseudo) return; busyUI('Ouverture de la table…');
   try{ for(let t=0;t<4;t++){ const code=newCode(); await connect(code,true); await sleep(700); const other=Object.entries(N.peers).some(([k,m])=>k!==N.cid&&m.host); if(!other) break; } }
   catch(e){ failUI(); return; }
   N.started=false; N.invited=new Set(); setSess({game:NG().id,code:N.code,host:true}); hallRoom(); lobbyUI(); badge();
   const to=HALL.pendingInvite(NG().id); if(to){ HALL.invite(to,{g:NG().id,gt:NG().title,code:N.code}); N.invited.add(to); lobbyUI(); } }
 async function join(code){ code=(code||'').toUpperCase(); if(!/^[A-Z]{4}$/.test(code)){ nt('Le code fait 4 lettres'); return; } await HALL.ensure(); if(!HALL.pseudo) return;
   if(N.on&&N.code===code) { lobbyUI(); return; } if(N.on) await leave(true);
   busyUI('Connexion à la table '+code+'…');
   try{ await connect(code,false); }catch(e){ failUI(); return; }
   N.started=false; setSess({game:NG().id,code,host:false}); await sleep(1200);
   if(!N.started){ const hostHere=Object.values(N.peers).some(m=>m.host); lobbyUI(hostHere?null:'Personne n’a encore ouvert cette table. Vérifie le code ; tu peux attendre ici.'); } hallRoom(); badge(); }
 function failUI(){ N.on=false; box(`<h2>Connexion impossible</h2><p>Le serveur de jeu n’a pas répondu. Vérifie ta connexion internet${isGh()?'':', ou ouvre le jeu directement sur le site'}.</p>${isGh()?'':`<p><a href="${SITE}${NG().id}.html" target="_blank" rel="noopener">Ouvrir ${es(NG().title)} sur le site</a></p>`}<div class="acts"><button class="btn" data-hl="close">Fermer</button><button class="btn pri" data-net="start">Réessayer</button></div>`); badge(); }
 function lobbyUI(note){ N.ui='lobby'; const g=NG();
   const order=N.host?lobbyOrder():((N.lobby&&N.lobby.order)||[]).map(x=>x.cid); const names=N.host?order.map(k=>N.peers[k].name):((N.lobby&&N.lobby.order)||[]).map(x=>x.name);
   const hs=order.length, maxAI=Math.max(0,g.max-hs); if(N.host&&N.ai.n>maxAI) N.ai.n=maxAI; const ai=N.host?N.ai:((N.lobby&&N.lobby.ai)||{n:0,level:'normal'}); const total=hs+ai.n;
   const list=names.map((n,i)=>`<li><span class="net-av">${es((n||'?')[0])}</span>${es(n)}${order[i]===N.cid?' <small>(toi)</small>':''}${i===0?' <small>· hôte</small>':''}</li>`).join('')+Array.from({length:ai.n},(_,i)=>`<li class="ai"><span class="net-av">🤖</span>Ordinateur ${i+1} <small>· ${ai.level}</small></li>`).join('');
   const cand=N.host&&HALL.ok?HALL.list().filter(m=>!N.peers[m.cid]&&!(m.r&&m.r.started)):[];
   box(`<h2>Table ${N.code}</h2>${note?`<p class="net-note">${note}</p>`:''}
    <div class="net-code-big" aria-label="Code de la table">${[...N.code].map(c=>`<b>${c}</b>`).join('')}</div>
    <div class="net-share"><button class="btn" data-net="copy">Copier le lien</button>${navigator.share?'<button class="btn" data-net="share">Partager</button>':''}</div>
    <h4>Joueurs (${total} · de ${g.min} à ${g.max})</h4><ul class="net-list">${list||'<li>…</li>'}</ul>
    ${N.host?`<h4>Inviter des joueurs connectés</h4>${cand.length?`<ul class="net-list">${cand.map(m=>`<li><span class="net-av">${es(m.p[0])}</span>${es(m.p)} <small>· ${m.r?'à une autre table':m.gt?'sur '+es(m.gt):'sur le portail'}</small>${N.invited.has(m.cid)?'<small class="net-r">invité ✓</small>':`<button class="btn net-r" data-net="inv:${m.cid}">Inviter</button>`}</li>`).join('')}</ul>`:'<p class="net-note">Personne d’autre de disponible sur le site pour l’instant. Partage le lien ou le code.</p>'}
     <label class="net-chk"><input type="checkbox" id="netOpen2" ${N.open?'checked':''}> Table visible et ouverte à tous les connectés</label>
     <h4>Ordinateurs en plus</h4><div class="seg">${Array.from({length:maxAI+1},(_,n)=>`<button class="${ai.n===n?'on':''}" data-net="ai:${n}">${n}</button>`).join('')}</div>
     ${ai.n?`<div class="seg" style="margin-left:6px">${['facile','normal','difficile'].map(l=>`<button class="${ai.level===l?'on':''}" data-net="lv:${l}">${l}</button>`).join('')}</div>`:''}
     ${g.rules?`<div class="net-rules">${g.rules()}</div>`:''}
     <div class="acts"><button class="btn" data-net="quit">Fermer la table</button><button class="btn pri" data-net="go" ${total>=g.min&&total<=g.max?'':'disabled'}>${total<g.min?`Encore ${g.min-total} joueur${g.min-total>1?'s':''}`:'Lancer la partie'}</button></div>`
    :`<p class="net-wait"><span class="net-spin"></span>En attente que l’hôte lance la partie…</p><div class="acts"><button class="btn" data-net="quit">Quitter la table</button></div>`}`,true);
   const o=$q('#netOpen2'); if(o) o.onchange=()=>{ N.open=o.checked; svs('net-open',N.open); hallRoom(); }; }
 function panelUI(){ N.ui='panel'; const G=NG().state();
   const rows=(G?PL(G):[]).map((P,i)=>{ const here=P.cid?!!N.peers[P.cid]:false; return `<li><span class="net-av">${P.cid?es((P.name||'?')[0]):'🤖'}</span>${es(P.name)}${P.cid===N.cid?' <small>(toi)</small>':''} <small>· ${P.cid?(P.ai?'remplacé par l’ordinateur':here?'<span class="net-ok">connecté</span>':'<span class="net-ko">absent</span>'):'ordinateur'}</small></li>`; }).join('');
   const away=N.host&&G&&PL(G).some(P=>P.cid&&!P.ai&&!N.peers[P.cid]);
   const watchers=Object.keys(N.peers).filter(k=>!(G&&PL(G).some(P=>P.cid===k))).map(k=>N.peers[k].name);
   box(`<h2>Table ${N.code}</h2><div class="net-share"><button class="btn" data-net="copy">Copier le lien</button>${navigator.share?'<button class="btn" data-net="share">Partager</button>':''}</div>
    <ul class="net-list">${rows}</ul>${watchers.length?`<p class="net-note">Spectateurs : ${watchers.map(esc).join(', ')}</p>`:''}
    ${N.waitHost?'<p class="net-wait"><span class="net-spin"></span>L’hôte s’est déconnecté. La partie reprend dès son retour.</p>':''}
    ${away?'<p class="net-note">Un joueur absent bloque la partie quand c’est son tour. Tu peux confier sa place à l’ordinateur ; il la récupère s’il revient.</p>':''}
    <div class="acts"><button class="btn" data-net="hall">Joueurs en ligne</button>${away?'<button class="btn" data-net="replace">Remplacer les absents</button>':''}${N.host?'<button class="btn" data-net="lobby">Revenir au salon</button>':''}<button class="btn" data-net="quit">${N.host?'Fermer la table':'Quitter la table'}</button><button class="btn pri" data-hl="close">Continuer</button></div>`);
   }
 function onClick(e){ const b=e.target.closest('[data-net]'); if(!b){ if(N.ui==='lobby'&&N.host&&NG().rulesClick&&NG().rulesClick(e)) lobbyUI(); return; } const [k,v]=b.dataset.net.split(':'); snd('click');
   if(k==='create') create(); else if(k==='join') join($q('#netCode').value); else if(k==='jt') join(v);
   else if(k==='pseudo'){ HALL.askPseudo(()=>{ if(N.ui==='start') startUI(); }); }
   else if(k==='hall'){ HALL.openPanel(NG().id); }
   else if(k==='inv'){ HALL.invite(v,{g:NG().id,gt:NG().title,code:N.code}); N.invited.add(v); lobbyUI(); }
   else if(k==='start') startUI(); else if(k==='copy'){ const l=link(); (navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>nt('Lien copié : envoie-le à tes amis'),()=>{ prompt('Lien de la table',l); }); }
   else if(k==='share'){ navigator.share({title:NG().title+' en ligne',text:`Rejoins ma table ${N.code} pour jouer à ${NG().title}`,url:link()}).catch(()=>{}); }
   else if(k==='ai'){ N.ai.n=+v; lobbyUI(); pushLobby(); hallRoom(); } else if(k==='lv'){ N.ai.level=v; lobbyUI(); pushLobby(); }
   else if(k==='go') launch(); else if(k==='quit') leave(); else if(k==='replace') replace();
   else if(k==='lobby'){ N.started=false; N.aq=[]; send('lobby',{order:lobbyOrder().map(k=>({cid:k,name:N.peers[k].name})),ai:N.ai,back:1}); send('st',{hs:N.hs,v:++N.v,G:null,kind:'lobby'}); hallRoom(); lobbyUI(); } }
 function botNames(humans,n){ const taken=new Set(humans.map(h=>HALL.key(h))); return BOTS.filter(b=>!taken.has(HALL.key(b))).slice(0,n); }
 function launch(){ const order=lobbyOrder(); const list=order.map(k=>({name:N.peers[k].name,cid:k})); const bn=botNames(list.map(x=>x.name),N.ai.n); for(let i=0;i<N.ai.n;i++) list.push({ai:true,level:N.ai.level,name:bn[i]});
   HALL.closeBox(); gameClose(); N.ui=null; N.started=true; N.aq=[]; N.seat=0; hallRoom(); NG().start(list); }

/* ---------- animations ---------- */
function fly(html,from,to,ms){ return new Promise(res=>{ if(!from||!to||REDUCED){ res(); return; } const f=document.createElement('div'); f.className='fly'; f.innerHTML=html; f.style.left=from.left+'px'; f.style.top=from.top+'px'; f.style.setProperty('--cw',getComputedStyle($('#tbl')).getPropertyValue('--cw')); document.body.appendChild(f);
  requestAnimationFrame(()=>{ f.style.transform=`translate(${to.left-from.left}px,${to.top-from.top}px) rotate(${Math.random()*16-8}deg)`; }); setTimeout(()=>{ f.remove(); res(); },ms||430); }); }
const R=el=>el?el.getBoundingClientRect():null;
function laneEnd(p){ const l=$('#lane-'+p); if(!l) return null; const c=l.querySelector('.rp'); return R(c||l); }
async function show(ev,my){ for(const e of ev||[]){ if(my!==GEN) return;
  switch(e.t){
   case 'card': await fly(cardHTML(null),R($('#deck')),laneEnd(e.p)); NEWC.add(e.c.id); render(); sfx(e.c.k==='a'?'pop':'flip'); await wait(e.ctx==='deal'?120:260); break;
   case 'bust': { render(); const l=$('#lane-'+e.p); if(l){ l.classList.add('shake'); l.querySelectorAll('.qc').forEach(q=>{ if(q.querySelector('.v')&&q.querySelector('.v').textContent==String(e.v)) q.classList.add('dup'); }); } sfx('boom'); toast(`${G.players[e.p].name} tire un deuxième ${e.v} : éliminé de la manche !`); await wait(1100); break; }
   case 'saved': render(); toast(`La seconde chance sauve ${G.players[e.p].name} du doublon de ${e.v} !`); sfx('ding'); await wait(900); break;
   case 'flip7': render(); banner('SEPT !',`${G.players[e.p].name} : +15 points`,AVC[e.p%8]); sfx('win'); confetti(['#ff5d73','#ffc23d','#1aa6a6','#fff7ea']); await wait(1800); break;
   case 'freeze': { render(); const l=$('#lane-'+e.tg); if(l){ const i=document.createElement('div'); i.className='ice'; l.appendChild(i); } toast(e.p===e.tg?`${G.players[e.p].name} se gèle et encaisse ses points`:`${G.players[e.p].name} gèle ${G.players[e.tg].name}`); sfx('splash'); await wait(900); break; }
   case 'flip3': render(); toast(`${G.players[e.tg].name} doit retourner trois cartes !`); sfx('dice'); await wait(700); break;
   case 'give': render(); toast(`${G.players[e.p].name} donne une seconde chance à ${G.players[e.tg].name}`); sfx('pop'); await wait(600); break;
   case 'scLost': toast('Seconde chance défaussée : personne ne peut la recevoir'); await wait(500); break;
   case 'stay': render(); toast(`${G.players[e.p].name} s’arrête avec ${e.pts} points`); sfx('ding'); await wait(450); break;
   case 'roundEnd': render(); await wait(500); break;
  } } }
/* ---------- déroulement ---------- */
function save(){ if(NET.guest) return; store(KEY,G&&G.phase!=='over'?G:null); }
async function apply(ev,my){ if(!ev) return; NET.push(ev); BUSY=true; render(); await show(ev,my); if(my!==GEN) return; BUSY=false; step(); }
function step(){ if(!G) return; render(); save(); NET.push(); const my=GEN;
  if(G.phase==='roundOver'||G.phase==='over'){ const k=G.phase+G.round; if(ENDKEY===k) return; ENDKEY=k; setTimeout(()=>{ if(my===GEN) (G.phase==='over'?gameEnd:roundEnd)(); },600); return; }
  ENDKEY=null; const n=G.need; if(!n){ NET.drain(); return; }
  if(G.players[n.p].ai&&!NET.guest){ setTimeout(()=>{ if(my!==GEN||BUSY) return; const d=aiDecide(G); apply(n.type==='hit'?decide(G,n.p,d):target(G,n.p,d),my); },n.type==='hit'?750:900); return; } NET.drain(); }
function roundEnd(){ const rows=G.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score);
  window.MODAL_CLOSABLE=false; openModal(`<h2>Fin de la manche ${G.round}</h2><table class="scl"><tr><th>Joueur</th><th>Manche</th><th>Total</th></tr>${rows.map(({p,i})=>`<tr><td>${esc(p.name)}${p.flip7?' · SEPT !':p.state==='bust'?' · éliminé':''}</td><td>+${p.last}</td><td>${p.score}</td></tr>`).join('')}</table><p>Objectif : ${G.target} points. ${rows[0].p.score>=G.target?'Égalité en tête : on joue une manche de plus.':''}</p>${NET.guest?'<p class="net-wait"><span class="net-spin"></span>L’hôte lance la manche suivante…</p>':'<div class="acts"><button class="btn pri" data-r="1">Manche suivante</button></div>'}`,e=>{ if(!e.target.closest('[data-r]')) return; closeModal(); window.MODAL_CLOSABLE=true; newRound(); }); }
function gameEnd(){ const w=G.over.winner; store(KEY,null); banner('Victoire !',G.players[w].name,AVC[w%8]); sfx(isH(w)?'win':'lose'); confetti();
  setTimeout(()=>{ window.MODAL_CLOSABLE=true; openModal(`<h2>${esc(G.players[w].name)} gagne avec ${G.players[w].score} points</h2><table class="scl"><tr><th>Joueur</th><th>Total</th></tr>${G.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score).map(({p,i})=>`<tr class="${i===w?'w':''}"><td>${esc(p.name)}</td><td>${p.score}</td></tr>`).join('')}</table>${NET.guest?NET.waitHTML:'<div class="acts"><button class="btn" data-c="new">Changer les réglages</button><button class="btn pri" data-a="again">Rejouer</button></div>'}`); },1500); }
async function newRound(){ const my=++GEN; BUSY=true; const ev=startRound(G); NET.push(ev,'round'); render(); banner(`Manche ${G.round}`,`${G.players[G.dealer].name} distribue`,'#1aa6a6'); await wait(900); if(my!==GEN) return; await show(ev,my); if(my!==GEN) return; BUSY=false; step(); }
/* ---------- clics ---------- */
document.addEventListener('click',e=>{ const t=e.target.closest('[data-a],[data-tg],[data-lane]'); if(!t) return;
  if(t.dataset.a==='risk'){ RISK=!RISK; store('qs-risk',RISK); updRisk(); if(G) renderAct(); return; }
  if(t.dataset.a==='again'){ closeModal(); if(NET.host) NET.restart(); else startGame(); return; }
  if(!G||BUSY||!G.need||!can(G.need.p)) return; const n=G.need;
  if(n.type==='hit'&&(t.dataset.a==='hit'||t.dataset.a==='stay')){ sfx('click'); doAct('decide',[n.p,t.dataset.a==='hit'?1:0]); return; }
  if(n.type==='target'){ const v=t.dataset.tg!=null?+t.dataset.tg:t.dataset.lane!=null?+t.dataset.lane:null; if(v==null||!n.opts.includes(v)) return; doAct('target',[n.p,v]); } });
function updRisk(){ const b=$('#riskBtn'); if(b) b.textContent=RISK?'Aide au risque ✓':'Aide au risque'; }
/* ---------- menu ---------- */
let M={n:4,seats:Array.from({length:8},(_,i)=>({h:i===0?1:0,name:''})),level:'normal',target:200};
function startGame(){ GEN++; const hs=M.seats.slice(0,M.n).filter(s=>s.h).length;
  G=newGame({players:M.seats.slice(0,M.n).map((s,i)=>({name:(s.name||'').trim()||(s.h?(hs===1?'Toi':NAMES[i]):NAMES[(i+2)%8]),ai:!s.h,level:M.level})),target:M.target}); newRound(); }
function menu(){ window.MODAL_CLOSABLE=true;
  const draw=()=>{ const hs=M.seats.slice(0,M.n).filter(s=>s.h).length; paintModal(`<h2>Nouvelle partie</h2>
   <h4>Joueurs</h4><div class="seg">${[2,3,4,5,6,7,8].map(n=>`<button class="${M.n===n?'on':''}" data-m="n:${n}">${n}</button>`).join('')}</div>
   ${M.seats.slice(0,M.n).map((s,i)=>`<div class="seatrow"><span class="av" style="background:${AVC[i]};width:26px;height:26px;font-size:12px">${i+1}</span><input type="text" data-nm="${i}" value="${esc(s.name)}" placeholder="${s.h?(i===0?'Toi':NAMES[i]):NAMES[(i+2)%8]}" maxlength="14"><div class="seg"><button class="${s.h?'on':''}" data-m="h:${i}:1">Humain</button><button class="${s.h?'':'on'}" data-m="h:${i}:0">Ordinateur</button></div></div>`).join('')}
   ${hs<M.n?`<h4>Niveau de l’ordinateur</h4><div class="seg">${[['facile','prudent au hasard'],['normal','raisonnable'],['difficile','compte les cartes']].map(([l,d])=>`<button class="${M.level===l?'on':''}" data-m="level:${l}">${l} · ${d}</button>`).join('')}</div>`:''}
   <h4>Objectif</h4><div class="seg">${[[100,'100 points (partie courte)'],[200,'200 points (officiel)']].map(([v,l])=>`<button class="${M.target===v?'on':''}" data-m="target:${v}">${l}</button>`).join('')}</div>
   <p style="font-size:14px">Toutes les cartes sont visibles : à plusieurs sur un même écran, pas besoin de se cacher.</p>
   <div class="acts">${G&&G.phase!=='over'?'<button class="btn" data-c="close">Annuler</button>':''}<button class="btn pri" data-m="go" ${hs?'':'disabled'}>Distribuer</button></div>`); };
  draw(); $('#mbox').onclick=e=>{ $$('#mbox [data-nm]').forEach(i=>{ M.seats[+i.dataset.nm].name=i.value; }); const x=e.target.closest('[data-m]'); if(!x) return; const [k,v,w]=x.dataset.m.split(':'); sfx('click');
    if(k==='go'){ closeModal(); store('qsp',M); startGame(); return; }
    if(k==='h') M.seats[+v].h=+w; else if(k==='n'||k==='target') M[k]=+v; else M[k]=v; draw(); }; }
function help(){ helpTabs('Quitte ou Sept',[
 ['But du jeu',`<p>Être le premier à atteindre <b>200 points</b> (le plus haut score gagne si plusieurs les dépassent dans la même manche ; en cas d’égalité, on rejoue une manche).</p><p>À chaque manche, tu retournes des cartes une à une pour accumuler des points… mais un <b>chiffre en double</b> et tu perds tout ce que tu avais posé dans la manche.</p>`],
 ['Une manche',`<ol><li>Chacun reçoit une carte face visible.</li><li>À tour de rôle, chaque joueur encore en jeu choisit : <b>Encore une carte</b> ou <b>Je m’arrête</b> (il encaisse ses points et sort de la manche).</li><li>Une carte chiffre déjà présente devant toi : tu es <b>éliminé</b> pour la manche (0 point).</li><li>La manche se termine quand plus personne n’est en jeu, ou dès qu’un joueur aligne <b>sept chiffres différents</b> : il gagne 15 points de bonus et tous ceux qui ne sont pas éliminés marquent leurs points.</li></ol>`],
 ['Les cartes',`<ul><li><b>Chiffres de 0 à 12</b> : il y a autant d’exemplaires que la valeur (douze 12, onze 11… un seul 1 et un 0). Les gros chiffres rapportent plus mais tombent plus souvent en double.</li><li><b>Bonus +2 à +10</b> et <b>×2</b> : le ×2 double la somme des chiffres, puis on ajoute les bonus.</li><li><b>Gel</b> : donne-le à un joueur en jeu (toi compris) : il encaisse ses points et sort de la manche.</li><li><b>Encore trois</b> : le joueur visé retourne trois cartes d’affilée. Les Gel et Encore trois tirés pendant ce temps se jouent après.</li><li><b>Seconde chance</b> : garde-la ; elle annule un doublon (les deux cartes sont défaussées). On n’en garde qu’une : la deuxième se donne à un autre joueur en jeu.</li></ul><p class="ex">Exemple : 3, 7, 11, ×2 et +4 → (3 + 7 + 11) × 2 + 4 = 46 points.</p>`],
 ['Jouer ici',`<ul><li>De 2 à 8 joueurs, humains ou ordinateurs. Les cartes sont visibles de tous : pas d’écran de passage.</li><li><b>Aide au risque</b> (en haut) affiche la probabilité de tirer un doublon, calculée sur les cartes visibles.</li><li>Pour donner une carte action, touche la piste du joueur choisi.</li><li>La partie est sauvegardée automatiquement.</li><li><b>En ligne</b> : touche « En ligne » en haut, crée une salle et envoie son code de 4 lettres (ou le lien) à tes amis. Chacun joue sur son téléphone ou son ordinateur, l’ordinateur peut compléter la table. L’hôte garde la partie : s’il recharge la page, la salle reprend.</li></ul>`]]); }
window.QS={get G(){return G;},get BUSY(){return BUSY;}};
function rulesHTML(){ return `<h4>Objectif</h4><div class="seg">${[[100,'100 points'],[200,'200 points (officiel)']].map(([v,l])=>`<button class="${M.target===v?'on':''}" data-m="target:${v}">${l}</button>`).join('')}</div>`; }
window.NETGAME={id:'quitte-ou-sept',title:'Quitte ou Sept',min:2,max:8,rules:rulesHTML,
  rulesClick(e){ const x=e.target.closest('[data-m^="target:"]'); if(!x) return false; M.target=+x.dataset.m.split(':')[1]; store('qsp',M); return true; },
  start(list){ GEN++; ENDKEY=null; let k=0; G=newGame({players:list.map(x=>x.ai?{name:x.name||NAMES[(k++ +3)%8],ai:true,level:x.level}:{name:x.name,ai:false}),target:M.target}); list.forEach((x,i)=>{ if(x.cid) G.players[i].cid=x.cid; }); G.net=true; newRound(); },
  state:()=>G, busy:()=>BUSY, resume(){ if(!BUSY) step(); },
  act(seat,fn,args){ const n=G&&G.need; if(!n||G.phase!=='play'||n.p!==seat||args[0]!==seat||!ENG[fn]) return false; if((fn==='decide')!==(n.type==='hit')) return false; if(fn==='target'&&!n.opts.includes(+args[1])) return false; apply(ENG[fn](G,...args),GEN); return true; },
  async receive(m){ if(m.kind==='lobby'){ GEN++; G=null; BUSY=false; render(); return; }
    if(m.kind==='new'||m.kind==='round'){ GEN++; ENDKEY=null; if(!$('#modal').hidden&&N_MODAL()) closeModal(); }
    G=m.G; const my=GEN;
    if(m.kind==='round'){ BUSY=true; render(); banner(`Manche ${G.round}`,`${G.players[G.dealer].name} distribue`,'#1aa6a6'); await wait(900); }
    if(m.ev){ BUSY=true; render(); await show(m.ev,my); }
    BUSY=false; if(my===GEN) step(); },
  leave(){ GEN++; G=null; BUSY=false; ENDKEY=null; render(); GAME.menu(); } };
function N_MODAL(){ return !$('#mbox [data-net]')&&!$('#netName'); }
(function boot(){ updRisk(); const p=load('qsp'); if(p) Object.assign(M,p); const s=load(KEY);
  if(s&&s.players&&s.phase!=='over'){ G=s; render(); if(G.phase==='roundOver') roundEnd(); else step(); } else { G=null; render(); menu(); } })();
}

</script>

addEventListener('resize',f);addEventListener('scroll',f,{passive:true});var mo=new MutationObserver(f);function obs(){['modal','cover'].forEach(function(id){var e=document.getElementById(id);if(e&&!e.__hh){e.__hh=1;mo.observe(e,{attributes:true,attributeFilter:['hidden','style','class']});}});f();}
if(document.readyState==='loading')addEventListener('DOMContentLoaded',obs);else obs();setTimeout(obs,800);})();</script>
