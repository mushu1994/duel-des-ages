<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dominos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rye&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
:root{--fg:#fff6e6;--accent:#c0532b;--title:"Rye",Georgia,serif;--ui:"Nunito Sans",system-ui,sans-serif;--titlec:#ffe0a0}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui,"Nunito Sans",system-ui,sans-serif);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar,#0006);border-bottom:1px solid #fff2;flex-wrap:wrap}
.top h1{font-family:var(--title,Georgia,serif);font-weight:800;font-size:24px;margin:0;color:var(--titlec,#fff);letter-spacing:.5px}
.top h1 small{font-family:var(--ui);font-weight:600;font-size:13px;opacity:.75;margin-left:8px;letter-spacing:0}
.back{color:inherit;opacity:.9;text-decoration:none;font-size:14px;border:1px solid #fff4;padding:5px 10px;border-radius:8px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#ffffff1c;color:inherit;border:1px solid #ffffff40;border-radius:9px;padding:7px 12px;font-size:14px;font-weight:700}
.btn:hover{background:#ffffff2e}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:#fff;color:#222}
.status{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--pc,var(--accent));color:#fff;font-weight:800;min-height:44px;box-shadow:0 4px 14px #0005;transition:background .35s;flex-wrap:wrap}
.status .who{font-family:var(--title,Georgia,serif);font-size:19px}
.status .msg{font-weight:600}
.status .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
#modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:12px}
#modal[hidden]{display:none}
.mbox{background:#fbf6ea;color:#2a2418;border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox h2{font-family:var(--title,Georgia,serif);font-size:26px;margin:0 0 6px}
.mbox h4{font-family:var(--title,Georgia,serif);font-size:16px;margin:14px 0 6px}
.mbox p,.mbox li{line-height:1.5}
.mbox .btn{background:#ece3cf;color:#2a2418;border-color:#c9b98f}
.mbox .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.mbox .btn.on{background:#2a2418;color:#fff}
.seg{display:inline-flex;border:1px solid #c9b98f;border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#f6efdc;padding:7px 11px;font-weight:700;color:#2a2418;font-size:13.5px}
.seg button.on{background:#2a2418;color:#fff}
.prow{display:flex;gap:8px;align-items:center;margin:7px 0;flex-wrap:wrap}
.prow .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);border:2px solid #0004}
.prow input[type=text]{font-family:inherit;font-weight:700;font-size:16px;padding:6px 9px;border-radius:8px;border:1px solid #c9b98f;background:#fff;color:#2a2418;-webkit-text-fill-color:#2a2418;caret-color:var(--accent);width:150px;color-scheme:light}
.prow input[type=text]::placeholder{color:#a3926e;-webkit-text-fill-color:#a3926e;font-weight:600}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:1px solid #c9b98f;background:#f6efdc;border-radius:20px;padding:5px 12px;font-weight:800;color:#2a2418}
.tabs button.on{background:#2a2418;color:#fff}
.toast{position:fixed;left:50%;top:100px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #000a;z-index:70;font-weight:700;animation:toast 2.6s forwards;pointer-events:none;max-width:90vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.bannerx{position:fixed;inset:0;display:grid;place-items:center;z-index:65;pointer-events:none}
.bannerx div{font-family:var(--title,Georgia,serif);font-weight:800;font-size:clamp(30px,6vw,64px);color:#fff;background:var(--bc,var(--accent));padding:10px 36px;border-radius:14px;box-shadow:0 20px 50px #000a;animation:ban 2.3s forwards;text-align:center}
.bannerx small{display:block;font-family:var(--ui);font-size:.34em;font-weight:700}
@keyframes ban{0%{transform:scale(2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.92)}}
#cover{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);text-align:center;padding:20px}
#cover[hidden]{display:none}
#cover h2{font-family:var(--title,Georgia,serif);font-size:36px;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}

body{background:radial-gradient(ellipse at 50% 40%,#7a3a22,#2a120a 80%) fixed,#2a120a}
.top h1{font-weight:400}
.wrap{max-width:1150px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.opps{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.opp{background:#0003;border:1px solid #fff2;border-radius:12px;padding:8px 12px;min-width:140px;text-align:center;font-weight:800}
.opp.cur{box-shadow:0 0 0 2px #ffe0a0;background:#ffffff14}
.opp .mini{display:flex;gap:3px;justify-content:center;margin-top:5px;flex-wrap:wrap}
.opp .mini i{width:9px;height:17px;border-radius:2px;background:#f6efe0;box-shadow:0 1px 2px #000}
.opp small{display:block;font-weight:600;opacity:.8}
.table{position:relative;border-radius:22px;background:radial-gradient(ellipse at 50% 40%,#2f7a4a,#1a4a2c);box-shadow:inset 0 0 40px #0008,0 10px 30px #0008;border:10px solid #5a2a12;min-height:340px}
#chain{width:100%;height:auto;display:block}
#chain .end{cursor:pointer;animation:ep 1s infinite}
@keyframes ep{50%{opacity:.45}}
.hand{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px;background:#0003;border-radius:16px;min-height:110px;align-items:center}
.tile{cursor:default;transition:transform .15s}
.tile.ok{cursor:pointer}.tile.ok:hover{transform:translateY(-8px)}
.tile.sel{transform:translateY(-12px)}
.tile.ok svg rect.bg{stroke:#ffe08a;stroke-width:3}
.ctrl{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;font-weight:700}

.hbody p,.hbody li{line-height:1.5}.hbody ul,.hbody ol{padding-left:22px;margin:6px 0}.hbody li{margin:4px 0}.hbody .ex{background:#efe6d0;border-left:4px solid #c9b98f;border-radius:8px;padding:8px 12px;margin:10px 0}
/*top-above*//*hh*/#modal,#cover{top:var(--hh,0px)!important}#modal>*{max-height:calc(100vh - var(--hh,0px) - 24px)!important;max-height:calc(100dvh - var(--hh,0px) - 24px)!important;overflow:auto}
/*top-above*/header.top{position:relative;z-index:61!important}
</style></head><body>
<header class="top"><a class="back" href="index.html">← Salle de jeux</a><h1>Dominos</h1>
<div class="tools"><button class="btn" id="sndBtn" data-c="sound">Son</button><button class="btn" data-c="help">Aide</button><button class="btn pri" data-c="new">Nouvelle partie</button></div></header>
<div class="status" id="status"></div>
<div class="wrap"><div class="opps" id="opps"></div><div class="table"><svg id="chain" viewBox="0 0 1000 520"></svg></div><div class="ctrl" id="ctrl"></div><div class="hand" id="hand"></div></div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="cover" hidden></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SVGNS='http://www.w3.org/2000/svg';
function sel(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,REDUCED?Math.min(ms,30):ms));
function openModal(h,onclick){ $('#mbox').innerHTML=h; $('#mbox').onclick=onclick||null; $('#modal').hidden=false; }
function paintModal(h){ $('#mbox').innerHTML=h; $('#modal').hidden=false; }
function helpTabs(title,tabs){ let k=0; const draw=()=>paintModal('<h2>'+title+'</h2>'+(tabs.length>1?'<div class="tabs">'+tabs.map((t,i)=>'<button class="'+(i===k?'on':'')+'" data-ht="'+i+'">'+t[0]+'</button>').join('')+'</div>':'')+'<div class="hbody">'+tabs[k][1]+'</div><div class="acts"><button class="btn pri" data-c="close">Compris</button></div>'); draw(); $('#mbox').onclick=e=>{ const b=e.target.closest('[data-ht]'); if(b){ k=+b.dataset.ht; draw(); $('#mbox').scrollTop=0; } }; }
function closeModal(){ $('#modal').hidden=true; $('#mbox').onclick=null; window.COVER_HIDDEN=null; }
function toast(s){ const t=document.createElement('div'); t.className='toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2700); }
function banner(s,sub,col){ const b=document.createElement('div'); b.className='bannerx'; b.innerHTML=`<div style="${col?'--bc:'+col:''}">${esc(s)}${sub?`<small>${esc(sub)}</small>`:''}</div>`; document.body.appendChild(b); setTimeout(()=>b.remove(),2400); }
function confetti(cols){ if(REDUCED) return; cols=cols||['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#fff']; for(let i=0;i<80;i++){ const c=document.createElement('div'); c.style.cssText=`position:fixed;top:-12px;left:${Math.random()*100}vw;width:8px;height:12px;background:${cols[i%cols.length]};z-index:90;pointer-events:none;border-radius:2px`; document.body.appendChild(c);
  c.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*220}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`}],{duration:2200+Math.random()*1800,delay:Math.random()*700,easing:'ease-in'}).finished.then(()=>c.remove()); } }
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
/* sons */
let MUTED=!!load('salle-mute'), AC=null, NOISE=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(AC.state==='suspended') AC.resume().catch(()=>{}); return AC; }
function tn(a,t,f,d,type,v,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function nz(a,t,d,v,type,f){ if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;} const s=a.createBufferSource();s.buffer=NOISE;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02); }
function sfx(n){ if(MUTED) return; const a=ac(); if(!a||a.state!=='running') return; const t=a.currentTime+.01;
  switch(n){
    case 'click': tn(a,t,900,.06,'triangle',.06); break;
    case 'move': nz(a,t,.08,.25,'bandpass',900); tn(a,t,220,.08,'sine',.08); break;
    case 'capture': nz(a,t,.12,.35,'bandpass',1400); tn(a,t,520,.12,'triangle',.1,260); break;
    case 'card': nz(a,t,.1,.22,'bandpass',2800); break;
    case 'flip': nz(a,t,.06,.25,'highpass',3000); tn(a,t,1200,.05,'triangle',.04); break;
    case 'dice': for(let k=0;k<6;k++) nz(a,t+k*.07+Math.random()*.03,.05,.3,'bandpass',1800+Math.random()*1200); break;
    case 'ding': tn(a,t,1320,.5,'sine',.1); tn(a,t+.07,1760,.4,'sine',.06); break;
    case 'error': tn(a,t,220,.25,'square',.05,160); break;
    case 'win': [523,659,784,1046].forEach((f,k)=>tn(a,t+k*.12,f,.4,'triangle',.11)); break;
    case 'lose': [392,330,262].forEach((f,k)=>tn(a,t+k*.16,f,.45,'triangle',.1)); break;
    case 'splash': nz(a,t,.5,.3,'lowpass',800); break;
    case 'boom': nz(a,t,.7,.6,'lowpass',300); tn(a,t,90,.6,'sawtooth',.15,40); break;
    case 'pop': tn(a,t,600,.08,'sine',.1,900); break;
  } }
function updSnd(){ const b=$('#sndBtn'); if(b) b.textContent=MUTED?'Son : non':'Son : oui'; }
document.addEventListener('click',e=>{
  if(!MUTED) ac();
  if(e.target.id==='modal'&&window.MODAL_CLOSABLE!==false){ const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; return; }
  const t=e.target.closest('[data-c]'); if(!t) return;
  switch(t.dataset.c){
    case 'sound': MUTED=!MUTED; store('salle-mute',MUTED); updSnd(); break;
    case 'help': GAME.help(); break;
    case 'new': { const cv=$('#cover'); window.MODAL_CLOSABLE=true; GAME.menu(); if(cv&&!cv.hidden){ cv.hidden=true; window.COVER_HIDDEN=cv; } break; }
    case 'close': { const cv=window.COVER_HIDDEN; closeModal(); if(cv) cv.hidden=false; break; }
  }
});
addEventListener('DOMContentLoaded',updSnd);

/* ===== moteur ===== */
const IS_NODE=typeof window==='undefined';
function fullSet(){ const s=[]; for(let a=0;a<=6;a++) for(let b=a;b<=6;b++) s.push([a,b]); return s; }
const pips=t=>t[0]+t[1];
function options(S,hand){ const out=[]; if(!S.chain.length){ hand.forEach((t,i)=>out.push({i,side:'R'})); return out; }
  hand.forEach((t,i)=>{ if(t.includes(S.L)) out.push({i,side:'L'}); if(t.includes(S.R)&&!(S.L===S.R&&t.includes(S.L))) out.push({i,side:'R'}); }); return out; }
function place(S,t,side){ if(!S.chain.length){ S.chain.push({t:[t[0],t[1]]}); S.L=t[0]; S.R=t[1]; return; }
  if(side==='L'){ const o=t[1]===S.L?[t[0],t[1]]:[t[1],t[0]]; S.chain.unshift({t:o}); S.L=o[0]; } else { const o=t[0]===S.R?[t[0],t[1]]:[t[1],t[0]]; S.chain.push({t:o}); S.R=o[1]; } }
function aiChoose(S,pi,level){ const h=S.hands[pi], ops=options(S,h); if(!ops.length) return null;
  if(level==='facile') return ops[Math.floor(Math.random()*ops.length)];
  const counts={}; h.forEach(t=>t.forEach(v=>counts[v]=(counts[v]||0)+1));
  return ops.map(o=>{ const t=h[o.i]; let s=pips(t)*1.2+(t[0]===t[1]?6:0);
    const open=t[0]===t[1]?t[0]:(o.side==='L'?(t[0]===S.L?t[1]:t[0]):(t[0]===S.R?t[1]:t[0]));
    s+=(counts[open]||0)*3; if(level==='difficile'){ const nxt=S.hands[(pi+1)%S.hands.length]; if(S.passed&&S.passed[(pi+1)%S.hands.length]&&S.passed[(pi+1)%S.hands.length].includes(open)) s+=8; }
    return {o,s:s+Math.random()}; }).sort((a,b)=>b.s-a.s)[0].o; }
if(IS_NODE) module.exports={fullSet,options,place,aiChoose,pips};
else {
/* ===== interface ===== */
let S=null, BUSY=false, GEN=0, SELT=null, RES=null; const GAME=window.GAME={help,menu};
const PIP={0:[],1:[[.5,.5]],2:[[.25,.25],[.75,.75]],3:[[.25,.25],[.5,.5],[.75,.75]],4:[[.25,.25],[.75,.25],[.25,.75],[.75,.75]],5:[[.25,.25],[.75,.25],[.5,.5],[.25,.75],[.75,.75]],6:[[.25,.2],[.75,.2],[.25,.5],[.75,.5],[.25,.8],[.75,.8]]};
function tileSVG(t,x,y,u,vert,cls){ // u = demi-côté
  const w=vert?u:2*u, h=vert?2*u:u; let s=`<g class="${cls||''}" transform="translate(${x} ${y})"><rect class="bg" x="0" y="0" width="${w}" height="${h}" rx="${u*.14}" fill="#faf5e8" stroke="#2a1a0a" stroke-width="1.2"/><rect x="2" y="2" width="${w-4}" height="${h-4}" rx="${u*.12}" fill="url(#ivory)" opacity=".6"/>`;
  s+= vert?`<line x1="${u*.15}" y1="${u}" x2="${u*.85}" y2="${u}" stroke="#2a1a0a" stroke-width="1.5"/>`:`<line x1="${u}" y1="${u*.15}" x2="${u}" y2="${u*.85}" stroke="#2a1a0a" stroke-width="1.5"/>`;
  t.forEach((v,k)=>{ const ox=vert?0:k*u, oy=vert?k*u:0; for(const [px,py] of PIP[v]){ const qx=vert?px:py, qy=vert?py:px; s+=`<circle cx="${ox+(vert?px:px)*u}" cy="${oy+(vert?py:py)*u}" r="${u*.09}" fill="#1a1a1a"/>`; } });
  return s+'</g>'; }
const BW=()=>innerWidth<640?560:1000;
function layout(){
  const W=BW(), U=W<700?30:34, items=[], links=[]; if(!S.chain.length) return {items,links,U};
  let center=S.chain.findIndex(x=>x.first); if(center<0) center=0;
  const yc=W<700?330:260, f=S.chain[center], fd=f.t[0]===f.t[1], fw=fd?U:2*U;
  items.push({t:f.t,x:W/2-fw/2,y:yc-(fd?U:U/2),vert:fd});
  const arm=(dir0,list,isRight)=>{ let x=dir0>0?W/2+fw/2:W/2-fw/2, y=yc, d=dir0, row=0;
    for(const e of list){ const dbl=e.t[0]===e.t[1], len=dbl?U:2*U; const conn=isRight?e.t[0]:e.t[1], far=isRight?e.t[1]:e.t[0];
      if((d>0&&x+len+4>W-24)||(d<0&&x-len-4<24)){ const ny=y+(isRight?3*U:-3*U); links.push({x,y1:y,y2:ny}); y=ny; d=-d; row++; }
      const nx=d>0?x+2:x-2-len; items.push({t:dbl?[conn,conn]:(d>0?[conn,far]:[far,conn]),x:nx,y:y-(dbl?U:U/2),vert:dbl}); x=d>0?nx+len:nx; }
    return {cx:x,yy:y,d}; };
  const R=arm(1,S.chain.slice(center+1),true), L=arm(-1,S.chain.slice(0,center).reverse(),false);
  return {items,links,U,R,L}; }
function renderChain(){ const svg=$('#chain'); const W=BW(); svg.setAttribute('viewBox',`0 0 ${W} ${W<700?660:520}`); const L=layout(); let h=`<defs><linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e8dcc0"/></linearGradient><filter id="sh"><feDropShadow dx="1.5" dy="2.5" stdDeviation="1.5" flood-opacity=".5"/></filter></defs><g filter="url(#sh)">`;
  L.links.forEach(k=>h+=`<path d="M${k.x} ${k.y1} C${k.x+(k.x>W/2?60:-60)} ${k.y1}, ${k.x+(k.x>W/2?60:-60)} ${k.y2}, ${k.x} ${k.y2}" stroke="#ffffff40" stroke-width="4" fill="none" stroke-dasharray="6 6"/>`);
  L.items.forEach(it=>h+=tileSVG(it.t,it.x,it.y,L.U,it.vert)); h+='</g>';
  if(SELT!=null&&S.chain.length){ const ops=options(S,S.hands[S.cur]).filter(o=>o.i===SELT); for(const o of ops){ const e=o.side==='R'?L.R:L.L; const x=e.d>0?e.cx+4:e.cx-40; h+=`<rect class="end" data-side="${o.side}" x="${x}" y="${e.yy-L.U/2-4}" width="36" height="${L.U+8}" rx="8" fill="#ffe08a" opacity=".85"/>`; } }
  if(!S.chain.length) h+=`<text x="${W/2}" y="${W<700?330:270}" text-anchor="middle" fill="#ffffff70" font-size="26" font-family="Rye">Le premier domino se pose ici</text>`;
  svg.innerHTML=h; }
const isAI=i=>S.players[i].ai;
function viewer(){ const hs=S.players.map((p,i)=>p.ai?-1:i).filter(i=>i>=0); return hs.length===1?hs[0]:(isAI(S.cur)?S.lastHuman??hs[0]:S.cur); }
function render(){ renderChain(); const v=viewer();
  $('#opps').innerHTML=S.players.map((p,i)=>i===v?'':`<div class="opp ${i===S.cur&&!S.roundOver?'cur':''}">${esc(p.name)}<small>${S.score[i]} pts${p.ai?' · IA':''}</small><div class="mini">${S.hands[i].map(()=>'<i></i>').join('')}</div></div>`).join('');
  const my=v>=0?S.hands[v]:[], ops=v===S.cur&&!BUSY&&!S.roundOver?options(S,my):[];
  $('#hand').innerHTML=my.map((t,i)=>`<svg class="tile ${ops.some(o=>o.i===i)?'ok':''} ${SELT===i?'sel':''}" data-t="${i}" width="64" height="116" viewBox="-2 -2 40 76">${tileSVG(t,0,0,36,true)}</svg>`).join('')||'<span style="opacity:.7">Plus de dominos !</span>';
  const canDraw=v===S.cur&&!ops.length&&S.stock.length&&!S.roundOver, mustPass=v===S.cur&&!ops.length&&!S.stock.length&&!S.roundOver;
  $('#ctrl').innerHTML=`<span>${esc(S.players[v]?.name||'')} · ${S.score[v]} pts</span><span>Pioche : ${S.stock.length}</span>${canDraw?'<button class="btn pri" data-a="draw">Piocher</button>':''}${mustPass?'<button class="btn pri" data-a="pass">Passer</button>':''}`;
  const st=$('#status'); st.style.setProperty('--pc',S.over?'#5a2a1a':'#8a4a1a');
  st.innerHTML=S.over?`<span class="who">${esc(S.over)}</span>`:`<span class="who">${esc(S.players[S.cur].name)}</span><span class="msg">${isAI(S.cur)?'réfléchit…':ops.length?'Pose un domino (touche-le, puis le bout à gauche ou à droite).':S.stock.length?'Aucun domino ne va : pioche.':'Aucun domino ne va : passe.'}</span><span class="right">Manche ${S.round} · objectif ${S.target} pts</span>`; }
async function play(pi,o){ const t=S.hands[pi][o.i]; S.hands[pi].splice(o.i,1); if(!S.chain.length){ place(S,t,'R'); S.chain[0].first=true; } else place(S,t,o.side); S.passes=0; sfx('move'); SELT=null; render(); await wait(isAI(pi)?250:120);
  if(!S.hands[pi].length){ endRound(pi); return true; } return false; }
async function turn(){ const my=GEN; if(S.over||S.roundOver) return; const pi=S.cur;
  if(isAI(pi)){ render(); await wait(650); if(my!==GEN) return;
    while(true){ const o=aiChoose(S,pi,S.players[pi].level); if(o){ if(await play(pi,o)) return; break; } if(S.stock.length){ S.hands[pi].push(S.stock.pop()); sfx('card'); render(); await wait(250); if(my!==GEN) return; continue; } S.passes++; (S.passed[pi]=S.passed[pi]||[]).push(S.L,S.R); toast(`${S.players[pi].name} passe.`); break; }
  } else { S.lastHuman=pi; if(S.players.filter(p=>!p.ai).length>1) await coverFor(pi); render(); const r=await new Promise(res=>RES=res); RES=null; if(my!==GEN) return;
    if(r.a==='play'){ if(await play(pi,r.o)) return; } else if(r.a==='pass'){ S.passes++; } }
  if(S.passes>=S.players.length){ endRound(-1); return; }
  S.cur=(S.cur+1)%S.players.length; store('dom',S); turn(); }
function coverFor(pi){ return new Promise(res=>{ const c=$('#cover'); c.style.background='radial-gradient(circle,#7a3a22,#1a0a05)'; c.innerHTML=`<div><h2 style="font-family:var(--title);color:#ffe0a0">${esc(S.players[pi].name)}</h2><p>C'est ton tour : les autres ne regardent pas !</p><button class="btn pri" style="font-size:18px;padding:12px 26px">Voir mes dominos</button></div>`; c.hidden=false; c.querySelector('button').onclick=()=>{ c.hidden=true; res(); }; }); }
function endRound(w){ S.roundOver=true; const tot=S.hands.map(h=>h.reduce((s,t)=>s+pips(t),0)); let winner=w;
  if(w<0){ const mn=Math.min(...tot); winner=tot.indexOf(mn); }
  const gain=tot.reduce((s,v,i)=>i===winner?s:s+v,0)-(w<0?tot[winner]:0); S.score[winner]+=Math.max(0,gain);
  render(); sfx('ding');
  const lines=S.players.map((p,i)=>`<tr><td>${esc(p.name)}</td><td style="text-align:right">${tot[i]} points en main</td><td style="text-align:right"><b>${S.score[i]}</b></td></tr>`).join('');
  const done=S.score[winner]>=S.target;
  if(done){ S.over=`${S.players[winner].name} remporte la partie !`; store('dom',null); const human=!isAI(winner); banner(human?'Victoire !':'Partie perdue',S.over,human?'#2f8a4a':'#8a2a1a'); sfx(human?'win':'lose'); if(human) confetti(); }
  setTimeout(()=>openModal(`<h2>${w<0?'Partie bloquée':'Domino !'}</h2><p>${esc(S.players[winner].name)} ${w<0?'a le moins de points en main et':'a posé tous ses dominos et'} marque <b>${Math.max(0,gain)}</b> points.</p><table style="width:100%">${lines}</table>
   <div class="acts">${done?'<button class="btn pri" data-c="new">Nouvelle partie</button>':'<button class="btn pri" data-a="nextround">Manche suivante</button>'}</div>`),done?1600:700); }
function deal(){ const set=fullSet().sort(()=>Math.random()-.5); const n=S.players.length, k=n===2?7:n===3?7:6;
  S.hands=S.players.map(()=>set.splice(0,k)); S.stock=S.draw?set:[]; if(!S.draw) S.hands.forEach(h=>{ while(set.length&&h.length<7) h.push(set.pop()); });
  S.chain=[]; S.L=S.R=null; S.passes=0; S.passed={}; S.roundOver=false; SELT=null;
  let best=-1,bi=0; S.hands.forEach((h,i)=>h.forEach(t=>{ if(t[0]===t[1]&&t[0]>best){best=t[0];bi=i;} })); S.cur=S.round===1?bi:(S.lastWinner??bi); }
document.addEventListener('click',e=>{ if(!S) return; const a=e.target.closest('[data-a]');
  if(a){ if(a.dataset.a==='draw'&&RES&&S.stock.length){ S.hands[S.cur].push(S.stock.pop()); sfx('card'); render(); }
    if(a.dataset.a==='pass'&&RES) RES({a:'pass'});
    if(a.dataset.a==='nextround'){ closeModal(); S.round++; deal(); store('dom',S); GEN++; turn(); } return; }
  const t=e.target.closest('.tile.ok'); if(t&&RES){ const i=+t.dataset.t; const ops=options(S,S.hands[S.cur]).filter(o=>o.i===i); sfx('click');
    if(ops.length===1||!S.chain.length){ RES({a:'play',o:ops[0]}); return; } SELT=i; render(); return; }
  const end=e.target.closest('.end'); if(end&&RES&&SELT!=null){ const o=options(S,S.hands[S.cur]).find(o=>o.i===SELT&&o.side===end.dataset.side); if(o) RES({a:'play',o}); } });
let M={n:3,slots:[{h:1,name:'Toi'},{h:0,name:'Raymond'},{h:0,name:'Josette'},{h:0,name:'Marcel'}],level:'normal',draw:true,target:100};
const HN=['Toi','Lucas','Emma','Hugo'], AIN=['Raymond','Josette','Marcel','Ginette'];
function menu(){ const draw=()=>paintModal(`<h2>Nouvelle partie</h2><h4>Joueurs</h4><div class="seg">${[2,3,4].map(n=>`<button class="${M.n===n?'on':''}" data-m="n:${n}">${n}</button>`).join('')}</div>
  ${M.slots.slice(0,M.n).map((p,i)=>`<div class="prow"><input type="text" data-nm="${i}" value="${esc(p.name)}" placeholder="${p.h?HN[i]:AIN[i]}" maxlength="14"><div class="seg"><button class="${p.h?'on':''}" data-m="h:${i}:1">Humain</button><button class="${!p.h?'on':''}" data-m="h:${i}:0">Ordinateur</button></div></div>`).join('')}
  <h4>Ordinateur</h4><div class="seg">${['facile','normal','difficile'].map(l=>`<button class="${M.level===l?'on':''}" data-m="level:${l}">${l}</button>`).join('')}</div>
  <h4>Règle</h4><div class="seg"><button class="${M.draw?'on':''}" data-m="draw:1">Avec pioche</button><button class="${!M.draw?'on':''}" data-m="draw:0">Sans pioche (bloqué = on passe)</button></div> <div class="seg">${[50,100,150].map(v=>`<button class="${M.target===v?'on':''}" data-m="target:${v}">${v} points</button>`).join('')}</div>
  <div class="acts">${S?'<button class="btn" data-c="close">Annuler</button>':''}<button class="btn pri" data-m="start">Mélanger</button></div>`);
  draw(); const keep=()=>$$('[data-nm]').forEach(i=>M.slots[+i.dataset.nm].name=i.value);
  $('#mbox').onclick=e=>{ const x=e.target.closest('[data-m]'); if(!x) return; keep(); const a=x.dataset.m.split(':');
    if(a[0]==='start'){ closeModal(); store('domp',M); GEN++; S={players:M.slots.slice(0,M.n).map((p,i)=>({name:(p.name||'').trim()||(p.h?HN[i]:AIN[i]),ai:!p.h,level:M.level})),score:new Array(M.n).fill(0),round:1,draw:M.draw,target:M.target,over:null}; deal(); store('dom',S); turn(); return; }
    if(a[0]==='n') M.n=+a[1]; if(a[0]==='level') M.level=a[1]; if(a[0]==='draw') M.draw=a[1]==='1'; if(a[0]==='target') M.target=+a[1];
    if(a[0]==='h'){ const p=M.slots[+a[1]]; p.h=a[2]==='1'; if(p.h&&AIN.includes(p.name)) p.name=HN[+a[1]]; if(!p.h&&HN.includes(p.name)) p.name=AIN[+a[1]]; } draw(); }; }
function help(){ helpTabs("Dominos",[["But du jeu","<p>Être le premier à poser tous ses dominos, et atteindre le score fixé (50, 100 ou 150 points) au fil des manches.</p><p>Jeu « double-six » de 28 dominos. Chacun reçoit 7 dominos (6 à quatre joueurs). Celui qui a le plus gros double commence.</p>"],["Déroulement","<ol><li>À ton tour, pose un domino dont une moitié porte le même nombre que l’un des deux bouts de la chaîne.</li><li>Si aucun domino ne va :<ul><li><b>avec pioche</b> : tu pioches jusqu’à pouvoir jouer (ou jusqu’à ce que la pioche soit vide) ;</li><li><b>sans pioche</b> : tu passes ton tour.</li></ul></li><li>La manche s’arrête quand un joueur a tout posé, ou quand plus personne ne peut jouer (jeu bloqué).</li></ol>"],["Points","<ul><li>Le joueur qui a tout posé marque la somme des points restant dans les mains adverses.</li><li>Jeu bloqué : celui qui a le moins de points en main gagne la manche et marque les points des autres.</li><li>La partie s’arrête quand un joueur atteint le score choisi.</li></ul><p class=\"ex\">Jouer ici : touche un domino de ta main, puis le bout de la chaîne (à gauche ou à droite) où le poser.</p>"]]); }
addEventListener('resize',()=>{ if(S) renderChain(); });
(function boot(){ const p=load('domp'); if(p) Object.assign(M,p); const s=load('dom'); if(s&&!s.over&&!s.roundOver){ S=s; turn(); } else { S=null; $('#chain').innerHTML=''; menu(); } })();
}
