<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Casse-briques</title>
<meta name="theme-color" content="#15133a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
:root{--fg:#eef3ff;--accent:#ff7a2e;--title:"Baloo 2",system-ui,sans-serif;--ui:"Nunito Sans",system-ui,sans-serif;--titlec:#ffd2a8}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui,"Nunito Sans",system-ui,sans-serif);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar,#0006);border-bottom:1px solid #fff2;flex-wrap:wrap}
.top h1{font-family:var(--title,Georgia,serif);font-weight:800;font-size:24px;margin:0;color:var(--titlec,#fff);letter-spacing:.5px}
.top h1 small{font-family:var(--ui);font-weight:600;font-size:13px;opacity:.75;margin-left:8px;letter-spacing:0}
.back{color:inherit;opacity:.9;text-decoration:none;font-size:14px;border:1px solid #fff4;padding:5px 10px;border-radius:8px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#ffffff1c;color:inherit;border:1px solid #ffffff40;border-radius:9px;padding:7px 12px;font-size:14px;font-weight:700}
.btn:hover{background:#ffffff2e}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:#fff;color:#222}
.status{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--pc,var(--accent));color:#fff;font-weight:800;min-height:44px;box-shadow:0 4px 14px #0005;transition:background .35s;flex-wrap:wrap}
.status .who{font-family:var(--title,Georgia,serif);font-size:19px}
.status .msg{font-weight:600}
.status .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
#modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:12px}
#modal[hidden]{display:none}
.mbox{background:#fbfaff;color:#1a1740;border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox h2{font-family:var(--title,Georgia,serif);font-size:26px;margin:0 0 6px}
.mbox h4{font-family:var(--title,Georgia,serif);font-size:16px;margin:14px 0 6px}
.mbox p,.mbox li{line-height:1.5}
.mbox .btn{background:#e9e5fb;color:#1a1740;border-color:#cfc9ef}
.mbox .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.mbox .btn.on{background:#1a1740;color:#fff}
.seg{display:inline-flex;border:1px solid #cfc9ef;border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#f1eefc;padding:7px 11px;font-weight:700;color:#1a1740;font-size:13.5px}
.seg button.on{background:#1a1740;color:#fff}
.prow{display:flex;gap:8px;align-items:center;margin:7px 0;flex-wrap:wrap}
.prow .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);border:2px solid #0004}
.prow input[type=text]{font-family:inherit;font-weight:700;font-size:16px;padding:6px 9px;border-radius:8px;border:1px solid #cfc9ef;background:#fff;color:#1a1740;-webkit-text-fill-color:#1a1740;caret-color:var(--accent);width:150px;color-scheme:light}
.prow input[type=text]::placeholder{color:#8f8ab8;-webkit-text-fill-color:#8f8ab8;font-weight:600}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:1px solid #cfc9ef;background:#f1eefc;border-radius:20px;padding:5px 12px;font-weight:800;color:#1a1740}
.tabs button.on{background:#1a1740;color:#fff}
.toast{position:fixed;left:50%;top:100px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #000a;z-index:70;font-weight:700;animation:toast 2.6s forwards;pointer-events:none;max-width:90vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.bannerx{position:fixed;inset:0;display:grid;place-items:center;z-index:65;pointer-events:none}
.bannerx div{font-family:var(--title,Georgia,serif);font-weight:800;font-size:clamp(30px,6vw,64px);color:#fff;background:var(--bc,var(--accent));padding:10px 36px;border-radius:14px;box-shadow:0 20px 50px #000a;animation:ban 2.3s forwards;text-align:center}
.bannerx small{display:block;font-family:var(--ui);font-size:.34em;font-weight:700}
@keyframes ban{0%{transform:scale(2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.92)}}
#cover{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);text-align:center;padding:20px}
#cover[hidden]{display:none}
#cover h2{font-family:var(--title,Georgia,serif);font-size:36px;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
body{background:radial-gradient(ellipse at 50% 0%,#4a1a2a,#14060c 75%) fixed,#14060c}
html,body{overscroll-behavior:none}
body{overflow-x:hidden}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 8px 10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{display:block;border-radius:14px;box-shadow:0 10px 30px #0008,0 0 0 2px #ffffff22;touch-action:none;background:#000}
.board{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:980px;min-height:28px}
.bp{display:flex;align-items:center;gap:6px;background:#ffffff14;border:1px solid #ffffff26;border-radius:999px;padding:3px 10px;font-size:13.5px;font-weight:700;white-space:nowrap}
.bp i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px #0004;flex:none}
.bp b{max-width:110px;overflow:hidden;text-overflow:ellipsis}
.bp span{font-family:var(--title);font-weight:800;font-size:16px;margin-left:2px}
.bp small{opacity:.78;font-weight:700}
.bp.me{background:#ffffff30;border-color:#fffa}
.bp.out{opacity:.45}
.rank{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;align-items:center;gap:9px;background:#f0e6cf;border-radius:10px;padding:7px 11px;font-weight:700}
.rank li.me{outline:2px solid var(--accent)}
.rank .pos{font-family:var(--title);font-weight:800;width:20px}
.rank i{width:14px;height:14px;border-radius:50%;flex:none}
.rank span:last-child{margin-left:auto;font-family:var(--title);font-weight:800;font-size:18px}
.note{font-size:14px;color:#6b5d40}
.opts h4{margin:12px 0 5px}
.opts .seg{margin:0 6px 4px 0}
.optnote{font-size:13px;color:#6b5d40;margin:4px 0 0}
.cover-acts{display:flex;flex-direction:column;gap:10px;align-items:stretch;margin-top:12px}
.cover-acts .btn{font-size:16px;padding:12px 14px}
.bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bigchoice button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid #cfc9ef;background:#f1eefc;border-radius:12px;padding:12px;color:#1a1740;font-family:inherit}
.bigchoice button b{font-family:var(--title);font-size:19px}
.bigchoice button small{font-size:13px;color:#5d588a;line-height:1.35}
.bigchoice button.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}
.bigchoice button.pri small{color:#e3f5ea}
@media (max-width:520px){.bigchoice{grid-template-columns:1fr}}
.top h1 small{display:inline}
@media (max-width:520px){.top h1 small{display:none}.top{padding:8px 10px;gap:8px}.top .btn{padding:6px 9px;font-size:13px}}

.cvwrap{position:relative;line-height:0}
.pad{position:absolute;bottom:10px;width:min(56vw,230px);height:min(56vw,230px);touch-action:none;-webkit-user-select:none;user-select:none;z-index:4}
.pad[hidden]{display:none}
.pad[data-pos="centre"]{left:50%;transform:translateX(-50%)}.pad[data-pos="gauche"]{left:10px}.pad[data-pos="droite"]{right:10px}
.pad svg{width:100%;height:100%;display:block;opacity:.62}
.pad .pbg{fill:#0006;stroke:#fff6;stroke-width:2}
.pad .pw path{fill:#ffffff22;stroke:#ffffff55;stroke-width:1.5}.pad .pw .pa{fill:#fffd;stroke:none}
.pad .pw.on path{fill:#ffffff88}.pad .pw.on .pa{fill:#fff}
.pad .pc{fill:#0005;stroke:#fff5}
.step{display:inline-flex;align-items:center;gap:0;border:1px solid #c9b98f;border-radius:9px;overflow:hidden}
.step button{border:0;background:#f6efdc;color:#2a2418;font-weight:900;font-size:18px;width:40px;height:36px;font-family:inherit;cursor:pointer}
.step b{min-width:46px;text-align:center;font-size:17px;color:#2a2418}

/* plein écran immersif et paysage */
#fsExit{display:none}
body.immersive .top,body.immersive .status{display:none}
body.immersive #fsExit{display:grid;place-items:center;position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:60;width:38px;height:38px;border-radius:50%;border:1px solid #fff6;background:#0008;color:#fff;font-size:18px}
body.immersive .stage{padding-top:max(6px,env(safe-area-inset-top))}
@media (orientation:landscape) and (max-height:540px){
 .top{padding:4px 10px}.top h1{font-size:20px}.status{padding:4px 12px;font-size:14px}
 .stage{flex-direction:row;align-items:flex-start;justify-content:center;gap:10px;padding:6px}
 .board{flex-direction:column;flex-wrap:nowrap;max-width:190px;justify-content:flex-start}
 .pad{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));width:min(48vh,180px);height:min(48vh,180px);transform:none!important}
 .pad[data-pos="centre"],.pad[data-pos="gauche"]{left:max(10px,env(safe-area-inset-left));right:auto}
 .pad[data-pos="droite"]{right:max(10px,env(safe-area-inset-right));left:auto}
 .stage:has(.pad:not([hidden]):not([data-pos="droite"])){padding-left:calc(min(48vh,180px) + 20px)}
 .stage:has(.pad[data-pos="droite"]:not([hidden])){padding-right:calc(min(48vh,180px) + 20px)}
}
.tuto{text-align:center}.tuto-ic{font-size:56px;line-height:1.1;margin:4px 0 6px}.tuto h2{margin:0 0 6px}.tuto p{margin:0 auto;max-width:34ch;line-height:1.45}
.tuto-dots{display:flex;gap:6px;justify-content:center;margin:12px 0 2px}.tuto-dots i{width:8px;height:8px;border-radius:50%;background:#c9b98f}.tuto-dots i.on{background:var(--accent)}
.optrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0}.optrow input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}

/* croix tactile : sous le plateau en portrait, à côté en paysage, plus grande sur tablette */
:root{--padsz:min(46vw,210px)}
@media (pointer:coarse) and (min-width:600px){:root{--padsz:min(34vw,300px)}}
@media (orientation:portrait) and (pointer:coarse){
 .cvwrap:has(.pad:not([hidden])){padding-bottom:calc(var(--padsz) + 14px)}
 .cvwrap .pad{bottom:0;width:var(--padsz);height:var(--padsz)}
 .cvwrap .pad[data-pos="gauche"]{left:4px}.cvwrap .pad[data-pos="droite"]{right:4px}
 .cvwrap .pad svg{opacity:.85}
}
@media (orientation:landscape) and (pointer:coarse) and (min-height:541px){
 .pad{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));width:min(36vh,300px);height:min(36vh,300px);transform:none!important}
 .pad svg{opacity:.8}
 .pad[data-pos="centre"],.pad[data-pos="gauche"]{left:max(18px,env(safe-area-inset-left));right:auto}
 .pad[data-pos="droite"]{right:max(18px,env(safe-area-inset-right));left:auto}
 .stage:has(.pad:not([hidden]):not([data-pos="droite"])){padding-left:calc(min(36vh,300px) + 34px)}
 .stage:has(.pad[data-pos="droite"]:not([hidden])){padding-right:calc(min(36vh,300px) + 34px)}
}

.avmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:10px 0;max-height:52vh;overflow:auto;padding:2px}
.avl{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;border:2px solid #c9b98f;background:#fffaf0;padding:8px 4px;cursor:pointer;color:#2a2418}
.avl b{font:800 22px var(--title)}.avl small{font-size:11px;line-height:1.15;text-align:center;min-height:26px}.avl span{color:#e0a800;letter-spacing:1px}
.avl.cur{border-color:var(--accent);box-shadow:0 0 0 3px #2f8a4a55}.avl.lock{opacity:.45;cursor:default}

.hbody p,.hbody li{line-height:1.5}.hbody ul,.hbody ol{padding-left:22px;margin:6px 0}.hbody li{margin:4px 0}.hbody .ex{background:#efe6d0;border-left:4px solid #c9b98f;border-radius:8px;padding:8px 12px;margin:10px 0}

/*top-above*//*hh*/#modal,#cover{top:var(--hh,0px)!important}#modal>*{max-height:calc(100vh - var(--hh,0px) - 24px)!important;max-height:calc(100dvh - var(--hh,0px) - 24px)!important;overflow:auto}
/*top-above*/header.top{position:relative;z-index:61!important}

</head><body>
<header class="top"><a class="back" href="index.html">Salle de jeux</a><h1>Casse-briques</h1>
<div class="tools"><button class="btn" id="sndBtn" data-c="sound">Son</button><button class="btn" data-c="help">Aide</button><button class="btn pri" data-c="new">Nouvelle partie</button></div></header>
<div class="status" id="status"></div>
<div class="stage" id="stage"><div class="cvwrap"><canvas id="cv"></canvas></div><div class="board" id="board"></div></div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<!--NET--><script src="common/hall.js?v=e82d0531"></script><script src="common/net.js?v=2ba51f77"></script><!--/NET--><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SVGNS='http://www.w3.org/2000/svg';
function sel(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,REDUCED?Math.min(ms,30):ms));
function openModal(h,onclick){ $('#mbox').innerHTML=h; $('#mbox').onclick=onclick||null; $('#modal').hidden=false; }
function paintModal(h){ $('#mbox').innerHTML=h; $('#modal').hidden=false; }
function helpTabs(title,tabs){ let k=0; const draw=()=>paintModal('<h2>'+title+'</h2>'+(tabs.length>1?'<div class="tabs">'+tabs.map((t,i)=>'<button class="'+(i===k?'on':'')+'" data-ht="'+i+'">'+t[0]+'</button>').join('')+'</div>':'')+'<div class="hbody">'+tabs[k][1]+'</div><div class="acts">'+(window.GAME_TUTO?'<button class="btn" data-tuto="1">🎓 Revoir le tutoriel</button>':'')+'<button class="btn pri" data-c="close">Compris</button></div>'); draw(); $('#mbox').onclick=e=>{ if(e.target.closest('[data-tuto]')){ window.GAME_TUTO(); return; } const b=e.target.closest('[data-ht]'); if(b){ k=+b.dataset.ht; draw(); $('#mbox').scrollTop=0; } }; }
/* tutoriel en quelques écrans ; il se revoit depuis l'aide */
function showTuto(slug,steps,done){ let i=0; const draw=()=>{ const s=steps[i]; openModal(`<div class="tuto"><div class="tuto-ic">${s[0]}</div><h2>${s[1]}</h2><p>${s[2]}</p><div class="tuto-dots">${steps.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div></div><div class="acts">${i?'<button class="btn" data-t="prev">Précédent</button>':'<button class="btn" data-t="skip">Passer</button>'}<button class="btn pri" data-t="next">${i<steps.length-1?'Suivant':'C’est parti !'}</button></div>`,
    e=>{ const b=e.target.closest('[data-t]'); if(!b) return; if(b.dataset.t==='prev'){ i--; draw(); return; } if(b.dataset.t==='next'&&i<steps.length-1){ i++; draw(); return; } try{ localStorage.setItem('tuto-'+slug,'1'); }catch(x){} closeModal(); done&&done(); }); };
  draw(); }
function closeModal(){ $('#modal').hidden=true; $('#mbox').onclick=null; window.COVER_HIDDEN=null; }
function toast(s){ const t=document.createElement('div'); t.className='toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2700); }
function banner(s,sub,col){ const b=document.createElement('div'); b.className='bannerx'; b.innerHTML=`<div style="${col?'--bc:'+col:''}">${esc(s)}${sub?`<small>${esc(sub)}</small>`:''}</div>`; document.body.appendChild(b); setTimeout(()=>b.remove(),2400); }
function confetti(cols){ if(REDUCED) return; cols=cols||['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#fff']; for(let i=0;i<80;i++){ const c=document.createElement('div'); c.style.cssText=`position:fixed;top:-12px;left:${Math.random()*100}vw;width:8px;height:12px;background:${cols[i%cols.length]};z-index:90;pointer-events:none;border-radius:2px`; document.body.appendChild(c);
  c.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*220}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`}],{duration:2200+Math.random()*1800,delay:Math.random()*700,easing:'ease-in'}).finished.then(()=>c.remove()); } }
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
/* sons */
let MUTED=!!load('salle-mute'), AC=null, NOISE=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(AC.state==='suspended') AC.resume().catch(()=>{}); return AC; }
function tn(a,t,f,d,type,v,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function nz(a,t,d,v,type,f){ if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;} const s=a.createBufferSource();s.buffer=NOISE;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02); }
function sfx(n){ if(MUTED) return; if(n==='click'&&window.ARC_PLAYING) return; const a=ac(); if(!a||a.state!=='running') return; const t=a.currentTime+.01;
  switch(n){
    case 'click': tn(a,t,900,.06,'triangle',.06); break;
    case 'move': nz(a,t,.08,.25,'bandpass',900); tn(a,t,220,.08,'sine',.08); break;
    case 'capture': nz(a,t,.12,.35,'bandpass',1400); tn(a,t,520,.12,'triangle',.1,260); break;
    case 'card': nz(a,t,.1,.22,'bandpass',2800); break;
    case 'flip': nz(a,t,.06,.25,'highpass',3000); tn(a,t,1200,.05,'triangle',.04); break;
    case 'dice': for(let k=0;k<6;k++) nz(a,t+k*.07+Math.random()*.03,.05,.3,'bandpass',1800+Math.random()*1200); break;
    case 'ding': tn(a,t,1320,.5,'sine',.1); tn(a,t+.07,1760,.4,'sine',.06); break;
    case 'error': tn(a,t,220,.25,'square',.05,160); break;
    case 'win': [523,659,784,1046].forEach((f,k)=>tn(a,t+k*.12,f,.4,'triangle',.11)); break;

const pwidth=()=>M.pw.L?110:70;
function stepField(dt,now){ if(!M||!M.al) return; M.acc+=dt; let n=0; const ev=[];
  while(M.acc>=DT&&n++<120){ M.acc-=DT; const w=pwidth(); const d=M.tx-M.px; M.px+=Math.sign(d)*Math.min(Math.abs(d),1400*DT); M.px=Math.max(w/2,Math.min(VW-w/2,M.px));
    for(const k in M.pw){ M.pw[k]-=DT; if(M.pw[k]<=0) delete M.pw[k]; }
    const slow=M.pw.R?.65:1;
    for(const b of M.balls){ if(b.st){ b.x=M.px+(b.off||0); continue; }
      const ox=b.x, oy=b.y; b.x+=b.vx*DT*slow; b.y+=b.vy*DT*slow;
      if(b.x<BR){ b.x=BR; b.vx=Math.abs(b.vx); } if(b.x>VW-BR){ b.x=VW-BR; b.vx=-Math.abs(b.vx); } if(b.y<BR+26){ b.y=BR+26; b.vy=Math.abs(b.vy); }
      /* raquette */
      if(b.vy>0&&b.y+BR>=PYP-PH/2&&oy+BR<PYP-PH/2+2&&Math.abs(b.x-M.px)<=w/2+BR){ const off=Math.max(-1,Math.min(1,(b.x-M.px)/(w/2))); const a=off*1.1; const sp=Math.hypot(b.vx,b.vy);
        b.vx=Math.sin(a)*sp; b.vy=-Math.cos(a)*sp; b.y=PYP-PH/2-BR; ev.push('pad'); }
      /* briques */
      for(let i=M.bricks.length-1;i>=0;i--){ const k=M.bricks[i]; if(b.x+BR<k.x||b.x-BR>k.x+BW||b.y+BR<k.y||b.y-BR>k.y+BH) continue;
        const fire=M.pw.F&&k.h!==-1;
        if(!fire){ const wasX=ox+BR<=k.x||ox-BR>=k.x+BW; if(wasX) b.vx=-b.vx; else b.vy=-b.vy; b.x=ox; b.y=oy; }
        if(k.h===-1){ ev.push('gold'); break; }
        k.h--; if(k.h>0||(fire&&false)){ ev.push('silver'); M.sc+=5; break; }
        M.bricks.splice(i,1); M.sc+=k.c==='S'?50:10+M.lv*2; ev.push('brick'); burst(k.x+BW/2,k.y+BH/2,BC[k.c][0]);
        if(M.rng()<.13){ const ks=Object.keys(PW); const t=ks[Math.floor(M.rng()*ks.length)]; M.caps.push({x:k.x+BW/2,y:k.y+BH/2,t}); }
        if(!fire) break; } }
    M.balls=M.balls.filter(b=>b.y<VH+20);
    for(const c of M.caps){ c.y+=120*DT; if(c.y>PYP-PH&&c.y<PYP+PH&&Math.abs(c.x-M.px)<pwidth()/2+10){ c.got=true; power(c.t); } }
    M.caps=M.caps.filter(c=>!c.got&&c.y<VH+10);
    if(!M.balls.length){ M.li--; ev.push('lost'); if(M.li<=0){ M.al=false; ev.push('dead'); break; } M.pw={}; stickBall(); }
    if(!M.bricks.some(k=>k.h!==-1)){ M.sc+=200+M.li*50; M.lv++; ev.push('level'); loadLevel(); M.clear=now+1600; } }
  M.parts=M.parts.filter(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=500*dt; p.t-=dt; return p.t>0; });
  const seen=new Set(); for(const e of ev){ if(seen.has(e)) continue; seen.add(e);
    if(e==='pad') sfx('pong'); else if(e==='brick') sfx('brick'); else if(e==='silver'||e==='gold') sfx('click'); else if(e==='lost'){ sfx('hit'); M.shake=.3; if(window.PROF) PROF.vibrate(150); }
    else if(e==='level'){ sfx('win'); banner(`Niveau ${M.lv+1}`,null,'#ff7a2e'); } else if(e==='dead') sfx('lose'); }
  if(ev.length) report(); }
function power(t){ sfx('power'); if(t==='L') M.pw.L=15; else if(t==='R') M.pw.R=10; else if(t==='F') M.pw.F=8; else if(t==='V') M.li=Math.min(6,M.li+1);
  else if(t==='M'){ const src=M.balls.find(b=>!b.st)||M.balls[0]; if(src){ for(const a of [-.5,.5]){ const sp=M.sp; const ang=Math.atan2(src.vx||0,-(src.vy||-1))+a; M.balls.push({x:src.x,y:src.y,vx:Math.sin(ang)*sp,vy:-Math.abs(Math.cos(ang)*sp),st:false}); } } } }
function burst(x,y,c){ for(let i=0;i<7;i++){ const a=Math.random()*6.28, v=60+Math.random()*120; M.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,t:.5+Math.random()*.3,c}); } }
let lastRep=0;
function report(force){ const S=host()?G:snap.cur; const me=ARC.seat(); if(!S||me==null||!M) return; const n=performance.now(); if(!force&&n-lastRep<250) return; lastRep=n;
  const st=[M.sc,M.lv,M.li,M.al?1:0];
  if(host()){ G.st[me]={sc:st[0],lv:st[1],li:st[2],al:!!st[3]}; L.dirty=true; } else ARC.send('s',st); }
/* ---------- partie (hôte) ---------- */
function newGame(list){ const o=Object.assign({},OPT);
  G={gid:Math.random().toString(36).slice(2,8),phase:'count',seed:(Math.random()*4e9)>>>0,dur:list.length>1?o.dur:0,left:0,players:ARC.recolor(list.map((x,i)=>({name:x.name,cid:x.cid||null,ai:!!x.ai,level:x.level||o.level}))),
    st:list.map(()=>({sc:0,lv:0,li:3,al:true})),ev:[],evn:0};
  L={t0:performance.now()+3000,end:0,bots:{},dirty:true}; if(window.PROF) PROF.played('casse-briques',ARC.net()); snap.reset(G); emit({t:'count'}); }
function hostStep(now,dt){ const S=G;
  if(S.phase==='count'&&now>=L.t0){ S.phase='play'; if(S.dur) L.end=now+S.dur*1000; L.dirty=true; emit({t:'go'}); }
  if(S.phase!=='play') return;
  S.players.forEach((P,i)=>{ if(!ARC.bot(P)) return; const st=S.st[i]; if(!st.al) return; const B=L.bots[i]||(L.bots[i]={acc:0}); B.acc+=dt; if(B.acc<.5) return; B.acc=0;
    const lv=P.level||'normal'; const rate={facile:6,normal:9,difficile:13}[lv]*(1+st.lv*.12); st.sc+=Math.round(rate*.5*(.5+Math.random()));
    if(Math.random()<{facile:.004,normal:.006,difficile:.009}[lv]){ st.lv++; st.sc+=200+st.li*50; }
    if(Math.random()<{facile:.006,normal:.004,difficile:.0025}[lv]){ st.li--; if(st.li<=0) st.al=false; } L.dirty=true; });
  S.left=S.dur?Math.max(0,Math.round(L.end-now)):0;
  const hum=S.players.map((P,i)=>i).filter(i=>!ARC.bot(S.players[i])); const watch=hum.length?hum:S.players.map((_,i)=>i);
  if((S.dur&&now>=L.end)||watch.every(i=>!S.st[i].al)){ S.phase='over'; L.dirty=true; emit({t:'over'}); } }
/* ---------- commandes ---------- */
const pos=e=>{ const r=$('#cv').getBoundingClientRect(); return [(e.clientX-r.left)/r.width*VW,(e.clientY-r.top)/r.height*VH]; };
let pid=null, downAt=0;
$('#cv').addEventListener('pointerdown',e=>{ if(ARC.blocked()) return; e.preventDefault(); pid=e.pointerId; try{ $('#cv').setPointerCapture(pid); }catch(x){} downAt=performance.now(); if(M) M.tx=pos(e)[0]; });
$('#cv').addEventListener('pointermove',e=>{ if(!M) return; if(e.pointerType==='mouse'||e.pointerId===pid) M.tx=pos(e)[0]; });
const endP=()=>{ if(pid!=null&&M&&M.stuck&&performance.now()-downAt<400) launch(); pid=null; }; $('#cv').addEventListener('pointerup',endP); $('#cv').addEventListener('pointercancel',()=>pid=null);
$('#cv').addEventListener('touchmove',e=>{ if(!ARC.blocked()) e.preventDefault(); },{passive:false});
let kd=0; addEventListener('keydown',e=>{ if(ARC.blocked()||e.target.closest('input,textarea')) return; if(e.code==='ArrowLeft'||e.code==='KeyA'||e.code==='KeyQ'){ kd=-1; e.preventDefault(); } else if(e.code==='ArrowRight'||e.code==='KeyD'){ kd=1; e.preventDefault(); } else if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); launch(); } });
addEventListener('keyup',e=>{ if(['ArrowLeft','ArrowRight','KeyA','KeyQ','KeyD'].includes(e.code)) kd=0; });
/* ---------- affichage ---------- */
function draw(now){ const ctx=cv.begin(), S=host()?G:snap.cur, t=now/1000;
  const gr=ctx.createLinearGradient(0,0,0,VH); gr.addColorStop(0,'#1a1030'); gr.addColorStop(1,'#2a0f1a'); ctx.fillStyle=gr; ctx.fillRect(0,0,VW,VH);
  ctx.strokeStyle='#ffffff08'; for(let x=0;x<VW;x+=24){ ctx.beginPath(); ctx.moveTo(x,26); ctx.lineTo(x,VH); ctx.stroke(); }
  if(!S||!M){ ARC.text(ctx,'Casse-briques',VW/2,220,44,'#ffd2a8','#3a1020'); ARC.text(ctx,'Choisis un mode de jeu',VW/2,280,18,'#fff','#000');
    LV[0].forEach((r,y)=>r.split('').forEach((c,x)=>{ if(c!=='.') brick(ctx,{x:BX0+x*BW,y:340+y*BH,c,h:1}); })); return; }
  ctx.save(); if(M.shake>0){ M.shake-=1/60; ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*6); }
  M.bricks.forEach(k=>brick(ctx,k));
  M.parts.forEach(p=>{ ctx.globalAlpha=Math.min(1,p.t*2); ctx.fillStyle=p.c; ctx.fillRect(p.x-2,p.y-2,4,4); }); ctx.globalAlpha=1;
  M.caps.forEach(c=>{ const [col]=PW[c.t]; ctx.fillStyle=col; ARC.rrect(ctx,c.x-15,c.y-7,30,14,7); ctx.fill(); ARC.text(ctx,c.t==='R'?'S':c.t,c.x,c.y+1,11,'#fff','#0006'); });
  const w=pwidth(); const pg=ctx.createLinearGradient(0,PYP-PH/2,0,PYP+PH/2); pg.addColorStop(0,'#fff'); pg.addColorStop(1,M.pw.L?'#3fd06a':'#ff7a2e');
  ctx.fillStyle=pg; ctx.shadowColor='#ff7a2e'; ctx.shadowBlur=12; ARC.rrect(ctx,M.px-w/2,PYP-PH/2,w,PH,6); ctx.fill(); ctx.shadowBlur=0;
  M.balls.forEach(b=>{ ctx.fillStyle=M.pw.F?'#ffb02e':'#fff'; ctx.shadowColor=M.pw.F?'#ff5a00':'#fff'; ctx.shadowBlur=M.pw.F?18:8; ctx.beginPath(); ctx.arc(b.x,b.y,BR,0,7); ctx.fill(); ctx.shadowBlur=0; });
  ctx.restore();
  /* bandeau du haut */
  ctx.fillStyle='#0008'; ctx.fillRect(0,0,VW,26); ARC.text(ctx,`${M.sc}`,10,13,16,'#fff',null,'left'); ARC.text(ctx,`Niveau ${M.lv+1}`,VW/2,13,15,'#ffd2a8');
  ARC.text(ctx,'♥'.repeat(Math.max(0,M.li)),VW-10,13,15,'#ff5a8a',null,'right');
  const pws=Object.keys(M.pw); if(pws.length) ARC.text(ctx,pws.map(k=>PW[k][1]+' '+Math.ceil(M.pw[k])).join(' · '),VW/2,40,12,'#fff','#0008');
  if(S.dur&&S.phase==='play'){ const left=host()?S.left:Math.max(0,S.left-(now-snap.t)); ARC.text(ctx,`⏱ ${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`,VW-70,13,14,'#ffe066',null,'right'); }
  if(S.phase==='count'){ const ms=host()?L.t0-now:(RDY.t0-now); const n=Math.max(1,Math.ceil(ms/1000)); ARC.text(ctx,String(n),VW/2,330,80,'#ffe066','#0008'); if(n!==draw.n){ draw.n=n; sfx('beep'); } } else draw.n=null;
  if(S.phase==='play'&&M.al&&M.stuck) ARC.text(ctx,ARC.coarse?'Touche pour lancer la balle':'Clic ou espace pour lancer',VW/2,PYP-60,15,'#fff','#0008');
  if(!M.al&&S.phase!=='over') ARC.text(ctx,S.players.length>1?'Plus de vies : regarde la fin de la course':'Partie terminée',VW/2,330,17,'#fff','#000a'); }
function brick(ctx,k){ const [a,b]=BC[k.c]; const g=ctx.createLinearGradient(0,k.y,0,k.y+BH); g.addColorStop(0,a); g.addColorStop(1,b); ctx.fillStyle=g; ARC.rrect(ctx,k.x+1.5,k.y+1.5,BW-3,BH-3,3); ctx.fill();
  ctx.fillStyle='#ffffff55'; ctx.fillRect(k.x+3,k.y+3,BW-6,2); if(k.c==='S'&&k.h===1){ ctx.strokeStyle='#0006'; ctx.beginPath(); ctx.moveTo(k.x+8,k.y+3); ctx.lineTo(k.x+14,k.y+9); ctx.lineTo(k.x+20,k.y+5); ctx.stroke(); } }
function hud(){ const S=host()?G:snap.cur; window.ARC_PLAYING=!!(S&&S.phase==='play'); const me=ARC.seat();
  if(!S){ ARC.status('Casse-briques','Choisis un mode : seul ou en course.','#ff7a2e'); $('#board').innerHTML=''; return; }
  const P=me!=null?S.players[me]:null;
  ARC.status(P?esc(P.name):'Spectateur',S.phase==='over'?'Partie terminée':S.phase==='count'?'Prêt ?':M&&M.al?'casse toutes les briques !':'plus de vies',P?P.col:'#ff7a2e',S.players.length>1?'Course':'Seul');
  const rows=S.players.map((p,i)=>{ const st=i===me&&M?{sc:M.sc,lv:M.lv,li:M.li,al:M.al}:S.st[i]; return {name:p.name,col:p.col,me:i===me,out:!st.al,score:st.sc,tag:`niv. ${st.lv+1}`}; });
  rows.sort((a,b)=>b.score-a.score); ARC.board($('#board'),rows); }
function onEvent(e){ if(e.t==='go'){ sfx('go'); } else if(e.t==='over') setTimeout(showEnd,500); }
function showEnd(){ const S=host()?G:snap.cur; if(!S||S.phase!=='over') return; const me=ARC.seat(); if(M&&me!=null) S.st[me]={sc:M.sc,lv:M.lv,li:M.li,al:M.al};
  const r=S.players.map((p,i)=>({name:p.name,col:p.col,me:i===me,sc:S.st[i].sc,lv:S.st[i].lv})).sort((a,b)=>b.sc-a.sc);
  const mine=r.find(x=>x.me); const solo=r.length===1; if(solo&&mine){ const best=Math.max(load('casse-briques-best')||0,mine.sc); store('casse-briques-best',best); }
  const won=!solo&&r[0].me; if(won){ sfx('win'); confetti([r[0].col,'#fff','#ffe066']); }
  if(mine&&window.PROF) PROF.result('casse-briques',{win:won,score:mine.sc});
  ARC.endBox(solo?`${mine.sc} points`:`${r[0].name} gagne !`,r.map(x=>Object.assign(x,{score:`${x.sc} · niv. ${x.lv+1}`})),()=>startLocal(),mine?{j:'casse-briques',score:mine.sc}:null); }
/* ---------- boucle ---------- */
let RDY={gid:null,t0:0};
ARC.loop((dt,now)=>{ const S=host()?G:snap.cur; ARC.idle=!S||S.phase==='over';
  if(S&&RDY.gid!==S.gid){ RDY={gid:S.gid,t0:host()?L.t0:now+(S.phase==='count'?2900:0)}; newField(S.seed); report(true); }
  if(M&&kd) M.tx=Math.max(0,Math.min(VW,M.px+kd*60));
  if(S&&S.phase==='play') stepField(dt,now); if(S&&now-lastRep>1500) report(true);
  if(G&&host()){ hostStep(now,dt); if(ARC.net()){ if(G.phase==='over'){ if(draw.over!==G.gid){ draw.over=G.gid; ARC.push(G,0,true); } } else if(L.dirty){ if(ARC.push(G,200)) L.dirty=false; } else ARC.push(G,1000); } }
  if(S) ARC.events(S,onEvent); draw(now); hud(); });
/* ---------- menu, options ---------- */
const BOTS=['Ada','Hal','Pixel','Nova','Atlas'];
function startLocal(){ const me=(typeof HALL!=='undefined'&&HALL.pseudo)||'Toi'; const list=[{name:me}]; for(let i=0;i<OPT.bots;i++) list.push({ai:true,name:BOTS[i],level:OPT.level}); newGame(list); }
function optsHTML(local){ const sg=(k,vals)=>`<div class="seg">${vals.map(([v,l])=>`<button class="${String(OPT[k])===String(v)?'on':''}" data-o="${k}:${v}">${l}</button>`).join('')}</div>`;
  return `<h4>Durée de la course (à plusieurs)</h4>${sg('dur',[[120,'2 min'],[180,'3 min'],[300,'5 min'],[0,'Sans limite']])}<p class="optnote">Seul, tu joues jusqu’à ta dernière vie.</p>
   ${local?`<h4>Adversaires de l’ordinateur</h4>${sg('bots',[[0,'Aucun'],[1,'1'],[2,'2'],[3,'3']])}${OPT.bots?sg('level',[['facile','facile'],['normal','normal'],['difficile','difficile']]):''}`:''}`; }
function setOpt(b){ const [k,v]=b.dataset.o.split(':'); OPT[k]=/^\d+$/.test(v)?+v:v; store('casse-briques-opt',OPT); }
function menu(){ const best=load('casse-briques-best'); const draw=()=>{ openModal(`<h2>Casse-briques</h2><p>Dix niveaux de briques, des bonus qui tombent, et trois vies. À plusieurs, tout le monde joue les mêmes niveaux en même temps : le meilleur score gagne.</p>
   <div class="bigchoice"><button class="pri" data-m="online"><b>Course en ligne</b><small>Avec tes amis connectés, chacun sur son écran.</small></button><button data-m="solo"><b>Jouer ici</b><small>Seul${OPT.bots?' ou contre l’ordinateur':''}.${best?` Record : ${best}.`:''}</small></button></div>
   <div class="opts">${optsHTML(true)}<h4>Réglages</h4>${window.PROF?PROF.optsHTML():''}</div><div class="acts">${G?'<button class="btn" data-c="close">Fermer</button>':''}</div>`,e=>{ const o=e.target.closest('[data-o]'); if(o){ setOpt(o); draw(); return; }
   const m=e.target.closest('[data-m]'); if(!m) return; closeModal(); if(m.dataset.m==='online') NET.startUI(); else startLocal(); }); if(window.PROF) PROF.bindOpts($('#mbox')); };
  ARC.tuto('casse-briques',[['🧱','Casse les briques','Renvoie la balle avec ta raquette pour casser toutes les briques du niveau. Les argentées demandent deux coups, les dorées sont incassables.'],['👆','Commandes','La raquette suit ton doigt ou ta souris (ou les flèches). Touche l’écran ou appuie sur espace pour lancer la balle.'],['🎁','Bonus','Attrape les capsules : grande raquette, multi-balle, balle lente, vie en plus, balle de feu qui traverse tout.']],draw); }
function help(){ helpTabs('Casse-briques',[['Règles','<ul><li>Renvoie la balle avec ta raquette pour casser toutes les briques. Quand il n’en reste plus (hors briques dorées), tu passes au niveau suivant.</li><li>Briques de couleur : un coup. <b>Argentées</b> : deux coups. <b>Dorées</b> : incassables.</li><li>Si la balle tombe sous la raquette, tu perds une vie. Tu commences avec 3 vies.</li><li>La balle part en biais quand elle touche le bord de la raquette.</li></ul>'],
  ['Bonus','<ul><li><b>L</b> : grande raquette (15 s).</li><li><b>M</b> : deux balles en plus.</li><li><b>S</b> : balle lente (10 s).</li><li><b>V</b> : une vie en plus.</li><li><b>F</b> : balle de feu, elle traverse les briques (8 s).</li></ul>'],
  ['À plusieurs','<p>Chacun joue sur son propre écran, avec les mêmes niveaux et les mêmes bonus. Le classement se met à jour en direct. À la fin du temps (ou quand tout le monde a perdu ses vies), le meilleur score gagne.</p>']]); }
window.GAME={help,menu,state:()=>G};
document.addEventListener('sdj-opts',e=>{ if(e.detail.k==='cb'&&G) ARC.recolor(G.players); });
window.NETGAME={id:'casse-briques',title:'Casse-briques',min:1,max:8,
  rules:()=>`<div class="opts">${optsHTML(false)}</div>`, rulesClick(e){ const b=e.target.closest('[data-o]'); if(!b) return false; setOpt(b); return true; },
  start(list){ closeModal(); newGame(list); NET.push(null,'new'); }, state:()=>G, busy:()=>false, resume(){},
  wire:ARC.wirer({stat:['players']}),
  adopt(){ if(!G) return; const now=performance.now(); L={t0:now+(G.phase==='count'?2000:0),end:now+(G.left||0),bots:{},dirty:true}; if(G.phase==='count'){ G.phase='count'; } },
  demoted(){ snap.reset(G); },
  act(seat,fn,args){ if(!G||fn!=='s'||!G.st[seat]) return false; const [sc,lv,li,al]=args.map(Number); G.st[seat]={sc,lv,li,al:!!al}; L.dirty=true; return true; },
  async receive(m){ if(m.kind==='lobby'){ G=null; snap.reset(null); return; } const S=m.G; if(!S||!ARC.fill(S,['players'])) return; ARC.recolor(S.players); if(!snap.cur||snap.cur.gid!==S.gid||m.kind==='new'){ closeModal(); snap.reset(S); } else snap.push(S); G=S; },
  leave(){ G=null; L=null; M=null; snap.reset(null); RDY={gid:null,t0:0}; menu(); } };
const skip=/[?&](salle|creer)=/.test(location.search)||(()=>{ const s=load('net-sess'); return s&&s.game==='casse-briques'&&!s.host; })(); setTimeout(()=>{ if(!G&&!NET.on&&!skip) menu(); },60);
})();
