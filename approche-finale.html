<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Approche finale</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/* Cockpit de nuit : tableau de bord en trois colonnes (pilote | instruments | copilote), pistes d'approche et d'altitude au-dessus, plateau de dés en bas */
:root{--bg:#0b111c;--fg:#e6edf7;--mute:#8d9bb3;--panel:#1a2230;--panel2:#121925;--line:#2c374a;--pil:#3d86f2;--pilD:#1d4f9e;--cop:#f28c2c;--copD:#a65612;--ok:#3fe08c;--warn:#ffcf4a;--red:#ff5b5f;--sky:#2a5d8f;--accent:#2fb3a4;--title:"Chakra Petch","Segoe UI",system-ui,sans-serif;--ui:"Nunito Sans",system-ui,sans-serif;--titlec:#f2f6fc;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui,"Nunito Sans",system-ui,sans-serif);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar,#0006);border-bottom:1px solid #fff2;flex-wrap:wrap}
.top h1{font-family:var(--title,Georgia,serif);font-weight:800;font-size:24px;margin:0;color:var(--titlec,#fff);letter-spacing:.5px}
.top h1 small{font-family:var(--ui);font-weight:600;font-size:13px;opacity:.75;margin-left:8px;letter-spacing:0}
.back{color:inherit;opacity:.9;text-decoration:none;font-size:14px;border:1px solid #fff4;padding:5px 10px;border-radius:8px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#ffffff1c;color:inherit;border:1px solid #ffffff40;border-radius:9px;padding:7px 12px;font-size:14px;font-weight:700}
.btn:hover{background:#ffffff2e}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:#fff;color:#222}
.status{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--pc,var(--accent));color:#fff;font-weight:800;min-height:44px;box-shadow:0 4px 14px #0005;transition:background .35s;flex-wrap:wrap}
.status .who{font-family:var(--title,Georgia,serif);font-size:19px}
.status .msg{font-weight:600}
.status .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
#modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:12px}
#modal[hidden]{display:none}
.mbox{background:#fbf6ea;color:#2a2418;border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox h2{font-family:var(--title,Georgia,serif);font-size:26px;margin:0 0 6px}
.mbox h4{font-family:var(--title,Georgia,serif);font-size:16px;margin:14px 0 6px}
.mbox p,.mbox li{line-height:1.5}
.mbox .btn{background:#ece3cf;color:#2a2418;border-color:#c9b98f}
.mbox .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.mbox .btn.on{background:#2a2418;color:#fff}
.seg{display:inline-flex;border:1px solid #c9b98f;border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#f6efdc;padding:7px 11px;font-weight:700;color:#2a2418;font-size:13.5px}
.seg button.on{background:#2a2418;color:#fff}
.prow{display:flex;gap:8px;align-items:center;margin:7px 0;flex-wrap:wrap}
.prow .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);border:2px solid #0004}
.prow input[type=text]{font-family:inherit;font-weight:700;font-size:16px;padding:6px 9px;border-radius:8px;border:1px solid #c9b98f;background:#fff;color:#2a2418;-webkit-text-fill-color:#2a2418;caret-color:var(--accent);width:150px;color-scheme:light}
.prow input[type=text]::placeholder{color:#a3926e;-webkit-text-fill-color:#a3926e;font-weight:600}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button{border:1px solid #c9b98f;background:#f6efdc;border-radius:20px;padding:5px 12px;font-weight:800;color:#2a2418}
.tabs button.on{background:#2a2418;color:#fff}
.toast{position:fixed;left:50%;top:100px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #000a;z-index:70;font-weight:700;animation:toast 2.6s forwards;pointer-events:none;max-width:90vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.bannerx{position:fixed;inset:0;display:grid;place-items:center;z-index:65;pointer-events:none}
.bannerx div{font-family:var(--title,Georgia,serif);font-weight:800;font-size:clamp(30px,6vw,64px);color:#fff;background:var(--bc,var(--accent));padding:10px 36px;border-radius:14px;box-shadow:0 20px 50px #000a;animation:ban 2.3s forwards;text-align:center}
.bannerx small{display:block;font-family:var(--ui);font-size:.34em;font-weight:700}
@keyframes ban{0%{transform:scale(2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.92)}}
#cover{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);text-align:center;padding:20px}
#cover[hidden]{display:none}
#cover h2{font-family:var(--title,Georgia,serif);font-size:36px;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}

body{background:radial-gradient(ellipse at 50% -10%,#1d2c45 0%,#0b111c 60%) fixed,#0b111c;color:var(--fg)}
.top h1 small{font-family:var(--ui)}
.status{gap:10px}
.phase{display:inline-flex;align-items:center;gap:7px;font-family:var(--title);font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:#0005;border:1px solid #fff4}
.phase i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.phase.sil i{background:var(--red);box-shadow:0 0 8px var(--red);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.ck{display:flex;flex-direction:column;gap:10px;padding:10px max(12px,env(safe-area-inset-right,0px)) 120px max(12px,env(safe-area-inset-left,0px));max-width:1180px;margin:0 auto}
/* pistes */
.strips{display:grid;grid-template-columns:3fr 2fr;gap:10px}
.strip{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px;min-width:0}
.slab{font-family:var(--title);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:6px;display:flex;gap:8px;align-items:baseline}
.slab b{color:var(--fg);letter-spacing:.04em;text-transform:none;font-size:13px}
.appr{position:relative;display:flex;gap:3px}
.ac{flex:1;min-width:0;height:78px;border-radius:8px;background:linear-gradient(#2a5d8f55,#1c3b5c33);border:1px solid #ffffff14;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;gap:2px}
.ac .ix{font-family:var(--title);font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.ac.cur{background:linear-gradient(#3d86f244,#1c3b5c55);border-color:#9cc2ff88}
.ac.past{opacity:.38}
.ac.apt{background:repeating-linear-gradient(90deg,#3a3f48 0 6px,#2f343c 6px 12px);border-color:#ffffff30}
.ac.apt::after{content:"";position:absolute;left:50%;top:20px;bottom:6px;width:3px;margin-left:-1.5px;background:repeating-linear-gradient(#f2f2f2 0 6px,transparent 6px 12px)}
.ac .pls{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;max-width:100%;position:relative;z-index:1}
.tok{width:18px;height:18px;transition:transform .5s,opacity .5s}
.tok.gone{transform:translateY(-30px) scale(.4) rotate(40deg);opacity:0}
.ac .tdie{position:absolute;right:3px;bottom:3px;width:14px;height:14px;border-radius:3px;background:#111;border:1px solid #888;display:grid;place-items:center;font-size:9px;color:#fff;font-weight:800}
.ac .trn{position:absolute;left:2px;right:2px;bottom:3px;font-size:10px;font-weight:800;text-align:center;color:var(--warn);background:#0007;border-radius:4px;line-height:1.3;white-space:nowrap;overflow:hidden}
.ac.hl{outline:2px dashed var(--ok);outline-offset:-3px;cursor:pointer}
#plane{position:absolute;bottom:20px;width:34px;height:34px;margin-left:-17px;transition:left .8s cubic-bezier(.5,0,.3,1.2);z-index:3;filter:drop-shadow(0 3px 4px #000a);pointer-events:none}
.alti{display:flex;gap:3px}
.al{flex:1;min-width:0;height:78px;border-radius:8px;background:#ffffff08;border:1px solid #ffffff14;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px;font-family:var(--title);font-variant-numeric:tabular-nums}
.al .ft{font-size:13px;font-weight:700}
.al small{font-size:9px;color:var(--mute)}
.al.cur{background:linear-gradient(#2fb3a455,#2fb3a422);border-color:var(--accent);box-shadow:0 0 12px #2fb3a455}
.al.past{opacity:.3}
.al .fp{width:14px;height:14px;border-radius:50%}
.rr{width:16px;height:16px}
/* tableau de bord */
.panel{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;background:linear-gradient(#232c3b,#161d29);border:1px solid #3a4558;border-radius:16px;padding:12px;box-shadow:inset 0 1px 0 #ffffff1a,0 14px 40px #0009}
.panel.shake{animation:shake .6s}
@keyframes shake{20%{transform:translate(-8px,3px) rotate(-.6deg)}40%{transform:translate(7px,-2px) rotate(.5deg)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,0)}}
.pcol,.pcen{display:flex;flex-direction:column;gap:10px;min-width:0}
.grp{background:#0e141e;border:1px solid #2a3446;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.gt{font-family:var(--title);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:6px}
.gt em{font-style:normal;font-family:var(--ui);letter-spacing:0;text-transform:none;font-size:12px;color:var(--fg)}
.who-h{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;font-family:var(--title);font-weight:700;font-size:15px;min-width:0}
.who-h .nm2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-h.P{background:linear-gradient(90deg,var(--pilD),transparent)}
.who-h.C{background:linear-gradient(90deg,var(--copD),transparent)}
.who-h .hid{margin-left:auto;display:flex;gap:2px}
.who-h .hid i{width:12px;height:12px;border-radius:3px;background:#ffffff30;border:1px solid #ffffff50}
.who-h.act{box-shadow:0 0 0 2px #fff6}
.row{display:flex;align-items:center;gap:8px}
.lt{width:14px;height:14px;border-radius:50%;background:#2a3140;border:2px solid #0a0e15;box-shadow:inset 0 2px 3px #0008;flex:none;transition:background .3s,box-shadow .3s}
.lt.on{background:var(--ok);box-shadow:0 0 10px var(--ok),inset 0 -2px 3px #0004}
.lt.pulse{animation:lpulse .9s}
@keyframes lpulse{0%{transform:scale(1)}40%{transform:scale(1.7)}100%{transform:scale(1)}}
.slot{width:46px;height:46px;flex:none;border-radius:10px;border:2px dashed #ffffff40;background:#ffffff06;color:var(--mute);font-family:var(--title);font-weight:700;font-size:12px;display:grid;place-items:center;padding:0;position:relative;transition:transform .15s,box-shadow .2s,border-color .2s}
.slot.sP{border-color:#3d86f288}.slot.sC{border-color:#f28c2c88}.slot.sB{border-color:#cfd8e688}
.slot.full{border-style:solid;background:transparent}
.slot.valid{border-style:solid;border-color:var(--ok);box-shadow:0 0 0 3px #3fe08c33,0 0 14px #3fe08c55;color:var(--ok);cursor:pointer;animation:glow 1.4s infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px #3fe08c22,0 0 20px #3fe08c66}}
.slot.mand::before{content:"!";position:absolute;top:-7px;right:-7px;width:16px;height:16px;border-radius:50%;background:var(--warn);color:#000;font-size:11px;display:grid;place-items:center;font-family:var(--ui);font-weight:900}
.slot .pv{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-family:var(--ui);font-weight:800;color:var(--ok);background:#000b;padding:0 5px;border-radius:5px;z-index:2}
.slot .pv.bad{color:var(--red)}
.slot.used{opacity:.45}
.sl-l{font-size:12px;color:var(--mute);flex:1;min-width:0}
/* dés */
.die{width:40px;height:40px;border-radius:9px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;gap:1px;box-shadow:inset 0 -3px 0 #0003,0 3px 6px #0007;flex:none}
.die.dP{background:linear-gradient(145deg,#5a9cff,#2c6fd6)}
.die.dC{background:linear-gradient(145deg,#ffa652,#e2751a)}
.die span{border-radius:50%;background:#fff;align-self:center;justify-self:center;width:7px;height:7px;opacity:0}
.die span.on{opacity:1}
.die.adj{box-shadow:0 0 0 3px #fff,0 3px 6px #0007}
.die.rolling{animation:roll .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes roll{0%{transform:rotate(-200deg) scale(.4) translateY(-30px)}100%{transform:none}}
.slot .die{width:38px;height:38px;padding:5px}
.fly{position:fixed;z-index:80;pointer-events:none;transition:transform .45s cubic-bezier(.4,0,.2,1.15)}
/* axe */
.axw{display:flex;align-items:center;justify-content:center;gap:8px}
.axsvg{width:min(170px,40vw);height:auto;max-width:100%}
#axPlane{transition:transform .9s cubic-bezier(.4,1.6,.5,1);transform-origin:0 0}
#windN{transition:transform .7s cubic-bezier(.4,1.6,.5,1);transform-origin:0 0}
/* vitesse */
.spd{position:relative;display:grid;grid-template-columns:repeat(11,1fr);gap:2px;padding-top:14px}
.spd div{height:26px;border-radius:4px;display:grid;place-items:center;font-family:var(--title);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;background:#ffffff0c;color:var(--mute);transition:background .4s}
.spd div.z1{background:#3d86f233;color:#cfe0ff}
.spd div.z2{background:#f28c2c33;color:#ffe2c6}
.spd div.ok{background:#3fe08c33;color:#c9ffe0}
.spd div.ko{background:#ff5b5f22;color:#ffb3b5}
.spd div.hit{box-shadow:0 0 0 2px #fff;color:#fff}
.mk{position:absolute;top:0;width:12px;margin-left:-6px;height:44px;transition:left .7s cubic-bezier(.4,1.5,.5,1);pointer-events:none}
.mk::before{content:"";position:absolute;left:3px;top:0;border:6px solid transparent;border-top:10px solid currentColor;transform:translateX(-3px)}
.mk::after{content:"";position:absolute;left:5px;top:10px;bottom:0;width:2px;background:currentColor}
.mk.b{color:var(--pil)}.mk.o{color:var(--cop)}.mk.r{color:var(--red)}
.legend{font-size:12px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
.legend b{color:var(--fg)}
.pair{display:flex;justify-content:space-between;align-items:center;gap:6px}
.toks{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.cup{width:22px;height:22px;transition:transform .3s,opacity .3s}
.cup.off{opacity:.18}
.cup.new{animation:pop2 .5s}
@keyframes pop2{0%{transform:scale(0)}60%{transform:scale(1.4)}}
.fuel{height:12px;border-radius:6px;background:#ffffff12;overflow:hidden;flex:1}
.fuel i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--warn) 30%,var(--ok));transition:width .8s}
.chrono{font-family:var(--title);font-size:26px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.chrono.low{color:var(--red);animation:blink .6s infinite}
/* plateau de dés */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(#0e1521f0,#090d15);border-top:1px solid #3a4558;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));box-shadow:0 -10px 30px #000a}
.trin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tdice{display:flex;gap:10px}
.tdice button{background:none;border:0;padding:4px;border-radius:12px;transition:transform .15s}
.tdice button.sel{background:#ffffff22;transform:translateY(-5px)}
.tdice button.rs{background:#ffcf4a33;outline:2px solid var(--warn)}
.tdice button.dead{opacity:.45}
.tdice .die{width:46px;height:46px;padding:7px}
.tdice .die span{width:8px;height:8px}
.tctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.thint{font-size:13px;color:var(--mute);flex:1;min-width:160px}
.thint b{color:var(--fg)}
.cof{display:inline-flex;align-items:center;gap:4px;border:1px solid #ffffff30;border-radius:10px;padding:2px}
.cof button{width:34px;height:34px;border-radius:8px;border:0;background:#ffffff18;color:#fff;font-size:20px;font-weight:800}
.cof button:disabled{opacity:.3}
.cof span{min-width:62px;text-align:center;font-size:12px;font-weight:700}
/* modales et écrans */
.mbox h2{font-family:var(--title)}
.scl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:8px 0}
.scc{text-align:left;border:2px solid #d9cba6;background:#fff9ec;border-radius:12px;padding:9px 11px;color:#2a2418;display:flex;flex-direction:column;gap:3px}
.scc.on{border-color:#1b5f9e;background:#e6f0fb;box-shadow:0 0 0 2px #1b5f9e33}
.scc b{font-family:var(--title);font-size:16px}
.scc .st{color:#c08a12;letter-spacing:2px}
.scc .tg{display:flex;gap:4px;flex-wrap:wrap}
.scc .tg span,.mtag{font-size:11px;font-weight:800;background:#2a241812;border-radius:10px;padding:1px 7px}
.scc .won{color:#1d8a4e;font-weight:800;font-size:12px}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.kit div{background:#fff;border:1px solid #e2d6b8;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:13px;animation:kitin .45s backwards}
.kit div b{font-size:13px}
.kit div small{color:#6d6250;font-size:11.5px;line-height:1.3}
.kit svg{width:96px;height:58px}
@keyframes kitin{from{transform:translateY(12px) scale(.9);opacity:0}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.cardx{border:2px solid #d9cba6;background:#fff;border-radius:10px;padding:8px;text-align:left;color:#2a2418}
.cardx.on{border-color:#1d8a4e;background:#e8f7ee}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid #c9b98f;background:#f6efdc;border-radius:18px;padding:7px 12px;font-weight:700;color:#2a2418;font-size:14px}
.chips button.on{background:#1b5f9e;color:#fff;border-color:#1b5f9e}
.radio{background:#14202f;color:#e6edf7;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14.5px}
.radio p{margin:3px 0}
.radio .h{font-family:var(--title);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7fd8cc}
.sit{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin:6px 0}
.sit div{background:#efe6d0;border-radius:8px;padding:6px 8px;font-size:13px}
.sit b{display:block;font-family:var(--title);font-size:16px}
#cover{background:radial-gradient(circle at 50% 30%,#1d2c45,#070b12);color:var(--fg)}
#cover .cv{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:420px}
#cover .ph{font-family:var(--title);letter-spacing:.2em;color:var(--red);font-size:14px}
.prow input[type=text]{font-size:16px}
@media (max-width:820px){
  .strips{grid-template-columns:1fr}
  .panel{grid-template-columns:1fr 1fr;grid-template-areas:"m m" "p c";padding:8px;gap:8px}
  .pcen{grid-area:m}.pcol.pil{grid-area:p}.pcol.cop{grid-area:c}
  .ac,.al{height:64px}
  .tok{width:14px;height:14px}
  #plane{width:28px;height:28px;margin-left:-14px;bottom:16px}
  .grp{padding:7px}

<script>/*NETJS*//* ===== Hall de la Salle de jeux : joueurs connectés, pseudos uniques, tables ouvertes, invitations (Supabase Realtime, sans base) ===== */
const HALL=(()=>{
 const SB_URL='https://evepcodcppxpufbkuflq.supabase.co', SB_KEY='sb_publishable_iUC6966SeFt_05Iac1wGQw_yDo9zl7y';
 const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';

 const GAMES={"derniere-carte":"Dernière carte","quitte-ou-sept":"Quitte ou Sept","joyaux-renaissance":"Joyaux de la Renaissance","sept-merveilles":"Sept Merveilles","echecs":"Échecs","quatre-en-ligne":"Quatre en ligne","reversi":"Reversi","dames":"Dames","bataille-navale":"Bataille navale","code-secret":"Code Secret","bataille":"La Bataille","petits-chevaux":"Petits Chevaux","dominos":"Dominos","tetes-de-boeuf":"Têtes de Bœuf","plus-bas":"Plus Bas","petit-bac":"Petit Bac","poker":"Poker","president":"Président","tarot":"Tarot","rami":"Rami voleur","remparts":"Remparts","conquete":"Conquête","approche-finale":"Approche finale","duel-des-joyaux":"Duel des Joyaux"};
 const q=s=>document.querySelector(s), es=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const ld=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, sv=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
 const note=s=>{ if(typeof toast==='function') return toast(s); const t=document.createElement('div'); t.className='hall-toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); };
 const H={note,ready:false,ok:null,pseudo:ld('net-name')||'',peers:{},me:{},listeners:[],page:'',title:''};
 let cid=ld('net-cid'); if(!cid){ cid=Math.random().toString(36).slice(2,10); sv('net-cid',cid); } H.cid=cid;
 const key=p=>String(p||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[^a-z0-9]/g,'');
 H.key=key;
 let client=null, ch=null, libP=null, syncedP=null, syncRes=null, at=ld('net-at')||Date.now();
 function lib(){ if(window.supabase) return Promise.resolve(); if(libP) return libP; libP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=LIB; s.onload=res; s.onerror=()=>{ libP=null; rej(new Error('lib')); }; document.head.appendChild(s); }); return libP; }
 H.client=async()=>{ await lib(); if(!client) client=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}}); return client; };
 /* ---------- connexion au hall ---------- */
 H.connect=async()=>{ if(ch) return syncedP; syncedP=new Promise(r=>syncRes=r);
   try{ await H.client(); }catch(e){ H.ok=false; paint(); return syncedP; }
   ch=client.channel('salle:hall',{config:{broadcast:{self:false},presence:{key:H.cid}}});
   ch.on('presence',{event:'sync'},onSync);
   ch.on('broadcast',{event:'inv'},({payload:p})=>{ if(p.to===H.cid) invited(p); });
   ch.on('broadcast',{event:'invr'},({payload:p})=>{ if(p.to===H.cid) note(p.ok?`${p.fromP} arrive à ta table`:`${p.fromP} ne peut pas jouer maintenant`); });
   const to=setTimeout(()=>{ if(H.ok==null){ H.ok=false; paint(); syncRes(); } },9000);
   ch.subscribe(async st=>{ if(st==='SUBSCRIBED'){ clearTimeout(to); H.ok=true; await track(); setTimeout(()=>syncRes(),900); paint(); } else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ if(H.ok==null){ H.ok=false; paint(); syncRes(); } } });
   return syncedP; };
 function payload(){ return Object.assign({p:H.pseudo,k:key(H.pseudo),at,g:H.page,gt:H.title},H.me); }
 async function track(){ if(!ch) return; try{ await ch.track(payload()); }catch(e){} }
 function onSync(){ const st=ch.presenceState(), peers={}; for(const k in st){ const m=st[k][st[k].length-1]; if(m) peers[k]=m; } H.peers=peers;
   // doublon de pseudo : le plus récent cède la place
   if(H.pseudo){ const mk=key(H.pseudo); for(const k in peers){ if(k===H.cid) continue; const o=peers[k]; if(o.p&&o.k===mk&&(o.at<at||(o.at===at&&k<H.cid))){ const old=H.pseudo; H.pseudo=''; sv('net-name',null); track(); note(`Le pseudo « ${old} » est déjà utilisé par quelqu’un d’autre`); setTimeout(()=>H.askPseudo(),300); break; } } }
   paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); }
 H.onChange=f=>H.listeners.push(f);
 H.set=o=>{ Object.assign(H.me,o); track(); };
 H.where=(page,title)=>{ H.page=page; H.title=title; track(); };
 H.list=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&m.p).map(([k,m])=>Object.assign({cid:k},m)).sort((a,b)=>a.p.localeCompare(b.p));
 H.count=()=>Object.keys(H.peers).length;

 H.free=p=>{ const k=key(p); return !Object.entries(H.peers).some(([c,m])=>c!==H.cid&&m.p&&m.k===k); };
 H.anon=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&!m.p).length;
 /* ---------- pseudo ---------- */
 H.setPseudo=async p=>{ p=String(p||'').replace(/\s+/g,' ').trim(); if(p.length<2||p.length>16||key(p).length<2) return 'Entre 2 et 16 caractères (lettres ou chiffres).';

   H.pseudo=p; at=Date.now(); sv('net-at',at); sv('net-name',p); await track(); paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); return null; };
 H.ensure=()=>H.pseudo?Promise.resolve(H.pseudo):new Promise(res=>H.askPseudo(res));
 H.askPseudo=(cb)=>{ openBox(`<h2>Ton pseudo</h2><p>Il s’affiche pour les autres joueurs connectés. Deux personnes en ligne ne peuvent pas avoir le même.</p>
   <input class="hall-in" id="hallPseudo" maxlength="16" placeholder="Ex. : Mushu" value="${es(H.pseudo||ld('net-last')||'')}"><p class="hall-err" id="hallErr"></p>
   <div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button><button class="hall-btn pri" data-hl="ok">Valider</button></div>`,async e=>{ const b=e.target.closest('[data-hl]'); if(!b) return; if(b.dataset.hl==='close'){ closeBox(); return; }
     const v=q('#hallPseudo').value; b.disabled=true; const err=await H.setPseudo(v); b.disabled=false; if(err){ q('#hallErr').textContent=err; return; } sv('net-last',H.pseudo); closeBox(); if(cb) cb(H.pseudo); });
   const i=q('#hallPseudo'); if(i){ i.focus(); i.onkeydown=e=>{ if(e.key==='Enter') q('[data-hl=ok]').click(); }; } };
 /* ---------- invitations ---------- */
 H.invite=(to,room)=>{ if(!ch) return; ch.send({type:'broadcast',event:'inv',payload:{to,from:H.cid,fromP:H.pseudo,g:room.g,gt:room.gt,code:room.code}}); note(`Invitation envoyée à ${(H.peers[to]||{}).p||'ce joueur'}`); };
 function invited(p){ const id='inv-'+p.code; if(q('#'+id)) return; if(typeof sfx==='function') sfx('ding');
   const d=document.createElement('div'); d.className='hall-invite'; d.id=id;
   d.innerHTML=`<b>${es(p.fromP)}</b> t’invite à jouer à <b>${es(p.gt)}</b><div class="hall-acts"><button class="hall-btn" data-i="no">Pas maintenant</button><button class="hall-btn pri" data-i="ok">Rejoindre</button></div><i class="hall-bar"></i>`;
   document.body.appendChild(d); const t=setTimeout(()=>d.remove(),30000);
   d.onclick=e=>{ const b=e.target.closest('[data-i]'); if(!b) return; clearTimeout(t); d.remove(); const ok=b.dataset.i==='ok';
     if(ch) ch.send({type:'broadcast',event:'invr',payload:{to:p.from,fromP:H.pseudo,ok}}); if(ok) H.goTable(p.g,p.code); }; }
 H.goTable=(g,code)=>{ if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined'){ NET.joinCode(code); return; } location.href=g+'.html?salle='+code; };
 H.inviteFlow=to=>{ const P=H.peers[to]; if(!P) return; const r=H.me.r;
   if(r&&r.host&&!r.started){ H.invite(to,r); return; }
   const opts=Object.entries(GAMES).sort((a,b)=>a[1].localeCompare(b[1],'fr'));
   openBox(`<h2>Inviter ${es(P.p)}</h2><p>Choisis le jeu : une table s’ouvre et l’invitation part tout de suite.</p><div class="hall-games">${opts.map(([g,t])=>`<button class="hall-btn" data-g="${g}">${es(t)}</button>`).join('')}</div><div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button></div>`,e=>{
     const b=e.target.closest('[data-g],[data-hl]'); if(!b) return; if(b.dataset.hl){ closeBox(); return; } const g=b.dataset.g; sessionStorage.setItem('hall-invite',JSON.stringify({to,g})); closeBox();
     if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined') NET.createFor(); else location.href=g+'.html?creer=1'; }); };
 H.pendingInvite=g=>{ try{ const v=JSON.parse(sessionStorage.getItem('hall-invite')||'null'); if(v&&v.g===g){ sessionStorage.removeItem('hall-invite'); return v.to; } }catch(e){} return null; };

 function where(m){ if(m.r&&m.r.started) return `joue à ${es(m.r.gt)}`; if(m.r&&m.r.host) return `ouvre une table de ${es(m.r.gt)}`; if(m.r) return `attend à une table de ${es(m.r.gt)}`; return m.gt?`regarde ${es(m.gt)}`:'sur le portail'; }
 function busy(m){ return m.r&&m.r.started; }
 H.panelHTML=(g)=>{ if(H.ok===false) return `<p class="hall-note">Le salon en ligne n’est pas joignable d’ici.${/github\.io$/.test(location.hostname)?' Vérifie ta connexion.':` Ouvre la salle sur <a href="${SITE}" target="_blank" rel="noopener">le site</a>.`}</p>`;
   if(H.ok==null) return '<p class="hall-note"><span class="hall-spin"></span>Connexion au salon…</p>';

  if(c&&c.reroll){ reroll(S,w,c.reroll,null,c.free); toast(`${ROLE[w]} (IA) relance ${c.reroll.length} dé${c.reroll.length>1?'s':''}`+(c.free?'':' · relance offerte à toi aussi')); sfx('dice'); save(); BUSY=false; render(); await wait(600); if(my===GEN) aiTurn(); return; }
  if(!c){ BUSY=false; return; }
  const v=S.dice[w][c.i].v+c.adj; await flyDie($('#hd'+w),$(`.slot[data-s="${c.s}"]`),v,w); if(my!==GEN) return;
  const ev=place(S,w,c.i,c.s,c.adj); sfx('card'); if(c.adj) toast(`${ROLE[w]} (IA) boit ${Math.abs(c.adj)} café${Math.abs(c.adj)>1?'s':''} pour ajuster son dé`);
  await after(ev,my); }
async function after(ev,my){ if(NETON()) NET.push(ev); render(); await showEvents(ev,my); if(my!==GEN) return; BUSY=false; save();
  if(S.over){ finish(); return; }
  if(ev.some(e=>e.t==='newRound')){ beginRound(); return; }
  nextTurn(); }
async function humanPlace(s){ const w=S.turn; if(BUSY||SEL<0||VIEW!==w) return; const i=SEL, adj=ADJ, v=S.dice[w][i].v+adj;
  if(!canPlace(S,w,v,s)){ sfx('error'); return; }
  if(NET.guest){ SEL=-1; ADJ=0; NET.act('place',[NET.seat,i,s,adj]); return; } BUSY=true; const my=GEN;
  const from=$(`.tdice [data-d="${i}"]`); render(); await flyDie(from,$(`.slot[data-s="${s}"]`),v,w); if(my!==GEN) return;
  SEL=-1; ADJ=0; const ev=place(S,w,i,s,adj); sfx('card'); await after(ev,my); }

function stopTimer(){ if(TIMER) clearInterval(TIMER); TIMER=null; }
function updChr(){ const c=$('#chr'); if(c){ c.textContent=Math.max(0,TLEFT)+' s'; c.classList.toggle('low',TLEFT<=10); } }
async function timeOut(){ const my=++GEN; BUSY=true; $('#cover').hidden=true; PAUSED=false; const ev=timeUp(S); await after(ev,my); }

document.addEventListener('click',async e=>{ const t=e.target.closest('[data-a],[data-d],[data-s],.ac'); if(!t||!S) return;
  if(t.dataset.a==='reveal'){ $('#cover').hidden=true; PAUSED=false; VIEW=S.turn; SEL=-1; ADJ=0; RR=null; render(); sfx('flip'); return; }
  if(t.dataset.a==='again'){ closeModal(); if(NETON()){ if(NET.host) NET.restart(); return; } const o={sc:S.sc,mode:S.mode,human:S.human,level:S.level,names:S.names,cards:scen(S.sc).cards?(S.cards||[]):[]}; startGame(o); return; }
  if(t.dataset.a==='brief'){ if(S.phase==='brief'&&!S.over) briefing(); return; }
  if(BUSY||S.over||S.phase!=='play') return; const w=S.turn; if(VIEW!==w||isAI(w)) return;
  if(t.classList.contains('ac')){ if(PICKTOUR){ const j=+t.dataset.j; if(NET.guest||useCard(S,'tour',j)){ PICKTOUR=false; $$('.ac').forEach(c=>c.classList.remove('hl')); if(NET.guest){ NET.act('card',[NET.seat,'tour',j]); return; } sfx('pop'); toast(`Contrôleur aérien : avion retiré en case ${j}`); save(); render(); } } return; }
  if(t.dataset.d!=null){ const i=+t.dataset.d; if(RR){ RR.has(i)?RR.delete(i):RR.add(i); sfx('click'); render(); return; } SEL=SEL===i?-1:i; ADJ=0; sfx('click'); render(); return; }
  if(t.dataset.s){ if(SEL<0){ toast('Choisis d’abord un dé dans ton plateau'); return; } humanPlace(t.dataset.s); return; }
  switch(t.dataset.a){
    case 'adj+': if(ADJ<S.coffee||ADJ<0) ADJ++; sfx('pop'); render(); break;
    case 'adj-': if(-ADJ<S.coffee||ADJ>0) ADJ--; sfx('pop'); render(); break;
    case 'rr': RR=new Set(); SEL=-1; ADJ=0; render(); break;
    case 'rrcancel': RR=null; render(); break;
    case 'rrgo': { const idx=[...RR], free=!!S.offer[w]; if(NET.guest){ RR=null; render(); NET.act('rr',[NET.seat,idx]); break; } reroll(S,w,idx,null,free); RR=null; sfx('dice'); save(); render(); idx.forEach(i=>{ const d=$(`.tdice [data-d="${i}"] .die`); if(d) d.classList.add('rolling'); }); toast(free?'Relance offerte utilisée':'Relance utilisée · ton équipier peut aussi relancer'); break; }
    case 'card-trim': if(NET.guest){ NET.act('card',[NET.seat,'trim']); break; } if(useCard(S,'trim')){ sfx('ding'); toast('Correction d’assiette : l’axe revient d’un cran'); save(); render(); } break;
    case 'card-tour': PICKTOUR=true; $$('.ac').forEach(c=>{ if(S.track[+c.dataset.j].p) c.classList.add('hl'); }); toast('Touche la case dont tu veux retirer un avion'); break;
  } });

   <h4>On perd aussitôt si</h4><ul><li>l’axe atteint la croix rouge (3 crans) ;</li><li>on avance alors qu’un avion occupe notre case ;</li><li>on dépasse la piste, ou on arrive au dernier palier sans la voir.</li></ul>`,
   `<ul><li><b>Axe</b> (obligatoire, un dé chacun) : l’avion penche du côté du dé le plus fort, d’autant que l’écart. L’inclinaison se cumule d’un tour à l’autre.</li>
   <li><b>Moteurs</b> (obligatoire, un dé chacun) : la somme se lit sur l’échelle de vitesse. Sous le marqueur bleu : 0 case ; entre bleu et orange : 1 case ; au-delà de l’orange : 2 cases. Au dernier tour, elle doit rester sous le marqueur rouge.</li>
   <li><b>Radio</b> (1 case pilote, 2 copilote) : la valeur du dé désigne une case (1 = la vôtre) et en retire un avion.</li>
   <li><b>Train</b> (pilote, 1·2, 3·4, 5·6) : chaque élément pousse le marqueur bleu. <b>Volets</b> (copilote, dans l’ordre) : chaque volet pousse le marqueur orange.</li>
   <li><b>Freins</b> (pilote, 2 puis 4 puis 6) : chaque frein pousse le marqueur rouge (sous 3, 5 puis 7).</li>
   <li><b>Concentration</b> : n’importe quel dé rapporte un café (3 max). Un café change la valeur d’un dé de ±1 au moment de le poser.</li>
   <li><b>Relance</b> : jeton gagné sur la piste d’altitude. Celui qui l’utilise relance les dés de son choix, puis son équipier peut faire de même.</li></ul>
   <p>Astuce : quand tu choisis un dé, les cases possibles s’allument en vert avec le résultat prévu (axe, vitesse, case radio).</p>`,
   `<p><b>Briefing</b> (bandeau vert) : avant le lancer, on discute de la stratégie, jamais des valeurs.</p><p><b>Silence radio</b> (bandeau rouge) : du lancer jusqu’à la fin du tour, aucun échange. Les dés posés parlent pour vous.</p>
   <p><b>Avec l’IA</b> : au briefing, l’IA annonce ses intentions et tu lui donnes jusqu’à 3 consignes dans une liste (accélérer, qui pose l’axe en premier, qui gère la radio, moteurs forts ou faibles…). Elle en tient compte pendant le silence.</p>
   <p><b>À deux sur un appareil</b> : un écran de passage cache les dés à chaque changement de joueur.</p>`,
   Object.values(MODS).map(m=>`<p><span class="mtag">${m.nom}</span> ${esc(m.desc)}</p>`).join('')+`<h4>Cartes atout</h4>`+Object.values(CARDS).map(c=>`<p><b>${esc(c.nom)}</b> : ${esc(c.desc)}</p>`).join('')];
  const draw=()=>paintModal(`<h2>Approche finale</h2><div class="tabs">${tabs.map((t,i)=>`<button class="${i===tab?'on':''}" data-h="${i}">${t}</button>`).join('')}</div>${body[tab]}<div class="acts"><button class="btn pri" data-c="close">Compris</button></div>`);
  const prevClosable=window.MODAL_CLOSABLE; window.MODAL_CLOSABLE=true;
  draw(); $('#mbox').onclick=e=>{ const h=e.target.closest('[data-h]'); if(h){ tab=+h.dataset.h; draw(); } if(e.target.closest('[data-c="close"]')&&S&&S.phase==='brief'&&!S.over) setTimeout(briefing,50); }; }
(function boot(){ const p=load('apfp'); if(p) Object.assign(M,p,{step:1}); const s=load(KEY);
  if(s&&!s.over&&s.dice){ S=s; build(); VIEW=S.mode==='ia'?S.human:null; render();
    if(S.phase==='brief') briefing(); else { startTimer(); nextTurn(); } }
  else { S=newGame({sc:'lyon'}); build(); render(); S=null; renderStatus(); renderTray(); menu(); } })();
}
