<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plus Bas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plus Bas : retourne et échange tes cartes pour finir avec le plus petit total. 2 à 8 joueurs, contre l'IA ou entre amis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Crépuscule alpin : bleu nuit, cartes vives par tranche de valeur ; pioche au centre, grilles des joueurs autour */
:root{
  --sky:#0e2233; --sky2:#13324a; --panel:#173a52; --panel2:#1f4964; --line:#2d5a78;
  --ink:#eef6fb; --mute:#9dbbcc; --coral:#ff8a5b; --coral-d:#c95a30;
  --c-neg:#4b4fd1; --c-zero:#47b9e6; --c-low:#4dbb63; --c-mid:#f0c241; --c-high:#e5574a; --c-13:#9b59d0; --c-m4:#1b1f5e; --c-star:#f5b800;
  --p-on:#ffd36b;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);background-image:linear-gradient(180deg,#0b1a28 0%,#13324a 60%,#1d4a5e 100%);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0b1a28}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,[data-a]:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(11,26,40,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.home{font-size:13px;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.home:hover{color:var(--ink);border-color:var(--coral)}
.logo{font-family:var(--display);font-weight:700;font-size:24px;color:var(--coral)}
.spacer{flex:1}
.hbtn{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:14px}
.hbtn:hover{border-color:var(--coral)}
.short{display:none}@media (max-width:560px){.long{display:none}.short{display:inline}}
.turnbar{background:var(--tc,var(--coral));color:#1a1008}
.turnbar .wrap{display:flex;align-items:center;gap:10px;padding-block:7px;flex-wrap:wrap;font-weight:700}
.turnbar .who{font-family:var(--display);font-size:21px}
.turnbar .hint{font-weight:600;opacity:.85}
.turnbar .dot{width:11px;height:11px;border-radius:50%;background:#1a1008;animation:blink 1.2s ease-in-out infinite}
.turnbar.flip .wrap{transform:rotate(180deg)}
@keyframes blink{50%{opacity:.25}}
.game{display:flex;flex-direction:column;gap:14px;padding-block:14px 40px}
.others{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.pp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pp.active{border-color:var(--p-on);box-shadow:0 0 0 1px var(--p-on) inset,0 0 18px rgba(255,211,107,.25)}
.pp.fin{border-style:dashed}
.pp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pp-name{font-family:var(--display);font-weight:600;font-size:18px}
.flag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:var(--p-on);color:#1a1008;border-radius:4px;padding:1px 6px;font-weight:800}
.flag.f2{background:var(--coral)}
.scores{margin-left:auto;display:flex;gap:6px}
.sc{background:var(--sky2);border-radius:7px;padding:2px 8px;font-weight:800;font-variant-numeric:tabular-nums;font-size:13px}
.sc small{font-weight:600;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(4,var(--cw));gap:5px;justify-content:center}
.pp .grid{--cw:clamp(34px,8vw,46px)}
.me .grid{--cw:clamp(58px,17vw,84px);gap:8px}
.pcard{width:var(--cw);height:calc(var(--cw)*1.42);border-radius:calc(var(--cw)*.14);display:grid;place-items:center;position:relative;font-family:var(--display);font-weight:700;font-size:calc(var(--cw)*.44);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:0 3px 8px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.85);flex:none;background:var(--cc);overflow:hidden}
.pcard::before{content:attr(data-n);position:absolute;top:4%;left:8%;font-size:.34em;opacity:.9}
.pcard::after{content:"";position:absolute;inset:14% 12%;border-radius:50%;background:rgba(255,255,255,.16)}
.pcard span{position:relative;z-index:1}
.v-neg{--cc:var(--c-neg)}.v-zero{--cc:var(--c-zero)}.v-low{--cc:var(--c-low)}.v-mid{--cc:var(--c-mid);color:#3a2a05;text-shadow:none}.v-high{--cc:var(--c-high)}.v-13{--cc:var(--c-13)}.v-m4{--cc:radial-gradient(circle at 50% 40%,#3a3fa8,var(--c-m4));border-color:#f5b800}
.v-star{--cc:radial-gradient(circle at 50% 40%,#fff1a8,var(--c-star) 60%,#b37800);color:#5a3a00;text-shadow:none}
.pcard.back{--cc:repeating-linear-gradient(45deg,#ff8a5b 0 6px,#f06b3b 6px 12px);border-color:#ffe3d4}
.pcard.back::before{content:""}
.pcard.back::after{inset:22% 18%;background:#fff3ec;border-radius:40% 40% 50% 50%;}
.pcard.back span{color:#c95a30;font-size:.5em;text-shadow:none}
.pcard.gone{background:transparent;border:2px dashed rgba(255,255,255,.18);box-shadow:none}
.pcard.gone::after,.pcard.gone::before{display:none}
.pcard.pick{cursor:pointer;outline:3px solid var(--p-on);outline-offset:2px;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{outline-color:rgba(255,211,107,.35)}}
.pcard.peek span{opacity:.55}
.pcard.peek::before{content:"vu";font-size:.26em;top:auto;bottom:6%;left:auto;right:8%;color:#fff3ec}
.pcard.flipin{animation:flip .5s ease-out}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:none}}
.table{background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.06),transparent 70%);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.piles{display:flex;gap:18px;align-items:flex-end;justify-content:center;flex-wrap:wrap;--cw:clamp(62px,16vw,82px)}
.pile{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mute);font-weight:700}
.pile .pcard{box-shadow:3px 3px 0 rgba(0,0,0,.3),6px 6px 0 rgba(0,0,0,.18),0 3px 8px rgba(0,0,0,.4)}
.pile.can .pcard{cursor:pointer;outline:3px solid var(--p-on);outline-offset:3px}
.hand{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--p-on);font-weight:800}
.hand .pcard{transform:rotate(-4deg);box-shadow:0 0 0 3px var(--p-on),0 8px 18px rgba(0,0,0,.5)}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cbtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:800;font-size:14px}
.cbtn.main{background:linear-gradient(180deg,#ffa47c,#e0683a);color:#2a1206;border-color:transparent}
.prompt{font-weight:700;text-align:center;min-height:1.3em}
.me{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.me.active{border-color:var(--p-on)}
.ff .pp.rot{transform:rotate(180deg)}
.log{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:3px;max-height:200px;overflow:auto}
.log div:first-child{color:var(--ink)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:18px;color:var(--coral)}
#modal{position:fixed;inset:0;z-index:40;background:rgba(5,12,20,.72);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.mpanel{background:var(--sky2);border:1px solid var(--coral-d);border-radius:16px;max-width:620px;width:100%;max-height:min(86vh,860px);overflow:auto;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mpanel.flip{transform:rotate(180deg)}
.mpanel h3{margin:0 0 6px;font-family:var(--display);font-weight:700;font-size:25px;color:var(--coral)}
.sub{color:var(--mute);margin:0 0 10px;font-size:14px}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.act{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;font-weight:700}
.act.main{border-color:var(--coral)}
.ghost{border:1px solid var(--line);border-radius:9px;padding:8px 14px;margin-top:12px}
table.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.res td,table.res th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.res td:first-child,table.res th:first-child{text-align:left}
table.res tr.win td{color:var(--p-on);font-weight:800}
.menu{max-width:760px;margin:0 auto;padding-block:30px 60px;display:flex;flex-direction:column;gap:22px}
.menu h1{font-family:var(--display);font-weight:700;font-size:clamp(52px,10vw,92px);line-height:.9;margin:0;color:var(--coral)}
.menu .lead{font-size:18px;max-width:58ch;margin:0}
.menu h2{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);margin:0 0 8px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.pbtn b{font-family:var(--display);font-weight:600;font-size:19px}
.pbtn span{color:var(--mute);font-size:14px}
.pbtn.on{border-color:var(--coral);background:linear-gradient(180deg,#2a4f68,var(--panel));box-shadow:0 0 0 1px var(--coral) inset}
.stepper{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;width:fit-content}
.stepper b{font-family:var(--display);font-size:26px;min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.stepper button{width:36px;height:36px;border-radius:50%;background:var(--panel2);font-weight:800;font-size:20px}
.go{background:linear-gradient(180deg,#ffa47c,#e0683a);color:#2a1206;border-radius:12px;padding:14px 22px;font-family:var(--display);font-weight:700;font-size:22px;align-self:flex-start}
.preview{display:flex;gap:8px;flex-wrap:wrap;--cw:54px}
.ex{background:var(--panel);border-left:3px solid var(--coral);border-radius:6px;padding:8px 10px;font-size:14px;margin:10px 0}
.rules p,.rules li{font-size:14px;max-width:65ch}
.splash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:35}
.splash div{background:var(--p-on);color:#1a1008;font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,44px);padding:12px 30px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:splash 1.2s ease-out forwards;text-align:center}
.splash.flip div{animation-name:splashf}
@keyframes splash{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.04)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0}}
@keyframes splashf{0%{opacity:0;transform:rotate(180deg) scale(.7)}15%{opacity:1;transform:rotate(180deg) scale(1.04)}25%{transform:rotate(180deg)}75%{opacity:1}100%{opacity:0;transform:rotate(180deg)}}
.float{position:fixed;z-index:45;pointer-events:none;font-family:var(--display);font-weight:700;font-size:24px;color:#9ff0b3;text-shadow:0 2px 6px rgba(0,0,0,.8);transform:translate(-50%,0);animation:floatUp 1.6s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-56px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.float,.splash{display:none}}

/*top-above*//*hh*/#modal,#cover{top:var(--hh,0px)!important}#modal>*{max-height:calc(100vh - var(--hh,0px) - 24px)!important;max-height:calc(100dvh - var(--hh,0px) - 24px)!important;overflow:auto}
/*top-above*/header.top{z-index:61!important}
/*NETCSS*//* hall (autonome : portail et jeux) */
#hall-modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;padding:12px}
#hall-modal[hidden]{display:none}
.hall-box{background:#fbf6ea;color:#2a2418;border-radius:16px;max-width:560px;width:100%;max-height:calc(100dvh - 24px);overflow:auto;padding:18px 20px;box-shadow:0 20px 60px #000c;font-family:"Nunito Sans",Karla,system-ui,sans-serif;text-align:left}
.hall-box h2{font-family:Georgia,serif;font-size:24px;margin:0 0 6px;color:#2a2418}
.hall-box h4{font-family:Georgia,serif;font-size:16px;margin:14px 0 6px;color:#2a2418}
.hall-box p{line-height:1.45;margin:6px 0}
.hall-in{font-weight:800;font-size:16px;font-family:inherit;padding:9px 11px;border-radius:9px;border:1px solid #c9b98f;background:#fff!important;color:#2a2418!important;-webkit-text-fill-color:#2a2418!important;caret-color:#2a2418;width:100%;max-width:300px}
.hall-in::placeholder{color:#a3926e!important;-webkit-text-fill-color:#a3926e!important;font-weight:600}
.hall-err{color:#b0412e;font-weight:800;min-height:1.2em;font-size:14px}
.hall-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.hall-btn{font-weight:800;font-size:14px;line-height:1;font-family:inherit;border-radius:9px;padding:8px 12px;border:1px solid #c9b98f;background:#ece3cf;color:#2a2418;cursor:pointer;touch-action:manipulation}
.hall-btn.pri{background:#1d8f5a;border-color:#1d8f5a;color:#fff}
.hall-btn:disabled{opacity:.5}
.hall-link{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;cursor:pointer}
.hall-note{color:#6b5d40;font-size:14px}
.hall-me{background:#f0e6cf;border-radius:10px;padding:8px 10px;margin:6px 0}
.hall-list{list-style:none;margin:4px 0;padding:0;display:flex;flex-direction:column;gap:5px}
.hall-list li{display:flex;align-items:center;gap:9px;background:#f6efdc;border-radius:10px;padding:6px 8px}
.hall-tx{flex:1;min-width:0;display:flex;flex-direction:column}.hall-tx small{color:#6b5d40;font-size:12.5px}
.hall-av{width:30px;height:30px;border-radius:50%;background:#2a2418;color:#fff;display:grid;place-items:center;font-weight:900;flex:none;text-transform:uppercase}
.hall-games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.hall-spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid #c9b98f;border-top-color:#2a2418;animation:hallr 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes hallr{to{transform:rotate(360deg)}}
.hall-invite{position:fixed;right:12px;bottom:12px;z-index:85;background:#fbf6ea;color:#2a2418;border-radius:14px;padding:12px 14px 14px;box-shadow:0 14px 40px #000b;max-width:min(360px,calc(100vw - 24px));font-family:"Nunito Sans",Karla,system-ui,sans-serif;animation:hallin .35s cubic-bezier(.2,1.3,.4,1);overflow:hidden;border:2px solid #1d8f5a}
.hall-invite .hall-acts{margin-top:8px}
.hall-invite .hall-bar{position:absolute;left:0;bottom:0;height:4px;background:#1d8f5a;width:100%;animation:hallt 30s linear forwards}
@keyframes hallt{to{width:0}}
@keyframes hallin{from{transform:translateY(30px);opacity:0}}
.hall-toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:#1b1b1f;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-weight:700;font-family:system-ui,sans-serif}
#hall-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 0}
.hall-pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 13px;border:1px solid rgba(255,255,255,.25);background:rgba(29,143,90,.25);color:#eef3ea;font-weight:700;font-size:14px;line-height:1;font-family:inherit;cursor:pointer}
.hall-pill span{color:#d8b25a}
.hall-sub{font-size:14px;color:#a9c2b3}.hall-sub .hall-link{color:#eef3ea}
.hall-dot{width:9px;height:9px;border-radius:50%;background:#7dffb5;box-shadow:0 0 0 2px #fff4;animation:hallp 1.8s infinite}.hall-dot.off{background:#aaa;animation:none}
@keyframes hallp{50%{box-shadow:0 0 0 5px #7dffb500}}

/* salle en ligne */
#netBtn{display:inline-flex;align-items:center;gap:6px}
#netBtn.net-on{background:#1d8f5a;border-color:#1d8f5a;color:#fff}
.net-dot{width:9px;height:9px;border-radius:50%;background:#7dffb5;box-shadow:0 0 0 2px #fff6;animation:netp 1.8s infinite}
.net-dot.off{background:#ffb347;animation:none}
@keyframes netp{50%{box-shadow:0 0 0 5px #7dffb500}}
.hall-box .net-in,.mbox .net-in{font-family:inherit;font-weight:800;font-size:16px;padding:9px 11px;border-radius:9px;border:1px solid #c9b98f;background:#fff!important;color:#2a2418!important;-webkit-text-fill-color:#2a2418!important;caret-color:#2a2418;width:100%;max-width:280px}
.hall-box .net-in::placeholder,.mbox .net-in::placeholder{color:#a3926e!important;-webkit-text-fill-color:#a3926e!important;font-weight:600}
.hall-box .net-code,.mbox .net-code{letter-spacing:.35em;text-transform:uppercase;font-size:22px;text-align:center;max-width:170px}
.net-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.net-box{border:1px solid #d9caa4;border-radius:12px;padding:10px 12px;background:#f6efdc;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.net-box h4{margin:0!important}.net-box p{margin:0;font-size:14px}
.net-note{font-size:13.5px;color:#6b5d40}
.net-code-big{display:flex;gap:8px;justify-content:center;margin:10px 0}
.net-code-big b{font-family:var(--title,Georgia,serif);font-size:40px;width:58px;height:66px;display:grid;place-items:center;border-radius:12px;background:#2a2418;color:#fff;box-shadow:0 6px 0 #0003}
.net-share{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.net-list{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:5px}
.net-list li{display:flex;align-items:center;gap:8px;font-weight:800;background:#f6efdc;border-radius:10px;padding:6px 9px;flex-wrap:wrap}
.net-list li small{font-weight:600;color:#6b5d40}.net-list li.ai{opacity:.8}
.net-av{width:26px;height:26px;border-radius:50%;background:#2a2418;color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.net-ok{color:#1d7a46;font-weight:800}.net-ko{color:#b0412e;font-weight:800}
.net-wait{display:flex;align-items:center;gap:10px;font-weight:700}
.net-spin{width:18px;height:18px;border-radius:50%;border:3px solid #c9b98f;border-top-color:#2a2418;animation:netr 1s linear infinite;flex:none}
@keyframes netr{to{transform:rotate(360deg)}}
.net-rules{margin-top:6px}
@media (max-width:560px){.net-two{grid-template-columns:1fr}.net-code-big b{font-size:32px;width:50px;height:58px}}
.net-me{background:#f0e6cf;border-radius:10px;padding:8px 10px;margin:6px 0}
.net-link{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;cursor:pointer}
.net-chk{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;margin:6px 0}.net-chk input{width:18px;height:18px}
.net-list li .net-r{margin-left:auto}
/* contrôles dans la boîte du hall (indépendants du jeu) */
.hall-box .btn{background:#ece3cf;color:#2a2418;border:1px solid #c9b98f;border-radius:9px;padding:8px 12px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;line-height:1.1}

<div id="app"></div>
<div id="modal" hidden></div>
<script>/*NETJS*//* ===== Hall de la Salle de jeux : joueurs connectés, pseudos uniques, tables ouvertes, invitations (Supabase Realtime, sans base) ===== */
const HALL=(()=>{
 const SB_URL='https://evepcodcppxpufbkuflq.supabase.co', SB_KEY='sb_publishable_iUC6966SeFt_05Iac1wGQw_yDo9zl7y';
 const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
 const SITE='https://mushu1994.github.io/duel-des-ages/';
 const GAMES={"derniere-carte":"Dernière carte","quitte-ou-sept":"Quitte ou Sept","joyaux-renaissance":"Joyaux de la Renaissance","sept-merveilles":"Sept Merveilles","echecs":"Échecs","quatre-en-ligne":"Quatre en ligne","reversi":"Reversi","dames":"Dames","bataille-navale":"Bataille navale","code-secret":"Code Secret","bataille":"La Bataille","petits-chevaux":"Petits Chevaux","dominos":"Dominos","tetes-de-boeuf":"Têtes de Bœuf","plus-bas":"Plus Bas","petit-bac":"Petit Bac","poker":"Poker","president":"Président","tarot":"Tarot","rami":"Rami voleur"};
 const q=s=>document.querySelector(s), es=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const ld=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, sv=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
 const note=s=>{ if(typeof toast==='function') return toast(s); const t=document.createElement('div'); t.className='hall-toast'; t.textContent=s; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); };
 const H={note,ready:false,ok:null,pseudo:ld('net-name')||'',peers:{},me:{},listeners:[],page:'',title:''};
 let cid=ld('net-cid'); if(!cid){ cid=Math.random().toString(36).slice(2,10); sv('net-cid',cid); } H.cid=cid;
 const key=p=>String(p||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[^a-z0-9]/g,'');
 H.key=key;
 let client=null, ch=null, libP=null, syncedP=null, syncRes=null, at=ld('net-at')||Date.now();
 function lib(){ if(window.supabase) return Promise.resolve(); if(libP) return libP; libP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=LIB; s.onload=res; s.onerror=()=>{ libP=null; rej(new Error('lib')); }; document.head.appendChild(s); }); return libP; }
 H.client=async()=>{ await lib(); if(!client) client=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}}); return client; };
 /* ---------- connexion au hall ---------- */
 H.connect=async()=>{ if(ch) return syncedP; syncedP=new Promise(r=>syncRes=r);
   try{ await H.client(); }catch(e){ H.ok=false; paint(); return syncedP; }
   ch=client.channel('salle:hall',{config:{broadcast:{self:false},presence:{key:H.cid}}});
   ch.on('presence',{event:'sync'},onSync);
   ch.on('broadcast',{event:'inv'},({payload:p})=>{ if(p.to===H.cid) invited(p); });
   ch.on('broadcast',{event:'invr'},({payload:p})=>{ if(p.to===H.cid) note(p.ok?`${p.fromP} arrive à ta table`:`${p.fromP} ne peut pas jouer maintenant`); });
   const to=setTimeout(()=>{ if(H.ok==null){ H.ok=false; paint(); syncRes(); } },9000);
   ch.subscribe(async st=>{ if(st==='SUBSCRIBED'){ clearTimeout(to); H.ok=true; await track(); setTimeout(()=>syncRes(),900); paint(); } else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ if(H.ok==null){ H.ok=false; paint(); syncRes(); } } });
   return syncedP; };
 function payload(){ return Object.assign({p:H.pseudo,k:key(H.pseudo),at,g:H.page,gt:H.title},H.me); }
 async function track(){ if(!ch) return; try{ await ch.track(payload()); }catch(e){} }
 function onSync(){ const st=ch.presenceState(), peers={}; for(const k in st){ const m=st[k][st[k].length-1]; if(m) peers[k]=m; } H.peers=peers;
   // doublon de pseudo : le plus récent cède la place
   if(H.pseudo){ const mk=key(H.pseudo); for(const k in peers){ if(k===H.cid) continue; const o=peers[k]; if(o.p&&o.k===mk&&(o.at<at||(o.at===at&&k<H.cid))){ const old=H.pseudo; H.pseudo=''; sv('net-name',null); track(); note(`Le pseudo « ${old} » est déjà utilisé par quelqu’un d’autre`); setTimeout(()=>H.askPseudo(),300); break; } } }
   paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); }
 H.onChange=f=>H.listeners.push(f);
 H.set=o=>{ Object.assign(H.me,o); track(); };
 H.where=(page,title)=>{ H.page=page; H.title=title; track(); };
 H.list=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&m.p).map(([k,m])=>Object.assign({cid:k},m)).sort((a,b)=>a.p.localeCompare(b.p));
 H.count=()=>Object.keys(H.peers).length;
 H.tables=g=>Object.entries(H.peers).map(([k,m])=>m.p&&m.r&&m.r.host&&m.r.open&&!m.r.started&&m.r.n<m.r.max&&(!g||m.r.g===g)?Object.assign({cid:k,p:m.p},m.r):null).filter(Boolean);
 H.free=p=>{ const k=key(p); return !Object.entries(H.peers).some(([c,m])=>c!==H.cid&&m.p&&m.k===k); };
 H.anon=()=>Object.entries(H.peers).filter(([k,m])=>k!==H.cid&&!m.p).length;
 /* ---------- pseudo ---------- */
 H.setPseudo=async p=>{ p=String(p||'').replace(/\s+/g,' ').trim(); if(p.length<2||p.length>16||key(p).length<2) return 'Entre 2 et 16 caractères (lettres ou chiffres).';
   if(/^(ordi|ordinateur|bot|ia|robot)\d*$/i.test(key(p))) return 'Ce pseudo est réservé.';
   await H.connect(); if(!H.ok) return 'Connexion impossible pour le moment.';
   if(!H.free(p)) return `« ${p} » est déjà utilisé par quelqu’un en ligne.`;
   H.pseudo=p; at=Date.now(); sv('net-at',at); sv('net-name',p); await track(); paint(); H.listeners.forEach(f=>{ try{ f(); }catch(e){} }); return null; };
 H.ensure=()=>H.pseudo?Promise.resolve(H.pseudo):new Promise(res=>H.askPseudo(res));
 H.askPseudo=(cb)=>{ openBox(`<h2>Ton pseudo</h2><p>Il s’affiche pour les autres joueurs connectés. Deux personnes en ligne ne peuvent pas avoir le même.</p>
   <input class="hall-in" id="hallPseudo" maxlength="16" placeholder="Ex. : Mushu" value="${es(H.pseudo||ld('net-last')||'')}"><p class="hall-err" id="hallErr"></p>
   <div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button><button class="hall-btn pri" data-hl="ok">Valider</button></div>`,async e=>{ const b=e.target.closest('[data-hl]'); if(!b) return; if(b.dataset.hl==='close'){ closeBox(); return; }
     const v=q('#hallPseudo').value; b.disabled=true; const err=await H.setPseudo(v); b.disabled=false; if(err){ q('#hallErr').textContent=err; return; } sv('net-last',H.pseudo); closeBox(); if(cb) cb(H.pseudo); });
   const i=q('#hallPseudo'); if(i){ i.focus(); i.onkeydown=e=>{ if(e.key==='Enter') q('[data-hl=ok]').click(); }; } };
 /* ---------- invitations ---------- */
 H.invite=(to,room)=>{ if(!ch) return; ch.send({type:'broadcast',event:'inv',payload:{to,from:H.cid,fromP:H.pseudo,g:room.g,gt:room.gt,code:room.code}}); note(`Invitation envoyée à ${(H.peers[to]||{}).p||'ce joueur'}`); };
 function invited(p){ const id='inv-'+p.code; if(q('#'+id)) return; if(typeof sfx==='function') sfx('ding');
   const d=document.createElement('div'); d.className='hall-invite'; d.id=id;
   d.innerHTML=`<b>${es(p.fromP)}</b> t’invite à jouer à <b>${es(p.gt)}</b><div class="hall-acts"><button class="hall-btn" data-i="no">Pas maintenant</button><button class="hall-btn pri" data-i="ok">Rejoindre</button></div><i class="hall-bar"></i>`;
   document.body.appendChild(d); const t=setTimeout(()=>d.remove(),30000);
   d.onclick=e=>{ const b=e.target.closest('[data-i]'); if(!b) return; clearTimeout(t); d.remove(); const ok=b.dataset.i==='ok';
     if(ch) ch.send({type:'broadcast',event:'invr',payload:{to:p.from,fromP:H.pseudo,ok}}); if(ok) H.goTable(p.g,p.code); }; }
 H.goTable=(g,code)=>{ if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined'){ NET.joinCode(code); return; } location.href=g+'.html?salle='+code; };
 H.inviteFlow=to=>{ const P=H.peers[to]; if(!P) return; const r=H.me.r;
   if(r&&r.host&&!r.started){ H.invite(to,r); return; }
   const opts=Object.entries(GAMES).sort((a,b)=>a[1].localeCompare(b[1],'fr'));
   openBox(`<h2>Inviter ${es(P.p)}</h2><p>Choisis le jeu : une table s’ouvre et l’invitation part tout de suite.</p><div class="hall-games">${opts.map(([g,t])=>`<button class="hall-btn" data-g="${g}">${es(t)}</button>`).join('')}</div><div class="hall-acts"><button class="hall-btn" data-hl="close">Annuler</button></div>`,e=>{
     const b=e.target.closest('[data-g],[data-hl]'); if(!b) return; if(b.dataset.hl){ closeBox(); return; } const g=b.dataset.g; sessionStorage.setItem('hall-invite',JSON.stringify({to,g})); closeBox();
     if(window.NETGAME&&window.NETGAME.id===g&&typeof NET!=='undefined') NET.createFor(); else location.href=g+'.html?creer=1'; }); };
 H.pendingInvite=g=>{ try{ const v=JSON.parse(sessionStorage.getItem('hall-invite')||'null'); if(v&&v.g===g){ sessionStorage.removeItem('hall-invite'); return v.to; } }catch(e){} return null; };
 /* ---------- interface ---------- */
 function where(m){ if(m.r&&m.r.started) return `joue à ${es(m.r.gt)}`; if(m.r&&m.r.host) return `ouvre une table de ${es(m.r.gt)}`; if(m.r) return `attend à une table de ${es(m.r.gt)}`; return m.gt?`regarde ${es(m.gt)}`:'sur le portail'; }
 function busy(m){ return m.r&&m.r.started; }
 H.panelHTML=(g)=>{ if(H.ok===false) return `<p class="hall-note">Le salon en ligne n’est pas joignable d’ici.${/github\.io$/.test(location.hostname)?' Vérifie ta connexion.':` Ouvre la salle sur <a href="${SITE}" target="_blank" rel="noopener">le site</a>.`}</p>`;
   if(H.ok==null) return '<p class="hall-note"><span class="hall-spin"></span>Connexion au salon…</p>';
   const tabs=H.tables(g), ppl=H.list();
   return `<div class="hall-me">${H.pseudo?`Ton pseudo : <b>${es(H.pseudo)}</b> <button class="hall-link" data-hl="pseudo">changer</button>`:`<button class="hall-btn pri" data-hl="pseudo">Choisir un pseudo</button> <span class="hall-note">pour apparaître et être invité</span>`}</div>
    <h4>Tables ouvertes${g?'':' (tous les jeux)'}</h4>${tabs.length?`<ul class="hall-list">${tabs.map(t=>`<li><span class="hall-av">${es(t.p[0])}</span><span class="hall-tx"><b>${es(t.gt)}</b><small>table de ${es(t.p)} · ${t.n}/${t.max} joueurs</small></span>${t.cid===H.cid?'<small>ta table</small>':`<button class="hall-btn pri" data-join="${es(t.g)}:${es(t.code)}">Rejoindre</button>`}</li>`).join('')}</ul>`:`<p class="hall-note">Aucune table ouverte${g?' pour ce jeu':''} pour l’instant.</p>`}
    <h4>Joueurs en ligne (${ppl.length})</h4>${H.anon()?`<p class="hall-note">+ ${H.anon()} visiteur${H.anon()>1?'s':''} sans pseudo</p>`:''}${ppl.length?`<ul class="hall-list">${ppl.map(m=>`<li><span class="hall-av">${es(m.p[0])}</span><span class="hall-tx"><b>${es(m.p)}</b><small>${where(m)}</small></span>${H.pseudo&&!busy(m)?`<button class="hall-btn" data-inv="${m.cid}">Inviter</button>`:''}</li>`).join('')}</ul>`:'<p class="hall-note">Personne d’autre pour le moment. Partage le lien du site à tes amis !</p>'}`; };
 H.panelClick=e=>{ const b=e.target.closest('[data-hl],[data-join],[data-inv]'); if(!b) return false;
   if(b.dataset.hl==='pseudo'){ H.askPseudo(); return true; }
   if(b.dataset.join){ const [g,c]=b.dataset.join.split(':'); closeBox(); H.ensure().then(()=>H.goTable(g,c)); return true; }
   if(b.dataset.inv){ H.inviteFlow(b.dataset.inv); return true; } return false; };
 let boxCb=null;
 function openBox(h,cb,locked){ let m=q('#hall-modal'); if(!m){ m=document.createElement('div'); m.id='hall-modal'; m.innerHTML='<div class="hall-box" id="hall-box"></div>'; document.body.appendChild(m); m.addEventListener('click',e=>{ if(e.target===m){ if(!m.dataset.locked) closeBox(); return; } if(boxCb) boxCb(e); }); }
   q('#hall-box').innerHTML=h; boxCb=cb; m.dataset.locked=locked?'1':''; m.hidden=false; }
 function closeBox(){ const m=q('#hall-modal'); if(m) m.hidden=true; boxCb=null; if(H.onBoxClose){ const f=H.onBoxClose; H.onBoxClose=null; f(); } }
 H.openBox=openBox; H.closeBox=closeBox;
 H.openPanel=g=>{ const draw=()=>openBox(`<h2>Le salon</h2>${H.panelHTML(g)}<div class="hall-acts"><button class="hall-btn" data-hl="close">Fermer</button></div>`,e=>{ const b=e.target.closest('[data-hl=close]'); if(b){ closeBox(); return; } H.panelClick(e); });
   draw(); H.redraw=()=>{ const m=q('#hall-modal'); if(m&&!m.hidden&&q('#hall-box h2')&&q('#hall-box h2').textContent==='Le salon') draw(); }; };
 function paint(){ const bar=q('#hall-bar'); if(bar){ const n=H.count();
     bar.innerHTML=H.ok===false?'':`<button class="hall-pill" data-hl="open"><i class="hall-dot ${H.ok?'':'off'}"></i><b>${H.ok?n:'…'}</b> en ligne${H.pseudo?` · <span>${es(H.pseudo)}</span>`:''}</button>${H.ok?`<span class="hall-sub">${H.tables().length?`${H.tables().length} table${H.tables().length>1?'s':''} ouverte${H.tables().length>1?'s':''} · `:''}<button class="hall-link" data-hl="open">Voir qui joue</button>${H.pseudo?'':' · <button class="hall-link" data-hl="pseudo">choisir un pseudo</button>'}</span>`:''}`;
     bar.onclick=e=>{ const b=e.target.closest('[data-hl]'); if(!b) return; if(b.dataset.hl==='open') H.openPanel(''); else H.askPseudo(); }; }
   if(H.redraw) H.redraw(); if(typeof NET!=='undefined'&&NET.hallChanged) NET.hallChanged(); }
 H.paint=paint;
 return H; })();
addEventListener('load',()=>setTimeout(()=>{ if(!window.NETGAME) HALL.where('',''); HALL.connect(); },0));

/* ===== Salle en ligne : tables (Supabase Realtime, l'hôte fait tourner la partie), sur le hall commun =====
   Le jeu déclare window.NETGAME = { id, title, min, max, rules():html, rulesClick(e):bool,
     start(list), state():G, receive(msg):Promise, act(seat,fn,args):bool, busy():bool, resume(), leave() } */
const NET=(()=>{
 const $q=s=>document.querySelector(s), es=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const nt=s=>HALL.note(s), snd=n=>{ try{ if(typeof sfx==='function') snd(n); }catch(e){} }, sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const ld=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, svs=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
 let BOXCB=null; const box=(h,locked)=>{ BOXCB=null; HALL.openBox(h,e=>{ if(e.target.closest('[data-hl=close]')){ HALL.closeBox(); return; } (BOXCB||onClick)(e); },locked); };
 const PL=G=>G?(G.players||G.P||[]):[];
 const gameClose=()=>{ try{ if(typeof closeModal==='function') closeModal(true); }catch(e){} };
 const SITE='https://mushu1994.github.io/duel-des-ages/';
 const LET='ABCDEFGHJKLMNPQRSTUVWXYZ';
 const BOTS=['Ada','Hal','Pixel','Nova','Atlas','Écho','Zéphyr','Orbit','Volt','Lumen','Quartz','Sirius'];
 const N={on:false,host:false,guest:false,started:false,code:null,name:'',seat:null,peers:{},v:0,hs:null,lastV:-1,lastHs:null,q:[],aq:[],ai:{n:0,level:'normal'},ui:null,known:new Set(),waitHost:false,open:(()=>{ try{ return localStorage.getItem('net-open')!=='false'; }catch(e){ return true; } })(),invited:new Set()};
 N.cid=HALL.cid;
 let client=null, ch=null;
 const NG=()=>window.NETGAME;
 function newCode(){ let c=''; for(let i=0;i<4;i++) c+=LET[Math.floor(Math.random()*LET.length)]; return c; }
 const link=()=>{ const base=/github\.io$/.test(location.hostname)?location.origin+location.pathname:SITE+NG().id+'.html'; return base+'?salle='+N.code; };
 const sess=()=>ld('net-sess'), setSess=v=>svs('net-sess',v);
 const isGh=()=>/github\.io$/.test(location.hostname);
 /* ---------- connexion à une table ---------- */
 async function connect(code,asHost){ client=await HALL.client();
   if(ch){ try{ await client.removeChannel(ch); }catch(e){} ch=null; }
   N.code=code; N.host=asHost; N.guest=!asHost; N.on=true; N.peers={}; N.known=new Set(); N.hs=Math.random().toString(36).slice(2,8); N.name=HALL.pseudo;
   ch=client.channel('salle:'+NG().id+':'+code,{config:{broadcast:{self:false},presence:{key:N.cid}}});
   ch.on('broadcast',{event:'st'},({payload})=>{ if(N.guest) enqueue(payload); });
   ch.on('broadcast',{event:'act'},({payload})=>{ if(N.host){ N.aq.push(payload); drain(); } });
   ch.on('broadcast',{event:'hello'},()=>{ if(N.host){ if(N.started) pushFull(); else pushLobby(); } });
   ch.on('broadcast',{event:'lobby'},({payload})=>{ if(N.guest&&!N.started){ N.lobby=payload; if(N.ui==='lobby') lobbyUI(); } });
   ch.on('broadcast',{event:'close'},()=>{ if(N.guest){ nt('L’hôte a fermé la table'); leave(true); } });
   ch.on('presence',{event:'sync'},onSync);
   return new Promise((res,rej)=>{ let done=false; const to=setTimeout(()=>{ if(!done){ done=true; rej(new Error('timeout')); } },9000);
     ch.subscribe(async st=>{ if(st==='SUBSCRIBED'){ await ch.track({name:N.name,host:asHost,at:Date.now()}); if(!done){ done=true; clearTimeout(to); res(); } if(N.guest) send('hello',{}); }
       else if((st==='CHANNEL_ERROR'||st==='TIMED_OUT')&&!done){ done=true; clearTimeout(to); rej(new Error(st)); } }); }); }
 function send(ev,payload){ if(ch) ch.send({type:'broadcast',event:ev,payload}).catch(()=>{}); }
 function onSync(){ const st=ch.presenceState(); const peers={}; for(const k in st){ const m=st[k][st[k].length-1]; peers[k]=m; } const before=N.peers; N.peers=peers;
   const names=k=>(peers[k]||before[k]||{}).name||'Un joueur';
   for(const k in peers) if(!before[k]&&k!==N.cid){ if(N.known.has(k)) nt(`${names(k)} est de retour`); else if(N.host&&!N.started){ nt(`${names(k)} rejoint la table`); snd('pop'); } }
   for(const k in before) if(!peers[k]&&k!==N.cid) nt(`${names(k)} a quitté la table`);
   Object.keys(peers).forEach(k=>N.known.add(k));
   if(N.guest){ const hostHere=Object.values(peers).some(m=>m.host); N.waitHost=!hostHere&&N.started; }
   if(N.host){ if(N.started){ const G=NG().state(); let ch2=false; if(G) PL(G).forEach(P=>{ if(P.cid&&P.away&&peers[P.cid]){ P.ai=false; P.away=false; ch2=true; } }); if(ch2) NG().resume(); pushFull(); } else pushLobby(); }
   hallRoom(); badge(); if(N.ui==='lobby') lobbyUI(); else if(N.ui==='panel') panelUI(); }
 function hallRoom(){ if(!N.on){ HALL.set({r:null}); return; } const n=N.host&&!N.started?lobbyOrder().length+N.ai.n:Object.keys(N.peers).length;
   HALL.set({r:{g:NG().id,gt:NG().title,code:N.code,host:N.host,open:N.host?N.open:false,started:N.started,n,max:NG().max}}); }
 /* ---------- hôte ---------- */
 function pushLobby(){ if(!N.host||N.started) return; send('lobby',{order:lobbyOrder().map(k=>({cid:k,name:N.peers[k].name})),ai:N.ai}); }
 function lobbyOrder(){ return Object.keys(N.peers).sort((a,b)=>(N.peers[b].host-N.peers[a].host)||(N.peers[a].at-N.peers[b].at)); }
 let pushT=null;

    const hs=hidden(p).filter(k=>p.peek[k]==null);if(!hs.length)return;
    let k;
    if(isAI(pi))k=hs[Math.random()*hs.length|0];
    else{render();k=(await input(pi,{slots:hs,prompt:'Carte 13 : regarde en secret une de tes cartes cachées'})).slot;}
    p.peek[k]=p.grid[k].c.v;log(`${p.name} regarde une de ses cartes cachées (effet du 13).`);
    if(!isAI(pi))info('Carte regardée',`<p>Cette carte vaut <b style="font-size:22px">${label(p.grid[k].c)}</b>. Elle reste face cachée, mais tu la verras marquée « vu ».</p>`,pi);
  }
}
async function reveal(pi,i){const p=G.P[pi];p.grid[i].up=true;p.grid[i].fresh=true;delete p.peek[i];sfx('flip');await onReveal(pi,i);}

/* ===================== IA ===================== */
const LEVELS={facile:{take:6,keep:4,noise:2.5,n:'Facile'},normal:{take:2.6,keep:1,noise:.6,n:'Normal'},difficile:{take:2.2,keep:.6,noise:.1,n:'Difficile'}};
function expHidden(){return G.ext?5.7:5.07;}
function known(p,i){const s=p.grid[i];if(s.gone)return null;if(s.up)return s.c;if(p.peek[i]!=null)return{v:p.peek[i]};return null;}
function gain(pi,c,i){
  const p=G.P[pi];const s=p.grid[i];if(s.gone)return -99;
  const cur=known(p,i);const curV=cur?cur.v:expHidden();
  const col=i%4;const others=[col,col+4,col+8].filter(k=>k!==i).map(k=>p.grid[k]);
  const val=c.star?20:c.v;
  let g=curV-val;
  if(others.every(o=>!o.gone&&o.up)){
    const nums=others.filter(o=>!o.c.star).map(o=>o.c.v).concat(c.star?[]:[c.v]);
    if(nums.length===0||nums.every(v=>v===nums[0]))g=curV+others.reduce((a,o)=>a+(o.c.star?20:o.c.v),0);
  }else if(!c.star&&c.v>=1&&others.some(o=>!o.gone&&o.up&&!o.c.star&&o.c.v===c.v))g+=Math.min(3,c.v*.4);
  return g;
}
function estScore(pi){const p=G.P[pi];return p.grid.reduce((a,s,i)=>a+(s.gone?0:(known(p,i)?known(p,i).v:expHidden())),0);}
function wouldEnd(pi,slotToFill){const p=G.P[pi];const h=hidden(p);return h.length===1&&h[0]===slotToFill;}
function safeToEnd(pi){const mine=estScore(pi);return G.P.every((q,k)=>k===pi||estScore(k)>mine+2);}
async function aiTurn(pi){
  const W=LEVELS[G.level];const p=G.P[pi];await sleep(G.fast?0:650);
  const top=G.disc[G.disc.length-1];
  const best=c=>{let bi=-1,bv=-99;p.grid.forEach((s,i)=>{if(s.gone)return;let g=gain(pi,c,i)+Math.random()*W.noise*.3;if(wouldEnd(pi,i)&&!safeToEnd(pi))g-=8;if(g>bv){bv=g;bi=i;}});return{i:bi,g:bv};};
  const bd=best(top);
  if(bd.g>=W.take+Math.random()*W.noise){
    G.hand=G.disc.pop();G.handFrom='disc';render();await sleep(G.fast?0:500);
    await exchange(pi,bd.i);return;
  }
  G.hand=drawCard();G.handFrom='deck';render();await sleep(G.fast?0:600);
  const b2=best(G.hand);const hs=hidden(p);
  if(b2.g>=W.keep||!hs.length){await exchange(pi,b2.i);return;}
  G.disc.push(G.hand);G.hand=null;log(`${p.name} défausse la carte piochée.`);
  let opts=hs.slice();
  if(opts.length===1&&!safeToEnd(pi)){const up=p.grid.map((s,i)=>(!s.gone&&s.up)?i:-1).filter(i=>i>=0);/* doit quand même retourner */}
  const pref=opts.filter(i=>{const col=i%4;return [col,col+4,col+8].some(k=>k!==i&&p.grid[k].up&&!p.grid[k].gone);});
  const k=(pref.length?pref:opts)[Math.random()*(pref.length?pref.length:opts.length)|0];
  await reveal(pi,k);checkColumns(pi);
}
async function exchange(pi,i){
  const p=G.P[pi];const s=p.grid[i];const old=s.c,wasUp=s.up;
  s.c=G.hand;s.up=true;s.fresh=true;delete p.peek[i];
  log(`${p.name} place ${label(G.hand)} à la place ${wasUp?'d’un '+label(old):'d’une carte cachée ('+label(old)+')'}.`);
  G.hand=null;G.disc.push(old);sfx('card');
  checkColumns(pi);
}

/* ===================== DÉROULEMENT ===================== */
function input(pi,cfg){return new Promise(res=>{inputResolve=v=>{inputResolve=null;G.input=null;res(v);};G.input={pi,...cfg};render();if(NETON()){ if(G.P[pi].ai) setTimeout(()=>aiIn(),400); NET.drain(); }});}
function aiIn(){ const c=G&&G.input; if(!c||!inputResolve||!G.P[c.pi].ai) return; if(c.piles) inputResolve({pile:'deck'}); else if(c.btns&&c.btns.length&&Math.random()<.3) inputResolve({btn:c.btns[0][0]}); else if(c.slots) inputResolve({slot:c.slots[Math.floor(Math.random()*c.slots.length)]}); }
function newGame(o){
  GEN++;inputResolve=null;closeModal(true);
  const n=o.n,h=Math.min(o.humans,n);
  const P=[];for(let i=0;i<n;i++){const human=i<h;P.push({name:human?(h===1?'Toi':`Joueur ${i+1}`):AI_NAMES[i-h],ai:!human,total:0,hist:[],grid:[],peek:{}});}
  G={P,level:o.level,ext:o.ext,target:o.target,fast:!!o.fast,round:0,deck:[],disc:[],cur:0,log:[],over:null,hand:null,input:null,mode:o.mode};
  if(o.fast)G.P.forEach(p=>p.ai=true);
  const run=runGame();if(!IS_NODE)run.catch(e=>{if(e!=='abort')console.error(e);});return run;
}
async function setupRound(){
  G.round++;G.deck=shuffle(buildDeck(G.ext));G.disc=[];G.finisher=null;G.hand=null;
  G.P.forEach(p=>{p.grid=Array.from({length:12},()=>({c:G.deck.pop(),up:false,gone:false}));p.peek={};});
  G.disc.push(G.deck.pop());
  log(`Manche ${G.round} : chacun retourne 2 cartes.`);
  for(let pi=0;pi<G.P.length;pi++){
    const p=G.P[pi];
    for(let k=0;k<2;k++){
      let i;const hs=hidden(p);
      if(isAI(pi))i=hs[Math.random()*hs.length|0];
      else{G.cur=pi;i=(await input(pi,{slots:hs,prompt:`${p.name} : retourne ${2-k} carte${k?'':'s'} de ta grille`})).slot;}
      await reveal(pi,i);
    }
  }
  let best=0;G.P.forEach((p,i)=>{if(visibleSum(p)>visibleSum(G.P[best]))best=i;});
  G.cur=best;log(`${G.P[best].name} commence (plus gros total visible).`);
}
async function runGame(res){
  if(!res)await setupRound();
  while(!G.over){
    const pi=G.cur;const p=G.P[pi];
    if(G.finisher===pi){await endRound();if(G.over)break;await setupRound();continue;}
    saveGame();splash(pi);render();
    if(isAI(pi))await aiTurn(pi);else await humanTurn(pi);
    G.P.forEach(q=>q.grid.forEach(s=>s.fresh=false));
    if(G.finisher==null&&!hidden(p).length){G.finisher=pi;log(`${p.name} a retourné toutes ses cartes : dernier tour pour les autres !`);sfx('alert');}
    G.cur=(pi+1)%G.P.length;
    render();
  }
  clearSave();render();showEnd();
}
async function humanTurn(pi){
  const p=G.P[pi];
  const a=await input(pi,{piles:true,prompt:'Pioche une carte ou prends celle de la défausse'});
  if(a.pile==='disc'){
    G.hand=G.disc.pop();G.handFrom='disc';
    const r=await input(pi,{slots:p.grid.map((s,i)=>s.gone?-1:i).filter(i=>i>=0),prompt:'Choisis la carte de ta grille à remplacer'});
    await exchange(pi,r.slot);return;
  }
  G.hand=drawCard();G.handFrom='deck';sfx('card');
  const hs=hidden(p);
  const r=await input(pi,{slots:p.grid.map((s,i)=>s.gone?-1:i).filter(i=>i>=0),btns:hs.length?[['discard','Défausser et retourner une carte']]:[],prompt:'Place la carte piochée dans ta grille, ou défausse-la'});
  if(r.btn==='discard'){
    G.disc.push(G.hand);G.hand=null;log(`${p.name} défausse la carte piochée.`);
    const r2=await input(pi,{slots:hidden(p),prompt:'Retourne une de tes cartes cachées'});
    await reveal(pi,r2.slot);checkColumns(pi);return;
  }
  await exchange(pi,r.slot);
}
async function endRound(){
  G.P.forEach(p=>p.grid.forEach(s=>{if(!s.gone)s.up=true;}));
  const sums=G.P.map(roundSum);const fin=G.finisher;
  const minOthers=Math.min(...sums.filter((_,i)=>i!==fin));
  const scored=sums.slice();
  if(sums[fin]>0&&sums[fin]>=minOthers){scored[fin]=sums[fin]*2;log(`${G.P[fin].name} n’a pas le plus petit total : son score est doublé.`);}
  G.P.forEach((p,i)=>{p.total+=scored[i];p.hist.push(scored[i]);});
  log(`Fin de la manche ${G.round}.`);
  const max=Math.max(...G.P.map(p=>p.total));
  if(max>=G.target){const min=Math.min(...G.P.map(p=>p.total));G.over={winners:G.P.map((p,i)=>p.total===min?i:-1).filter(i=>i>=0)};return;}
  if(!G.fast)await roundModal(sums,scored);
}
function roundModal(sums,scored){

      ${NET.guest?'<p class="sub">L’hôte lance la manche suivante…</p>':'<div class="acts"><button class="act main" data-a="next">Manche suivante</button></div>'}`,{forced:true,who:0});

function cardH(c,extra='',attrs=''){return `<div class="pcard ${cls(c)} ${extra}" data-n="${label(c)}" ${attrs}><span>${label(c)}</span></div>`;}

  <div class="ex"><b>Extension.</b> Les <b>13</b> valent 13 points ; quand tu en retournes un, tu regardes en secret une de tes cartes cachées. Le <b>−4</b> vaut −4. Les <b>Étoiles ★</b> remplacent n’importe quelle valeur pour former une colonne, mais valent +20 si elles restent dans ta grille en fin de manche.</div>
  <p>Couleurs : bleu foncé négatif, bleu clair 0, vert 1 à 4, jaune 5 à 8, rouge 9 à 12, violet 13.</p></div><button class="ghost" data-a="close">Fermer</button>`);}
function splash(pi){if(IS_NODE||G.fast||isAI(pi)&&G.P.filter(p=>!p.ai).length===1&&G.P.length>2)return;const d=document.createElement('div');d.className='splash'+(FF&&G.P.length===2&&pi!==viewer()?' flip':'');d.innerHTML=`<div>${isAI(pi)?esc(G.P[pi].name)+' joue':G.P.filter(p=>!p.ai).length===1?'À toi de jouer':esc(G.P[pi].name)+', à toi'}</div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1200);sfx('turn');}
function floatOver(id,txt){if(IS_NODE||G.fast)return;setTimeout(()=>{const el=document.getElementById(id+'-1');if(!el)return;const r=el.getBoundingClientRect();const d=document.createElement('div');d.className='float';d.textContent=txt;d.style.left=(r.left+r.width/2)+'px';d.style.top=r.top+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1700);},60);}
let AC=null,MUTED=false;try{MUTED=localStorage.getItem('pb-mute')==='1';}catch(e){}
function ac(){if(IS_NODE)return null;if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
function tn(a,t,f,d,type,v,f1){const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function sfx(n){if(IS_NODE||MUTED||(G&&G.fast))return;const a=ac();if(!a||a.state!=='running')return;const t=a.currentTime+.01;
  if(n==='flip')tn(a,t,1600,.08,'triangle',.08,900);if(n==='card')tn(a,t,700,.1,'triangle',.06,350);
  if(n==='col')[523,659,784,1046].forEach((f,k)=>tn(a,t+k*.08,f,.25,'sine',.1));
  if(n==='turn'){tn(a,t,523,.25,'sine',.06);tn(a,t+.08,784,.3,'sine',.05);}
  if(n==='alert'){tn(a,t,880,.2,'square',.05);tn(a,t+.22,880,.2,'square',.05);}
  if(n==='win')[523,659,784,1046,1318].forEach((f,k)=>tn(a,t+k*.12,f,.35,'triangle',.11));}

if(!IS_NODE){
document.addEventListener('click',e=>{
  if(!MUTED)ac();
  if(e.target.id==='modal'){closeModal(false);return;}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;const inp=myIn();
  if(NETON()&&NET.guest&&inp&&['slot','deck','disc','btn'].includes(a)){ let val=null; if(a==='slot'){ const[pi,i]=v.split('-').map(Number); if(pi===inp.pi&&inp.slots&&inp.slots.includes(i)) val={slot:i}; } else if(a==='deck'&&inp.piles) val={pile:'deck'}; else if(a==='disc'&&inp.piles&&G.disc.length) val={pile:'disc'}; else if(a==='btn'&&inp.btns) val={btn:v}; if(val){ G.input=null; render(); NET.act('in',[NET.seat,val]); } return; }
  switch(a){
    case 'slot':{if(!inp||!inp.slots)return;const[pi,i]=v.split('-').map(Number);if(pi!==inp.pi||!inp.slots.includes(i))return;inputResolve({slot:i});break;}
    case 'deck':if(inp&&inp.piles)inputResolve({pile:'deck'});break;
    case 'disc':if(inp&&inp.piles&&G.disc.length)inputResolve({pile:'disc'});break;
    case 'btn':if(inp&&inp.btns)inputResolve({btn:v});break;
    case 'next':if(NET.guest)break;if(inputResolve)inputResolve();break;
    case 'close':closeModal(false);break;
    case 'help':showHelp();break;
    case 'ff':FF=!FF;try{localStorage.setItem('salle-ff',FF?'1':'0');}catch(e){}render();break;
    case 'sound':MUTED=!MUTED;try{localStorage.setItem('pb-mute',MUTED?'1':'0');}catch(e){}render();break;
    case 'menu':if(NET.onNew&&NET.onNew())break;GEN++;inputResolve=null;closeModal(true);G=null;render();scrollTo(0,0);break;
    case 'n':MENU.n=Math.max(2,Math.min(8,MENU.n+(+v)));MENU.humans=Math.min(MENU.humans,MENU.n);render();break;
    case 'h':MENU.humans=Math.max(1,Math.min(MENU.n,MENU.humans+(+v)));render();break;
    case 'level':MENU.level=v;render();break;
    case 'ext':MENU.ext=!MENU.ext;render();break;
    case 'target':MENU.target=+v;render();break;
    case 'start':try{localStorage.removeItem(SAVE_KEY);}catch(e){}newGame(MENU);scrollTo(0,0);break;
    case 'again':{if(NETON()){ if(NET.host){closeModal(true);NET.restart();} break; }const o={n:G.P.length,humans:G.P.filter(p=>!p.ai).length,level:G.level,ext:G.ext,target:G.target};newGame(o);scrollTo(0,0);break;}
    case 'resume':{const d=loadSave();if(d)resumeGame(d);break;}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal(false);});
let ENDSHOWN=false;
window.PBAS={get G(){return G;}};
window.NETGAME={id:'plus-bas',title:'Plus Bas',min:2,max:8,btnHost:'.top .hrow',
  rules(){ return `<label class="opt"><input type="checkbox" data-o="ext" ${MENU.ext?'checked':''}><span><b>Extension</b> : cartes spéciales</span></label><h4>Fin de partie</h4><div class="seg">${[50,100].map(v=>`<button class="${MENU.target===v?'on':''}" data-m="t:${v}">${v} points</button>`).join('')}</div>`; },
  rulesClick(e){ const x=e.target.closest('[data-o],[data-m^="t:"]'); if(!x) return false; if(x.dataset.m) MENU.target=+x.dataset.m.split(':')[1]; else MENU.ext=document.querySelector('#hall-box [data-o=ext]').checked; return true; },
  start(list){ GEN++; inputResolve=null; ENDSHOWN=false; closeModal(true); G={P:list.map(x=>({name:x.name,cid:x.cid||null,ai:!!x.ai,level:x.level,total:0,hist:[],grid:[],peek:{}})),level:list.find(x=>x.ai)?list.find(x=>x.ai).level:MENU.level,ext:MENU.ext,target:MENU.target,fast:false,round:0,deck:[],disc:[],cur:0,log:[],over:null,hand:null,input:null,net:true};
    NET.push(null,'new'); runGame().catch(e=>{ if(e!=='abort') console.error(e); }); scrollTo(0,0); },
  state:()=>G, busy:()=>false, resume(){ aiIn(); },
  act(seat,fn,args){ const c=G&&G.input; if(fn!=='in'||!c||c.pi!==seat||args[0]!==seat||!inputResolve) return false; const v=args[1]||{};
    if(v.slot!=null){ if(!(c.slots&&c.slots.includes(+v.slot))) return false; inputResolve({slot:+v.slot}); return true; }
    if(v.pile){ if(!c.piles||(v.pile==='disc'&&!G.disc.length)) return false; inputResolve({pile:v.pile==='disc'?'disc':'deck'}); return true; }
    if(v.btn){ if(!(c.btns&&c.btns.some(b=>b[0]===v.btn))) return false; inputResolve({btn:v.btn}); return true; } return false; },
  async receive(m){ if(m.kind==='lobby'){ GEN++; G=null; render(); return; }
    if(m.kind==='new'){ ENDSHOWN=false; closeModal(true); }
    const wasRm=G&&G.rm; G=m.G; render();
    if(G.rm&&!wasRm) roundModal(G.rm.sums,G.rm.scored); else if(!G.rm&&wasRm&&!G.over) closeModal(true);
    if(G.over&&!ENDSHOWN){ ENDSHOWN=true; closeModal(true); showEnd(); } },
  menuLocal(){ G=null; render(); },
  leave(){ GEN++; inputResolve=null; G=null; render(); } };
render();
}
if(IS_NODE)module.exports={newGame,get G(){return G}};
